---
apiVersion: apps/v1
{{- if .Values.stateful.enabled }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  labels:
    {{- include "spiceai.labels" . | indent 4 }}
    app: {{ .Release.Name }}
  name: {{ template "spiceai.fullname" .  }}
  namespace: {{ template "spiceai.namespace" . }}
spec:
  {{- if .Values.replicaCount }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- if .Values.stateful.enabled }}
  serviceName: {{ template "spiceai.fullname" .  }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spiceai.selectorLabels" . | indent 6 }}
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "spiceai.labels" . | indent 8 }}
        app: {{ .Release.Name }}
      annotations:
        checksum/spicepod: {{ toYaml .Values.spicepod | sha256sum }}
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "spiceai.serviceAccountName" . }}
      {{- end }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: spiceai
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: Always
          workingDir: /app
          {{- if .Values.command }}
          command: {{ toYaml .Values.command | nindent 12 }}
          {{- else }}
          command:
            [
              "/usr/local/bin/spiced",
              "--http",
              "0.0.0.0:8090",
              "--metrics",
              "0.0.0.0:9090",
              "--flight",
              "0.0.0.0:50051"
            ]
          {{- end }}
          env:
            {{- if (((.Values.resources).requests).cpu) }}
            # Size spiced's thread pools, query fan-out, and accelerator
            # concurrency for the CPU this pod requested. Without this, a pod
            # with a CPU request and no CPU limit has no cgroup quota, so the
            # runtime detects — and sizes for — the whole node.
            #
            # Guarded on the request being set: `resourceFieldRef` against an
            # unset request falls back to node allocatable, which is exactly the
            # over-sizing this avoids. `divisor: 1m` yields millicores; without
            # a divisor Kubernetes rounds up to whole cores.
            #
            # The parenthesised `(((.Values.resources).requests).cpu)` is Helm's
            # nil-safe deep access (Helm 3+, which `apiVersion: v2` already
            # requires): each step yields nil rather than erroring when the map
            # above it is absent. `resources` is commented out in values.yaml by
            # default, so that path is the common one, not an edge case.
            - name: SPICE_CPU_CORES
              valueFrom:
                resourceFieldRef:
                  containerName: spiceai
                  resource: requests.cpu
                  divisor: 1m
            {{- end }}
            {{- if .Values.additionalEnv }}
            {{- .Values.additionalEnv | toYaml | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 8090
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 50051
              name: flight
          livenessProbe:
            {{- include "spiceai.probe" (dict "probe" .Values.livenessProbe "path" "/health" "port" 8090) | nindent 12 }}
          readinessProbe:
            {{- include "spiceai.probe" (dict "probe" .Values.readinessProbe "path" "/v1/ready" "port" 8090) | nindent 12 }}
          startupProbe:
            {{- include "spiceai.probe" (dict "probe" .Values.startupProbe "path" "/health" "port" 8090) | nindent 12 }}
          volumeMounts:
            {{- if .Values.volumeMounts }}
            {{- .Values.volumeMounts | toYaml | nindent 12 }}
            {{- end }}
            - name: spiceai-config-volume
              mountPath: /app/spicepod.yaml
              subPath: spicepod.yaml
            {{- if .Values.stateful.enabled }}
            - name: {{ .Release.Name }}-data
              mountPath: {{ .Values.stateful.mountPath }}
            {{- end }}
          {{- if .Values.resources }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      volumes:
        {{- if .Values.volumes }}
        {{- .Values.volumes | toYaml | nindent 8 }}
        {{- end }}
        - name: spiceai-config-volume
          configMap:
            name: {{ template "spiceai.fullname" .  }}-spicepod
  {{- if .Values.stateful.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Release.Name }}-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.stateful.storageClass }}
        storageClassName: {{ .Values.stateful.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.stateful.size }}
  {{- end }}