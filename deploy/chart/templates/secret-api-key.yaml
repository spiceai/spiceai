{{- if and (eq (include "spiceai.authMode" .) "api_key") (not .Values.auth.apiKey.existingSecret) }}
{{- $name := include "spiceai.apiKeySecretName" . }}
{{- $namespace := include "spiceai.namespace" . }}
{{- $existing := lookup "v1" "Secret" $namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "api-key") }}
{{- /* Reuse the key across upgrades. */}}
{{- $key = index $existing.data "api-key" }}
{{- else if include "spiceai.clusterReadable" . }}
{{- $key = randAlphaNum 32 | b64enc }}
{{- else }}
{{- fail "Spice requires an API key, and this render cannot read the cluster to reuse one (helm template, Argo CD). Create a Secret with an `api-key` entry and set auth.apiKey.existingSecret, or render with --dry-run=server. See https://spiceai.org/docs/deployment/kubernetes#authentication" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "spiceai.labels" . | indent 4 }}
    app: {{ .Release.Name }}
  name: {{ $name }}
  namespace: {{ $namespace }}
  annotations:
    # Kept on uninstall, so a reinstall reuses the key its clients hold.
    helm.sh/resource-policy: keep
type: Opaque
data:
  api-key: {{ $key }}
{{- end }}
