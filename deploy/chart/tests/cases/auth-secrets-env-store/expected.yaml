apiVersion: v1
kind: ConfigMap
metadata:
  labels:    
    helm.sh/chart: VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: spiceai
    app.kubernetes.io/name: spiceai
    app.kubernetes.io/instance: spiceai
    app.kubernetes.io/version: VERSION
    app: spiceai
  name: spiceai-spicepod
  namespace: spice
data:
  spicepod.yaml: |
    datasets: []
    kind: Spicepod
    name: app
    runtime:
      auth:
        api-key:
          enabled: true
          keys:
          - ${ project_env:SPICE_API_KEY }:rw
    secrets:
    - from: env
      name: project_env
    version: v1
