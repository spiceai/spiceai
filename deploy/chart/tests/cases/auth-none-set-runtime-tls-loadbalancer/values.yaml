auth:
  mode: none
service:
  type: LoadBalancer
command:
  - /usr/local/bin/spiced
  - --http
  - 0.0.0.0:8090
  - --flight
  - 0.0.0.0:50051
  - --set-runtime=tls.client_auth_mode=request
spicepod:
  name: app
  version: v1
  kind: Spicepod
  runtime:
    tls:
      enabled: true
      certificate_file: /etc/spice/tls/tls.crt
      key_file: /etc/spice/tls/tls.key
      client_auth_ca_file: /etc/spice/tls/ca.crt
      client_auth_mode: required
  datasets: []
