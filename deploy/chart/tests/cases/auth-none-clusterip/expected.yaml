apiVersion: v1
kind: ConfigMap
metadata:
  labels:    
    helm.sh/chart: VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: spiceai
    app.kubernetes.io/name: spiceai
    app.kubernetes.io/instance: spiceai
    app.kubernetes.io/version: VERSION
    app: spiceai
  name: spiceai-spicepod
  namespace: spice
data:
  spicepod.yaml: |
    datasets: []
    kind: Spicepod
    name: app
    runtime:
      allowed_hosts:
      - spice.corp.example
      - spiceai
      - spiceai.spice
      - spiceai.spice.svc
      - spiceai.spice.svc.cluster.local
    version: v1
---
# Source: spiceai/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:    
    helm.sh/chart: VERSION
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: spiceai
    app.kubernetes.io/name: spiceai
    app.kubernetes.io/instance: spiceai
    app.kubernetes.io/version: VERSION
    app: spiceai
  name: spiceai
  namespace: spice
spec:
  replicas: 1
  selector:
    matchLabels:      
      app.kubernetes.io/name: spiceai
      app.kubernetes.io/instance: spiceai
      app: spiceai
  template:
    metadata:
      labels:        
        helm.sh/chart: VERSION
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: spiceai
        app.kubernetes.io/name: spiceai
        app.kubernetes.io/instance: spiceai
        app.kubernetes.io/version: VERSION
        app: spiceai
      annotations:
        checksum/spicepod: 53d64b9487cca0a169e36e6703b2c6fd238d6ee0fe86d936376c351b2167a20c
    spec:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: spiceai
          image: ghcr.io/spiceai/spiceai-nightly:latest-models
          imagePullPolicy: Always
          workingDir: /app
          command:
            [
              "/usr/local/bin/spiced",
              "--http",
              "0.0.0.0:8090",
              "--metrics",
              "0.0.0.0:9090",
              "--flight",
              "0.0.0.0:50051"
            ]
          env:
          ports:
            - containerPort: 8090
              name: http
            - containerPort: 9090
              name: metrics
            - containerPort: 50051
              name: flight
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /v1/ready
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 1
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: 8090
            periodSeconds: 10
            timeoutSeconds: 1
          volumeMounts:
            - name: spiceai-config-volume
              mountPath: /app/spicepod.yaml
              subPath: spicepod.yaml
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
      volumes:
        - name: spiceai-config-volume
          configMap:
            name: spiceai-spicepod
---
