# Explicitly set the resolver to version 2, which is the default for packages with edition >= 2021
# https://doc.rust-lang.org/edition-guide/rust-2021/default-cargo-resolver.html
resolver = "2"

[workspace.package]
edition = "2024"
exclude = [".github/"]
homepage = "https://spice.ai"
license-file = "LICENSE"
publish = false
repository = "https://github.com/spiceai/spiceai"
rust-version = "1.96.1"
version = "2.2.0-unstable"

# Clippy lint levels for the workspace. Each member crate opts in with
# `[lints]\nworkspace = true` so scoped `cargo clippy -p <crate>` and rust-analyzer
# surface the same violations as the `make lint-rust` CI gate, at edit time.
# `make lint-rust` re-applies these flags over `--workspace` as a backstop for any
# crate that forgets to opt in. NOTE: `-Dwarnings` intentionally stays in the
# Makefile only — denying it here would also fail ordinary `cargo build`/`check`.
# Test-context exemptions (allow-expect-in-tests, thresholds) live in `clippy.toml`.
[workspace.lints.rust]
# `tokio_unstable` is enabled via `RUSTFLAGS="--cfg tokio_unstable"` to expose the
# per-worker tokio RuntimeMetrics (busy/park/steal). `cayenne_loom` is enabled the
# same way (`RUSTFLAGS="--cfg cayenne_loom"`) to swap std atomics for loom's
# model-checked ones in cayenne's `StructuralVersion` seqlock model tests. Declare
# both so the otherwise-unknown cfg names don't trip the `unexpected_cfgs` lint on
# builds without the flag. Declared workspace-wide (via each crate's
# `lints.workspace = true`) rather than per-crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)', 'cfg(cayenne_loom)'] }

[workspace.lints.clippy]
# Deny the pedantic group with a lower priority so the specific opt-outs below win.
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
clone_on_ref_ptr = "deny"
equatable_if_let = "deny"
needless_collect = "deny"
redundant_clone = "deny"
todo = "deny"
assertions_on_result_states = "deny"
allow_attributes = "deny"
# The list of forbidden methods lives in `clippy.toml` (a clippy config, not a
# lint level). Denying the lint here is what makes a direct CPU-detection call
# fail a scoped `cargo clippy -p <crate>` and show up in rust-analyzer, rather
# than only under the `-Dwarnings` CI gate.
disallowed_methods = "deny"
# Pedantic members we opt out of (priority 0 overrides the group deny above).
module_name_repetitions = "allow"
large_futures = "allow"
too_many_lines = "allow"

