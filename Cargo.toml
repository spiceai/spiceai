# resolved graph. datafusion-table-providers' own Cargo.toml already has a
# `[patch."https://github.com/spiceai/duckdb-rs.git"]` pointing at this same
# local checkout, but it's inert from here, which is why `cargo tree -d`
# still showed two copies of duckdb (this rev's local path, and the old
# 76655d2f git rev) until this section was added. Mirrors the crates.io
# duckdb patch above; both must move together.
#
# NOTE: this table must stay the LAST thing in the file (or otherwise be
# followed by nothing meant for [patch.crates-io]) - TOML tables run until
# the next `[header]`, so anything placed after this line would silently
# apply here instead of to crates-io. (Learned the hard way: an earlier
# version of this edit inserted this table in the middle of
# [patch.crates-io], which silently reassigned every entry below it -
# iceberg-*, arrow-*, vortex-*, spiceai, ballista - to this table instead,
# and cargo fell back to unpatched crates.io releases for all of them.)
