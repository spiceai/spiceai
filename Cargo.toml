# Specification and proof vocabulary for every crate that opts into
# `[package.metadata.verus]`. A normal `cargo build` erases the specifications,
# so it carries no runtime cost. Pinned to the Verus release CI runs: the
# verifier and `vstd` ship together, so this moves with `VERUS_VSTD_VERSION` in
# `.github/workflows/verus_verify.yml`.
