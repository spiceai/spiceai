[profile.release-lto]
inherits = "release"
lto = true

# Production-like profile with debug symbols for crash investigation
[profile.release-debug]
inherits = "release"
panic = "abort"           # Abort on panic (cleaner crash, prevents undefined behavior from double-panic)
debug = 1                 # DWARF symbols for readable stack traces
strip = "none"            # Ensure symbols not stripped
incremental = false       # Deterministic builds
lto = "thin"              # Keep prod-like LTO (thin is fast + optimized)

# Faithful-to-release profiling build: identical codegen to `release` (no LTO or
# panic override, unlike `release-debug`), so sampled hotspots match the binary we
# actually benchmark. Debug info is emitted to a split sidecar (.dSYM on macOS,
# .dwp on Linux) so the shipped binary stays lean; ship the sidecar alongside the
# binary and a sampling profiler (samply/perf) resolves line & inline frames.
[profile.release-profiling]
inherits = "release"
debug = 1                 # function + line + inline-frame info
strip = "none"            # keep the symbol table in the binary too
split-debuginfo = "packed"

[profile.lint]
debug = "line-tables-only"
# Deliberate: the two halves of the lint-profile gate want opposite things.
# A local `make signoff` (or `RUST_PROFILE=lint make lint-rust`) reuses its own
# target directory, where incremental compilation is the larger win. Plain
# `make lint-rust` still selects `dev`. The CI gates that actually use this
# profile (`pr.yml`, `pr-develop.yml`, and `signoff.yml` via `scripts/signoff`)
# set `CARGO_INCREMENTAL=0`, which takes precedence over this field, so those
# remote runs fall back to sccache — which cannot cache an incremental
# compilation. Turning this off to "let sccache work" therefore buys nothing
# on those gates (already overridden) and costs the local sign-off its
# incremental reuse.
incremental = true
inherits = "dev"
lto = "off"

[patch.crates-io]
# The ADBC Rust binding serializes `AdbcStatementCancel` behind the statement
# call it exists to interrupt, so a cancel cannot reach a running query. Spice
# needs it to, or an abandoned query holds its pooled connection until the
# remote query finishes on its own.
