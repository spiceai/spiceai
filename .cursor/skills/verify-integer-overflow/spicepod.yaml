version: v1
kind: Spicepod
name: integer-overflow
datasets:
  - from: file:data/overflow.parquet
    name: t_fed
  - from: file:data/overflow.parquet
    name: t_arrow
    acceleration:
      enabled: true
      engine: arrow
  - from: file:data/overflow.parquet
    name: t_cayenne
    acceleration:
      enabled: true
      engine: cayenne
      mode: memory
  - from: file:data/cancel.parquet
    name: t_cancel_fed
  - from: file:data/cancel.parquet
    name: t_cancel_arrow
    acceleration:
      enabled: true
      engine: arrow
  - from: file:data/cancel.parquet
    name: t_cancel_cayenne
    acceleration:
      enabled: true
      engine: cayenne
      mode: memory
  - from: file:data/ovf.parquet
    name: t_ovf_fed
  - from: file:data/ovf.parquet
    name: t_ovf_arrow
    acceleration:
      enabled: true
      engine: arrow
  - from: file:data/ovf.parquet
    name: t_ovf_cayenne
    acceleration:
      enabled: true
      engine: cayenne
      mode: memory
