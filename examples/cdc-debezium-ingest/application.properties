# Debezium Server → Spice (no Kafka)
#
# Run Debezium Server with this config so any Debezium source plugin streams
# change events directly into Spice's CDC ingest endpoint.
#
# Prerequisite: spiced running with examples/cdc-debezium-ingest/spicepod.yaml
#   spice run --path examples/cdc-debezium-ingest
#
# Then point Debezium Server at this file (DEBEZIUM_ conf overrides work too).

# ── Sink: Spice HTTP CDC ingest ─────────────────────────────────────────────
debezium.sink.type=http
debezium.sink.http.url=http://127.0.0.1:8090/v1/datasets/orders/cdc
debezium.sink.http.headers.Content-Type=application/json
# If using API-key auth on spiced:
# debezium.sink.http.headers.X-API-Key=${SPICE_API_KEY}

# ── Source: swap for any Debezium connector ─────────────────────────────────
# Example: PostgreSQL (for Oracle/SQL Server use the matching connector class)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=5000
debezium.source.database.hostname=localhost
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=app
debezium.source.topic.prefix=dbserver
debezium.source.table.include.list=public.orders
debezium.source.plugin.name=pgoutput

# JSON without embedded schemas (Spice uses declared dataset columns)
debezium.source.key.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter.schemas.enable=false

# For Avro + Schema Registry instead:
# debezium.format.key=avro
# debezium.format.value=avro
# debezium.sink.http.headers.Content-Type=application/vnd.debezium+avro
# And on the Spice dataset: params.schema_registry_url=http://schema-registry:8081
