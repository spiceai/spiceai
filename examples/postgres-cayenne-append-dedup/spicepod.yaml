version: v1
kind: Spicepod
name: postgres-cayenne-append-dedup

datasets:
  - from: postgres:public.append_events
    name: append_events
    params:
      pg_host: localhost
      pg_port: 55432
      pg_db: spice
      pg_user: spice
      pg_pass: spice
      pg_sslmode: disable
    time_column: event_timestamp
    time_format: timestamptz
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      primary_key: id
      on_conflict:
        id: upsert
      refresh_mode: append
      refresh_check_interval: 5s
