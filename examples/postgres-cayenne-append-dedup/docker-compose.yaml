services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spice
      POSTGRES_USER: spice
      POSTGRES_PASSWORD: spice
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spice -d spice"]
      interval: 2s
      timeout: 2s
      retries: 10

  generator:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: spice
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          psql -h postgres -U spice -d spice -c "INSERT INTO append_events (event_timestamp, message, score) VALUES (clock_timestamp(), 'generated event', 1.5);"
          sleep 5
        done
