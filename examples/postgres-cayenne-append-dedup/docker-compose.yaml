services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spice
      POSTGRES_USER: spice
      POSTGRES_PASSWORD: spice
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spice -d spice"]
      interval: 2s
      timeout: 2s
      retries: 10
