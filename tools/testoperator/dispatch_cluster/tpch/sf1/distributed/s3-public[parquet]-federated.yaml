tests:
  bench:
    # Disabled: SF1 Ballista is dominated by scheduling/shuffle overhead.
    # Use tpch/sf100/distributed/s3-public[parquet]-federated.yaml instead.
    enabled: false
    spicepod_path: federated/s3-public[parquet].yaml
    query_set: tpch
    query_transport: v1-queries
    # Use PVC-backed local disk for Ballista shuffle instead of S3 to compare
    # local-shuffle performance. app/executor storage sizes provision /data.
    shuffle_location: /data/ballista-shuffle/{github_run_id}/{github_run_attempt}
    query_temp_directory: /data
    app_storage_size_gb: 50
    executor_storage_size_gb: 100
    ephemeral_storage_limit: 1Gi
    runner_type: spiceai-dev-runners
    validate_results: false
