[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "testoperator"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow.workspace = true
arrow-json.workspace = true
arrow_tools = { path = "../../crates/arrow_tools" }
async-trait.workspace = true
# Serves testoperator's own /health and /v1/ready (see `src/probe.rs`) — the same
# router the runtime uses for the same two paths.
axum.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-dynamodb.workspace = true
bollard = "0.18.1"
chbench-driver = { path = "../chbench-driver" }
clap.workspace = true
datafusion.workspace = true
duckdb-oracle = { path = "../../crates/duckdb-oracle" }
flight_client = { path = "../../crates/flight_client" }
futures.workspace = true
itertools.workspace = true
insta.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml = { path = "../../crates/yaml" }
spiceai.workspace = true
spicepod = { path = "../../crates/spicepod", default-features = false }
system-adapter-protocol.workspace = true
test-framework = { path = "../../crates/test-framework" }
rand.workspace = true
# `net`: the TcpListener the liveness endpoints bind (the workspace default set
# has no networking).
tokio = { workspace = true, features = ["fs", "net"] }
tokio-postgres = { workspace = true }
tokio-util.workspace = true
url.workspace = true
uuid.workspace = true

# The scenario runner signals and inspects processes with Unix-only APIs.
[target.'cfg(unix)'.dependencies]
spicescript = { path = "../spicescript" }

[features]
default = ["append"]
append = ["test-framework/file_append"]

[lints]
workspace = true
