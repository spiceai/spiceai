tests:
  bench:
    spicepod_path: s3[parquet]-pepper[file]_view_with_partitioning.yaml
    query_set: saffron[parameterized]
    query_overrides: saffron-views
    ready_wait: 300
    runner_type: spicehq-dev-runners
  load:
    spicepod_path: s3[parquet]-pepper[file]_view_with_partitioning.yaml
    query_set: saffron[parameterized]
    query_overrides: saffron-views
    ready_wait: 300
    runner_type: spicehq-dev-runners
    concurrency: 128
    duration: 1800
