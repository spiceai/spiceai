    ready_wait: 300
    runner_type: spicehq-dev-runners
  load:
    spicepod_path: s3[parquet]-duckdb[file]_indexes.yaml
    query_set: saffron[parameterized]
    ready_wait: 300
    runner_type: spicehq-dev-large-runners
    concurrency: 128
    duration: 1800
