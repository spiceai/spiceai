tests:
  bench:
    spicepod_path: s3[parquet]-cayenne[file]_partitioning.yaml
    query_set: saffron[parameterized]
    ready_wait: 300
    validate_results: true
    runner_type: spicehq-dev-runners
  load:
    - spicepod_path: s3[parquet]-cayenne[file]_partitioning.yaml
      query_set: saffron[parameterized]
      runner_type: spicehq-dev-runners
      concurrency: 128
      duration: 900
    - spicepod_path: s3[parquet]-cayenne[file]_partitioning.yaml
      query_set: saffron[parameterized]
      runner_type: spicehq-dev-runners
      concurrency: 128
      duration: 900
      http_clients: true
