tests:
  htap:
    spicepod_path: accelerated/mysql-cayenne[file]-fts.yaml
    runner_type: spiceai-dev-large-runners
    scale_factor: 1
    duration: 900
    ready_wait: 60
    # Full-text index maintenance on customer.c_data is the tightest apply-path
    # bottleneck (a single-writer index that commits once per source envelope),
    # so at the unthrottled rate the customer replication lag cannot drain and
    # the data-correctness gate times out. Throttle OLTP so the FTS apply keeps
    # pace and replication converges; raise once FTS apply throughput improves.
    rate: 50
