# chbench/sf1/postgres-duckdb[file].yaml with secondary indexes, an
# on-refresh sort and time columns, checked against the PostgreSQL source.
# DuckDB has no clustering or partitioning.
schedule: weekly
tests:
  htap:
    spicepod_path: accelerated/postgres-duckdb[file].yaml
    runner_type: spiceai-dev-large-runners
    scale_factor: 1
    duration: 1800
    ready_wait: 60
    query_overrides: duckdb
    rate: 9250
    layouts:
      - indexes,sort,time_column
