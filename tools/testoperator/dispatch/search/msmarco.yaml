tests:
  # The workflow downloads the 1.7 GB of files before spiced starts (see
  # test/spicepods/search/mteb/msmarco/data-files.tsv). spiced still has to embed and index 8.8
  # million passages before it is ready, so allow 1 hour.
  search:
    - spicepod_path: test/spicepods/search/mteb/msmarco/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
    - spicepod_path: test/spicepods/search/mteb/msmarco/hf[all-minilm-l6-v2]-arrow.yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
    - spicepod_path: test/spicepods/search/mteb/msmarco/hybrid[model2vec[potion-multilingual-128M]]-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
    - spicepod_path: test/spicepods/search/mteb/msmarco/model2vec[potion-multilingual-128M]-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
    - spicepod_path: test/spicepods/search/mteb/msmarco/model2vec[potion-multilingual-128M]-s3_vectors.yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
