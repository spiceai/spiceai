# Full-text search latency benchmarks. See "Latency benchmarks" in test/spicepods/search/README.md.
#
# MS MARCO: 6,980 dev queries. 2 measured passes give 13,960 samples, enough for P99.9.
# search-benchmark-game: about 300 queries per query type. 35 measured passes give about 10,500
# samples per type, enough for P99.9 per type.
tests:
  search:
    - spicepod_path: test/spicepods/search/perf/msmarco/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      warmup_passes: 1
      passes: 2
    - spicepod_path: test/spicepods/search/perf/msmarco/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 8
      warmup_passes: 1
      passes: 2
    - spicepod_path: test/spicepods/search/perf/msmarco/full_text_search-duckdb[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      warmup_passes: 1
      passes: 2
    - spicepod_path: test/spicepods/search/perf/msmarco/full_text_search-duckdb[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 8
      warmup_passes: 1
      passes: 2
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      warmup_passes: 2
      passes: 35
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      limit: 100
      warmup_passes: 2
      passes: 35
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-cayenne[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 8
      warmup_passes: 2
      passes: 35
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-duckdb[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      warmup_passes: 2
      passes: 35
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-duckdb[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 1
      limit: 100
      warmup_passes: 2
      passes: 35
    - spicepod_path: test/spicepods/search/perf/search_benchmark_game/full_text_search-duckdb[file].yaml
      runner_type: spiceai-dev-runners
      ready_wait: 3600
      concurrency: 8
      warmup_passes: 2
      passes: 35
