# Validates query results over data loaded from Spice Cloud into DuckDB, a load
# no other automated test makes. Weekly and bench only: the DuckDB accelerator
# itself is benchmarked from file[parquet].
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/spicecloud-duckdb[file].yaml
    query_set: tpcds
    query_overrides: duckdb
    runner_type: spiceai-dev-runners
    ready_wait: 300
    validate_results: true
