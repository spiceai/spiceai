tests:
  bench:
    spicepod_path: accelerated/s3[parquet]-arrow.yaml
    query_set: clickbench
    runner_type: spiceai-dev-large-runners
    ready_wait: 1800
    # This arm's acceleration holds only part of the source, because a runner
    # cannot hold all of ClickBench: its `refresh_sql` ends in `LIMIT 50000000`.
    # The `__test_reference.*` clone drops acceleration and reads every row, so it
    # answers a different question: an arrow arm holding 100,000 of 1,000,000 rows
    # failed 37 of 43 queries, starting with `COUNT(*)`. A `LIMIT` subset also keeps
    # unspecified rows, so no reference could be built for it.
    validate_results: false