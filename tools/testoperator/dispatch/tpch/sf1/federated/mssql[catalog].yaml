tests:
  bench:
    spicepod_path: federated/mssql[catalog].yaml
    query_set: tpch
    query_overrides: mssql-catalog
    runner_type: spiceai-dev-runners
    # The SQL Server TPC-H tables hold different text columns than the parquet the
    # TPC-H answer files were computed from: customer 57040's address is
    # 'Eioyzjf4pp' there and 'nICtsILWBB' in the parquet. Q2, Q10, Q13 and Q20
    # cannot match the answer files, so this arm has no oracle.
    validate_results: false
  schema:
    spicepod_path: federated/mssql[catalog].yaml
    runner_type: spiceai-dev-runners
    min_tables: 1
