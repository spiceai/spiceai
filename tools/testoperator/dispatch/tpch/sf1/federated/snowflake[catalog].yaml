# Snowflake bills per use, so this runs on the weekly schedule instead of daily.
schedule: weekly
tests:
  bench:
    spicepod_path: federated/snowflake[catalog].yaml
    query_set: tpch
    query_overrides: snowflake-catalog
    runner_type: spiceai-dev-runners
    # The Snowflake TPC-H tables hold DuckDB 1.x data, whose free-text columns
    # differ from dbgen's, so Q2, Q10, Q13 and Q20 cannot match the answer files.
    # Validate again once the source holds dbgen (or DuckDB 2.0) data.
    validate_results: false
  schema:
    spicepod_path: federated/snowflake[catalog].yaml
    runner_type: spiceai-dev-runners
    min_tables: 1
