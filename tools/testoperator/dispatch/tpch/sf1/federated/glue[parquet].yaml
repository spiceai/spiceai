# Every query reads the Glue tables' files from S3 over the internet, which AWS
# bills per GB, so only a dispatch with `--schedule manual` runs this.
schedule: manual
tests:
  bench:
    spicepod_path: federated/glue[parquet].yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    # The Glue TPC-H tables hold DuckDB 1.x data, whose free-text columns
    # differ from dbgen's, so Q2, Q10, Q13 and Q20 cannot match the answer files.
    # Validate again once the source holds dbgen (or DuckDB 2.0) data.
    validate_results: false
