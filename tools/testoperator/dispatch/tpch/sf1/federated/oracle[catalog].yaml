# Oracle Cloud bills per use, so this runs on the weekly schedule instead of daily.
schedule: weekly
tests:
  bench:
    spicepod_path: federated/oracle[catalog].yaml
    query_set: tpch
    query_overrides: oracle-catalog
    runner_type: spiceai-dev-runners
    validate_results: true
  schema:
    spicepod_path: federated/oracle[catalog].yaml
    runner_type: spiceai-dev-runners
    min_tables: 1
