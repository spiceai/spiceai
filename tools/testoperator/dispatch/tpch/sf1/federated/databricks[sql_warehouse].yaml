# Databricks bills per use, so this runs on the weekly schedule instead of daily.
schedule: weekly
tests:
  bench:
    spicepod_path: federated/databricks[sql_warehouse].yaml
    query_set: tpch
    query_overrides: spark
    runner_type: spiceai-dev-runners
    ready_wait: 600
    # The Databricks TPC-H tables hold DuckDB 1.x data, whose free-text columns
    # differ from dbgen's, so Q2, Q10, Q13 and Q20 cannot match the answer files.
    # Validate again once the source holds dbgen (or DuckDB 2.0) data.
    validate_results: false
  throughput:
    spicepod_path: federated/databricks[sql_warehouse].yaml
    query_set: tpch
    query_overrides: spark
    runner_type: spiceai-dev-large-runners
  load:
    spicepod_path: federated/databricks[sql_warehouse].yaml
    query_set: tpch
    query_overrides: spark
    runner_type: spiceai-dev-large-runners
    duration: 28800
