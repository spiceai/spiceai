# Validates query results over data loaded from MySQL into Cayenne, which the
# integration tests check only by row count and two integer columns. Weekly and
# bench only: the Cayenne accelerator itself is benchmarked from file[parquet].
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/mysql-cayenne[file].yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    ready_wait: 600
    validate_results: true
