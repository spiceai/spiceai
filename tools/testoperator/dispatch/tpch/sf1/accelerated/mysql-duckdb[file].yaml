# Validates query results over data loaded from MySQL into DuckDB, which the
# integration tests check only by row count and two integer columns. Weekly and
# bench only: the DuckDB accelerator itself is benchmarked from file[parquet].
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/mysql-duckdb[file].yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    ready_wait: 600
    validate_results: true
