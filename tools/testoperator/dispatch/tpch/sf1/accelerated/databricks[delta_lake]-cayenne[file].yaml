# Validates query results over data loaded from Databricks into Cayenne, a load
# no other automated test makes. Weekly and bench only, as Databricks bills per
# use: the Cayenne accelerator itself is benchmarked from file[parquet].
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/databricks[delta_lake]-cayenne[file].yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    ready_wait: 600
    # The Databricks TPC-H tables hold DuckDB 1.x data, whose free-text columns
    # differ from dbgen's, so Q2, Q10, Q13 and Q20 cannot match the answer files.
    # Validate again once the source holds dbgen (or DuckDB 2.0) data.
    validate_results: false
