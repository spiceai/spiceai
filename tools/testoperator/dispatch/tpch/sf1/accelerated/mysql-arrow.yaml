# Validates query results over data loaded from MySQL into Arrow, which the
# integration tests check only by row count. Weekly and bench only: the Arrow
# accelerator itself is benchmarked from file[parquet].
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/mysql-arrow.yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    ready_wait: 600
    validate_results: true
