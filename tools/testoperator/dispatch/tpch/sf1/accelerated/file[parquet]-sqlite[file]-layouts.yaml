# file[parquet]-sqlite[file].yaml under acceleration layouts (see
# file[parquet]-cayenne[file]-layouts.yaml). The spicepod already declares
# indexes, and SQLite has no sort, clustering or partitioning.
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/file[parquet]-sqlite[file].yaml
    query_set: tpch
    runner_type: spiceai-dev-runners
    ready_wait: 600
    validate_results: true
    layouts:
      - primary_key
      - primary_key,time_column
