# file[parquet]-duckdb[memory].yaml under acceleration layouts (see
# file[parquet]-duckdb[file]-layouts.yaml).
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/file[parquet]-duckdb[memory].yaml
    ready_wait: 300
    query_set: tpch
    runner_type: spiceai-dev-runners
    validate_results: true
    layouts:
      - primary_key,indexes
      - primary_key,indexes,sort,time_column
