# file[parquet]-postgres.yaml under acceleration layouts (see
# file[parquet]-cayenne[file]-layouts.yaml). The spicepod already declares
# indexes, and the PostgreSQL accelerator has no sort, clustering or
# partitioning.
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/file[parquet]-postgres.yaml
    query_set: tpch
    query_overrides: postgresql
    runner_type: spiceai-dev-runners
    ready_wait: 600
    validate_results: true
    layouts:
      - primary_key,time_column
