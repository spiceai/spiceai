# file[parquet]-arrow.yaml under acceleration layouts (see
# file[parquet]-cayenne[file]-layouts.yaml). Arrow has no clustering.
schedule: weekly
tests:
  bench:
    spicepod_path: accelerated/file[parquet]-arrow.yaml
    ready_wait: 300
    query_set: tpch
    runner_type: spiceai-dev-runners
    validate_results: true
    layouts:
      - primary_key
      - indexes
      - sort
      - partition
      - primary_key,indexes,sort,time_column,partition
