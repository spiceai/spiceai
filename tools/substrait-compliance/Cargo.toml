[package]
description = "Substrait compliance harness: IBM suite Mode A (DataFusion) and Mode B (spiced over FlightSQL)"
edition.workspace = true
license-file.workspace = true
name = "spice-substrait-compliance"
publish = false
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow = { workspace = true }
arrow-flight = { workspace = true, features = ["flight-sql"] }
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
datafusion.workspace = true
datafusion-substrait.workspace = true
futures.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
snafu.workspace = true
tempfile.workspace = true
test-framework = { path = "../../crates/test-framework" }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread"] }
tonic.workspace = true
tpchgen.workspace = true
yaml = { path = "../../crates/yaml" }

[lints]
workspace = true
