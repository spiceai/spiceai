# yaml-language-server: $schema=../../../.schema/spicepod.schema.json
#
# Spicepod Schema Test: Secrets
# Tests secret store configurations
#
version: v1
kind: Spicepod
name: schema-test-secrets

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  # Kubernetes secret store
  - from: kubernetes:my_secret
    name: k8s
    params:
      # Optional: override the namespace from the service-account mount.
      namespace: spice

  # Environment variable secret store
  - from: env
    name: env
    params:
      file_path: .env.local

  # AWS Secrets Manager (if configured)
  - from: aws_secrets_manager:my-secret
    name: aws
    params:
      # Params may reference environment variables via `${ env:KEY }` or
      # `${ secrets:KEY }` (the latter resolves only against env at this
      # bootstrap point, since no other store is loaded yet).
      region: ${ env:AWS_REGION }
      # Optional: override the Secrets Manager endpoint URL (VPC endpoints,
      # FIPS endpoints, LocalStack).
      # endpoint_url: https://localhost:4566
      # Optional: static credentials. When omitted, the SDK's default
      # credential chain (env, shared config, web identity, ECS, IMDS) is
      # used. `key` and `secret` must be set together; `session_token` is
      # only meaningful alongside them.
      # key: ${ env:AWS_ACCESS_KEY_ID }
      # secret: ${ env:AWS_SECRET_ACCESS_KEY }
      # session_token: ${ env:AWS_SESSION_TOKEN }

  # GCP Secret Manager (if configured)
  # - from: gcp_secret_manager:projects/my-project/secrets/my-secret
  #   name: gcp

  # Azure Key Vault (if configured)
  # - from: azure_key_vault:https://my-vault.vault.azure.net/secrets/my-secret
  #   name: azure

  # Keyring secret store (if configured)
  # - from: keyring:my_service
  #   name: keyring