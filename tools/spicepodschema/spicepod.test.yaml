# =============================================================================
# DATA ACCELERATORS - Test different acceleration engines with runtime params
# =============================================================================

  # Arrow accelerator
  # Runtime params: file_watcher
  - name: accel_arrow
    from: postgres:public.small_table
    params:
      pg_host: localhost
      pg_port: "5432"
      pg_db: testdb
      pg_user: postgres
      pg_pass: secret
    acceleration:
      enabled: true
      engine: arrow
      refresh_mode: full
      params:
        file_watcher: "true"

  # DuckDB accelerator
  # Runtime params: file_watcher, partition_mode, connection_pool_size,
  #                 on_refresh_recompute_statistics, partitioned_write_buffer,
  #                 optimizer_duckdb_aggregate_pushdown
  - name: accel_duckdb
    from: postgres:public.medium_table
    params:
      pg_host: localhost
      pg_port: "5432"
      pg_db: testdb
      pg_user: postgres
      pg_pass: secret
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: full
      params:
        duckdb_file: ./data/accel.duckdb
        file_watcher: "true"
        partition_mode: auto
        connection_pool_size: "5"
        on_refresh_recompute_statistics: "true"
        partitioned_write_buffer: "1000"
        optimizer_duckdb_aggregate_pushdown: "true"

  # SQLite accelerator
  # Runtime params: busy_timeout, file_watcher
  - name: accel_sqlite
    from: postgres:public.another_table
    params:
      pg_host: localhost
      pg_port: "5432"
      pg_db: testdb
      pg_user: postgres
      pg_pass: secret
    acceleration:
      enabled: true
      engine: sqlite
      mode: file
      refresh_mode: full
      params:
        sqlite_file: ./data/accel.sqlite
        busy_timeout: "5000"
        file_watcher: "true"

  # PostgreSQL accelerator
  # Runtime params: file_watcher, connection_pool_size
  - name: accel_postgres
    from: duckdb:source.parquet
    params:
      duckdb_open: data/source.db
    acceleration:
      enabled: true
      engine: postgres
      refresh_mode: full
      params:
        pg_host: localhost
        pg_port: "5432"
        pg_db: accel_db
        pg_user: postgres
        pg_pass: secret
        pg_connection_pool_min_idle: "2"
        file_watcher: "false"
        connection_pool_size: "15"

  # Cayenne accelerator (if enabled)
  # Runtime params: file_watcher
  # - name: accel_cayenne
  #   from: postgres:public.large_table
  #   params:
  #     pg_host: localhost
  #     pg_port: "5432"
  #     pg_db: testdb
  #     pg_user: postgres
  #     pg_pass: secret
  #   acceleration:
  #     enabled: true
  #     engine: cayenne
  #     mode: file
  #     refresh_mode: full
  #     params:
  #       cayenne_file_path: ./data/accel.cayenne
  #       cayenne_metastore: sqlite
  #       file_watcher: "true"
  #       cayenne_footer_cache_mb: "256"

# =============================================================================
# CATALOG CONNECTORS
# =============================================================================
catalogs:
  # Databricks catalog
  # Runtime params: mode, client_timeout
  - name: databricks_catalog
    from: databricks:my_catalog
    params:
      databricks_endpoint: https://my-workspace.databricks.com
      databricks_token: dapi123
      databricks_mode: spark_connect
      databricks_client_timeout: "60s"

  # Unity Catalog
  - name: unity_catalog
    from: unity_catalog:another_catalog
    params:
      databricks_endpoint: https://unity.databricks.com
      databricks_token: dapi456

  # Iceberg catalog
  - name: iceberg_catalog
    from: iceberg:my_iceberg_catalog
    params:
      iceberg_catalog_type: rest
      iceberg_rest_uri: http://localhost:8181

  # Spice.ai catalog
  - name: spiceai_catalog
    from: spice.ai
    params:
      spiceai_api_key: my-api-key

# =============================================================================
# MODELS
# Runtime params vary by provider: endpoint, tools, system_prompt,
#                                  parameterized_prompt, chat_template,
#                                  model_type, aws_*, responses_api
# =============================================================================
models:
  # OpenAI model
  - name: openai_gpt4
    from: openai:gpt-4
    params:
      openai_api_key: sk-test
      tools: auto
      system_prompt: You are a helpful assistant.

  # Anthropic model
  # Runtime params: endpoint
  - name: anthropic_claude
    from: anthropic:claude-3-sonnet
    params:
      anthropic_api_key: sk-ant-test
      endpoint: https://api.anthropic.com
      tools: auto
      system_prompt: You are a helpful AI assistant.

  # Azure OpenAI model
  # Runtime params: endpoint, responses_api
  - name: azure_openai
    from: azure:gpt-4
    params:
      azure_api_key: azure-key
      azure_api_version: "2024-02-15-preview"
      azure_deployment_name: gpt4-deployment
      endpoint: https://myresource.openai.azure.com
      responses_api: disabled
      tools: auto

  # AWS Bedrock model
  # Runtime params: aws_access_key_id, aws_secret_access_key, aws_session_token, aws_region
  - name: bedrock_claude
    from: bedrock:anthropic.claude-3-sonnet-20240229-v1:0
    params:
      aws_access_key_id: AKIAIOSFODNN7EXAMPLE
      aws_secret_access_key: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      aws_region: us-east-1

  # Huggingface model (if enabled)
  # Runtime params: model_type
  # - name: hf_mistral
  #   from: huggingface:mistralai/Mistral-7B-Instruct-v0.2
  #   params:
  #     huggingface_token: hf_xxx
  #     model_type: mistral

  # File-based model (if enabled)
  # Runtime params: chat_template
  # - name: local_model
  #   from: file:models/my_model.gguf
  #   params:
  #     chat_template: chatml

# =============================================================================
# EMBEDDINGS
# =============================================================================
embeddings:
  - name: openai_embeddings
    from: openai:text-embedding-3-small
    params:
      openai_api_key: sk-test

  - name: azure_embeddings
    from: azure:text-embedding-ada-002
    params:
      azure_api_key: azure-key
      azure_api_version: "2024-02-15-preview"
      azure_deployment_name: ada-embedding
      endpoint: https://myresource.openai.azure.com

# =============================================================================
# VIEWS
# =============================================================================
views:
  - name: postgres_view
    sql: SELECT * FROM test_postgres WHERE id > 100

  - name: joined_view
    sql: |
      SELECT p.*, o.order_date
      FROM test_postgres p
      JOIN test_postgres_2 o ON p.id = o.user_id

  - name: aggregated_view
    sql: |
      SELECT
        date_trunc('day', created_at) as day,
        count(*) as total_count,
        sum(amount) as total_amount
      FROM test_postgres
      GROUP BY 1

# =============================================================================
# TOOLS
# =============================================================================
tools:
  - name: the_internet
    from: websearch
    description: "Search the web for information."
    params:
      engine: perplexity

  - name: list_datasets
    from: builtin:list_datasets

  - name: sql_tool
    from: builtin:sql

  - name: table_schema
    from: builtin:table_schema

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  - from: kubernetes:my_secret
    name: k8s
  - from: env
    name: env

# =============================================================================
# RUNTIME CONFIGURATION
# =============================================================================
runtime:
  caching:
    sql_results:
      enabled: true
      max_size: 1GiB # Default 128 MiB
      item_ttl: 1m # Default 1s
      stale_while_revalidate_ttl: 30s # Default 0s (disabled)
    search_results:
      enabled: true
      max_size: 1GiB # Default 128 MiB
      item_ttl: 1m # Default 1s
