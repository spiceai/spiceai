compute:
  scp:
    channel: ${SPIDAPTER_CHANNEL:-nightly}
    image_tag: ${SPIDAPTER_IMAGE_TAG:-}
    scheduler_state_location: ${SCHEDULER_STATE_LOCATION:-}
    organization_tag: ${SPIDAPTER_ORGANIZATION_TAG:-}
    resources:
      app_memory: ${SPIDAPTER_APP_MEMORY_LIMIT:-64Gi}
      ephemeral_storage_gb: ${SPIDAPTER_EPHEMERAL_STORAGE_LIMIT_GB:-}
acceleration: ${SPICE_ACCELERATION:-cayenne}
source:
  mongodb_streams:
    connect:
      uri: ${MONGODB_ATLAS_URI}
# Optional: deploy a full tuned/adaptive spicepod verbatim instead of generating one.
# Set MONGO_SPICEPOD_PATH to a scenarios/pods/mongo/*.yaml path (baked into the spidapter
# image). Empty/unset → generate the default pod (previous behaviour).
spicepod: ${MONGO_SPICEPOD_PATH:-}
