compute:
  scp:
    channel: ${SPIDAPTER_CHANNEL:-nightly}
    scheduler_state_location: ${SCHEDULER_STATE_LOCATION:-}
    organization_tag: ${SPIDAPTER_ORGANIZATION_TAG:-}
    resources:
      app_memory: ${SPIDAPTER_APP_MEMORY_LIMIT:-64Gi}
      ephemeral_storage_gb: ${SPIDAPTER_EPHEMERAL_STORAGE_LIMIT_GB:-}
acceleration: ${SPICE_ACCELERATION:-cayenne}
source:
  postgres_wal:
    provision:
      ec2:
        subnet_id: ${EC2_SUBNET_ID}
        security_group_id: ${EC2_SECURITY_GROUP_ID}
        ami_id: ${EC2_AMI_ID}
        instance_type: ${EC2_INSTANCE_TYPE:-m5.large}
        disk_size_gb: ${EC2_DISK_SIZE_GB:-100}
        associate_public_ip: true
        iam_instance_profile: ${EC2_IAM_INSTANCE_PROFILE:-}
