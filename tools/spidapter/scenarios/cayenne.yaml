compute:
  scp:
    channel: ${SPIDAPTER_CHANNEL:-nightly}
    image_tag: ${SPIDAPTER_IMAGE_TAG:-}
    scheduler_state_location: ${SCHEDULER_STATE_LOCATION:-}
    organization_tag: ${SPIDAPTER_ORGANIZATION_TAG:-}
    query_memory_limit: ${SPIDAPTER_QUERY_MEMORY_LIMIT:-}
    resources:
      app_memory: ${SPIDAPTER_APP_MEMORY_LIMIT:-62Gi}
      app_storage_size_gb: ${SPIDAPTER_APP_STORAGE_SIZE_GB:-~}
      executor_replicas: ${SPIDAPTER_EXECUTOR_REPLICAS:-4}
      executor_memory: ${SPIDAPTER_EXECUTOR_MEMORY_LIMIT:-62Gi}
      executor_storage_size_gb: ${SPIDAPTER_EXECUTOR_STORAGE_SIZE_GB:-~}
      ephemeral_storage_gb: ${SPIDAPTER_EPHEMERAL_STORAGE_LIMIT_GB:-}
acceleration: ${SPICE_ACCELERATION:-cayenne}
source:
  direct:
    cayenne:
      aws_region: ${AWS_REGION:-us-east-1}
      data_dir: ${SPIDAPTER_CAYENNE_DATA_DIR:-}
      metadata_dir: ${SPIDAPTER_CAYENNE_METADATA_DIR:-}
      iceberg_region: ${SPIDAPTER_ICEBERG_REGION:-}
      iceberg_catalog_from: ${SPIDAPTER_ICEBERG_CATALOG_FROM:-}
