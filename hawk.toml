[[production]]
package = "spiced"
bin = "spiced"
reason = "shipped Spice runtime server binary"

[[production]]
package = "spice"
bin = "spice"
reason = "shipped Spice CLI binary"

# `--all-features` (Hawk's default) pulls in the `cuda` feature, which requires
# `nvcc` and is unavailable on this machine. Use Cargo's default features
# instead, matching the macOS release build (no cuda/metal GPU backend).
[[feature-profile]]
name = "default"

# Hawk has no "disable doctests" switch: omitting [[doctest]] entries runs the
# full-workspace doctest pass by default, and one broken doctest in
# data_components aborts `check` before any lint findings are produced.
# Declaring entries restricts the pass to only the listed packages, so
# pointing at a crate with no doctests (ansi_colors) gives zero effective
# doctest coverage.
[[doctest]]
package = "ansi_colors"
