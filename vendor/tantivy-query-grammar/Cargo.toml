# Vendored fork of `tantivy-query-grammar` v0.26.0 (MIT), upstream:
# https://github.com/quickwit-oss/tantivy (directory `query-grammar`).
#
# Why this is vendored (see vendor/tantivy-query-grammar/README.md):
#   The strict query grammar panics with "Exist query without a field isn't
#   allowed" on a `*` it reads as an exists query with no field (`a *(b)`,
#   `- *`), instead of returning a parse error
#   (https://github.com/quickwit-oss/tantivy/issues/3031). This fork changes
#   `literal` in `src/query_grammar.rs` so the exists rule is tried only
#   after a field name. Every query 0.26.0 parses without panicking parses to
#   the same AST. It also limits query nesting depth (`MAX_NESTING_DEPTH`),
#   so a deeply nested query is a parse error instead of a stack overflow.
#
# Wired in via `[patch.crates-io]` in the workspace root Cargo.toml.
[package]
name = "tantivy-query-grammar"
version = "0.26.0"
authors = ["Paul Masurel <paul.masurel@gmail.com>"]
license = "MIT"
categories = ["database-implementations", "data-structures"]
description = """Search engine library (spiceai vendored fork; fieldless exists query is a parse error, not a panic; bounded nesting depth)"""
homepage = "https://github.com/quickwit-oss/tantivy"
repository = "https://github.com/quickwit-oss/tantivy"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[dependencies]
nom = "7"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
ordered-float = "5.0.0"
fnv = "1.0.7"
