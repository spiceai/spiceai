#
# Why this is vendored: see vendor/apache-avro/README.md.
#
# This is the crate's published (normalized) manifest without its example,
# test and bench targets and dev-dependencies, which are not vendored.
# Wired in via `[patch.crates-io]` in the workspace root Cargo.toml.
[package]
edition = "2024"
rust-version = "1.85.0"
name = "apache-avro"
version = "0.21.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A library for working with Apache Avro in Rust"
documentation = "https://docs.rs/apache-avro"
readme = "README.md"
keywords = [
    "avro",
    "data",
    "serialization",
]
categories = ["encoding"]
license = "Apache-2.0"
repository = "https://github.com/apache/avro-rs"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
bzip = ["dep:bzip2"]
derive = ["dep:apache-avro-derive"]
snappy = [
    "dep:crc32fast",
    "dep:snap",
]
xz = ["dep:liblzma"]
zstandard = ["dep:zstd"]

[lib]
name = "apache_avro"
path = "src/lib.rs"
bench = false

[dependencies.apache-avro-derive]
version = "0.21.0"
optional = true
default-features = false

[dependencies.bigdecimal]
version = "0.4.9"
features = [
    "std",
    "serde",
]
default-features = false

[dependencies.bon]
version = "3.8.1"
default-features = false

[dependencies.bzip2]
version = "0.6.1"
optional = true

[dependencies.crc32fast]
version = "1.5.0"
optional = true
default-features = false

[dependencies.digest]
version = "0.10.7"
features = ["core-api"]
default-features = false

[dependencies.liblzma]
version = "0.4.5"
optional = true
default-features = false

[dependencies.log]
version = "0.4.28"
default-features = false

[dependencies.miniz_oxide]
version = "0.8.9"
features = ["with-alloc"]
default-features = false

[dependencies.num-bigint]
version = "0.4.6"
features = [
    "std",
    "serde",
]
default-features = false

[dependencies.regex-lite]
version = "0.1.8"
features = [
    "std",
    "string",
]
default-features = false

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
default-features = false

[dependencies.serde_bytes]
version = "0.11.19"
features = ["std"]
default-features = false

[dependencies.serde_json]
version = "1.0.145"
features = ["std"]
default-features = false

[dependencies.snap]
version = "1.1.0"
optional = true
default-features = false

[dependencies.strum]
version = "0.27.2"
default-features = false

[dependencies.strum_macros]
version = "0.27.2"
default-features = false

[dependencies.thiserror]
version = "2.0.17"
default-features = false

[dependencies.uuid]
version = "1.18.1"
features = [
    "serde",
    "std",
]
default-features = false

[dependencies.zstd]
version = "0.13.3"
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.rand]
version = "0.9.2"
features = ["default"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.quad-rand]
version = "0.2.3"
default-features = false
