[graph]
# Cargo deny will check dependencies via `--all-features`
all-features = true

[advisories]
# cargo-deny v2 schema: vulnerability, unmaintained, unsound, and notice
# advisories all fail the check by default. Yanked crates also fail.
# To bypass a specific advisory, add its RUSTSEC ID (or, for a yanked crate,
# its `crate@version`) to `ignore` with a comment explaining why and an owner.
# Do not add new unmaintained advisories: they stay in the nightly advisory
# report until the crate is upgraded, replaced, or vendored under
# `crates/vendor/`. The unmaintained entries below predate this rule.
version = 2
yanked = "deny"
ignore = [
  # Runtime serialization pulls `atomic-polyfill` through `postcard`/`heapless`; no safe upgrade is available yet. Owner: runtime.
  "RUSTSEC-2023-0089",
  # A transitive local-model dependency still pulls `dotenv`; no safe upgrade is available yet. Owner: llms.
  "RUSTSEC-2021-0141",
  # Local model search dependencies pull `fxhash`; no safe upgrade is available yet. Owner: llms.
  "RUSTSEC-2025-0057",
  # Progress-display dependencies pull `number_prefix`; no safe upgrade is available yet. Owner: llms.
  "RUSTSEC-2025-0119",
  # `paste` is widely used by proc-macro/data connector dependencies; no safe upgrade is available yet. Owner: runtime/data connectors.
  "RUSTSEC-2024-0436",
  # Object store signing dependencies pull `rsa`; no safe upgrade is available yet. Owner: data components/runtime.
  "RUSTSEC-2023-0071",
  # `rustls-pemfile` is unmaintained. Runtime no longer depends on it directly
  # (uses `rustls::pki_types::pem` instead), but the spice-rs SDK (`spiceai`
  # crate) still pulls v1.x transitively. Owner: spice-rs / runtime.
  "RUSTSEC-2025-0134",
  # `quick-xml` quadratic duplicate-attribute check on start tags (DoS). Pulled
  # transitively in several versions (via vortex, AWS-XML, and serialization
  # dependencies); no single safe upgrade across all pins yet. Owner: data components/runtime.
  "RUSTSEC-2026-0194",
  # `quick-xml` unbounded namespace-declaration allocation in `NsReader`
  # (memory-exhaustion DoS), same transitive chain as RUSTSEC-2026-0194; no safe
  # upgrade yet. Owner: data components/runtime.
  "RUSTSEC-2026-0195",
  # `h2` unbounded empty DATA frames. The shipped `h2` 0.4 is on a fixed release;
  # only `h2` 0.3 remains, reached solely through `chdb-rust` 1.x, whose build
  # script downloads `libchdb` with `reqwest` 0.11. `chdb-rust` is optional and
  # enabled only by cayenne's chDB oracle tests and benches; it is not linked into
  # `spiced`. Owner: cayenne.
  "RUSTSEC-2026-0258",
  # `im` `OrdSet` insertion aliasing violation. Cayenne uses only `im::HashMap`,
  # never `OrdSet`. Owner: cayenne.
  "RUSTSEC-2023-0126",
  # `tpcdsgen` 0.1.0-alpha.1 is yanked. It is a dev-dependency of cayenne that
  # generates the TPC-DS fixture of the SQLite and chDB correctness lanes, whose
  # inventory reviews answers against these exact rows; moving to 4.x is a
  # fixture migration of its own, tracked in #16359. Not linked into `spiced`.
  # Owner: cayenne.
  { crate = "tpcdsgen@0.1.0-alpha.1", reason = "test-only TPC-DS fixture generator pinned to the rows the correctness inventory reviews" },
]

[bans]
allow-wildcard-paths = false
multiple-versions    = "allow"

[licenses]

allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "Zlib",
  "0BSD",
  "bzip2-1.0.6", # https://spdx.org/licenses/bzip2-1.0.6.html
  "NCSA" # University of Illinois/NCSA Open Source License (OSI-approved, FSF Free/Libre)
]
private = { ignore = false }
unused-allowed-license = "deny"

[sources]
unknown-git      = "deny"
unknown-registry = "deny"

