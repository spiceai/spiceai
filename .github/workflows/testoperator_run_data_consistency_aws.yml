---
# The jobs of testoperator_run_data_consistency.yml that assume a CI AWS role.
# testoperator_run_data_consistency.yml calls this file at `@trunk`, so whichever ref it runs on, the definition
# that chooses the role is trunk's.
# A job here assumes the full roles only on trunk (a merge-queue run is not trunk) and
# the read-only pull request role anywhere else, and skips its writes there (the `Choose
# the CI role` step). check_workflow_yaml.py keeps every such job in a file like this.
name: data consistency tests (CI AWS role jobs)

on:
  workflow_call:
    inputs:
      compare_spicepod_path:
        type: string
        required: false
        default: ''
      query_overrides:
        type: string
        required: false
        default: ''
      query_set:
        type: string
        required: false
        default: ''
      ready_wait:
        type: string
        required: false
        default: ''
      runner_type:
        type: string
        required: false
        default: ''
      spiced_commit:
        type: string
        required: false
        default: ''
      spicepod_path:
        type: string
        required: false
        default: ''

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-data-consistency:
    # The service principal's federation policy trusts this environment's subject.
    environment: ci
    name: Run data consistency tests
    runs-on: ${{ inputs.runner_type }}
    permissions:
      contents: read
      id-token: write  # RustFS credentials and Databricks access tokens
    timeout-minutes: 600
    steps:
      # Which CI AWS role this job gets, and whether its writes run; see the action.
      - name: Choose the CI role
        id: ci-role
        uses: $/.github/actions/ci-role
        with:
          pull-request-role-set: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN != '' }}
          builds: |
            spiced_commit=${{ inputs.spiced_commit }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate spicepod files exist
        env:
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
          INPUT_COMPARE_SPICEPOD_PATH: ${{ inputs.compare_spicepod_path }}
        run: |
          if [ ! -f "${INPUT_SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${INPUT_SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${INPUT_SPICEPOD_PATH}"

          if [ ! -f "${INPUT_COMPARE_SPICEPOD_PATH}" ]; then
            echo "Error: Compare spicepod file not found at ${INPUT_COMPARE_SPICEPOD_PATH}"
            exit 1
          fi
          echo "Compare spicepod file found at ${INPUT_COMPARE_SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: $/.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepods
        env:
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
          INPUT_COMPARE_SPICEPOD_PATH: ${{ inputs.compare_spicepod_path }}
        run: |
          spicepod-validator "${INPUT_SPICEPOD_PATH}"
          spicepod-validator "${INPUT_COMPARE_SPICEPOD_PATH}"

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        with:
          spiced_commit: ${{ inputs.spiced_commit }}

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup Testoperator
        uses: $/.github/actions/setup-testoperator-data
        with:
          query_set: ${{ inputs.query_set }}

      # Short-lived AWS credentials, kept out of the job's environment and passed to the step below.
      - name: Assume the Databricks Delta role
        id: aws-databricks-delta
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-databricks-delta-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Run the data consistency test
        run: |
          rm -rf .spice/data
          testoperator run data-consistency \
            -s /usr/local/bin/spiced \
            -p "${INPUT_SPICEPOD_PATH}" \
            -d /opt/spiced/data \
            --query-set "${INPUT_QUERY_SET}" \
            ${INPUT_QUERY_OVERRIDES:+--query-overrides "${INPUT_QUERY_OVERRIDES}"} \
            --ready-wait "${INPUT_READY_WAIT}" \
            --disable-progress-bars \
            --compare-spicepod-path "${INPUT_COMPARE_SPICEPOD_PATH}"
        env:
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT}}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          DATABRICKS_HOST: ${{ vars.CI_DATABRICKS_HOST }}
          DATABRICKS_OIDC_CLIENT_ID: ${{ vars.DATABRICKS_OIDC_CLIENT_ID }}
          DATABRICKS_OIDC_AUDIENCE: ${{ vars.DATABRICKS_OIDC_AUDIENCE }}
          DATABRICKS_CLUSTER_ID: ${{ vars.CI_DATABRICKS_CLUSTER_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ steps.aws-databricks-delta.outputs.aws-access-key-id }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ steps.aws-databricks-delta.outputs.aws-secret-access-key }}
          AWS_DATABRICKS_DELTA_SESSION_TOKEN: ${{ steps.aws-databricks-delta.outputs.aws-session-token }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          MYSQL_HOST: ${{ vars.TEST_MYSQL_HOST }}
          MYSQL_TCP_PORT: 3306
          MYSQL_USER: ${{ secrets.TEST_MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          POSTGRES_HOST: ${{ vars.TEST_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          SPICEAI_TEST_ENDPOINT: ${{ vars.SPICE_SECRET_SPICEAI_TEST_ENDPOINT }}
          SPICEAI_TEST_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
          SPICEAI_TEST_TPCDS_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY }}
          SPICEAI_CLICKBENCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY }}
          SQL_WAREHOUSE_DATABRICKS_HOST: ${{ vars.CI_DATABRICKS_HOST }}
          SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.CI_DATABRICKS_SQL_WAREHOUSE_ID }}
          MONGODB_HOST: ${{ vars.TEST_MONGODB_HOST }}
          MONGODB_PASSWORD: ${{ secrets.TEST_MONGODB_PASSWORD }}
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
          INPUT_QUERY_SET: ${{ inputs.query_set }}
          INPUT_QUERY_OVERRIDES: ${{ inputs.query_overrides }}
          INPUT_READY_WAIT: ${{ inputs.ready_wait }}
          INPUT_COMPARE_SPICEPOD_PATH: ${{ inputs.compare_spicepod_path }}
