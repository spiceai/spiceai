---
# PROBE ONLY (branch grokspice/cayenne-reclaim-flake-probe*), never merged:
# loops the two Cayenne whole-table reclaim tests that flake in the merge
# queue (issue #16128) under CPU contention, and prints which decline exit
# `compact_current_snapshot_small_files` took when the reclaim did not run.
name: chDB result-correctness

on:
  workflow_dispatch:

jobs:
  probe:
    environment: secret-free
    name: Cayenne reclaim flake probe
    timeout-minutes: 150
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Build the cayenne lib tests
        run: |
          set -euo pipefail
          cargo test -p cayenne --lib --no-run --message-format=json > build.json
          bin=$(jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and .target.name=="cayenne" and (.target.kind|index("lib"))) | .executable' build.json | tail -1)
          test -x "$bin"
          echo "BIN=$bin" >> "$GITHUB_ENV"

      - name: Loop the reclaim tests under contention
        run: |
          set -uo pipefail
          cpus=$(nproc)
          echo "cpus=${cpus} sha=$(git rev-parse HEAD)"
          mkdir -p logs
          # One CPU burner per core, so each test process competes for a core
          # the way it does inside a full nextest run of 18k tests.
          for _ in $(seq "$cpus"); do (yes > /dev/null &) ; done
          run_one() {
            local t="$1" i="$2"
            local log="logs/${t##*::}.${i}.log"
            if "$BIN" --exact "$t" --test-threads=1 > "$log" 2>&1; then
              rm -f "$log"
              echo pass
            else
              echo fail
            fi
          }
          export -f run_one
          total_fail=0
          for t in \
            provider::table::tests::a_whole_table_reclaim_counts_the_rows_of_files_its_tombstones_hide_whole \
            provider::table::tests::a_whole_table_reclaim_of_real_upserts_keeps_its_trigger \n            provider::table::tests::a_whole_table_reclaim_counts_each_removed_row_once \n            provider::table::tests::a_reclaim_over_position_deletes_keeps_the_yield_it_had \n            provider::table::tests::a_whole_table_reclaim_that_removes_no_rows_backs_its_trigger_off; do
            for par in "$cpus" "$((cpus * 4))"; do
              res=$(seq 300 | xargs -P "$par" -I{} bash -c 'run_one "$0" "$1"' "$t" {} | sort | uniq -c | tr '\n' ' ')
              echo "RESULT test=${t##*::} parallel=${par} iterations=300 -> ${res}"
            done
            f=$(ls logs/"${t##*::}".*.log 2>/dev/null | wc -l)
            total_fail=$((total_fail + f))
          done
          pkill yes || true
          echo "---- decline exits seen in failing iterations ----"
          cat logs/*.log 2>/dev/null | grep -h "PROBE" | sort | uniq -c || true
          echo "---- panic messages in failing iterations ----"
          cat logs/*.log 2>/dev/null | grep -h -A1 "panicked at" | grep -v "^--$" | sort | uniq -c | head -20 || true
          echo "---- first failing log ----"
          first=$(ls logs/*.log 2>/dev/null | head -1)
          [ -n "$first" ] && tail -40 "$first"
          echo "TOTAL_FAILED_ITERATIONS=${total_fail}"
          test "$total_fail" -eq 0
