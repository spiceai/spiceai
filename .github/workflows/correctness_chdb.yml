---
name: chDB result-correctness

on:
  push:
    branches:
      - trunk
      - release/*
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Report the required job name on pull requests without running the lane; the
  # real check runs against the merge-group commit, as the other engine lanes do.
  check_changes:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    timeout-minutes: 45
    outputs:
      relevant_changes: ${{ steps.check.outputs.relevant_changes }}
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "chDB result-correctness runs on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for code changes
        if: ${{ github.event_name != 'pull_request' }}
        id: check
        uses: ./.github/actions/check-code-changes

  test:
    name: chDB Result Correctness
    needs: check_changes
    timeout-minutes: 90
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "chDB result-correctness runs on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check_changes.outputs.relevant_changes == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache Cargo registry
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/install-protoc

      - name: Set up sccache
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      # `chdb-rust`'s build script fetches libchdb into OUT_DIR and pins the
      # version it expects, so installing a copy here would be a second place to
      # keep that version right — and the stale one would win, because the build
      # script prefers an existing library over downloading. That fetch is the
      # only network step in this lane, so the build is retried and the run is
      # not: the lane compares two engines' answers to the same SQL over the same
      # data, where a mismatch is deterministic and a retry can only hide one.
      # Same reasoning as `retries = 0` in `.config/nextest.toml`.
      - name: Build the chDB result-correctness lane
        if: needs.check_changes.outputs.relevant_changes == 'true'
        env:
          CARGO_INCREMENTAL: 0
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo test -p cayenne --features result-correctness-chdb \
                 --test result_correctness_vs_chdb_test --no-run; then
              built=yes
              break
            fi
            echo "build attempt ${attempt} failed (libchdb fetch); retrying" >&2
            sleep 30
          done
          test "${built:-no}" = yes

      - name: Run the chDB result-correctness lane
        if: needs.check_changes.outputs.relevant_changes == 'true'
        env:
          CARGO_INCREMENTAL: 0
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          cargo test -p cayenne --features result-correctness-chdb \
            --test result_correctness_vs_chdb_test -- --nocapture
