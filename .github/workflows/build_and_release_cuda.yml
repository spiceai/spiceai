name: build_and_release_cuda

# CUDA is not part of pull-request CI: a single compute-cap 90 compile takes
# hours on the large runners, and the workflow is not a required check. Trunk
# pushes and manual dispatches still build every compute capability. A release
# build builds CUDA inside build_release, which calls this workflow, so the
# release's CUDA binaries are artifacts of the same run as every other binary.
on:
  push:
    branches:
      - trunk
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  workflow_call:
    inputs:
      release_version:
        description: Version of the release build calling this workflow
        required: true
        type: string

  workflow_dispatch:
    inputs:
      platform_option:
        description: 'Which platform do you want to run on? (Default is ALL)'
        required: false
        type: choice
        options:
          - 'all'
          - 'Linux x64'
        default: 'all'
      compute_cap:
        description: 'Which CUDA compute capability to build for? (Default is ALL)'
        required: false
        type: choice
        options:
          - 'all'
          - '80'
          - '86'
          - '87'
          - '89'
          - '90'
        default: 'all'
      profile_option:
        description: 'Which Rust build profile to use? (Default is release)'
        required: false
        type: choice
        options:
          - 'release'
          - 'release-lto'
        default: 'release'

# A trunk push cancels the CUDA build of any older trunk push, queued or
# running. Every other run, including a call from build_release, gets a group
# of its own, so it never cancels or waits on another run. A cancelled
# build_release run cancels its call with it.
concurrency:
  group: ${{ format('build-cuda-{0}', (github.event_name == 'push' && github.ref == 'refs/heads/trunk') && 'trunk' || github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Checked against version.txt by get_release_version.py; set only by a release build.
  RELEASE_VERSION: ${{ inputs.release_version }}

jobs:
  setup-matrix:
    environment: secret-free
    name: Setup CUDA matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            // A release build calls this workflow with its version and builds on
            // GitHub-hosted runners.
            const isRelease = process.env.RELEASE_VERSION !== '';
            const runner = isRelease ? "ubuntu-24.04-16core" : "spiceai-dev-large-runners";

            const matrix = [
              {
                compute_cap: "80",
                runner: runner,
                target_os: "linux",
                target_arch: "x86_64"
              },
              {
                compute_cap: "86",
                runner: runner,
                target_os: "linux",
                target_arch: "x86_64"
              },
              {
                compute_cap: "87",
                runner: runner,
                target_os: "linux",
                target_arch: "x86_64"
              },
              {
                compute_cap: "89",
                runner: runner,
                target_os: "linux",
                target_arch: "x86_64"
              },
              {
                compute_cap: "90",
                runner: runner,
                target_os: "linux",
                target_arch: "x86_64"
              }
            ];

            // If running via workflow_dispatch, filter based on input. A call from
            // build_release sees build_release's dispatch inputs, which have no
            // `compute_cap`, so a missing input means 'all'. Its `platform_option`
            // keeps every entry, since every CUDA build is Linux.
            if (context.eventName === 'workflow_dispatch') {
              const platform_option = context.payload.inputs.platform_option ?? 'all';
              const compute_cap = context.payload.inputs.compute_cap ?? 'all';
              let filtered = matrix;

              // Filter by platform if specified
              if (platform_option !== 'all') {
                filtered = filtered.filter(m => m.target_os === 'linux');
              }

              // Filter by compute capability if specified
              if (compute_cap !== 'all') {
                filtered = filtered.filter(m => m.compute_cap === compute_cap);
              }

              return filtered;
            }

            return matrix;

  build:
    environment: secret-free
    name: Build CUDA ${{ matrix.target.compute_cap }} binaries
    runs-on: ${{ matrix.target.runner }}
    needs: setup-matrix
    env:
      RUST_PROFILE: ${{ github.event.inputs.profile_option || 'release' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up wget
        if: matrix.target.target_os == 'linux'
        run: sudo apt-get update && sudo apt-get install wget -y

      - name: Set up make
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Run Spiced CUDA Build
        uses: ./.github/actions/spiced-cuda-build
        with:
          cuda-version: '12.6.0'
          cuda-compute-capability: ${{ matrix.target.compute_cap }}
          artifact-tag: ${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          target_os: ${{ matrix.target.target_os }}
          rust-profile: ${{ env.RUST_PROFILE }}

