---
name: ADBC integration tests

on:
  push:
    branches:
      - trunk
      - release/*
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  # Report the required job name on pull requests without running ADBC tests;
  # the real check runs against the merge-group commit.
  check_changes:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    # A full-history checkout (`fetch-depth: 0`) and a path diff. Sized for a
    # cold runner having to clone from scratch, not the ~1 min a warm
    # self-hosted workspace takes.
    timeout-minutes: 45
    outputs:
      relevant_changes: ${{ steps.check.outputs.relevant_changes }}
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "ADBC integration tests run on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for code changes
        if: ${{ github.event_name != 'pull_request' }}
        id: check
        uses: ./.github/actions/check-code-changes

  test:
    name: ADBC Integration Tests
    needs: check_changes
    # Slowest observed success in the 2026-07-25..08-08 window: 50 min.
    timeout-minutes: 150
    # On non-PR events, run the required check unconditionally and gate each
    # step so docs-only merge groups still report success.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "ADBC integration tests run on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check_changes.outputs.relevant_changes == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache Cargo registry
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/install-protoc

      - name: Set up sccache
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Set up ADBC drivers
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: columnar-tech/setup-dbc@4d83cce5bf2aa1e46eedbe44f13b57bbef8f2baf # v1.0.2
        with:
          drivers: 'sqlite'

      - name: Run ADBC integration tests
        if: needs.check_changes.outputs.relevant_changes == 'true'
        env:
          CARGO_INCREMENTAL: 0
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
        run: |
          cargo test -p runtime --features adbc --test integration -- adbc::
