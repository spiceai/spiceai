name: Validate configured load fixtures
run-name: Load fixture probe - ${{ inputs.query_set }} SF${{ inputs.scale_factor }}
'on':
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: spiced build commit
        required: false
        type: string
      duration:
        description: The test duration in seconds
        required: true
        default: '28800'
        type: string
      spicepod_path:
        description: The spicepod file to test with
        required: true
        type: string
      query_set:
        description: Query set
        required: true
        default: tpch
        type: choice
        options:
        - tpch
        - tpch[parameterized]
        - tpcds
        - clickbench
      query_overrides:
        description: Query overrides
        required: false
        type: choice
        default: ''
        options:
        - ''
        - sqlite
        - postgresql
        - mysql
        - dremio
        - odbc-athena
        - odbc-databricks
        - duckdb
        - duckdb-zero-results
        - snowflake
        - spark
        - iceberg-sf1
        - spicecloud-catalog
        - glue-catalog
        - databricks-catalog
        - spicecloud
        - iceberg-hadoop
        - postgres-catalog
        - mysql-catalog
        - mssql-catalog
        - arrow
        - bigquery
        - dynamodb
        - scylladb
        - turso
      scale_factor:
        description: Scale factor for the data and queries
        required: false
        type: string
        default: '1'
      runner_type:
        description: Runner type
        required: true
        default: spiceai-dev-runners
        type: choice
        options:
        - spiceai-dev-runners
        - spiceai-dev-large-runners
      concurrency:
        description: How many concurrent client connections to use?
        required: true
        default: '8'
        type: string
      random_param_set_count:
        description: Number of random parameter sets to generate for parameterized queries (optional)
        required: false
        type: string
      http_clients:
        description: Use HTTP clients for the test?
        required: false
        type: boolean
        default: 'false'
      scrape_spiced_metrics:
        description: Scrape Prometheus metrics from spiced during the test
        required: false
        type: boolean
        default: 'false'
permissions:
  contents: read
jobs:
  probe:
    runs-on: spiceai-dev-runners
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Set spicepod path
      id: set_spicepod_path
      env:
        QUERY_SET: ${{ github.event.inputs.query_set }}
        SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
        SPICEPOD_FILE: ${{ github.event.inputs.spicepod_path }}
      run: "if [[ ! \"$SCALE_FACTOR\" =~ ^[0-9]+([.][0-9]+)?$ ]] || [[ -z \"${SCALE_FACTOR//[0.]/}\" ]]; then\n  echo \"Error: scale_factor must be a positive number\"\n  exit 1\nfi\nquery_set=\"$QUERY_SET\"\
        \nquery_set=\"${query_set%%\\[*\\]*}\"\nscale_factor=\"$SCALE_FACTOR\"\nwhile [[ \"$scale_factor\" == 0[0-9]* ]]; do\n  scale_factor=\"${scale_factor#0}\"\ndone\nif [[ \"$scale_factor\" == *.* ]];\
        \ then\n  while [[ \"$scale_factor\" == *0 ]]; do\n    scale_factor=\"${scale_factor%0}\"\n  done\n  scale_factor=\"${scale_factor%.}\"\nfi\nfixture_scale=\"${scale_factor//./_}\"\nSPICEPOD_PATH=\"\
        ./test/spicepods/${query_set}/sf${fixture_scale}/${SPICEPOD_FILE}\"\n{\n  echo \"SPICEPOD_PATH=${SPICEPOD_PATH}\"\n  echo \"query_set=${query_set}\"\n  echo \"fixture_scale=${fixture_scale}\"\n\
        } >> \"$GITHUB_OUTPUT\"\n"
    - name: Validate spicepod file exists
      run: "if [ ! -f \"${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}\" ]; then\n  echo \"Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}\"\n  exit 1\nfi\n\
        echo \"Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}\"\n"
    - name: Install MinIO
      uses: ./.github/actions/setup-minio
      with:
        minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
        minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
    - name: Verify selected fixture objects
      env:
        QUERY_SET: ${{ steps.set_spicepod_path.outputs.query_set }}
        FIXTURE_SCALE: ${{ steps.set_spicepod_path.outputs.fixture_scale }}
      run: "set -euo pipefail\nprefix=\"spice-minio/benchmarks/${QUERY_SET}_sf${FIXTURE_SCALE}\"\nmc stat --json \"${prefix}/${QUERY_SET}.db\"\nif [[ \"$QUERY_SET\" == tpch ]]; then\n  mc stat --json \"\
        ${prefix}/lineitem.parquet\"\nelse\n  mc stat --json \"${prefix}/store_sales.parquet\"\nfi\nmc ls --json \"${prefix}/\" > \"$RUNNER_TEMP/fixture-objects.json\"\npython3 - <<'PYTHON'\nfrom pathlib\
        \ import Path\nimport json, os\nobjects = [json.loads(line) for line in Path(os.environ['RUNNER_TEMP'], 'fixture-objects.json').read_text().splitlines()]\nassert objects and all(item.get('status')\
        \ == 'success' for item in objects)\nprint(json.dumps({'query_set': os.environ['QUERY_SET'], 'fixture_scale': os.environ['FIXTURE_SCALE'], 'objects': len(objects), 'bytes': sum(item.get('size',\
        \ 0) for item in objects)}))\nPYTHON\n"
