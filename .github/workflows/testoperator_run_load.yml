name: load tests
run-name: load - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      duration:
        description: 'The test duration in seconds'
        required: true
        default: '28800'
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'sqlite'
          - 'postgresql'
          - 'mysql'
          - 'odbc-athena'
          - 'duckdb'
          - 'duckdb-zero-results'
          - 'snowflake'
          - 'spark'
          - 'iceberg-sf1'
          - 'spicecloud-catalog'
          - 'glue-catalog'
          - 'databricks-catalog'
          - 'spicecloud'
          - 'iceberg-hadoop'
          - 'postgres-catalog'
          - 'mysql-catalog'
          - 'mssql-catalog'
          - 'arrow'
          - 'bigquery'
          - 'dynamodb'
          - 'scylladb'
      scale_factor:
        description: 'Scale factor for the data and queries'
        required: false
        type: string
        default: '1'
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      concurrency:
        description: 'How many concurrent client connections to use?'
        required: true
        default: '8'
        type: string
      random_param_set_count:
        description: 'Number of random parameter sets to generate for parameterized queries (optional)'
        required: false
        type: string
      http_clients:
        description: 'Use HTTP clients for the test?'
        required: false
        type: boolean
        default: false
      scrape_spiced_metrics:
        description: 'Scrape Prometheus metrics from spiced during the test'
        required: false
        type: boolean
        default: false

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-load:
    # Assumes a CI AWS role, so it runs from testoperator_run_load_aws.yml; see that file.
    permissions:
      contents: read
      id-token: write  # RustFS credentials, Databricks access tokens, and Google Cloud access tokens for the BigQuery tests
    uses: spiceai/spiceai/.github/workflows/testoperator_run_load_aws.yml@trunk
    with:
      concurrency: ${{ github.event.inputs.concurrency }}
      duration: ${{ github.event.inputs.duration }}
      http_clients: ${{ github.event.inputs.http_clients }}
      query_overrides: ${{ github.event.inputs.query_overrides }}
      query_set: ${{ github.event.inputs.query_set }}
      random_param_set_count: ${{ github.event.inputs.random_param_set_count }}
      runner_type: ${{ github.event.inputs.runner_type }}
      scale_factor: ${{ github.event.inputs.scale_factor }}
      scrape_spiced_metrics: ${{ github.event.inputs.scrape_spiced_metrics }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
