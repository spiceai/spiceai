name: load tests
run-name: load - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      duration:
        description: 'The test duration in seconds'
        required: true
        default: '28800'
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'sqlite'
          - 'postgresql'
          - 'mysql'
          - 'odbc-athena'
          - 'odbc-databricks'
          - 'duckdb'
          - 'duckdb-zero-results'
          - 'snowflake'
          - 'spark'
          - 'iceberg-sf1'
          - 'spicecloud-catalog'
          - 'glue-catalog'
          - 'databricks-catalog'
          - 'spicecloud'
          - 'iceberg-hadoop'
          - 'postgres-catalog'
          - 'mysql-catalog'
          - 'mssql-catalog'
          - 'arrow'
          - 'bigquery'
          - 'dynamodb'
          - 'scylladb'
          - 'turso'
      scale_factor:
        description: 'Scale factor for the data and queries'
        required: false
        type: string
        default: '1'
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      concurrency:
        description: 'How many concurrent client connections to use?'
        required: true
        default: '8'
        type: string
      random_param_set_count:
        description: 'Number of random parameter sets to generate for parameterized queries (optional)'
        required: false
        type: string
      http_clients:
        description: 'Use HTTP clients for the test?'
        required: false
        type: boolean
        default: false
      scrape_spiced_metrics:
        description: 'Scrape Prometheus metrics from spiced during the test'
        required: false
        type: boolean
        default: false

jobs:
  run-load:
    # Holds the BigQuery workload identity federation settings (`BIGQUERY_*` secrets).
    environment: ci
    name: Run load test
    runs-on: ${{ github.event.inputs.runner_type }}
    permissions:
      contents: read
      id-token: write  # RustFS credentials, and Google Cloud access tokens for the BigQuery tests
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set spicepod path
        id: set_spicepod_path
        env:
          QUERY_SET: ${{ github.event.inputs.query_set }}
          SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
          SPICEPOD_FILE: ${{ github.event.inputs.spicepod_path }}
        run: |
          if [[ ! "$SCALE_FACTOR" =~ ^[0-9]+([.][0-9]+)?$ ]] || [[ -z "${SCALE_FACTOR//[0.]/}" ]]; then
            echo "Error: scale_factor must be a positive number"
            exit 1
          fi
          query_set="$QUERY_SET"
          query_set="${query_set%%\[*\]*}"
          scale_factor="$SCALE_FACTOR"
          while [[ "$scale_factor" == 0[0-9]* ]]; do
            scale_factor="${scale_factor#0}"
          done
          if [[ "$scale_factor" == *.* ]]; then
            while [[ "$scale_factor" == *0 ]]; do
              scale_factor="${scale_factor%0}"
            done
            scale_factor="${scale_factor%.}"
          fi
          fixture_scale="${scale_factor//./_}"
          SPICEPOD_PATH="./test/spicepods/${query_set}/sf${fixture_scale}/${SPICEPOD_FILE}"
          {
            echo "SPICEPOD_PATH=${SPICEPOD_PATH}"
            echo "query_set=${query_set}"
            echo "fixture_scale=${fixture_scale}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Get RustFS credentials
        id: rustfs
        uses: ./.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup Testoperator
        uses: ./.github/actions/setup-testoperator-data
        with:
          query_set: ${{ github.event.inputs.query_set }}
          scale_factor: ${{ github.event.inputs.scale_factor }}

      - name: Setup MySQL
        env:
          QUERY_SET: ${{ steps.set_spicepod_path.outputs.query_set }}
          FIXTURE_SCALE: ${{ steps.set_spicepod_path.outputs.fixture_scale }}
        run: |
          if [[ "$QUERY_SET" == "tpcds" || "$QUERY_SET" == "tpch" ]]; then
            echo "MYSQL_DB=${QUERY_SET}_sf${FIXTURE_SCALE}" >> "$GITHUB_ENV"
          fi

      - name: Install OpenMP runtime library
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install ADBC BigQuery Driver
        if: ${{ contains(github.event.inputs.spicepod_path, 'adbc[bigquery]') }}
        uses: ./.github/actions/setup-adbc-bigquery

      - name: Set up BigQuery credentials (workload identity federation)
        if: ${{ contains(github.event.inputs.spicepod_path, 'adbc[bigquery]') }}
        uses: ./.github/actions/bigquery-credentials
        with:
          workload-identity-provider: ${{ secrets.BIGQUERY_WIF_PROVIDER }}
          service-account: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}

      # Short-lived AWS credentials, kept out of the job's environment and passed to the step below.
      - name: Assume the Databricks Delta role
        id: aws-databricks-delta
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DATABRICKS_DELTA_ROLE_ARN }}
          role-session-name: gha-databricks-delta-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Run the load test - ${{ github.event.inputs.spicepod_path }}
        run: |
          rm -rf .spice/data
          testoperator run load \
            -s /usr/local/bin/spiced \
            -p ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }} \
            -d /opt/spiced/data \
            --query-set ${{ github.event.inputs.query_set }} \
            --scale-factor "$TEST_SCALE_FACTOR" \
            --ready-wait 900 \
            --disable-progress-bars \
            --duration ${{ github.event.inputs.duration }} \
            ${{ github.event.inputs.query_overrides != '' && format('--query-overrides {0}', github.event.inputs.query_overrides) || '' }} \
            --concurrency ${{ github.event.inputs.concurrency }} \
            ${{ github.event.inputs.random_param_set_count && format('--random-param-set-count {0}', github.event.inputs.random_param_set_count) || '' }} \
            ${{ github.event.inputs.http_clients == 'true' && '--http-clients' || '' }} \
            ${{ github.event.inputs.scrape_spiced_metrics == 'true' && '--scrape-spiced-metrics' || '' }} \
            --metrics
        env:
          TEST_SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT}}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ENDPOINT: ${{ vars.DATABRICKS_ENDPOINT }}
          DATABRICKS_CLUSTER_ID: ${{ vars.DATABRICKS_CLUSTER_ID }}
          DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ steps.aws-databricks-delta.outputs.aws-access-key-id }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ steps.aws-databricks-delta.outputs.aws-secret-access-key }}
          AWS_DATABRICKS_DELTA_SESSION_TOKEN: ${{ steps.aws-databricks-delta.outputs.aws-session-token }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          MYSQL_HOST: ${{ vars.TEST_MYSQL_HOST }}
          MYSQL_TCP_PORT: 3306
          MYSQL_USER: ${{ secrets.TEST_MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          POSTGRES_HOST: ${{ vars.TEST_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          SPICEAI_TEST_ENDPOINT: ${{ vars.SPICE_SECRET_SPICEAI_TEST_ENDPOINT }}
          SPICEAI_TEST_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
          SPICEAI_TEST_TPCDS_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY }}
          SPICEAI_CLICKBENCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY }}
          SQL_WAREHOUSE_DATABRICKS_TOKEN: ${{ secrets.SQL_WAREHOUSE_DATABRICKS_TOKEN }}
          SQL_WAREHOUSE_DATABRICKS_HOST: ${{ vars.SQL_WAREHOUSE_DATABRICKS_HOST }}
          SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID }}
          MONGODB_HOST: ${{ vars.TEST_MONGODB_HOST }}
          MONGODB_PASSWORD: ${{ secrets.TEST_MONGODB_PASSWORD }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
