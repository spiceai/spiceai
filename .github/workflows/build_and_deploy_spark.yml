name: build_and_deploy_spark

on:
  pull_request:
    branches:
      - trunk
    paths:
      - 'crates/llms/Cargo.toml'
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  workflow_dispatch:

jobs:
  build-spark:
    name: Build CUDA binaries for DGX Spark (ARM64)
    # Build natively on DGX Spark ARM64 device with CUDA support
    runs-on: 'spiceai-dgx-spark-runners'
    env:
      RUST_PROFILE: release
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      COMPUTE_CAP: '120'
      TARGET_ARCH: 'aarch64'
      TARGET_OS: 'linux'

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          os: ${{ env.TARGET_OS }}

      - name: Run Spiced CUDA Build for ARM64
        uses: ./.github/actions/spiced-cuda-build
        with:
          cuda-version: '12.6.0'
          cuda-compute-capability: ${{ env.COMPUTE_CAP }}
          artifact-tag: ${{ env.TARGET_OS }}_${{ env.TARGET_ARCH }}
          target_os: ${{ env.TARGET_OS }}
          rust-profile: ${{ env.RUST_PROFILE }}

      - name: Copy spiced binary to shared bin
        run: |
          # Ensure the binary exists
          if [ ! -f "target/${{ env.RUST_PROFILE }}/spiced" ]; then
            echo "Error: spiced binary not found at target/${{ env.RUST_PROFILE }}/spiced"
            exit 1
          fi

          # Copy and overwrite the binary
          cp target/${{ env.RUST_PROFILE }}/spiced /opt/spice/bin/spiced

          # Set proper permissions
          chmod +x /opt/spice/bin/spiced

          echo "Successfully copied spiced to /opt/spice/bin/"
          ls -lh /opt/spice/bin/spiced
