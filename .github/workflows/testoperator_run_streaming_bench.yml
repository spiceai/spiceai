name: testoperator streaming dynamodb benchmark
run-name: streaming - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'Spicepod file path (relative to repo root, e.g., test/spicepods/streaming/dynamodb-tpch-cayenne.yaml)'
        required: true
        type: string
      queryset:
        description: 'Query set type'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
      scale_factor:
        description: 'Scale factor (must match dispatch scale factor)'
        required: true
        default: '0.01'
        type: string
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start and markers to be ingested'
        required: true
        default: '60'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      verify:
        description: 'Run TPCH queries to verify data integrity'
        required: false
        type: boolean
        default: true
      enable_liveness:
        description: 'Enable health monitoring during ingestion'
        required: false
        type: boolean
        default: false
      enable_query_liveness:
        description: 'Enable query liveness monitoring'
        required: false
        type: boolean
        default: false
      query_liveness_interval_ms:
        description: 'Poll interval for query liveness checks (ms)'
        required: false
        type: string
        default: '500'

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-streaming-benchmark:
    environment: ci
    name: Run DynamoDB streaming benchmark
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the streaming benchmark role
        id: aws-streaming
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.CI_AWS_STREAMING_BENCH_ROLE_ARN }}
          role-session-name: gha-streaming-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: us-east-2
          output-env-credentials: false
          output-credentials: true

      - name: Set spicepod path
        id: set_spicepod_path
        env:
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
        run: |
          # Support both relative paths (from repo root) and paths with ./ prefix
          INPUT_PATH="${INPUT_SPICEPOD_PATH}"
          if [[ "${INPUT_PATH}" == ./* ]]; then
            SPICEPOD_PATH="${INPUT_PATH}"
          else
            SPICEPOD_PATH="./${INPUT_PATH}"
          fi
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          if [ ! -f "${SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '7200'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        env:
          SETUP_SPICED_SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
        run: echo "SPICED_COMMIT=${SETUP_SPICED_SPICED_COMMIT}"

      # testoperator generates and checks its data with the DuckDB library installed on the host.
      - name: Set up libduckdb
        uses: $/.github/actions/setup-libduckdb

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Run DynamoDB streaming benchmark
        run: |

          LIVENESS_FLAG=""
          if [ "${INPUT_ENABLE_LIVENESS}" = "true" ]; then
            LIVENESS_FLAG="--enable-liveness"
          fi

          QUERY_LIVENESS_FLAG=""
          if [ "${INPUT_ENABLE_QUERY_LIVENESS}" = "true" ]; then
            QUERY_LIVENESS_FLAG="--enable-query-liveness --query-liveness-interval-ms ${INPUT_QUERY_LIVENESS_INTERVAL_MS}"
          fi

          testoperator run streaming-dynamodb \
            -s /usr/local/bin/spiced \
            -p "${SPICEPOD_PATH}" \
            --queryset "${INPUT_QUERYSET}" \
            --scale-factor "${INPUT_SCALE_FACTOR}" \
            --ready-wait "${INPUT_READY_WAIT}" \
            --metrics \
            ${LIVENESS_FLAG} \
            ${QUERY_LIVENESS_FLAG}
        env:
          # DynamoDB credentials
          DYNAMODB_AWS_REGION: us-east-2
          DYNAMODB_AWS_ACCESS_KEY_ID: ${{ steps.aws-streaming.outputs.aws-access-key-id }}
          DYNAMODB_AWS_SECRET_ACCESS_KEY: ${{ steps.aws-streaming.outputs.aws-secret-access-key }}
          DYNAMODB_AWS_SESSION_TOKEN: ${{ steps.aws-streaming.outputs.aws-session-token }}
          # Snapshot storage
          SNAPSHOT_S3_LOCATION: s3://spiceai-ci-streaming-snapshots
          SNAPSHOT_S3_ACCESS_KEY_ID: ${{ steps.aws-streaming.outputs.aws-access-key-id }}
          SNAPSHOT_S3_SECRET_ACCESS_KEY: ${{ steps.aws-streaming.outputs.aws-secret-access-key }}
          SNAPSHOT_S3_SESSION_TOKEN: ${{ steps.aws-streaming.outputs.aws-session-token }}
          SNAPSHOT_S3_REGION: us-east-1
          # Metrics
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          INPUT_ENABLE_LIVENESS: ${{ github.event.inputs.enable_liveness }}
          INPUT_ENABLE_QUERY_LIVENESS: ${{ github.event.inputs.enable_query_liveness }}
          INPUT_QUERY_LIVENESS_INTERVAL_MS: ${{ github.event.inputs.query_liveness_interval_ms }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          INPUT_QUERYSET: ${{ github.event.inputs.queryset }}
          INPUT_SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
          INPUT_READY_WAIT: ${{ github.event.inputs.ready_wait }}
