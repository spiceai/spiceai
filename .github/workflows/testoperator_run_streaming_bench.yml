name: testoperator streaming dynamodb benchmark
run-name: streaming - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'Spicepod file path (relative to repo root, e.g., test/spicepods/streaming/dynamodb-tpch-cayenne.yaml)'
        required: true
        type: string
      queryset:
        description: 'Query set type'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
      scale_factor:
        description: 'Scale factor (must match dispatch scale factor)'
        required: true
        default: '0.01'
        type: string
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start and markers to be ingested'
        required: true
        default: '60'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      verify:
        description: 'Run TPCH queries to verify data integrity'
        required: false
        type: boolean
        default: true
      enable_liveness:
        description: 'Enable health monitoring during ingestion'
        required: false
        type: boolean
        default: false
      enable_query_liveness:
        description: 'Enable query liveness monitoring'
        required: false
        type: boolean
        default: false
      query_liveness_interval_ms:
        description: 'Poll interval for query liveness checks (ms)'
        required: false
        type: string
        default: '500'

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-streaming-benchmark:
    # Assumes a CI AWS role, so it runs from testoperator_run_streaming_bench_aws.yml; see that file.
    permissions:
      id-token: write
      contents: read
    uses: spiceai/spiceai/.github/workflows/testoperator_run_streaming_bench_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_AWS_STREAMING_BENCH_ROLE_ARN: ${{ secrets.CI_AWS_STREAMING_BENCH_ROLE_ARN }}
      SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
    with:
      enable_liveness: ${{ github.event.inputs.enable_liveness }}
      enable_query_liveness: ${{ github.event.inputs.enable_query_liveness }}
      query_liveness_interval_ms: ${{ github.event.inputs.query_liveness_interval_ms }}
      queryset: ${{ github.event.inputs.queryset }}
      ready_wait: ${{ github.event.inputs.ready_wait }}
      runner_type: ${{ github.event.inputs.runner_type }}
      scale_factor: ${{ github.event.inputs.scale_factor }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
