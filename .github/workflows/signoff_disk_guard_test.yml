---
name: Sign-off Disk Guard Tests

# `scripts/signoff` decides whether a branch may enter the merge queue, and the
# disk guard decides whether a failed run gets blamed on the branch or on the
# runner. Both directions are load-bearing and neither is exercised anywhere
# else: a guard that under-reports leaves an out-of-disk run looking like a code
# failure (the bug it was written for, #12412), and one that over-reports
# excuses a genuinely broken branch as "infrastructure, just re-dispatch".
#
# The same classification also decides whether a run reached a verdict at all, so
# these tests cover the signalled case too — a budget expiry publishing "checks
# failed" about a suite that was still passing (#12518). The workflow keeps its
# name: it is a required check, and renaming one costs a branch-protection edit.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_disk_guard.sh'
      - '.github/workflows/signoff_disk_guard_test.yml'
      # The lockfile cases run the toolchain this file pins, so a channel bump is
      # itself a reason to re-check that cargo still words its refusal the way the
      # guard matches on.
      - 'rust-toolchain.toml'
  push:
    branches:
      - trunk
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_disk_guard.sh'
      - '.github/workflows/signoff_disk_guard_test.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-signoff-disk-guard:
    name: Unit tests for the sign-off disk guard
    # GitHub-hosted on purpose: the assertions themselves are sub-second and must
    # not queue behind the saturated self-hosted pool — the same pool whose full
    # disks this guard exists to report. The Rust setup below is the only slow
    # part, and it buys the one thing a stub cannot: the real cargo diagnostic.
    runs-on: ubuntu-24.04
    # Sized for the toolchain install; the assertions themselves are seconds.
    timeout-minutes: 20
    # A checkout, a toolchain, and a local bash script against stub binaries —
    # the job reads the repository and nothing else, so it needs no write scope.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lockfile cases drive the *pinned* cargo against a fixture whose lock
      # really is stale, so that a reworded '--locked' diagnostic fails here
      # rather than quietly retiring the guard. The test treats an unavailable
      # pinned toolchain as a failure under GITHUB_ACTIONS rather than as a skip,
      # so without this step the job would go red — the right direction, but not
      # a useful signal.
      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Run tests
        # Invoked through 'bash' rather than as a path so the job does not depend
        # on the script's executable bit surviving a checkout on every platform.
        run: bash scripts/test_signoff_disk_guard.sh
