name: htap benchmark tests
run-name: CH-BenCHmark - ${{ github.event.inputs.spicepod_path }} - SF${{ github.event.inputs.scale_factor }} - ${{ github.event.inputs.duration }}s

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with (relative to test/spicepods/chbench/)'
        required: true
        type: string
      scale_factor:
        description: 'Scale factor (warehouses). Terminals = scale_factor * 10.'
        required: false
        type: string
        default: '1'
      terminals:
        description: 'Override OLTP terminal count (default: scale_factor * 10)'
        required: false
        type: string
      rate:
        description: 'Target OLTP transaction rate (txns/sec); empty = unlimited'
        required: false
        type: string
      duration:
        description: 'Duration of the HTAP workload in seconds'
        required: false
        type: string
        default: '600'
      concurrency:
        description: 'Number of concurrent analytical query clients'
        required: false
        type: string
        default: '4'
      query_overrides:
        description: 'Query overrides for the accelerator under test. Decides the measured query set (which only runs against spiced), so runs differing only in their source stay comparable.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'duckdb'
          - 'chbench-skip-slow'
      source_query_overrides:
        description: 'Additional query overrides for the source engine, applied only to the analytical-correctness gate (which runs each query on the source as well as spiced). Never shrinks the measured query set.'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'duckdb'
          - 'chbench-skip-slow'
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start'
        required: true
        default: '300'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-xlarge-runners'
        type: choice
        options:
          - 'spiceai-dev-large-runners'
          - 'spiceai-dev-xlarge-runners'
      collect_diagnostics:
        description: 'Capture additional diagnostics'
        required: false
        default: false
        type: boolean
      skip_analytic_gate:
        description: 'Skip the analytical-query correctness gate (re-runs every CH-benCH query against source + Spice and diffs results) to save time on experiments; the row-count gate still runs. Scheduled runs always leave this false.'
        required: false
        default: false
        type: boolean
      spiced_env:
        description: 'Extra environment variables for the spiced process under test, one SPICE_KEY=VALUE or SPICED_KEY=VALUE per line (e.g. SPICE_CAYENNE_EAGER_NDV=true). A handful of reserved SPICE*/SPICED* names owned by this workflow or testoperator (SPICED_COMMIT, SPICED_BIN, SPICED_ENV_INPUT, SPICED_KEEP_ALIVE) are rejected. Applied only to the benchmark run, never to template seeding, so it never invalidates the cached CH-benCH template. Do not put secrets here: values are echoed into the job summary.'
        required: false
        default: ''
        type: string

# Serialize ALL SF100 + SF1000 CH-benCHmark runs across every variant (sqlite/turso cdc-tuned,
# adaptive, duckdb): they share ONE concurrency group keyed only by scale factor, so
# only one runs at any time on the shared xlarge runner pool. Overlapping heavy CDC runs would
# contend for runners and skew each other's freshness/QPH numbers. cancel-in-progress is false so
# an in-flight benchmark is never killed mid-run. Other scale factors (e.g. manual SF1/SF10 runs)
# get a unique group (github.run_id) and stay parallel.
#
# queue: max keeps up to 100 runs pending in the group, processed first-in-first-out by the time
# each started waiting. So a batch dispatched faster than runs complete queues FIFO instead of the
# newer pending run superseding (cancelling) the older one, which is the default (queue: single).
# This is what lets the dispatcher fire a whole batch at once and let GitHub serialize it, rather
# than blocking to feed runs one at a time; see testoperator_dispatch_htap.yml.
concurrency:
  group: ${{ (github.event.inputs.scale_factor == '100' || github.event.inputs.scale_factor == '1000') && 'chbench-htap-sf100-sf1000' || github.run_id }}
  cancel-in-progress: false
  queue: max

jobs:
  run-htap:
    name: Run CH-BenCHmark
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Set spicepod path
        id: set_spicepod_path
        run: |
          SPICEPOD_PATH="./test/spicepods/chbench/${{ github.event.inputs.spicepod_path }}"
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT
          # Derive the source database from the spicepod filename so the DB setup can
          # never disagree with the spicepod under test. By convention the connector is
          # the filename prefix (`{connector[variant]}-{accelerator}-...`), e.g.
          # `mysql-cayenne[file].yaml` or `federated/mysql.yaml`. Anything not `mysql*`
          # is Postgres (the only other CH-benCH source today).
          case "$(basename "${SPICEPOD_PATH}")" in
            mysql*) SOURCE_TYPE=mysql ;;
            *)      SOURCE_TYPE=postgres ;;
          esac
          echo "SOURCE_TYPE=${SOURCE_TYPE}" >> $GITHUB_OUTPUT
          echo "Derived source_type=${SOURCE_TYPE} from spicepod $(basename "${SPICEPOD_PATH}")"

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      # Write the commit + high-level config to the job summary up front, so the
      # run is identifiable and reproducible even if it crashes mid-run. Results
      # are appended after the run below.
      - name: Write run summary header
        env:
          # Piped through env (never interpolated with ${{ }} into the script body) so an
          # input containing shell metacharacters (e.g. `$(...)`) is inert data, not code the
          # shell re-parses. See the "Export extra spiced env vars" step below for the same
          # rule applied to the actual export.
          SPICED_ENV_INPUT: ${{ github.event.inputs.spiced_env }}
        run: |
          # Flatten to one line and escape Markdown table-breaking characters (`|`, backtick,
          # CR) so a multi-entry or adversarial value can't corrupt the summary table.
          extra_spiced_env="none"
          if [ -n "$SPICED_ENV_INPUT" ]; then
            # awk 'NF' drops blank/whitespace-only lines before joining, so input that's
            # only blank lines (e.g. a stray trailing newline) collapses to "none" below
            # instead of a meaningless "; ; " row. (awk never fails on zero matches, unlike
            # grep, so this stays safe under the runner's `set -eo pipefail`.)
            extra_spiced_env=$(printf '%s' "$SPICED_ENV_INPUT" \
              | tr -d '\r' \
              | awk 'NF' \
              | tr '\n' ';' | sed 's/;$//; s/;/; /g' \
              | sed 's/`/\&#96;/g; s/|/\\|/g')
            [ -z "$extra_spiced_env" ] && extra_spiced_env="none"
          fi
          {
            echo "## CH-BenCHmark run"
            echo ""
            echo "| Parameter | Value |"
            echo "| --- | --- |"
            echo "| spiced commit | \`${{ steps.setup-spiced.outputs.SPICED_COMMIT }}\` |"
            echo "| testoperator commit | \`${{ github.sha }}\` |"
            echo "| spicepod | \`${{ github.event.inputs.spicepod_path }}\` |"
            echo "| source database | ${{ steps.set_spicepod_path.outputs.SOURCE_TYPE }} |"
            echo "| scale factor (warehouses) | ${{ github.event.inputs.scale_factor }} |"
            echo "| terminals | ${{ github.event.inputs.terminals || 'scale_factor × 10' }} |"
            echo "| target OLTP rate | ${{ github.event.inputs.rate || 'unlimited' }} |"
            echo "| duration (s) | ${{ github.event.inputs.duration }} |"
            echo "| analytical concurrency | ${{ github.event.inputs.concurrency }} |"
            echo "| query overrides (accelerator) | ${{ github.event.inputs.query_overrides || 'none' }} |"
            echo "| query overrides (source, gate only) | ${{ github.event.inputs.source_query_overrides || 'none' }} |"
            echo "| runner | ${{ github.event.inputs.runner_type }} |"
            echo "| analytic gate | ${{ github.event.inputs.skip_analytic_gate == 'true' && 'skipped' || 'enabled' }} |"
            echo "| extra spiced env | ${extra_spiced_env} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator

      # On spiceai-dev-xlarge-runners a dedicated in-cluster PostgreSQL pod is used,
      # so skip the local docker Postgres there.
      - name: Setup CH-benCH PostgreSQL
        if: steps.set_spicepod_path.outputs.SOURCE_TYPE != 'mysql' && github.event.inputs.runner_type != 'spiceai-dev-xlarge-runners'
        uses: ./.github/actions/setup-chbench-postgres

      # MySQL source: on spiceai-dev-xlarge-runners a dedicated in-cluster MySQL
      # pod is used (chbench-mysql.dataplatform.svc.cluster.local, like Postgres),
      # so skip the local docker MySQL there.
      - name: Setup CH-benCH MySQL
        if: steps.set_spicepod_path.outputs.SOURCE_TYPE == 'mysql' && github.event.inputs.runner_type != 'spiceai-dev-xlarge-runners'
        uses: ./.github/actions/setup-chbench-mysql

      # The xlarge PG pod is long-lived, so cache a pristine seed as a Postgres
      # template database and restore chbench from it (FILE_COPY, seconds) instead
      # of re-seeding (~tens of minutes at SF1000). On a miss it seeds once via
      # `testoperator --prepare-only`, freezes the template, then restores. After
      # this the run below uses `--skip-prepare`. Ephemeral docker-PG runners have
      # nothing to cache, so they skip this and seed normally.
      - name: Restore or seed CH-benCH from template
        if: steps.set_spicepod_path.outputs.SOURCE_TYPE != 'mysql' && github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners'
        run: bash .github/scripts/chbench_template.sh
        env:
          SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
          TERMINALS: ${{ github.event.inputs.terminals }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          SPICED_BIN: /usr/local/bin/spiced
          CHBENCH_PG_HOST: chbench-postgres.dataplatform.svc.cluster.local
          CHBENCH_PG_PORT: '5432'
          CHBENCH_PG_USER: bench
          CHBENCH_PG_PASS: bench

      # MySQL counterpart: the long-lived pod runs a supervisor (chbench-mysql
      # chart) that keeps a pristine whole-data-dir snapshot and restores it with a
      # fast local file copy, done COLD while mysqld is stopped so a reset can't
      # corrupt InnoDB. This step only drives it over the MySQL connection: on a
      # hit it issues a `restore`, on a miss it seeds once via `testoperator
      # --prepare-only` then issues a `snapshot`. After this the run below uses
      # `--skip-prepare`. Ephemeral docker-MySQL runners have no supervisor, so
      # they skip this and seed normally.
      - name: Restore or seed CH-benCH MySQL from template
        if: steps.set_spicepod_path.outputs.SOURCE_TYPE == 'mysql' && github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners'
        # Backstop so a wedged seed/restore (e.g. a DROP blocked on a stale lock)
        # fails THIS step fast and attributably, instead of silently consuming the
        # whole 120-min job budget and reporting a confusing "cancelled". A cold
        # SF1000 CSV seed finishes comfortably under this; exceeding it means the
        # seed is stuck.
        timeout-minutes: 90
        run: bash .github/scripts/chbench_template_mysql.sh
        env:
          SCALE_FACTOR: ${{ github.event.inputs.scale_factor }}
          TERMINALS: ${{ github.event.inputs.terminals }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          SPICED_BIN: /usr/local/bin/spiced
          CHBENCH_MYSQL_HOST: chbench-mysql.dataplatform.svc.cluster.local
          CHBENCH_MYSQL_PORT: '3306'
          CHBENCH_MYSQL_USER: bench
          CHBENCH_MYSQL_PASS: bench
          CHBENCH_MYSQL_DB: chbench

      # Deliberately placed after template restore/seed above: these vars must never be
      # visible to the `--prepare-only` seed run, or an experiment could silently change
      # what gets frozen into the cached template. $GITHUB_ENV persists for every later
      # step in this job (not just "Run CH-benCHmark"), so seeding is protected but
      # subsequent diagnostics/cleanup steps also see these vars.
      - name: Export extra spiced env vars
        if: github.event.inputs.spiced_env != ''
        env:
          # Piped through env, not interpolated into the script via ${{ }} — the input is
          # untrusted (free text from workflow_dispatch), and embedding it directly into the
          # `run:` body would let shell metacharacters (e.g. `$(...)`) execute as the script
          # is parsed, not just as inert data.
          SPICED_ENV_INPUT: ${{ github.event.inputs.spiced_env }}
        run: |
          # Allowlist SPICE_* / SPICED_* (underscore required, so e.g. SPICEAI_* or bare
          # SPICE/SPICED don't slip through) — covers both naming conventions used across
          # the codebase, e.g. SPICE_CAYENNE_EAGER_NDV, SPICED_METRICS_ADDR — so a
          # dispatcher can never overwrite reserved runner/Actions variables (GITHUB_*,
          # RUNNER_*, ACTIONS_*, PATH, HOME, ...) or otherwise alter the runner
          # environment outside spiced's own config.
          #
          # A few SPICE_*/SPICED_* names ARE reserved even though they match that prefix:
          # they're owned by this workflow (provenance, internal plumbing) rather than
          # being spiced runtime config, so letting a dispatcher spoof them would corrupt
          # results/metrics attribution or the export mechanism itself.
          # SPICED_KEEP_ALIVE is a testoperator debug knob that blocks waiting on stdin
          # (see tools/testoperator/src/commands/htap/mod.rs) — letting a dispatcher set
          # it would hang the CI run indefinitely rather than just tweak spiced config.
          reserved_names="SPICED_COMMIT SPICED_BIN SPICED_ENV_INPUT SPICED_KEEP_ALIVE"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            # Skip blank/whitespace-only lines (consistent with the summary-header
            # step's `awk 'NF'`), so copy/paste padding doesn't fail the run.
            [[ "$line" =~ ^[[:space:]]*$ ]] && continue
            key="${line%%=*}"
            reserved=0
            for r in $reserved_names; do
              [ "$key" = "$r" ] && reserved=1 && break
            done
            if [[ "$line" != *"="* ]] || [[ ! "$key" =~ ^SPICED?_[A-Za-z0-9_]+$ ]] || [ "$reserved" = "1" ]; then
              # Workflow-command values must have %, CR, LF escaped (%25/%0D/%0A) or an
              # untrusted line containing them could corrupt the log or smuggle in
              # additional workflow commands.
              escaped="${line//%/%25}"
              escaped="${escaped//$'\r'/%0D}"
              escaped="${escaped//$'\n'/%0A}"
              echo "::error::Invalid spiced_env entry (must be SPICE_KEY=VALUE or SPICED_KEY=VALUE, and KEY must not be a reserved name): ${escaped}"
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$SPICED_ENV_INPUT"

      - name: Run CH-benCHmark - ${{ github.event.inputs.spicepod_path }}
        run: |
          set -o pipefail
          # On the xlarge runner (64-core EPYC, 2 threads/core, SMT siblings are
          # cpu N and cpu 64+N), pin spiced and testoperator to whole physical
          # cores so they don't contend — not even via hyperthread siblings:
          #   spiced       -> cores 0-31  (logical CPUs 0-31,64-95   = 64 threads)
          #   testoperator -> cores 32-37 (logical CPUs 32-37,96-101 = 12 threads)
          SPICED_BIN=/usr/local/bin/spiced
          TESTOP_PREFIX=""
          if [ "${{ github.event.inputs.runner_type }}" = "spiceai-dev-xlarge-runners" ] && command -v taskset >/dev/null 2>&1; then
            cat > /tmp/spiced-pinned.sh <<'EOF'
          #!/usr/bin/env bash
          exec taskset -c 0-31,64-95 /usr/local/bin/spiced "$@"
          EOF
            chmod +x /tmp/spiced-pinned.sh
            SPICED_BIN=/tmp/spiced-pinned.sh
            TESTOP_PREFIX="taskset -c 32-37,96-101"
            echo "CPU pinning: spiced -> 64 logical CPUs, testoperator -> 12 logical CPUs"
          fi

          # Optionally capture under-load troubleshooting artifacts
          DIAG_DIR="${GITHUB_WORKSPACE}/htap-diagnostics"
          DIAG_PIDS=""
          if [ "${{ github.event.inputs.collect_diagnostics }}" = "true" ]; then
            mkdir -p "$DIAG_DIR"
            OUTDIR="$DIAG_DIR" HTTP_HOST=localhost HTTP_PORT=8090 \
              EXPLAIN_QUERIES=all EXPLAIN_INTERVAL=30 READY_TIMEOUT=3600 \
              bash scripts/htap-explain-probe.sh > "$DIAG_DIR/explain-probe.log" 2>&1 &
            DIAG_PIDS="$DIAG_PIDS $!"
            echo "diagnostics probes backgrounded (pids$DIAG_PIDS) -> $DIAG_DIR"
          fi

          set +e
          $TESTOP_PREFIX testoperator run htap \
            -s "${SPICED_BIN}" \
            -p '${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}' \
            --source-type ${{ steps.set_spicepod_path.outputs.SOURCE_TYPE }} \
            --query-set chbench \
            --scale-factor ${{ github.event.inputs.scale_factor }} \
            ${{ github.event.inputs.terminals && format('--terminals {0}', github.event.inputs.terminals) || '' }} \
            ${{ github.event.inputs.rate && format('--rate {0}', github.event.inputs.rate) || '' }} \
            --duration ${{ github.event.inputs.duration }} \
            --concurrency ${{ github.event.inputs.concurrency }} \
            ${{ github.event.inputs.query_overrides != '' && format('--query-overrides {0}', github.event.inputs.query_overrides) || '' }} \
            ${{ github.event.inputs.source_query_overrides != '' && format('--source-query-overrides {0}', github.event.inputs.source_query_overrides) || '' }} \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            ${{ github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners' && '--skip-prepare' || '' }} \
            ${{ github.event.inputs.skip_analytic_gate == 'true' && '--skip-analytic-gate' || '' }} \
            ${{ steps.set_spicepod_path.outputs.SOURCE_TYPE == 'mysql' && '--analytic-gate-concurrency 16' || '' }} \
            --disable-progress-bars \
            --metrics \
            --metrics-dump "${GITHUB_WORKSPACE}/htap-metrics.json" \
            --summary-out "${GITHUB_WORKSPACE}/htap-summary.md" 2>&1 | tee "${GITHUB_WORKSPACE}/htap-run.log"
          # ${PIPESTATUS[0]} is testoperator's real exit (not tee's), so a failed
          # run fails the step even though it is piped to tee — this also avoids the
          # false-green where a benchmark/ready-wait timeout reported success.
          testop_exit=${PIPESTATUS[0]}
          set -e
          echo "testoperator exit code: ${testop_exit}"

          # Stop the diagnostics probes (spiced exits after this step, so they
          # self-terminate anyway); propagate testoperator's real exit code.
          [ -n "$DIAG_PIDS" ] && kill $DIAG_PIDS 2>/dev/null || true
          exit $testop_exit
        env:
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          # Dedicated in-cluster PG pod on xlarge; per-run docker container (loopback) elsewhere.
          CHBENCH_PG_HOST: ${{ github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners' && 'chbench-postgres.dataplatform.svc.cluster.local' || '127.0.0.1' }}
          # Dedicated in-cluster MySQL pod on xlarge; per-run docker container (loopback) elsewhere. Used only when the spicepod is a MySQL source.
          CHBENCH_MYSQL_HOST: ${{ github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners' && 'chbench-mysql.dataplatform.svc.cluster.local' || '127.0.0.1' }}
          # MinIO credentials for spiced, mirroring testoperator_run_bench.yml. Consumed only by
          # configs that reference the local S3 (`${secrets:S3_ENDPOINT}` etc.) — e.g. the Cayenne
          # cold-object-store-tier chbench config; harmless/unused for every other HTAP config.
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      # Upload the under-load diagnostics dir
      - name: Upload HTAP diagnostics
        if: always() && github.event.inputs.collect_diagnostics == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: htap-diagnostics-sf${{ github.event.inputs.scale_factor }}-${{ github.run_id }}
          path: htap-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # Append the headline results (tpmC, QPH, worst replication lag, per-query
      # latencies) to the job summary so the outcome is visible without opening the
      # run log. testoperator writes this Markdown via --summary-out. Runs even on
      # failure (a partial summary is still useful).
      - name: Render results to summary
        if: always()
        run: |
          if [ -f "${GITHUB_WORKSPACE}/htap-summary.md" ]; then
            cat "${GITHUB_WORKSPACE}/htap-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No results summary produced (run did not reach the reporting stage)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Render the CDC-backpressure waterfall from the metrics dump into the job
      # summary so the "where is CDC falling behind" attribution is visible without
      # downloading the artifact. Runs even if the benchmark failed (partial data
      # is still diagnostic).
      - name: Render backpressure waterfall to summary
        if: always()
        run: |
          if [ -f "${GITHUB_WORKSPACE}/htap-metrics.json" ]; then
            echo "## CDC backpressure waterfall" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            python3 scripts/chbench-waterfall.py "${GITHUB_WORKSPACE}/htap-metrics.json" \
              >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(waterfall analysis failed; see htap-metrics.json artifact)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No metrics dump produced (run did not reach the reporting stage)._" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Persist the raw metrics time-series + run log so runs are diffable and the
      # waterfall can be re-run offline against different thresholds.
      - name: Upload metrics dump + run log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: htap-metrics-sf${{ github.event.inputs.scale_factor }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/htap-metrics.json
            ${{ github.workspace }}/htap-run.log
            ${{ github.workspace }}/htap-summary.md
          if-no-files-found: warn
          retention-days: 30

      # The dedicated PG pod is long-lived and shared across runs, so a crashed
      # or cancelled run can leave inactive replication slots (which retain WAL
      # and eventually fill the disk) and orphaned publications. Drop any left
      # behind. testoperator already drops its tables/publication at the start of
      # the next run, but inactive slots are not covered by that.
      - name: Clean up PG replication slots
        if: always() && steps.set_spicepod_path.outputs.SOURCE_TYPE != 'mysql' && github.event.inputs.runner_type == 'spiceai-dev-xlarge-runners'
        env:
          CHBENCH_PG_HOST: chbench-postgres.dataplatform.svc.cluster.local
          CHBENCH_PG_PORT: '5432'
          CHBENCH_PG_USER: bench
          CHBENCH_PG_PASS: bench
          CHBENCH_PG_DB: chbench
        run: |
          cat > /tmp/chbench-slot-cleanup.sql <<'SQL'
          DO $$
          DECLARE r RECORD;
          BEGIN
            FOR r IN
              SELECT slot_name FROM pg_replication_slots
              WHERE slot_name LIKE 'spice_%' AND NOT active
            LOOP
              RAISE NOTICE 'dropping replication slot %', r.slot_name;
              PERFORM pg_drop_replication_slot(r.slot_name);
            END LOOP;
            FOR r IN
              SELECT pubname FROM pg_publication WHERE pubname LIKE 'spice_%'
            LOOP
              RAISE NOTICE 'dropping publication %', r.pubname;
              EXECUTE format('DROP PUBLICATION IF EXISTS %I', r.pubname);
            END LOOP;
          END $$;
          SQL
          if ! command -v psql >/dev/null 2>&1; then
            echo "psql not found; installing postgresql-client..."
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client || true
          fi
          if command -v psql >/dev/null 2>&1; then
            PGPASSWORD="${CHBENCH_PG_PASS}" psql \
              -h "${CHBENCH_PG_HOST}" -p "${CHBENCH_PG_PORT}" \
              -U "${CHBENCH_PG_USER}" -d "${CHBENCH_PG_DB}" \
              -v ON_ERROR_STOP=0 -f /tmp/chbench-slot-cleanup.sql || true
          else
            echo "No psql client available; skipping replication slot cleanup."
          fi

      # The MinIO `benchmarks` bucket is shared across runs, so the Cayenne datalake (cold) tier
      # (cayenne_datalake_location: s3://benchmarks/cayenne-cold-*/) would otherwise accumulate
      # cold files every run: each promotion writes a new UUID-named prefix and nothing GCs them
      # (the query path reads the metastore manifest, never an S3 listing, so a fresh run never
      # references a prior run's objects — they are dead weight, not a collision). Drop the whole
      # cold prefix after the run. Gated to the cold configs (any `-cold` spicepod); `mc` + the
      # `spice-minio` alias come from the Install MinIO step above. Runs on failure/cancel too so a
      # crashed run leaves no orphans.
      - name: Clean up Cayenne datalake-tier S3 objects
        if: always() && contains(github.event.inputs.spicepod_path, '-cold')
        run: |
          if command -v mc >/dev/null 2>&1; then
            # Non-fatal: a cleanup miss must never fail the benchmark run, so every mc call is guarded
            # with `|| true`. We print a one-line size/count summary per prefix (mc du) before deleting.
            for prefix in cayenne-cold-sf1000 cayenne-cold-sf10; do
              target="spice-minio/benchmarks/${prefix}/"
              summary=$(mc du "${target}" 2>/dev/null || true)
              echo "Cleaning ${target} — ${summary:-empty (no promotion ran)}"
              mc rm --recursive --force "${target}" >/dev/null 2>&1 || true
            done
          else
            echo "mc client not found; skipping datalake-tier S3 cleanup."
          fi
