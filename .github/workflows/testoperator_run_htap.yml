name: htap benchmark tests
run-name: CH-BenCHmark - ${{ github.event.inputs.spicepod_path }} - SF${{ github.event.inputs.scale_factor }} - ${{ github.event.inputs.duration }}s

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with (relative to test/spicepods/chbench/)'
        required: true
        type: string
      scale_factor:
        description: 'Scale factor (warehouses). Terminals = scale_factor * 10.'
        required: false
        type: string
        default: '1'
      terminals:
        description: 'Override OLTP terminal count (default: scale_factor * 10)'
        required: false
        type: string
      rate:
        description: 'Target OLTP transaction rate (txns/sec); empty = unlimited'
        required: false
        type: string
      duration:
        description: 'Duration of the HTAP workload in seconds'
        required: false
        type: string
        default: '600'
      concurrency:
        description: 'Number of concurrent analytical query clients'
        required: false
        type: string
        default: '4'
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'duckdb'
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start'
        required: true
        default: '300'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-xlarge-runners'
        type: choice
        options:
          - 'spiceai-dev-large-runners'
          - 'spiceai-dev-xlarge-runners'
jobs:
  run-htap:
    name: Run CH-BenCHmark
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Set spicepod path
        id: set_spicepod_path
        run: |
          SPICEPOD_PATH="./test/spicepods/chbench/${{ github.event.inputs.spicepod_path }}"
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator

      - name: Setup CH-benCH PostgreSQL
        uses: ./.github/actions/setup-chbench-postgres

      - name: Start resource monitor
        run: |
          HZ=$(getconf CLK_TCK)
          echo -e "timestamp\tpg_cpu_pct\tpg_mem\tpg_block_io\tspiced_cpu_pct\tspiced_rss_kb\ttestop_cpu_pct\ttestop_rss_kb" > /tmp/resource-monitor.tsv

          # Delta-based CPU% over the last sampling interval, comparable to `docker stats`.
          # Reads /proc/<pid>/stat utime+stime ticks, divides by elapsed wall-clock × CLK_TCK.
          # Multi-threaded processes can exceed 100% (one core = 100). Returns "cpu_pct rss_kb".
          sample_proc () {
            local label=$1 pattern=$2
            local pid utime stime ticks now rss=0 pct=0
            pid=$(pgrep -x "$pattern" | head -1)
            if [ -z "$pid" ]; then
              rm -f /tmp/.mon."$label".pid /tmp/.mon."$label".ticks /tmp/.mon."$label".wall
              echo "0 0"; return
            fi
            read -r utime stime < <(awk '{print $14, $15}' /proc/"$pid"/stat 2>/dev/null) || { echo "0 0"; return; }
            ticks=$((utime + stime))
            now=$(date +%s%N)
            rss=$(awk '/^VmRSS:/{print $2}' /proc/"$pid"/status 2>/dev/null || echo 0)
            local prev_pid prev_ticks prev_wall
            prev_pid=$(cat /tmp/.mon."$label".pid 2>/dev/null || echo)
            prev_ticks=$(cat /tmp/.mon."$label".ticks 2>/dev/null || echo)
            prev_wall=$(cat /tmp/.mon."$label".wall 2>/dev/null || echo)
            if [ "$prev_pid" = "$pid" ] && [ -n "$prev_ticks" ] && [ -n "$prev_wall" ]; then
              local d_ticks=$((ticks - prev_ticks))
              local d_ns=$((now - prev_wall))
              [ "$d_ns" -le 0 ] && d_ns=1
              pct=$(awk -v d="$d_ticks" -v ns="$d_ns" -v h="$HZ" 'BEGIN{ if (d<0) d=0; printf "%.1f", (d / (ns/1e9 * h)) * 100 }')
            fi
            echo "$pid"   > /tmp/.mon."$label".pid
            echo "$ticks" > /tmp/.mon."$label".ticks
            echo "$now"   > /tmp/.mon."$label".wall
            echo "$pct $rss"
          }

          (while true; do
            ts=$(date -u +%H:%M:%S)
            pg=$(docker stats chbench-pg --no-stream --format "{{.CPUPerc}}\t{{.MemUsage}}\t{{.BlockIO}}" 2>/dev/null || echo -e "0%\t0\t0")
            read -r spiced_cpu spiced_rss <<< "$(sample_proc spiced spiced)"
            read -r testop_cpu testop_rss <<< "$(sample_proc testop testoperator)"
            echo -e "${ts}\t${pg}\t${spiced_cpu}\t${spiced_rss}\t${testop_cpu}\t${testop_rss}" >> /tmp/resource-monitor.tsv
            sleep 10
          done) &
          echo $! > /tmp/monitor-pid.txt
          echo "Resource monitor started (PID: $(cat /tmp/monitor-pid.txt))"

      - name: Run CH-benCHmark - ${{ github.event.inputs.spicepod_path }}
        run: |
          testoperator run htap \
            -s /usr/local/bin/spiced \
            -p '${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}' \
            --query-set chbench \
            --scale-factor ${{ github.event.inputs.scale_factor }} \
            ${{ github.event.inputs.terminals && format('--terminals {0}', github.event.inputs.terminals) || '' }} \
            ${{ github.event.inputs.rate && format('--rate {0}', github.event.inputs.rate) || '' }} \
            --duration ${{ github.event.inputs.duration }} \
            --concurrency ${{ github.event.inputs.concurrency }} \
            ${{ github.event.inputs.query_overrides != '' && format('--query-overrides {0}', github.event.inputs.query_overrides) || '' }} \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            --disable-progress-bars \
            --metrics
        env:
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          CHBENCH_PG_HOST: 127.0.0.1

      - name: Stop resource monitor
        if: always()
        run: |
          if [ -f /tmp/monitor-pid.txt ]; then
            kill "$(cat /tmp/monitor-pid.txt)" 2>/dev/null || true
          fi

      - name: Upload resource monitor
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resource-monitor
          path: /tmp/resource-monitor.tsv
          retention-days: 7
