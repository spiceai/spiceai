name: Build testoperator binary and Docker Image

on:
  push:
    branches:
      - trunk
    paths:
      - 'tools/testoperator/**'
      - 'crates/test-framework/**'
      - 'Cargo.lock'
      - '.github/workflows/testoperator_build_and_release.yml'
      - '.github/actions/build-testoperator/**'

  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish Docker image to GHCR'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
jobs:
  build-binary:
    environment: ci
    name: Build testoperator
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '21600'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build testoperator
        uses: $/.github/actions/build-testoperator
        with:
          install_to_system_path: 'false'
          upload_artifact: 'true'
          force_rebuild: 'true'
          download_from_minio: 'true'
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Print version
        run: ./target/release/testoperator --version

  build-docker:
    name: Build Docker image
    needs: build-binary
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: testoperator-linux
          path: ./build

      - name: List artifacts
        run: ls -lR ./build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

      - name: Login to Docker Hub
        # Authenticate to Docker Hub before building so the base image pull
        # uses the authenticated rate limits instead of anonymous (per-IP) limits.
        if: github.repository == 'spiceai/spiceai'
        uses: docker/login-action@v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '21600'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy Dockerfile to build context
        run: cp tools/testoperator/Dockerfile ./build/Dockerfile

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./build
          file: ./build/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/testoperator:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/testoperator:latest
          cache-from: type=gha,scope=testoperator
          cache-to: type=gha,scope=testoperator,mode=max
