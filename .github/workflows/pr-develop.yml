---
name: pr-develop

on:
  pull_request:
    branches:
      - develop
  merge_group:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'develop' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  IGNORED_PATHS: '(^./docs/|^README.md$|^version.txt$|^acknowledgements.md$)'
  RUST_PROFILE: lint
  CONTAINER_REGISTRY: spiceaitestimages.azurecr.io/
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  check_changes:
    name: Check for code changes
    runs-on: spiceai-macos
    outputs:
      relevant_changes: ${{ steps.check.outputs.relevant_changes }}
      integration_tests_changed: ${{ steps.check_integration.outputs.integration_tests }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}

      - name: Check for code changes
        id: check
        uses: ./.github/actions/check-code-changes

      - name: Check for integration test changes
        id: check_integration
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            integration_tests:
              - 'crates/runtime/tests/**'
              - 'crates/runtime-table-partition/tests/**'


  check:
    name: Rust Lint
    needs: check_changes
    if: needs.check_changes.outputs.relevant_changes == 'true'
    runs-on: spiceai-macos

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up spiceio
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@07f50ad2b40d272a857ca2483712d8b0ade6480b # v0.5.0
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo check
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: cargo check --all-targets --features adbc,aws-secrets-manager,keyring-secret-store,models,release,mcp --workspace --exclude libnfs --locked

      - name: Validate datafusion-table-providers commit
        run: bash .github/scripts/validate_table_providers_commit.sh
        env:
          BRANCH: spiceai-52

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Kill spiceio
        if: always() && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      - name: Upload spiceio logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: spiceio-check-logs
          path: ${{ runner.temp }}/spiceio.log
          if-no-files-found: ignore

  build-and-test:
    name: Build and Test
    needs: check_changes
    if: needs.check_changes.outputs.relevant_changes == 'true'
    runs-on: spiceai-macos

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up spiceio
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@07f50ad2b40d272a857ca2483712d8b0ade6480b # v0.5.0
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Build CLI and run nextest
        run: make build-cli nextest
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
          RUST_PROFILE: ${{ env.RUST_PROFILE }}
          NEXTEST_FLAG: "--exclude libnfs --exclude connector-nfs -E 'not (package(aws-sdk-credential-bridge) | package(object_store_occ))'"

      - name: Build testoperator
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: cargo build -p testoperator --all-features --locked

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Check if Cargo.lock is updated
        run: |
          if git diff --exit-code Cargo.lock; then
            echo "Cargo.lock is up to date"
          else
            echo "Update Cargo.lock"
            exit 1
          fi

      - name: Kill spiceio
        if: always() && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      - name: Upload spiceio logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: spiceio-build-logs
          path: ${{ runner.temp }}/spiceio.log
          if-no-files-found: ignore

  # Build integration tests archive - only run if integration tests have changed
  integration-build:
    name: Build Integration Tests
    needs: check_changes
    runs-on: spiceai-dev-runners
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        if: needs.check_changes.outputs.integration_tests_changed == 'true'

      - name: Set up Rust
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: ./.github/actions/setup-rust

      - name: Set up spiceio
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@07f50ad2b40d272a857ca2483712d8b0ade6480b # v0.5.0
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1

      - name: Set up sccache
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Set up Nextest
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: ./.github/actions/setup-nextest

      - name: Install Protoc
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up cc
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: ./.github/actions/setup-cc

      - name: Build integration test archive
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
        run: |
          FEATURES="postgres,mysql,delta_lake,duckdb,sqlite,spark,databricks,dynamodb,oracle,kafka,iceberg-write,snapshots,mongodb"
          cargo nextest archive -p runtime --test integration --features ${FEATURES} --archive-file integration.tar.zst --locked

      - name: Upload test archive
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: integration-test-archive-develop
          path: ./integration.tar.zst
          retention-days: 1

      - name: Show sccache stats
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        run: sccache --show-stats

      - name: Kill spiceio
        if: always() && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  # Run integration tests matrix - only run if integration tests have changed
  integration-tests:
    name: Integration Tests [${{ matrix.partition }}]
    needs: [check_changes, integration-build]
    runs-on: spiceai-dev-runners
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: ['count:1/3', 'count:2/3', 'count:3/3']

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        if: needs.check_changes.outputs.integration_tests_changed == 'true'

      - name: Set up Nextest
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: ./.github/actions/setup-nextest

      - name: Download test archive
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: integration-test-archive-develop

      - name: Login to ACR
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: spiceaitestimages.azurecr.io
          username: spiceai-repo-pull
          password: ${{ secrets.AZCR_PASSWORD }}

      - name: Pull the Postgres/MySQL images
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        run: |
          docker pull ${{ env.CONTAINER_REGISTRY }}postgres:latest
          docker pull ${{ env.CONTAINER_REGISTRY }}mysql:latest

      - name: Set up Spice.ai API Key
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        run: |
          echo 'SPICEAI_API_KEY="${{ secrets.SPICE_SECRET_SPICEAI_KEY }}"' > .env

      - name: Set up Github Token
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v2
        id: github-app-token
        with:
          app-id: ${{ vars.ORG_MEMBERS_GITHUB_APP_ID }}
          private-key: ${{ secrets.ORG_MEMBERS_GITHUB_PRIVATE_KEY }}
          owner: spiceai
          repositories: |
            spiceai

      - name: Run integration tests
        if: needs.check_changes.outputs.integration_tests_changed == 'true'
        env:
          AWS_EC2_METADATA_DISABLED: true
          SPICE_SECRET_SPICEAI_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_KEY }}
          GITHUB_ORG_TOKEN: ${{ steps.github-app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MinIO/S3-compatible storage
          MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          MINIO_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          # Databricks (old)
          TEST_DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          TEST_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TEST_DATABRICKS_CLUSTER_ID: ${{ secrets.DATABRICKS_CLUSTER_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
          # Databricks (new)
          NEW_DATABRICKS_HOST: ${{ secrets.NEW_DATABRICKS_HOST }}
          NEW_DATABRICKS_CLUSTER_ID: ${{ secrets.NEW_DATABRICKS_CLUSTER_ID }}
          NEW_DATABRICKS_SP_CLIENT_ID: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_ID }}
          NEW_DATABRICKS_SP_CLIENT_SECRET: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_SECRET }}
          NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
          NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
          SPICEAI_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
          # AWS/Iceberg/Glue
          AWS_ICEBERG_ACCESS_KEY_ID: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_ICEBERG_SECRET_ACCESS_KEY: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_ICEBERG_REGION: ${{ secrets.AWS_ICEBERG_REGION }}
          AWS_ICEBERG_ACCOUNT_ID: ${{ secrets.AWS_ICEBERG_ACCOUNT_ID }}
          AWS_GLUE_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_GLUE_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          # DynamoDB
          AWS_DYNAMODB_KEY: ${{ secrets.AWS_DYNAMODB_ACCESS_KEY_ID }}
          AWS_DYNAMODB_SECRET: ${{ secrets.AWS_DYNAMODB_SECRET_ACCESS_KEY }}
          # Oracle
          ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
          ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
          ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
          ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
          # S3/Snapshots
          AWS_SNAPSHOT_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_SNAPSHOT_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
          AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
        run: |
          set -euo pipefail
          if [ -n "${SPICE_SECRET_SPICEAI_KEY:-}" ]; then
            INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --partition '${{ matrix.partition }}' --archive-file integration.tar.zst
          else
            INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --partition '${{ matrix.partition }}' --archive-file integration.tar.zst --skip spiceai_integration_test
          fi
