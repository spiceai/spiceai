---
name: Sign-off Attestation-Refresh Tests

# `refresh_attestation_check` re-runs the PR's `pr.yml` run so `Attestation`
# re-reads the `signoff` status a sign-off just posted. It selects that run by
# commit, and a remote sign-off can run for hours — so when the branch has moved,
# re-running the stale commit's run cancels the current head's in-flight one and
# reports a verdict computed for the wrong commit (#12360).
#
# Both directions matter and neither is observable in production until it has
# already cost someone a required check: skipping too eagerly would silently stop
# refreshing legitimate sign-offs (the "no PR yet" and "lookup failed" cases),
# and not skipping is the bug.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_attestation_refresh.sh'
      - '.github/workflows/signoff_attestation_refresh_test.yml'
  push:
    branches:
      - trunk
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_attestation_refresh.sh'
      - '.github/workflows/signoff_attestation_refresh_test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-signoff-attestation-refresh:
    name: Unit tests for the sign-off Attestation refresh
    # GitHub-hosted on purpose: this is a sub-second check and must not queue
    # behind the self-hosted pool that runs sign-off itself.
    runs-on: ubuntu-24.04
    # A checkout plus a local bash script against a stub `gh` — the job reads the
    # repository and nothing else. In particular it re-runs no workflow and posts
    # no status: the stub records those calls instead of making them.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        # Invoked through `bash` rather than as `./…` so the job does not depend
        # on the script's executable bit surviving a checkout on every platform.
        run: bash scripts/test_signoff_attestation_refresh.sh
