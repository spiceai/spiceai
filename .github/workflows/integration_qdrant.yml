---
name: integration tests (qdrant)

on:
  push:
    branches:
      - trunk
    paths:
      - 'crates/qdrant/**'
      - 'crates/data_components/src/qdrant/**'
      - 'crates/search/src/index/qdrant/**'
      - 'crates/runtime/src/embeddings/index/qdrant.rs'
      - 'crates/runtime-search/src/store_params/qdrant.rs'
      - 'crates/runtime-datafusion-udfs/**'
      - 'bin/spiced/Cargo.toml'
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      relevant: ${{ steps.check.outputs.relevant_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        uses: ./.github/actions/check-code-changes
        with:
          filters: |
            code_changes:
              - 'crates/qdrant/**'
              - 'crates/data_components/src/qdrant/**'
              - 'crates/search/src/index/qdrant/**'
              - 'crates/runtime/src/embeddings/index/qdrant.rs'
              - 'crates/runtime-search/src/store_params/qdrant.rs'
              - 'crates/runtime-datafusion-udfs/**'
              - 'bin/spiced/Cargo.toml'

  test-qdrant:
    name: Qdrant Integration Tests
    needs: changes
    timeout-minutes: 60
    if: ${{ needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: spiceai-dev-runners

    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Qdrant is ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:6333/readyz > /dev/null; then
              echo "Qdrant is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant failed to become ready"
          curl -s http://127.0.0.1:6333/readyz || true
          exit 1

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Run qdrant client tests
        env:
          QDRANT_ENDPOINT: http://127.0.0.1:6334
        run: |
          RUSTC_WRAPPER="" cargo test -p qdrant --test integration_test -- --nocapture
