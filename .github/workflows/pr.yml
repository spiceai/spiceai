---
name: pr

on:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  workflow_dispatch:
    inputs:
      profile_option:
        description: "Which Rust build profile to use? (Default is lint)"
        required: false
        type: choice
        options:
          - "lint"
          - "release"
          - "release-lto"
        default: "lint"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  IGNORED_PATHS: "(^./docs/|^README.md$|^version.txt$|^acknowledgements.md$)"
  RUST_PROFILE: ${{ github.event.inputs.profile_option || 'lint' }}

jobs:
  # `pr` is a required check for pull requests. Therefore we cannot skip the workflow via
  # `on.pull_requests.paths-ignore`. Instead, we conditionally run the jobs (which report
  # a sucess when skipped).
  check_changes:
    runs-on: spiceai-dev-runners
    outputs:
      relevant_changes: ${{ steps.check_changes.outputs.relevant_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect all code changes
        id: changed-code-files
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code_changes:
              - 'crates/**'
              - 'bin/**'
              - 'test/**'
              - 'tools/**'
              - 'install/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'go.mod'
              - 'go.sum'

      # Relevant changes are any code changes OR if this was workflow_dispatch
      - name: Check for relevant changes
        id: check_changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ steps.changed-code-files.outputs.code_changes }}" == "true" ]]; then
            echo "Detected relevant changes."
            echo "relevant_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No relevant changes detected."
            echo "relevant_changes=false" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Run Go & Rust Linters and Build
    runs-on: ubuntu-latest
    env:
      GOVER: 1.25.3
    needs: check_changes

    steps:
      - uses: actions/checkout@v5

      # Cache Cargo dependencies
      - name: Cache Cargo registry
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Cache Go modules
      - name: Cache Go modules
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Go
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVER }}
          cache: false

      - name: Install golangci-lint
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          if ! command -v golangci-lint &> /dev/null ; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin
          fi

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        if: needs.check_changes.outputs.relevant_changes == 'true'
        with:
          os: "linux"

      - name: Install Nextest
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ${CARGO_HOME:-~/.cargo}/bin

      - name: Install Protoc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - uses: rui314/setup-mold@v1

      # Cache Cargo dependencies
      - name: Restore target cache
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ./lint.tar.zst
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Decompress target cache
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          if [ -f ./lint.tar.zst ]; then
            sudo apt update
            sudo apt install zstd -y
            tar --use-compress-program="zstd -d" -xf lint.tar.zst target/lint/
            find target/lint/ -type f -exec touch {} +
          fi

      - run: make lint
        if: needs.check_changes.outputs.relevant_changes == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          RUST_PROFILE: ${{ env.RUST_PROFILE }}

      - name: push lint archive
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          tar --use-compress-program="zstd -T0 -1" -cf lint.tar.zst target/lint/
          ls -lh lint.tar.zst

      - name: force exit
        run: exit 1

      - name: Build CLI and run nextest
        run: make build-cli nextest
        if: needs.check_changes.outputs.relevant_changes == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          RUST_PROFILE: ${{ env.RUST_PROFILE }}
          AWS_S3_CLIENT_ID: ${{ secrets.AWS_S3_CLIENT_ID }}
          AWS_S3_IDENTITY_POOL_ID: ${{ secrets.AWS_S3_IDENTITY_POOL_ID }}
          AWS_S3_USERNAME: ${{ secrets.AWS_S3_USERNAME }}
          AWS_S3_PASSWORD: ${{ secrets.AWS_S3_PASSWORD }}
          AWS_COGNITO_IDP_URI: ${{ vars.AWS_COGNITO_IDP_URI }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          NEXTEST_FLAG: --features=xxhash

      - name: Check archive size
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          sudo apt update
          sudo apt install zstd -y
          tar --use-compress-program="zstd -T0 -1" -cf lint.tar.zst target/lint/
          ls -lh lint.tar.zst

      - if: needs.check_changes.outputs.relevant_changes == 'true'
        run: cargo build -p testoperator --all-features

      - name: Show sccache stats
        if: ${{ needs.check_changes.outputs.relevant_changes == 'true' && env.SCCACHE_SETUP == 'true' }}
        run: sccache --show-stats

      - name: Check if Cargo.lock is updated
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          if git diff --exit-code Cargo.lock; then
            echo "Cargo.lock is up to date"
          else
            echo "Update Cargo.lock"
            exit 1
          fi
