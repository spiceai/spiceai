name: e2e_test_cuda

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'build_and_release_cuda workflow run ID to download artifacts from'
        required: true
        type: string
      compute_cap:
        description: 'CUDA compute capability artifact to fetch'
        required: true
        type: choice
        options:
          - '80'
          - '86'
          - '87'
          - '89'
          - '90'
        default: '90'

jobs:
  cuda-e2e:
    name: CUDA E2E smoke test
    runs-on: ubuntu-gpu-t4-4-core
    timeout-minutes: 30
    env:
      ARTIFACT_DIR: ./artifacts
      RUNTIME_DIR: ./runtime
      APP_DIR: ./cuda-e2e-app
      CUDA_COMPUTE_CAP: ${{ github.event.inputs.compute_cap || '90' }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq tar

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@8022558310ea543e35132143092835585f60e628 # v0.2.21
        with:
          cuda: '12.6.0'
          method: network
          use-github-cache: false
          non-cuda-sub-packages: '["libcurand-dev", "libcublas","libcublas-dev"]'
          sub-packages: '["nvcc","compiler","libraries","libraries-dev","cudart","cudart-dev"]'

      - name: Create artifact directory
        run: mkdir -p "${ARTIFACT_DIR}" "${RUNTIME_DIR}"

      - name: Download CUDA spiced artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spiced_cuda_${{ env.CUDA_COMPUTE_CAP }}_linux_x86_64
          path: ${{ env.ARTIFACT_DIR }}
          github-token: ${{ secrets.DOWNLOAD_ARTIFACT_TOKEN }}
          run-id: ${{ inputs.run_id }}

      - name: Unpack CUDA spiced artifact
        run: |
          set -euo pipefail

          ARTIFACT_NAME="spiced_cuda_${CUDA_COMPUTE_CAP}_linux_x86_64.tar.gz"

          tar -xzf "${ARTIFACT_DIR}/${ARTIFACT_NAME}" -C "${RUNTIME_DIR}"
          chmod +x "${RUNTIME_DIR}/spiced"

      - name: Check GPU visibility
        run: |
          nvidia-smi

      - name: Prepare Hugging Face model spicepod
        run: |
          set -euo pipefail

          mkdir -p "${APP_DIR}"

          cat > "${APP_DIR}/spicepod.yaml" <<'EOF'
          version: v1
          kind: Spicepod
          name: cuda-e2e

          models:
            - from: huggingface:huggingface.co/Qwen/Qwen2.5-0.5B-Instruct
              name: model-llm

          embeddings:
            - from: huggingface:huggingface.co/sentence-transformers/all-MiniLM-L6-v2
              name: all_minilm_l6_v2
          EOF

          cat "${APP_DIR}/spicepod.yaml"

      - name: Start CUDA runtime
        working-directory: ${{ env.APP_DIR }}
        env:
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:/usr/local/cuda/targets/x86_64-linux/lib:${{ env.LD_LIBRARY_PATH }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/${RUNTIME_DIR}/spiced" > spiced.log 2>&1 &
          echo $! > spiced.pid

      - name: Wait for runtime readiness
        working-directory: ${{ env.APP_DIR }}
        timeout-minutes: 20
        run: |
          set -euo pipefail

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/v1/ready | grep -q '^ready$'; then
              echo "Spice runtime is ready"
              exit 0
            fi

            if [ $((i % 3)) -eq 0 ] && [ -f spiced.log ]; then
              echo "===== spiced.log after $((i * 10)) seconds ====="
              cat spiced.log
              echo "===== end spiced.log ====="
            fi

            sleep 10
          done

          echo "Runtime did not become ready in time"
          exit 1

      - name: Test chat completions
        run: |
          set -euo pipefail

          response=$(curl -sf http://localhost:8090/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "model-llm",
              "messages": [
                { "role": "user", "content": "Reply with exactly: cuda-ok" }
              ],
              "temperature": 0
            }')

          echo "${response}" | jq .

          content=$(echo "${response}" | jq -r '.choices[0].message.content // empty')
          if [ -z "${content}" ]; then
            echo "Chat response content was empty"
            exit 1
          fi

      - name: Test embeddings
        run: |
          set -euo pipefail

          response=$(curl -sf http://localhost:8090/v1/embeddings \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "all_minilm_l6_v2",
              "input": "Spice CUDA embedding smoke test"
            }')

          echo "${response}" | jq .

          embedding_len=$(echo "${response}" | jq '.data[0].embedding | length')
          if [ "${embedding_len}" -le 0 ]; then
            echo "Embedding vector was empty"
            exit 1
          fi

      - name: Stop runtime
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f spiced.pid ]; then
            kill "$(cat spiced.pid)" || true
          elif command -v pkill >/dev/null 2>&1; then
            pkill -x spiced || true
          fi

      - name: Print final spiced logs
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f spiced.log ]; then
            echo "===== final spiced.log ====="
            cat spiced.log
            echo "===== end final spiced.log ====="
          fi
