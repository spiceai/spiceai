name: e2e_test_cuda

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to fetch CUDA binary from MinIO. Defaults to the current workflow SHA.'
        required: false
        type: string
      compute_cap:
        description: 'CUDA compute capability artifact to fetch'
        required: true
        type: choice
        options:
          - '80'
          - '86'
          - '87'
          - '89'
          - '90'
        default: '90'

jobs:
  cuda-e2e:
    name: CUDA E2E smoke test
    runs-on: ubuntu-gpu-t4-4-core
    timeout-minutes: 30
    env:
      MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
      MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
      MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
      ARTIFACT_DIR: ./artifacts
      RUNTIME_DIR: ./runtime
      APP_DIR: ./cuda-e2e-app
      MODEL_DIR: ./cuda-e2e-app/data/models
      TEST_COMMIT_SHA: ${{ github.event.inputs.commit_sha || github.sha }}
      CUDA_COMPUTE_CAP: ${{ github.event.inputs.compute_cap || '90' }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Validate required secrets
        run: |
          test -n "${MINIO_ENDPOINT}" || { echo "MINIO_ENDPOINT is required"; exit 1; }
          test -n "${MINIO_ACCESS_KEY}" || { echo "MINIO_ACCESS_KEY is required"; exit 1; }
          test -n "${MINIO_SECRET_KEY}" || { echo "MINIO_SECRET_KEY is required"; exit 1; }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq wget tar
          sudo wget https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc
          sudo chmod +x /usr/local/bin/mc

      - name: Download CUDA spiced artifact from MinIO
        run: |
          set -euo pipefail

          mkdir -p "${ARTIFACT_DIR}" "${RUNTIME_DIR}"

          mc alias set spice-minio "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"

          ARTIFACT_NAME="spiced_cuda_${CUDA_COMPUTE_CAP}_linux_x86_64.tar.gz"
          REMOTE_PATH="spice-minio/artifacts/spiced/linux-x86_64/${TEST_COMMIT_SHA}/${ARTIFACT_NAME}"

          echo "Downloading ${REMOTE_PATH}"
          mc cp "${REMOTE_PATH}" "${ARTIFACT_DIR}/"

          tar -xzf "${ARTIFACT_DIR}/${ARTIFACT_NAME}" -C "${RUNTIME_DIR}"
          chmod +x "${RUNTIME_DIR}/spiced"

      - name: Check GPU visibility
        run: |
          nvidia-smi

      - name: Prepare Hugging Face model spicepod
        run: |
          set -euo pipefail

          mkdir -p "${APP_DIR}"

          cat > "${APP_DIR}/spicepod.yaml" <<'EOF'
          version: v1
          kind: Spicepod
          name: cuda-e2e

          models:
            - from: huggingface:huggingface.co/Qwen/Qwen2.5-0.5B-Instruct
              name: model-llm

          embeddings:
            - from: huggingface:huggingface.co/sentence-transformers/all-MiniLM-L6-v2
              name: all_minilm_l6_v2
          EOF

          cat "${APP_DIR}/spicepod.yaml"

      - name: Start CUDA runtime
        working-directory: ${{ env.APP_DIR }}
        env:
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
        run: |
          set -euo pipefail
          "${GITHUB_WORKSPACE}/${RUNTIME_DIR}/spiced" > spiced.log 2>&1 &
          echo $! > spiced.pid

      - name: Wait for runtime readiness
        working-directory: ${{ env.APP_DIR }}
        timeout-minutes: 10
        run: |
          set -euo pipefail

          for i in $(seq 1 120); do
            if curl -sf http://localhost:8090/v1/ready | grep -q '^ready$'; then
              echo "Spice runtime is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Runtime did not become ready in time"
          exit 1

      - name: Test chat completions
        run: |
          set -euo pipefail

          response=$(curl -sf http://localhost:8090/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "model-llm",
              "messages": [
                { "role": "user", "content": "Reply with exactly: cuda-ok" }
              ],
              "temperature": 0
            }')

          echo "${response}" | jq .

          content=$(echo "${response}" | jq -r '.choices[0].message.content // empty')
          if [ -z "${content}" ]; then
            echo "Chat response content was empty"
            exit 1
          fi

      - name: Test embeddings
        run: |
          set -euo pipefail

          response=$(curl -sf http://localhost:8090/v1/embeddings \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "all_minilm_l6_v2",
              "input": "Spice CUDA embedding smoke test"
            }')

          echo "${response}" | jq .

          embedding_len=$(echo "${response}" | jq '.data[0].embedding | length')
          if [ "${embedding_len}" -le 0 ]; then
            echo "Embedding vector was empty"
            exit 1
          fi

      - name: Stop runtime and print logs
        if: always()
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ -f spiced.pid ]; then
            kill "$(cat spiced.pid)" || true
          elif command -v pkill >/dev/null 2>&1; then
            pkill -x spiced || true
          fi

          if [ -f spiced.log ]; then
            cat spiced.log
          fi
