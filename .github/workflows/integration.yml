name: Diagnose configured Databricks Spark clusters
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Read configured cluster state and table visibility
      env:
        TEST_DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        TEST_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        TEST_DATABRICKS_CLUSTER_ID: ${{ vars.DATABRICKS_CLUSTER_ID }}
        NEW_DATABRICKS_HOST: ${{ vars.NEW_DATABRICKS_HOST }}
        NEW_DATABRICKS_TOKEN: ${{ secrets.NEW_DATABRICKS_TOKEN }}
        NEW_DATABRICKS_CLUSTER_ID: ${{ vars.NEW_DATABRICKS_CLUSTER_ID }}
        NEW_DATABRICKS_SP_CLIENT_ID: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_ID }}
        NEW_DATABRICKS_SP_CLIENT_SECRET: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_SECRET }}
      run: "python3 - <<'PYTHON'\nimport base64, json, os, urllib.error, urllib.parse, urllib.request\n\ndef request(host, path, headers, body=None):\n    host = host.strip().rstrip('/')\n    if not host.startswith('https://'):\n\
        \        host = 'https://' + host\n    parsed = urllib.parse.urlsplit(host)\n    assert parsed.scheme == 'https' and parsed.path in ('', '/')\n    req = urllib.request.Request(host + path, data=body,\
        \ headers=headers)\n    try:\n        with urllib.request.urlopen(req, timeout=30) as response:\n            return response.status, json.load(response)\n    except urllib.error.HTTPError as error:\n\
        \        try:\n            return error.code, json.load(error)\n        except (ValueError, AttributeError):\n            return error.code, {'error_code': 'non_json_response'}\n    except Exception\
        \ as error:\n        return None, {'error_code': type(error).__name__}\n\ndef inspect(label, host, token, cluster):\n    print(json.dumps({'configuration': label, 'host_present': bool(host),\n \
        \                     'token_present': bool(token), 'cluster_present': bool(cluster)}), flush=True)\n    if not host or not token or not cluster:\n        return\n    headers = {'Authorization':\
        \ 'Bearer ' + token}\n    status, data = request(host, '/api/2.0/clusters/get?cluster_id=' + urllib.parse.quote(cluster, safe=''), headers)\n    print(json.dumps({'configuration': label, 'operation':\
        \ 'configured_cluster',\n                      'http_status': status, 'error_code': data.get('error_code'),\n                      'state': data.get('state'), 'spark_version': data.get('spark_version'),\n\
        \                      'data_security_mode': data.get('data_security_mode'),\n                      'termination_code': data.get('termination_reason', {}).get('code')}), flush=True)\n    status,\
        \ data = request(host, '/api/2.0/clusters/list', headers)\n    clusters = data.get('clusters', [])\n    print(json.dumps({'configuration': label, 'operation': 'visible_clusters',\n             \
        \         'http_status': status, 'error_code': data.get('error_code'),\n                      'count': len(clusters), 'configured_matches': sum(c.get('cluster_id') == cluster for c in clusters),\n\
        \                      'states': [c.get('state') for c in clusters]}), flush=True)\n    path = '/api/2.1/unity-catalog/tables?' + urllib.parse.urlencode({'catalog_name': 'spiceai_sandbox', 'schema_name':\
        \ 'tpch'})\n    status, data = request(host, path, headers)\n    print(json.dumps({'configuration': label, 'operation': 'tpch_tables',\n                      'http_status': status, 'error_code':\
        \ data.get('error_code'),\n                      'count': len(data.get('tables', [])), 'has_next_page': bool(data.get('next_page_token'))}), flush=True)\n\nprint(json.dumps({'old_and_new_hosts_match':\
        \ os.environ['TEST_DATABRICKS_HOST'].strip() == os.environ['NEW_DATABRICKS_HOST'].strip(),\n                  'old_and_new_clusters_match': os.environ['TEST_DATABRICKS_CLUSTER_ID'].strip() == os.environ['NEW_DATABRICKS_CLUSTER_ID'].strip()}),\
        \ flush=True)\nfor prefix in ['TEST', 'NEW']:\n    inspect(prefix + '_PAT', os.environ[prefix + '_DATABRICKS_HOST'].strip(),\n            os.environ[prefix + '_DATABRICKS_TOKEN'].strip(), os.environ[prefix\
        \ + '_DATABRICKS_CLUSTER_ID'].strip())\nhost = os.environ['NEW_DATABRICKS_HOST'].strip()\nclient = os.environ['NEW_DATABRICKS_SP_CLIENT_ID'].strip()\nsecret = os.environ['NEW_DATABRICKS_SP_CLIENT_SECRET'].strip()\n\
        if host and client and secret:\n    basic = base64.b64encode((client + ':' + secret).encode()).decode()\n    status, data = request(host, '/oidc/v1/token',\n        {'Authorization': 'Basic ' +\
        \ basic, 'Content-Type': 'application/x-www-form-urlencoded'},\n        urllib.parse.urlencode({'grant_type': 'client_credentials', 'scope': 'all-apis'}).encode())\n    print(json.dumps({'configuration':\
        \ 'NEW_M2M', 'operation': 'oauth', 'http_status': status,\n                      'token_issued': bool(data.get('access_token')), 'error_code': data.get('error')}), flush=True)\n    inspect('NEW_M2M',\
        \ host, data.get('access_token', ''), os.environ['NEW_DATABRICKS_CLUSTER_ID'].strip())\nelse:\n    print(json.dumps({'configuration': 'NEW_M2M', 'configuration_complete': False}), flush=True)\n\
        PYTHON\n"
