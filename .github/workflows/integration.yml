name: Replay legacy Spark cases from OSS integration archive
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  HAS_TEST_MINIO_SECRET: ${{ secrets.TEST_MINIO_ENDPOINT != '' && secrets.TEST_MINIO_ACCESS_KEY != '' && secrets.TEST_MINIO_SECRET_KEY != '' }}
  INTEGRATION_TESTS_ARCHIVE_S3_URI: s3://build/test_binaries/34517372696/integration-tests-archive/integration_tests.tar.zst
jobs:
  replay:
    runs-on: spiceai-dev-runners
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 1
        ref: 187b3dbc322f2f104eca700b07bdef78cf5e0a66
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Install Oracle ODPI-C
      uses: ./.github/actions/setup-oracle-odpi
    - name: Set up MinIO client
      uses: ./.github/actions/setup-minio
      with:
        minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
        minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
      if: env.HAS_TEST_MINIO_SECRET == 'true'
    - name: Download test archive from local MinIO
      env:
        MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
      run: 'set -euo pipefail

        : "${MINIO_ENDPOINT:?TEST_MINIO_ENDPOINT is required to download integration test archive}"

        mkdir -p ./integration_tests

        mc cp "spice-minio/${INTEGRATION_TESTS_ARCHIVE_S3_URI#s3://}" ./integration_tests/integration_tests.tar.zst

        '
      if: env.HAS_TEST_MINIO_SECRET == 'true'
    - name: Download test archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: integration-tests-archive
        path: ./integration_tests
        run-id: 34517372696
        github-token: ${{ github.token }}
      if: env.HAS_TEST_MINIO_SECRET != 'true'
    - name: Set up Nextest
      uses: ./.github/actions/setup-nextest
    - name: Replay the two failed legacy Spark cases
      env:
        AWS_EC2_METADATA_DISABLED: true
        INSTA_UPDATE: 'no'
        SPICE_SECRET_SPICEAI_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_KEY }}
        MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
        MINIO_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
        MINIO_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
        TEST_DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
        TEST_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        TEST_DATABRICKS_CLUSTER_ID: ${{ vars.DATABRICKS_CLUSTER_ID }}
        TEST_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID }}
        AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
        AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
        NEW_DATABRICKS_HOST: ${{ vars.NEW_DATABRICKS_HOST }}
        NEW_DATABRICKS_TOKEN: ${{ secrets.NEW_DATABRICKS_TOKEN }}
        NEW_DATABRICKS_CLUSTER_ID: ${{ vars.NEW_DATABRICKS_CLUSTER_ID }}
        NEW_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID }}
        NEW_DATABRICKS_SP_CLIENT_ID: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_ID }}
        NEW_DATABRICKS_SP_CLIENT_SECRET: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_SECRET }}
        TEST_DATABRICKS_PERMISSIONS_HOST: ${{ vars.DATABRICKS_PERMISSIONS_HOST || secrets.DATABRICKS_PERMISSIONS_HOST }}
        TEST_DATABRICKS_PRO_WAREHOUSE_ID: ${{ vars.DATABRICKS_PRO_WAREHOUSE_ID || secrets.DATABRICKS_PRO_WAREHOUSE_ID }}
        TEST_DATABRICKS_CLASSIC_WAREHOUSE_ID: ${{ vars.DATABRICKS_CLASSIC_WAREHOUSE_ID || secrets.DATABRICKS_CLASSIC_WAREHOUSE_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET }}
        NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
        NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
        SPICEAI_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
        AWS_ICEBERG_ACCESS_KEY_ID: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
        AWS_ICEBERG_SECRET_ACCESS_KEY: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
        AWS_ICEBERG_REGION: ${{ secrets.AWS_ICEBERG_REGION }}
        AWS_ICEBERG_ACCOUNT_ID: ${{ secrets.AWS_ICEBERG_ACCOUNT_ID }}
        AWS_GLUE_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
        AWS_GLUE_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
        AWS_DYNAMODB_KEY: ${{ secrets.AWS_DYNAMODB_ACCESS_KEY_ID }}
        AWS_DYNAMODB_SECRET: ${{ secrets.AWS_DYNAMODB_SECRET_ACCESS_KEY }}
        ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
        ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
        ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
        ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
        AWS_SNAPSHOT_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
        AWS_SNAPSHOT_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
        AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
        AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = 187b3dbc322f2f104eca700b07bdef78cf5e0a66

        sha256sum ./integration_tests/integration_tests.tar.zst

        INSTA_WORKSPACE_ROOT="$PWD" CARGO_MANIFEST_DIR="$PWD" cargo nextest run --workspace-remap "$PWD" --archive-file ./integration_tests/integration_tests.tar.zst --no-fail-fast -E ''binary_id(=runtime::integration)
        & (test(=databricks_spark_catalog::databricks_spark_catalog_schema_discovery_test) | test(=spark::spark_integration_test))''

        '
