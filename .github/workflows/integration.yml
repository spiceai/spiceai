---
name: integration tests

on:
  push:
    branches:
      - trunk
      - release/*
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*

  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'always'
          - 'no'
      run_all_tests:
        description: 'Run all tests'
        type: boolean
        required: false
        default: false

concurrency:
  # Allow only one workflow per any non-trunk branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  HAS_TEST_MINIO_SECRET: ${{ secrets.TEST_MINIO_ENDPOINT != '' && secrets.TEST_MINIO_ACCESS_KEY != '' && secrets.TEST_MINIO_SECRET_KEY != '' }}
  INTEGRATION_TESTS_ARCHIVE_S3_URI: s3://build/test_binaries/${{ github.run_id }}/integration-tests-archive/integration_tests.tar.zst

jobs:
  # Required merge-queue checks must also report on the PR head before GitHub
  # will enqueue it. On pull requests these jobs run lightweight passthrough
  # steps on GitHub-hosted runners; the full suite runs only on non-PR events.
  check_changes:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    # A full-history checkout (`fetch-depth: 0`) and a path diff. Sized for a
    # cold runner having to clone from scratch, not the ~1 min a warm
    # self-hosted workspace takes.
    timeout-minutes: 45
    outputs:
      # Always treat a manual workflow_dispatch run as having relevant changes so the
      # tests run even when no relevant files changed.
      relevant_changes: ${{ steps.check.outputs.relevant_changes == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Integration tests run on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for code changes
        if: ${{ github.event_name != 'pull_request' }}
        id: check
        uses: ./.github/actions/check-code-changes

  build:
    name: Build Test Binary
    needs: check_changes
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    # Slowest observed success in the 2026-07-25..08-08 window: 125 min.
    timeout-minutes: 300
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Integration test binaries build on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check_changes.outputs.relevant_changes == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1

      # Cache Cargo dependencies
      - name: Cache Cargo registry
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/install-protoc

      - name: Set up sccache
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Set up Nextest
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-nextest

      # Build the test binaries without running tests
      - name: Build integration test archives
        if: needs.check_changes.outputs.relevant_changes == 'true'
        # One `cargo nextest archive` invocation, and effectively the whole job. Bounding the
        # step rather than only the job is what names the step that hung, instead of leaving
        # a wedge attributed to the job as a whole.
        #
        # 150 minutes is set from a historical reference rather than a measurement of the
        # step as it stands: 81-117 minutes across the last eighteen successful `push` and
        # `merge_group` runs from when this step still made seven `nextest archive`
        # invocations. Consolidating those to one removes the six redundant dependency
        # resolutions, so the reference is conservative for the ordinary case — but it is
        # not a ceiling, because a cold compiler cache, a contended shared runner pool, or
        # more test targets can each push a single invocation past it. That is why the bound
        # sits clear of the range rather than near it: one tight enough to fail a legitimate
        # build would be worse than the slow build it replaced. Post-consolidation
        # measurements should replace this reference once there are eighteen of them
        # (#13429).
        timeout-minutes: 150
        env:
          CARGO_INCREMENTAL: 0
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          set -euo pipefail

          # Records one `ARCHIVE_TIMING <label> <seconds>` line per archive so the cost of
          # each `nextest archive` invocation can be read straight from the job log instead
          # of inferred from the gaps between cargo's own output.
          archive() {
            local label="$1"; shift
            local t0 rc
            t0=$(date +%s)
            # Capture the status rather than letting `set -e` abort at `"$@"`, so the timing
            # line is emitted even for the invocation that failed -- then re-raise it, so a
            # failed build still fails the step instead of inheriting `echo`'s success.
            "$@" && rc=0 || rc=$?
            echo "ARCHIVE_TIMING ${label} $(( $(date +%s) - t0 )) rc=${rc}"
            return "$rc"
          }

          # The single invocation below builds every test target with this one feature set.
          #
          # Widening the set preserves each target's test selection because this set is a
          # superset of what that target was already built with -- not because the targets
          # are ungated. They are gated: `integration_aws_sdk` gates on
          # `all(databricks, delta_lake)`, and `snapshot_refresh` gates each backend on
          # `duckdb`/`sqlite`/`turso`. Every one of those features is in this set, so every
          # gate that was satisfied before is still satisfied, and `turso` is the only one
          # this set previously lacked. `integration` itself is unaffected: its lone `turso`
          # gate sits inside an `any(...)` that `postgres`/`duckdb`/`sqlite` already satisfy.
          # `turso` alongside `postgres`/`mysql`/`delta_lake`/`duckdb`/`sqlite` is the
          # combination `make test-integration` runs.
          FEATURES="postgres,mysql,delta_lake,duckdb,sqlite,spark,databricks,dynamodb,oracle,kafka,iceberg-write,snapshots,mongodb,turso"
          if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]]; then
            FEATURES="${FEATURES},extended_tests"
            echo "Including extended_tests"
          else
            echo "Excluding extended_tests"
          fi

          # One invocation for every test target, so the dependency graph resolves once. Under
          # resolver = "2" the resolved features of each crate depend on which packages are
          # selected as well as which features are named, so an invocation that changes either
          # cannot reuse what the previous one built. Seven invocations paid that seven times.
          #
          # `--features` must name its owning package once more than one package is selected.
          PKGS="-p runtime -p aws-sdk-credential-bridge -p runtime-table-partition -p data_components"
          FEAT="$(echo "${FEATURES}" | tr ',' '\n' | sed 's|^|runtime/|' | paste -sd, -)"

          archive all_targets cargo nextest archive ${PKGS} \
            --test integration --test retention_oom --test integration_aws_sdk \
            --test integration_snapshot_refresh --test credential_provider \
            --test partition_table_provider --test hadoop_catalog_test \
            --features ${FEAT} --archive-file integration_tests.tar.zst

          echo "--- archive size ---"
          ls -l integration_tests.tar.zst

          echo "--- compiler cache stats ---"
          if command -v sccache >/dev/null 2>&1; then sccache --show-stats || true; fi

      - name: Set up MinIO client
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET == 'true'
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Upload test archives to local MinIO
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET == 'true'
        env:
          MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${MINIO_ENDPOINT:?TEST_MINIO_ENDPOINT is required to upload integration test archives}"
          mc mb --ignore-existing spice-minio/build
          mc cp ./integration_tests.tar.zst "spice-minio/${INTEGRATION_TESTS_ARCHIVE_S3_URI#s3://}"

      - name: Upload test archive (artifact fallback)
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-tests-archive
          path: ./integration_tests.tar.zst
          retention-days: 3
          compression-level: 1

  test:
    name: Integration Tests (part ${{ matrix.label }})
    needs: [build, check_changes]
    permissions:
      contents: write
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'spiceai-dev-runners' }}
    # Slowest observed success in the 2026-07-25..08-08 window: 19 min.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 1
            partition: 'count:1/3'
          - label: 2
            partition: 'count:2/3'
          - label: 3
            partition: 'count:3/3'
    steps:
      - name: Pull request passthrough
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Integration test part ${{ matrix.label }} runs on the merge-group commit"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.check_changes.outputs.relevant_changes == 'true'
        with:
          persist-credentials: false
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Rust
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-rust

      - name: Install Oracle ODPI-C
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-oracle-odpi

      - name: Set up MinIO client
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET == 'true'
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Download test archive from local MinIO
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET == 'true'
        env:
          MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${MINIO_ENDPOINT:?TEST_MINIO_ENDPOINT is required to download integration test archive}"
          mkdir -p ./integration_tests
          mc cp "spice-minio/${INTEGRATION_TESTS_ARCHIVE_S3_URI#s3://}" ./integration_tests/integration_tests.tar.zst

      - name: Download test archive
        if: needs.check_changes.outputs.relevant_changes == 'true' && env.HAS_TEST_MINIO_SECRET != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-tests-archive
          path: ./integration_tests

      - name: Set up Nextest
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: ./.github/actions/setup-nextest

      - name: Login to DockerHub
        if: needs.check_changes.outputs.relevant_changes == 'true' && github.repository == 'spiceai/spiceai'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull database images
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          docker pull docker.io/library/postgres:latest
          docker pull docker.io/library/mysql:latest
          docker pull docker.io/library/mongo:latest
          docker pull docker.io/gvenzl/oracle-free:latest

      - name: Set up Spice.ai API Key
        if: needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          echo 'SPICEAI_API_KEY="${{ secrets.SPICE_SECRET_SPICEAI_KEY }}"' > .env

      - name: Set up Github Token
        if: needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2
        id: github-app-token
        with:
          app-id: ${{ vars.ORG_MEMBERS_GITHUB_APP_ID }}
          private-key: ${{ secrets.ORG_MEMBERS_GITHUB_PRIVATE_KEY }}
          owner: spiceai
          repositories: |
            spiceai

      - name: Run integration test
        if: needs.check_changes.outputs.relevant_changes == 'true'
        # Part 1 is the slowest partition at 13.4 minutes across the last eighteen
        # successful `push` and `merge_group` runs, but the spread over all three is 1.6 to
        # 13.4 - nearly a factor of eight, because these tests wait on external services
        # (Databricks, Oracle Cloud, S3) whose latency is not ours. The bound is set well
        # above the worst case rather than close to it for that reason, and below the job's
        # so a wedge here is attributed to this step rather than to the job.
        #
        # The snapshot steps after it are deliberately not reached when this one fails: their
        # conditions carry no status function, so GitHub applies `success()` and a partial
        # snapshot set never reaches `upload-integration-snapshots` to become an update
        # branch. A timeout is a failure by that measure, which is the behaviour we want.
        timeout-minutes: 40
        env:
          AWS_EC2_METADATA_DISABLED: true
          INSTA_UPDATE: ${{ github.event.inputs.update_snapshots }}
          SPICE_SECRET_SPICEAI_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_KEY }}
          GITHUB_ORG_TOKEN: ${{ steps.github-app-token.outputs.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MinIO/S3-compatible storage for TPC-DS and other S3 tests
          MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          MINIO_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          MINIO_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          # old dbc instance
          TEST_DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          TEST_DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          TEST_DATABRICKS_CLUSTER_ID: ${{ vars.DATABRICKS_CLUSTER_ID }}
          TEST_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
          # new dbc instance
          NEW_DATABRICKS_HOST: ${{ vars.NEW_DATABRICKS_HOST }}
          NEW_DATABRICKS_CLUSTER_ID: ${{ vars.NEW_DATABRICKS_CLUSTER_ID }}
          NEW_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID }}
          NEW_DATABRICKS_SP_CLIENT_ID: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_ID }}
          NEW_DATABRICKS_SP_CLIENT_SECRET: ${{ secrets.NEW_DATABRICKS_SP_CLIENT_SECRET }}
          NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
          NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
          SPICEAI_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
          AWS_ICEBERG_ACCESS_KEY_ID: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_ICEBERG_SECRET_ACCESS_KEY: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_ICEBERG_REGION: ${{ secrets.AWS_ICEBERG_REGION }}
          AWS_ICEBERG_ACCOUNT_ID: ${{ secrets.AWS_ICEBERG_ACCOUNT_ID }}
          AWS_GLUE_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_GLUE_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_DYNAMODB_KEY: ${{ secrets.AWS_DYNAMODB_ACCESS_KEY_ID }}
          AWS_DYNAMODB_SECRET: ${{ secrets.AWS_DYNAMODB_SECRET_ACCESS_KEY }}
          ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
          ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
          ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
          ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
          AWS_SNAPSHOT_KEY: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_SNAPSHOT_SECRET: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
          AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
        run: |
          if [ -n "$SPICE_SECRET_SPICEAI_KEY" ]; then
            INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --partition '${{ matrix.partition }}' --archive-file ./integration_tests/integration_tests.tar.zst -E 'binary_id(=runtime::integration)'
          else
            INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --partition '${{ matrix.partition }}' --archive-file ./integration_tests/integration_tests.tar.zst -E 'binary_id(=runtime::integration) - test(spiceai_integration_test)'
          fi

      - name: Run retention OOM regression test
        if: needs.check_changes.outputs.relevant_changes == 'true' && matrix.partition == 'count:1/3'
        # A local test with no external dependency, so its 3.9-to-5.0-minute range across
        # the same eighteen runs is the whole picture and the bound can be tighter.
        timeout-minutes: 20
        run: |
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_tests/integration_tests.tar.zst -E 'binary_id(=runtime::retention_oom)'

      - name: Upload integration snapshots artifact
        id: create_snapshot_archive
        if: github.event.inputs.update_snapshots == 'always' && needs.check_changes.outputs.relevant_changes == 'true'
        run: |
          git diff --name-only -- '*.snap' > snapshot-files
          git ls-files -o --exclude-standard -- '*.snap' >> snapshot-files
          if [ -s snapshot-files ]; then
            tr '\n' '\0' < snapshot-files > snapshot-files-0
            tar --null -czf integration-snapshots-part-${{ matrix.label }}.tar.gz --files-from snapshot-files-0
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "No snapshot files found"
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f snapshot-files snapshot-files-0
        shell: bash
      - name: Store integration snapshots artifact
        if: github.event.inputs.update_snapshots == 'always' && steps.create_snapshot_archive.outputs.created == 'true' && needs.check_changes.outputs.relevant_changes == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-snapshots-part-${{ matrix.label }}
          path: integration-snapshots-part-${{ matrix.label }}.tar.gz
          retention-days: 1

  upload-integration-snapshots:
    name: Upload Integration Snapshots
    if: github.event.inputs.update_snapshots == 'always'
    # A checkout, a commit and a push.
    timeout-minutes: 60
    needs:
      - test
    permissions:
      contents: write
      pull-requests: write
    runs-on: spiceai-dev-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Download integration snapshots artifacts
        id: download_snapshots
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: integration-snapshots-part-*
          merge-multiple: true
          path: integration-snapshots

      - name: Extract snapshots
        if: steps.download_snapshots.outcome == 'success'
        run: |
          shopt -s nullglob
          for archive in integration-snapshots/*.tar.gz; do
            tar -xzf "$archive" -C .
          done
        shell: bash

      - name: Configure Git
        if: steps.download_snapshots.outcome == 'success'
        run: |
          git config --global user.name 'Spice Snapshot Update Bot'
          git config --global user.email 'spiceaibot@spice.ai'

      - name: Push snapshots to branch
        if: steps.download_snapshots.outcome == 'success'
        timeout-minutes: 10
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: No snapshot changes detected
        if: steps.download_snapshots.outcome != 'success'
        run: echo "No snapshot artifacts were uploaded; skipping snapshot update."

  test-aws-sdk:
    name: AWS SDK Integration Tests
    needs: [build, check_changes]
    # Slowest observed success in the 2026-07-25..08-08 window: 2 min.
    timeout-minutes: 60
    if: needs.check_changes.outputs.relevant_changes == 'true'
    permissions: read-all
    runs-on: spiceai-dev-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up MinIO client
        if: env.HAS_TEST_MINIO_SECRET == 'true'
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Download AWS SDK test archive from local MinIO
        if: env.HAS_TEST_MINIO_SECRET == 'true'
        env:
          MINIO_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${MINIO_ENDPOINT:?TEST_MINIO_ENDPOINT is required to download AWS SDK test archive}"
          mkdir -p ./integration_tests
          mc cp "spice-minio/${INTEGRATION_TESTS_ARCHIVE_S3_URI#s3://}" ./integration_tests/integration_tests.tar.zst

      - name: Download AWS SDK test archive
        if: env.HAS_TEST_MINIO_SECRET != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: integration-tests-archive
