name: Diagnose current Databricks PAT configuration
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
    - name: Probe current Databricks credentials and fixtures
      env:
        NEW_HOST: ${{ vars.NEW_DATABRICKS_HOST || secrets.NEW_DATABRICKS_HOST }}
        NEW_TOKEN: ${{ secrets.NEW_DATABRICKS_TOKEN }}
        WAREHOUSE_LEGACY: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID || secrets.DATABRICKS_SQL_WAREHOUSE_ID }}
        WAREHOUSE_SQL: ${{ vars.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID || secrets.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID }}
        WAREHOUSE_NEW: ${{ vars.NEW_DATABRICKS_SQL_WAREHOUSE_ID || secrets.NEW_DATABRICKS_SQL_WAREHOUSE_ID }}
        DATABRICKS_PERMISSIONS_HOST: ${{ vars.DATABRICKS_PERMISSIONS_HOST || secrets.DATABRICKS_PERMISSIONS_HOST }}
        DATABRICKS_PRO_WAREHOUSE_ID: ${{ vars.DATABRICKS_PRO_WAREHOUSE_ID || secrets.DATABRICKS_PRO_WAREHOUSE_ID }}
        DATABRICKS_CLASSIC_WAREHOUSE_ID: ${{ vars.DATABRICKS_CLASSIC_WAREHOUSE_ID || secrets.DATABRICKS_CLASSIC_WAREHOUSE_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET }}
      run: "python3 - <<'PYTHON'\nimport json, os, urllib.request, urllib.error\nfrom urllib.parse import urlsplit\nhost = os.environ.get('NEW_HOST', '').strip()\ntoken = os.environ.get('NEW_TOKEN',\
        \ '').strip()\nprint(json.dumps({'new_pat_host_present': bool(host), 'new_pat_token_present': bool(token), 'permissions_configuration_present': {key: bool(value) for key, value\
        \ in os.environ.items() if key.startswith(('DATABRICKS_', 'TEST_DATABRICKS_'))}}), flush=True)\nif not host or not token:\n    raise SystemExit('New PAT configuration is incomplete')\n\
        if not host.startswith('https://'):\n    host = 'https://' + host\nassert urlsplit(host).path in ('', '/'), 'Expected workspace host without a path'\ndef request(path, body=None):\n\
        \    req = urllib.request.Request(host.rstrip('/') + path, data=None if body is None else json.dumps(body).encode(), headers={'Authorization': 'Bearer ' + token, 'Content-Type':\
        \ 'application/json'})\n    try:\n        with urllib.request.urlopen(req, timeout=45) as response:\n            return response.status, json.load(response)\n    except urllib.error.HTTPError\
        \ as error:\n        try:\n            data = json.load(error)\n        except (ValueError, AttributeError):\n            data = {'error_code': 'non_json_response'}\n       \
        \ return error.code, data\n    except Exception as error:\n        return None, {'error_code': type(error).__name__}\nstatus, warehouses = request('/api/2.0/sql/warehouses')\n\
        print(json.dumps({'operation': 'list_warehouses', 'http_status': status, 'error_code': warehouses.get('error_code'), 'visible_warehouse_count': len(warehouses.get('warehouses',\
        \ []))}), flush=True)\nseen = set()\nfor key in ['WAREHOUSE_LEGACY', 'WAREHOUSE_SQL', 'WAREHOUSE_NEW']:\n    warehouse = os.environ.get(key, '').strip()\n    record = {'warehouse_configuration':\
        \ key, 'present': bool(warehouse), 'duplicates_prior': warehouse in seen}\n    if not warehouse or warehouse in seen:\n        print(json.dumps(record), flush=True)\n       \
        \ continue\n    seen.add(warehouse)\n    for label, sql in [('select_one', 'SELECT 1 AS probe'), ('nation_fixture', 'SELECT COUNT(*) FROM spiceai_sandbox.tpch.nation'), ('permissions_fixture',\
        \ 'SELECT COUNT(*) FROM catalog_without_inf_schema.tpch.customer')]:\n        status, data = request('/api/2.0/sql/statements/', {'warehouse_id': warehouse, 'statement': sql,\
        \ 'wait_timeout': '30s', 'on_wait_timeout': 'CANCEL'})\n        result = dict(record, query=label, http_status=status, statement_state=data.get('status', {}).get('state'), error_code=data.get('error_code')\
        \ or data.get('status', {}).get('error', {}).get('error_code'))\n        if label == 'select_one':\n            result['returns_one'] = data.get('result', {}).get('data_array')\
        \ == [['1']]\n        else:\n            result['row_count'] = data.get('result', {}).get('data_array')\n        print(json.dumps(result), flush=True)\n        if label == 'select_one'\
        \ and not result['returns_one']:\n            break\nPYTHON\n"
