          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Download AWS SDK credential bridge test archive from local MinIO
        if: env.HAS_RUSTFS_ACCESS == 'true'
        env:
          MINIO_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
        run: |
          set -euo pipefail
          : "${MINIO_ENDPOINT:?TEST_MINIO_ENDPOINT is required to download AWS SDK credential bridge test archive}"
          mkdir -p ./integration_tests
          mc cp "spice-minio/${INTEGRATION_TESTS_ARCHIVE_S3_URI#s3://}" ./integration_tests/integration_tests.tar.zst

      - name: Download AWS SDK credential bridge test archive
        if: env.HAS_RUSTFS_ACCESS != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: integration-tests-archive
          path: ./integration_tests

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      - name: Run AWS SDK credential bridge integration test
        env:
          AWS_EC2_METADATA_DISABLED: true
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_WEB_IDENTITY_TEST_ROLE_ARN }}
        # A GitHub OIDC token lives 5 minutes, enough for these tests' STS exchanges.
        run: |
          set -euo pipefail
          export AWS_WEB_IDENTITY_TOKEN_FILE="${RUNNER_TEMP}/aws-web-identity-token"
          trap 'rm -f "$AWS_WEB_IDENTITY_TOKEN_FILE"' EXIT
          umask 077
          # The request token goes to curl on stdin, out of the process list.
          printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl --config - --fail --silent --show-error --max-time 30 \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin)["value"])' \
              > "$AWS_WEB_IDENTITY_TOKEN_FILE"
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_tests/integration_tests.tar.zst -E 'binary_id(=aws-sdk-credential-bridge::credential_provider)'

