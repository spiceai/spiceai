name: Diagnose Databricks permissions fixtures
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Probe the exact permissions-test tables
      env:
        DATABRICKS_PERMISSIONS_HOST: ${{ vars.DATABRICKS_PERMISSIONS_HOST }}
        DATABRICKS_PRO_WAREHOUSE_ID: ${{ vars.DATABRICKS_PRO_WAREHOUSE_ID }}
        DATABRICKS_CLASSIC_WAREHOUSE_ID: ${{ vars.DATABRICKS_CLASSIC_WAREHOUSE_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITH_INFOSCHEMA_CLIENT_SECRET }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_ID }}
        TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET: ${{ secrets.TEST_DATABRICKS_SP_WITHOUT_INFOSCHEMA_CLIENT_SECRET }}
      run: "python3 - <<'PYTHON'\nimport base64, json, os, re, time, urllib.request, urllib.error, urllib.parse\nhost = os.environ['DATABRICKS_PERMISSIONS_HOST'].strip().rstrip('/')\nif not host.startswith('https://'):\n\
        \    host = 'https://' + host\ndef request(path, headers, body=None):\n    req = urllib.request.Request(host + path, headers=headers, data=body)\n    try:\n        with urllib.request.urlopen(req,\
        \ timeout=45) as response:\n            return response.status, json.load(response)\n    except urllib.error.HTTPError as error:\n        try:\n            return error.code, json.load(error)\n\
        \        except (ValueError, AttributeError):\n            return error.code, {'error_code': 'non_json_response'}\n    except Exception as error:\n        return None, {'error_code': type(error).__name__}\n\
        for identity in ['WITH', 'WITHOUT']:\n    prefix = 'TEST_DATABRICKS_SP_' + identity + '_INFOSCHEMA_'\n    basic = base64.b64encode((os.environ[prefix + 'CLIENT_ID'] + ':' + os.environ[prefix + 'CLIENT_SECRET']).encode()).decode()\n\
        \    status, data = request('/oidc/v1/token', {'Authorization': 'Basic ' + basic, 'Content-Type': 'application/x-www-form-urlencoded'}, urllib.parse.urlencode({'grant_type': 'client_credentials',\
        \ 'scope': 'all-apis'}).encode())\n    token = data.get('access_token')\n    print(json.dumps({'identity': identity, 'operation': 'oauth', 'http_status': status, 'token_issued': bool(token), 'error_code':\
        \ data.get('error')}), flush=True)\n    if not token:\n        continue\n    headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'}\n    cases = [\n        ('pro_allowed_native',\
        \ 'DATABRICKS_PRO_WAREHOUSE_ID', 'SELECT COUNT(*) FROM test_scp_permissions.test_scp.table_case1'),\n        ('pro_denied_native', 'DATABRICKS_PRO_WAREHOUSE_ID', 'SELECT COUNT(*) FROM test_scp_permissions.test_scp.table_case2'),\n\
        \        ('pro_allowed_foreign', 'DATABRICKS_PRO_WAREHOUSE_ID', 'SELECT COUNT(*) FROM spiceai_sandbox_via_serverless.tpch.region'),\n        ('pro_denied_foreign', 'DATABRICKS_PRO_WAREHOUSE_ID',\
        \ 'SELECT COUNT(*) FROM spiceai_sandbox_via_serverless.tpch.nation'),\n    ]\n    if identity == 'WITH':\n        cases.append(('classic_foreign', 'DATABRICKS_CLASSIC_WAREHOUSE_ID', 'SELECT COUNT(*)\
        \ FROM spiceai_sandbox_via_serverless.tpch.region'))\n    for label, warehouse_key, sql in cases:\n        status, result = request('/api/2.0/sql/statements/', headers, json.dumps({'warehouse_id':\
        \ os.environ[warehouse_key], 'statement': sql, 'wait_timeout': '30s', 'on_wait_timeout': 'CONTINUE'}).encode())\n        deadline = time.monotonic() + 300\n        while result.get('status', {}).get('state')\
        \ in ('PENDING', 'RUNNING') and time.monotonic() < deadline:\n            time.sleep(2)\n            status, result = request('/api/2.0/sql/statements/' + urllib.parse.quote(result['statement_id'],\
        \ safe=''), headers)\n        state = result.get('status', {}).get('state')\n        if state in ('PENDING', 'RUNNING'):\n            request('/api/2.0/sql/statements/' + urllib.parse.quote(result['statement_id'],\
        \ safe='') + '/cancel', headers, b'{}')\n        error = result.get('status', {}).get('error', {})\n        message = error.get('message', '')\n        print(json.dumps({'identity': identity, 'case':\
        \ label, 'http_status': status, 'state': state, 'error_code': result.get('error_code') or error.get('error_code'), 'sqlstate': re.findall(r'SQLSTATE:?\\s*([A-Z0-9]{5})', message), 'permission_error':\
        \ 'PERMISSION' in message.upper(), 'missing_table_error': 'TABLE_OR_VIEW_NOT_FOUND' in message, 'foreign_unsupported_error': 'foreign' in message.lower() and ('classic' in message.lower() or 'not\
        \ supported' in message.lower()), 'returned_count': result.get('result', {}).get('data_array')}), flush=True)\nPYTHON\n"
