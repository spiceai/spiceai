name: Reclaim Runner Disk
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: macos-runner-recovery-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4]
    runs-on: spiceai-macos
    timeout-minutes: 30
    steps:
      - name: Inspect runner disk without checkout or cleanup
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner=%s\nworkspace=%s\ntemp=%s\n' "$RUNNER_NAME" "$RUNNER_WORKSPACE" "$RUNNER_TEMP"
          hostname
          df -Pk "$RUNNER_WORKSPACE"
          case "$RUNNER_NAME" in
            spiceai-macos-mbp-runner-01-*) ;;
            *) echo 'Outside the affected physical host; no further inspection'; exit 0 ;;
          esac
          root="$(dirname "$RUNNER_WORKSPACE")"
          ps -axo pid,ppid,etime,comm | awk 'NR == 1 || /Runner.Worker|Runner.Listener|cargo|rustc|clang|ld$/'
          du -x -k -d 1 "$root" 2>/dev/null || true
          du -x -k -d 2 "$RUNNER_WORKSPACE" 2>/dev/null || true
          python3 - <<'PYTHON'
          import os, time, collections
          from pathlib import Path
          root = Path(os.environ['RUNNER_WORKSPACE']).parent
          for base, dirs, files in os.walk(root, followlinks=False):
              dirs[:] = [d for d in dirs if not Path(base, d).is_symlink() and d not in ('.git', '_actions', '_tool')]
              if 'CACHEDIR.TAG' in files or Path(base).name == 'target':
                  path = Path(base)
                  print('BUILD_CANDIDATE', path)
                  tag = path / 'CACHEDIR.TAG'
                  print('TAG', repr(tag.read_text(errors='replace')[:1024]) if tag.is_file() else 'MISSING')
                  totals = collections.defaultdict(lambda: [0, 0])
                  for sub, sd, sf in os.walk(path, followlinks=False):
                      sd[:] = [d for d in sd if not Path(sub, d).is_symlink()]
                      for name in sf:
                          f = Path(sub, name)
                          s = f.lstat()
                          age = (time.time() - s.st_mtime) / 86400
                          bucket = 'older_than_8d' if age >= 8 else 'within_8d'
                          profile = f.relative_to(path).parts[0]
                          totals[(profile, bucket)][0] += 1
                          totals[(profile, bucket)][1] += s.st_blocks * 512
                  for key, value in sorted(totals.items()):
                      print('ALLOCATED_BYTES', key, value)
                  dirs[:] = []
          PYTHON
