---
# The jobs of integration_search.yml that assume a CI AWS role.
# integration_search.yml calls this file at `@trunk`, so whichever ref it runs on, the definition
# that chooses the role is trunk's.
# A job here assumes the full roles only on trunk (a merge-queue run is not trunk) and
# the read-only pull request role anywhere else, and skips its writes there (the `Choose
# the CI role` step). check_workflow_yaml.py keeps every such job in a file like this.
name: integration tests (search) (CI AWS role jobs)

on:
  workflow_call:
    # The secrets the jobs below read. A reusable workflow gets only the secrets its
    # caller passes, environment secrets included, and one it is not passed reads as
    # empty with no error, so each is required and every caller passes it by name.
    # check_workflow_yaml.py keeps this list and the callers' `secrets:` complete.
    secrets:
      CI_AWS_PULL_REQUEST_ROLE_ARN:
        required: true
      CI_AWS_S3_VECTORS_ROLE_ARN:
        required: true
      OPENAI_IDENTITY_PROVIDER_ID:
        required: true
      OPENAI_SERVICE_ACCOUNT_ID:
        required: true
    inputs:
      update_snapshots:
        type: string
        required: false
        default: ''

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  # Keeps the `integration_models` test binary loadable on Apple Silicon; see
  # `CARGO_PROFILE_DEV_STRIP` in `integration_models.yml`.
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  test-search:
    name: Test Search Integration
    permissions:
      contents: write  # push-snap-changes pushes a snapshot branch
      pull-requests: write  # and opens, auto-merges or closes its PR
      # Approves the snapshot PR's held pull_request runs.
      actions: write
      # Exchanged for OpenAI access tokens: workload identity federation.
      id-token: write
    runs-on: spiceai-macos-large
    # Holds the OpenAI workload identity federation IDs (`OPENAI_*` secrets).
    environment: ci
    env:
      # Workload identity federation: spiced and the tests exchange this job's GitHub OIDC token
      # for provider access tokens with these IDs, and exchange again before each expires.
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
    steps:
      # Which CI AWS role this job gets, and whether its writes run; see the action.
      - name: Choose the CI role
        id: ci-role
        uses: $/.github/actions/ci-role
        with:
          pull-request-role-set: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN != '' }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      # The step below builds the tests before it runs them, so the credentials last as long as
      # the job's default 6-hour limit.
      - name: Assume the S3 Vectors role
        id: aws-s3-vectors
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_AWS_S3_VECTORS_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-s3-vectors-${{ github.run_id }}
          role-duration-seconds: 21600
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Run search integration tests
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || inputs.update_snapshots }}
          AWS_S3_VECTORS_KEY: ${{ steps.aws-s3-vectors.outputs.aws-access-key-id }}
          AWS_S3_VECTORS_SECRET: ${{ steps.aws-s3-vectors.outputs.aws-secret-access-key }}
          AWS_S3_VECTORS_SESSION_TOKEN: ${{ steps.aws-s3-vectors.outputs.aws-session-token }}
          # ARN of the pre-seeded, long-lived S3 Vectors index the S3VectorsFallback permutation
          # falls back to (its zero-row acceleration never populates the index itself).
          AWS_S3_VECTORS_FALLBACK_INDEX_ARN: ${{ vars.CI_AWS_S3_VECTORS_FALLBACK_INDEX_ARN }}
        run: |
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ] ; then
            echo "Error: OPENAI_IDENTITY_PROVIDER_ID is not defined."
            exit 1
          fi
          cargo test --test integration_models -p runtime --features models,metal,s3_vectors,kafka,extended_tests -- search

      - name: Push snapshots to branch
        # `cargo test` will fail if snapshot changes are needed. Always attempt
        #  to make PR if 'always' update snapshots.
        if: ${{ always() && steps.ci-role.outputs.full == 'true' && (inputs.update_snapshots == 'always' || github.event_name == 'schedule') }}
        timeout-minutes: 10
        uses: $/.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'fix: Update Search integration test snapshots'
