name: cluster benchmark e2e tests
run-name: cluster-bench - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }} - ${{ github.event.inputs.dispatch_id || github.run_id }}

# Cluster-mode counterpart to `testoperator_run_bench.yml`. Instead of spawning a
# local `spiced` process, testoperator drives the benchmark against a SUT
# acquired via the system-adapter JSON-RPC protocol — here, the `spidapter`
# docker image deploying a Spice Cloud clustered app. Mirrors the
# `run_spicebench.yml` plumbing in the spicebench repo.

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Optional unique ID from a parent dispatcher, used only to identify this run.'
        required: false
        default: ''
        type: string
      spicepod_path:
        description: 'The spicepod file to test with (relative to test/spicepods/{query_set}/sf{scale_factor}/)'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
          - 'scenario'
      scenario_query_file:
        description: 'Path to scenario query file (required when query_set is scenario)'
        required: false
        type: string
        default: ''
      query_transport:
        description: 'Which distributed path inside the cluster to exercise'
        required: true
        default: 'v1-queries'
        type: choice
        options:
          - 'v1-queries'  # Ballista distributed query (HTTP /v1/queries) — sets --distributed
          - 'flightsql'   # Distributed accelerations (Flight SQL gRPC)
      compute:
        description: |
          Where the cluster runs. `scp` deploys a Spice Cloud app. `ec2` launches
          a temporary scheduler and `executor_replicas` executor instances in the
          sandbox account for each image in `ec2_images`, and terminates them
          when that image's run ends.
        required: false
        default: 'scp'
        type: choice
        options:
          - 'scp'
          - 'ec2'
      ec2_images:
        description: |
          `compute: ec2` only. Comma-separated `spiced` images to run in order on
          identical clusters, e.g. `spiceai/spiceai:2.3.2,spiceai/spiceai:2.4.0-rc.3`.
        required: false
        default: ''
        type: string
      executor_replicas:
        description: 'Number of spidapter executor replicas'
        required: true
        default: '4'
        type: string
      organization_tag:
        description: 'Organization tag applied to the spidapter app; selects the target nodegroup (empty = shared default nodegroup)'
        required: false
        default: 'spicehq'
        type: string
      channel:
        description: 'Spice runtime image channel passed to spidapter (ignored when custom_image_tag is set)'
        required: true
        default: 'nightly'
        type: choice
        options:
          - 'nightly'
          - 'preview'
          - 'stable'
          - 'internal'
      custom_image_tag:
        description: |
          Custom runtime container image tag from `ghcr.io/spiceai/spiceai-dev`
          (e.g. `trunk-20260514.1055`, produced by the `spiced_docker_dev`
          workflow). When set, overrides `channel` so the bench runs against a
          specific spiced build instead of the published channel image. The
          cluster dispatch workflow sets this automatically after building the
          commit-pinned image; set it manually only when running this workflow
          directly against a pre-built image.
        required: false
        default: ''
        type: string
      shuffle_location:
        description: |
          Ballista shuffle location passed to spidapter as SPIDAPTER_SHUFFLE_LOCATION.
          Supports `{github_run_id}` and `{github_run_attempt}` placeholders.
        required: false
        default: ''
        type: string
      query_temp_directory:
        description: 'runtime.query.temp_directory passed to spidapter (for spill/local work files)'
        required: false
        default: ''
        type: string
      app_storage_size_gb:
        description: 'PVC size in GiB for the scheduler pod (/data)'
        required: false
        default: ''
        type: string
      executor_storage_size_gb:
        description: 'PVC size in GiB for executor pods (/data)'
        required: false
        default: ''
        type: string
      ephemeral_storage_limit:
        description: 'Pod ephemeral-storage limit passed to spidapter (e.g. 20Gi)'
        required: false
        default: ''
        type: string
      cayenne_file_path:
        description: 'Cayenne file accelerator base path passed to spidapter (e.g. /data/cayenne)'
        required: false
        default: ''
        type: string
      cayenne_metadata_dir:
        description: 'Cayenne metadata directory passed to spidapter (e.g. /data/cayenne/metadata)'
        required: false
        default: ''
        type: string
      cluster_name:
        description: |
          Spice Cloud nodegroup name passed to spidapter as SPIDAPTER_CLUSTER_NAME
          (from GET /v1/clusters). Empty keeps the default regional shared stamp;
          set e.g. `spicehq-ballista` to pin apps onto that private nodegroup.
        required: false
        default: ''
        type: string
      scale_factor:
        description: 'Scale factor for the benchmark'
        required: false
        type: string
        default: '1'
      validate_results:
        description: 'Validate query results against expected (where supported)'
        required: false
        type: boolean
        default: false
      update_snapshots:
        description: |
          How to handle insta snapshot mismatches. `default` decides based on
          the branch (release/* → no, anything else → always). `always` creates
          new baselines on mismatch (use this on a brand-new spicepod that
          has no snapshots yet). `no` fails on any drift, matching production
          benchmark behavior. Mirrors `testoperator_run_bench.yml`.
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'
          - 'always'
          - 'no'
      ready_wait:
        description: 'Seconds to wait for the cluster to become ready'
        required: true
        default: '600'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'

# run-cluster-bench declares the write grants it uses.
permissions:
  contents: read

# Centralized defaults so workflow_dispatch runs have one fallback chain.
# Defaults exercise the public-S3 TPC-H Ballista distributed-query path
# (HTTP /v1/queries against the federated S3 spicepod).
jobs:
  run-cluster-bench:
    # Assumes a CI AWS role, so it runs from testoperator_run_cluster_bench_aws.yml; see that file.
    permissions:
      # `write` on contents + pull-requests so the "Open snapshot-update PR" step
      # can push a branch and open a PR. `packages: read` covers the spidapter
      # GHCR image pull.
      contents: write
      packages: read
      pull-requests: write
      # `actions: write` approves the PR's held pull_request runs
      # (.github/scripts/approve_bot_pr_runs.sh).
      actions: write
      # `compute: ec2` assumes the sandbox benchmark role over OIDC.
      id-token: write
    uses: spiceai/spiceai/.github/workflows/testoperator_run_cluster_bench_aws.yml@trunk
    with:
      app_storage_size_gb: ${{ github.event.inputs.app_storage_size_gb }}
      cayenne_file_path: ${{ github.event.inputs.cayenne_file_path }}
      cayenne_metadata_dir: ${{ github.event.inputs.cayenne_metadata_dir }}
      channel: ${{ github.event.inputs.channel }}
      cluster_name: ${{ github.event.inputs.cluster_name }}
      compute: ${{ github.event.inputs.compute }}
      custom_image_tag: ${{ github.event.inputs.custom_image_tag }}
      ec2_images: ${{ github.event.inputs.ec2_images }}
      ephemeral_storage_limit: ${{ github.event.inputs.ephemeral_storage_limit }}
      executor_replicas: ${{ github.event.inputs.executor_replicas }}
      executor_storage_size_gb: ${{ github.event.inputs.executor_storage_size_gb }}
      organization_tag: ${{ github.event.inputs.organization_tag }}
      query_set: ${{ github.event.inputs.query_set }}
      query_temp_directory: ${{ github.event.inputs.query_temp_directory }}
      query_transport: ${{ github.event.inputs.query_transport }}
      ready_wait: ${{ github.event.inputs.ready_wait }}
      runner_type: ${{ github.event.inputs.runner_type }}
      scale_factor: ${{ github.event.inputs.scale_factor }}
      scenario_query_file: ${{ github.event.inputs.scenario_query_file }}
      shuffle_location: ${{ github.event.inputs.shuffle_location }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
      update_snapshots: ${{ github.event.inputs.update_snapshots }}
      validate_results: ${{ github.event.inputs.validate_results }}
