name: cluster benchmark e2e tests
run-name: cluster-bench - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }} - ${{ github.event.inputs.dispatch_id || github.run_id }}

# Cluster-mode counterpart to `testoperator_run_bench.yml`. Instead of spawning a
# local `spiced` process, testoperator drives the benchmark against a SUT
# acquired via the system-adapter JSON-RPC protocol — here, the `spidapter`
# docker image deploying a Spice Cloud clustered app. Mirrors the
# `run_spicebench.yml` plumbing in the spicebench repo.

on:
  workflow_dispatch:
    inputs:
      dispatch_id:
        description: 'Optional unique ID from a parent dispatcher, used only to identify this run.'
        required: false
        default: ''
        type: string
      spicepod_path:
        description: 'The spicepod file to test with (relative to test/spicepods/{query_set}/sf{scale_factor}/)'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
          - 'scenario'
      scenario_query_file:
        description: 'Path to scenario query file (required when query_set is scenario)'
        required: false
        type: string
        default: ''
      query_transport:
        description: 'Which distributed path inside the cluster to exercise'
        required: true
        default: 'flightsql'
        type: choice
        options:
          - 'flightsql'   # Distributed accelerations (Flight SQL gRPC)
          - 'v1-queries'  # Ballista distributed query (HTTP /v1/queries) — sets --distributed
      executor_replicas:
        description: 'Number of spidapter executor replicas'
        required: true
        default: '4'
        type: string
      channel:
        description: 'Spice runtime image channel passed to spidapter (ignored when custom_image_tag is set)'
        required: true
        default: 'nightly'
        type: choice
        options:
          - 'nightly'
          - 'preview'
          - 'stable'
          - 'internal'
      custom_image_tag:
        description: |
          Custom runtime container image tag from `ghcr.io/spiceai/spiceai-dev`
          (e.g. `trunk-20260514.1055`, produced by the `spiced_docker_dev`
          workflow). When set, overrides `channel` so the bench runs against a
          specific spiced build instead of the published channel image. The
          cluster dispatch workflow sets this automatically after building the
          commit-pinned image; set it manually only when running this workflow
          directly against a pre-built image.
        required: false
        default: ''
        type: string
      shuffle_location:
        description: |
          Ballista shuffle location passed to spidapter as SPIDAPTER_SHUFFLE_LOCATION.
          Supports `{github_run_id}` and `{github_run_attempt}` placeholders.
        required: false
        default: ''
        type: string
      query_temp_directory:
        description: 'runtime.query.temp_directory passed to spidapter (for spill/local work files)'
        required: false
        default: ''
        type: string
      app_storage_size_gb:
        description: 'PVC size in GiB for the scheduler pod (/data)'
        required: false
        default: ''
        type: string
      executor_storage_size_gb:
        description: 'PVC size in GiB for executor pods (/data)'
        required: false
        default: ''
        type: string
      ephemeral_storage_limit:
        description: 'Pod ephemeral-storage limit passed to spidapter (e.g. 20Gi)'
        required: false
        default: ''
        type: string
      cayenne_file_path:
        description: 'Cayenne file accelerator base path passed to spidapter (e.g. /data/cayenne)'
        required: false
        default: ''
        type: string
      cayenne_metadata_dir:
        description: 'Cayenne metadata directory passed to spidapter (e.g. /data/cayenne/metadata)'
        required: false
        default: ''
        type: string
      scale_factor:
        description: 'Scale factor for the benchmark'
        required: false
        type: string
        default: '1'
      validate_results:
        description: 'Validate query results against expected (where supported)'
        required: false
        type: boolean
        default: true
      update_snapshots:
        description: |
          How to handle insta snapshot mismatches. `default` decides based on
          the branch (release/* → no, anything else → always). `always` creates
          new baselines on mismatch (use this on a brand-new spicepod that
          has no snapshots yet). `no` fails on any drift, matching production
          benchmark behavior. Mirrors `testoperator_run_bench.yml`.
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'
          - 'always'
          - 'no'
      ready_wait:
        description: 'Seconds to wait for the cluster to become ready'
        required: true
        default: '600'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'

permissions:
  # `write` on contents + pull-requests so the "Open snapshot-update PR" step
  # can push a branch and open a PR. `packages: read` covers the spidapter
  # GHCR image pull. Matches the implicit permissions
  # `testoperator_run_bench.yml` inherits from the repo default.
  contents: write
  packages: read
  pull-requests: write

# Centralized defaults so workflow_dispatch runs have one fallback chain.
# Defaults exercise the public-S3 TPC-H Cayenne distributed-acceleration
# Flight SQL path.
env:
  CB_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path || 'distributed/s3-public[parquet]-cayenne[file].yaml' }}
  CB_QUERY_SET: ${{ github.event.inputs.query_set || 'tpch' }}
  CB_SCENARIO_QUERY_FILE: ${{ github.event.inputs.scenario_query_file || '' }}
  CB_QUERY_TRANSPORT: ${{ github.event.inputs.query_transport || 'flightsql' }}
  CB_EXECUTOR_REPLICAS: ${{ github.event.inputs.executor_replicas || '3' }}
  CB_CHANNEL: ${{ github.event.inputs.channel || 'nightly' }}
  CB_CUSTOM_IMAGE_TAG: ${{ github.event.inputs.custom_image_tag || '' }}
  CB_SHUFFLE_LOCATION: ${{ github.event.inputs.shuffle_location || '' }}
  CB_QUERY_TEMP_DIRECTORY: ${{ github.event.inputs.query_temp_directory || '' }}
  CB_APP_STORAGE_SIZE_GB: ${{ github.event.inputs.app_storage_size_gb || '' }}
  CB_EXECUTOR_STORAGE_SIZE_GB: ${{ github.event.inputs.executor_storage_size_gb || '' }}
  CB_EPHEMERAL_STORAGE_LIMIT: ${{ github.event.inputs.ephemeral_storage_limit || '' }}
  CB_CAYENNE_FILE_PATH: ${{ github.event.inputs.cayenne_file_path || '' }}
  CB_CAYENNE_METADATA_DIR: ${{ github.event.inputs.cayenne_metadata_dir || '' }}
  CB_SCALE_FACTOR: ${{ github.event.inputs.scale_factor || '1' }}
  CB_VALIDATE_RESULTS: ${{ github.event.inputs.validate_results || 'true' }}
  CB_UPDATE_SNAPSHOTS: ${{ github.event.inputs.update_snapshots || 'default' }}
  CB_READY_WAIT: ${{ github.event.inputs.ready_wait || '600' }}
  CB_RUNNER_TYPE: ${{ github.event.inputs.runner_type || 'spiceai-dev-runners' }}

jobs:
  run-cluster-bench:
    name: Run cluster benchmark
    runs-on: ${{ github.event.inputs.runner_type || 'spiceai-dev-runners' }}
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Determine snapshot update mode
        id: determine_update_snapshots
        run: |
          # `default` → branch-based: release/* never updates, anything else
          # always updates. Mirrors testoperator_run_bench.yml so cluster-bench
          # snapshot policy is consistent with the single-node bench.
          update_mode="${CB_UPDATE_SNAPSHOTS}"
          if [ "${update_mode}" = "default" ] || [ -z "${update_mode}" ]; then
            branch_name="${{ github.ref_name }}"
            if [[ "${branch_name}" == "release/"* ]]; then
              update_mode="no"
            else
              update_mode="always"
            fi
          fi

          echo "Using update_snapshots=${update_mode}" >&2
          echo "update_snapshots=${update_mode}" >> "${GITHUB_OUTPUT}"

      - name: Set spicepod path
        id: set_spicepod_path
        run: |
          query_set="${CB_QUERY_SET}"
          query_set="${query_set%%\[*\]*}"
          SPICEPOD_PATH="./test/spicepods/${query_set}/sf${CB_SCALE_FACTOR}/${CB_SPICEPOD_PATH}"
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup Testoperator
        uses: ./.github/actions/setup-testoperator-data
        with:
          query_set: ${{ env.CB_QUERY_SET }}

      - name: Build Spidapter
        uses: ./.github/actions/build-spidapter
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Management login (prod)
        uses: ./.github/actions/management-login
        with:
          token-url: https://spice.ai/api/oauth/token
          client-id: ${{ secrets.SPICE_MANAGEMENT_CLIENT_ID_PROD }}
          client-secret: ${{ secrets.SPICE_MANAGEMENT_CLIENT_SECRET_PROD }}
          # Exports SPICEAI_API_KEY for subsequent steps. Same prod creds
          # spicebench's run_spicebench.yml uses.

      - name: Run the cluster benchmark - ${{ env.CB_SPICEPOD_PATH }}
        env:
          SPICEAI_API_KEY: ${{ env.SPICEAI_API_KEY }}
          SPICE_CLOUD_API_URL: https://api.spice.ai
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ICEBERG_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ICEBERG_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          SCHEDULER_STATE_LOCATION: 's3://spiceai-testing-cluster-state/testoperator-cluster-bench-${{ github.run_id }}/'
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          EXECUTOR_REPLICAS: ${{ env.CB_EXECUTOR_REPLICAS }}
          CHANNEL: ${{ env.CB_CHANNEL }}
          CUSTOM_IMAGE_TAG: ${{ env.CB_CUSTOM_IMAGE_TAG }}
          SHUFFLE_LOCATION: ${{ env.CB_SHUFFLE_LOCATION }}
          QUERY_TEMP_DIRECTORY: ${{ env.CB_QUERY_TEMP_DIRECTORY }}
          APP_STORAGE_SIZE_GB: ${{ env.CB_APP_STORAGE_SIZE_GB }}
          EXECUTOR_STORAGE_SIZE_GB: ${{ env.CB_EXECUTOR_STORAGE_SIZE_GB }}
          EPHEMERAL_STORAGE_LIMIT: ${{ env.CB_EPHEMERAL_STORAGE_LIMIT }}
          CAYENNE_FILE_PATH: ${{ env.CB_CAYENNE_FILE_PATH }}
          CAYENNE_METADATA_DIR: ${{ env.CB_CAYENNE_METADATA_DIR }}
          QUERY_SET: ${{ env.CB_QUERY_SET }}
          QUERY_TRANSPORT: ${{ env.CB_QUERY_TRANSPORT }}
          SCALE_FACTOR: ${{ env.CB_SCALE_FACTOR }}
          VALIDATE_RESULTS: ${{ env.CB_VALIDATE_RESULTS }}
          READY_WAIT: ${{ env.CB_READY_WAIT }}
          INSTA_UPDATE: ${{ steps.determine_update_snapshots.outputs.update_snapshots }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          SCENARIO_QUERY_FILE: ${{ env.CB_SCENARIO_QUERY_FILE }}
        run: |
          set -euo pipefail

          # Translate the abstract transport name into the concrete testoperator
          # flag. `--distributed` selects the existing DistributedExecutor that
          # POSTs to /v1/queries; the default (no flag) keeps the Flight SQL
          # path that exercises distributed accelerations.
          TRANSPORT_FLAG=""
          if [ "${QUERY_TRANSPORT}" = "v1-queries" ]; then
            TRANSPORT_FLAG="--distributed"
          fi

          # Optional scenario query file (only used when --query-set scenario).
          SCENARIO_ARG=""
          if [ -n "${SCENARIO_QUERY_FILE}" ]; then
            SCENARIO_ARG="--scenario-query-file ./test/scenario/${SCENARIO_QUERY_FILE}"
          fi

          # Run the freshly-built spidapter binary as the JSON-RPC adapter.
          # spidapter reads its config from SPIDAPTER_*/SPICEAI_*/AWS_*/SCHEDULER_*
          # env vars, which testoperator's child process inherits from this step's
          # env block.
          export SPIDAPTER_EXECUTOR_REPLICAS="${EXECUTOR_REPLICAS}"

          resolve_spidapter_template() {
            local value="$1"
            value="${value//\{github_run_id\}/${GITHUB_RUN_ID}}"
            value="${value//\{github_run_attempt\}/${GITHUB_RUN_ATTEMPT}}"
            echo "${value}"
          }

          export_spidapter_env_if_set() {
            local env_name="$1"
            local raw_value="$2"
            if [ -n "${raw_value}" ]; then
              local resolved_value
              resolved_value="$(resolve_spidapter_template "${raw_value}")"
              export "${env_name}=${resolved_value}"
              echo "${env_name}=${resolved_value}"
            fi
          }

          export_spidapter_env_if_set SPIDAPTER_SHUFFLE_LOCATION "${SHUFFLE_LOCATION}"
          export_spidapter_env_if_set SPIDAPTER_QUERY_TEMP_DIRECTORY "${QUERY_TEMP_DIRECTORY}"
          export_spidapter_env_if_set SPIDAPTER_APP_STORAGE_SIZE_GB "${APP_STORAGE_SIZE_GB}"
          export_spidapter_env_if_set SPIDAPTER_EXECUTOR_STORAGE_SIZE_GB "${EXECUTOR_STORAGE_SIZE_GB}"
          export_spidapter_env_if_set SPIDAPTER_EPHEMERAL_STORAGE_LIMIT_GB "${EPHEMERAL_STORAGE_LIMIT}"
          export_spidapter_env_if_set SPIDAPTER_CAYENNE_FILE_PATH "${CAYENNE_FILE_PATH}"
          export_spidapter_env_if_set SPIDAPTER_CAYENNE_METADATA_DIR "${CAYENNE_METADATA_DIR}"

          # When a custom image tag is provided (e.g. a `trunk-<sha>` image
          # freshly published by `spiced_docker_dev`), pin spidapter to that
          # tag via SPIDAPTER_IMAGE_TAG AND flip the channel to `internal` so
          # the Spice Cloud control plane resolves the image against the dev
          # GHCR registry (`ghcr.io/spiceai/spiceai-dev`) instead of the
          # enterprise ECR. Matches spicebench's `run_spicebench_debug_spice_cloud.yml`
          # pattern — `nightly` is for default channel-published runtimes;
          # `internal` is for the per-commit images we build ourselves.
          ADAPTER_CHANNEL="${CHANNEL}"
          if [ -n "${CUSTOM_IMAGE_TAG}" ]; then
            echo "Pinning spidapter to image tag: ${CUSTOM_IMAGE_TAG} (channel: internal)"
            export SPIDAPTER_IMAGE_TAG="${CUSTOM_IMAGE_TAG}"
            ADAPTER_CHANNEL="internal"
          fi

          rm -rf .spice/data
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" testoperator run bench \
            -p "${SPICEPOD_PATH}" \
            --query-set "${QUERY_SET}" \
            --scale-factor "${SCALE_FACTOR}" \
            --ready-wait "${READY_WAIT}" \
            --disable-progress-bars \
            --validate="${VALIDATE_RESULTS}" \
            --metrics \
            ${TRANSPORT_FLAG} \
            ${SCENARIO_ARG} \
            --system-adapter-stdio-cmd spidapter \
            --system-adapter-stdio-args "stdio --verbose --channel ${ADAPTER_CHANNEL}" \
            --system-adapter-param channel="${CHANNEL}" \
            --system-adapter-param executor_replicas="${EXECUTOR_REPLICAS}" \
            --system-adapter-param custom_image_tag="${CUSTOM_IMAGE_TAG}" \
            --system-adapter-param query_transport="${QUERY_TRANSPORT}"

      - name: Install gh CLI
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always'
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed"
            exit 0
          fi
          (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y))
          sudo mkdir -p -m 755 /etc/apt/keyrings
          out=$(mktemp)
          wget -nv -O "$out" https://cli.github.com/packages/githubcli-archive-keyring.gpg
          cat "$out" | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Open snapshot-update PR
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICEPOD_PATH_DISPLAY: ${{ env.CB_SPICEPOD_PATH }}
          QUERY_SET: ${{ env.CB_QUERY_SET }}
          SCALE_FACTOR: ${{ env.CB_SCALE_FACTOR }}
          QUERY_TRANSPORT: ${{ env.CB_QUERY_TRANSPORT }}
          EXECUTOR_REPLICAS: ${{ env.CB_EXECUTOR_REPLICAS }}
          CHANNEL: ${{ env.CB_CHANNEL }}
          CUSTOM_IMAGE_TAG: ${{ env.CB_CUSTOM_IMAGE_TAG }}
        run: |
          set -euo pipefail
          git fetch --unshallow || true

          # Categorize snap-file changes from the working tree. `git status -s`
          # output starts with status codes: `??` for untracked (new baselines),
          # `M ` for modified (drift updates), etc. Restrict to `.snap` files so
          # we don't accidentally sweep up build artifacts.
          mapfile -t new_files < <(git status -s -- '*.snap' | awk '/^\?\?/ { print $2 }')
          mapfile -t modified_files < <(git status -s -- '*.snap' | awk '/^.M/ || /^M / { print $2 }')

          new_count=${#new_files[@]}
          modified_count=${#modified_files[@]}
          total=$((new_count + modified_count))

          if [ "$total" -eq 0 ]; then
            echo "No snapshot changes; skipping PR"
            exit 0
          fi

          # Branch name keyed on the image tag (if pinned) or the run id, so
          # repeat runs against the same image converge on one PR.
          if [ -n "${CUSTOM_IMAGE_TAG}" ]; then
            BRANCH_ID="${CUSTOM_IMAGE_TAG}"
          else
            BRANCH_ID="${{ github.run_id }}"
          fi
          # Sanitize the spicepod path for use in the branch name (slashes/
          # brackets aren't great ref characters).
          slug="$(echo "${SPICEPOD_PATH_DISPLAY}" | sed 's#[][/]#-#g' | sed 's#--*#-#g')"
          BRANCH_NAME="testoperator-cluster-snapshot-update/${BRANCH_ID}-${slug}"

          git config --global user.name 'Spice Benchmark Snapshot Update Bot'
          git config --global user.email 'spiceaibot@spice.ai'
          git checkout -b "${BRANCH_NAME}"
          git add '*.snap'

          if git diff --cached --quiet; then
            echo "No staged changes after git add; nothing to commit"
            exit 0
          fi

          # Short summary line for the commit message.
          if [ "$modified_count" -eq 0 ]; then
            commit_summary="create ${new_count} baseline$( [ "$new_count" -ne 1 ] && echo s ) for ${SPICEPOD_PATH_DISPLAY}"
          elif [ "$new_count" -eq 0 ]; then
            commit_summary="update ${modified_count} snapshot$( [ "$modified_count" -ne 1 ] && echo s ) for ${SPICEPOD_PATH_DISPLAY}"
          else
            commit_summary="${new_count} new + ${modified_count} updated snapshot$( [ "$total" -ne 1 ] && echo s ) for ${SPICEPOD_PATH_DISPLAY}"
          fi

          git commit -m "fix(cluster-bench): ${commit_summary}"
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            git pull --rebase origin "${BRANCH_NAME}"
          fi
          git push origin "${BRANCH_NAME}"

          PR_URL="$(gh pr list --head "${BRANCH_NAME}" --state open --json url --jq '.[].url')"
          if [ -n "${PR_URL}" ]; then
            echo "PR already exists -> ${PR_URL}"
            exit 0
          fi

          # Image identifier: pinned tag if the workflow was given one,
          # otherwise the channel.
          if [ -n "${CUSTOM_IMAGE_TAG}" ]; then
            image_descriptor="\`ghcr.io/spiceai/spiceai-dev:${CUSTOM_IMAGE_TAG}\` (pinned)"
          else
            image_descriptor="channel \`${CHANNEL}\`"
          fi

          # Extract the affected `tpch_qN` / `tpcds_qN` / `clickbench_qN` query slugs from the
          # snap filenames so reviewers can see which queries drifted at a
          # glance. Snap names look like:
          #   test_framework__snapshot__<spicepod>_<query>_<kind>_sf<N>.snap
          extract_query() {
            local f="$1"
            basename "$f" .snap | grep -oE '(tp(ch|cds)|clickbench)_q[0-9]+' | head -n 1
          }

          uniq_queries() {
            local -a names=()
            for f in "$@"; do
              local q
              q="$(extract_query "$f")"
              [ -n "$q" ] && names+=("$q")
            done
            printf '%s\n' "${names[@]}" | sort -u | tr '\n' ' '
          }

          new_query_list="$(uniq_queries "${new_files[@]:-}")"
          mod_query_list="$(uniq_queries "${modified_files[@]:-}")"

          # Build the PR body. Use printf so heredoc indentation doesn't sneak
          # into the rendered markdown.
          body_file="$(mktemp)"
          {
            printf '**%s** by run [#%s](%s/%s/actions/runs/%s).\n\n' \
              "${commit_summary}" \
              "${{ github.run_id }}" \
              "${{ github.server_url }}" \
              "${{ github.repository }}" \
              "${{ github.run_id }}"

            printf '### Run configuration\n\n'
            printf '| Field | Value |\n| --- | --- |\n'
            printf '| Spicepod | `%s` |\n' "${SPICEPOD_PATH_DISPLAY}"
            printf '| Query set | `%s` |\n' "${QUERY_SET}"
            printf '| Scale factor | `%s` |\n' "${SCALE_FACTOR}"
            printf '| Query transport | `%s` |\n' "${QUERY_TRANSPORT}"
            printf '| Cluster | %s executor replica(s), %s |\n' \
              "${EXECUTOR_REPLICAS}" "${image_descriptor}"
            printf '\n'

            if [ "$new_count" -gt 0 ]; then
              printf '### New baselines (%s file' "${new_count}"
              [ "$new_count" -ne 1 ] && printf 's'
              printf ')\n\n'
              if [ -n "${new_query_list}" ]; then
                printf 'Queries: %s\n\n' "${new_query_list}"
              fi
              printf '<details><summary>Files</summary>\n\n```\n'
              printf '%s\n' "${new_files[@]}"
              printf '```\n\n</details>\n\n'
            fi

            if [ "$modified_count" -gt 0 ]; then
              printf '### Updated snapshots (%s file' "${modified_count}"
              [ "$modified_count" -ne 1 ] && printf 's'
              printf ')\n\n'
              if [ -n "${mod_query_list}" ]; then
                printf 'Queries: %s\n\n' "${mod_query_list}"
              fi
              printf '<details><summary>Files</summary>\n\n```\n'
              printf '%s\n' "${modified_files[@]}"
              printf '```\n\n</details>\n\n'
            fi

            printf '### Review hints\n\n'
            # `printf -- …` so leading `-` in the format string isn't parsed
            # as an option flag.
            printf -- '- **New baselines**: expected when a spicepod is added or the snapshot predicate changes — confirm the queries shown look sane (correct row count, ordered output, no transient values) before merging.\n'
            printf -- '- **Updated snapshots**: indicate planner or execution drift. Inspect the diff and cross-reference recent trunk commits touching the runtime / federation / acceleration layer to confirm the change is intentional.\n'
            printf -- '- The cluster-bench harness only opens this PR when `update_snapshots=always` (the default for non-`release/*` branches). To gate snapshot drift in CI, set `update_snapshots=no` on the dispatch.\n'
          } > "${body_file}"

          # Title carries the same summary that's in the commit message — short
          # but specifies cluster-bench, file counts, spicepod, and query set
          # so it stands apart in the auto-PR list.
          title="snapshot(cluster-bench): ${commit_summary} (${QUERY_SET} sf${SCALE_FACTOR})"

          gh pr create \
            --title "${title}" \
            --body-file "${body_file}" \
            --base "${{ github.ref_name }}" \
            --head "${BRANCH_NAME}" \
            --label area/ci
