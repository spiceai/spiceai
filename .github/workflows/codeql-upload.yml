name: CodeQL SARIF upload

# Privileged companion to `codeql-analysis.yml`.
#
# `workflow_run` loads this file from the default branch. There is no
# `workflow_dispatch`: that event runs whichever branch was selected, so a
# branch could rewrite this job and still receive `security-events: write`.
#
# The job does not check out a repository and does not read ref or sha from
# the SARIF artifact. Pull-request events are refused. `pull_request` runs the
# analysis workflow from the pull request, which can upload a clean artifact
# under the expected name. `pull_request_target` is not a trigger: CodeQL does
# not scan pull request heads. `merge_group` is accepted only when the analysis
# file at the queue SHA is the default-branch blob.
on:
  workflow_run:
    workflows: ['CodeQL']
    types:
      - completed

concurrency:
  group: codeql-sarif-upload-${{ github.event.workflow_run.id }}
  # Same source run should finish, not be cancelled mid-upload.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload SARIF
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success'
    # Download plus one code-scanning upload. Anything past this is wedged,
    # not slow, and would otherwise inherit GitHub's six-hour ceiling.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Resolve the analysis run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::Source run id '${SOURCE_RUN_ID}' is not a workflow run id, so SARIF is not uploaded."
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          path="$(jq -r '.path // empty' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion // empty' <<<"${run_json}")"
          event="$(jq -r '.event // empty' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha // empty' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch // empty' <<<"${run_json}")"
          run_repo="$(jq -r '.repository.full_name // empty' <<<"${run_json}")"

          expected_path='.github/workflows/codeql-analysis.yml'
          if [[ "${path}" != "${expected_path}" ]]; then
            echo "::error::Refusing to upload SARIF from '${path}'. Only '${expected_path}' is the trusted CodeQL analysis workflow."
            exit 1
          fi

          if [[ "${run_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Refusing to upload SARIF from '${run_repo}', so a foreign workflow run cannot publish results here."
            exit 1
          fi

          if [[ "${conclusion}" != 'success' ]]; then
            echo "::error::CodeQL run ${SOURCE_RUN_ID} concluded '${conclusion}', so there is no SARIF to publish."
            exit 1
          fi

          # trunk and release branches are the pushes this repository treats
          # as protected. A workflow_dispatch of a pull-request branch is not.
          trusted_ref() {
            case "$1" in
              trunk|release-*|release/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # Events that load the analysis file from a merge commit can rewrite
          # it. Publish only when the blob at the scanned SHA is the default
          # branch's file. The runs API does not include default_branch.
          require_default_branch_workflow() {
            local scanned_ref="$1"
            local default_branch scanned_blob trusted_blob
            default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
            if [[ -z "${default_branch}" ]]; then
              echo "::error::Could not resolve the default branch, so the analysis workflow cannot be authenticated."
              exit 1
            fi
            scanned_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${expected_path}?ref=${scanned_ref}" --jq '.sha')"
            trusted_blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${expected_path}?ref=${default_branch}" --jq '.sha')"
            if [[ -z "${scanned_blob}" || -z "${trusted_blob}" ]]; then
              echo "::error::Could not read '${expected_path}' for authentication, so SARIF is not uploaded."
              exit 1
            fi
            if [[ "${scanned_blob}" != "${trusted_blob}" ]]; then
              echo "::error::Refusing to upload SARIF: '${expected_path}' at '${scanned_ref}' does not match '${default_branch}', so the producer is not the trusted analysis workflow."
              exit 1
            fi
          }

          sha=''
          ref=''
          case "${event}" in
            pull_request|pull_request_target)
              echo "::error::Refusing to upload SARIF from '${event}'. CodeQL scans the merge queue and trunk and release pushes, not pull request heads."
              exit 1
              ;;
            merge_group)
              if [[ ! "${head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::merge_group run ${SOURCE_RUN_ID} has no merge-queue SHA, so results are not uploaded."
                exit 1
              fi
              if [[ ! "${head_branch}" =~ ^gh-readonly-queue/.+/pr-[0-9]+-[0-9a-f]+$ ]]; then
                echo "::error::Refusing to upload SARIF from merge_group on '${head_branch}'. Expected a gh-readonly-queue/<base>/pr-<n>-<sha> ref."
                exit 1
              fi
              queue_base="$(sed -E 's|^gh-readonly-queue/(.+)/pr-[0-9]+-[0-9a-f]+$|\1|' <<<"${head_branch}")"
              if ! trusted_ref "${queue_base}"; then
                echo "::error::Refusing to upload SARIF from merge_group targeting '${queue_base}'. Only trunk and release branches are trusted merge-queue bases."
                exit 1
              fi
              require_default_branch_workflow "${head_sha}"
              sha="${head_sha}"
              ref="refs/heads/${head_branch}"
              ;;
            push)
              if ! trusted_ref "${head_branch}"; then
                echo "::error::Refusing to upload SARIF from ${event} on '${head_branch}'. Only trunk and release branches run a trusted analysis workflow."
                exit 1
              fi
              sha="${head_sha}"
              ref="refs/heads/${head_branch}"
              ;;
            *)
              echo "::error::Refusing to upload SARIF from event '${event}'."
              exit 1
              ;;
          esac

          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to upload SARIF for sha '${sha}'."
            exit 1
          fi

          case "${ref}" in
            refs/heads/trunk|refs/heads/release-*|refs/heads/release/*|refs/heads/gh-readonly-queue/*) ;;
            *)
              echo "::error::Unsupported upload ref '${ref}'."
              exit 1
              ;;
          esac

          {
            echo "run-id=${SOURCE_RUN_ID}"
            echo "sha=${sha}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      # A merge_group analysis outlives its queue entry: by the time it completes,
      # the queue has often merged or ejected the batch and deleted its
      # gh-readonly-queue ref, and code scanning rejects an upload to a ref that no
      # longer exists. The next step decides whether a failure here is that.
      - name: Upload SARIF to code scanning
        id: upload
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: sarif-results
          category: /language:rust
          sha: ${{ steps.source.outputs.sha }}
          ref: ${{ steps.source.outputs.ref }}
          wait-for-processing: true

      # Only a deleted merge-queue ref is excused. A merged batch is scanned again
      # by the trunk push, and an ejected one never reaches a protected branch.
      # Every other failure, including one the ref probe cannot classify, fails.
      - name: Fail unless the merge-queue ref is gone
        if: steps.upload.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_REF: ${{ steps.source.outputs.ref }}
        shell: bash
        run: |
          set -uo pipefail

          if [[ "${UPLOAD_REF}" != refs/heads/gh-readonly-queue/* ]]; then
            echo "::error::SARIF upload to '${UPLOAD_REF}' failed. See the 'Upload SARIF to code scanning' step."
            exit 1
          fi

          probe_err="$(mktemp)"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${UPLOAD_REF#refs/}" --silent 2>"${probe_err}"; then
            echo "::error::SARIF upload to '${UPLOAD_REF}' failed while the ref still exists. See the 'Upload SARIF to code scanning' step."
            exit 1
          fi
          if grep -q 'HTTP 404' "${probe_err}"; then
            echo "::notice::'${UPLOAD_REF}' was deleted by the merge queue before this upload ran, so there is nothing to attach SARIF to. Not a failure."
            exit 0
          fi
          echo "::error::SARIF upload to '${UPLOAD_REF}' failed, and probing the ref failed too, so the cause is unknown:"
          head -c 2000 "${probe_err}"
          exit 1
