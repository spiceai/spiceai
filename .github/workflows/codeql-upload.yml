name: CodeQL SARIF upload

# Privileged companion to `codeql-analysis.yml`.
#
# `workflow_run` loads this file from the default branch. There is no
# `workflow_dispatch`: that event runs whichever branch was selected, so a
# branch could rewrite this job and still receive `security-events: write`.
#
# The job does not check out a repository and does not read ref or sha from
# the SARIF artifact. `pull_request` and `merge_group` are refused: those
# events run the analysis workflow from the pull request, which can upload a
# clean artifact under the expected name. `pull_request_target` is accepted
# because GitHub runs the default-branch analysis file; the recorded commit
# is the pull request head, the same commit that file checks out.
on:
  workflow_run:
    workflows: ['CodeQL']
    types:
      - completed

concurrency:
  group: codeql-sarif-upload-${{ github.event.workflow_run.id }}
  # Same source run should finish, not be cancelled mid-upload.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    name: Upload SARIF
    runs-on: ubuntu-24.04
    if: github.event.workflow_run.conclusion == 'success'
    # Download plus one code-scanning upload. Anything past this is wedged,
    # not slow, and would otherwise inherit GitHub's six-hour ceiling.
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Resolve the analysis run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${SOURCE_RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::Source run id '${SOURCE_RUN_ID}' is not a workflow run id, so SARIF is not uploaded."
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          path="$(jq -r '.path // empty' <<<"${run_json}")"
          conclusion="$(jq -r '.conclusion // empty' <<<"${run_json}")"
          event="$(jq -r '.event // empty' <<<"${run_json}")"
          head_sha="$(jq -r '.head_sha // empty' <<<"${run_json}")"
          head_branch="$(jq -r '.head_branch // empty' <<<"${run_json}")"
          run_repo="$(jq -r '.repository.full_name // empty' <<<"${run_json}")"

          expected_path='.github/workflows/codeql-analysis.yml'
          if [[ "${path}" != "${expected_path}" ]]; then
            echo "::error::Refusing to upload SARIF from '${path}'. Only '${expected_path}' is the trusted CodeQL analysis workflow."
            exit 1
          fi

          if [[ "${run_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            echo "::error::Refusing to upload SARIF from '${run_repo}', so a foreign workflow run cannot publish results here."
            exit 1
          fi

          if [[ "${conclusion}" != 'success' ]]; then
            echo "::error::CodeQL run ${SOURCE_RUN_ID} concluded '${conclusion}', so there is no SARIF to publish."
            exit 1
          fi

          # trunk and release branches are the pushes this repository treats
          # as protected. A workflow_dispatch of a pull-request branch is not.
          trusted_ref() {
            case "$1" in
              trunk|release-*|release/*) return 0 ;;
              *) return 1 ;;
            esac
          }

          sha=''
          ref=''
          case "${event}" in
            pull_request|merge_group)
              echo "::error::Refusing to upload SARIF from '${event}'. That event runs the analysis workflow from the pull request, so the artifact can be a clean stand-in for a real scan."
              exit 1
              ;;
            pull_request_target)
              sha="$(jq -r '.pull_requests[0].head.sha // empty' <<<"${run_json}")"
              pr_number="$(jq -r '.pull_requests[0].number // empty' <<<"${run_json}")"
              if [[ ! "${pr_number}" =~ ^[0-9]+$ || ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::pull_request_target run ${SOURCE_RUN_ID} has no pull-request head SHA, so results are not uploaded."
                exit 1
              fi
              ref="refs/pull/${pr_number}/head"
              ;;
            push|schedule|workflow_dispatch)
              if ! trusted_ref "${head_branch}"; then
                echo "::error::Refusing to upload SARIF from ${event} on '${head_branch}'. Only trunk and release branches run a trusted analysis workflow."
                exit 1
              fi
              sha="${head_sha}"
              ref="refs/heads/${head_branch}"
              ;;
            *)
              echo "::error::Refusing to upload SARIF from event '${event}'."
              exit 1
              ;;
          esac

          if [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to upload SARIF for sha '${sha}'."
            exit 1
          fi

          case "${ref}" in
            refs/heads/*|refs/pull/[0-9]*/head) ;;
            *)
              echo "::error::Unsupported upload ref '${ref}'."
              exit 1
              ;;
          esac

          {
            echo "run-id=${SOURCE_RUN_ID}"
            echo "sha=${sha}"
            echo "ref=${ref}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: codeql-sarif-*
          path: sarif-results
          merge-multiple: true
          run-id: ${{ steps.source.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: sarif-results
          category: /language:rust
          sha: ${{ steps.source.outputs.sha }}
          ref: ${{ steps.source.outputs.ref }}
          wait-for-processing: true
