name: BigQuery workload identity federation test

# Temporary: proves the spiceai-ci-github-actions provider refuses a job outside the ci
# environment. Not for merge.
on:
  push:
    branches:
      - sgrebnov/bigquery-wif-test

permissions:
  contents: read

jobs:
  outside-ci:
    name: Job outside the ci environment is refused
    runs-on: spiceai-dev-runners
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: sgrebnov/bigquery-per-run-key
          persist-credentials: false
          fetch-depth: 1

      - name: Try to create a key without the ci environment
        id: create
        continue-on-error: true
        uses: ./.github/actions/bigquery-service-account-key
        with:
          mode: create
          workload-identity-provider: projects/198677639031/locations/global/workloadIdentityPools/spiceai-ci-github-actions/providers/github
          minter-service-account: ci-bigquery-key-minter@spiceai-testing.iam.gserviceaccount.com
          service-account: spiceai-testing-bq@spiceai-testing.iam.gserviceaccount.com

      - name: Require the refusal
        env:
          OUTCOME: ${{ steps.create.outcome }}
        run: |
          echo "create outcome: ${OUTCOME}; key name: '${BIGQUERY_SERVICE_ACCOUNT_KEY_NAME:-}'"
          if [ "${OUTCOME}" != failure ] || [ -n "${BIGQUERY_SERVICE_ACCOUNT_KEY_NAME:-}" ]; then
            echo "::error::a job outside the ci environment was not refused"
            exit 1
          fi
