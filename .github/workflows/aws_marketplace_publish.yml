name: Publish to AWS Marketplace

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag to publish (e.g., 1.3.0-models)'
        required: true
        type: string
      repository:
        description: 'Target ECR repository (e.g., spice-ai/spiceai-enterprise or spice-ai/spiceai-enterprise-hourly)'
        required: false
        default: 'spice-ai/spiceai-enterprise'
        type: string
      platforms:
        description: 'Platforms to publish (comma separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string
      publish_docker:
        description: 'Publish Docker images'
        required: false
        default: true
        type: boolean
      publish_helm:
        description: 'Publish Helm chart'
        required: false
        default: true
        type: boolean

env:
  ECR_REGISTRY: 709825985650.dkr.ecr.us-east-1.amazonaws.com
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 903332016402

permissions:
  id-token: write
  contents: read

jobs:
  publish-docker:
    environment: production
    if: ${{ inputs.publish_docker }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/EnterpriseImageMarketplaceUpload
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR with Docker
        run: |
          set -e  # Exit on error
          echo "Logging into ECR registry with Docker..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Package Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, tag and push images
        env:
          TAG: ${{ inputs.tag }}
          OLD_TAG: ghcr.io/spicehq/spiceai-enterprise:${{ inputs.tag }}
          NEW_TAG: ${{ env.ECR_REGISTRY }}/${{ inputs.repository }}:${{ inputs.tag }}
        run: |
          set -e  # Exit on error

          # Parse platforms
          IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms }}"

          # Validate that we have platforms
          if [ ${#PLATFORMS[@]} -eq 0 ]; then
            echo "Error: No platforms specified"
            exit 1
          fi

          echo "Publishing tag: ${TAG}"
          echo "Source image: ${OLD_TAG}"
          echo "Target image: ${NEW_TAG}"
          echo "Target repository: ${{ inputs.repository }}"
          echo "Platforms: ${PLATFORMS[*]}"

          # Create manifest arguments array
          MANIFEST_ARGS=""

          # Process each platform
          for PLATFORM in "${PLATFORMS[@]}"; do
            ARCH=$(echo "${PLATFORM}" | cut -d'/' -f2) # linux/amd64 -> amd64
            ARCH_TAG="${{ env.ECR_REGISTRY }}/${{ inputs.repository }}:${TAG}-${ARCH}"
            
            echo "Processing platform: ${PLATFORM}, arch: ${ARCH}"
            
            # Pull the image for specific platform
            echo "Pulling ${OLD_TAG} for platform ${PLATFORM}..."
            docker pull --platform "${PLATFORM}" "${OLD_TAG}"
            
            # Tag for ECR
            echo "Tagging as ${ARCH_TAG}..."
            docker tag "${OLD_TAG}" "${ARCH_TAG}"
            
            # Push architecture-specific image
            echo "Pushing ${ARCH_TAG}..."
            docker push "${ARCH_TAG}"
            
            # Add to manifest arguments
            MANIFEST_ARGS="${MANIFEST_ARGS} --amend ${ARCH_TAG}"
          done

          echo "Creating manifest with args: ${MANIFEST_ARGS}"

          # Create and push manifest
          docker manifest create "${NEW_TAG}" ${MANIFEST_ARGS}
          docker manifest push "${NEW_TAG}"

          # Verify manifest
          echo "Verifying manifest:"
          docker manifest inspect "${NEW_TAG}"

  publish-helm:
    environment: production
    if: ${{ inputs.publish_helm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/EnterpriseImageMarketplaceUpload
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Modify Helm chart for enterprise
        working-directory: deploy/chart
        run: |
          set -e  # Exit on error

          echo "Original Chart.yaml:"
          cat Chart.yaml
          echo ""
          echo "Original values.yaml (image section):"
          grep -A 2 "image:" values.yaml
          echo ""

          # Extract chart name from repository (e.g., spice-ai/spiceai-enterprise -> spiceai-enterprise)
          CHART_NAME=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)
          echo "Chart name extracted from repository: ${CHART_NAME}"

          # Update Chart.yaml for enterprise version
          sed -i "s/name: spiceai-enterprise/name: ${CHART_NAME}/" Chart.yaml

          # Update values.yaml to use ECR image
          sed -i 's|repository: ghcr.io/spicehq/spiceai-enterprise|repository: ${{ env.ECR_REGISTRY }}/${{ inputs.repository }}|' values.yaml
          sed -i 's/tag: .*/tag: ${{ inputs.tag }}/' values.yaml

          echo "Modified Chart.yaml:"
          cat Chart.yaml
          echo ""
          echo "Modified values.yaml (image section):"
          grep -A 2 "image:" values.yaml

      - name: Login to Amazon ECR with Helm
        run: |
          set -e  # Exit on error
          echo "Logging into ECR registry with Helm..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | helm registry login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Package and push Helm chart
        working-directory: deploy/chart
        run: |
          set -e  # Exit on error

          # Extract chart name from repository (e.g., spice-ai/spiceai-enterprise -> spiceai-enterprise)
          CHART_NAME=$(echo "${{ inputs.repository }}" | cut -d'/' -f2)

          # Package the chart
          echo "Packaging Helm chart..."
          helm package .

          # List generated package
          echo "Generated packages:"
          ls -la *.tgz

          # Validate package exists
          CHART_PACKAGE=$(ls ${CHART_NAME}-*.tgz | head -1)
          if [ -z "${CHART_PACKAGE}" ]; then
            echo "Error: No chart package found"
            exit 1
          fi

          echo "Pushing chart package: ${CHART_PACKAGE}"

          # Push to ECR
          helm push "${CHART_PACKAGE}" oci://${{ env.ECR_REGISTRY }}/spice-ai/

          echo "Successfully pushed Helm chart: ${CHART_PACKAGE}"
