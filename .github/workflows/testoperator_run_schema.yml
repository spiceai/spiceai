name: testoperator schema tests
run-name: schema - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      min_tables:
        description: 'Minimum number of tables expected'
        required: false
        type: string

jobs:
  run-schema:
    # The service principal's federation policy trusts this environment's subject.
    environment: ci
    name: Run schema tests
    runs-on: ${{ github.event.inputs.runner_type }}
    permissions:
      actions: write  # approves the held runs of its snapshot PR
      contents: write  # pushes a snapshot branch
      pull-requests: write  # and opens its PR
      id-token: write  # RustFS credentials and Databricks access tokens
    timeout-minutes: 600
    services:
      mssql_tpch:
        image: ${{ contains(github.event.inputs.spicepod_path, 'mssql') && 'ghcr.io/spiceai/spice-mssql-bench:latest' || '' }}
        ports:
          - 1433:1433
        env:
          MSSQL_SA_PASSWORD: S3cretP@ssw0rd
          DB_NAME: tpch_sf1
      # Local, ephemeral PostgreSQL for the postgres catalog connector, mirroring
      # what the bench workflow does for SF1/SF10 (see #11730). Catalog discovery
      # reads pg_catalog, so it needs the tables to exist but not their rows -
      # the seed step below creates the schema only. Excludes the DuckLake
      # spicepods, which provision their own postgres catalog DB on the same port.
      postgres_tpch:
        image: ${{ (contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake')) && 'postgres:16' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Set spicepod path
        id: set_spicepod_path
        run: |
          SPICEPOD_PATH="./test/spicepods/tpch/sf1/${{ github.event.inputs.spicepod_path }}"
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Get RustFS credentials
        id: rustfs
        uses: ./.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Install Oracle ODPI-C
        if: ${{ contains(github.event.inputs.spicepod_path, 'oracle') }}
        uses: ./.github/actions/setup-oracle-odpi

      # Every DuckLake spicepod (ducklake[catalog] as well as ducklake[postgres+s3])
      # reads the same local postgres catalog and MinIO bucket, so all of this setup
      # keys on 'ducklake', matching testoperator_run_bench.yml.
      - name: Install PostgreSQL for DuckLake
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        uses: ./.github/actions/install-postgres
        with:
          pg-db: ducklake_catalog

      - name: Start local MinIO for DuckLake
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          # MinIO no longer publishes images or binaries: quay.io/minio/minio and minio/minio refuse
          # anonymous pulls and dl.min.io answers 410. Chainguard builds the same server from the
          # upstream source; it runs as a non-root user that cannot create /data, hence --user.
          image=cgr.dev/chainguard/minio:latest
          if ! docker run -d --name minio --user 0:0 \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$image" server /data --console-address ':9001'; then
            echo "::error::Could not start MinIO from $image. If the pull was refused, the image is no longer published there; point this step at a registry that still serves MinIO."
            exit 1
          fi

      - name: Wait for local MinIO
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'MinIO did not become ready in time.'
          docker logs minio
          exit 1

      # duckdb: and ducklake: datasets load the installed DuckDB through ADBC, matching
      # testoperator_run_bench.yml. Without it spiced never becomes ready.
      - name: Install libduckdb
        if: ${{ contains(github.event.inputs.spicepod_path, 'duckdb') || contains(github.event.inputs.spicepod_path, 'ducklake') }}
        uses: ./.github/actions/setup-libduckdb

      # The dev runner image has python3 but no pip, which the bootstrap below needs.
      - name: Set up Python
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bootstrap DuckLake TPCH SF1 catalog
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          # DuckLake stamps its catalog with the version of the extension that wrote it, and spiced reads it
          # with the installed DuckDB, which setup-libduckdb takes from the newest release in
          # test/duckdb_versions.json. A newer duckdb writes a catalog an older one rejects, so write it with
          # that same release.
          duckdb_version=$(jq -r '.versions[-1].version' test/duckdb_versions.json)
          [ -n "$duckdb_version" ] || { echo 'could not read the duckdb version from test/duckdb_versions.json'; exit 1; }
          python3 -m pip install --upgrade "duckdb==$duckdb_version" minio

          python3 <<'PY'
          import duckdb
          from minio import Minio

          bucket_name = "ducklake"
          minio = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          if not minio.bucket_exists(bucket_name):
              minio.make_bucket(bucket_name)

          tables = [
              "customer",
              "lineitem",
              "nation",
              "orders",
              "part",
              "partsupp",
              "region",
              "supplier",
          ]

          connection = duckdb.connect()
          connection.execute("INSTALL ducklake; LOAD ducklake;")
          connection.execute("INSTALL postgres; LOAD postgres;")
          connection.execute("INSTALL httpfs; LOAD httpfs;")
          connection.execute("INSTALL tpch; LOAD tpch;")

          connection.execute(
              """
              CREATE OR REPLACE SECRET minio_secret (
                TYPE s3,
                PROVIDER config,
                KEY_ID 'minioadmin',
                SECRET 'minioadmin',
                REGION 'us-east-1',
                ENDPOINT '127.0.0.1:9000',
                URL_STYLE 'path',
                USE_SSL false
              );
              """
          )

          connection.execute(
              """
              ATTACH 'ducklake:postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' AS ducklake
                (DATA_PATH 's3://ducklake/tpch_sf1/');
              """
          )

          connection.execute("CALL dbgen(sf=1);")

          for table in tables:
              connection.execute(
                  f"CREATE TABLE ducklake.main.{table} AS SELECT * FROM memory.main.{table};"
              )

          connection.close()
          PY

      # Catalog discovery enumerates tables from pg_catalog, so the schema is all
      # this needs - no TPC-H data is generated or loaded. tpch-kit is cloned only
      # for dss.ddl, which pg-init applies.
      - name: Create the postgres TPC-H schema
        if: ${{ contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') }}
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client git make
          cd test/tpc-bench
          make tpch-clone
          DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=tpch_sf1 make pg-init
          psql -U postgres -d tpch_sf1 -tAc \
            "SELECT 'tables in public: ' || count(*) FROM information_schema.tables WHERE table_schema = 'public';"

      # The image restores its database once, after a fixed sleep, and never retries;
      # see .github/scripts/mssql_tpch_restore.sh.
      - name: Wait for the SQL Server TPC-H database
        if: ${{ contains(github.event.inputs.spicepod_path, 'mssql') }}
        # The script gives up after ten minutes; this also bounds a hung docker call.
        timeout-minutes: 15
        env:
          MSSQL_SA_PASSWORD: S3cretP@ssw0rd
        run: bash .github/scripts/mssql_tpch_restore.sh "${{ job.services.mssql_tpch.id }}" tpch_sf1

      # Short-lived AWS credentials, kept out of the job's environment and passed to the step below.
      - name: Assume the Databricks Delta role
        id: aws-databricks-delta
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.NEW_AWS_DATABRICKS_DELTA_ROLE_ARN }}
          role-session-name: gha-databricks-delta-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Assume the S3 and Glue role
        id: aws-s3-athena
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_S3_ATHENA_ROLE_ARN }}
          role-session-name: gha-s3-athena-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Run the schema test - ${{ github.event.inputs.spicepod_path }}
        run: |
          # A variable set to "" is not unset. `AWS_ENDPOINT_URL=""` is an endpoint
          # override the AWS SDK rejects by panicking, which aborts the whole
          # runtime, and `DUCKLAKE_CONNECTION_STRING=""` is a connection the
          # DuckLake extension tries to open. These are only meaningful for the
          # DuckLake spicepods.
          for name in AWS_ENDPOINT_URL AWS_ALLOW_HTTP DUCKLAKE_CONNECTION_STRING; do
            if [ -z "${!name:-}" ]; then
              unset "$name"
            fi
          done

          rm -rf .spice/data
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" testoperator run schema \
            -s /usr/local/bin/spiced \
            -p ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }} \
            --ready-wait 120 \
            ${{ github.event.inputs.min_tables != '' && format('--min-tables {0}', github.event.inputs.min_tables) || '' }}
        env:
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          DATABRICKS_HOST: ${{ vars.NEW_DATABRICKS_HOST }}
          DATABRICKS_OIDC_CLIENT_ID: ${{ vars.DATABRICKS_OIDC_CLIENT_ID }}
          DATABRICKS_OIDC_AUDIENCE: ${{ vars.DATABRICKS_OIDC_AUDIENCE }}
          DATABRICKS_CLUSTER_ID: ${{ vars.NEW_DATABRICKS_CLUSTER_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ steps.aws-databricks-delta.outputs.aws-access-key-id }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ steps.aws-databricks-delta.outputs.aws-secret-access-key }}
          AWS_DATABRICKS_DELTA_SESSION_TOKEN: ${{ steps.aws-databricks-delta.outputs.aws-session-token }}
          AWS_ACCESS_KEY_ID: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'minioadmin' || steps.aws-s3-athena.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'minioadmin' || steps.aws-s3-athena.outputs.aws-secret-access-key }}
          # MinIO takes no session token. The negated form is needed: `a && '' || b` yields b.
          AWS_SESSION_TOKEN: ${{ !contains(github.event.inputs.spicepod_path, 'ducklake') && steps.aws-s3-athena.outputs.aws-session-token || '' }}
          AWS_ENDPOINT_URL: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'http://127.0.0.1:9000' || '' }}
          AWS_ALLOW_HTTP: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'true' || '' }}
          DUCKLAKE_CONNECTION_STRING: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' || '' }}
          GLUE_AWS_KEY: ${{ steps.aws-s3-athena.outputs.aws-access-key-id }}
          GLUE_AWS_SECRET: ${{ steps.aws-s3-athena.outputs.aws-secret-access-key }}
          GLUE_AWS_SESSION_TOKEN: ${{ steps.aws-s3-athena.outputs.aws-session-token }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          MYSQL_HOST: ${{ vars.TEST_MYSQL_HOST }}
          MYSQL_TCP_PORT: 3306
          MYSQL_USER: ${{ secrets.TEST_MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          MYSQL_DB: ${{ vars.TEST_MYSQL_DB }}
          POSTGRES_HOST: ${{ (contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake')) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          SPICEAI_TEST_ENDPOINT: ${{ vars.SPICE_SECRET_SPICEAI_TEST_ENDPOINT }}
          SPICEAI_TEST_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
          SPICEAI_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
          ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
          ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
          ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
          ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
          MSSQL_HOST: localhost
          MSSQL_USER: sa
          MSSQL_PASSWORD: S3cretP@ssw0rd
          MSSQL_TPCH_DB: tpch_sf1
          INSTA_UPDATE: always
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}

      - name: Install GH CLI
        run: |
          (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
          && sudo mkdir -p -m 755 /etc/apt/keyrings \
          && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
          && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Upload schema snapshots to branch
        run: |
          # One branch per source branch and spicepod, so a connector whose
          # snapshots drift keeps updating its own open PR, and a trunk run
          # never shares a branch with a release run of the same connector. A
          # run-scoped name would make the "is a PR already open" check below
          # unreachable, opening a new PR on every run.
          SLUG="$(printf '%s' '${{ github.ref_name }}/${{ github.event.inputs.spicepod_path }}' \
            | sed -e 's/\.[Yy][Aa][Mm][Ll]$//' -e 's/[^A-Za-z0-9]\{1,\}/-/g' -e 's/^-//' -e 's/-$//' \
            | tr '[:upper:]' '[:lower:]')"
          BRANCH_NAME="testoperator-snapshot-update/${SLUG}"

          git config --global user.name 'Spice Benchmark Snapshot Update Bot'
          git config --global user.email 'spiceaibot@spice.ai'
          git checkout -b "${BRANCH_NAME}"

          # Continue that branch when it already exists, so the push
          # fast-forwards onto it. Re-parenting the index onto the remote tip
          # keeps the commit to the snapshots alone instead of replaying every
          # trunk commit made since the branch was opened.
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}"; then
            git fetch origin "${BRANCH_NAME}"
            git reset --soft FETCH_HEAD
            git reset --quiet FETCH_HEAD -- .
          fi

          git add '*.snap'
          if git diff --cached --quiet; then
            echo "Schema snapshots already up to date on ${BRANCH_NAME}"
            exit 0
          fi

          git commit -m "fix: Update schema snapshots for: ${{ github.event.inputs.spicepod_path }}"
          # The checkout persists no credentials, so authenticate the push
          # itself rather than leaving a token in the local git config for the
          # rest of the job. Disable any credential helper configured on the
          # (self-hosted) runner as well, so git uses the URL-embedded token only:
          # otherwise a helper (osxkeychain / git-credential-manager) can intercept
          # the push and block on an interactive credential prompt, hanging the job.
          git -c credential.helper='' -c credential.interactive=false \
            push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" "HEAD:${BRANCH_NAME}"

          PR_URL="$(gh pr list --head "${BRANCH_NAME}" --state open --json url --jq .[].url)"
          if [[ -n "${PR_URL}" ]]; then
            echo "Updated the open PR -> ${PR_URL}"
          else
            # Target the branch the run was dispatched on: a release branch's
            # snapshots describe that branch, not trunk. enforce-pull-with-spice, a
            # required check, fails a PR without both a kind/ and an area/ label.
            gh pr create \
              --title "fix: Update schema snapshots for ${{ github.event.inputs.spicepod_path }}" \
              --body "Updates the schema snapshots for \`${{ github.event.inputs.spicepod_path }}\` on \`${{ github.ref_name }}\`." \
              --base "${{ github.ref_name }}" \
              --head "${BRANCH_NAME}" \
              --label kind/bug \
              --label area/tests
          fi
          # Release the pull_request runs GitHub holds on a GITHUB_TOKEN push (see the script).
          bash .github/scripts/approve_bot_pr_runs.sh "${BRANCH_NAME}" "$(git rev-parse HEAD)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never fall back to an interactive prompt; fail fast if auth is rejected.
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'never'
