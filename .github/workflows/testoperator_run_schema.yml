name: testoperator schema tests
run-name: schema - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      min_tables:
        description: 'Minimum number of tables expected'
        required: false
        type: string

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-schema:
    # Assumes a CI AWS role, so it runs from testoperator_run_schema_aws.yml; see that file.
    permissions:
      actions: write  # approves the held runs of its snapshot PR
      contents: write  # pushes a snapshot branch
      pull-requests: write  # and opens its PR
      id-token: write  # RustFS credentials and Databricks access tokens
    uses: spiceai/spiceai/.github/workflows/testoperator_run_schema_aws.yml@trunk
    with:
      min_tables: ${{ github.event.inputs.min_tables }}
      runner_type: ${{ github.event.inputs.runner_type }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
