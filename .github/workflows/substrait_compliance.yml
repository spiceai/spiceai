name: Substrait compliance

# Mode A TPC-H at scale factor 1: the IBM suite's Substrait plans run through
# the workspace `datafusion-substrait` consumer over TPC-H tables the harness
# generates with `tpchgen`, compared against the SF 1 goldens in
# `tools/substrait-compliance/expected/sf1`. Runs on every merge-queue entry,
# on push to trunk/release/feature branches, nightly, and on manual dispatch.
# Not triggered on pull_request.
#
# The merge queue runs it for every entry, with no path filter. What it
# measures is the Substrait consumer and the DataFusion and arrow tree beneath
# it, which a Cargo.toml, Cargo.lock or fork-pin change anywhere in the
# workspace can move, so a filter would skip exactly the entries that change
# the answer.
#
# Report-only on pass rate: per-query FAIL/ERROR exit 0, and the job is not a
# required check (`scripts/signoff` REQUIRED_CHECKS), so the queue does not
# wait on it and a low pass rate does not block a merge. A harness/build
# crash still fails the job.

on:
  push:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  SUBSTRAIT_COMPLIANCE_REF: 43d31411c69ef7594887c7d759037bcf8244eeed

jobs:
  mode_a_tpch:
    name: Mode A TPC-H
    # The standard pool, not `spiceai-macos-large`: a debug build of the
    # harness, then an SF 1 run that takes about 11 seconds.
    runs-on: spiceai-macos
    timeout-minutes: 60
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.UNAS_SMB_PASS != '' }}
      # MinIO is only the fallback cache, and only on push: merge_group checks
      # out the queue merge commit, which contains the queued pull request, and
      # a spiceio miss must not fall through to those credentials.
      HAS_TEST_MINIO_SECRET: ${{ github.event_name == 'push' && secrets.TEST_MINIO_ENDPOINT != '' && secrets.TEST_MINIO_ACCESS_KEY != '' && secrets.TEST_MINIO_SECRET_KEY != '' }}
    steps:
      - name: Checkout spiceai
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # spiceai/substrait-compliance `spiceai` branch: IBM main (suite files
      # identical to v0.1.1) plus the TPC-H q01 shipdate-cutoff correction. Keep
      # this pin, scripts/fetch-ibm.sh, and SUITE_REF in src/main.rs together.
      - name: Checkout spiceai/substrait-compliance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: spiceai/substrait-compliance
          ref: 43d31411c69ef7594887c7d759037bcf8244eeed
          path: tools/substrait-compliance/.ibm
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Install Protoc
        uses: ./.github/actions/install-protoc

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1
          immutable-objects: "true"
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ env.HAS_TEST_MINIO_SECRET == 'true' && secrets.TEST_MINIO_ENDPOINT || '' }}
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}
          minio_access_key: ${{ env.HAS_TEST_MINIO_SECRET == 'true' && secrets.TEST_MINIO_ACCESS_KEY || '' }}
          minio_secret_key: ${{ env.HAS_TEST_MINIO_SECRET == 'true' && secrets.TEST_MINIO_SECRET_KEY || '' }}

      - name: Run Mode A TPC-H at SF 1
        # Per-query FAIL/ERROR already exit 0 (report-only pass rate).
        # A nonzero exit is a harness/build/IO failure and must fail the job.
        run: |
          cargo run -p spice-substrait-compliance -- \
            --mode mode-a \
            --scale-factor 1 \
            --suite tools/substrait-compliance/.ibm/test-suites/tpch \
            --out-json tools/substrait-compliance/results/mode-a-tpch.json \
            --out-csv tools/substrait-compliance/results/mode-a-tpch.csv

      - name: Show sccache stats
        if: always() && env.SCCACHE_SETUP == 'true'
        # `always()`: this is the one step that reports cache health, so it must
        # also run on the failures it would explain. The `||` keeps a diagnostic
        # from deciding the verdict.
        run: |
          sccache --show-stats || echo "::warning::sccache --show-stats failed, so the cache server is not answering either. Read a build failure in this job as a possible cache-backend outage rather than a code failure."

      # Merge-queue checks keep no artifacts. The push run for the merged
      # commit, the nightly and a dispatch still publish the reports.
      - name: Upload JSON and CSV reports
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: substrait-compliance-mode-a-tpch
          path: |
            tools/substrait-compliance/results/mode-a-tpch.json
            tools/substrait-compliance/results/mode-a-tpch.csv
          if-no-files-found: warn

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      - name: Upload spiceio logs
        if: always() && runner.os == 'macOS' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: spiceio-substrait-compliance-logs
          path: ${{ runner.temp }}/spiceio.log
          if-no-files-found: ignore
