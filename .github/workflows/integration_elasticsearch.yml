---
name: integration tests (elasticsearch)

on:
  push:
    branches:
      - trunk
    paths:
      - 'crates/elasticsearch/**'
      - 'crates/data_components/src/elasticsearch/**'
      - 'crates/data-connectors/connector-elasticsearch/**'
      - 'crates/search/src/index/elasticsearch/**'
      - 'crates/runtime/src/embeddings/index/elasticsearch/**'
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  # merge_group can't path-filter, so gate the (container-spinning) test job on a
  # changed-files check instead of running Elasticsearch for every merge entry.
  changes:
    runs-on: ubuntu-latest
    # A full-history checkout (`fetch-depth: 0`) and a path diff. Sized for a
    # cold runner having to clone from scratch, not the ~1 min a warm
    # self-hosted workspace takes.
    timeout-minutes: 45
    outputs:
      relevant: ${{ steps.check.outputs.relevant_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: check
        uses: ./.github/actions/check-code-changes
        with:
          filters: |
            code_changes:
              - 'crates/elasticsearch/**'
              - 'crates/data_components/src/elasticsearch/**'
              - 'crates/data-connectors/connector-elasticsearch/**'
              - 'crates/search/src/index/elasticsearch/**'
              - 'crates/runtime/src/embeddings/index/elasticsearch/**'

  test-elasticsearch:
    name: Elasticsearch Integration Tests
    needs: changes
    # Slowest observed success in the 2026-07-25..08-08 window: 15 min.
    timeout-minutes: 90
    if: ${{ needs.changes.outputs.relevant == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: spiceai-dev-runners

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 60
          --health-start-period 30s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify Elasticsearch is ready
        run: |
          curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s || {
            echo "Elasticsearch failed to reach yellow status"
            curl -s http://localhost:9200/_cluster/health || true
            exit 1
          }
          echo "Elasticsearch is ready"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Run elasticsearch client tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          RUSTC_WRAPPER="" cargo test -p elasticsearch --test integration_test -- --nocapture

      - name: Run elasticsearch data_components tests
        env:
          ELASTICSEARCH_URL: http://localhost:9200
        run: |
          RUSTC_WRAPPER="" cargo test -p data_components --features elasticsearch --test elasticsearch_test -- --nocapture
