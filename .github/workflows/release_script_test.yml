---
name: Release Script Tests

on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
    paths:
      - '.github/scripts/github_release.py'
      - '.github/scripts/test_github_release.py'
      - '.github/scripts/get_release_version.py'
      - '.github/scripts/test_get_release_version.py'
      - '.github/scripts/publish_release.py'
      - '.github/scripts/test_publish_release.py'
      - '.github/scripts/verify_install_site.py'
      - '.github/scripts/test_verify_install_site.py'
      - '.github/workflows/release_script_test.yml'
  push:
    branches:
      - trunk
    paths:
      - '.github/scripts/github_release.py'
      - '.github/scripts/test_github_release.py'
      - '.github/scripts/get_release_version.py'
      - '.github/scripts/test_get_release_version.py'
      - '.github/scripts/publish_release.py'
      - '.github/scripts/test_publish_release.py'
      - '.github/scripts/verify_install_site.py'
      - '.github/scripts/test_verify_install_site.py'
      - '.github/workflows/release_script_test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Least privilege by default; a job that needs more declares its own block.
permissions:
  contents: read

jobs:
  test-github-release-script:
    environment: secret-free
    name: Unit tests for github_release.py
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run tests
        env:
          GITHUB_TOKEN: test-token
        run: python .github/scripts/test_github_release.py -v

      - name: Run get_release_version.py tests
        run: python .github/scripts/test_get_release_version.py -v

      - name: Run publish_release.py tests
        run: python .github/scripts/test_publish_release.py -v

      - name: Run verify_install_site.py tests
        run: python .github/scripts/test_verify_install_site.py -v

      # The tests stand in for the site and the GitHub API, so also run it
      # against both. An earlier release than the latest passes, so a pin that
      # has not caught up with a release does not fail an unrelated change.
      - name: Run verify_install_site.py against install.spiceai.org
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_install_site.py --allow-earlier-release
