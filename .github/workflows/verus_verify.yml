---
name: Verus Verification

# These crates carry proofs, not just tests. Nothing else in the normal build
# checks them — a normal `cargo build` erases the specifications — so this gate
# is what keeps the proofs from silently rotting into comments.
#
# `crates/hash-index/src/sbbf_layout.rs`: the block index it returns subscripts
# the bloom filter's block vector, so an out-of-range result is a panic on a
# lock-free read path. The bound is a Verus postcondition discharged for every
# input, which is a property no test can establish by sampling.
#
# `crates/cache/src/namespace_key.rs`: the results-cache namespace prefix is
# what keeps a principal from being served another principal's rows as a fresh
# hit. Prefix-unambiguity of `[tag][id.len() LE][id]` is a Verus postcondition
# discharged for every `(tag, id, payload)` triple.
#
# `crates/key-index/src/escape_proof.rs`: each column's key encoding is
# prefix-free for every input, so concatenating a compound key's columns adds
# no collisions: key tuples whose columns encode differently never encode to
# the same bytes. Which values one column's encoding tells apart is the
# encoder's choice (floats give `-0.0` and `0.0`, and every NaN, one encoding
# each). A lookup can still return another key's rows, because a wide key is
# indexed by a 64-bit hash of those bytes; the query's own filter drops them.
#
# `crates/sharded-cache/src/layout.rs`: both array indices the results cache
# derives from a key — the shard, and the `TinyLFU` counter cell — subscript
# fixed-size arrays under the shard lock, so an out-of-range result is a panic
# reached by an ordinary cache lookup. Each bound is a Verus postcondition
# discharged for every key, which is what a test can only sample.
#
# That is also why the verifier runs in the merge queue rather than on the pull
# request. A proof is a claim about the tree it was checked against; two
# individually green changes can combine into one the verifier would reject, and
# no other check in the queue would notice.
#
# Which crates are checked is derived, never listed: every workspace member
# whose manifest sets `[package.metadata.verus] verify = true` (read from
# `cargo metadata`) is path-filtered, pin-checked and verified below. Opting a
# crate in is the whole change; nothing in this file names it.
#
# One job, one required context: `Verify Verus proofs` is required on `trunk`,
# and it is the whole gate for every crate that carries proofs. A second job per
# crate would be a second required check, and a crate-specific name would have to
# be renamed in the ruleset the day a third crate opts in; do not add either.
#
# Where it runs: `merge_group`, `trunk` and the release branches, and dispatch —
# never on a pull request, which is gated by developer sign-off instead
# (docs/dev/ci_signoff.md). The `pull_request` trigger below is still required.
# GitHub reads one required-checks list both before queue entry and on the queue
# commit, so a context that no pull-request run reports blocks the PR rather
# than passing it. The job's `if` skips it on a pull request, which reports
# `Verify Verus proofs` as skipped and satisfies the required check without
# running the verifier — the same arrangement `Rust Lint`, `Build and Test`, and
# `Build (release profile)` use in pr.yml.
#
# The workflow carries NO `paths` filter for that same reason: a workflow that
# never triggers reports nothing at all. The change filter inside the job skips
# only the verification work when nothing it covers was touched.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  push:
    branches:
      - trunk
      - release-*
      - release/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# The job reads the repository and fetches a public release. It needs nothing
# else, and it executes a downloaded binary, so it gets the minimum. `contents`
# alone is enough because the job never runs on a pull request: `dorny/paths-filter`
# reads the REST API only on the `pull_request*` events, and on `merge_group` and
# `push` diffs the checkout with git (`getChangedFilesFromGit`), which is also why
# the checkout below takes full history.
permissions:
  contents: read

env:
  # The verifier and its specification library ship together and are versioned
  # together, so these move as a set. VERUS_VSTD_VERSION must match the `vstd`
  # pin in `[workspace.dependencies]`, which every crate that opted into
  # verification inherits (checked below), and VERUS_SHA256 pins the exact
  # bytes of the archive: a release tag names an asset, it does not fix its
  # contents, and this job executes what it downloads.
  VERUS_RELEASE: release/0.2026.09.27.3cf1832
  VERUS_ASSET: verus-0.2026.09.27.3cf1832-x86-linux.zip
  VERUS_SHA256: 43814031e10df043221d83c7fa842e3ebd662cb7b0090fc1eb4d7a8673226978
  VERUS_VSTD_VERSION: 0.0.0-2026-09-20-0158

jobs:
  verus-verify:
    # Crate-agnostic on purpose: this is the single required-check context
    # for every crate that opted into `[package.metadata.verus]`. Adding a
    # crate updates the verify loop and the path filter, not the job name.
    name: Verify Verus proofs
    # Never on a pull request — the merge queue is the gate, and the skipped run
    # is what reports this required context there. See the header.
    if: ${{ github.event_name != 'pull_request' }}
    # GitHub-hosted on purpose: verification must not queue behind the
    # saturated self-hosted pool.
    runs-on: ubuntu-24.04
    # Bounded because this is a required `merge_group` check: an unbounded job
    # leaves the queue candidate `AWAITING_CHECKS` for GitHub's six-hour default
    # and stalls every entry behind it (#12717). hash-index alone is ~7 minutes
    # including a cold archive download; cache also compiles its DataFusion
    # graph through the driver, so the bound sits above that combined cost.
    # sharded-cache adds little: one dependency, and its proofs are arithmetic.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every event that reaches this job diffs against history with git, so
          # the shallow pull-request case does not apply.
          fetch-depth: 0
          persist-credentials: false

      # The crates that opted into verification, from the manifests themselves,
      # so the path filter, the pin check and the verify loop below cannot drift
      # from them. `--no-deps` reads the workspace's manifests without resolving
      # or building anything, and the runner's preinstalled stable is enough for
      # that: the pinned toolchain is only installed once there is work to do.
      #
      # The opt-in alone would let a crate leave the gate by flipping it to
      # `verify = false` while keeping its proofs. Every crate that depends on
      # `vstd` must therefore have opted in: proofs cannot be written without
      # `vstd`, so the only way out of this list is to delete them.
      - name: List the verified crates
        id: crates
        run: |
          set -euo pipefail
          metadata=$(RUSTUP_TOOLCHAIN=stable cargo metadata --no-deps --format-version 1)
          crate_dirs() {
            jq -r --arg root "$PWD/" ".packages[] | select($1)
                | .manifest_path | ltrimstr(\$root) | rtrimstr(\"/Cargo.toml\")" \
              <<<"$metadata" | sort
          }
          dirs=$(crate_dirs '.metadata.verus.verify == true')
          with_vstd=$(crate_dirs 'any(.dependencies[]; .name == "vstd")')
          unverified=$(comm -13 <(echo "$dirs") <(echo "$with_vstd"))
          if [ -n "$unverified" ]; then
            echo "::error::These crates depend on vstd but do not set" \
                 "[package.metadata.verus] verify = true, so their proofs would" \
                 "go unchecked: $(echo $unverified). Opt them in, or remove" \
                 "their proofs and the vstd dependency."
            exit 1
          fi
          if [ -z "$dirs" ]; then
            echo "::error::No workspace crate sets [package.metadata.verus] verify = true," \
                 "so this gate would verify nothing."
            exit 1
          fi
          echo "Verified crates:"
          echo "$dirs"
          {
            echo 'dirs<<EOF'
            echo "$dirs"
            echo 'EOF'
            echo 'filters<<EOF'
            echo 'code_changes:'
            sed "s|.*|  - '&/**'|" <<<"$dirs"
            # The verifier is a rustc driver bound to one toolchain, so a
            # workspace toolchain bump can invalidate this gate without
            # touching the crate. `vstd` is an ordinary dependency, so what is
            # verified is resolved outside the crate: the root manifest owns
            # the `vstd` pin and `[patch.crates-io]`, which can redirect it,
            # the lockfile selects its proc-macro crates, and cargo config can
            # replace the source or change how the driver is invoked. Last,
            # the gate itself, and the two composite actions this job runs:
            # one decides whether verification happens at all, the other
            # installs the toolchain the driver requires.
            for path in rust-toolchain.toml Cargo.toml Cargo.lock '.cargo/**' \
                        .github/workflows/verus_verify.yml \
                        '.github/actions/check-code-changes/**' \
                        '.github/actions/setup-rust/**'; do
              echo "  - '$path'"
            done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Decides whether the verification work below runs, on the events that
      # reach this job at all — a pull request skips the job outright.
      #
      # This has to cover every input that decides what `cargo verus` checks,
      # not only the proof source. A path missing here is not a cheaper run: it
      # reports the required context green with the verifier never invoked.
      - name: Check for changes this gate covers
        id: changes
        uses: ./.github/actions/check-code-changes
        with:
          filters: ${{ steps.crates.outputs.filters }}

      # A manual run is how someone re-checks the proofs on demand, so it must
      # never be able to skip them. `dorny/paths-filter` has no base to diff
      # against on a dispatch: `before` is absent from the payload, and when the
      # dispatch ref is the default branch the filter falls back to the last
      # commit alone (`getChangesInLastCommit`, src/main.ts). Dispatching from
      # `trunk` after an unrelated commit would therefore report this gate green
      # having verified nothing. `integration.yml`, `e2e_test_ci.yml`,
      # `helm-lint.yml`, and `integration_elasticsearch.yml` force the same way.
      - name: Decide whether to run the verifier
        id: gate
        env:
          RELEVANT_CHANGES: ${{ steps.changes.outputs.relevant_changes }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$RELEVANT_CHANGES" = 'true' ] || [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            echo 'verify=true' >> "$GITHUB_OUTPUT"
          else
            echo 'verify=false' >> "$GITHUB_OUTPUT"
          fi

      # Installs the toolchain `rust-toolchain.toml` pins, which is the one the
      # Verus driver is built against and the one `cargo verus` will select. The
      # runner image ships a different stable, so leaving this implicit makes the
      # job depend on whatever happens to be provisioned. It also carries the
      # Cargo.lock coherence guard, which matters here specifically: this job runs
      # on `merge_group`, where a textual lockfile merge is what that guard exists
      # to name before any cargo work.
      - name: Set up Rust
        if: steps.gate.outputs.verify == 'true'
        uses: ./.github/actions/setup-rust

      # Every verified crate must depend on exactly the `vstd` this verifier
      # ships with. Read from the manifests as cargo resolves them rather than
      # grepped, so a crate that inherits the workspace pin and one that
      # overrides it are checked alike, and a crate with no `vstd` is caught.
      - name: Check pins agree
        if: steps.gate.outputs.verify == 'true'
        env:
          VERIFIED_DIRS: ${{ steps.crates.outputs.dirs }}
        run: |
          set -euo pipefail
          metadata=$(cargo metadata --no-deps --format-version 1)
          mapfile -t crate_dirs <<<"$VERIFIED_DIRS"
          for crate_dir in "${crate_dirs[@]}"; do
            pinned=$(jq -r --arg manifest "$PWD/$crate_dir/Cargo.toml" '.packages[]
                | select(.manifest_path == $manifest)
                | [.dependencies[] | select(.name == "vstd") | .req] | first // ""' \
              <<<"$metadata")
            if [ "$pinned" != "=$VERUS_VSTD_VERSION" ]; then
              echo "::error::$crate_dir depends on vstd '${pinned:-<none>}'," \
                   "but this workflow runs Verus '$VERUS_VSTD_VERSION'." \
                   "The verifier and vstd ship together: update the vstd pin in" \
                   "[workspace.dependencies] and VERUS_VSTD_VERSION together, and" \
                   "inherit it with vstd.workspace = true."
              exit 1
            fi
          done

      # Only the archive is cached. It is re-hashed and re-extracted on every
      # run, so a cache that has been tampered with fails the digest check
      # rather than silently supplying the binary this job then trusts.
      - name: Cache Verus archive
        id: cache-verus
        if: steps.gate.outputs.verify == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.verus-dl
          key: verus-${{ env.VERUS_RELEASE }}-${{ env.VERUS_SHA256 }}

      - name: Download Verus
        if: >-
          steps.gate.outputs.verify == 'true'
          && steps.cache-verus.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ~/.verus-dl
          gh release download --repo verus-lang/verus "$VERUS_RELEASE" \
            -p "$VERUS_ASSET" -O ~/.verus-dl/"$VERUS_ASSET" --clobber

      - name: Verify the archive digest
        if: steps.gate.outputs.verify == 'true'
        run: |
          set -euo pipefail
          echo "$VERUS_SHA256  $HOME/.verus-dl/$VERUS_ASSET" | sha256sum -c -

      - name: Extract Verus
        if: steps.gate.outputs.verify == 'true'
        run: |
          set -euo pipefail
          rm -rf ~/.verus && mkdir -p ~/.verus
          unzip -q ~/.verus-dl/"$VERUS_ASSET" -d ~/.verus
          verus_bin=$(find ~/.verus -maxdepth 2 -name verus -type f -perm -u+x | head -1)
          if [ -z "$verus_bin" ]; then
            echo "::error::No verus binary found in $VERUS_ASSET"
            exit 1
          fi
          echo "VERUS_DIR=$(dirname "$verus_bin")" >> "$GITHUB_ENV"

      # Verus is a rustc driver, so it only runs against the exact toolchain it
      # was built for. Ask the binary rather than restating the version here:
      # a second copy of it in this file is one more thing that can drift from
      # the release the digest above pins. `rust-toolchain.toml` is what cargo
      # will actually select, so that is what it is compared against — a
      # workspace toolchain bump ahead of the Verus release then fails here with
      # an explanation instead of an opaque driver error.
      - name: Check the toolchain matches
        if: steps.gate.outputs.verify == 'true'
        run: |
          set -euo pipefail
          if ! version_output=$("$VERUS_DIR/verus" --version 2>&1); then
            echo "::error::Could not run the Verus driver to read its toolchain." \
                 "It reported: ${version_output}"
            exit 1
          fi
          required=$(awk '/Toolchain:/ {print $2}' <<<"$version_output")
          required=${required%%-*}
          if [ -z "$required" ]; then
            echo "::error::Verus $VERUS_RELEASE did not report a toolchain." \
                 "It printed: ${version_output}"
            exit 1
          fi
          pinned=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          if [ "$required" != "$pinned" ]; then
            echo "::error::rust-toolchain.toml pins $pinned but Verus" \
                 "$VERUS_RELEASE is built against $required." \
                 "Bump VERUS_RELEASE/VERUS_ASSET/VERUS_SHA256/VERUS_VSTD_VERSION" \
                 "to a release built against $pinned, or this gate cannot run."
            exit 1
          fi

      - name: Verify
        if: steps.gate.outputs.verify == 'true'
        env:
          VERIFIED_DIRS: ${{ steps.crates.outputs.dirs }}
        run: |
          set -euo pipefail
          export PATH="$VERUS_DIR:$PATH"
          # Every crate that opted into `[package.metadata.verus]` is checked
          # here, in this one job. A second job per crate would be a second
          # required check — do not split the loop out.
          mapfile -t crate_dirs <<<"$VERIFIED_DIRS"
          for crate_dir in "${crate_dirs[@]}"; do
            crate_name=$(basename "$crate_dir")
            (
              cd "$crate_dir"
              cargo verus focus 2>&1 | tee "/tmp/verus-${crate_name}.log"
            )
            # `cargo verus` exits 0 when a crate opts out of verification and
            # nothing is checked, so assert the proofs actually ran.
            grep -qE 'verification results:: [1-9][0-9]* verified, 0 errors' \
              "/tmp/verus-${crate_name}.log"
          done
