name: testoperator cluster bench dispatch

# Orchestrates the cluster-bench fan-out: build a commit-pinned spiced
# docker image (or reuse if already published), then dispatch
# `testoperator_run_cluster_bench.yml` once per dispatch-matrix entry under
# one or more `tools/testoperator/dispatch_cluster/.../distributed/` directories.
# Mirrors the structure of `testoperator_dispatch.yml` but with an image-build
# prereq instead of a spiced-binary build, and a max-concurrency of 1 to keep
# Spice Cloud resource usage bounded.

on:
  schedule:
    # Daily at 1000 UTC (0300 PDT) — runs after the single-node dispatch so
    # the trunk image is built with the same commit.
    - cron: '0 10 * * *'

  workflow_dispatch:
    inputs:
      spiced_ref:
        description: 'Git ref to build the spiced image from. Defaults to trunk for scheduled runs.'
        required: false
        type: string
        default: 'trunk'
      force_rebuild:
        description: 'Rebuild the spiced image even if a matching tag is already published'
        required: false
        type: boolean
        default: false
      dispatch_dir:
        description: >-
          Cluster dispatch matrix root to recursively fan out from
          (relative to tools/testoperator/dispatch_cluster/)
        required: false
        type: string
        default: '.'

permissions:
  contents: read
  packages: write    # workflow_call into spiced_docker_dev needs write
  actions: write     # workflow_dispatch API needs this

concurrency:
  # One cluster-bench dispatch at a time; the cluster benches themselves are
  # gated separately to max 1 in-flight via sequential dispatch below.
  group: testoperator-dispatch-cluster
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Resolve the desired image tag. Commit-pinned (`trunk-<sha>`) so repeat
  #    runs on the same commit reuse the previously-built image.
  # ---------------------------------------------------------------------------
  resolve-image:
    name: Resolve spiced image tag
    runs-on: ubuntu-24.04
    outputs:
      spiced_ref: ${{ steps.resolve.outputs.spiced_ref }}
      spiced_sha: ${{ steps.resolve.outputs.spiced_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      need_build: ${{ steps.resolve.outputs.need_build }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.inputs.spiced_ref || 'trunk' }}
          fetch-depth: 1

      - name: Resolve commit + tag
        id: resolve
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          set -euo pipefail
          spiced_ref="${{ github.event.inputs.spiced_ref || 'trunk' }}"
          spiced_sha="$(git rev-parse --short=12 HEAD)"
          image_tag="trunk-${spiced_sha}"

          echo "spiced_ref=${spiced_ref}" >> "$GITHUB_OUTPUT"
          echo "spiced_sha=${spiced_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

          # Check whether the image already exists in GHCR. If so, skip the
          # build job to avoid re-publishing identical bits. `force_rebuild`
          # short-circuits the cache hit.
          need_build="true"
          if [ "${FORCE_REBUILD}" = "true" ]; then
            echo "force_rebuild=true → will rebuild"
          elif docker buildx imagetools inspect \
              "ghcr.io/spiceai/spiceai-dev:${image_tag}" >/dev/null 2>&1; then
            echo "Image ghcr.io/spiceai/spiceai-dev:${image_tag} already exists, skipping build"
            need_build="false"
          else
            echo "Image not found; will build"
          fi
          echo "need_build=${need_build}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build + publish the spiced image (reusable workflow). Skipped on cache
  #    hit. workflow_call inputs are fixed to amd64; cluster pods don't need
  #    arm64.
  # ---------------------------------------------------------------------------
  build-image:
    name: Build spiced image (commit-pinned)
    needs: resolve-image
    if: needs.resolve-image.outputs.need_build == 'true'
    uses: ./.github/workflows/spiced_docker_dev.yml
    with:
      tag: ${{ needs.resolve-image.outputs.image_tag }}
      variant: models
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 3. Fan out to the cluster-bench workflow once per spicepod in the dispatch
  #    matrix. Sequential (max_concurrent=1) since each run provisions a real
  #    Spice Cloud clustered app.
  # ---------------------------------------------------------------------------
  dispatch-cluster-bench:
    name: Dispatch cluster benchmarks
    needs: [resolve-image, build-image]
    if: |
      always() &&
      needs.resolve-image.result == 'success' &&
      (needs.build-image.result == 'success' || needs.build-image.result == 'skipped')
    runs-on: spiceai-dev-runners
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify dispatch directory
        env:
          DISPATCH_DIR: ${{ github.event.inputs.dispatch_dir || '.' }}
        run: |
          set -euo pipefail
          dir="tools/testoperator/dispatch_cluster/${DISPATCH_DIR}"
          if [ ! -d "$dir" ]; then
            echo "Error: dispatch directory not found: $dir"
            exit 1
          fi

          dispatch_files=()
          while IFS= read -r f; do
            dispatch_files+=("$f")
          done < <(find "$dir" -type f -name '*.yaml' | sort)
          if [ "${#dispatch_files[@]}" -eq 0 ]; then
            echo "Error: no dispatch YAML files found under $dir"
            exit 1
          fi

          printf 'Dispatch files:\n'
          printf '  %s\n' "${dispatch_files[@]}"

      - name: Dispatch each spicepod
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_DIR: ${{ github.event.inputs.dispatch_dir || '.' }}
          IMAGE_TAG: ${{ needs.resolve-image.outputs.image_tag }}
          SPICED_SHA: ${{ needs.resolve-image.outputs.spiced_sha }}
          # Each dispatch yaml entry today is a single `tests.bench` block. We
          # read fields out of it via yq and pass them as workflow_dispatch
          # inputs to testoperator_run_cluster_bench.yml.
        run: |
          set -euo pipefail
          dir="tools/testoperator/dispatch_cluster/${DISPATCH_DIR}"
          dispatch_files=()
          while IFS= read -r f; do
            dispatch_files+=("$f")
          done < <(find "$dir" -type f -name '*.yaml' | sort)

          # Install yq for YAML parsing if not already on PATH.
          if ! command -v yq >/dev/null 2>&1; then
            curl -fsSL -o /tmp/yq \
              https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
            sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          fi

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          dispatch_workflow() {
            local spicepod_path="$1"
            local query_set="$2"
            local scale_factor="$3"
            local runner_type="$4"
            local validate_results="$5"
            local ready_wait="$6"
            local query_transport="$7"
            local executor_replicas="$8"
            local channel="$9"
            local payload

            payload="$(python3 - \
              "${GITHUB_REF_NAME}" \
              "${spicepod_path}" \
              "${query_set}" \
              "${scale_factor}" \
              "${runner_type}" \
              "${validate_results}" \
              "${ready_wait}" \
              "${query_transport}" \
              "${executor_replicas}" \
              "${channel}" \
              "${IMAGE_TAG}" <<'PY'
          import json
          import sys

          keys = [
              "spicepod_path",
              "query_set",
              "scale_factor",
              "runner_type",
              "validate_results",
              "ready_wait",
              "query_transport",
              "executor_replicas",
              "channel",
              "custom_image_tag",
          ]
          print(json.dumps({"ref": sys.argv[1], "inputs": dict(zip(keys, sys.argv[2:]))}))
          PY
            )"

            curl -fsS -X POST "${api_headers[@]}" \
              "${api_url}/actions/workflows/testoperator_run_cluster_bench.yml/dispatches" \
              -d "${payload}"
          }

          find_run_id() {
            local created_at="$1"
            local runs_json
            runs_json="$(curl -fsSL -G "${api_headers[@]}" \
              "${api_url}/actions/workflows/testoperator_run_cluster_bench.yml/runs" \
              --data-urlencode "branch=${GITHUB_REF_NAME}" \
              --data-urlencode "event=workflow_dispatch" \
              --data-urlencode "created=>=${created_at}" \
              --data-urlencode "per_page=10")"

            python3 -c 'import json, sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0]["id"] if runs else "")' <<< "${runs_json}"
          }

          watch_run() {
            local run_id="$1"
            local entry_path="$2"
            local run_json status conclusion html_url

            while true; do
              run_json="$(curl -fsSL "${api_headers[@]}" "${api_url}/actions/runs/${run_id}")"
              IFS=$'\t' read -r status conclusion html_url < <(
                python3 -c 'import json, sys; r=json.load(sys.stdin); print("\t".join([r.get("status") or "", r.get("conclusion") or "", r.get("html_url") or ""]))' <<< "${run_json}"
              )

              echo "Run ${run_id} for ${entry_path}: status=${status} conclusion=${conclusion:-pending}"
              echo "${html_url}"

              if [ "${status}" = "completed" ]; then
                if [ "${conclusion}" != "success" ]; then
                  echo "Warning: cluster bench run ${run_id} for ${entry_path} completed with ${conclusion}"
                fi
                break
              fi

              sleep 60
            done
          }

          dispatched_runs=()
          for f in "${dispatch_files[@]}"; do
            entry_name="$(basename "$f" .yaml)"
            entry_path="${f#tools/testoperator/dispatch_cluster/}"
            entry_path="${entry_path#./}"
            entry_path="${entry_path%.yaml}"
            echo "::group::Dispatching ${entry_path}"

            # Helper to default missing fields.
            field() {
              local key="$1" default="$2"
              local v
              v="$(yq -r "${key} // \"\"" "$f")"
              if [ -z "$v" ] || [ "$v" = "null" ]; then
                v="$default"
              fi
              echo "$v"
            }

            spicepod_path="$(field '.tests.bench.spicepod_path' '')"
            if [ -z "$spicepod_path" ]; then
              echo "skipping ${entry_name}: missing .tests.bench.spicepod_path"
              echo "::endgroup::"
              continue
            fi

            query_set="$(field '.tests.bench.query_set' 'tpch')"
            scale_factor="$(field '.tests.bench.scale_factor' '1')"
            runner_type="$(field '.tests.bench.runner_type' 'spiceai-dev-runners')"
            validate_results="$(field '.tests.bench.validate_results' 'false')"
            ready_wait="$(field '.tests.bench.ready_wait' '600')"
            # Cluster-bench-specific fields (optional in the yaml; sensible defaults).
            query_transport="$(field '.tests.bench.query_transport' 'flightsql')"
            executor_replicas="$(field '.tests.bench.executor_replicas' '3')"
            channel="$(field '.tests.bench.channel' 'nightly')"

            echo "  spicepod_path=${spicepod_path}"
            echo "  query_set=${query_set}  scale_factor=${scale_factor}"
            echo "  query_transport=${query_transport}  executor_replicas=${executor_replicas}"
            echo "  custom_image_tag=${IMAGE_TAG}"

            triggered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            dispatch_workflow \
              "${spicepod_path}" \
              "${query_set}" \
              "${scale_factor}" \
              "${runner_type}" \
              "${validate_results}" \
              "${ready_wait}" \
              "${query_transport}" \
              "${executor_replicas}" \
              "${channel}"

            dispatched_runs+=("${entry_path}")
            echo "::endgroup::"

            # Sequential dispatch: wait for the just-launched run to finish
            # before starting the next one. Cluster benches each provision a
            # real Spice Cloud app, so max_concurrent=1 keeps cloud-side load
            # bounded.
            echo "Waiting briefly for the run to register…"
            run_id=""
            for attempt in {1..20}; do
              sleep 15
              run_id="$(find_run_id "${triggered_at}")"
              if [ -n "${run_id}" ]; then
                break
              fi
              echo "Waiting for workflow_dispatch run to appear (${attempt}/20)…"
            done

            if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
              echo "Warning: could not resolve run id for ${entry_path}; continuing"
              continue
            fi

            echo "Watching run ${run_id} for ${entry_path}"
            watch_run "${run_id}" "${entry_path}"
          done

          if [ "${#dispatched_runs[@]}" -eq 0 ]; then
            echo "No spicepods dispatched from ${DISPATCH_DIR}"
            exit 1
          fi

          {
            echo "## Dispatched cluster-bench runs"
            echo
            echo "Image: \`ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}\`"
            echo "Commit: \`${SPICED_SHA}\`"
            echo
            for r in "${dispatched_runs[@]}"; do
              echo "- ${r}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
