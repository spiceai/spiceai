name: E2E Test CLI behavior
on:
  workflow_dispatch:
    inputs:
      build_cli:
        description: 'Build the CLI instead of using the specified release version'
        required: false
        default: 'true'
      rel_version:
        description: 'The version to build CLI / download released CLI'
        required: false
        default: '2.0.0'
      upgrade_from_version:
        description: 'Released version of spiced to test upgrading from (empty = latest release)'
        required: false
        default: ''

jobs:
  resolve-upgrade-version:
    name: Resolve upgrade-from version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT="${{ github.event.inputs.upgrade_from_version }}"
          BUILD_CLI="${{ github.event.inputs.build_cli }}"

          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
            echo "Using provided version: $VERSION"
          elif [ "$BUILD_CLI" = "false" ]; then
            # When testing a released CLI, upgrade from the previous release
            VERSION=$(gh release list --repo ${{ github.repository }} --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' \
              | grep -v '-' | sed 's/^v//' | sed -n '2p')
            echo "Auto-detected N-1 release: $VERSION"
          else
            # When building from source, upgrade from the latest release
            VERSION=$(gh release list --repo ${{ github.repository }} --exclude-pre-releases --limit 20 --json tagName -q '.[].tagName' \
              | grep -v '-' | sed 's/^v//' | head -1)
            echo "Auto-detected latest release: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  setup-matrix:
    name: Setup strategy matrix
    runs-on: spiceai-dev-runners
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: "Linux x64",
                runner: "spiceai-dev-runners",
                target_os: "linux",
                target_arch: "x86_64",
              }, {
                name: "macOS aarch64 (Apple Silicon)",
                runner: "macos-15",
                target_os: "darwin",
                target_arch: "aarch64",
              }, {
                name: "Windows x64",
                runner: "windows-latest",
                target_os: "windows",
                target_arch: "x86_64",
              }
            ];
            return matrix;

  build:
    name: Build ${{ matrix.target.name }} CLI
    runs-on: ${{ matrix.target.runner }}
    needs: setup-matrix
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: github.event.inputs.build_cli == 'true'
        with:
          persist-credentials: false

      - name: Set up Rust
        if: github.event.inputs.build_cli == 'true'
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: matrix.target.target_os == 'linux' && github.event.inputs.build_cli == 'true'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: matrix.target.target_os == 'linux' && github.event.inputs.build_cli == 'true'
        uses: ./.github/actions/setup-cc

      - name: Build spice
        if: github.event.inputs.build_cli == 'true'
        run: cargo build --release -p spice

      - name: Make spice executable & Move spice (Unix)
        if: matrix.target.target_os != 'windows' && github.event.inputs.build_cli == 'true'
        run: |
          mv target/release/spice spice
          chmod +x spice

      - name: Move Spice(Windows)
        if: matrix.target.target_os == 'windows' && github.event.inputs.build_cli == 'true'
        shell: pwsh
        run: |
          Move-Item -Path target/release/spice.exe -Destination spice.exe -Force

      - name: Save spice artifact
        if: matrix.target.target_os != 'windows' && github.event.inputs.build_cli == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: |
            spice

      - name: Save spice artifact
        if: matrix.target.target_os == 'windows' && github.event.inputs.build_cli == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: |
            spice.exe

  test_spice_upgrade_with_runtime:
    name: 'Test spice upgrade (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      UPGRADE_FROM_VERSION: ${{ needs.resolve-upgrade-version.outputs.version }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
      - setup-matrix
      - resolve-upgrade-version
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os != 'windows'
        run: |
          mkdir -p ./build
          cd ./build
          url="https://github.com/spiceai/spiceai/releases/download/v${{ env.UPGRADE_FROM_VERSION }}/spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz"
          output="spice.tar.gz"
          curl -L -o "$output" "$url"
          tar -xzf "$output"
          rm "$output"
          chmod +x spice

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path "./build" > $null
          Set-Location "./build"
          $url = "https://github.com/spiceai/spiceai/releases/download/v${{ env.UPGRADE_FROM_VERSION }}/spice.exe_windows_x86_64.tar.gz"
          $output = "spice.exe_windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output
          Remove-Item $output

      - name: Download a older spiced
        shell: pwsh
        if: matrix.target.target_os == 'windows'
        run: |
          Set-Location "./build"
          $url = "https://github.com/spiceai/spiceai/releases/download/v${{ env.UPGRADE_FROM_VERSION }}/spiced.exe_windows_x86_64.tar.gz"
          $output = "spiced.exe_windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output
          Remove-Item $output

      - name: Download older spiced
        if: matrix.target.target_os != 'windows'
        run: |
          cd ./build
          url="https://github.com/spiceai/spiceai/releases/download/v${{ env.UPGRADE_FROM_VERSION }}/spiced_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz"
          output="spiced.tar.gz"
          curl -L -o "$output" "$url"
          tar -xzf "$output"
          rm "$output"
          chmod +x spiced

      - name: Install spice
        uses: ./.github/actions/install-spice
        with:
          build-path: ./build

      - name: Check pre-upgrade version
        shell: bash
        run: |
          spice version
          RUNTIME_VERSION=$(spice version 2>&1 | grep 'Runtime version:' | awk '{print $3}')
          EXPECTED="v${{ env.UPGRADE_FROM_VERSION }}"
          echo "Pre-upgrade Runtime version: $RUNTIME_VERSION (expected: $EXPECTED)"
          # v1.11.x on Windows doesn't detect spiced.exe (looks for 'spiced' without extension)
          if [[ "$RUNTIME_VERSION" == "not" ]]; then
            echo "::warning::Runtime reported as 'not installed' (known v1.11.x Windows issue)"
          elif [[ "$RUNTIME_VERSION" != "$EXPECTED"* ]]; then
            echo "::error::Expected pre-upgrade Runtime version starting with $EXPECTED, got $RUNTIME_VERSION"
            exit 1
          fi

      - name: Run spice upgrade
        shell: bash
        run: |
          spice -v upgrade 2>&1 | tee /tmp/upgrade_output.log

      - name: Verify no models variant attempted for v2+
        shell: bash
        run: |
          VERSION="${{ env.REL_VERSION }}"
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          if [[ -n "$MAJOR" && "$MAJOR" -ge 2 ]]; then
            if grep -q '_models_' /tmp/upgrade_output.log; then
              echo "::error::v2+ upgrade should not attempt to download models variant"
              cat /tmp/upgrade_output.log
              exit 1
            fi
            echo "Confirmed: no models variant attempted for v${{ env.REL_VERSION }}"
          else
            echo "Skipping models variant check for v1.x"
          fi

      - name: Check the temp directory (Windows)
        if: matrix.target.target_os == 'windows'
        run: |
          Write-Host "System temp directory: $env:TEMP"
          Get-ChildItem -Path $env:TEMP -Recurse |
              Where-Object { $_.Name -like "spice*" } |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

      - name: Run spice upgrade again
        if: matrix.target.target_os == 'windows'
        run: |
          spice upgrade

      - name: Check the temp directory (Windows)
        if: matrix.target.target_os == 'windows'
        run: |
          Write-Host "System temp directory: $env:TEMP"
          Get-ChildItem -Path $env:TEMP -Recurse |
              Where-Object { $_.Name -like "spice*" } |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

      - name: Run spice version
        shell: bash
        run: |
          spice version
          CLI_VERSION=$(spice version 2>&1 | grep 'CLI version:' | awk '{print $3}')
          RUNTIME_VERSION=$(spice version 2>&1 | grep 'Runtime version:' | awk '{print $3}')
          EXPECTED="v${{ env.REL_VERSION }}"
          # v1.11.x CLI doesn't self-upgrade (fix landed in v2.0.0)
          if [[ "$CLI_VERSION" != v1.11.* ]]; then
            if [[ "$CLI_VERSION" != "$EXPECTED"* ]]; then
              echo "::error::Expected CLI version starting with $EXPECTED, got $CLI_VERSION"
              exit 1
            fi
          else
            echo "::warning::Skipping CLI version check: v1.11.x CLI does not self-upgrade"
          fi
          if [[ "$RUNTIME_VERSION" == "not" ]]; then
            echo "::warning::Runtime reported as 'not installed' (known v1.11.x Windows issue)"
          elif [[ "$RUNTIME_VERSION" != "$EXPECTED"* ]]; then
            echo "::error::Expected Runtime version starting with $EXPECTED, got $RUNTIME_VERSION"
            exit 1
          fi

  test_spice_upgrade_without_runtime:
    name: 'Test spice upgrade without runtime (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
      - setup-matrix
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os != 'windows'
        run: |
          mkdir -p ./build
          cd ./build
          url="https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz"
          output="spice.tar.gz"
          curl -L -o "$output" "$url"
          tar -xzf "$output"
          rm "$output"
          chmod +x spice

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path "./build" > $null
          Set-Location "./build"
          $url = "https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice.exe_windows_x86_64.tar.gz"
          $output = "spice.exe_windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output
          Remove-Item $output

      - name: Install Spice CLI
        uses: ./.github/actions/install-spice-cli
        with:
          build-path: ./build

      - name: Run spice upgrade
        shell: bash
        run: |
          spice -v upgrade 2>&1 | tee /tmp/upgrade_output.log

      - name: Verify no models variant attempted for v2+
        shell: bash
        run: |
          VERSION="${{ env.REL_VERSION }}"
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          if [[ -n "$MAJOR" && "$MAJOR" -ge 2 ]]; then
            if grep -q '_models_' /tmp/upgrade_output.log; then
              echo "::error::v2+ upgrade should not attempt to download models variant"
              cat /tmp/upgrade_output.log
              exit 1
            fi
            echo "Confirmed: no models variant attempted for v${{ env.REL_VERSION }}"
          else
            echo "Skipping models variant check for v1.x"
          fi

      - name: Check the temp directory (Windows)
        if: matrix.target.target_os == 'windows'
        run: |
          Write-Host "System temp directory: $env:TEMP"
          Get-ChildItem -Path $env:TEMP -Recurse |
              Where-Object { $_.Name -like "spice*" } |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

      - name: Run spice upgrade again
        if: matrix.target.target_os == 'windows'
        run: |
          spice upgrade

      - name: Check the temp directory (Windows)
        if: matrix.target.target_os == 'windows'
        run: |
          Write-Host "System temp directory: $env:TEMP"
          Get-ChildItem -Path $env:TEMP -Recurse |
              Where-Object { $_.Name -like "spice*" } |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize

      - name: Run spice version
        shell: bash
        run: |
          spice version
          CLI_VERSION=$(spice version 2>&1 | grep 'CLI version:' | awk '{print $3}')
          EXPECTED="v${{ env.REL_VERSION }}"
          # v1.11.x CLI doesn't self-upgrade (fix landed in v2.0.0)
          if [[ "$CLI_VERSION" != v1.11.* ]]; then
            if [[ "$CLI_VERSION" != "$EXPECTED"* ]]; then
              echo "::error::Expected CLI version starting with $EXPECTED, got $CLI_VERSION"
              exit 1
            fi
          else
            echo "::warning::Skipping CLI version check: v1.11.x CLI does not self-upgrade"
          fi

  test_spice_install_without_runtime:
    name: 'Test spice install without runtime (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
      - setup-matrix
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os != 'windows'
        run: |
          mkdir -p ./build
          cd ./build
          url="https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz"
          output="spice.tar.gz"
          curl -L -o "$output" "$url"
          tar -xzf "$output"
          rm "$output"
          chmod +x spice

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path "./build" > $null
          Set-Location "./build"
          $url = "https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice.exe_windows_x86_64.tar.gz"
          $output = "spice.exe_windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output
          Remove-Item $output

      - name: Install Spice CLI
        uses: ./.github/actions/install-spice-cli
        with:
          build-path: ./build

      - name: Run spice install
        if: matrix.target.target_os != 'windows'
        shell: bash
        run: |
          spice -v install 2>&1 | tee /tmp/install_output.log

      - name: Verify no models variant attempted for v2+
        if: matrix.target.target_os != 'windows'
        shell: bash
        run: |
          VERSION="${{ env.REL_VERSION }}"
          VERSION="${VERSION#v}"
          MAJOR="${VERSION%%.*}"
          if [[ -n "$MAJOR" && "$MAJOR" -ge 2 ]]; then
            if grep -q '_models_' /tmp/install_output.log; then
              echo "::error::v2+ install should not attempt to download models variant"
              cat /tmp/install_output.log
              exit 1
            fi
            echo "Confirmed: no models variant attempted for v${{ env.REL_VERSION }}"
          else
            echo "Skipping models variant check for v1.x"
          fi

      - name: Validate native Windows spice install guidance
        if: matrix.target.target_os == 'windows'
        shell: pwsh
        run: |
          $expected = "Open WSL and run the Linux Spice CLI there instead."
          $installOutput = (& spice install 2>&1 | Out-String)
          Write-Host $installOutput
          if ($LASTEXITCODE -eq 0) {
            throw "spice install unexpectedly succeeded on native Windows"
          }
          if (-not $installOutput.Contains($expected)) {
            throw "spice install did not print the expected WSL guidance"
          }

          exit 0

      - name: Run spice version
        run: |
          spice version

  test_spice_run_without_runtime:
    name: 'Test spice run without runtime (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
      - setup-matrix
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os != 'windows'
        run: |
          mkdir -p ./build
          cd ./build
          url="https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz"
          output="spice.tar.gz"
          curl -L -o "$output" "$url"
          tar -xzf "$output"
          rm "$output"
          chmod +x spice

      - name: download spice cli released version
        if: github.event.inputs.build_cli == 'false' && matrix.target.target_os == 'windows'
        run: |
          New-Item -ItemType Directory -Force -Path "./build" > $null
          Set-Location "./build"
          $url = "https://github.com/spiceai/spiceai/releases/download/v${{ env.REL_VERSION }}/spice.exe_windows_x86_64.tar.gz"
          $output = "spice.exe_windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $output
          tar -xzf $output
          Remove-Item $output

      - name: Install Spice CLI
        uses: ./.github/actions/install-spice-cli
        with:
          build-path: ./build

      - name: Start spice runtime
        if: matrix.target.target_os != 'windows'
        run: |
          spice run &> spice.log &
          # time to download runtime
          sleep 60

      - name: Validate native Windows spice run guidance
        if: matrix.target.target_os == 'windows'
        shell: pwsh
        run: |
          $expected = "Open WSL and run the Linux Spice CLI there instead."
          $runOutput = (& spice run 2>&1 | Out-String)
          Write-Host $runOutput
          if ($LASTEXITCODE -eq 0) {
            throw "spice run unexpectedly succeeded on native Windows"
          }
          if (-not $runOutput.Contains($expected)) {
            throw "spice run did not print the expected WSL guidance"
          }

          exit 0

      - name: Stop spice and check logs
        if: always() && matrix.target.target_os != 'windows'
        run: |
          killall spice || true
          cat spice.log

      - name: Run spice version
        run: |
          spice version

  test_spice_upgrade_from_brew:
    name: 'Test spice upgrade from a homebrew spice cli'
    if: github.event.inputs.build_cli == 'true'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
    timeout-minutes: 5

    strategy:
      matrix:
        target:
          - name: 'macOS aarch64 (Apple Silicon)'
            runner: 'macos-15'
            target_os: 'darwin'
            target_arch: 'aarch64'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: download spice cli from homebrew
        run: |
          brew install spiceai/spiceai/spice
          spice version
          which spice

      - name: move the built spice cli to brew directory
        run: |
          sudo mv ./build/spice /opt/homebrew/bin
          sudo chmod +x /opt/homebrew/bin/spice
          which spice
          spice version

      - name: run spice upgrade
        run: |
          spice upgrade

  test_spice_chat:
    name: 'Test spice chat'
    if: github.event.inputs.build_cli == 'true'
    continue-on-error: true
    runs-on: ${{ matrix.target.runner }}
    env:
      REL_VERSION: ${{ github.event.inputs.rel_version || '2.0.0' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    needs:
      - build
    timeout-minutes: 5

    strategy:
      matrix:
        target:
          - name: 'macOS aarch64 (Apple Silicon)'
            runner: 'macos-15'
            target_os: 'darwin'
            target_arch: 'aarch64'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        if: github.event.inputs.build_cli != 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: ./.github/actions/install-spice-cli
        with:
          build-path: ./build

      - name: Init spice app
        run: |
          cp ./test/cli/spicepod_openai.yml ./spicepod.yaml
          cat ./spicepod.yaml

      - name: Start spice runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICE_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
        run: |
          spice run &> spice.log &

      - name: Wait for Spice runtime is ready
        timeout-minutes: 1
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Install expect (macOS)
        if: matrix.target.target_os == 'darwin'
        run: |
          if command -v expect >/dev/null 2>&1; then
            expect -v
          else
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ENV_HINTS=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install expect
          fi

      - name: Make expect scripts executable
        run: |
          chmod +x ./test/cli/*.exp

      - name: Test `spice chat` error
        run: |
          expect ./test/cli/spice_chat_error.exp

      - name: Test `spice chat <message>`
        run: |
          expect ./test/cli/spice_chat_message.exp

      - name: Stop spice and check logs
        if: always()
        run: |
          killall spice || true
          cat spice.log
