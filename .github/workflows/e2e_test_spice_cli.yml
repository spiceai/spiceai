name: Validate native Windows CLI guidance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_PROFILE_DEV_DEBUG: 0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: ./.github/actions/setup-rust
      - name: Install protoc
        uses: ./.github/actions/install-protoc
      - name: Prepare source baseline
        shell: pwsh
        run: |
          $file = "bin/spice/src/commands/upgrade.rs"
          Copy-Item $file "$env:RUNNER_TEMP/upgrade-fixed.rs"
          $source = [IO.File]::ReadAllText($file)
          $guard = "    ctx.ensure_local_runtime_supported()?;"
          if (-not $source.Contains($guard)) { throw "Expected guard is absent" }
          [IO.File]::WriteAllText($file, $source.Replace($guard, ""))
      - name: Build baseline CLI
        run: cargo build --locked -p spice
      - name: Reproduce missing Windows upgrade guidance
        shell: pwsh
        run: |
          $output = (& ./target/debug/spice.exe upgrade 2>&1 | Out-String)
          $result = $LASTEXITCODE
          Write-Host $output
          if ($result -eq 0) { throw "Baseline upgrade unexpectedly succeeded" }
          if ($output.Contains("Open WSL and run the Linux Spice CLI there instead.")) {
            throw "Baseline already has the expected guidance"
          }
          if (-not $output.Contains("spiced.exe_windows_x86_64.tar.gz")) {
            throw "Baseline failed for a different reason"
          }
          Write-Host "BASELINE: missing native runtime archive; expected WSL guidance absent"
          exit 0
      - name: Restore fixed source
        shell: pwsh
        run: Copy-Item "$env:RUNNER_TEMP/upgrade-fixed.rs" "bin/spice/src/commands/upgrade.rs" -Force
      - name: Build fixed CLI
        run: cargo build --locked -p spice
      - name: Validate native Windows command guidance
        shell: pwsh
        run: |
          foreach ($command in @("upgrade", "install", "run")) {
            $output = (& ./target/debug/spice.exe $command 2>&1 | Out-String)
            $result = $LASTEXITCODE
            Write-Host $output
            if ($result -eq 0) { throw "$command unexpectedly succeeded" }
            if (-not $output.Contains("Open WSL and run the Linux Spice CLI there instead.")) {
              throw "$command did not print the expected WSL guidance"
            }
            Write-Host "FIXED: $command printed WSL guidance with exit $result"
          }
          exit 0
      - name: Save CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-cli-guidance
          path: target/debug/spice.exe
          retention-days: 7
