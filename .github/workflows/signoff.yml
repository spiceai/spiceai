---
# Copyright 2024-2026 The Spice.ai OSS Authors
#
# Remote developer sign-off — run the same checks as `make signoff` on a
# self-hosted runner, then post the `signoff` commit status on the branch HEAD
# so the PR's Attestation check turns green.
#
# Same fail-fast order as local sign-off:
#   0. Skip Rust lint/build/tests when the branch has no Rust-affecting files
#      vs trunk (.rs, Cargo.toml/lock, rust-toolchain*, .cargo/*)
#   1. Targeted lint of crates touched by the branch vs trunk (off by default —
#      see the skip_targeted_lint input)
#   2. Full workspace lint (make lint-rust)
#   3. CLI build + unit tests (make build-cli nextest)
#   4. Post signoff status + re-run Attestation if needed
#
# Prefer lab SSH when available (make signoff-remote probes 192.168.1.100/101
# for a Git $HOME/dev/spice2 first). This workflow is the fallback when no SSH
# host works:
#   make signoff-remote
#   gh workflow run signoff.yml -f branch=<your-branch>
#   gh workflow run signoff.yml -f branch=<your-branch> -f skip_targeted_lint=true
#
# Fork PRs (pr_number input): dispatching this workflow already requires write
# access to this repo, so we don't gate fork sign-off behind an extra
# confirmation input — the write-access check on workflow_dispatch itself is
# the trust boundary. But the fork's code (build.rs, tests, Makefiles, …)
# still runs on our self-hosted runner with full access to this job's
# secrets, so only dispatch this for a fork PR you've actually reviewed:
#   gh workflow run signoff.yml -f pr_number=<PR number>
# The PR's head commit (not the mutable branch) is what gets checked out and
# signed off, pinned at resolve time, so a push to the fork branch after you
# dispatch doesn't silently swap in unreviewed code.
name: Remote Sign-off

run-name: "Remote Sign-off (${{ inputs.pr_number && format('PR #{0}', inputs.pr_number) || inputs.branch }})"
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sign off (must be pushed to origin). Mutually exclusive with pr_number.'
        required: false
        type: string
      pr_number:
        description: 'PR number to sign off — use this for fork PRs. Resolves and pins to the head commit automatically. Mutually exclusive with branch.'
        required: false
        type: string
      skip_targeted_lint:
        description: 'Skip the branch-scoped targeted pre-lint'
        required: false
        type: boolean
        default: false

concurrency:
  group: signoff-${{ inputs.pr_number || inputs.branch }}
  cancel-in-progress: true

env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  sign-off:
    name: "Sign off on ${{ inputs.pr_number && format('PR #{0}', inputs.pr_number) || github.event.inputs.branch }}"
    runs-on: spiceai-macos
    permissions:
      contents: read
      statuses: write
      # scripts/signoff re-runs the PR's completed pr.yml run so the
      # 'Attestation' check re-evaluates the sign-off status it just posted;
      # the "re-run a workflow" API needs actions: write. Without it the
      # refresh 403s and Attestation stays stuck on its pre-sign-off failure.
      actions: write
      # Needed so scripts/signoff can find the PR and its Attestation run.
      pull-requests: read
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.UNAS_SMB_PASS != '' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # For a fork PR, actions/checkout below points the local "origin" remote
      # at the fork so gh's usual git-remote repo inference (used throughout
      # scripts/signoff via `gh repo view`) would otherwise resolve to the
      # fork instead of this repo. GH_REPO pins every `gh` call in this job —
      # status posts, PR/run lookups, dispatch — to this repo regardless of
      # what "origin" points at.
      GH_REPO: ${{ github.repository }}
      # Drive remote-specific behavior in scripts/signoff (pending status,
      # "via remote" description, GitHub compare fallback, step summary).
      SIGNOFF_REMOTE_RUN: '1'
      SIGNOFF_ACTOR: ${{ github.actor }}
      SIGNOFF_DEBUG: '1'

    steps:
      - name: Resolve branch/PR input
        id: resolve
        env:
          BRANCH: ${{ inputs.branch }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -n "${BRANCH// }" && -n "${PR_NUMBER// }" ]]; then
            echo "::error::specify either 'branch' or 'pr_number', not both"
            exit 1
          fi

          if [[ -n "${PR_NUMBER// }" ]]; then
            if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::error::pr_number must be a positive integer, got '${PR_NUMBER}'"
              exit 1
            fi
            pr_json=$(gh pr view "$PR_NUMBER" --repo "$BASE_REPO" \
              --json state,isCrossRepository,headRepositoryOwner,headRepository,headRefName,headRefOid) \
              || { echo "::error::could not look up PR #${PR_NUMBER} on ${BASE_REPO}"; exit 1; }

            state=$(jq -r '.state' <<<"$pr_json")
            is_fork=$(jq -r '.isCrossRepository' <<<"$pr_json")
            head_ref=$(jq -r '.headRefName' <<<"$pr_json")
            head_sha=$(jq -r '.headRefOid' <<<"$pr_json")
            owner=$(jq -r '.headRepositoryOwner.login' <<<"$pr_json")
            name=$(jq -r '.headRepository.name' <<<"$pr_json")

            if [[ "$state" != "OPEN" ]]; then
              echo "::warning::PR #${PR_NUMBER} is ${state}, not OPEN — signing off its last-known head anyway"
            fi

            checkout_repo="${owner}/${name}"
            # Pin to the exact commit resolved right now, not the mutable
            # branch — the PR author (fork owner or collaborator) can push
            # new commits between this dispatch and when the runner actually
            # checks it out, and this job runs that code with full secrets.
            checkout_ref="$head_sha"

            if [[ "$is_fork" == "true" ]]; then
              echo "::warning::Signing off PR #${PR_NUMBER} from FORK ${checkout_repo}@${head_ref}, pinned to ${head_sha}. This runs fork-authored code (build scripts, tests, Makefiles) on a self-hosted runner with full access to this job's secrets — only dispatch this for a fork PR you've reviewed and trust."
            fi
            echo "Signing off PR #${PR_NUMBER}: ${checkout_repo}@${checkout_ref}"
          elif [[ -n "${BRANCH// }" ]]; then
            # Mirror scripts/signoff remote: allow feature/foo, reject whitespace,
            # quotes, $, `, leading dashes, absolute paths, `..`, and any char
            # outside [A-Za-z0-9._/-] so dispatch/checkout cannot be broken by the name.
            if [[ "$BRANCH" =~ [[:space:]] || "$BRANCH" == -* || "$BRANCH" == /* || "$BRANCH" == *..* \
                || "$BRANCH" == *\"* || "$BRANCH" == *\'* || "$BRANCH" == *\$* || "$BRANCH" == *\`* ]]; then
              echo "::error::invalid branch name: '${BRANCH}'"
              exit 1
            fi
            if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::invalid branch name: '${BRANCH}'"
              exit 1
            fi
            checkout_repo="$BASE_REPO"
            checkout_ref="$BRANCH"
            echo "Signing off branch: ${BRANCH}"
          else
            echo "::error::one of 'branch' or 'pr_number' is required"
            exit 1
          fi

          echo "checkout_repo=${checkout_repo}" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=${checkout_ref}" >> "$GITHUB_OUTPUT"
          echo "Triggered by: ${{ github.actor }}"
          echo "Targeted pre-lint base: trunk (fixed)"

      - name: Check out branch/PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ steps.resolve.outputs.checkout_repo }}
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          # Full history so local merge-base with trunk works when trunk is present.
          # scripts/signoff still falls back to the GitHub compare API if needed.
          fetch-depth: 0
          # Defense in depth for the fork case: nothing checked out here should
          # be able to read a persisted git credential back out of .git/config.
          # gh/git operations in this job authenticate via GH_TOKEN/GH_REPO env
          # instead, so this doesn't affect them.
          persist-credentials: false

      - name: Fetch trunk for targeted pre-lint
        run: |
          set -euo pipefail
          echo "Fetching trunk from ${{ github.repository }} for targeted pre-lint merge-base…"
          # Fetch trunk from this repo explicitly by URL rather than the
          # "origin" remote — for a fork PR, checkout above pointed "origin"
          # at the fork, which may have a stale or missing trunk ref.
          git fetch --no-tags "https://github.com/${{ github.repository }}" "trunk:refs/remotes/origin/trunk" \
            || git fetch --no-tags "https://github.com/${{ github.repository }}" trunk
          echo "HEAD: $(git rev-parse --short HEAD)"
          echo "merge-base with origin/trunk: $(git merge-base HEAD origin/trunk 2>/dev/null | cut -c1-12 || echo 'n/a (API fallback)')"

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@973bc49a7be396ec9430255ad0f7ed684d7a1317 # v0.5.8
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Install Protoc
        uses: ./.github/actions/install-protoc

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Sign off
        # -f: Actions checkouts have no @{push} upstream tracking, so the local
        # clean/pushed guards would otherwise refuse to run. The branch ref was
        # just checked out from origin, so HEAD is exactly the remote tip.
        run: scripts/signoff -f
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          SIGNOFF_SKIP_TARGETED_LINT: "${{ inputs.skip_targeted_lint && '1' || '' }}"

      - name: Show sccache stats
        if: env.SCCACHE_SETUP == 'true'
        run: sccache --show-stats

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true
