name: Enforce Pulls with Spice

on:
  merge_group:
  pull_request_target:
    types:
      [labeled, unlabeled, opened, edited, synchronize, assigned, unassigned]

jobs:
  enforce-pull-with-spice:
    # The only step is a `node24` JavaScript action that calls the GitHub API — it needs no
    # checkout, no build, and no macOS. A GitHub-hosted runner keeps this required check off
    # the self-hosted pool that the darwin build and benchmark matrices contend for, so PR
    # hygiene does not queue behind hours of heavy work.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: spiceai/pulls-with-spice-action@61ef22e4a17be07209f0811fbfe4f0deb2e490a4 # v2.0.0
        if: github.event_name == 'pull_request_target'
        with:
          require_title_min_length: '10'
          required_label_prefixes: 'kind/,area/'
          banned_labels: 'invalid,wontfix,nomerge,duplicate'
          require_assignee: 'true'
          auto_label: 'true'
          auto_label_size: 'true'
          auto_label_type: 'true'
          auto_assign_author: 'true'
