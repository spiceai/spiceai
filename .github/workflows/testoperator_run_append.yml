name: append tests
run-name: append - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      duration:
        description: 'The test duration in seconds'
        required: true
        default: '720'
        type: string
      concurrency:
        description: 'Number of analytical query workers to run while append operations execute'
        required: false
        default: '1'
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'duckdb'
          - 'sqlite'
          - 'postgresql'
          - 'mysql'
          - 'odbc-athena'
          - 'oracle'
          - 'duckdb-zero-results'
          - 'snowflake'
          - 'spark'
          - 'iceberg-sf1'
          - 'spicecloud-catalog'
          - 'glue-catalog'
          - 'databricks-catalog'
          - 'spicecloud'
          - 'iceberg-hadoop'
          - 'dynamodb'
          - 'arrow'
          - 'postgres-catalog'
          - 'mysql-catalog'
          - 'mssql-catalog'
      load_interval:
        description: 'Interval in seconds between append operations'
        required: true
        default: '60'
        type: string
      load_steps:
        description: 'Number of append steps/loads'
        required: true
        default: '10'
        type: string
      with_conflict_data:
        description: 'Include additional conflict data to test ON CONFLICT upsert behavior'
        required: false
        type: boolean
        default: false
      with_retention_data:
        description: 'Include additional data to test retention behavior'
        required: false
        type: boolean
        default: false
      # On by default: row counts alone don't catch appended rows with wrong values.
      validate_results:
        description: 'Validate the query results once the loads finish?'
        required: false
        type: boolean
        default: true

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-append:
    environment: ci
    name: Run append test
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set spicepod path
        id: set_spicepod_path
        env:
          INPUT_QUERY_SET: ${{ github.event.inputs.query_set }}
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
        run: |
          query_set="${INPUT_QUERY_SET}"
          query_set="${query_set%%\[*\]*}"
          SPICEPOD_PATH="./test/spicepods/${query_set}/sf1/${INPUT_SPICEPOD_PATH}"
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          if [ ! -f "${SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: $/.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepod
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          spicepod-validator "${SPICEPOD_PATH}"

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      # testoperator generates and checks its data with the DuckDB library installed on the host.
      - name: Set up libduckdb
        uses: $/.github/actions/setup-libduckdb

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup Testoperator
        uses: $/.github/actions/setup-testoperator-data
        with:
          query_set: ${{ github.event.inputs.query_set }}

      - name: Run the append test - ${{ github.event.inputs.spicepod_path }}
        run: |
          rm -rf .spice/data
          testoperator run append \
            -s /usr/local/bin/spiced \
            -p "${SPICEPOD_PATH}" \
            -d /opt/spiced/data \
            --query-set "${INPUT_QUERY_SET}" \
            --ready-wait 300 \
            --disable-progress-bars \
            --metrics \
            --duration "${INPUT_DURATION}" \
            --concurrency "${INPUT_CONCURRENCY}" \
            --load-interval "${INPUT_LOAD_INTERVAL}" \
            --load-steps "${INPUT_LOAD_STEPS}" \
            ${INPUT_QUERY_OVERRIDES:+--query-overrides "${INPUT_QUERY_OVERRIDES}"} \
            ${ARG_WITH_CONFLICT_DATA:+"${ARG_WITH_CONFLICT_DATA}"} \
            ${ARG_WITH_RETENTION_DATA:+"${ARG_WITH_RETENTION_DATA}"} \
            --validate="${INPUT_VALIDATE_RESULTS}"
        env:
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          INPUT_QUERY_SET: ${{ github.event.inputs.query_set }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_CONCURRENCY: ${{ github.event.inputs.concurrency }}
          INPUT_LOAD_INTERVAL: ${{ github.event.inputs.load_interval }}
          INPUT_LOAD_STEPS: ${{ github.event.inputs.load_steps }}
          INPUT_QUERY_OVERRIDES: ${{ github.event.inputs.query_overrides }}
          ARG_WITH_CONFLICT_DATA: ${{ github.event.inputs.with_conflict_data == 'true' && '--with-conflict-data' || '' }}
          ARG_WITH_RETENTION_DATA: ${{ github.event.inputs.with_retention_data == 'true' && '--with-retention-data' || '' }}
          INPUT_VALIDATE_RESULTS: ${{ github.event.inputs.validate_results }}
