name: CI cache warm-up

# Uploads every file .github/ci-cache/pins.json pins to the `ci-cache` bucket of the CI
# object store, where jobs read it anonymously through .github/scripts/cached_fetch.sh.
# This is the one job that writes to the bucket. It runs when the pins change on trunk, so
# a new pin is cached right after it merges, and daily, to replace anything lost or wrong.
# See .github/ci-cache/README.md.
on:
  push:
    branches:
      - trunk
    paths:
      - '.github/ci-cache/pins.json'
      - '.github/scripts/cached_fetch.sh'
      - '.github/scripts/ci_cache_warm.py'
      - '.github/scripts/rust_dist_mirror.py'
      - '.github/workflows/ci_cache_warm.yml'
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm the CI cache
    # Holds the RustFS endpoint, and its OIDC trust is what grants the upload.
    environment: ci
    # The pods that read the cache, on the network that reaches it.
    runs-on: spiceai-dev-runners
    # A full refill is about 130 MB from GitHub and static.rust-lang.org.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '1800'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Upload the pinned files the cache lacks
        env:
          CI_CACHE_URL: ${{ vars.TEST_MINIO_ENDPOINT }}/ci-cache
          CI_CACHE_BUCKET: spice-minio/ci-cache
        run: python3 .github/scripts/ci_cache_warm.py
