---
name: integration tests (search)

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC

  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'always'
          - 'no'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  test-search:
    name: Test Search Integration
    runs-on: 'spiceai-macos'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          os: 'darwin'

      - name: Verify Docker/Colima environment
        run: |
          echo "=== PATH ==="
          echo "$PATH"
          
          echo "=== Homebrew paths ==="
          ls -la /opt/homebrew/bin/colima 2>/dev/null || echo "/opt/homebrew/bin/colima: not found"
          ls -la /opt/homebrew/bin/docker 2>/dev/null || echo "/opt/homebrew/bin/docker: not found"
          
          echo "=== DOCKER_HOST ==="
          echo "DOCKER_HOST=$DOCKER_HOST"
          
          echo "=== Colima socket ==="
          ls -la /Users/runner/.colima/default/docker.sock 2>/dev/null || echo "Colima socket not found"
          
          echo "=== which commands ==="
          which colima 2>/dev/null || echo "colima not in PATH"
          which docker 2>/dev/null || echo "docker not in PATH"
          
          echo "=== LaunchDaemon plist ==="
          ls -la /Library/LaunchDaemons/io.colima.plist 2>/dev/null || echo "Colima LaunchDaemon plist NOT FOUND"
          cat /Library/LaunchDaemons/io.colima.plist 2>/dev/null || echo "Cannot read plist"
          
          echo "=== LaunchDaemon status ==="
          sudo launchctl list | grep colima || echo "Colima not in launchctl list"
          
          echo "=== Colima logs ==="
          cat /Users/runner/colima-stdout.log 2>/dev/null || echo "No stdout log"
          cat /Users/runner/colima-stderr.log 2>/dev/null || echo "No stderr log"
          
          echo "=== Colima status ==="
          colima status || echo "Colima not running"
          
          echo "=== Docker info ==="
          docker info || echo "Docker daemon not responding"

      - name: Set up API Keys
        run: |
          echo 'SPICE_OPENAI_API_KEY="${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}"' > .env

      - name: Run search integration tests
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_SECRET_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
          AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
          AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
        run: |
          if [ -z "$SPICE_SECRET_OPENAI_API_KEY" ] ; then
            echo "Error: OpenAI API key is not defined."
            exit 1
          fi
          cargo test --test integration_models -p runtime  --features models,metal,s3_vectors,kafka,duckdb,extended_tests -- search || {
            if [ "$INSTA_UPDATE" == "always" ]; then
              echo "Warning: Tests failed but INSTA_UPDATE is enabled. Continuing."
              exit 0
            else
              exit 1
            fi
          }

      - name: Push snapshots to branch
        if: github.event.inputs.update_snapshots == 'always' || github.event_name == 'schedule'
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'fix: Update Search integration test snapshots'
