---
name: integration tests (search)

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC

  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'always'
          - 'no'

permissions:
  contents: write
  pull-requests: write
  # Approves the snapshot PR's held pull_request runs.
  actions: write
  # Exchanged for the short-lived AWS and OpenAI credentials.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  test-search:
    name: Test Search Integration
    runs-on: spiceai-macos-large
    environment: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      # The step below builds the tests before it runs them, so the credentials last as long as
      # the job's default 6-hour limit.
      - name: Assume the S3 Vectors role
        id: aws-s3-vectors
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_S3_VECTORS_ROLE_ARN }}
          role-session-name: gha-s3-vectors-${{ github.run_id }}
          role-duration-seconds: 21600
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      # The tests hold this token until they end. It expires about 300 s after it is minted,
      # so the step below must end within that time.
      - name: Mint an OpenAI access token
        uses: ./.github/actions/openai-token
        with:
          identity-provider-id: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
          service-account-id: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
          audience: ${{ secrets.OPENAI_WIF_AUDIENCE }}

      - name: Run search integration tests
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          AWS_S3_VECTORS_KEY: ${{ steps.aws-s3-vectors.outputs.aws-access-key-id }}
          AWS_S3_VECTORS_SECRET: ${{ steps.aws-s3-vectors.outputs.aws-secret-access-key }}
          AWS_S3_VECTORS_SESSION_TOKEN: ${{ steps.aws-s3-vectors.outputs.aws-session-token }}
          # ARN of the pre-seeded, long-lived S3 Vectors index the S3VectorsFallback permutation
          # falls back to (its zero-row acceleration never populates the index itself).
          AWS_S3_VECTORS_FALLBACK_INDEX_ARN: ${{ vars.AWS_S3_VECTORS_FALLBACK_INDEX_ARN }}
        run: |
          if [ -z "${SPICE_OPENAI_API_KEY:-}" ] ; then
            echo "Error: OpenAI API key is not defined."
            exit 1
          fi
          cargo test --test integration_models -p runtime --features models,metal,s3_vectors,kafka,duckdb,extended_tests -- search

      - name: Push snapshots to branch
        # `cargo test` will fail if snapshot changes are needed. Always attempt
        #  to make PR if 'always' update snapshots.
        if: ${{ always() && (github.event.inputs.update_snapshots == 'always' || github.event_name == 'schedule') }}
        timeout-minutes: 10
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'fix: Update Search integration test snapshots'
