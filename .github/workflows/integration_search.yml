---
name: integration tests (search)

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC

  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'always'
          - 'no'

# test-search declares the write grants it uses.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

jobs:
  test-search:
    # Assumes a CI AWS role, so it runs from integration_search_aws.yml; see that file.
    permissions:
      contents: write  # push-snap-changes pushes a snapshot branch
      pull-requests: write  # and opens, auto-merges or closes its PR
      # Approves the snapshot PR's held pull_request runs.
      actions: write
      # Exchanged for OpenAI access tokens: workload identity federation.
      id-token: write
    uses: spiceai/spiceai/.github/workflows/integration_search_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_AWS_S3_VECTORS_ROLE_ARN: ${{ secrets.CI_AWS_S3_VECTORS_ROLE_ARN }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
    with:
      update_snapshots: ${{ github.event.inputs.update_snapshots }}
