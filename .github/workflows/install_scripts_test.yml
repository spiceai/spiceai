---
name: Install Scripts Test

on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
    paths:
      - 'install/**'
      - 'test/scripts/install-scripts-test.sh'
      - 'test/scripts/install-ps1-test.ps1'
      - 'test/scripts/install-ps1-path-test.ps1'
      - 'test/scripts/install-ps1-skills-test.ps1'
      - 'test/scripts/install-download-test.py'
      - 'test/scripts/install-fake-github.py'
      - 'test/scripts/install-release-check.sh'
      - '.github/workflows/install_scripts_test.yml'
  push:
    branches:
      - trunk
    paths:
      - 'install/**'
      - 'test/scripts/install-scripts-test.sh'
      - 'test/scripts/install-ps1-test.ps1'
      - 'test/scripts/install-ps1-path-test.ps1'
      - 'test/scripts/install-ps1-skills-test.ps1'
      - 'test/scripts/install-download-test.py'
      - 'test/scripts/install-fake-github.py'
      - 'test/scripts/install-release-check.sh'
      - '.github/workflows/install_scripts_test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # Unit tests for install script logic
  test-install-scripts:
    environment: secret-free
    name: Test Install Scripts (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - os: linux-x64
            runner: ubuntu-24.04
            shell: zsh
          - os: linux-x64
            runner: ubuntu-24.04
            shell: sh
          # Linux ARM64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            shell: zsh
          # macOS ARM64 (Apple Silicon)
          - os: macos-arm64
            runner: macos-latest
            shell: bash
          - os: macos-arm64
            runner: macos-latest
            shell: zsh
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh (Ubuntu)
        if: contains(matrix.os, 'linux') && matrix.shell == 'zsh'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Linux images ship wget, so the wget tests must run there, not skip.
      - name: Run install script tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRE_WGET: ${{ contains(matrix.os, 'linux') && '--require-wget' || '' }}
        run: |
          chmod +x test/scripts/install-scripts-test.sh
          bash test/scripts/install-scripts-test.sh --live $REQUIRE_WGET

  # Test shell detection and PATH configuration
  test-shell-detection:
    environment: secret-free
    name: Shell Detection (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }} {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: linux-x64
            runner: ubuntu-24.04
            shell: bash
          - os: linux-x64
            runner: ubuntu-24.04
            shell: zsh
          # Linux ARM64
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            shell: bash
          # macOS ARM64
          - os: macos-arm64
            runner: macos-latest
            shell: bash
          - os: macos-arm64
            runner: macos-latest
            shell: zsh
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zsh (Ubuntu)
        if: contains(matrix.os, 'linux') && matrix.shell == 'zsh'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Create shell profile
        run: |
          if [ "${{ matrix.shell }}" = "bash" ]; then
            touch ~/.bashrc
            touch ~/.bash_profile
          elif [ "${{ matrix.shell }}" = "zsh" ]; then
            touch ~/.zshrc
          fi

      - name: Test install.sh with shell detection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHELL: /bin/${{ matrix.shell }}
        run: |
          chmod +x install/install.sh
          ./install/install.sh

          # Verify binary was installed
          if [ ! -f "$HOME/.spice/bin/spice" ]; then
            echo "ERROR: spice binary not found at $HOME/.spice/bin/spice"
            exit 1
          fi

          # Verify binary is executable
          if [ ! -x "$HOME/.spice/bin/spice" ]; then
            echo "ERROR: spice binary is not executable"
            exit 1
          fi

          # Verify it runs
          unset GITHUB_TOKEN
          "$HOME/.spice/bin/spice" version

      # The profiles the installer writes: for bash, .bashrc and the login file on Linux and the
      # login file on macOS; for zsh, .zshrc on Linux and .zprofile on macOS. A new shell of the
      # same kind must then find spice.
      - name: Verify PATH setup
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
          SHELL_NAME: ${{ matrix.shell }}
        shell: bash
        run: |
          case "$RUNNER_OS_NAME:$SHELL_NAME" in
            Linux:bash) profiles=(~/.bashrc ~/.bash_profile); new_shell=(bash -ic) ;;
            macOS:bash) profiles=(~/.bash_profile); new_shell=(bash -lc) ;;
            Linux:zsh) profiles=(~/.zshrc); new_shell=(zsh -ic) ;;
            macOS:zsh) profiles=(~/.zprofile); new_shell=(zsh -lc) ;;
          esac
          for profile in "${profiles[@]}"; do
            grep -qxF "# >>> spice installer >>>" "$profile" || { echo "::error::No PATH block in $profile"; cat "$profile"; exit 1; }
            echo "PATH block found in $profile"
          done
          found=$(env -i HOME="$HOME" PATH=/usr/bin:/bin "${new_shell[@]}" 'command -v spice' 2>/dev/null | tail -n 1)
          if [ "$found" != "$HOME/.spice/bin/spice" ]; then
            echo "::error::A new $SHELL_NAME shell found '$found', not $HOME/.spice/bin/spice"
            exit 1
          fi
          echo "A new $SHELL_NAME shell finds $found"

  # Test custom install directories
  test-custom-install-dir:
    environment: secret-free
    name: Custom Install Dir (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-24.04
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-arm64
            runner: macos-latest
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test install.sh with custom directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export SPICE_CLI_INSTALL_DIR="${{ github.workspace }}/custom-spice-bin"
          mkdir -p "$SPICE_CLI_INSTALL_DIR"
          chmod +x install/install.sh
          ./install/install.sh

          # Verify binary location
          if [ ! -f "$SPICE_CLI_INSTALL_DIR/spice" ]; then
            echo "ERROR: spice not installed to custom directory"
            ls -la "$SPICE_CLI_INSTALL_DIR" || true
            exit 1
          fi

          unset GITHUB_TOKEN
          "$SPICE_CLI_INSTALL_DIR/spice" version

      - name: Test install-spiced.sh with custom directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICED_INSTALL_DIR: ${{ github.workspace }}/custom-spiced-bin
        run: |
          mkdir -p "$SPICED_INSTALL_DIR"
          chmod +x install/install-spiced.sh
          ./install/install-spiced.sh

          # Verify binary location
          if [ ! -f "$SPICED_INSTALL_DIR/spiced" ]; then
            echo "ERROR: spiced not installed to custom directory"
            ls -la "$SPICED_INSTALL_DIR" || true
            exit 1
          fi

          unset GITHUB_TOKEN
          "$SPICED_INSTALL_DIR/spiced" --version

  # Test all spiced variants across architectures
  test-spiced-variants:
    environment: secret-free
    name: Spiced Variant (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 variants
          - os: linux-x64
            runner: ubuntu-24.04
            variant: ''
          # Linux ARM64 variants
          - os: linux-arm64
            runner: ubuntu-24.04-arm
            variant: ''
          # macOS ARM64 variants
          - os: macos-arm64
            runner: macos-latest
            variant: ''
          - os: macos-arm64
            runner: macos-latest
            variant: metal
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test install-spiced.sh with variant '${{ matrix.variant }}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VARIANT: ${{ matrix.variant }}
          SPICED_INSTALL_DIR: ${{ runner.temp }}/spiced-bin
        run: |
          mkdir -p "$SPICED_INSTALL_DIR"
          chmod +x install/install-spiced.sh
          ./install/install-spiced.sh
          unset GITHUB_TOKEN
          "$SPICED_INSTALL_DIR/spiced" --version

  # Install specific releases, and check each download was verified against what its release
  # records: its SHA256SUMS and build attestation when it publishes them, otherwise the sha256
  # GitHub recorded for the asset.
  test-specific-version:
    environment: secret-free
    name: Specific Version Install (${{ matrix.platform.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux-x64
            runner: ubuntu-24.04
          - os: linux-arm64
            runner: ubuntu-24.04-arm
          - os: macos-arm64
            runner: macos-latest
        # A release with SHA256SUMS joins this list once one is published.
        version: [latest, 2.4.1, 1.11.6]
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look up release ${{ matrix.version }}
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash test/scripts/install-release-check.sh release "${{ matrix.version }}"

      - name: Test install.sh with a specific version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICE_CLI_INSTALL_DIR: ${{ github.workspace }}/bin-cli
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SUMS: ${{ steps.release.outputs.sums }}
          ASSET: ${{ steps.release.outputs.cli_asset }}
        run: |
          mkdir -p "$SPICE_CLI_INSTALL_DIR"
          ./install/install.sh "$RELEASE_VERSION" 2>&1 | tee "$RUNNER_TEMP/install-cli.log"
          expect() { grep -qF -- "$1" "$RUNNER_TEMP/install-cli.log" || { echo "::error::The install output lacks: $1"; exit 1; }; }
          if [ "$RELEASE_SUMS" = yes ]; then
            expect "Verified the sha256 of $ASSET against the SHA256SUMS of release $RELEASE_TAG."
            expect "Verified the build attestation of $ASSET."
          else
            expect "Verified the sha256 of $ASSET against the sha256 GitHub recorded for $ASSET in release $RELEASE_TAG."
          fi
          unset GITHUB_TOKEN
          "$SPICE_CLI_INSTALL_DIR/spice" version

      - name: Test install-spiced.sh with a specific version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICED_INSTALL_DIR: ${{ github.workspace }}/bin-spiced
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SUMS: ${{ steps.release.outputs.sums }}
          ASSET: ${{ steps.release.outputs.runtime_asset }}
        run: |
          mkdir -p "$SPICED_INSTALL_DIR"
          ./install/install-spiced.sh "$RELEASE_VERSION" 2>&1 | tee "$RUNNER_TEMP/install-spiced.log"
          expect() { grep -qF -- "$1" "$RUNNER_TEMP/install-spiced.log" || { echo "::error::The install output lacks: $1"; exit 1; }; }
          if [ "$RELEASE_SUMS" = yes ]; then
            expect "Verified the sha256 of $ASSET against the SHA256SUMS of release $RELEASE_TAG."
            expect "Verified the build attestation of $ASSET."
          else
            expect "Verified the sha256 of $ASSET against the sha256 GitHub recorded for $ASSET in release $RELEASE_TAG."
          fi
          unset GITHUB_TOKEN
          "$SPICED_INSTALL_DIR/spiced" --version

  # Install the latest release as someone with no GitHub account does: no token, and a GitHub CLI
  # that is not logged in. A runner shares its address's 60 unauthenticated API requests an hour
  # with other users, so the installs run only when enough are left, and the job says so when not.
  test-no-account:
    environment: secret-free
    name: No GitHub Account (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-x64
            runner: ubuntu-24.04
          - os: macos-arm64
            runner: macos-latest
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look up the latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash test/scripts/install-release-check.sh release latest

      - name: Check the unauthenticated API rate limit
        id: budget
        shell: bash
        env:
          PER_INSTALL: ${{ steps.release.outputs.api_requests }}
        # Two installs, of the CLI and of the runtime.
        run: bash test/scripts/install-release-check.sh budget "$((2 * PER_INSTALL))"

      - name: Install the CLI and the runtime with no token
        if: steps.budget.outputs.run == 'true'
        shell: bash
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/gh-no-account
          SPICE_CLI_INSTALL_DIR: ${{ runner.temp }}/no-account-cli
          SPICED_INSTALL_DIR: ${{ runner.temp }}/no-account-spiced
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SUMS: ${{ steps.release.outputs.sums }}
          CLI_ASSET: ${{ steps.release.outputs.cli_asset }}
          RUNTIME_ASSET: ${{ steps.release.outputs.runtime_asset }}
        run: |
          unset GITHUB_TOKEN GH_TOKEN GH_ENTERPRISE_TOKEN GITHUB_ENTERPRISE_TOKEN
          mkdir -p "$GH_CONFIG_DIR" "$SPICE_CLI_INSTALL_DIR" "$SPICED_INSTALL_DIR"
          if gh auth status > /dev/null 2>&1; then
            echo "::error::gh is logged in, so this would not test an install with no account"
            exit 1
          fi
          check() {
            local log="$1" asset="$2"
            expect() { grep -qF -- "$1" "$log" || { echo "::error::The install output lacks: $1"; exit 1; }; }
            if [ "$RELEASE_SUMS" = yes ]; then
              expect "Verified the sha256 of $asset against the SHA256SUMS of release $RELEASE_TAG."
              expect "Skipped the build attestation check of $asset: the GitHub CLI (gh) is not installed or not logged in."
            else
              expect "Verified the sha256 of $asset against the sha256 GitHub recorded for $asset in release $RELEASE_TAG."
            fi
          }
          ./install/install.sh 2>&1 | tee "$RUNNER_TEMP/no-account-cli.log"
          check "$RUNNER_TEMP/no-account-cli.log" "$CLI_ASSET"
          "$SPICE_CLI_INSTALL_DIR/spice" version
          ./install/install-spiced.sh 2>&1 | tee "$RUNNER_TEMP/no-account-spiced.log"
          check "$RUNNER_TEMP/no-account-spiced.log" "$RUNTIME_ASSET"
          "$SPICED_INSTALL_DIR/spiced" --version

      - name: Show the rate limit after a failed install
        if: failure() && steps.budget.outputs.run == 'true'
        shell: bash
        run: curl -fsS https://api.github.com/rate_limit | jq '.resources.core'

  # Test HTTP client fallback (curl vs wget)
  test-http-clients:
    environment: secret-free
    name: HTTP Client (${{ matrix.client }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        client: [curl, wget]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove alternative HTTP client
        run: |
          if [ "${{ matrix.client }}" = "curl" ]; then
            alternate=wget
          else
            alternate=curl
          fi
          while command -v "$alternate" >/dev/null 2>&1; do
            client_path=$(command -v "$alternate")
            sudo mv "$client_path" "$client_path.install-test-backup"
            echo "$client_path" >> "${{ runner.temp }}/hidden-http-clients"
            hash -r
          done

      - name: Verify only ${{ matrix.client }} is available
        run: |
          if [ "${{ matrix.client }}" = "curl" ]; then
            command -v curl
            alternate=wget
          else
            command -v wget
            alternate=curl
          fi
          if command -v "$alternate"; then
            echo "ERROR: Alternative HTTP client is still available"
            exit 1
          fi

      - name: Test runtime download retries with ${{ matrix.client }}
        run: python3 test/scripts/install-download-test.py --client "${{ matrix.client }}"

      - name: Test install.sh with ${{ matrix.client }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICE_CLI_INSTALL_DIR: ${{ runner.temp }}/spice-bin
        run: |
          mkdir -p "$SPICE_CLI_INSTALL_DIR"
          chmod +x install/install.sh
          ./install/install.sh
          unset GITHUB_TOKEN
          "$SPICE_CLI_INSTALL_DIR/spice" version

      # GITHUB_TOKEN goes to the GitHub API, which rejects an invalid one; release downloads
      # ignore it. 2.4.1 publishes no SHA256SUMS, so verifying it needs the API.
      - name: Reject invalid release credentials with ${{ matrix.client }}
        env:
          GITHUB_TOKEN: invalid-installer-test-token
          LC_ALL: C
          SPICED_INSTALL_DIR: ${{ runner.temp }}/spiced-bin
        run: |
          if bash install/install-spiced.sh 2.4.1 > "${{ runner.temp }}/invalid-token.log" 2>&1; then
            echo "ERROR: Runtime installer accepted invalid release credentials"
            exit 1
          fi
          cat "${{ runner.temp }}/invalid-token.log"
          grep -E '(^|[^0-9])401([^0-9]|$)|Username/Password Authentication Failed\.' "${{ runner.temp }}/invalid-token.log"
          grep -F "the GitHub API request for its asset sha256 failed" "${{ runner.temp }}/invalid-token.log"

      - name: Test install-spiced.sh with ${{ matrix.client }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICED_INSTALL_DIR: ${{ runner.temp }}/spiced-bin
        run: |
          mkdir -p "$SPICED_INSTALL_DIR"
          bash install/install-spiced.sh
          unset GITHUB_TOKEN
          "$SPICED_INSTALL_DIR/spiced" --version

      - name: Restore HTTP clients
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/hidden-http-clients" ]; then
            while IFS= read -r client_path; do
              sudo mv "$client_path.install-test-backup" "$client_path"
            done < "${{ runner.temp }}/hidden-http-clients"
          fi

  # Test error handling
  test-error-handling:
    environment: secret-free
    name: Error Handling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test invalid version handling
        run: |
          chmod +x install/install-spiced.sh
          export SPICED_INSTALL_DIR="${{ runner.temp }}/spiced-bin"
          mkdir -p "$SPICED_INSTALL_DIR"

          # This should fail gracefully with a non-existent version
          if ./install/install-spiced.sh 0.0.0-nonexistent 2>&1; then
            echo "ERROR: Script should have failed for non-existent version"
            exit 1
          else
            echo "✓ Script correctly failed for non-existent version"
          fi

      - name: Test invalid CUDA variant on non-Linux
        if: runner.os == 'macOS'
        run: |
          chmod +x install/install-spiced.sh
          export SPICED_INSTALL_DIR="${{ runner.temp }}/spiced-bin"
          export VARIANT="cuda"
          export CUDA_VERSION="90"
          mkdir -p "$SPICED_INSTALL_DIR"

          # This should fail on macOS
          if ./install/install-spiced.sh > "${{ runner.temp }}/cuda-rejection.log" 2>&1; then
            echo "ERROR: CUDA variant should not be allowed on macOS"
            exit 1
          else
            cat "${{ runner.temp }}/cuda-rejection.log"
            grep -F "CUDA variants are only supported on Linux" "${{ runner.temp }}/cuda-rejection.log"
            echo "✓ Script correctly rejected CUDA variant on macOS"
          fi

  # Test on Windows with WSL
  test-windows-wsl:
    environment: secret-free
    name: Windows WSL (${{ matrix.distro }})
    runs-on: windows-latest
    env:
      WSLENV: GITHUB_TOKEN/u
    strategy:
      fail-fast: false
      matrix:
        distro: [Ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup WSL
        uses: Vampire/setup-wsl@4c48163d9f981914dd8caa0fc335fe19cca5bff4 # v7.2.0
        with:
          distribution: ${{ matrix.distro }}
          additional-packages: curl wget python3

      - name: Run install script tests in WSL
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x test/scripts/install-scripts-test.sh
          ./test/scripts/install-scripts-test.sh --live --require-wget

      - name: Test install.sh in WSL
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x install/install.sh
          export SPICE_CLI_INSTALL_DIR="$HOME/.spice/bin"
          ./install/install.sh

          if [ ! -f "$SPICE_CLI_INSTALL_DIR/spice" ]; then
            echo "ERROR: spice binary not found"
            exit 1
          fi

          unset GITHUB_TOKEN
          "$SPICE_CLI_INSTALL_DIR/spice" version

      - name: Test install-spiced.sh in WSL
        shell: wsl-bash {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x install/install-spiced.sh
          export SPICED_INSTALL_DIR="$HOME/bin"
          mkdir -p "$SPICED_INSTALL_DIR"
          ./install/install-spiced.sh

          if [ ! -f "$SPICED_INSTALL_DIR/spiced" ]; then
            echo "ERROR: spiced binary not found"
            exit 1
          fi

          unset GITHUB_TOKEN
          "$SPICED_INSTALL_DIR/spiced" --version

  # Test native Windows with PowerShell
  test-windows-native:
    environment: secret-free
    name: Windows Native (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Install.ps1
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run the PowerShell installer
          .\install\Install.ps1

          # Verify the binary was installed
          $spicePath = Join-Path $HOME ".spice\bin\spice.exe"
          if (-not (Test-Path $spicePath)) {
            Write-Error "ERROR: spice.exe not found at $spicePath"
            exit 1
          }

          # Verify it runs
          Remove-Item Env:GITHUB_TOKEN
          & $spicePath version

      - name: Verify PATH was updated
        shell: pwsh
        run: |
          $userPath = [Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::User)
          $spiceBinDir = Join-Path $HOME ".spice\bin"

          if ($userPath -like "*$spiceBinDir*") {
            Write-Host "✓ PATH was updated to include $spiceBinDir"
          } else {
            Write-Host "⚠ PATH does not contain $spiceBinDir"
            Write-Host "Current User PATH: $userPath"
          }

  # Install.ps1 as someone with no GitHub account runs it: no token. The rate limit gate works as
  # in test-no-account.
  test-windows-no-token:
    environment: secret-free
    name: Windows No GitHub Account (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look up the latest release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash test/scripts/install-release-check.sh release latest

      - name: Check the unauthenticated API rate limit
        id: budget
        shell: bash
        env:
          NEEDED: ${{ steps.release.outputs.api_requests }}
        run: bash test/scripts/install-release-check.sh budget "$NEEDED"

      - name: Install the CLI with no token
        if: steps.budget.outputs.run == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SUMS: ${{ steps.release.outputs.sums }}
          ASSET: ${{ steps.release.outputs.cli_asset }}
        run: |
          Remove-Item Env:GITHUB_TOKEN, Env:GH_TOKEN -ErrorAction SilentlyContinue
          $output = (.\install\Install.ps1 | Out-String)
          Write-Output $output
          $expected = if ($env:RELEASE_SUMS -eq "yes") {
            "Verified the sha256 of $env:ASSET against the SHA256SUMS of release $env:RELEASE_TAG."
          } else {
            "Verified the sha256 of $env:ASSET against the sha256 GitHub recorded for $env:ASSET in release $env:RELEASE_TAG."
          }
          if (-not $output.Contains($expected)) {
            Write-Output "::error::The install output lacks: $expected"
            exit 1
          }
          & (Join-Path $HOME ".spice\bin\spice.exe") version

      - name: Show the rate limit after a failed install
        if: failure() && steps.budget.outputs.run == 'true'
        shell: bash
        run: curl -fsS https://api.github.com/rate_limit | jq '.resources.core'

  # Test Windows PowerShell with custom directory
  test-windows-custom-dir:
    environment: secret-free
    name: Windows Custom Dir (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test Install.ps1 with custom directory
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create custom install directory
          $customDir = Join-Path $env:GITHUB_WORKSPACE "custom-spice-bin"
          New-Item -Path $customDir -ItemType Directory -Force | Out-Null

          # Modify script to use custom directory (inline for testing)
          $content = Get-Content .\install\Install.ps1 -Raw
          $content = $content -replace '\$spiceCliInstallDir = Join-Path \$HOME \$spiceBin', "`$spiceCliInstallDir = `"$customDir`""
          $content | Set-Content .\install\Install-Custom.ps1

          # Run the modified script
          .\install\Install-Custom.ps1

          # Verify binary location
          $spicePath = Join-Path $customDir "spice.exe"
          if (-not (Test-Path $spicePath)) {
            Write-Error "ERROR: spice.exe not found at $spicePath"
            Get-ChildItem $customDir
            exit 1
          }

          # Verify it runs
          Remove-Item Env:GITHUB_TOKEN
          & $spicePath version

  # Test Windows PowerShell error handling
  test-windows-errors:
    environment: secret-free
    name: Windows Error Handling (PowerShell)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test PowerShell script syntax
        shell: pwsh
        run: |
          # Check for syntax errors using AST
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "install\Install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found:"
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "✓ No syntax errors in Install.ps1"

      - name: Test Install.ps1 download verification
        shell: pwsh
        run: ./test/scripts/install-ps1-test.ps1

      # A stock Windows install runs the README's `iex (... DownloadString ...)` in Windows
      # PowerShell 5.1, not PowerShell 7, so the same tests run there too.
      - name: Test Install.ps1 download verification (Windows PowerShell 5.1)
        shell: powershell
        run: ./test/scripts/install-ps1-test.ps1

      - name: Test Install.ps1 PATH update
        shell: pwsh
        run: ./test/scripts/install-ps1-path-test.ps1

      - name: Test Install.ps1 skills offer
        shell: pwsh
        run: ./test/scripts/install-ps1-skills-test.ps1

      - name: Test Install.ps1 skills offer (Windows PowerShell 5.1)
        shell: powershell
        run: ./test/scripts/install-ps1-skills-test.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource -Name PSScriptAnalyzer -TrustRepository -Scope CurrentUser -Quiet -ErrorAction Stop
          $results = @(Invoke-ScriptAnalyzer -Path .\install\Install.ps1 -Severity Error,Warning)

          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize RuleName,Severity,Line,Message | Out-String -Width 200
            Write-Error "PSScriptAnalyzer found $($results.Count) errors or warnings in Install.ps1."
            exit 1
          }
          Write-Host "No errors or warnings from PSScriptAnalyzer"

  # Validate scripts with shellcheck
  shellcheck:
    environment: secret-free
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # No exclusions: a deliberate pattern carries its own `# shellcheck` directive.
      - name: Run shellcheck on install.sh
        run: |
          shellcheck install/install.sh

      - name: Run shellcheck on install-spiced.sh
        run: |
          shellcheck install/install-spiced.sh

      - name: Run shellcheck on test script
        run: |
          shellcheck -e SC2034,SC2086,SC2155 test/scripts/install-scripts-test.sh

      - name: Run shellcheck on the live job helper
        run: |
          shellcheck test/scripts/install-release-check.sh
