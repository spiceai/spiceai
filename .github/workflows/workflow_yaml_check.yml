---
name: Workflow YAML Check

# A workflow GitHub cannot parse is silently disabled — it reports no jobs, its
# triggers and path filters are never evaluated, and it is not a required check.
# This gate turns that into a PR failure instead. See #12181.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/scripts/check_workflow_yaml.py'
      - '.github/scripts/test_check_workflow_yaml.py'
  push:
    branches:
      - trunk
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actionlint.yaml'
      - '.github/scripts/check_workflow_yaml.py'
      - '.github/scripts/test_check_workflow_yaml.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-workflow-yaml:
    name: Validate GitHub Actions definitions
    # GitHub-hosted on purpose: this is a sub-second check and must not queue
    # behind the saturated self-hosted pool.
    runs-on: ubuntu-24.04
    # Reads the checkout and nothing else.
    permissions:
      contents: read
    # The whole job is a download plus two linters over ~120 small files. Anything
    # past this is wedged, not slow, and without a bound it would inherit GitHub's
    # six-hour ceiling.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run tests
        run: python .github/scripts/test_check_workflow_yaml.py -v

      - name: Validate GitHub Actions definitions
        run: python .github/scripts/check_workflow_yaml.py

      # `check_workflow_yaml.py` above encodes the failures this repository has
      # actually been bitten by, cell by cell, each one added after an incident.
      # actionlint carries GitHub's whole context-availability table plus its key
      # schema, expression types and matrix rules, so it covers that class without
      # anyone having to write the next cell out by hand — including the one that
      # took `Install Scripts Test` off the air in #14052 (a step `shell:` naming
      # `matrix`; actionlint reports it as `context "matrix" is not allowed here`,
      # our own guard does not). The two are complementary, not redundant: the
      # Python guard checks repo-specific rules actionlint knows nothing about
      # (step budgets a job budget pre-empts, the compiler cache's
      # AWS_ENDPOINT_URL leaking into a runtime step, a nightly's later suites
      # skipping behind an earlier failure), so both run.
      - name: Install actionlint
        env:
          # Pin both the version and the artifact. A linter that installs
          # whatever is newest turns an upstream release into a CI failure on a
          # PR that changed nothing.
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            -o /tmp/actionlint.tar.gz "$url"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum --check --status \
            || { echo "::error::actionlint ${ACTIONLINT_VERSION} tarball does not match its pinned checksum."; exit 1; }
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Lint GitHub Actions definitions (actionlint)
        run: |
          set -euo pipefail
          # -shellcheck= / -pyflakes= turn OFF actionlint's script-body linters.
          # Those grade the contents of `run:` blocks, which is a separate backlog
          # with its own findings on this tree; this gate is about whether GitHub
          # can schedule the definition. Enabling them is tracked in the issue
          # below rather than bundled here.
          #
          # Each -ignore is a finding class left on the tree deliberately, because
          # it needs a decision this PR should not make on its own. They are
          # enumerated with their evidence in spiceai/spiceai#14222 and this list
          # shrinks as that issue is worked; nothing else is suppressed.
          /tmp/actionlint -color -shellcheck= -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            -ignore 'string should not be empty' \
            -ignore 'anchor ".+" is defined but not used' \
            -ignore 'constant expression "false" in condition' \
            -ignore 'property "(params|profile_option)" is not defined in object type'
