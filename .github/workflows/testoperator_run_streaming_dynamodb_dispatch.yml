name: streaming dynamodb dispatch
run-name: streaming-dispatch - ${{ github.event.inputs.queryset }} - sf${{ github.event.inputs.scale_factor }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'Primary spicepod file path (relative to repo root, e.g., test/spicepods/streaming/dynamodb/duckdb.yaml)'
        required: true
        type: string
      additional_configs:
        description: 'Additional spicepod paths (comma-separated, relative to repo root)'
        required: false
        type: string
      queryset:
        description: 'Query set type'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
      scale_factor:
        description: 'Scale factor for data generation'
        required: true
        default: '0.01'
        type: string
      ingestion_timeout:
        description: 'Timeout in seconds to wait for ingestion'
        required: true
        default: '600'
        type: string
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start'
        required: true
        default: '60'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      verify:
        description: 'Run TPCH queries to verify data integrity'
        required: false
        type: boolean
        default: true
      mutation_ratio:
        description: 'Ratio of rows to mutate for CDC testing (0.0-1.0)'
        required: false
        type: string
        default: '0.01'
      trigger_workflows:
        description: 'Trigger separate workflows for each config instead of running locally'
        required: false
        type: boolean
        default: false
      wait_for_workflows:
        description: 'Wait for each triggered workflow to complete'
        required: false
        type: boolean
        default: false

jobs:
  run-streaming-dispatch:
    name: Run DynamoDB streaming dispatch
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set spicepod paths
        id: set_paths
        run: |
          # Support both relative paths (from repo root) and paths with ./ prefix
          INPUT_PATH="${{ github.event.inputs.spicepod_path }}"
          if [[ "${INPUT_PATH}" == ./* ]]; then
            PRIMARY_PATH="${INPUT_PATH}"
          else
            PRIMARY_PATH="./${INPUT_PATH}"
          fi
          echo "PRIMARY_PATH=${PRIMARY_PATH}" >> $GITHUB_OUTPUT

          # Build additional config args
          ADDITIONAL_CONFIGS="${{ github.event.inputs.additional_configs }}"
          CONFIG_ARGS=""
          if [ -n "${ADDITIONAL_CONFIGS}" ]; then
            IFS=',' read -ra CONFIGS <<< "${ADDITIONAL_CONFIGS}"
            for config in "${CONFIGS[@]}"; do
              config=$(echo "${config}" | xargs)  # trim whitespace
              if [[ "${config}" == ./* ]]; then
                CONFIG_ARGS="${CONFIG_ARGS} --config ${config}"
              else
                CONFIG_ARGS="${CONFIG_ARGS} --config ./${config}"
              fi
            done
          fi
          echo "CONFIG_ARGS=${CONFIG_ARGS}" >> $GITHUB_OUTPUT

      - name: Validate spicepod files exist
        run: |
          if [ ! -f "${{ steps.set_paths.outputs.PRIMARY_PATH }}" ]; then
            echo "Error: Primary spicepod file not found at ${{ steps.set_paths.outputs.PRIMARY_PATH }}"
            exit 1
          fi
          echo "Primary spicepod found at ${{ steps.set_paths.outputs.PRIMARY_PATH }}"

          # Validate additional configs
          ADDITIONAL_CONFIGS="${{ github.event.inputs.additional_configs }}"
          if [ -n "${ADDITIONAL_CONFIGS}" ]; then
            IFS=',' read -ra CONFIGS <<< "${ADDITIONAL_CONFIGS}"
            for config in "${CONFIGS[@]}"; do
              config=$(echo "${config}" | xargs)
              if [[ "${config}" != ./* ]]; then
                config="./${config}"
              fi
              if [ ! -f "${config}" ]; then
                echo "Error: Additional config not found at ${config}"
                exit 1
              fi
              echo "Additional config found at ${config}"
            done
          fi

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Run DynamoDB streaming dispatch
        run: |
          VERIFY_FLAG=""
          if [ "${{ github.event.inputs.verify }}" = "true" ]; then
            VERIFY_FLAG="--verify"
          fi

          testoperator run streaming-dynamodb-dispatch \
            -s /usr/local/bin/spiced \
            -p ${{ steps.set_paths.outputs.PRIMARY_PATH }} \
            ${{ steps.set_paths.outputs.CONFIG_ARGS }} \
            --queryset ${{ github.event.inputs.queryset }} \
            --scale-factor ${{ github.event.inputs.scale_factor }} \
            --ingestion-timeout ${{ github.event.inputs.ingestion_timeout }} \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            --mutation-ratio ${{ github.event.inputs.mutation_ratio }} \
            --workflow testoperator_run_streaming_dynamodb.yml \
            --wait-for-workflows \
            ${VERIFY_FLAG}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DynamoDB credentials
          DYNAMODB_AWS_REGION: ${{ secrets.DYNAMODB_AWS_REGION }}
          DYNAMODB_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DYNAMODB_ACCESS_KEY_ID }}
          DYNAMODB_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DYNAMODB_SECRET_ACCESS_KEY }}
          # Snapshot storage
          SNAPSHOT_S3_LOCATION: ${{ secrets.STREAMING_SNAPSHOT_S3_LOCATION }}
          SNAPSHOT_S3_ACCESS_KEY_ID: ${{ secrets.STREAMING_SNAPSHOT_S3_ACCESS_KEY_ID }}
          SNAPSHOT_S3_SECRET_ACCESS_KEY: ${{ secrets.STREAMING_SNAPSHOT_S3_SECRET_ACCESS_KEY }}
          SNAPSHOT_S3_REGION: ${{ secrets.STREAMING_SNAPSHOT_S3_REGION }}
          # Metrics
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
