name: testoperator run cold-start

# Time from launch to ready for a fresh spiced loading a Delta Lake table into each
# acceleration shape, against the previous release on the same runner. Run it with
# `spiced_commit` set to a release candidate, and `baseline_version` to the release
# before it, as part of release QA.

on:
  schedule:
    - cron: '30 10 * * *'
  pull_request:
    paths:
      - '.github/workflows/testoperator_run_cold_start.yml'
      - '.github/actions/seed-cold-start-fixture/**'
      - 'test/spicepods/cold_start/**'
      - 'test/scripts/cold_start_delta_fixture.py'
      - 'tools/testoperator/src/commands/cold_start/**'
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit to test (default: latest trunk build)'
        required: false
        type: string
      baseline_version:
        description: 'Release tag to compare against, e.g. v2.3.1 (default: latest release)'
        required: false
        type: string
      runs:
        description: 'Cold starts per binary'
        required: false
        type: string
        default: '3'
      max_ready_ratio:
        description: 'Fail when the median time to ready exceeds this multiple of the baseline'
        required: false
        type: string
        default: '2.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.spiced_commit }}
  cancel-in-progress: false

jobs:
  seed-fixture:
    name: Seed the Delta Lake fixture
    runs-on: spiceai-dev-runners
    timeout-minutes: 60
    # The only writer of the fixture: two concurrent first seeds would interleave
    # their Delta logs under one prefix.
    concurrency:
      group: cold-start-fixture-seed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Seed the fixture
        uses: ./.github/actions/seed-cold-start-fixture

  cold-start:
    name: Cold start ${{ matrix.spicepod }}
    needs: seed-fixture
    runs-on: spiceai-dev-runners
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - spicepod: delta_lake-cayenne[file]-append_unkeyed_sorted.yaml
            max_full_compactions: '0'
          - spicepod: delta_lake-cayenne[file]-append_unkeyed.yaml
            max_full_compactions: '0'
          - spicepod: delta_lake-cayenne[file]-append_keyed.yaml
          - spicepod: delta_lake-cayenne[file]-full.yaml
          - spicepod: delta_lake-duckdb[file]-append.yaml
          - spicepod: delta_lake-arrow-full.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Download the baseline release
        id: baseline
        run: |
          version="${{ github.event.inputs.baseline_version }}"
          if [ -z "$version" ]; then
            latest=$(curl -sSLI -o /dev/null -w '%{url_effective}' https://github.com/spiceai/spiceai/releases/latest)
            version="${latest##*/}"
          fi
          mkdir -p "${RUNNER_TEMP}/baseline"
          curl -sSfL -o "${RUNNER_TEMP}/baseline/spiced.tar.gz" \
            "https://github.com/spiceai/spiceai/releases/download/${version}/spiced_linux_x86_64.tar.gz"
          tar -xzf "${RUNNER_TEMP}/baseline/spiced.tar.gz" -C "${RUNNER_TEMP}/baseline"
          chmod +x "${RUNNER_TEMP}/baseline/spiced"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "path=${RUNNER_TEMP}/baseline/spiced" >> "$GITHUB_OUTPUT"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Run the cold-start test (candidate ${{ steps.setup-spiced.outputs.SPICED_COMMIT }} vs ${{ steps.baseline.outputs.version }})
        run: |
          testoperator run cold-start \
            -s /usr/local/bin/spiced \
            -p "test/spicepods/cold_start/${{ matrix.spicepod }}" \
            --baseline-spiced-path "${{ steps.baseline.outputs.path }}" \
            --runs "${{ github.event.inputs.runs || '3' }}" \
            --max-ready-ratio "${{ github.event.inputs.max_ready_ratio || '2.0' }}" \
            ${{ matrix.max_full_compactions != '' && format('--max-full-compactions {0}', matrix.max_full_compactions) || '' }} \
            --ready-wait 600 \
            --disable-progress-bars \
            --results-out "${RUNNER_TEMP}/cold-start-results.json" \
            --summary-out "$GITHUB_STEP_SUMMARY"
        env:
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cold-start-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cold-start-results.json
          if-no-files-found: ignore
