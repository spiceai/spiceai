name: testoperator run cold-start

# Time from launch to ready for a fresh spiced loading a Delta Lake table into each
# acceleration shape, against the previous release on the same runner. Run it with
# `spiced_commit` set to a release candidate, and `baseline_version` to the release
# before it, as part of release QA.

on:
  schedule:
    - cron: '30 10 * * *'
  pull_request:
    paths:
      - '.github/workflows/testoperator_run_cold_start.yml'
      - '.github/actions/seed-cold-start-fixture/**'
      - 'test/spicepods/cold_start/**'
      - 'test/scripts/cold_start_delta_fixture.py'
      - 'tools/testoperator/src/commands/cold_start/**'
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit to test (default: latest trunk build)'
        required: false
        type: string
      baseline_version:
        description: 'Release tag to compare against, e.g. v2.3.1 (default: latest release)'
        required: false
        type: string
      runs:
        description: 'Cold starts per binary'
        required: false
        type: string
        default: '3'
      max_ready_ratio:
        description: 'Fail when the median time to ready exceeds this multiple of the baseline'
        required: false
        type: string
        default: '2.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.spiced_commit }}
  cancel-in-progress: false

jobs:
  seed-fixture:
    environment: ci
    name: Seed the Delta Lake fixture
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    timeout-minutes: 60
    # Dependabot-triggered runs get no Actions secrets, so the MinIO setup
    # would fail on empty credentials. Skip those; a push by a maintainer to
    # the same branch runs the job with secrets.
    # Self-hosted pool: skip PRs from forks so an approved fork run does not
    # execute here. Non-PR events and same-repo PRs still run.
    if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    # The only writer of the fixture: two concurrent first seeds would interleave
    # their Delta logs under one prefix.
    concurrency:
      group: cold-start-fixture-seed-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '3600'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Seed the fixture
        uses: $/.github/actions/seed-cold-start-fixture

  cold-start:
    environment: ci
    name: Cold start ${{ matrix.spicepod }}
    needs: seed-fixture
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    timeout-minutes: 90
    # Self-hosted pool: skip PRs from forks so an approved fork run does not
    # execute here. Non-PR events and same-repo PRs still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - spicepod: delta_lake-cayenne[file]-append_unkeyed_sorted.yaml
            max_full_compactions: '0'
          - spicepod: delta_lake-cayenne[file]-append_unkeyed.yaml
            max_full_compactions: '0'
          - spicepod: delta_lake-cayenne[file]-append_keyed.yaml
          - spicepod: delta_lake-cayenne[file]-full.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: $/.github/actions/setup-rust

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '5400'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}
          # The build of the code under test: a pull request reads its base branch's, a release
          # branch's run its own (once a release branch is cut from trunk, this file is its), and
          # any other run trunk's.
          ref: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || startsWith(github.ref, 'refs/heads/release/') && github.ref || 'refs/heads/trunk' }}

      # The baseline is a recorded release (.github/release-digests.json): the input, or by
      # default the newest recorded one. setup-released-spiced verifies it before it runs.
      - name: Choose the baseline release
        id: baseline
        env:
          INPUT_BASELINE_VERSION: ${{ github.event.inputs.baseline_version }}
        run: |
          set -euo pipefail
          version="${INPUT_BASELINE_VERSION}"
          if [ -z "$version" ]; then
            version="$(python3 -c 'import json; tags = json.load(open(".github/release-digests.json"))["releases"]; print(max(tags, key=lambda t: tuple(int(p) for p in t[1:].split("."))))')"
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::baseline_version '$version' is not a release tag such as v2.3.1."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the baseline release
        id: baseline-spiced
        uses: $/.github/actions/setup-released-spiced
        with:
          release: ${{ steps.baseline.outputs.version }}
          spicepod_file: test/spicepods/cold_start/${{ matrix.spicepod }}
          github_token: ${{ github.token }}
          destination: ${{ runner.temp }}/baseline/spiced

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      # The fixture's location for this run, in the spicepod (.github/actions/ci-store-prefix).
      - name: Choose the CI store prefix
        uses: $/.github/actions/ci-store-prefix
        with:
          spicepod: test/spicepods/cold_start/${{ matrix.spicepod }}

      - name: Run the cold-start test (candidate ${{ steps.setup-spiced.outputs.SPICED_COMMIT }} vs ${{ steps.baseline.outputs.version }})
        run: |
          testoperator run cold-start \
            -s /usr/local/bin/spiced \
            -p "test/spicepods/cold_start/${{ matrix.spicepod }}" \
            --baseline-spiced-path "${BASELINE_PATH}" \
            --runs "${INPUT_RUNS}" \
            --max-ready-ratio "${INPUT_MAX_READY_RATIO}" \
            ${{ matrix.max_full_compactions != '' && format('--max-full-compactions {0}', matrix.max_full_compactions) || '' }} \
            --ready-wait 600 \
            --disable-progress-bars \
            --results-out "${RUNNER_TEMP}/cold-start-results.json" \
            --summary-out "$GITHUB_STEP_SUMMARY"
        env:
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          BASELINE_PATH: ${{ steps.baseline-spiced.outputs.path }}
          INPUT_RUNS: ${{ github.event.inputs.runs || '3' }}
          INPUT_MAX_READY_RATIO: ${{ github.event.inputs.max_ready_ratio || '2.0' }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cold-start-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cold-start-results.json
          if-no-files-found: ignore
