name: build_and_release

on:
  push:
    # Release branches build for the same reason trunk does: the `build` job uploads
    # each commit's spiced to MinIO, and that upload is the only source the daily
    # `testoperator dispatch` has for a branch's binary. Without it the dispatch
    # walks back ten commits, finds nothing, and the branch silently loses its
    # benchmark coverage. `setup-matrix` already recognizes release branches; only
    # the trigger was missing. Releasing stays tag-gated — the `publish` job runs
    # for `refs/tags/v*` alone.
    branches:
      - trunk
      - release/**
    tags:
      - v*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  workflow_dispatch:
    inputs:
      platform_option:
        description: 'Which option do you want to run on? (Default is ALL)'
        required: false
        type: choice
        options:
          - 'all'
          - 'Linux x64'
          - 'Linux aarch64'
          - 'macOS aarch64 (Apple Silicon)'
          - 'Windows x64'
          - 'macOS x64 (Intel)'
        default: 'all'
      tag_option:
        description: 'Which build tag to include? (Default is all available tags per platform)'
        required: false
        type: choice
        options:
          - 'all'
          - 'default'
          - 'odbc'
          - 'metal'
        default: 'all'
      profile_option:
        description: 'Which Rust build profile to use? (Default is release)'
        required: false
        type: choice
        options:
          - 'release'
          - 'release-lto'
        default: 'release'

env:
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  setup-matrix:
    name: Setup strategy matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            // Check if this is a tagged release (uses GitHub hosted runners, no minio)
            const isTaggedRelease = context.ref.startsWith('refs/tags/v');

            // Check if this is a release branch (uses spiceai runners with minio)
            const isReleaseBranch = context.ref.startsWith('refs/heads/release-') ||
                                    context.ref.startsWith('refs/heads/release/');

            // Check if this is a manual workflow dispatch
            const isManualDispatch = context.eventName === 'workflow_dispatch';

            // Include Windows and Linux ARM only for tagged releases, release branches, or manual dispatch (exclude trunk pushes)
            const includeWindowsAndLinuxArm = isTaggedRelease || isReleaseBranch || isManualDispatch;

            // Tagged releases use GitHub hosted runners, others use spiceai runners
            const macosRunner = isTaggedRelease ? "macos-15" : "spiceai-macos-large";
            const linuxRunner = isTaggedRelease ? "ubuntu-24.04" : "spiceai-dev-runners";

            // Use minio for spiceai runners (trunk, release branches, manual dispatch on non-tagged)
            const useMinio = !isTaggedRelease;

            const matrix = [
              {
                name: "Linux x64",
                runner: linuxRunner,
                target_os: "linux",
                target_arch: "x86_64",
                tags: ["default", "odbc"],
                use_minio: useMinio,
                is_tagged_release: isTaggedRelease,
              }, {
                name: "macOS aarch64 (Apple Silicon)",
                runner: macosRunner,
                target_os: "darwin",
                target_arch: "aarch64",
                tags: ["default", "metal"],
                use_minio: false,
                is_tagged_release: isTaggedRelease,
              }
            ];

            // Add Linux ARM and Windows only for tagged releases, release branches, or manual dispatch
            if (includeWindowsAndLinuxArm) {
              matrix.push({
                name: "Linux aarch64",
                runner: isTaggedRelease ? "hosted-linux-arm-runner" : "hosted-linux-arm-runner",
                target_os: "linux",
                target_arch: "aarch64",
                tags: ["default"],
                use_minio: false,
                is_tagged_release: isTaggedRelease,
              });
              matrix.push({
                name: "Windows x64",
                runner: "windows-latest",
                target_os: "windows",
                target_arch: "x86_64",
                tags: ["default"],
                use_minio: false,
                is_tagged_release: isTaggedRelease,
              });
            }

            // If running via workflow_dispatch, filter based on inputs
            if (isManualDispatch) {
              const platform_option = context.payload.inputs.platform_option;
              const tag_option = context.payload.inputs.tag_option;

              // Filter by platform
              let filtered = matrix;
              if (platform_option !== 'all') {
                filtered = filtered.filter(m => m.name === platform_option);
              }

              // Filter by tag
              if (tag_option !== 'all') {
                filtered = filtered.map(m => ({
                  ...m,
                  tags: m.tags.filter(t => t === tag_option)
                }));
                // Remove entries that have no matching tags
                filtered = filtered.filter(m => m.tags.length > 0);
              }

              return filtered;
            }

            return matrix;

  build:
    name: Build ${{ matrix.target.name }} binaries
    runs-on: ${{ matrix.target.runner }}
    needs: setup-matrix
    env:
      RUST_PROFILE: ${{ github.event.inputs.profile_option || 'release' }}
      # Minimal feature set to speed up builds on this branch: no optional connectors or models.
      SPICED_FEATURES: release
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_GIT_FETCH_WITH_CLI: true

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Install Visual Studio Build Tools
        if: matrix.target.target_os == 'windows'
        uses: ./.github/actions/install-vs-buildtools

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-cc

      # The aarch64 runner does not have any tools pre-installed
      - name: Install missing tools (Linux aarch64)
        if: matrix.target.target_os == 'linux' && matrix.target.target_arch == 'aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install build-essential libssl-dev pkg-config cmake unixodbc unixodbc-dev unzip -y

      # The x86_64 runner does not unixodbc pre-installed
      - name: Install missing tools (Linux x86_64)
        if: matrix.target.target_os == 'linux' && matrix.target.target_arch == 'x86_64'
        run: |
          sudo apt-get install unixodbc unixodbc-dev -y

      - name: Install missing tools (Mac)
        if: matrix.target.target_os == 'darwin'
        # `missing=()` is bash-specific; the default shell is a runner-image property.
        shell: bash
        run: |
          # Probe before reaching for brew. On the self-hosted pool the formulas are
          # already there, so every `brew` call is a no-op that still has to reach brew
          # first — and any brew-level breakage (an unreadable global lock, a half-written
          # `brew`) then fails the build over a toolchain it already had (#13463).
          # `setup-cc` probes the same way for every other macOS job; this step and its
          # twin in build_nightly.yml are the two that still call brew directly.
          brew_bin="$(command -v brew || true)"
          if [ -z "$brew_bin" ]; then
            echo "::error::'brew' is not on PATH, so cmake and unixodbc cannot be installed or verified on this runner."
            exit 1
          fi
          # The spiceai-macos flock wrapper is `/opt/spice/bin/brew`, so
          # dirname/dirname of `command -v brew` is `/opt/spice` and every
          # keg looks missing. Prefer the well-known prefixes; do not invoke
          # brew (that takes the lock this probe exists to avoid).
          if [ -x /opt/homebrew/bin/brew ]; then
            brew_prefix=/opt/homebrew
          elif [ -x /usr/local/bin/brew ]; then
            brew_prefix=/usr/local
          else
            brew_prefix="$(dirname "$(dirname "$brew_bin")")"
          fi
          missing=()
          # cmake is invoked by bare name from build scripts, so being in the Cellar is
          # not enough — the name has to resolve to *this* Homebrew. Matching the prefix
          # rather than a fixed path stays correct on an Intel runner, and catches an
          # unlinked keg or a foreign copy earlier on PATH; both route into `brew link`.
          case "$(command -v cmake 2>/dev/null || true)" in
            "$brew_prefix"/*) ;;
            *) missing+=("cmake") ;;
          esac
          # unixodbc is consumed through the library search path, never by name, so the
          # keg being present is the whole requirement.
          [ -d "$brew_prefix/opt/unixodbc" ] || missing+=("unixodbc")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Toolchain incomplete on this runner (${missing[*]}); installing."
            brew update
            brew install cmake unixodbc
            # `brew install` only warns — and still exits 0 — on a formula that is in the
            # Cellar but unlinked, so its binaries never reach PATH.
            brew link --overwrite cmake || true
          else
            echo "cmake and unixodbc already present under $brew_prefix; skipping brew."
          fi
          # Assert unconditionally, so a runner whose install was skipped still fails here
          # with a named cause rather than deep inside a build script. Only that the name
          # resolves — deliberately not that it resolves under $brew_prefix — so a runner
          # building today against a cmake from elsewhere on PATH keeps working.
          if ! command -v cmake >/dev/null 2>&1; then
            echo "::error::'cmake' is not on PATH after setup. Run 'brew link --overwrite cmake' on this runner."
            exit 1
          fi
          # Prefix resolved from the located brew rather than hardcoded, so an Intel runner
          # gets its own; unchanged on Apple Silicon. A derived value carries an injection
          # surface a literal does not — a two-line `$GITHUB_ENV` entry appends a second
          # variable to every later step — so refuse one, as `setup-cc` does for its own.
          rustflags="-L $brew_prefix/lib"
          if [ "$(printf '%s' "$rustflags" | wc -l | tr -d ' ')" != "0" ]; then
            echo "::error::Refusing to export a multi-line RUSTFLAGS built from '$brew_prefix'."
            exit 1
          fi
          echo "RUSTFLAGS=$rustflags" >> "$GITHUB_ENV"
          # The probe above accepts an unlinked unixodbc keg — `$brew_prefix/opt/unixodbc`
          # exists for a formula that was never linked — and in that state the `-L` above
          # points at a directory holding no `libodbc.dylib`, so the link dies downstream as
          # "ld: library 'odbc' not found" (#13475). Before this step probed, `brew install
          # unixodbc` ran every time and linked it, so the gap is this step's to close.
          # `setup-cc` covers the same case by publishing the keg's own lib directory, and
          # deliberately only that one: `$brew_prefix/lib` additionally satisfies -lcrypto,
          # -lssl and -lzstd, so a crate whose build script emits one of those names would
          # link a second, differently-built copy. clang expands LIBRARY_PATH into -L entries
          # after those already on the command line, so this restores the search path without
          # displacing anything a build script emitted, and it is not a cargo fingerprint
          # input, so it costs no rebuild.
          library_path="${LIBRARY_PATH:+$LIBRARY_PATH:}$brew_prefix/opt/unixodbc/lib"
          if [ "$(printf '%s' "$library_path" | wc -l | tr -d ' ')" != "0" ]; then
            echo "::error::Refusing to export a multi-line LIBRARY_PATH built from '$brew_prefix'."
            exit 1
          fi
          echo "LIBRARY_PATH=$library_path" >> "$GITHUB_ENV"

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      # Default flavor - build both spiced and spice CLI together (runtime not built on Windows - use WSL)
      - name: Build spiced and spice CLI
        if: contains(matrix.target.tags, 'default') && matrix.target.target_os != 'windows'
        working-directory: bin/spiced
        run: cargo build --profile ${{ env.RUST_PROFILE }} --features "$SPICED_FEATURES" -p spiced -p spice --target-dir ../../target

      - name: tar binary
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        run: |
          mv target/release/spiced spiced
          chmod +x spiced
          tar czf spiced_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz spiced

      - name: Print version
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        run: ./spiced --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        with:
          name: spiced_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: spiced_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz

      - name: Upload spiced to Minio
        if: matrix.target.use_minio && matrix.target.target_os == 'linux' && matrix.target.target_arch == 'x86_64' && contains(matrix.target.tags, 'default')
        uses: ./.github/actions/upload-to-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          source_path: spiced_linux_x86_64.tar.gz
          destination_path: spice-minio/artifacts/spiced/linux-x86_64/${{ github.sha }}/

      ## ODBC variant - for internal testing
      # Keep the CLI selected so shared dependency features match the default build.
      - name: Build spiced (odbc)
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'odbc')
        working-directory: bin/spiced
        run: cargo build --release --features "$SPICED_FEATURES,odbc" -p spiced -p spice --target-dir ../../target

      - name: tar binary (odbc)
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'odbc')
        run: |
          mv target/release/spiced spiced
          chmod +x spiced
          tar czf spiced_odbc_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz spiced

      - name: Print version (odbc)
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'odbc')
        run: ./spiced --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'odbc')
        with:
          name: spiced_odbc_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: spiced_odbc_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz

      - name: Upload spiced_odbc to Minio
        if: matrix.target.use_minio && matrix.target.target_os == 'linux' && matrix.target.target_arch == 'x86_64' && contains(matrix.target.tags, 'odbc')
        uses: ./.github/actions/upload-to-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          source_path: spiced_odbc_linux_x86_64.tar.gz
          destination_path: spice-minio/artifacts/spiced/linux-x86_64/${{ github.sha }}/

      ## Metal variant (macOS with Metal GPU acceleration, models included by default)
      - name: Build spiced (metal)
        if: matrix.target.target_os == 'darwin'
        working-directory: bin/spiced
        env:
          # Ahead-of-time Metal kernel compilation needs the Xcode Metal Toolchain, which
          # is a separately downloaded component the macOS runners do not carry; without
          # it mistralrs-metal-compile dies with "cannot execute tool 'metal'". Skipping
          # the precompile makes the kernels build at runtime instead. This is the repo's
          # default everywhere else — bin/spiced/Makefile sets it for any `metal` build,
          # and .github/actions/build-spiced sets it on both of its build steps — and this
          # step is the only `metal` build that bypasses both by calling cargo directly.
          MISTRALRS_METAL_PRECOMPILE: 0
        run: cargo build --release --features release,models,metal --target-dir ../../target

      - name: tar binary (metal)
        if: matrix.target.target_os == 'darwin'
        run: |
          mv target/release/spiced spiced
          chmod +x spiced
          tar czf spiced_metal_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz spiced

      - name: Print version (metal)
        if: matrix.target.target_os == 'darwin'
        run: ./spiced --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target.target_os == 'darwin'
        with:
          name: spiced_metal_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: spiced_metal_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz

      ## CLI - package the CLI binary that was built above
      - name: tar CLI binary
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        run: |
          mv target/release/spice spice
          chmod +x spice
          tar czf spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz spice

      ## Windows CLI - build and package (runtime not supported on Windows, CLI only)
      - name: Build spice CLI (Windows)
        if: matrix.target.target_os == 'windows' && contains(matrix.target.tags, 'default')
        run: cargo build --profile ${{ env.RUST_PROFILE }} -p spice --target-dir target

      - name: tar CLI binary (Windows)
        if: matrix.target.target_os == 'windows' && contains(matrix.target.tags, 'default')
        run: |
          mv target/release/spice.exe spice.exe
          tar czf spice.exe_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz spice.exe

      - name: Print CLI version
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        run: ./spice version

      - name: Print CLI version (Windows)
        if: matrix.target.target_os == 'windows' && contains(matrix.target.tags, 'default')
        run: ./spice.exe version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target.target_os != 'windows' && contains(matrix.target.tags, 'default')
        with:
          name: spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: spice_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.target.target_os == 'windows' && contains(matrix.target.tags, 'default')
        with:
          name: spice.exe_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: spice.exe_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}.tar.gz

      - name: Upload spice CLI to Minio
        if: matrix.target.use_minio && matrix.target.target_os == 'linux' && matrix.target.target_arch == 'x86_64' && contains(matrix.target.tags, 'default')
        uses: ./.github/actions/upload-to-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          source_path: spice_linux_x86_64.tar.gz
          destination_path: spice-minio/artifacts/spice/linux-x86_64/${{ github.sha }}/

  publish:
    name: Publish ${{ matrix.target_os }}-${{ matrix.target_arch }} binaries
    needs: build
    if: startswith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    env:
      ARTIFACT_DIR: ./release

    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: x86_64
          - target_os: linux
            target_arch: aarch64
          - target_os: darwin
            target_arch: aarch64
          - target_os: windows
            target_arch: x86_64

    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: download artifacts - spice_${{ matrix.target_os }}_${{ matrix.target_arch }}
        if: matrix.target_os != 'windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spice_${{ matrix.target_os }}_${{ matrix.target_arch }}
          path: ${{ env.ARTIFACT_DIR }}

      - name: download artifacts - spice_${{ matrix.target_os }}_${{ matrix.target_arch }}
        if: matrix.target_os == 'windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spice.exe_${{ matrix.target_os }}_${{ matrix.target_arch }}
          path: ${{ env.ARTIFACT_DIR }}

      - name: download artifacts - spiced_${{ matrix.target_os }}_${{ matrix.target_arch }}
        if: matrix.target_os != 'windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spiced_${{ matrix.target_os }}_${{ matrix.target_arch }}
          path: ${{ env.ARTIFACT_DIR }}

      # macOS metal variant
      - name: download artifacts - spiced_metal_${{ matrix.target_os }}_${{ matrix.target_arch }}
        if: matrix.target_os == 'darwin'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: spiced_metal_${{ matrix.target_os }}_${{ matrix.target_arch }}
          path: ${{ env.ARTIFACT_DIR }}

      - name: lists artifacts
        run: ls -l ${{ env.ARTIFACT_DIR }}

      - name: publish ${{ matrix.target_os }}/${{ matrix.target_arch }} binaries to github
        run: |
          # Parse repository to get owner and repo names
          OWNER_NAME="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # Get the list of files
          RELEASE_ARTIFACT=(${ARTIFACT_DIR}/*)
          # Delete existing release artifact
          python ./.github/scripts/github_release.py delete \
            --owner $OWNER_NAME --repo $REPO_NAME \
            --tag "v${{ env.REL_VERSION }}" \
            ${RELEASE_ARTIFACT[*]}
          # Pass the notes by path, not by value: a release body over 128 KiB
          # exceeds MAX_ARG_STRLEN and the exec fails with E2BIG (exit 126)
          # after every build has already succeeded.
          if [ "$LATEST_RELEASE" = "true" ]; then
            BODY_ARGS=(--body-file "./docs/release_notes/v${{ env.REL_VERSION }}.md")
          else
            BODY_ARGS=(--body "This is the release candidate ${{ env.REL_VERSION }}")
          fi
          echo "Uploading Spice.ai Binaries to GitHub Release"
          python ./.github/scripts/github_release.py upload \
            --owner $OWNER_NAME --repo $REPO_NAME \
            --tag "v${{ env.REL_VERSION }}" \
            --release-name "v${{ env.REL_VERSION }}" \
            "${BODY_ARGS[@]}" \
            --prerelease "$PRE_RELEASE" \
            ${RELEASE_ARTIFACT[*]}
