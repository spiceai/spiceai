---
name: Crash Report Check

# The Linux half of `crash_handler.rs` is the only half that runs in production, and
# no other workflow executes it. Run this after touching the handler: it takes real
# faults under each release profile and checks the reports are usable.
on:
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Which cargo profiles to verify'
        required: false
        default: '["release", "release-lto"]'
        type: choice
        options:
          - '["release", "release-lto"]'
          - '["release"]'
          - '["release-lto"]'

# Each leg builds spiced from scratch on a shared runner pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash_report:
    name: crash report (${{ matrix.profile }})
    runs-on: spiceai-dev-runners
    # `release-lto` links the whole graph with fat LTO; it is far slower than release.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profiles) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Install protoc
        uses: ./.github/actions/install-protoc

      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}

      - name: Environment
        run: |
          uname -a
          cat /proc/sys/kernel/randomize_va_space || true

      # Built as the profile ships, so symbolization below reflects a real report.
      - name: Build the test binary
        env:
          CARGO_INCREMENTAL: 0
          PROFILE: ${{ matrix.profile }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_MINIO_SECRET_KEY }}
        run: |
          set -euo pipefail
          TEST_BIN=$(cargo test -p spiced --lib --profile "$PROFILE" --no-run \
            --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact"
                       and (.target.kind | contains(["lib"]))
                       and .executable != null) | .executable')
          echo "TEST_BIN=$TEST_BIN" | tee -a "$GITHUB_ENV"
          test -x "$TEST_BIN"

      - name: Symbol tables present in the built binary
        run: |
          set -uo pipefail
          echo "size: $(stat -c %s "$TEST_BIN") bytes"
          readelf -S "$TEST_BIN" | grep -E 'symtab|debug_info|gnu\.build-id' || \
            echo "(no symtab, no DWARF, no build-id)"
          readelf -n "$TEST_BIN" | grep -i 'build id' || echo "(no build id)"

      # The binary directly, not through cargo: the tests carry the real assertions,
      # and a second `cargo test` only re-resolves the dependency graph to reach them.
      - name: Run the test
        run: |
          "$TEST_BIN" crash_handler --nocapture

      # Re-run the faulting child directly so the report itself lands in the log.
      # The child is meant to die, so drop the shell's inherited `-e`.
      - name: Show a real crash report
        run: |
          set +e
          SPICED_CRASH_HANDLER_TEST_CHILD=1 "$TEST_BIN" \
            --exact crash_handler::tests::reports_a_fatal_signal --nocapture \
            > /dev/null 2> report.txt
          STATUS=$?
          set -e
          echo "child exit: $STATUS"
          test "$STATUS" -gt 128
          echo "───────── report ─────────"
          cat report.txt
          echo "──────────────────────────"

      # A raised signal carries no fault address, but does say who sent it.
      - name: Show a raised-abort report
        run: |
          set +e
          SPICED_CRASH_HANDLER_TEST_CHILD=abort "$TEST_BIN" \
            --exact crash_handler::tests::reports_a_fatal_signal --nocapture \
            > /dev/null 2> abort.txt
          STATUS=$?
          set -e
          echo "child exit: $STATUS (134 = SIGABRT)"
          test "$STATUS" -eq 134
          echo "───────── report ─────────"
          cat abort.txt
          echo "──────────────────────────"

      # `profile=` must be the profile this leg built, not cargo's `PROFILE`, which
      # reports "release" for both.
      - name: Check the report identifies its artifact
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          grep -q '=== native crash ===' report.txt
          grep -q "profile=$PROFILE" report.txt \
            || { echo "report does not name the profile it was built with"; exit 1; }
          grep -qE 'features=[a-z,]+' report.txt \
            || { echo "report does not name the features it was built with"; exit 1; }
          grep -qE 'spiced=v[0-9]' report.txt \
            || { echo "report carries no version"; exit 1; }

      # A jump through a corrupted pointer leaves `ip` outside this binary.
      - name: Show a wild-jump report
        run: |
          set +e
          SPICED_CRASH_HANDLER_TEST_CHILD=wild_call "$TEST_BIN" \
            --exact crash_handler::tests::reports_a_fatal_signal --nocapture \
            > /dev/null 2> wild.txt
          STATUS=$?
          set -e
          echo "child exit: $STATUS"
          test "$STATUS" -gt 128
          echo "───────── report ─────────"
          cat wild.txt
          echo "──────────────────────────"
          # With the ip useless, the caller must come off the stack and resolve.
          CALLER=$(grep -oE 'symbolize caller: .* 0x[0-9a-f]+' wild.txt \
            | grep -oE '0x[0-9a-f]+$')
          test -n "$CALLER" || { echo "no caller recovered"; exit 1; }
          echo "caller offset: $CALLER"
          addr2line -e "$TEST_BIN" -fCi "$CALLER" | tee wild_sym.txt
          grep -q 'spiced_crash_handler_test_wild_call' wild_sym.txt \
            || { echo "recovered caller did not resolve to the calling function"; exit 1; }

      # Function names resolve from `.symtab`, which both release profiles keep; line
      # numbers need debug info these artifacts do not ship.
      - name: Symbolize the offset
        run: |
          set -euo pipefail
          OFFSET=$(grep -oE 'offset=0x[0-9a-f]+' report.txt | head -1 | cut -d= -f2)
          echo "offset: $OFFSET"
          test "$OFFSET" != "0x0"
          addr2line -e "$TEST_BIN" -fCi "$OFFSET" | tee sym.txt
          grep -q 'spiced_crash_handler_test_fault' sym.txt \
            || { echo "offset did not resolve to the faulting symbol"; exit 1; }

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-report-${{ matrix.profile }}
          path: |
            report.txt
            abort.txt
            wild.txt
            wild_sym.txt
            sym.txt
          if-no-files-found: warn
