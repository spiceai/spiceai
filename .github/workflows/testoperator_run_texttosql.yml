name: testoperator text-to-sql tests

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      model_name:
        description: 'The model name to call in text-to-sql operations. Must be defined in the `spicepod_path` file.'
        required: true
        type: string
      queryset_file:
        description: 'The queryset file to use for the text-to-sql benchmark'
        required: false
        type: string
      queryset:
        description: 'The queryset to use for the text-to-sql benchmark'
        required: false
        type: string
      benchmark_queryset:
        description: 'Predefined (possibly external) queryset to setup and use'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'bird-bench-small[california_schools]'
          - 'bird-bench-small[card_games]'
          - 'bird-bench-small[codebase_community]'
          - 'bird-bench-small[debit_card_specializing]'
          - 'bird-bench-small[european_football_2]'
          - 'bird-bench-small[financial]'
          - 'bird-bench-small[formula_1]'
          - 'bird-bench-small[superhero]'
          - 'bird-bench-small[thrombosis_prediction]'
          - 'bird-bench-small[toxicology]'
      use_evidence:
        description: 'Include evidence in the question for bird-bench querysets'
        required: false
        type: boolean
        default: false
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      limit:
        description: 'Limit the number of text-to-SQL operations to run'
        required: false
        type: number
      configuration_name:
        description: 'Unique name for the configured testoperator run. Used to identify/group runs in telemetry.'
        required: false
        type: string

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-bench:
    name: Run Text-to-SQL tests
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 600
    # Holds the OpenAI and Anthropic workload identity federation IDs (`OPENAI_*` and
    # `ANTHROPIC_*` secrets).
    environment: ci
    permissions:
      contents: read
      actions: read
      # Exchanged for OpenAI and Anthropic access tokens: workload identity federation.
      id-token: write
    env:
      # Workload identity federation: spiced and the tests exchange this job's GitHub OIDC token
      # for provider access tokens with these IDs, and exchange again before each expires.
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate spicepod file exists
        env:
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
        run: |
          if [ ! -f "${INPUT_SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${INPUT_SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${INPUT_SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: $/.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepod
        env:
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
        run: |
          spicepod-validator "${INPUT_SPICEPOD_PATH}"

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        env:
          SETUP_SPICED_SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
        run: echo "SPICED_COMMIT=${SETUP_SPICED_SPICED_COMMIT}"

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate queryset inputs
        env:
          INPUT_QUERYSET: ${{ github.event.inputs.queryset }}
          INPUT_QUERYSET_FILE: ${{ github.event.inputs.queryset_file }}
          INPUT_BENCHMARK_QUERYSET: ${{ github.event.inputs.benchmark_queryset }}
        run: |
          if ([ -n "${INPUT_QUERYSET}" ] && [ -n "${INPUT_QUERYSET_FILE}" ]) || \
              ([ -n "${INPUT_QUERYSET}" ] && [ -n "${INPUT_BENCHMARK_QUERYSET}" ]) || \
              ([ -n "${INPUT_QUERYSET_FILE}" ] && [ -n "${INPUT_BENCHMARK_QUERYSET}" ]); then
              echo "Error: Only one of 'queryset', 'queryset_file' or 'benchmark_queryset' can be provided"
              exit 1
            fi

          if [ -z "${INPUT_QUERYSET}" ] && [ -z "${INPUT_QUERYSET_FILE}" ] && [ -z "${INPUT_BENCHMARK_QUERYSET}" ]; then
            echo "Error: Either 'queryset', 'queryset_file' or 'benchmark_queryset' must be provided"
            exit 1
          fi

      - name: Extract spicepod filename path
        id: extract_spicepod_filename
        env:
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
        run: |
          SPICEPOD_PATH="${INPUT_SPICEPOD_PATH}"
          SPICEPOD_FILENAME=$(basename "$SPICEPOD_PATH")
          echo "SPICEPOD_FILENAME=${SPICEPOD_FILENAME}" >> $GITHUB_OUTPUT

      - name: Prepare Bird-Bench Data
        id: bird_bench_setup
        uses: $/.github/actions/setup-bird-bench
        if: ${{ github.event.inputs.benchmark_queryset != '' }}
        with:
          data_directory: /opt/spiced/data/
          queryset_name: ${{ github.event.inputs.benchmark_queryset }}
          use_evidence: ${{ github.event.inputs.use_evidence }}

      - name: Run the benchmark test - ${{ steps.extract_spicepod_filename.outputs.SPICEPOD_FILENAME }}
        run: |
          rm -rf .spice/data
          QUERYSET_ARG=""
          SPICEPOD_DEPENDENCY=""
          if [ -n "${INPUT_QUERYSET_FILE}" ]; then
            QUERYSET_ARG="--queryset-file ${INPUT_QUERYSET_FILE}"
          elif [ -n "${INPUT_QUERYSET}" ]; then
            QUERYSET_ARG="--queryset ${INPUT_QUERYSET}"
          elif [ -n "${INPUT_BENCHMARK_QUERYSET}" ]; then
            QUERYSET_ARG='--queryset-file /opt/spiced/data/queryset.json'
            SPICEPOD_DEPENDENCY="--spicepod-dependencies ${BIRD_BENCH_SETUP_SPICEPOD_DEPENDENCY}"
          else
            echo "Error: No valid queryset input provided"
            exit 1
          fi

          LIMIT_ARG=""
          if [ -n "${INPUT_LIMIT}" ]; then
            LIMIT_ARG="-n ${INPUT_LIMIT}"
          fi

          CONFIG_NAME_ARG=""
          if [ -n "${INPUT_CONFIGURATION_NAME}" ]; then
            CONFIG_NAME_ARG="--configuration-name ${INPUT_CONFIGURATION_NAME}"
          fi

          printf '%s\n' \
            "testoperator run text-to-sql" \
            "  --ready-wait 1800" \
            "  $QUERYSET_ARG" \
            "  $SPICEPOD_DEPENDENCY" \
            "  $LIMIT_ARG" \
            "  $CONFIG_NAME_ARG" \
            "  -d /opt/spiced/data" \
            "  --model ${INPUT_MODEL_NAME}" \
            "  -p ${INPUT_SPICEPOD_PATH}"

          testoperator run text-to-sql \
            --ready-wait 1800 \
            $QUERYSET_ARG \
            $SPICEPOD_DEPENDENCY \
            $LIMIT_ARG \
            $CONFIG_NAME_ARG \
            -d /opt/spiced/data \
            --model "${INPUT_MODEL_NAME}" \
            -p "${INPUT_SPICEPOD_PATH}"
        env:
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          MINIO_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          MINIO_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          MINIO_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          MINIO_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          SPICE_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
          INPUT_QUERYSET_FILE: ${{ github.event.inputs.queryset_file }}
          INPUT_QUERYSET: ${{ github.event.inputs.queryset }}
          INPUT_BENCHMARK_QUERYSET: ${{ github.event.inputs.benchmark_queryset }}
          BIRD_BENCH_SETUP_SPICEPOD_DEPENDENCY: ${{ steps.bird_bench_setup.outputs.spicepod_dependency }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_CONFIGURATION_NAME: ${{ github.event.inputs.configuration_name }}
          INPUT_MODEL_NAME: ${{ github.event.inputs.model_name }}
          INPUT_SPICEPOD_PATH: ${{ github.event.inputs.spicepod_path }}
