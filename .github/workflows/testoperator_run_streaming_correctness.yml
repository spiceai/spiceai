name: testoperator streaming dynamodb correctness
run-name: streaming-correctness - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'Spicepod file path (relative to repo root)'
        required: true
        type: string
      queryset:
        description: 'Query set type'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
      scale_factor:
        description: 'Scale factor for data generation'
        required: true
        default: '0.01'
        type: string
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start and markers to be ingested'
        required: true
        default: '60'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      rounds:
        description: 'Number of correctness rounds'
        required: false
        type: string
        default: '3'
      mutation_ratio:
        description: 'Ratio of rows to mutate (0.0-1.0)'
        required: false
        type: string
        default: '0.3'
      mutation_seed:
        description: 'Base mutation seed'
        required: false
        type: string
        default: '42'

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-streaming-correctness:
    # Assumes a CI AWS role, so it runs from testoperator_run_streaming_correctness_aws.yml; see that file.
    permissions:
      id-token: write
      contents: read
    uses: spiceai/spiceai/.github/workflows/testoperator_run_streaming_correctness_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_AWS_STREAMING_BENCH_ROLE_ARN: ${{ secrets.CI_AWS_STREAMING_BENCH_ROLE_ARN }}
      SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
    with:
      mutation_ratio: ${{ github.event.inputs.mutation_ratio }}
      mutation_seed: ${{ github.event.inputs.mutation_seed }}
      queryset: ${{ github.event.inputs.queryset }}
      ready_wait: ${{ github.event.inputs.ready_wait }}
      rounds: ${{ github.event.inputs.rounds }}
      runner_type: ${{ github.event.inputs.runner_type }}
      scale_factor: ${{ github.event.inputs.scale_factor }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
