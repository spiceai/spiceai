name: spiced_docker

# Builds the release Docker images from the binaries of a published GitHub
# release and pushes them. publish_release calls it after the release is
# published; it has no trigger of its own. The build jobs hold no credentials.
# The push jobs run in `github-publish-autoapprove` and first check that a
# reviewer approved the calling run's `github-publish` deployment.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release to build from (for example v2.4.2)
        required: true
        type: string
      tag_latest:
        description: Also move the 'latest' and 'latest-cuda' tags
        required: true
        type: boolean
      spiced_sha256_amd64:
        description: sha256 of the release's spiced_linux_x86_64.tar.gz
        required: true
        type: string
      spiced_sha256_arm64:
        description: sha256 of the release's spiced_linux_aarch64.tar.gz
        required: true
        type: string
      spiced_sha256_cuda:
        description: sha256 of the release's spiced_cuda_80_linux_x86_64.tar.gz
        required: true
        type: string

permissions:
  contents: read

jobs:
  setup:
    environment: secret-free
    runs-on: ubuntu-24.04
    outputs:
      rel_version: ${{ steps.resolve.outputs.rel_version }}
    steps:
      - name: Resolve release metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SHA256_AMD64: ${{ inputs.spiced_sha256_amd64 }}
          SHA256_ARM64: ${{ inputs.spiced_sha256_arm64 }}
          SHA256_CUDA: ${{ inputs.spiced_sha256_cuda }}
        run: |
          set -euo pipefail
          # The Dockerfiles skip the check when SPICED_SHA256 is empty.
          for sha in "$SHA256_AMD64" "$SHA256_ARM64" "$SHA256_CUDA"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::'${sha}' is not a sha256, so the downloaded binaries could not be checked."
              exit 1
            fi
          done
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::release_tag '${RELEASE_TAG}' is not a release tag (vX.Y.Z)."
            exit 1
          fi
          # The Dockerfiles download the binaries from the release, which only
          # works once it is published. A draft is not visible to this token.
          is_draft=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft -q .isDraft)
          if [ "$is_draft" != "false" ]; then
            echo "::error::Release ${RELEASE_TAG} is not published, so its binaries cannot be downloaded."
            exit 1
          fi
          echo "rel_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  # The build jobs package a released binary (no compile) on GitHub-hosted
  # runners, pull base images anonymously, and use no build cache.
  build-amd64:
    environment: secret-free
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Package AMD64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile-release
          platforms: linux/amd64
          outputs: type=docker,name=localhost:5000/spiceai:default-amd64,dest=/tmp/image-amd64-default.tar
          build-args: |
            REL_VERSION=${{ needs.setup.outputs.rel_version }}
            SPICED_SHA256=${{ inputs.spiced_sha256_amd64 }}
            BINARY_VARIANT=default
            CARGO_FEATURES=release,models
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Validate AMD64 image
        run: |
          docker load -i /tmp/image-amd64-default.tar
          docker run --rm localhost:5000/spiceai:default-amd64 --version

      - name: Upload AMD64 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: images-amd64
          path: /tmp/image-amd64-default.tar

  build-arm64:
    environment: secret-free
    needs: setup
    runs-on: hosted-linux-arm-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install docker
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release
          sudo mkdir -m 0755 -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(lsb_release -i | awk '{ print tolower($3) }') $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Start Docker service
        run: |
          sudo systemctl start docker
          sudo systemctl status docker

      - name: chown /var/run/docker.sock to current user
        run: |
          sudo chown "$USER" /var/run/docker.sock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Package ARM64 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile-release
          platforms: linux/arm64
          outputs: type=docker,name=localhost:5000/spiceai:default-arm64,dest=/tmp/image-arm64-default.tar
          build-args: |
            REL_VERSION=${{ needs.setup.outputs.rel_version }}
            SPICED_SHA256=${{ inputs.spiced_sha256_arm64 }}
            BINARY_VARIANT=default
            CARGO_FEATURES=release,models
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
            GITHUB_REPOSITORY=${{ github.repository }}

      - name: Validate ARM64 image
        run: |
          docker load -i /tmp/image-arm64-default.tar
          docker run --rm localhost:5000/spiceai:default-arm64 --version

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: images-arm64
          path: /tmp/image-arm64-default.tar

  build-cuda:
    environment: secret-free
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Package CUDA image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile-cuda-release
          platforms: linux/amd64
          outputs: type=docker,name=localhost:5000/spiceai:cuda-amd64,dest=/tmp/images-amd64-cuda.tar
          build-args: |
            REL_VERSION=${{ needs.setup.outputs.rel_version }}
            SPICED_SHA256=${{ inputs.spiced_sha256_cuda }}
            CARGO_FEATURES=release,models,cuda
            CUDA_COMPUTE_CAP=80
            GITHUB_REPOSITORY=${{ github.repository }}
            APT_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate CUDA image
        run: |
          docker load -i /tmp/images-amd64-cuda.tar
          docker run --rm localhost:5000/spiceai:cuda-amd64 --version

      - name: Upload CUDA artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: images-amd64-cuda
          path: /tmp/images-amd64-cuda.tar

  # Pushes the multi-arch image under the version tag, and under 'latest' when
  # asked. A version tag that already points to another image fails the job.
  publish:
    needs: [setup, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    environment: github-publish-autoapprove
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    env:
      REL_VERSION: ${{ needs.setup.outputs.rel_version }}
      TAG_LATEST: ${{ inputs.tag_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/require-release-approval

      - name: Download images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: images-*64
          path: /tmp
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start local registry
        run: docker run -d -p 5000:5000 --restart=always --name registry registry:2

      - name: Login to GitHub Package Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '3600'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push images
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load -i "/tmp/image-${arch}-default.tar"
            docker push "localhost:5000/spiceai:default-${arch}"
          done
          docker buildx imagetools create -t localhost:5000/spiceai:release \
            localhost:5000/spiceai:default-amd64 localhost:5000/spiceai:default-arm64

          for repo in ghcr.io/spiceai/spiceai spiceai/spiceai; do
            ./.github/scripts/push_release_image.sh version localhost:5000/spiceai:release "${repo}:${REL_VERSION}"
            if [ "${TAG_LATEST}" = "true" ]; then
              ./.github/scripts/push_release_image.sh latest localhost:5000/spiceai:release "${repo}:latest"
            fi
          done

  publish-cuda:
    needs: [setup, build-cuda]
    runs-on: ubuntu-24.04
    environment: github-publish-autoapprove
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: read
    env:
      REL_VERSION: ${{ needs.setup.outputs.rel_version }}
      TAG_LATEST: ${{ inputs.tag_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/require-release-approval

      - name: Download CUDA image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: images-amd64-cuda
          path: /tmp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Start local registry
        run: docker run -d -p 5000:5000 --restart=always --name registry registry:2

      - name: Login to GitHub Package Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Login to DockerHub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '3600'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Push CUDA image
        run: |
          set -euo pipefail
          docker load -i /tmp/images-amd64-cuda.tar
          docker push localhost:5000/spiceai:cuda-amd64

          for repo in ghcr.io/spiceai/spiceai spiceai/spiceai; do
            ./.github/scripts/push_release_image.sh version localhost:5000/spiceai:cuda-amd64 "${repo}:${REL_VERSION}-cuda"
            if [ "${TAG_LATEST}" = "true" ]; then
              ./.github/scripts/push_release_image.sh latest localhost:5000/spiceai:cuda-amd64 "${repo}:latest-cuda"
            fi
          done
