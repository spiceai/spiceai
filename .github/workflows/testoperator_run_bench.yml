name: benchmark e2e tests
run-name: bench - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }}${{ contains(github.event.inputs.spicepod_path, 'postgres') && format(' - PostgreSQL {0}', github.event.inputs.postgres_version || '16') || '' }}${{ github.event.inputs.layout != '' && format(' - layout {0}', github.event.inputs.layout) || '' }}${{ github.event.inputs.spiced_ref != '' && format(' - spiced {0}', github.event.inputs.spiced_ref) || '' }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      # Benchmarks another release's spiced with this ref's testoperator and spec files. A release
      # tag installs the spiced_linux_x86_64.tar.gz that release published; a branch or other ref
      # uses the newest commit within ten of it that has a MinIO build. No result or explain-plan
      # snapshot is compared or written back, since those record this ref's answers and plans.
      spiced_ref:
        description: 'Branch or tag whose spiced to benchmark, e.g. v2.1.0 or release/2.4; empty = trunk. A release tag uses that release''s published binary. Ignored when spiced_commit is set'
        required: false
        type: string
        default: ''
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
          - 'chbench'
          - 'scenario'
      scenario_query_file:
        description: 'Path to scenario query file (required when query_set is scenario)'
        required: false
        type: string
        default: ''
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'sqlite'
          - 'postgresql'
          - 'mysql'
          - 'odbc-athena'
          - 'oracle'
          - 'duckdb'
          - 'duckdb-zero-results'
          - 'snowflake'
          - 'snowflake-catalog'
          - 'spark'
          - 'iceberg-sf1'
          - 'spicecloud-catalog'
          - 'glue-catalog'
          - 'databricks-catalog'
          - 'spicecloud'
          - 'iceberg-hadoop'
          - 'dynamodb'
          - 'arrow'
          - 'cayenne'
          - 'postgres-catalog'
          - 'mysql-catalog'
          - 'mssql-catalog'
          - 'oracle-catalog'
          - 'ducklake-catalog'
          - 'bigquery'
          - 'scylladb'
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start'
        required: true
        default: '30'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
          - 'spiceai-dev-xlarge-runners'
      scale_factor:
        description: 'Scale factor for the benchmark'
        required: false
        type: string
        default: '1'
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'
          - 'always'
          - 'no'
      validate_results:
        description: 'Validate the results?'
        required: false
        type: boolean
        default: false
      # Defaults on because a benchmark should time the engine, not the cache. Turn
      # it off only for a spicepod that is benchmarking the cache itself, such as
      # those under test/spicepods/tpch/sf5/cache.
      disable_caching:
        description: 'Bypass the SQL results cache so the timings measure query execution?'
        required: false
        type: boolean
        default: true
      postgres_version:
        description: 'PostgreSQL release line of the local source: postgres_tpch (TPC-H/TPC-DS SF1/SF10) or the CH-benCH source; one of its versions in test/source_versions.json'
        required: false
        type: string
        default: '16'
      layout:
        description: 'Acceleration layout to configure on every accelerated dataset (testoperator --layout): features from primary_key, indexes, sort, cluster, time_column, partition, joined by commas; empty = the spicepod as written'
        required: false
        type: string
        default: ''

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-bench:
    # Assumes a CI AWS role, so it runs from testoperator_run_bench_aws.yml; see that file.
    permissions:
      actions: write  # approves the held runs of its snapshot PR
      contents: write  # pushes a snapshot branch
      pull-requests: write  # and opens or auto-merges its PR
      id-token: write  # RustFS credentials, Databricks access tokens, and Google Cloud access tokens for the BigQuery tests
    uses: spiceai/spiceai/.github/workflows/testoperator_run_bench_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      BIGQUERY_SERVICE_ACCOUNT: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}
      BIGQUERY_WIF_PROVIDER: ${{ secrets.BIGQUERY_WIF_PROVIDER }}
      CI_AWS_DYNAMODB_ROLE_ARN: ${{ secrets.CI_AWS_DYNAMODB_ROLE_ARN }}
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_AWS_S3_ATHENA_ROLE_ARN: ${{ secrets.CI_AWS_S3_ATHENA_ROLE_ARN }}
      CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN: ${{ secrets.CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN }}
      ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
      ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
      ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
      ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
      SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
      SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY }}
      SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY }}
      SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
      SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
      TEST_MONGODB_PASSWORD: ${{ secrets.TEST_MONGODB_PASSWORD }}
      TEST_MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
      TEST_MYSQL_USERNAME: ${{ secrets.TEST_MYSQL_USERNAME }}
      TEST_POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
    with:
      disable_caching: ${{ github.event.inputs.disable_caching }}
      layout: ${{ github.event.inputs.layout }}
      postgres_version: ${{ github.event.inputs.postgres_version }}
      profile_option: ${{ github.event.inputs.profile_option }}
      query_overrides: ${{ github.event.inputs.query_overrides }}
      query_set: ${{ github.event.inputs.query_set }}
      ready_wait: ${{ github.event.inputs.ready_wait }}
      runner_type: ${{ github.event.inputs.runner_type }}
      scale_factor: ${{ github.event.inputs.scale_factor }}
      scenario_query_file: ${{ github.event.inputs.scenario_query_file }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spiced_ref: ${{ github.event.inputs.spiced_ref }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
      update_snapshots: ${{ github.event.inputs.update_snapshots }}
      validate_results: ${{ github.event.inputs.validate_results }}
