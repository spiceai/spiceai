name: benchmark e2e tests
run-name: bench - ${{ github.event.inputs.query_set }} - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      query_set:
        description: 'Query set'
        required: true
        default: 'tpch'
        type: choice
        options:
          - 'tpch'
          - 'tpch[parameterized]'
          - 'tpcds'
          - 'clickbench'
          - 'chbench'
          - 'scenario'
      scenario_query_file:
        description: 'Path to scenario query file (required when query_set is scenario)'
        required: false
        type: string
        default: ''
      query_overrides:
        description: 'Query overrides'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'sqlite'
          - 'postgresql'
          - 'mysql'
          - 'dremio'
          - 'odbc-athena'
          - 'odbc-databricks'
          - 'oracle'
          - 'duckdb'
          - 'duckdb-zero-results'
          - 'snowflake'
          - 'snowflake-catalog'
          - 'spark'
          - 'iceberg-sf1'
          - 'spicecloud-catalog'
          - 'glue-catalog'
          - 'databricks-catalog'
          - 'spicecloud'
          - 'iceberg-hadoop'
          - 'dynamodb'
          - 'arrow'
          - 'cayenne'
          - 'postgres-catalog'
          - 'mysql-catalog'
          - 'mssql-catalog'
          - 'oracle-catalog'
          - 'ducklake-catalog'
          - 'turso'
          - 'bigquery'
          - 'scylladb'
      ready_wait:
        description: 'How long (in seconds) to wait for spiced to start'
        required: true
        default: '30'
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
          - 'spiceai-dev-xlarge-runners'
      scale_factor:
        description: 'Scale factor for the benchmark'
        required: false
        type: string
        default: '1'
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'default'
        type: choice
        options:
          - 'default'
          - 'always'
          - 'no'
      validate_results:
        description: 'Validate the results?'
        required: false
        type: boolean
        default: false
      # Defaults on because a benchmark should time the engine, not the cache. Turn
      # it off only for a spicepod that is benchmarking the cache itself, such as
      # those under test/spicepods/tpch/sf5/cache.
      disable_caching:
        description: 'Bypass the SQL results cache so the timings measure query execution?'
        required: false
        type: boolean
        default: false

jobs:
  run-bench:
    name: Run benchmark e2e tests
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 600
    services:
      mssql_tpch:
        image: ${{ contains(github.event.inputs.spicepod_path, 'mssql') && 'ghcr.io/spiceai/spice-mssql-bench:latest' || '' }}
        ports:
          - 1433:1433
        env:
          MSSQL_SA_PASSWORD: S3cretP@ssw0rd
          DB_NAME: tpch_sf1
      # Local, ephemeral PostgreSQL for TPC-H/TPC-DS SF1/SF10 (used by both the
      # postgres data connector and postgres catalog connector benches); avoids
      # depending on an externally-provisioned benchmarking-postgres host for
      # these cheap-to-generate scale factors (see #11730). Larger scale
      # factors (SF100+) target benchmarking-postgres directly instead. Either
      # way the target starts empty and is seeded by the "Seed postgres..."
      # step below (a plain postgres image with no pre-baked data, unlike the
      # earlier iteration of this fix). Also serves clickbench's
      # s3[parquet]-postgres run, whose postgres is purely an acceleration
      # target (source data comes from s3) and so needs only the empty
      # *_accelerated database the "Create postgres acceleration databases"
      # step provides. Excludes ducklake[postgres+s3], which provisions its own
      # local postgres catalog DB on the same port, and clickbench's
      # postgres-source configs, which read the pre-loaded hits data on the
      # hosted cluster (too large to seed inline).
      postgres_tpch:
        image: ${{ (contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') && (((startsWith(github.event.inputs.query_set, 'tpch') || github.event.inputs.query_set == 'tpcds') && (github.event.inputs.scale_factor == '1' || github.event.inputs.scale_factor == '10')) || (github.event.inputs.query_set == 'clickbench' && contains(github.event.inputs.spicepod_path, 's3[parquet]-postgres')))) && 'postgres:16' || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        # --shm-size: postgres's default 64MB /dev/shm (Docker's own default)
        # is too small for parallel-worker queries against TPC-H/TPC-DS data;
        # several queries fail with "could not resize shared memory segment"
        # otherwise.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust

      - name: Determine snapshot update mode
        id: determine_update_snapshots
        run: |
          update_mode="${{ github.event.inputs.update_snapshots }}"
          if [ "${update_mode}" = "default" ] || [ -z "${update_mode}" ]; then
            branch_name="${{ github.ref_name }}"
            if [[ "${branch_name}" == "release/"* ]]; then
              update_mode="no"
            else
              update_mode="always"
            fi
          fi

          echo "Using update_snapshots=${update_mode}" >&2
          echo "update_snapshots=${update_mode}" >> "${GITHUB_OUTPUT}"

      - name: Set spicepod path
        id: set_spicepod_path
        run: |
          query_set="${{ github.event.inputs.query_set }}"
          query_set="${query_set%%\[*\]*}"

          if [ "${query_set}" = "chbench" ]; then
            SPICEPOD_PATH="./test/spicepods/${query_set}/${{ github.event.inputs.spicepod_path }}"
          else
            SPICEPOD_PATH="./test/spicepods/${query_set}/sf${{ github.event.inputs.scale_factor }}/${{ github.event.inputs.spicepod_path }}"
          fi

          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}" ]; then
            echo "Error: Spicepod file not found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}
          with_odbc: ${{ contains(github.event.inputs.spicepod_path, 'odbc') }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup Testoperator
        uses: ./.github/actions/setup-testoperator-data
        with:
          query_set: ${{ github.event.inputs.query_set }}

      - name: Setup MySQL
        run: |
          if [[ ${{ github.event.inputs.query_set }} == "tpcds" ]]; then
            echo "MYSQL_DB=tpcds_sf1" >> $GITHUB_ENV
          elif [[ ${{ github.event.inputs.query_set }} == "tpch" ]]; then
            echo "MYSQL_DB=tpch_sf1" >> $GITHUB_ENV
            echo "MYSQL_DB_SF100=tpch_sf100" >> $GITHUB_ENV
          fi

      # One seeding path for every scale factor, just pointed at a different
      # (always-empty-until-seeded) target: the local postgres_tpch container
      # for SF1/SF10, or benchmarking-postgres directly for SF100+ — avoiding
      # the separate, ts-dev-runner-backed `Load - Benchmark Data` workflow in
      # spicehq/ai-platform. Checks for existing data first, so the local
      # container (always empty on a fresh run) always seeds, while a
      # benchmarking-postgres scale factor that's already loaded skips
      # straight through.
      - name: Seed postgres TPC-H/TPC-DS data if missing
        if: ${{ contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') && (startsWith(github.event.inputs.query_set, 'tpch') || github.event.inputs.query_set == 'tpcds') }}
        timeout-minutes: 120
        env:
          PGHOST: ${{ (github.event.inputs.scale_factor == '1' || github.event.inputs.scale_factor == '10') && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: |
          set -e
          QUERY_SET="${{ github.event.inputs.query_set }}"
          QUERY_SET="${QUERY_SET%%\[*\]*}"
          SCALE_FACTOR="${{ github.event.inputs.scale_factor }}"
          DB_NAME="${QUERY_SET}_sf${SCALE_FACTOR}"

          sudo apt-get update -y
          # make is needed before the "already seeded" check below, not just by the
          # seeding path further down: a database that already has data still runs
          # `make pg-create-index`, and on a runner without make preinstalled that
          # exits 127 before the later install line is ever reached. Only a
          # pre-provisioned target takes that branch, so it surfaced solely on
          # SF100 while the always-empty SF1/SF10 containers stayed green.
          sudo apt-get install -y postgresql-client make

          echo "Checking whether $DB_NAME already has data on $PGHOST..."
          set +e
          PSQL_OUTPUT="$(PGCONNECT_TIMEOUT=10 psql -U postgres -d "$DB_NAME" -tAc 'SELECT count(*) FROM customer;' 2>&1)"
          PSQL_EXIT=$?
          set -e

          if [ "$PSQL_EXIT" -eq 0 ]; then
            EXISTING_ROWS="$PSQL_OUTPUT"
          elif echo "$PSQL_OUTPUT" | grep -qi "does not exist"; then
            # Database or the customer table doesn't exist yet - genuinely unseeded.
            echo "$DB_NAME (or its customer table) doesn't exist yet on $PGHOST."
            EXISTING_ROWS=0
          else
            # Any other failure (auth, network, host unreachable, timeout) is a
            # real problem, not "unseeded" - don't silently treat it as empty.
            echo "::error::Could not check $DB_NAME on $PGHOST - this looks like a connectivity or authentication problem, not a missing database:"
            echo "$PSQL_OUTPUT"
            exit 1
          fi

          cd test/tpc-bench

          if [ "${EXISTING_ROWS:-0}" -gt 0 ] 2>/dev/null; then
            echo "$DB_NAME already has $EXISTING_ROWS rows in 'customer' - skipping data load, but ensuring indexes are up to date (idempotent, no rebuild if already present)."
            if [ "$QUERY_SET" = "tpcds" ]; then
              DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-create-index
            else
              DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index
            fi
            exit 0
          fi

          # SF1/SF10 always run against the self-contained postgres:16 service
          # container (PGHOST=127.0.0.1), so generating fresh data inline is
          # cheap and expected. Anything larger targets the shared hosted
          # cluster - generating+loading that inline risks a multi-hour job
          # that can time out or exhaust the runner's disk, and a failure
          # partway through would leave the shared database partially seeded.
          # Require those scale factors to be pre-provisioned instead.
          if [ "$PGHOST" != "127.0.0.1" ]; then
            echo "::error::$DB_NAME is missing or empty on the hosted $PGHOST cluster. Scale factor $SCALE_FACTOR is too large to safely generate and load inline from a CI runner. Pre-provision it first, e.g.:"
            echo "  cd test/tpc-bench && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME DBGEN_SCALE=$SCALE_FACTOR make tpch-clone tpch-fleet-gen pg-init && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME TPCH_DATA_DIR=./tmp/fleet make pg-load && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index"
            echo "(for a tpcds run: make tpcds-clone tpcds-fleet-gen pg-tpcds-init, then TPCDS_DATA_DIR=./tmp/tpcds-fleet make pg-tpcds-load, then make pg-tpcds-create-index)"
            exit 1
          fi

          echo "$DB_NAME is missing or empty on $PGHOST - seeding it now."
          sudo apt-get install -y git
          # Both query sets seed from the pinned DuckDB CLI (tpch-fleet-gen /
          # tpcds-fleet-gen), so nothing is compiled here - the kits are only
          # cloned for their DDL (dss.ddl / tpcds.sql, tpcds_ri.sql). Seeding
          # from any other generator produces data the recorded expected
          # answers don't match (see the fleet-gen comments in the Makefile).
          sudo apt-get install -y unzip

          if [ "$QUERY_SET" = "tpcds" ]; then
            make tpcds-clone
            DBGEN_SCALE=$SCALE_FACTOR make tpcds-fleet-gen
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-init
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME TPCDS_DATA_DIR=./tmp/tpcds-fleet make pg-tpcds-load
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-create-index
          else
            make tpch-clone
            DBGEN_SCALE=$SCALE_FACTOR make tpch-fleet-gen
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-init
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME TPCH_DATA_DIR=./tmp/fleet make pg-load
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index
          fi
          echo "Seed complete: $DB_NAME on $PGHOST."

      # Postgres-accelerator spicepods need a *_accelerated database that the
      # empty postgres:16 container doesn't have yet - create it before spiced
      # starts (idempotent), matching the PGHOST the spicepod will connect to.
      - name: Create postgres acceleration databases
        if: ${{ contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') }}
        env:
          PGHOST: ${{ (((startsWith(github.event.inputs.query_set, 'tpch') || github.event.inputs.query_set == 'tpcds') && (github.event.inputs.scale_factor == '1' || github.event.inputs.scale_factor == '10')) || (github.event.inputs.query_set == 'clickbench' && contains(github.event.inputs.spicepod_path, 's3[parquet]-postgres'))) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
        run: |
          set -e
          SPICEPOD="${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}"
          ACCEL_DBS="$(grep -oE 'pg_db: *[A-Za-z0-9_]+_accelerated' "$SPICEPOD" | awk '{print $2}' | sort -u)"
          if [ -z "$ACCEL_DBS" ]; then
            echo "No *_accelerated pg_db in $SPICEPOD - nothing to create."
            exit 0
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get update -y && sudo apt-get install -y postgresql-client
          fi
          for db in $ACCEL_DBS; do
            if psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" | grep -q 1; then
              echo "$db already exists on $PGHOST."
            else
              createdb -U postgres "$db"
              echo "Created $db on $PGHOST."
            fi
          done

      - name: Setup ODBC
        if: ${{ contains(github.event.inputs.spicepod_path, 'odbc') }}
        uses: ./.github/actions/setup-odbc

      - name: Install Oracle ODPI-C
        if: ${{ contains(github.event.inputs.spicepod_path, 'oracle') }}
        uses: ./.github/actions/setup-oracle-odpi

      - name: Install ADBC BigQuery Driver
        if: ${{ contains(github.event.inputs.spicepod_path, 'adbc[bigquery]') }}
        uses: ./.github/actions/setup-adbc-bigquery

      - name: Set up Python
        if: ${{ contains(github.event.inputs.spicepod_path, 'scylladb') || contains(github.event.inputs.spicepod_path, 'ducklake') }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup ScyllaDB
        if: ${{ contains(github.event.inputs.spicepod_path, 'scylladb') }}
        uses: ./.github/actions/setup-scylladb
        with:
          keyspace: tpch_sf1

      - name: Install PostgreSQL for DuckLake
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        uses: ./.github/actions/install-postgres
        with:
          pg-db: ducklake_catalog

      - name: Setup CH-benCH PostgreSQL
        if: ${{ github.event.inputs.query_set == 'chbench' }}
        uses: ./.github/actions/setup-chbench-postgres

      - name: Start local MinIO for DuckLake
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio server /data --console-address ':9001'

      - name: Wait for local MinIO
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'MinIO did not become ready in time.'
          docker logs minio
          exit 1

      - name: Bootstrap DuckLake TPCH SF1 catalog
        if: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') }}
        run: |
          python -m pip install --upgrade duckdb minio

          python <<'PY'
          import duckdb
          from minio import Minio

          bucket_name = "ducklake"
          minio = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          if not minio.bucket_exists(bucket_name):
              minio.make_bucket(bucket_name)

          tables = [
              "customer",
              "lineitem",
              "nation",
              "orders",
              "part",
              "partsupp",
              "region",
              "supplier",
          ]

          connection = duckdb.connect()
          connection.execute("INSTALL ducklake; LOAD ducklake;")
          connection.execute("INSTALL postgres; LOAD postgres;")
          connection.execute("INSTALL httpfs; LOAD httpfs;")
          connection.execute("INSTALL tpch; LOAD tpch;")

          connection.execute(
              """
              CREATE OR REPLACE SECRET minio_secret (
                TYPE s3,
                PROVIDER config,
                KEY_ID 'minioadmin',
                SECRET 'minioadmin',
                REGION 'us-east-1',
                ENDPOINT '127.0.0.1:9000',
                URL_STYLE 'path',
                USE_SSL false
              );
              """
          )

          connection.execute(
              """
              ATTACH 'ducklake:postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' AS ducklake
                (DATA_PATH 's3://ducklake/tpch_sf1/');
              """
          )

          connection.execute("CALL dbgen(sf=1);")

          for table in tables:
              connection.execute(
                  f"CREATE TABLE ducklake.main.{table} AS SELECT * FROM memory.main.{table};"
              )

          connection.close()
          PY

      # `--disable-caching` sends `Cache-Control: no-cache` on the benchmark's Flight
      # connection. It is load-bearing: `runtime.caching.sql_results` is enabled by
      # default with a one-second `item_ttl`, and the harness runs one warmup query
      # followed by N timed iterations of the identical SQL back-to-back. Without it
      # the warmup populates the cache and every timed iteration is a cache read, so
      # the recorded durations describe the cache rather than the engine.
      - name: Run the benchmark test - ${{ github.event.inputs.spicepod_path }}
        run: |
          [ -z "$AWS_ENDPOINT_URL" ] && unset AWS_ENDPOINT_URL

          rm -rf .spice/data
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" testoperator run bench \
            -s /usr/local/bin/spiced \
            -p ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }} \
            -d /opt/spiced/data \
            --query-set ${{ github.event.inputs.query_set }} \
            ${{ github.event.inputs.scenario_query_file != '' && format('--scenario-query-file ./test/scenario/{0}', github.event.inputs.scenario_query_file) || '' }} \
            ${{ github.event.inputs.query_overrides != '' && format('--query-overrides {0}', github.event.inputs.query_overrides) || '' }} \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            --disable-progress-bars \
            --disable-caching=${{ github.event.inputs.disable_caching }} \
            --validate=${{ github.event.inputs.validate_results }} \
            --metrics \
            --scale-factor ${{ github.event.inputs.scale_factor }}
        env:
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_ODBC_PATH: ${{ vars.DATABRICKS_ODBC_PATH }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_ENDPOINT: ${{ vars.DATABRICKS_ENDPOINT }}
          DATABRICKS_CLUSTER_ID: ${{ vars.DATABRICKS_CLUSTER_ID }}
          DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.DATABRICKS_SQL_WAREHOUSE_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ secrets.AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ secrets.AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'minioadmin' || secrets.AWS_S3_ATHENA_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'minioadmin' || secrets.AWS_S3_ATHENA_SECRET_ACCESS_KEY }}
          AWS_DYNAMODB_ACCESS_KEY_ID: ${{ secrets.AWS_DYNAMODB_ACCESS_KEY_ID }}
          AWS_DYNAMODB_SECRET_ACCESS_KEY: ${{ secrets.AWS_DYNAMODB_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'http://127.0.0.1:9000' || '' }}
          AWS_ALLOW_HTTP: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'true' || '' }}
          BIGQUERY_SERVICE_ACCOUNT_JSON: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT_JSON }}
          DUCKLAKE_CONNECTION_STRING: ${{ contains(github.event.inputs.spicepod_path, 'ducklake') && 'postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' || '' }}
          GLUE_AWS_KEY: ${{ secrets.AWS_S3_ATHENA_ACCESS_KEY_ID }}
          GLUE_AWS_SECRET: ${{ secrets.AWS_S3_ATHENA_SECRET_ACCESS_KEY }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          MYSQL_HOST: ${{ vars.TEST_MYSQL_HOST }}
          MYSQL_TCP_PORT: 3306
          MYSQL_USER: ${{ secrets.TEST_MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          MONGODB_HOST: ${{ vars.TEST_MONGODB_HOST }}
          MONGODB_PASSWORD: ${{ secrets.TEST_MONGODB_PASSWORD }}
          POSTGRES_HOST: ${{ (contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') && (startsWith(github.event.inputs.query_set, 'tpch') || github.event.inputs.query_set == 'tpcds') && (github.event.inputs.scale_factor == '1' || github.event.inputs.scale_factor == '10')) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          POSTGRES_RW_HOST: ${{ (contains(github.event.inputs.spicepod_path, 'postgres') && !contains(github.event.inputs.spicepod_path, 'ducklake') && (((startsWith(github.event.inputs.query_set, 'tpch') || github.event.inputs.query_set == 'tpcds') && (github.event.inputs.scale_factor == '1' || github.event.inputs.scale_factor == '10')) || (github.event.inputs.query_set == 'clickbench' && contains(github.event.inputs.spicepod_path, 's3[parquet]-postgres')))) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          SPICEAI_TEST_ENDPOINT: ${{ vars.SPICE_SECRET_SPICEAI_TEST_ENDPOINT }}
          SPICEAI_TEST_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
          SPICEAI_TEST_TPCDS_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY }}
          SPICEAI_CLICKBENCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY }}
          SPICEAI_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
          SQL_WAREHOUSE_DATABRICKS_TOKEN: ${{ secrets.SQL_WAREHOUSE_DATABRICKS_TOKEN }}
          SQL_WAREHOUSE_DATABRICKS_HOST: ${{ vars.SQL_WAREHOUSE_DATABRICKS_HOST }}
          SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID }}
          DREMIO_ENDPOINT: ${{ vars.TEST_DREMIO_ENDPOINT}}
          DREMIO_USERNAME: ${{ secrets.TEST_DREMIO_USERNAME}}
          DREMIO_PASSWORD: ${{ secrets.TEST_DREMIO_PASSWORD}}
          INSTA_UPDATE: ${{ steps.determine_update_snapshots.outputs.update_snapshots}}
          MSSQL_HOST: localhost
          MSSQL_USER: sa
          MSSQL_PASSWORD: S3cretP@ssw0rd
          MSSQL_TPCH_DB: tpch_sf1
          ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
          ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
          ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
          ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          SCYLLADB_HOST: ${{ contains(github.event.inputs.spicepod_path, 'scylladb') && '127.0.0.1' || '' }}
          SCYLLADB_PORT: ${{ contains(github.event.inputs.spicepod_path, 'scylladb') && '9042' || '' }}
          SCYLLADB_KEYSPACE: ${{ contains(github.event.inputs.spicepod_path, 'scylladb') && 'tpch_sf1' || '' }}
          CHBENCH_PG_HOST: 127.0.0.1

      - name: Install GH CLI
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always'
        run: |
          (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
          && sudo mkdir -p -m 755 /etc/apt/keyrings \
          && out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg \
          && cat $out | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
          && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Upload benchmark snapshots to branch
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always'
        run: |
          git fetch --unshallow || true

          # if the spiced commit is set, use that as the branch ID
          if [ -n "${{ github.event.inputs.spiced_commit || '' }}" ]; then
            BRANCH_ID=${{ github.event.inputs.spiced_commit }}
          else
            BRANCH_ID=${{ github.run_id }}
          fi

          BRANCH_NAME="testoperator-snapshot-update/${BRANCH_ID}"

          git config --global user.name 'Spice Benchmark Snapshot Update Bot'
          git config --global user.email 'spiceaibot@spice.ai'
          git checkout -b ${BRANCH_NAME}
          git add '*.snap'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Update ${{ github.event.inputs.query_set }} benchmark snapshots for ${{ github.event.inputs.spicepod_path }}"
            if git ls-remote --exit-code --heads origin ${BRANCH_NAME}; then
              git pull --rebase origin ${BRANCH_NAME}
            fi
            git push origin ${BRANCH_NAME}

            PR_URL="$(gh pr list --head "${BRANCH_NAME}" --state open --json url --jq .[].url)"
            if [[ -n "${PR_URL}" ]]; then
              echo "PR already exists -> ${PR_URL}"
              exit 0
            else
              BODY=$(cat <<EOF
          Automated benchmark snapshot update from workflow run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Query set:** \`${{ github.event.inputs.query_set }}\`
          **Spicepod:** \`${{ github.event.inputs.spicepod_path }}\`
          **Profile:** \`${{ github.event.inputs.profile_option || 'release' }}\`
          EOF
          )
              gh pr create --title "fix: Update ${{ github.event.inputs.query_set }} benchmark snapshots for ${{ github.event.inputs.spicepod_path }}" --body "${BODY}" --base trunk --head ${BRANCH_NAME} --label kind/bug
              gh pr merge --squash --auto ${BRANCH_NAME}
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
