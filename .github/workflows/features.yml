name: check all features

on:
  push:
    branches:
      - trunk
    paths:
      - '**/Cargo.toml'
  pull_request:
    paths:
      - '**/Cargo.toml'
  workflow_dispatch:

concurrency:
  # Allow only one workflow per any non-trunk branch.
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

  # Number of parallel jobs to split features across
  NUM_GROUPS: 2

  # Features excluded from all checks (heavy deps, special builds, etc.)
  EXCLUDED_FEATURES: >-
    bedrock
    cuda
    default
    extended_tests
    iceberg-write
    kafka
    mcp
    metal
    models
    nfs
    odbc
    release
    s3_vectors
    snapshots
    spark
    tpc-extension

jobs:
  setup:
    name: Setup Feature Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      num_groups: ${{ steps.set-matrix.outputs.num_groups }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1

      - name: Generate feature matrix
        id: set-matrix
        run: |
          # Get all features from spiced package, excluding the ones we don't want to check
          EXCLUDED="${{ env.EXCLUDED_FEATURES }}"
          EXCLUDED_PATTERN=$(echo "$EXCLUDED" | tr '\n' ' ' | tr -s ' ' | sed 's/ *$//' | sed 's/ /|/g')

          # Get features from cargo metadata
          ALL_FEATURES=$(cargo metadata --no-deps --format-version 1 2>/dev/null | \
            jq -r '.packages[] | select(.name == "spiced") | .features | keys[]' | \
            grep -vE "^($EXCLUDED_PATTERN)$" | \
            sort)

          # Convert to array and split into groups
          readarray -t FEATURES_ARRAY <<< "$ALL_FEATURES"
          TOTAL=${#FEATURES_ARRAY[@]}
          NUM_GROUPS=${{ env.NUM_GROUPS }}
          GROUP_SIZE=$(( (TOTAL + NUM_GROUPS - 1) / NUM_GROUPS ))

          # Build matrix JSON
          MATRIX='{"include":['
          for ((g=0; g<NUM_GROUPS; g++)); do
            START=$((g * GROUP_SIZE))
            END=$((START + GROUP_SIZE))
            if [ $END -gt $TOTAL ]; then END=$TOTAL; fi

            # Get features for this group
            GROUP_FEATURES=""
            for ((i=START; i<END; i++)); do
              if [ -n "$GROUP_FEATURES" ]; then
                GROUP_FEATURES="$GROUP_FEATURES,${FEATURES_ARRAY[$i]}"
              else
                GROUP_FEATURES="${FEATURES_ARRAY[$i]}"
              fi
            done

            # Get features NOT in this group (to exclude)
            EXCLUDE_FEATURES=""
            for ((i=0; i<TOTAL; i++)); do
              if [ $i -lt $START ] || [ $i -ge $END ]; then
                if [ -n "$EXCLUDE_FEATURES" ]; then
                  EXCLUDE_FEATURES="$EXCLUDE_FEATURES,${FEATURES_ARRAY[$i]}"
                else
                  EXCLUDE_FEATURES="${FEATURES_ARRAY[$i]}"
                fi
              fi
            done

            # Add excluded features to the exclude list
            EXCLUDE_FEATURES="$EXCLUDE_FEATURES,$(echo "$EXCLUDED" | tr '\n' ' ' | tr -s ' ' | sed 's/ *$//' | sed 's/ /,/g')"

            # Determine if this group checks openapi (first group only)
            CHECK_OPENAPI="false"
            if [ $g -eq 0 ]; then CHECK_OPENAPI="true"; fi

            if [ $g -gt 0 ]; then MATRIX="$MATRIX,"; fi
            MATRIX="$MATRIX{\"group\":$((g+1)),\"features\":\"$GROUP_FEATURES\",\"exclude_features\":\"$EXCLUDE_FEATURES\",\"check_openapi\":$CHECK_OPENAPI}"
          done
          MATRIX="$MATRIX]}"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "num_groups=$NUM_GROUPS" >> $GITHUB_OUTPUT
          echo "Generated matrix:"
          echo "$MATRIX" | jq .

  build:
    name: Features Check (${{ matrix.group }}/${{ needs.setup.outputs.num_groups }})
    needs: setup
    runs-on: spiceai-macos
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 1

      - name: Check features
        uses: ./.github/actions/check-features
        with:
          exclude_features: ${{ matrix.exclude_features }}
          check_openapi: ${{ matrix.check_openapi }}
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}
