---
name: integration tests (llms)

on:
  push:
    branches:
      - trunk
      - release-*
      - release/*
    paths:
      # The model contracts these tests exercise are no longer all under
      # `crates/llms/` — a change to a trait in one of the API crates reaches
      # every provider implementing it.
      - 'crates/llms/**'
      - 'crates/chat-api/**'
      - 'crates/embed-api/**'
      - 'crates/rerank-api/**'
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  workflow_dispatch:
    inputs:
      run:
        description: 'Which groups of models to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - hosted
          - self-hosted

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

jobs:
  setup-matrix:
    name: Setup strategy matrix
    runs-on: spiceai-dev-runners
    # Evaluates one inline script.
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: 'self-hosted',
                needs_env: false,
                runner: 'spiceai-macos',
                model_allowlist: 'local_phi3,hf_phi3'
              },
              {
                name: 'hosted',
                needs_env: true,
                runner: 'spiceai-macos',
                model_allowlist: 'anthropic,bedrock,openai,xai'
              }
            ];

            if (context.eventName === 'workflow_dispatch') {
              const name = context.payload.inputs.run;

              if (name === 'all') {
                return matrix;
              }

              return matrix.filter(m => m.name === name);
            }

            // On pull_request, only run tests that don't require secrets
            if (context.eventName === 'pull_request') {
              return matrix.filter(m => !m.needs_env);
            }

            return matrix;

  build:
    name: Build Test Binary
    runs-on: spiceai-macos
    # Slowest observed success in the 2026-07-25..08-08 window: 17 min, but
    # every sample had a warm sccache. Sized against the other macOS workspace
    # builds (pr.yml peaks at 117 min) so a cold cache cannot turn a passing
    # build into a red one.
    timeout-minutes: 300
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.UNAS_SMB_PASS != '' }}
      TEST_BINARY_OBJECT_KEY: test_binaries/${{ github.run_id }}/llms_integration_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Build LLMs integration test binary
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
        run: |
          TEST_BINARY_PATH=$(cargo test -p llms --test integration --features metal --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | contains(["test"])) and .executable != null) | .executable')
          cp $TEST_BINARY_PATH ./llms_integration_test

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@2ad4a874ff4813f8190117bc645af0dbb90b708c # v0.8.0
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1

      - name: Upload test binary to spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to upload the LLM integration test binary}"
          test_binary_url="${SPICEIO_ENDPOINT%/}/build/${TEST_BINARY_OBJECT_KEY}"
          curl --fail --silent --show-error --upload-file ./llms_integration_test "$test_binary_url"

      - name: Upload test binary
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llms-integration-test-binary
          path: ./llms_integration_test
          retention-days: 3
          compression-level: 1

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  test:
    runs-on: ${{ matrix.target.runner }}
    needs: [build, setup-matrix]
    # Slowest observed success in the 2026-07-25..08-08 window: 4 min.
    timeout-minutes: 90
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.UNAS_SMB_PASS != '' }}
      TEST_BINARY_OBJECT_KEY: test_binaries/${{ github.run_id }}/llms_integration_test
    strategy:
      # The two arms cover disjoint model sets — self-hosted local models and the hosted
      # providers — so one arm's result says nothing about the other's, and cancelling the
      # sibling on the first failure throws away half the signal this suite exists to give.
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    permissions: read-all

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@2ad4a874ff4813f8190117bc645af0dbb90b708c # v0.8.0
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.UNAS_SMB_PASS }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1

      - name: Download test binary from spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to download the LLM integration test binary}"
          mkdir -p ./integration_test
          test_binary_url="${SPICEIO_ENDPOINT%/}/build/${TEST_BINARY_OBJECT_KEY}"
          curl --fail --silent --show-error --output ./integration_test/llms_integration_test "$test_binary_url"

      - name: Download test binary
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: llms-integration-test-binary
          path: ./integration_test

      - name: Mark test binary as executable
        run: chmod +x ./integration_test/llms_integration_test

      - name: Run integration test
        env:
          MODEL_ALLOWLIST: ${{ matrix.target.model_allowlist }}
          SPICE_OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
          SPICE_ANTHROPIC_API_KEY: ${{ secrets.SPICE_SECRET_ANTHROPIC_API_KEY }}
          SPICE_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
          SPICE_BEDROCK_ACCESS_KEY: ${{ secrets.AWS_BEDROCK_KEY }}
          SPICE_BEDROCK_SECRET_KEY: ${{ secrets.AWS_BEDROCK_SECRET }}
        run: |
          # The spiceio setup action exports AWS_ENDPOINT_URL for sccache; the AWS SDK
          # honours it for every service, so leaving it set sends this suite's Bedrock
          # calls to the local build cache instead of AWS.
          unset AWS_ENDPOINT_URL
          if [ "${{ matrix.target.needs_env }}" == "true" ]; then
            if [ -z "$SPICE_OPENAI_API_KEY" ]; then
              echo "Error: 'SPICE_OPENAI_API_KEY' is not defined."
              exit 1
            fi
            if [ -z "$SPICE_ANTHROPIC_API_KEY" ]; then
              echo "Error: 'SPICE_ANTHROPIC_API_KEY' is not defined."
              exit 1
            fi
            if [ -z "$SPICE_XAI_API_KEY" ]; then
              echo "Error: 'SPICE_XAI_API_KEY' is not defined."
              exit 1
            fi
            export SPICE_BEDROCK_REGION="us-east-1"
            if [ -z "$SPICE_BEDROCK_ACCESS_KEY" ]; then
              echo "Error: 'SPICE_BEDROCK_ACCESS_KEY' is not defined."
              exit 1
            fi
            if [ -z "$SPICE_BEDROCK_SECRET_KEY" ]; then
              echo "Error: 'SPICE_BEDROCK_SECRET_KEY' is not defined."
              exit 1
            fi
          fi
          test_binary=./integration_test/llms_integration_test
          # Every test in this binary lives under `integration.rs`'s only module, `llms`.
          filter='llms::'

          # A filter that matches nothing makes libtest print `ok. 0 passed` and exit 0, so the
          # suite reports success having tested nothing. The filter names test-code structure,
          # which a refactor is free to move, so count the selection and refuse an empty one
          # rather than trusting a green result. `--list` only enumerates — it runs no test body,
          # so it costs no model call and needs none of the snapshot environment below. Its exit
          # status is checked separately from the count, because a harness that cannot run also
          # produces no output, and reporting that as a stale filter sends the reader to the
          # wrong file.
          if ! listed=$("$test_binary" --list "$filter"); then
            echo "::error::The LLM integration test binary failed to list its tests, so the suite could not run. Check the build and download steps above."
            exit 1
          fi
          # `grep -c` exits 1 on no match, which `-e` would otherwise turn into an abort before
          # the branch below can report the real problem.
          selected=$(printf '%s\n' "$listed" | grep -c ': test$' || true)
          echo "Filter '$filter' selects ${selected} test(s)."
          if [ "$selected" -eq 0 ]; then
            echo "::error::The LLM integration filter '$filter' selected no tests, so this suite would report success without exercising any model. Point it at the current test module path under crates/llms/tests/."
            exit 1
          fi

          # The binary is itself the libtest harness, so its options are passed directly. A `--`
          # here would end option parsing, and libtest would read `--test-threads=2` as a second
          # filter and silently keep its default thread count. `--test-threads` holds concurrent
          # requests low enough to stay under the hosted providers' rate limits.
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" \
            "$test_binary" --nocapture --test-threads=2 "$filter"

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true
