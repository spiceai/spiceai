---
name: integration tests (llms)

# The model integration tests: local models (llama.cpp, mistral.rs) and the
# hosted providers. They run after merge, not in the merge queue: on a trunk or
# release push that touches the model crates (below), and on every
# trunk_tests.yml run, which calls this workflow so a failure counts toward
# Trunk Health.

on:
  push:
    branches:
      - trunk
      - release-*
      - release/*
    paths:
      # The model contracts these tests exercise are no longer all under
      # `crates/llms/` — a change to a trait in one of the API crates reaches
      # every provider implementing it.
      - 'crates/llms/**'
      - 'crates/chat-api/**'
      - 'crates/embed-api/**'
      - 'crates/rerank-api/**'
      - 'crates/evaluate-api/**'
      - 'crates/evaluate-chat/**'
      - 'crates/llms-llamacpp/**'
      - 'crates/llama-cpp/**'
  # trunk_tests.yml calls this with the commit it tests.
  workflow_call:
    inputs:
      ref:
        description: 'The commit to test (default: the calling run''s commit)'
        required: false
        type: string
        default: ''
      run:
        description: 'Which groups of models to run: all, hosted or self-hosted'
        required: false
        type: string
        default: all
      models:
        description: 'Comma-separated models to run instead of each group''s whole set'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run:
        description: 'Which groups of models to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - hosted
          - self-hosted
      models:
        description: 'Comma-separated models to run instead of each group''s whole set, such as `azure,openai`. Empty runs them all.'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60

# Least privilege by default; a job that needs more declares its own block.
permissions:
  contents: read

jobs:
  setup-matrix:
    environment: secret-free
    name: Setup strategy matrix
    runs-on: spiceai-dev-runners
    # Evaluates one inline script.
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        env:
          RUN: ${{ inputs.run }}
          MODELS: ${{ inputs.models }}
        with:
          script: |
            const runner = 'spiceai-macos';
            const matrix = [
              {
                name: 'self-hosted',
                needs_env: false,
                runner,
                model_allowlist: 'local_phi3,hf_phi3'
              },
              {
                name: 'hosted',
                needs_env: true,
                runner,
                // `openai_decisions` is left out: `OpenAiDecisions` takes only an API key, and CI
                // authenticates OpenAI with workload identity federation.
                model_allowlist: 'anthropic,openai,azure,xai,bedrock,typesafe'
              }
            ];

            // A dispatch or a call names its groups and models through the
            // workflow's inputs; a call runs under its caller's event, so the
            // event name cannot tell these apart.
            const name = process.env.RUN;
            if (name) {
              const requested = (process.env.MODELS || '')
                .split(',')
                .map(model => model.trim())
                .filter(Boolean);
              const groups = name === 'all' ? matrix : matrix.filter(m => m.name === name);
              if (requested.length === 0) {
                return groups;
              }
              // Keep each group's share of the requested models, and the groups that have one.
              const narrowed = groups
                .map(m => ({
                  ...m,
                  model_allowlist: m.model_allowlist
                    .split(',')
                    .filter(model => requested.includes(model))
                    .join(',')
                }))
                .filter(m => m.model_allowlist !== '');
              if (narrowed.length === 0) {
                core.setFailed(`No group runs any of the requested models: ${requested.join(', ')}`);
              }
              return narrowed;
            }

            // On pull_request, only run tests that don't require secrets
            if (context.eventName === 'pull_request') {
              return matrix.filter(m => !m.needs_env);
            }

            return matrix;

  build:
    name: Build Test Binary
    runs-on: spiceai-macos
    environment: ci
    permissions:
      contents: read
      id-token: write  # signs the test binary's attestation
      attestations: write  # which the full-role test job verifies before running it
    # Slowest observed success in the 2026-07-25..08-08 window: 17 min, but
    # every sample had a warm sccache. Sized against the other macOS workspace
    # builds (pr.yml peaks at 117 min) so a cold cache cannot turn a passing
    # build into a red one.
    timeout-minutes: 300
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}
      TEST_BINARY_OBJECT_KEY: test_binaries/${{ github.run_id }}/llms_integration_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      - name: Build LLMs integration test binary
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
        run: |
          TEST_BINARY_PATH=$(cargo test -p llms --test integration --features metal --no-run --message-format=json | jq -r 'select(.reason == "compiler-artifact" and (.target.kind | contains(["test"])) and .executable != null) | .executable')
          cp $TEST_BINARY_PATH ./llms_integration_test

      - name: Set up spiceio
        # Not on trunk, whose output is attested: no compiler cache or macOS share, which other
        # refs can write, until trunk has a share of its own (planned).
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true' && github.ref != 'refs/heads/trunk'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@6b5eff2b2c10111ba66076dd8fe9abfb87b6a1fc # spiceio#49 merge on trunk (same action tree as orphaned dd13a600); v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Choose the CI store prefix
        uses: $/.github/actions/ci-store-prefix

      # On trunk the test binary carries this workflow's attestation, which the full-role test job
      # verifies before running it.
      - name: Attest the test binary
        # Only a build of the run's own commit: trunk_tests can pass a release branch's `ref`.
        if: env.CI_STORE_PREFIX == '' && (inputs.ref == '' || inputs.ref == github.sha)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./llms_integration_test

      - name: Upload test binary to spiceio
        if: env.HAS_SPICEIO_SECRET == 'true' && github.ref != 'refs/heads/trunk'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to upload the LLM integration test binary}"
          test_binary_url="${SPICEIO_ENDPOINT%/}/build/${TEST_BINARY_OBJECT_KEY}"
          curl --fail --silent --show-error --upload-file ./llms_integration_test "$test_binary_url"

      # The `test` legs run in `ci`, which has no NAS password, so they read this copy.
      - name: Upload test binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llms-integration-test-binary
          path: ./llms_integration_test
          retention-days: 3
          compression-level: 1

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  test:
    # Assumes a CI AWS role, so it runs from integration_llms_aws.yml; see that file.
    needs: [build, setup-matrix]
    permissions:
      contents: read
      actions: read
      # Exchanged for OpenAI, Anthropic and Microsoft Entra access tokens: workload identity
      # federation.
      id-token: write
    uses: spiceai/spiceai/.github/workflows/integration_llms_aws.yml@trunk
    with:
      needs_setup_matrix_matrix: ${{ needs.setup-matrix.outputs.matrix }}
      ref: ${{ inputs.ref }}

  llama-cpp-engine:
    environment: secret-free
    name: llama.cpp engine (Qwen3-0.6B GGUF)
    # The engine's model, differential and greedy-pick tests download Qwen3-0.6B (639 MB), its
    # MTP tests Qwen3.5-0.8B (550 MB), and its content-part tests both, from Hugging Face and run
    # them; its no-network tests run in `make nextest`.
    if: inputs.run != 'hosted'
    runs-on: spiceai-macos
    # Sized like the build job above: a cold cache rebuilds llama.cpp and mistral.rs.
    timeout-minutes: 180
    # Only the checkout reads anything; a caller cannot grant `read-all`
    # alongside the `id-token: write` the test job needs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      - name: Set up the C and C++ toolchain
        uses: $/.github/actions/setup-cc

      - name: Run the llama.cpp engine's model, content-part, differential, greedy-pick, Harmony, Inkling, MTP, prefix-reuse, Hugging Face resolution and unsupported-architecture tests
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
        # One test at a time. Each test loads a model of its own, and several models computing
        # on one Apple GPU at once can hang it ("Caused GPU Hang Error"): the GPU's recovery then
        # discards every model's queued work, failing tests that did nothing wrong. Four at a
        # time still hangs the M3 Pro runners' GPU.
        run: |
          cargo test -p llms-llamacpp --features metal --test integration -- --test-threads=1 model:: batching:: content_parts:: differential:: distributed:: greedy:: harmony:: inkling:: mtp:: prefix_reuse:: sequences:: system_messages:: hf_resolution:: unsupported::
