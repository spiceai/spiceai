---
name: Trunk tests

# The post-merge test run: everything that does not run in the merge queue,
# against trunk HEAD every 12 hours. The merge queue runs a quick set; this
# runs the rest, and the Trunk Health check (trunk_health.yml) blocks merging
# when its failures go unaddressed. Add a job here, and to `needs` of the
# `Trunk tests` job at the end, to move a test out of the merge queue.
#
# It runs the model integration tests (integration_llms.yml), the Cayenne
# object-native set (cayenne_object_native.yml), the nextest tests the gate
# leaves to after merge (`make nextest-post-merge`, NEXTEST_POST_MERGE_FILTER
# in the Makefile), and spicescript
# (tools/spicescript):
# - every script in test/spicescript, including those tagged `long`, which the
#   merge queue skips;
# - test/spicescript/known-failing: scripts that reproduce open bugs. Each must
#   fail exactly as its group's recordings/expected-failures.json says, so a
#   red run means a bug was fixed (move the script up to test/spicescript/ and
#   re-record) or now shows differently (re-record, or look for a regression);
# - the DuckDB scripts again on each older DuckDB release;
# - test/spicescript/live, against real providers.
#
# It also checks `spiced` with only its default features (`default-features`),
# the configuration `make install` builds and no merge-queue job compiles.
#
# It tests the binaries the merge queue already built for that commit (E2E Test
# CI's build_linux_x86_64), and builds them only when no run still holds them.
# It retests HEAD even when an earlier run already tested it: a repeat that
# fails points at a flake or the environment rather than a commit.
#
# On demand it runs against the Linux build of an E2E Test CI push or
# merge_group run of trunk or a release branch, with the scripts of the commit
# that run built (`gh workflow run trunk_tests.yml -f run_id=<run>`). A pull
# request's run is refused: its author built that spiced and wrote those
# scripts, and these jobs have id-token: write on the self-hosted runners. A
# run on trunk takes only a build of a trunk commit; a release branch's build
# is tested in a run on that branch (`--ref <branch>`).

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'An E2E Test CI run whose Linux build to test (default: the build of trunk HEAD)'
        required: false
        type: string
      branch:
        description: 'A versioned release branch (release/X.Y) whose head to test, with that commit''s own build (default: trunk)'
        required: false
        type: string

run-name: ${{ inputs.branch && format('Trunk tests on {0}', inputs.branch) || 'Trunk tests' }}

# One run per branch at a time, never cancelled: each run is a verdict that
# Trunk Health (trunk) or a release build (release branches) reads.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.branch || 'trunk' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  # Which commit to test, where its binaries are, and the commits since the
  # last green run, which bound a bisection when this run fails.
  resolve:
    environment: secret-free
    name: Find the build
    runs-on: spiceai-dev-runners
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      build_run: ${{ steps.build.outputs.run }}
    steps:
      # Before anything of a run is downloaded or checked out; see the action for the rules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/check-trusted-run

      - name: Check the given run is a trusted build
        id: given
        if: inputs.run_id != ''
        uses: $/.github/actions/check-trusted-run
        with:
          run-id: ${{ inputs.run_id }}
          token: ${{ secrets.GITHUB_TOKEN }}
          for-ref: ${{ github.ref }}

      - name: Find the build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          BRANCH: ${{ inputs.branch }}
          GIVEN_WORKFLOW: ${{ steps.given.outputs.workflow }}
        run: |
          set -euo pipefail
          if [ -n "$BRANCH" ]; then
            [ -z "$RUN_ID" ] || { echo "::error::Give run_id or branch, not both"; exit 1; }
            # The versioned release branches only, the same pattern
            # check-trusted-run accepts builds from: these jobs hold credentials,
            # and an arbitrary release/* branch may not be protected.
            [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+(\.[0-9]+)?(-rc\.?[0-9]+)?$ ]] || { echo "::error::branch must be a versioned release branch (release/X.Y), not '$BRANCH'"; exit 1; }
            # A branch's code and build run only in a run of that branch, whose credentials write
            # only that branch's keys.
            [ "$GITHUB_REF" = "refs/heads/$BRANCH" ] || { echo "::error::A run on $GITHUB_REF tests only its own branch's builds. Run it on $BRANCH: gh workflow run trunk_tests.yml --ref $BRANCH -f branch=$BRANCH"; exit 1; }
          fi
          holds_build() {
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/artifacts" \
              -q '.artifacts[] | select(.expired | not) | .name' | grep -qx build_linux_x86_64
          }
          if [ -n "$RUN_ID" ]; then
            [ "$GIVEN_WORKFLOW" = "E2E Test CI" ] || { echo "::error::Run $RUN_ID is a $GIVEN_WORKFLOW run, not E2E Test CI"; exit 1; }
            holds_build "$RUN_ID" || { echo "::error::Run $RUN_ID no longer holds build_linux_x86_64"; exit 1; }
            run="$RUN_ID"
            sha=$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          else
            # Trunk, or the release branch named by `branch` that this run is
            # on: these jobs hold credentials, and other code gets them only
            # through a trusted run_id, which on trunk must be a build of trunk. A
            # scheduled run tests the commit it started at, its own head_sha,
            # so that the next run's commit range starts at the commit this run
            # actually tested; a dispatch tests trunk HEAD. The merge-queue run
            # of a trunk commit built exactly that commit (the queue
            # fast-forwards trunk to it), and so did its push run.
            if [ -n "$BRANCH" ]; then
              # A protected release branch's head, read from the API: the
              # code tested is that branch's, never the dispatching ref's.
              sha=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" -q .commit.sha)
            elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
              sha="$GITHUB_SHA"
            else
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/trunk" -q .sha)
            fi
            run=""
            # A run of the branch under test, or of its merge queue: a run of another ref with the
            # same commit used that ref's caches and store keys.
            own="${BRANCH:-trunk}"
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e_test_ci.yml/runs?head_sha=$sha&per_page=20" \
                | jq -r --arg own "$own" '.workflow_runs[] | select((.event == "push" and .head_branch == $own) or (.event == "merge_group" and (.head_branch | startswith("gh-readonly-queue/" + $own + "/")))) | .id'); do
              if holds_build "$id"; then run="$id"; break; fi
            done
            if [ -n "$run" ]; then
              echo "Testing the build of E2E Test CI run $run"
            else
              echo "No E2E Test CI run still holds a build of $sha; building it here."
            fi
          fi
          {
            echo "run=$run"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      # The found run is trusted by how it was found (a merge_group or push run of
      # this repository at trunk's commit); checking it costs a second and keeps
      # one rule for every run whose artifacts this workflow runs.
      - name: Check the found run is a trusted build
        if: inputs.run_id == '' && steps.build.outputs.run != ''
        uses: $/.github/actions/check-trusted-run
        with:
          run-id: ${{ steps.build.outputs.run }}
          token: ${{ secrets.GITHUB_TOKEN }}
          for-ref: ${{ github.ref }}

      - name: Record the commit range
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.build.outputs.sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [ -n "$BRANCH" ]; then
            echo "### Testing $BRANCH at ${SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Scheduled runs test the commit they ran at, so the newest green
          # scheduled run's commit is the last one known good.
          green=$(gh run list -R "$GITHUB_REPOSITORY" -w trunk_tests.yml -b trunk -e schedule \
            --status success -L 1 --json headSha -q '.[0].headSha // ""')
          {
            echo "### Testing ${SHA}"
            echo
            if [ -z "$green" ]; then
              echo "No earlier green scheduled run."
            elif [ "$green" = "$SHA" ]; then
              echo "The last green run tested this commit too."
            else
              echo "Since the last green run: [${green:0:12}...${SHA:0:12}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$green...$SHA)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/range"
          jq -n --arg sha "$SHA" --arg last_green "$green" '{sha: $sha, last_green: $last_green}' \
            > "$RUNNER_TEMP/range/trunk-tests-range.json"

      - name: Upload the commit range
        if: inputs.branch == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trunk-tests-range
          path: ${{ runner.temp }}/range/trunk-tests-range.json
          retention-days: 30

  # Only when no E2E Test CI run still holds the commit's build, such as a
  # commit pushed to trunk without the merge queue. The same build as E2E Test
  # CI's Linux leg.
  build:
    environment: ci
    name: Build Linux x64 binaries
    needs: resolve
    if: needs.resolve.outputs.build_run == ''
    runs-on: spiceai-dev-runners
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      - name: Set up make
        uses: $/.github/actions/setup-make

      - name: Set up cc
        uses: $/.github/actions/setup-cc

      - name: Install Protoc
        uses: $/.github/actions/install-protoc

      - name: Build spiced and spice CLI
        timeout-minutes: 150
        uses: $/.github/actions/build-spiced
        with:
          # The same features as E2E Test CI's Linux build, whose artifact this
          # stands in for; keep the two lists equal. `http-functions` is for
          # test/spicescript/secret-redaction.yaml, which registers remote
          # functions.
          features: 'tpc-extension,models,postgres-accel,http-functions'
          build_cli: 'true'
          upload_artifact: 'true'
          artifact_name: build_linux_x86_64
          artifact_retention_days: '1'

  spicescript:
    # Assumes a CI AWS role, so it runs from trunk_tests_aws.yml; see that file.
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result != 'failure' }}
    permissions:
      actions: read
      contents: read
      id-token: write  # RustFS and Docker Hub credentials, and the tokens of the live scripts
    uses: spiceai/spiceai/.github/workflows/trunk_tests_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN: ${{ secrets.CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
      OPENAI_WIF_AUDIENCE: ${{ secrets.OPENAI_WIF_AUDIENCE }}
      SPICE_SECRET_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
    with:
      needs_resolve_build_run: ${{ needs.resolve.outputs.build_run }}
      needs_resolve_sha: ${{ needs.resolve.outputs.sha }}

  # The model integration tests (integration_llms.yml), on the commit this run
  # tests: local models and the hosted providers. They run here and on pushes
  # that touch the model crates, not in the merge queue.
  models:
    name: Model tests
    needs: resolve
    uses: ./.github/workflows/integration_llms.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
    # The called jobs' own permissions, which a caller must grant: the test
    # job exchanges its OIDC token for provider access tokens.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write  # the build job attests the test binary
    secrets: inherit

  # The metastore model's `all` set with its controls, and the object-native
  # data-path suites on every store at full depth (cayenne_object_native.yml).
  # Pull requests and the merge queue run its quick set.
  cayenne-object-native:
    name: Cayenne object-native
    needs: resolve
    uses: ./.github/workflows/cayenne_object_native.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      set: all
    # The called jobs' own permissions: its path filter reads pull requests.
    permissions:
      contents: read
      pull-requests: read

  # The nextest tests that sign-off and the merge queue skip: the SF1
  # result-correctness lanes, which compare Cayenne with standalone DuckDB and
  # SQLite, and the tuning simulation's report. Built from source at the commit
  # this run tests, as correctness_chdb.yml builds its lane, since the E2E build
  # holds no test binaries.
  nextest:
    environment: ci
    name: nextest (post-merge)
    needs: resolve
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials for the build cache
    # The lanes took 607s one at a time on a quiet Mac, and the shared runners
    # have been measured at up to 4.6x slower; the rest is building `cayenne`.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Restore Cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      - name: Set up Nextest
        uses: $/.github/actions/setup-nextest

      - name: Set up make
        uses: $/.github/actions/setup-make

      - name: Set up cc
        uses: $/.github/actions/setup-cc

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Get RustFS credentials
        id: rustfs
        continue-on-error: true
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '7200'
          export-env: 'false'

      - name: Set up sccache
        uses: $/.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      # A dispatch can test an older trunk or release commit, from before these
      # tests left the merge gate. That commit has no `nextest-post-merge`, and
      # its own merge gate already ran the tests, so there is nothing to run.
      - name: Run the post-merge nextest tests
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          set -euo pipefail
          if ! grep -q '^nextest-post-merge:' Makefile; then
            echo "::notice::This commit predates make nextest-post-merge; its merge gate ran these tests, so there is nothing to run here."
            exit 0
          fi
          make nextest-post-merge

  # `spiced` with its default features and nothing else: what `make install` builds,
  # and the one configuration no merge-queue job compiles. Every queue build adds
  # features (E2E: `tpc-extension`, `models`, `http-functions`, plus `metal` on macOS;
  # lint and nextest: the gate's feature set), so code behind
  # `#[cfg(not(feature = "…"))]` for any of them goes unchecked until here.
  # `--release` keeps release-only `cfg` paths in scope; no `REL_VERSION`, so no
  # `release` feature either, as `make install` on a developer machine.
  default-features:
    environment: ci
    name: spiced default features (cargo check)
    needs: resolve
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials for the build cache
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: Restore Cargo registry
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      - name: Set up make
        uses: $/.github/actions/setup-make

      - name: Set up cc
        uses: $/.github/actions/setup-cc

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Get RustFS credentials
        id: rustfs
        continue-on-error: true
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '7200'
          export-env: 'false'

      - name: Set up sccache
        uses: $/.github/actions/setup-sccache
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Check spiced with its default features
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: cargo check --locked --release -p spiced

  # The run's one verdict, which Trunk Health reads: it succeeds only if every
  # job above succeeded or was skipped, and names the jobs that did not.
  summary:
    environment: secret-free
    name: Trunk tests
    if: ${{ !cancelled() }}
    needs: [resolve, build, spicescript, models, cayenne-object-native, nextest, default-features]
    runs-on: spiceai-dev-runners
    timeout-minutes: 5
    permissions:
      statuses: write  # the verdict, as a commit status on the tested commit
    steps:
      - name: Verify every job succeeded
        id: verify
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          if ! failed="$(printf '%s' "$RESULTS" | jq -r '
                to_entries
                | map((.value.result // "missing") as $r
                      | select($r != "success" and $r != "skipped")
                      | "\(.key) (\($r))")
                | join(", ")')"; then
            echo "::error::Could not read the job results; failing closed."
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::Trunk test jobs did not succeed: ${failed}"
            exit 1
          fi
          echo "Every trunk test job succeeded."

      # The verdict on the exact commit tested, as the `trunk-tests` commit
      # status. A release build requires it to be `success` on the commit it
      # builds, and the scheduled fan-out below skips a release branch head
      # that already has one.
      - name: Record the verdict on the commit
        if: ${{ !cancelled() && needs.resolve.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          state=$([ "$OUTCOME" = success ] && echo success || echo failure)
          description=$([ "$state" = success ] && echo "Every trunk test passed" || echo "Trunk tests failed")
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=trunk-tests -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --silent
          echo "Recorded trunk-tests=$state on $SHA"

  # Release branches get a verdict too, so a release can be built only from a
  # commit that passed. On each scheduled run, every release branch with a
  # commit in the last 30 days whose head has no trunk-tests status yet is
  # tested in a run of its own: one dispatch per branch, so its result stays
  # out of trunk's scheduled verdict, which Trunk Health reads. A head without
  # trunk_tests.yml predates the post-merge split: its own merge queue ran the
  # full suite, so it needs no verdict.
  release-branches:
    environment: secret-free
    name: Test changed release branches
    if: github.event_name == 'schedule'
    runs-on: spiceai-dev-runners
    timeout-minutes: 15
    # A failure here (the API refused a lookup) shows as a failed job but
    # leaves the run's conclusion to the test jobs: Trunk Health reads that
    # conclusion as trunk's verdict.
    continue-on-error: true
    permissions:
      actions: write   # dispatch this workflow for each branch
      contents: read
      statuses: read
    steps:
      - name: Dispatch a run for each changed release branch head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%s)
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" \
              -q '.[] | select(.name | test("^release/[0-9]+\\.[0-9]+(\\.[0-9]+)?(-rc\\.?[0-9]+)?$")) | "\(.name) \(.commit.sha)"' |
          while read -r branch sha; do
            when=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" -q .commit.committer.date)
            [ "$(date -u -d "$when" +%s)" -ge "$cutoff" ] || continue
            # Absence counts only from a listing that succeeded; a lookup that
            # fails stops the job rather than skipping the branch.
            if ! workflows=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows?ref=$sha" -q '.[].name'); then
              echo "::error::Could not list the workflows of $branch at $sha, so cannot tell whether it needs testing"
              exit 1
            fi
            if ! grep -qx trunk_tests.yml <<<"$workflows"; then
              echo "$branch at ${sha:0:12}: predates the post-merge split; its merge queue ran the full suite"
              continue
            fi
            verdict=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/statuses?per_page=100" \
              -q '[.[] | select(.context == "trunk-tests" and .creator.login == "github-actions[bot]")] | sort_by(.created_at, .id) | last | .state // ""')
            if [ -n "$verdict" ]; then
              echo "$branch at ${sha:0:12}: already tested ($verdict)"
              continue
            fi
            echo "$branch at ${sha:0:12}: dispatching"
            # On the release branch itself, so it runs that branch's own definition and gets that
            # branch's role decision: a trunk run that names a build off trunk fails at ci-role.
            gh workflow run trunk_tests.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f branch="$branch"
          done
