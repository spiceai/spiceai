name: spiced_docker_dev
run-name: 'spiced_docker_dev: ${{ inputs.tag }} (branch ${{ github.ref_name }} @ ${{ github.sha }})'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., my-feature). Will be published as ghcr.io/spiceai/spiceai-dev:<tag>'
        required: true
        type: string
      variant:
        description: 'Which image variant to build'
        required: false
        type: choice
        options:
          - 'models'
          - 'default'
        default: 'models'
      target:
        description: 'Build for specific architecture(s)'
        required: false
        type: choice
        options:
          - 'all'
          - 'amd64'
          - 'arm64'
        default: 'all'
      ref:
        description: 'Git ref/SHA to check out for the image build. Defaults to the workflow commit.'
        required: false
        type: string
        default: ''
      additional_features:
        description: 'Optional comma-separated cargo features appended to the variant defaults (e.g. postgres,duckdb). Leave empty for defaults only.'
        required: false
        type: string
        default: ''
  # Mirror the dispatch inputs so other workflows (e.g. the cluster-bench
  # dispatch) can call this as a reusable workflow to build a commit-pinned
  # spiced image and feed the resulting tag into downstream jobs.
  # Architecture is fixed to amd64 for workflow_call — that's the only one
  # the Spice Cloud cluster benches actually consume.
  workflow_call:
    inputs:
      tag:
        description: 'Image tag. Will be published as ghcr.io/spiceai/spiceai-dev:<tag>'
        required: true
        type: string
      variant:
        description: 'Which image variant to build'
        required: false
        type: string
        default: 'models'
      ref:
        description: 'Git ref/SHA to check out for the image build. Defaults to the caller workflow commit.'
        required: false
        type: string
        default: ''
      additional_features:
        description: 'Optional comma-separated cargo features appended to the variant defaults (e.g. postgres,duckdb). Leave empty for defaults only.'
        required: false
        type: string
        default: ''
    outputs:
      image:
        description: 'Fully-qualified image reference, including tag'
        value: ${{ jobs.setup.outputs.image }}
      tag:
        description: 'The published image tag (echo of the input)'
        value: ${{ jobs.setup.outputs.tag }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      rel_version: ${{ steps.set_version.outputs.rel_version }}
      dev_label: ${{ steps.set_version.outputs.dev_label }}
      run_amd64: ${{ steps.set_targets.outputs.run_amd64 }}
      run_arm64: ${{ steps.set_targets.outputs.run_arm64 }}
      image: ${{ steps.set_image_metadata.outputs.image }}
      tag: ${{ steps.set_image_metadata.outputs.tag }}
      revision: ${{ steps.provenance.outputs.revision }}
      on_trunk: ${{ steps.provenance.outputs.on_trunk }}
      cargo_features: ${{ steps.set_cargo_features.outputs.cargo_features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set image metadata
        id: set_image_metadata
        run: |
          echo "image=ghcr.io/spiceai/spiceai-dev:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Set version
        id: set_version
        run: |
          commit_hash=$(git rev-parse --short HEAD)
          branch_name="${GITHUB_REF_NAME}"
          # Sanitize branch name for use in version string
          safe_branch=$(echo "$branch_name" | sed 's/[^a-zA-Z0-9]/-/g' | head -c 20)
          date="$(date +%Y%m%d)"
          version="${date}-${safe_branch}-${commit_hash}"
          # `g`-prefix the commit hash (git-describe convention) so it is always a
          # valid SemVer pre-release identifier in the Cargo.toml version below.
          # An all-numeric short SHA with a leading zero (e.g. 0882134) is an
          # invalid numeric SemVer identifier and fails `cargo build`.
          dev_label="dev.${date}.g${commit_hash}"
          echo "rel_version=${version}" >> $GITHUB_OUTPUT
          echo "dev_label=${dev_label}" >> $GITHUB_OUTPUT
          echo "Building dev image with version: \"${version}\""

      - name: Determine build provenance
        id: provenance
        run: |
          # Raw commit actually built (HEAD = `inputs.ref || github.sha`).
          revision="$(git rev-parse HEAD)"
          # "Is this trunk code": is the built commit reachable from trunk's tip?
          # Only trunk's recent history is needed, so fetch a shallow slice rather
          # than the whole repo.
          git fetch --depth=100 --no-tags origin trunk
          if git merge-base --is-ancestor HEAD FETCH_HEAD 2>/dev/null; then
            on_trunk=true
          else
            on_trunk=false
          fi
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          echo "on_trunk=${on_trunk}" >> "$GITHUB_OUTPUT"
          echo "Provenance: revision=${revision} on_trunk=${on_trunk} ref_type=${GITHUB_REF_TYPE} ref_name=${GITHUB_REF_NAME}"

      - name: Set target architectures
        id: set_targets
        run: |
          # When invoked via workflow_call, `inputs.target` is unset and we
          # always build amd64 only — cluster-bench callers don't need arm.
          target="${{ inputs.target }}"
          if [ -z "$target" ]; then
            target="amd64"
          fi
          case "$target" in
            all)
              echo "run_amd64=true" >> $GITHUB_OUTPUT
              echo "run_arm64=true" >> $GITHUB_OUTPUT
              ;;
            amd64)
              echo "run_amd64=true" >> $GITHUB_OUTPUT
              echo "run_arm64=false" >> $GITHUB_OUTPUT
              ;;
            arm64)
              echo "run_amd64=false" >> $GITHUB_OUTPUT
              echo "run_arm64=true" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Set cargo features
        id: set_cargo_features
        env:
          VARIANT: ${{ inputs.variant }}
          ADDITIONAL_FEATURES: ${{ inputs.additional_features }}
        run: |
          if [ "$VARIANT" = "models" ]; then
            features="release,models,spicebench"
          else
            features="release,spicebench"
          fi

          # Append optional extras (comma-separated). Trim whitespace and
          # collapse empty segments so "postgres, duckdb," → "postgres,duckdb".
          if [ -n "$ADDITIONAL_FEATURES" ]; then
            cleaned=$(printf '%s' "$ADDITIONAL_FEATURES" | tr -d '[:space:]' | sed 's/,\+/,/g; s/^,//; s/,$//')
            if [ -n "$cleaned" ]; then
              # Cargo feature names are identifiers; reject anything else so a
              # hostile dispatch input cannot inject shell metacharacters into
              # later build steps that expand CARGO_FEATURES.
              if ! printf '%s' "$cleaned" | grep -Eq '^[A-Za-z0-9_,-]+$'; then
                echo "additional_features contains invalid characters: ${cleaned}" >&2
                exit 1
              fi
              features="${features},${cleaned}"
            fi
          fi

          echo "cargo_features=${features}" >> "$GITHUB_OUTPUT"
          echo "Building with CARGO_FEATURES=${features}"

  build-arm64:
    needs: setup
    if: needs.setup.outputs.run_arm64 == 'true'
    runs-on: hosted-linux-arm-runner
    env:
      RUST_PROFILE: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Add dev postfix to version in Cargo.toml
        env:
          DEV_LABEL: ${{ needs.setup.outputs.dev_label }}
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$current_version" =~ -[a-zA-Z0-9]+(\.[0-9]+)*$ ]]; then
            new_version="${current_version}.$DEV_LABEL"
          else
            new_version="${current_version}-$DEV_LABEL"
          fi
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" Cargo.toml
          grep '^version =' Cargo.toml

      - name: Install docker
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg lsb-release
          sudo mkdir -m 0755 -p /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(lsb_release -i | awk '{ print tolower($3) }') $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Start Docker service
        run: |
          sudo systemctl start docker
          sudo systemctl status docker

      - name: chown /var/run/docker.sock to current user
        run: |
          sudo chown $USER /var/run/docker.sock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        # Authenticate to Docker Hub before building so base image pulls (rust, debian, etc.)
        # use authenticated rate limits instead of anonymous (per-IP) limits.
        if: github.repository == 'spiceai/spiceai'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ARM64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          outputs: type=docker,name=localhost:5000/spiceai:dev-arm64,dest=/tmp/image-arm64.tar
          cache-from: type=gha,scope=build-dev-arm64
          cache-to: type=gha,scope=build-dev-arm64,mode=max
          build-args: |
            CARGO_FEATURES=${{ needs.setup.outputs.cargo_features }}
            RUST_PROFILE=${{ env.RUST_PROFILE }}
          # Provenance labels baked into the image config (survive the multi-arch
          # `imagetools create` in publish, readable via `docker inspect`).
          labels: |
            org.opencontainers.image.revision=${{ needs.setup.outputs.revision }}
            build.on_trunk=${{ needs.setup.outputs.on_trunk }}
            build.ref_type=${{ github.ref_type }}
            build.ref_name=${{ github.ref_name }}

      - name: Validate ARM64 image
        run: |
          docker load -i /tmp/image-arm64.tar
          docker run --rm localhost:5000/spiceai:dev-arm64 --version

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-arm64
          path: /tmp/image-arm64.tar

  build-amd64:
    needs: setup
    if: needs.setup.outputs.run_amd64 == 'true'
    runs-on: spiceai-dev-runners
    env:
      RUST_PROFILE: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Add dev postfix to version in Cargo.toml
        env:
          DEV_LABEL: ${{ needs.setup.outputs.dev_label }}
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$current_version" =~ -[a-zA-Z0-9]+(\.[0-9]+)*$ ]]; then
            new_version="${current_version}.$DEV_LABEL"
          else
            new_version="${current_version}-$DEV_LABEL"
          fi
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" Cargo.toml
          grep '^version =' Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        # Authenticate to Docker Hub before building so base image pulls (rust, debian, etc.)
        # use authenticated rate limits instead of anonymous (per-IP) limits.
        if: github.repository == 'spiceai/spiceai'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build AMD64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          outputs: type=docker,name=localhost:5000/spiceai:dev-amd64,dest=/tmp/image-amd64.tar
          cache-from: type=gha,scope=build-dev-amd64
          cache-to: type=gha,scope=build-dev-amd64,mode=max
          build-args: |
            CARGO_FEATURES=${{ needs.setup.outputs.cargo_features }}
            RUST_PROFILE=${{ env.RUST_PROFILE }}
          # Provenance labels baked into the image config (survive the multi-arch
          # `imagetools create` in publish, readable via `docker inspect`).
          labels: |
            org.opencontainers.image.revision=${{ needs.setup.outputs.revision }}
            build.on_trunk=${{ needs.setup.outputs.on_trunk }}
            build.ref_type=${{ github.ref_type }}
            build.ref_name=${{ github.ref_name }}

      - name: Validate AMD64 image
        run: |
          docker load -i /tmp/image-amd64.tar
          docker run --rm localhost:5000/spiceai:dev-amd64 --version

      - name: Upload AMD64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-amd64
          path: /tmp/image-amd64.tar

  publish:
    needs: [setup, build-amd64, build-arm64]
    if: always() && (needs.build-amd64.result == 'success' || needs.build-arm64.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp
          pattern: image-*
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -l /tmp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        # Authenticate to Docker Hub before pulling so we use the authenticated
        # rate limits instead of anonymous (per-IP) limits when pulling
        # registry:2 below.
        if: github.repository == 'spiceai/spiceai'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2

      - name: Login to GitHub Package Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import images and create manifest
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          REL_VERSION: ${{ needs.setup.outputs.rel_version }}
          RUN_AMD64: ${{ needs.setup.outputs.run_amd64 }}
          RUN_ARM64: ${{ needs.setup.outputs.run_arm64 }}
        run: |
          echo "IMAGE_TAG=${IMAGE_TAG}"
          echo "REL_VERSION=${REL_VERSION}"

          sources=""

          if [ -f /tmp/image-amd64.tar ]; then
            echo "Loading AMD64 image"
            docker load -i /tmp/image-amd64.tar
            docker push localhost:5000/spiceai:dev-amd64
            sources="$sources localhost:5000/spiceai:dev-amd64"
          fi

          if [ -f /tmp/image-arm64.tar ]; then
            echo "Loading ARM64 image"
            docker load -i /tmp/image-arm64.tar
            docker push localhost:5000/spiceai:dev-arm64
            sources="$sources localhost:5000/spiceai:dev-arm64"
          fi

          if [ -z "$sources" ]; then
            echo "No images to publish!"
            exit 1
          fi

          echo "Creating and pushing multi-arch manifest"
          docker buildx imagetools create \
            -t ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG} \
            -t ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}-${REL_VERSION} \
            $sources

          echo "Verifying image:"
          docker buildx imagetools inspect ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}

      - name: Summary
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          REL_VERSION: ${{ needs.setup.outputs.rel_version }}
          CARGO_FEATURES: ${{ needs.setup.outputs.cargo_features }}
        run: |
          echo "## 🐳 Dev Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}-${REL_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cargo features:** \`${CARGO_FEATURES}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/spiceai/spiceai-dev:${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
