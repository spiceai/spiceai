name: pr - helm-lint

on:
  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
  workflow_dispatch:

jobs:
  # merge_group can't path-filter, so gate the lint on a changed-files check
  # instead of running it for every merge-queue entry.
  changes:
    runs-on: ubuntu-latest
    outputs:
      chart: ${{ steps.filter.outputs.chart }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            chart:
              - 'deploy/chart/**'

  lint-helm:
    name: Helm Lint
    needs: changes
    if: ${{ needs.changes.outputs.chart == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: spiceai-macos

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Lint Helm chart
        run: helm lint deploy/chart/
