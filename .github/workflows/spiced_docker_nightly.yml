name: spiced_docker_nightly

on:
  schedule:
    - cron: '0 9 * * *' # Runs the workflow at 9:00 AM UTC (1AM PT) every day

  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Docker images to the registry
        required: false
        type: boolean
        default: false
      variant:
        description: 'Which image tag(s) to build'
        required: false
        type: choice
        options:
          - 'all'
          - 'default'
          - 'data'
          - 'jemalloc'
          - 'mimalloc'
          - 'sysalloc'
          - 'nas'
        default: 'all'
      profile_option:
        description: 'Which Rust build profile to use? (Default is release-lto)'
        required: false
        type: choice
        options:
          - 'release-lto'
          - 'release'
        default: 'release-lto'

permissions:
  packages: write
  contents: write

jobs:
  check_commits:
    runs-on: ubuntu-22.04
    outputs:
      has_new_commits: ${{ steps.check_commits.outputs.has_new_commits }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Check new commits since latest nightly build
        id: check_commits
        run: |
          # Get the latest commit hash from the default branch
          latest_commit=$(git rev-parse HEAD)

          # Attempt to get the commit hash of the current nightly tag
          nightly_commit=$(git rev-list -n 1 nightly 2>/dev/null || echo "")

          # Check if there are new commits since the last nightly tag
          if [ "$latest_commit" = "$nightly_commit" ]; then
            echo "No new commits since the last nightly build. Exiting..."
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New commits found. Proceeding with the build."
          echo "has_new_commits=true" >> $GITHUB_OUTPUT
        shell: bash

  setup:
    needs: check_commits
    if: needs.check_commits.outputs.has_new_commits == 'true'

    runs-on: ubuntu-22.04
    outputs:
      rel_version: ${{ steps.set_version.outputs.rel_version }}
      nightly_label: ${{ steps.set_version.outputs.nightly_label }}
      variant: ${{ steps.set_version.outputs.variant }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set Nightly REL_VERSION from current timestamp
        run: python3 ./.github/scripts/get_release_version.py

      - name: Add REL_VERSION to output
        id: set_version
        run: |
          commit_hash=$(git rev-parse --short HEAD)
          timestamp="$(date +%Y%m%d%H%M)"
          version="${timestamp}-${commit_hash}"
          nightly_label="nightly.${timestamp}.${commit_hash}"
          echo "rel_version=${version}" >> $GITHUB_OUTPUT
          echo "nightly_label=${nightly_label}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            variant="${{ github.event.inputs.variant }}"
          else
            variant="all"
          fi

          variant="${variant:-all}"

          case "$variant" in
            all|default|data|jemalloc|mimalloc|sysalloc|nas)
              ;;
            *)
              echo "Unknown variant selection: $variant" >&2
              exit 1
              ;;
          esac

          echo "variant=${variant}" >> $GITHUB_OUTPUT
          echo "Preparing to publish nightly build with version: \"${version}\""

  build-arm64:
    needs: [check_commits, setup]
    if: needs.check_commits.outputs.has_new_commits == 'true' && github.event_name == 'schedule'

    runs-on: 'spiceai-dgx-spark-runners'
    env:
      SELECTED_VARIANT: ${{ needs.setup.outputs.variant }}
      RUST_PROFILE: ${{ github.event.inputs.profile_option || 'release-lto' }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Add nightly postfix to version in Cargo.toml
        env:
          NIGHTLY_LABEL: ${{ needs.setup.outputs.nightly_label }}
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$current_version" =~ -[a-zA-Z0-9]+(\.[0-9]+)*$ ]]; then
            new_version="${current_version}.$NIGHTLY_LABEL"
          else
            new_version="${current_version}-$NIGHTLY_LABEL"
          fi
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" Cargo.toml
          sed -i "s/version = \"${current_version}\"/version = \"${new_version}\"/g" Cargo.lock
          grep '^version =' Cargo.toml

      - name: Install docker
        run: |
          if command -v docker &>/dev/null; then
            echo "Docker already installed, skipping installation"
          else
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl gnupg lsb-release
            sudo mkdir -m 0755 -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/$(lsb_release -i | awk '{ print tolower($3) }') $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi

      - name: Start Docker service
        run: |
          if command -v systemctl &>/dev/null && ! docker info &>/dev/null 2>&1; then
            sudo systemctl start docker
            sudo systemctl status docker
          else
            echo "Docker service already running or not managed by systemd"
            docker info
          fi

      - name: chown /var/run/docker.sock to current user
        run: |
          if [ -S /var/run/docker.sock ] && ! docker info &>/dev/null 2>&1; then
            sudo chown $USER /var/run/docker.sock
          else
            echo "Docker socket already accessible"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: default
        run: |
          echo "IMAGE_TAG=default" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - &build-arm64-image
        name: Build ARM64 ${{ env.IMAGE_TAG }} image
        if: env.SELECTED_VARIANT == 'all' || env.SELECTED_VARIANT == env.IMAGE_TAG
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: Dockerfile.enterprise
          platforms: linux/arm64
          outputs: type=docker,name=localhost:5000/spiceai:${{ env.IMAGE_TAG }}-arm64,dest=/tmp/image-arm64-${{ env.IMAGE_TAG }}.tar
          cache-from: type=gha,scope=build-arm64
          cache-to: type=gha,scope=build-arm64,mode=max
          build-args: |
            REL_VERSION=${{ needs.setup.outputs.rel_version }}
            CARGO_FEATURES=${{ env.CARGO_FEATURES }}
            CARGO_NO_DEFAULT_FEATURES=${{ env.CARGO_NO_DEFAULT_FEATURES }}
            RUST_PROFILE=${{ env.RUST_PROFILE }}
      - name: data
        run: |
          echo "IMAGE_TAG=data" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,duckdb,postgres,postgres-accel,sqlite,mysql,flightsql,delta_lake,databricks,dremio,clickhouse,sharepoint,snapshots,snowflake,spark,ftp,sftp,debezium,kafka,anonymous_telemetry,mssql,dynamodb,imap,alloc-snmalloc,oracle,runtime/s3_vectors,mongodb,iceberg-write,pingora,scylladb,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=true" >> $GITHUB_ENV
      - *build-arm64-image
      - name: jemalloc
        run: |
          echo "IMAGE_TAG=jemalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-jemalloc,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-arm64-image
      - name: mimalloc
        run: |
          echo "IMAGE_TAG=mimalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-mimalloc,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-arm64-image
      - name: sysalloc
        run: |
          echo "IMAGE_TAG=sysalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-system,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-arm64-image
      - name: nas
        run: |
          echo "IMAGE_TAG=nas" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,nfs,smb,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-arm64-image
      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
        with:
          name: images-arm64
          path: /tmp/image-arm64-*.tar

  build-amd64:
    needs: [check_commits, setup]
    if: needs.check_commits.outputs.has_new_commits == 'true'

    runs-on: spicehq-dev-runners
    env:
      SELECTED_VARIANT: ${{ needs.setup.outputs.variant }}
      RUST_PROFILE: ${{ github.event.inputs.profile_option || 'release-lto' }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Add nightly postfix to version in Cargo.toml
        env:
          NIGHTLY_LABEL: ${{ needs.setup.outputs.nightly_label }}
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$current_version" =~ -[a-zA-Z0-9]+(\.[0-9]+)*$ ]]; then
            new_version="${current_version}.$NIGHTLY_LABEL"
          else
            new_version="${current_version}-$NIGHTLY_LABEL"
          fi
          sed -i "s/^version = \".*\"/version = \"${new_version}\"/" Cargo.toml
          sed -i "s/version = \"${current_version}\"/version = \"${new_version}\"/g" Cargo.lock
          grep '^version =' Cargo.toml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Enable docker driver for layer caching
          driver-opts: |
            image=moby/buildkit:latest

      - name: default
        run: |
          echo "IMAGE_TAG=default" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - &build-amd64-image
        name: Build AMD64 ${{ env.IMAGE_TAG }} image
        if: env.SELECTED_VARIANT == 'all' || env.SELECTED_VARIANT == env.IMAGE_TAG
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: Dockerfile.enterprise
          platforms: linux/amd64
          outputs: type=docker,name=localhost:5000/spiceai-enterprise-nightly:${{ env.IMAGE_TAG }}-amd64,dest=/tmp/image-amd64-${{ env.IMAGE_TAG }}.tar
          cache-from: type=gha,scope=build-amd64
          cache-to: type=gha,scope=build-amd64,mode=max
          build-args: |
            REL_VERSION=${{ needs.setup.outputs.rel_version }}
            CARGO_FEATURES=${{ env.CARGO_FEATURES }}
            CARGO_NO_DEFAULT_FEATURES=${{ env.CARGO_NO_DEFAULT_FEATURES }}
            RUST_PROFILE=${{ env.RUST_PROFILE }}
            INSTALL_ORACLE_ODPIC=true
      - name: data
        run: |
          echo "IMAGE_TAG=data" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,duckdb,postgres,postgres-accel,sqlite,mysql,flightsql,delta_lake,databricks,dremio,clickhouse,sharepoint,snapshots,snowflake,spark,ftp,sftp,debezium,kafka,anonymous_telemetry,mssql,dynamodb,imap,alloc-snmalloc,oracle,runtime/s3_vectors,mongodb,iceberg-write,pingora,scylladb,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=true" >> $GITHUB_ENV
      - *build-amd64-image
      - name: jemalloc
        run: |
          echo "IMAGE_TAG=jemalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-jemalloc,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-amd64-image
      - name: mimalloc
        run: |
          echo "IMAGE_TAG=mimalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-mimalloc,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-amd64-image
      - name: sysalloc
        run: |
          echo "IMAGE_TAG=sysalloc" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,alloc-system,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-amd64-image
      - name: nas
        run: |
          echo "IMAGE_TAG=nas" >> $GITHUB_ENV
          echo "CARGO_FEATURES=release,models,postgres-accel,nfs,smb,odbc,vortex" >> $GITHUB_ENV
          echo "CARGO_NO_DEFAULT_FEATURES=false" >> $GITHUB_ENV
      - *build-amd64-image
      - name: Upload AMD64 artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v5
        with:
          name: images-amd64
          path: /tmp/image-amd64-*.tar

  publish:
    needs: [check_commits, setup, build-amd64]
    if: needs.check_commits.outputs.has_new_commits == 'true' && (github.event_name == 'schedule' || inputs.publish)

    runs-on: ubuntu-22.04
    env:
      SELECTED_VARIANT: ${{ needs.setup.outputs.variant }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v6
        with:
          path: /tmp
          pattern: images-*
          merge-multiple: true

      - name: Verify artifacts
        run: |
          ls -l /tmp
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Start local registry
        run: |
          docker run -d -p 5000:5000 --restart=always --name registry registry:2

      - name: Login to GitHub Package Registry
        if: github.event_name == 'schedule' || inputs.publish
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Import images and create manifests
        env:
          REL_VERSION: ${{ needs.setup.outputs.rel_version }}
          PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          echo "REL_VERSION=${REL_VERSION}"
          echo "PUBLISH=${PUBLISH}"

          if [[ "${SELECTED_VARIANT}" == "all" ]]; then
            # Variants: default (models), data (no models), allocator variants, and nas (NFS support)
            variants=("default" "data" "jemalloc" "mimalloc" "sysalloc" "nas")
          else
            variants=("${SELECTED_VARIANT}")
          fi

          for variant in "${variants[@]}"; do
            suffix=""
            if [ "$variant" != "default" ]; then
              suffix="-${variant}"
            fi

            # Load both architecture images
            echo "Loading AMD64 image for ${variant}"
            docker load -i /tmp/image-amd64-${variant}.tar

            # Push images to local registry
            echo "Pushing images to local registry"
            docker push localhost:5000/spiceai-enterprise-nightly:${variant}-amd64

            if [[ "${PUBLISH}" == "true" ]]; then
              # Push to GitHub Container Registry
              echo "Pushing ${variant} to GHCR"
              docker buildx imagetools create \
                -t ghcr.io/spicehq/spiceai-enterprise-nightly:${REL_VERSION}${suffix} \
                -t ghcr.io/spicehq/spiceai-enterprise-nightly:latest${suffix} \
                localhost:5000/spiceai-enterprise-nightly:${variant}-amd64

              echo "Verifying GHCR image:"
              docker buildx imagetools inspect ghcr.io/spicehq/spiceai-enterprise-nightly:${REL_VERSION}${suffix}
            else
              echo "Skipping push for non-tag build"
              echo "Creating local manifest for testing:"
              docker buildx imagetools create \
                -t localhost:5000/spiceai-enterprise-nightly:latest${suffix} \
                localhost:5000/spiceai-enterprise-nightly:${variant}-amd64

              docker buildx imagetools inspect localhost:5000/spiceai-enterprise-nightly:latest${suffix}
            fi
          done

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        if: github.event_name == 'schedule' || inputs.publish
        with:
          fetch-depth: 0

      - name: Update nightly tag
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git tag -f nightly
          git push origin nightly --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get spicehq scoped GitHub access token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
        id: github-app-token
        with:
          app-id: ${{ secrets.SPICEHQ_INTERNAL_GITHUB_APP_ID }}
          private-key: ${{ secrets.SPICEHQ_INTERNAL_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ai-platform

      # triggers https://github.com/spicehq/ai-platform/actions/workflows/publish-spiceai-enterprise-nightly.yaml workflow
      - name: Trigger platform images promotion
        if: github.event_name == 'schedule' || inputs.publish
        env:
          GITHUB_TOKEN: ${{ steps.github-app-token.outputs.token }}
          REL_VERSION: ${{ needs.setup.outputs.rel_version }}
        run: |
          # create and push current nightly tag
          if git ls-remote --tags origin | grep -q "${{ env.REL_VERSION }}$"; then
            echo "Tag ${{ env.REL_VERSION }} already exists. Skipping tag creation."
          else
            git config --global user.name 'Spice Nightly Bot'
            git config --global user.email 'nightly-bot@spice.ai'
            git tag "nightly-${{ env.REL_VERSION }}"
            git push origin "nightly-${{ env.REL_VERSION }}"
          fi

          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            /repos/spicehq/ai-platform/dispatches \
            -f 'event_type=publish-spiceai-enterprise-nightly' \
            -F "client_payload[tag]=${{ env.REL_VERSION }}"
