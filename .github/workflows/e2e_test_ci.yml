name: E2E Test CI

on:
  push:
    branches:
      - trunk
      - release-*
      - release/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*

  merge_group:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*

  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests, including credentialed BigQuery regression tests'
        type: boolean
        required: false
        default: false

concurrency:
  # A newer run cancels the one in progress for the same pull request, merge group, non-trunk
  # branch or manually dispatched trunk commit. Trunk pushes share one group and never cancel
  # the running build on `spiceai-macos-large`: a newer push replaces only the run still waiting.
  # The trunk commit is the merge-group commit that already passed this workflow;
  # the jobs that run only on push cover the first and latest commit of a burst of merges.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ (github.ref_name == 'trunk' && github.event_name != 'push') && github.sha || 'any-sha' }}
  cancel-in-progress: ${{ github.ref_name != 'trunk' || github.event_name != 'push' }}

env:
  # The CI cache's anonymous read URL (.github/ci-cache/README.md). setup-rust and
  # install-cargo-deny read pinned downloads from it, falling back to the source; empty
  # where the repository has no CI object store, which turns the cache off.
  CI_CACHE_URL: ${{ vars.TEST_MINIO_ENDPOINT && format('{0}/ci-cache', vars.TEST_MINIO_ENDPOINT) || '' }}
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true

# Least privilege by default; a job that needs more declares its own block.
permissions:
  contents: read

jobs:
  # Skip the expensive E2E matrix on merge groups that don't touch code (docs,
  # etc.). `build_linux` and `build_macos` — one of which every test job depends on —
  # are gated on this, so the whole matrix cascades to "skipped" while the E2E Test CI
  # gate still reports.
  check_changes:
    environment: secret-free
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: spiceai-dev-runners
    # Every job here is bounded, because on a `merge_group` run an unbounded one does not
    # just waste a job: the queue candidate stays `AWAITING_CHECKS` for GitHub's 6-hour
    # default and every entry behind it waits (#12717). A full-history checkout is the
    # slow part of this one.
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists this workflow's merge-queue runs and their jobs (the step below).
      actions: read
    outputs:
      relevant_changes: ${{ steps.check.outputs.relevant_changes == 'true' || github.event_name == 'workflow_dispatch' }}
      # `true` on a push whose commit a merge-queue run of this workflow already built and
      # passed. Every job that also runs in the merge queue skips such a push; see the step.
      merge_queue_passed: ${{ steps.merge_queue.outputs.result == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for code changes
        id: check
        uses: $/.github/actions/check-code-changes

      # The merge queue merges the commit it tested, so a push to trunk or a release
      # branch is normally a commit a `merge_group` run of this workflow already built and
      # passed, with the same workflow file. Running the merge-queue jobs on it again
      # repeats their answer and holds a second set of runners for it. A push is spared
      # them only when such a run is found and both of its builds succeeded, so a run
      # that skipped its tests for want of code changes does not count; a commit that
      # reached the branch another way (an administrator merge, a direct push) runs them
      # all. The push-only jobs and the build, which saves trunk's Rust cache and serves
      # the build artifacts later workflows read, run either way.
      - name: Find the merge-queue run that already tested this commit
        id: merge_queue
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            // GITHUB_WORKFLOW_REF is `owner/repo/.github/workflows/<file>@<ref>`.
            const workflowFile = process.env.GITHUB_WORKFLOW_REF.split('@')[0].split('/').pop();
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: workflowFile,
              event: 'merge_group',
              head_sha: context.sha,
              status: 'success',
              per_page: 10,
            });
            for (const run of data.workflow_runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });
              const builds = jobs.filter((job) => /^Build .* binaries$/.test(job.name));
              if (builds.length > 0 && builds.every((job) => job.conclusion === 'success')) {
                core.notice(`Merge-queue run ${run.html_url} already built and passed ${context.sha}, so the jobs that run in the merge queue are skipped on this push.`);
                return 'true';
              }
            }
            core.info(`No passing merge-queue run of ${workflowFile} built ${context.sha}, so every job runs.`);
            return 'false';

  setup-matrix:
    environment: secret-free
    name: Setup strategy matrix
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: spiceai-dev-runners
    # One `github-script` step returning a literal, so anything past a minute is a stuck
    # runner rather than slow work.
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: "Linux x64",
                runner: "ubuntu-latest",
                target_os: "linux",
                target_arch: "x86_64"
              }, {
                name: "macOS aarch64 (Apple Silicon)",
                // The macOS test legs run on the same pool as the model tests. Several
                // runner instances share each of its hosts and one user, so a leg installs
                // `spice` into its own directory and binds ports of its own, and a job that
                // needs a database installed on the host runs on Linux only.
                runner: "spiceai-macos-large",
                target_os: "darwin",
                target_arch: "aarch64"
              }
            ];

            const isPrEvent = context.eventName === 'pull_request';
            return isPrEvent ? matrix.slice(0, 1) : matrix;

  # One build job per platform rather than one matrix job: a job that `needs` a matrix
  # job waits for every leg of it, so a test that runs on one platform would wait for the
  # other platform's build as well. Tests that run only on Linux (spicescript among them)
  # need `build_linux`, tests that run only on macOS need `build_macos`, and tests whose
  # matrix covers both platforms need both.
  build_linux:
    name: Build Linux x64 binaries
    runs-on: spiceai-dev-runners
    environment: ci
    needs: check_changes
    if: ${{ needs.check_changes.outputs.relevant_changes == 'true' }}
    # A backstop above the compile step's own bound below, leaving room for the artifact
    # upload and the post steps.
    timeout-minutes: 200
    env:
      # `http-functions` for test/spicescript/secret-redaction.yaml, which registers
      # remote functions.
      E2E_SPICED_FEATURES: 'tpc-extension,models,http-functions'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      # rust-cache names its entry after the job id unless `shared-key` is set. Trunk pushes
      # save this entry and merge groups restore it, so a new job id would leave every
      # merge group with no entry to restore until a trunk push saved one under the new
      # name. `build` is the id this job had while it was one leg of a matrix, so the key
      # stays `v0-rust-build-Linux-x64-…`, the entry trunk already saves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      - name: Set up make
        uses: $/.github/actions/setup-make

      - name: Set up cc
        uses: $/.github/actions/setup-cc

      - name: Install Protoc
        uses: $/.github/actions/install-protoc

      # No compiler cache. rust-cache above restores the dependencies, and the time goes to
      # the workspace crates a commit changes and everything built on them, which no cache
      # can serve: in a `merge_group` run with sccache, 98.6% of cacheable compiles hit and
      # `spiced` still took 57 min, against 54 min the same day with rust-cache alone. The
      # cache needs RustFS credentials, so an OIDC token (`id-token: write`) in the job
      # that runs every dependency's build script, and it bought no time for that.
      - name: Build spiced and spice CLI
        # 65 minutes was the slowest this build had taken across ten successful `merge_group`
        # runs when the bound was set; on 2026-08-28 that worst case moved. Four consecutive
        # `merge_group` runs hit 90 minutes with only the last few crates left, on four
        # different runners, each restoring the same rust-cache entry (full match) with the
        # disk preflight reporting 40 TiB free and no compile error anywhere in the log.
        # The same PR had built in 39 minutes ninety minutes earlier, on a batch carrying
        # strictly more code, so the slowdown is not the diff: measured phase by phase the
        # work ran ~2.5x slower throughout (cache restore 3m14s -> 5m19s, the `runtime`
        # crate ~21m -> ~48m), which is what a contended pool looks like.
        #
        # A legitimate contended build therefore needs ~100 minutes, and firing at 90 costs
        # the queue more than waiting does: it discards a nearly finished compile, dequeues
        # the PR, and makes the queue re-run the whole batch chain, adding load to the pool
        # that caused the slowdown in the first place. 150 keeps roughly the margin over
        # worst-observed that the macOS build below uses, and stays clear of the job's 200
        # so that a wedge here is cut by *this step* — which attributes the failure to the
        # compile — rather than by the job bound, which GitHub renders as the whole job
        # being cancelled.
        timeout-minutes: 150
        id: build
        uses: $/.github/actions/build-spiced
        with:
          features: ${{ env.E2E_SPICED_FEATURES }}
          build_cli: 'true'
          upload_artifact: 'true'
          artifact_name: build_linux_x86_64
          # This run's test jobs use the binaries, and so does trunk_tests.yml,
          # which runs every 12 hours and tests the merge queue's build of trunk
          # HEAD rather than building it again. Three days covers a missed or
          # late run; at the repository's 30-day default each run kept its two
          # builds (~600 MiB) stored for a month.
          artifact_retention_days: '3'

      # The repository's `make install`, `make install-cli` and `make install-spiced`
      # targets (CONTRIBUTING.md), run on the binaries just built. Each is the same cargo
      # command as the build above, with the same features, profile and target directory,
      # so cargo has nothing to compile; a `Compiling` line means the two invocations have
      # drifted apart and this step would be paying for a second build, so it fails
      # instead. `HOME` points at a directory of this job's own, so the install does not
      # replace the `~/.spice/bin` that other runner instances on a shared host use;
      # `CARGO_HOME` and `RUSTUP_HOME` are pinned first, since they default to `HOME`.
      - name: Check the make install targets
        timeout-minutes: 10
        env:
          CARGO_TARGET_DIR: ${{ steps.build.outputs.target_dir }}
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          MISTRALRS_METAL_PRECOMPILE: 0
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="${RUNNER_TEMP:?}/make-install-home"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          log="${RUNNER_TEMP}/make-install.log"
          : > "$log"
          for target in install install-cli install-spiced; do
            echo "::group::make $target"
            make "$target" SPICED_NON_DEFAULT_FEATURES="$E2E_SPICED_FEATURES" 2>&1 | tee -a "$log"
            echo "::endgroup::"
          done
          if grep -E '^[[:space:]]*Compiling ' "$log"; then
            echo "::error::make install recompiled the crates above, so its cargo invocation no longer matches the build-spiced action's (features, profile, target directory or environment). Make them match again; otherwise every merge group builds spiced twice."
            exit 1
          fi
          bin="$HOME/.spice/bin"
          "$bin/spiced" --version
          "$bin/spice" version --output json | tee "${RUNNER_TEMP}/spice-version.json"
          python3 - "$bin/spiced" "${RUNNER_TEMP}/spice-version.json" <<'PY'
          import json, sys
          want, path = sys.argv[1], sys.argv[2]
          got = json.load(open(path))
          if got.get("runtime_path") != want or not got.get("runtime"):
              sys.exit(f"::error::the installed spice CLI did not find and run the installed spiced at {want}: {got}")
          PY

  build_macos:
    name: Build macOS aarch64 (Apple Silicon) binaries
    # `spiceai-macos-large` on every event, trunk pushes included. A three-hour build on a
    # `spiceai-macos` mini runs past its 180-minute step bound where the host is shared
    # (#14557), and starves the short macOS test jobs that sit on that pool to avoid
    # exactly this neighbour (#13761).
    runs-on: spiceai-macos-large
    environment: ci
    needs: check_changes
    if: ${{ needs.check_changes.outputs.relevant_changes == 'true' }}
    # A backstop above the compile step's own 180-minute bound below, leaving room for the
    # artifact upload and the post steps, so that a wedged compile is cut by its own bound
    # while the `always()` diagnostics after it can still run.
    timeout-minutes: 200
    # No `permissions:` block, so the workflow's `contents: read`: this job runs every
    # dependency's build script, so it holds no OIDC token (`id-token: write`). The macOS
    # model tests, which exchange one for OpenAI access, run in `test_macos`.
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}
      E2E_SPICED_FEATURES: 'tpc-extension,models,http-functions,metal'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Rust
        uses: $/.github/actions/setup-rust

      # No rust-cache here. This pool's self-hosted runner instances share one user, so one
      # `~/.cargo`, and rust-cache's save step deletes every file it found in
      # `~/.cargo/bin` when it restored — the rustup proxies (`cargo`, `rustc`,
      # `rustup`) included. A trunk push saving the cache therefore pulls `cargo` out
      # from under whatever job a sibling instance on the same Mac is running, which
      # then fails `cargo: command not found` (exit 127) mid-build. Nothing is lost by
      # skipping it: `~/.cargo` and `target/` persist on those hosts and sccache serves
      # the compile, while the restore of this multi-GB cache spends up to ten minutes
      # before it lands or gives up.

      - name: Install Protoc
        uses: $/.github/actions/install-protoc

      - name: Set up spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@6b5eff2b2c10111ba66076dd8fe9abfb87b6a1fc # spiceio#49 merge on trunk (same action tree as orphaned dd13a600); v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1
          immutable-objects: "true"
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Build spiced and spice CLI (macOS)
        # This is the step that wedged for over 4.5 hours and held four queue candidates
        # behind it (#12717). 138 minutes is its slowest successful `merge_group` run of
        # the last ten (74-138); the self-hosted macOS pool puts several runner instances
        # on one host, which is where that factor-of-two spread comes from, so the bound
        # sits well clear of it rather than close to the median.
        timeout-minutes: 180
        id: build
        uses: $/.github/actions/build-spiced
        with:
          features: ${{ env.E2E_SPICED_FEATURES }}
          build_cli: 'true'
          upload_artifact: 'true'
          artifact_name: build_darwin_aarch64
          artifact_retention_days: '1'
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      # The repository's `make install`, `make install-cli` and `make install-spiced`
      # targets (CONTRIBUTING.md), run on the binaries just built. Each is the same cargo
      # command as the build above, with the same features, profile and target directory,
      # so cargo has nothing to compile; a `Compiling` line means the two invocations have
      # drifted apart and this step would be paying for a second build, so it fails
      # instead. `HOME` points at a directory of this job's own, so the install does not
      # replace the `~/.spice/bin` that other runner instances on a shared host use;
      # `CARGO_HOME` and `RUSTUP_HOME` are pinned first, since they default to `HOME`.
      - name: Check the make install targets
        timeout-minutes: 10
        env:
          CARGO_TARGET_DIR: ${{ steps.build.outputs.target_dir }}
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true
          MISTRALRS_METAL_PRECOMPILE: 0
        run: |
          set -euo pipefail
          export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
          export HOME="${RUNNER_TEMP:?}/make-install-home"
          rm -rf "$HOME"
          mkdir -p "$HOME"
          log="${RUNNER_TEMP}/make-install.log"
          : > "$log"
          for target in install install-cli install-spiced; do
            echo "::group::make $target"
            make "$target" SPICED_NON_DEFAULT_FEATURES="$E2E_SPICED_FEATURES" 2>&1 | tee -a "$log"
            echo "::endgroup::"
          done
          if grep -E '^[[:space:]]*Compiling ' "$log"; then
            echo "::error::make install recompiled the crates above, so its cargo invocation no longer matches the build-spiced action's (features, profile, target directory or environment). Make them match again; otherwise every merge group builds spiced twice."
            exit 1
          fi
          bin="$HOME/.spice/bin"
          "$bin/spiced" --version
          "$bin/spice" version --output json | tee "${RUNNER_TEMP}/spice-version.json"
          python3 - "$bin/spiced" "${RUNNER_TEMP}/spice-version.json" <<'PY'
          import json, sys
          want, path = sys.argv[1], sys.argv[2]
          got = json.load(open(path))
          if got.get("runtime_path") != want or not got.get("runtime"):
              sys.exit(f"::error::the installed spice CLI did not find and run the installed spiced at {want}: {got}")
          PY

      # spicescript for `test_macos`'s macos-smoke scripts. Built here rather than there:
      # this job holds no OIDC token, while `test_macos` holds OpenAI's, and a build runs
      # every dependency's build script. The same profile and target directory as spiced,
      # so it reuses the dependencies that build just compiled.
      - name: Build spicescript (macOS)
        id: build-spicescript
        timeout-minutes: 30
        env:
          CARGO_TARGET_DIR: ${{ steps.build.outputs.target_dir }}
          CARGO_INCREMENTAL: 0
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: |
          cargo build --release -p spicescript
          mkdir -p "$RUNNER_TEMP/spicescript-bin"
          cp "$CARGO_TARGET_DIR/release/spicescript" "$RUNNER_TEMP/spicescript-bin/spicescript"

      - name: Upload spicescript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spicescript_darwin_aarch64
          path: ${{ runner.temp }}/spicescript-bin/spicescript
          retention-days: 1

      - name: Show sccache stats
        if: always() && env.SCCACHE_SETUP == 'true'
        # `always()`: this is the one step that reports cache health, and without it
        # it is skipped on exactly the failures it would explain (#12420). The `||`
        # keeps a diagnostic from ever deciding a verdict — when the cache backend is
        # gone `--show-stats` cannot answer either, and that is itself the finding.
        run: |
          sccache --show-stats || echo "::warning::sccache --show-stats failed, so the cache server is not answering either. Read a build failure in this job as a possible cache-backend outage rather than a code failure."

      - name: Kill spiceio
        if: always() && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      # Pull request and merge-queue checks keep no diagnostic artifacts.
      - name: Upload spiceio logs
        if: always() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spiceio-e2e-build-logs
          path: ${{ runner.temp }}/spiceio.log
          if-no-files-found: ignore

  test-bigquery:
    # Holds the BigQuery workload identity federation settings (`BIGQUERY_*` secrets).
    environment: ci
    name: BigQuery Regression Tests
    needs: build_linux
    if: ${{ inputs.run_all_tests }}
    runs-on: spiceai-dev-runners
    timeout-minutes: 90
    permissions:
      contents: read
      # Exchanged for Google Cloud access tokens for the BigQuery tests: workload identity federation.
      id-token: write
    env:
      SPICED_BIN: ${{ github.workspace }}/build/spiced
      ADBC_BIGQUERY_DRIVER_PATH: /etc/adbc/drivers/libadbc_driver_bigquery.so
      # The workload identity federation credential names no project.
      BIGQUERY_PROJECT_ID: spiceai-testing
      BIGQUERY_TEST_CLEANUP: always
      BIGQUERY_EXPECT: single
    steps:
      - name: Set test output paths
        id: test_env
        shell: bash
        run: |
          set -euo pipefail
          printf 'BIGQUERY_GATE_OUTPUT=%s/bigquery-regression-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf 'BIGQUERY_GATE_VENV=%s/bigquery-regression-venv-%s-%s\n' \
            "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up BigQuery credentials (workload identity federation)
        uses: $/.github/actions/bigquery-credentials
        with:
          workload-identity-provider: ${{ secrets.BIGQUERY_WIF_PROVIDER }}
          service-account: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}

      - name: Download Linux runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_linux_x86_64
          path: ./build

      - name: Prepare runtime artifact
        run: |
          chmod +x "$SPICED_BIN"
          "$SPICED_BIN" --version

      - name: Set up ADBC BigQuery driver
        uses: $/.github/actions/setup-adbc-bigquery

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install BigQuery test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$BIGQUERY_GATE_VENV"
          "$BIGQUERY_GATE_VENV/bin/python" -m pip install google-cloud-bigquery==3.38.0

      - name: Validate the BigQuery corpus harness
        run: '"$BIGQUERY_GATE_VENV/bin/python" test/scripts/bigquery_corpus.py --self-test'

      - name: Run BigQuery regression tests
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BIGQUERY_GATE_OUTPUT"
          failed=0
          for suite in corpus federation pushdown json_pushdown; do
            if ! BIGQUERY_TEST_OUTPUT="$BIGQUERY_GATE_OUTPUT/$suite" \
              "$BIGQUERY_GATE_VENV/bin/python" "test/scripts/bigquery_${suite}.py"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload BigQuery test evidence
        if: ${{ always() && steps.test_env.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bigquery-regression-evidence
          path: ${{ env.BIGQUERY_GATE_OUTPUT }}
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove the test Python environment
        if: ${{ always() && steps.test_env.outcome == 'success' }}
        shell: bash
        run: rm -rf -- "$BIGQUERY_GATE_VENV"

  setup-model-matrix:
    environment: secret-free
    name: Setup model strategy matrix
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}
    steps:
      - name: Set up matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: "Linux x64",
                runner: "spiceai-dev-runners",
                target_os: "linux",
                target_arch: "x86_64"
              }
              // No macOS leg: `test_macos` runs both macOS model tests in one
              // job, which waits for one `spiceai-macos-large` runner rather than one
              // per model.
            ];

            const isPrEvent = context.eventName === 'pull_request';
            return isPrEvent ? matrix.slice(0, 1) : matrix;

  test_openai_model:
    name: 'openai model (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    # A backstop for the whole job, so it has to clear this job's own setup — artifact
    # download and CLI install on the self-hosted pool — before the steps' bounded waits
    # (60s readiness, then 30s/30s/60s inside the expect scripts) can report anything
    # (#12644).
    timeout-minutes: 10
    runs-on: ${{ matrix.target.runner }}
    needs:
      - build_linux
      - setup-model-matrix
      - check_changes
    if: ${{ needs.setup-model-matrix.outputs.matrix != '[]' && needs.check_changes.outputs.merge_queue_passed != 'true' }}
    # Holds the OpenAI workload identity federation IDs (`OPENAI_*` secrets).
    environment: ci
    permissions:
      contents: read
      actions: read
      # The Spicepod's `github:` dataset reads this repository's issues with `GITHUB_TOKEN`.
      issues: read
      pull-requests: read
      # Exchanged for OpenAI access tokens: workload identity federation.
      id-token: write
    env:
      # Workload identity federation: spiced and the tests exchange this job's GitHub OIDC token
      # for provider access tokens with these IDs, and exchange again before each expires.
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-model-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Init spice app
        run: |
          cp ./test/models/spicepod_openai.yml ./spicepod.yaml
          cat ./spicepod.yaml

      # This job runs on the self-hosted pool, where several runner instances
      # share one host and therefore one network namespace, so spiced's default
      # 8090/50051 cannot be assumed free (#12419).
      - name: Allocate Spice runtime ports
        uses: $/.github/actions/allocate-spice-ports

      - name: Start spice runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &

      - name: Wait for Spice runtime is ready
        uses: $/.github/actions/wait-for-spice-ready
        with:
          url: ${{ env.SPICE_HTTP_ENDPOINT }}/v1/ready
          timeout: '60'

      - name: Configure apt mirrors (Linux)
        if: matrix.target.target_os == 'linux'
        uses: $/.github/actions/configure-apt

      - name: Install expect (linux)
        if: matrix.target.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y expect

      - name: Test the expect scripts driving the REPLs
        run: |
          ./test/models/expect_test.sh

      - name: Test vector search
        run: |
          ./test/models/search_01.exp

      - name: Test chat
        run: |
          ./test/models/chat_01.exp

      - name: Stop spice and check logs
        if: always()
        uses: $/.github/actions/stop-spice

  # Both macOS model tests, in one job on the binaries `build_macos` uploaded. As a job
  # each, both waited for a `spiceai-macos-large` runner after the build (45-51 min at p90
  # for a 4-minute test, merge_group, 2026-11-11..18); one job waits once. They are not
  # steps of `build_macos`: they need `id-token: write` to exchange this job's GitHub OIDC
  # token for OpenAI access, and that job runs every dependency's build script.
  test_macos:
    name: 'macOS: models and spicescript smoke (darwin-aarch64)'
    # A self-hosted Mac for Metal and for the Hugging Face cache in `$HOME`. One job for
    # every macOS test: the macOS pool is the merge queue's critical path, and each job
    # spends a minute or more downloading the build and installing `spice` before it
    # tests anything, so separate jobs cost runner requests rather than coverage.
    runs-on: spiceai-macos-large
    # Holds the OpenAI workload identity federation IDs (`OPENAI_*` secrets).
    environment: ci
    needs:
      - build_macos
      - check_changes
    if: ${{ needs.check_changes.outputs.merge_queue_passed != 'true' }}
    # A backstop above the steps' own bounds (46 minutes: six 5-minute model step bounds,
    # the 60 s and 300 s readiness waits, and 10 minutes for the spicescript scripts),
    # leaving room for the checkout, the artifact downloads and the CLI install, so that
    # a wedged step is cut by its own bound and named.
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      # The model tests' Spicepods read this repository's issues with `GITHUB_TOKEN`.
      issues: read
      pull-requests: read
      # Exchanged for OpenAI access tokens: workload identity federation.
      id-token: write
    env:
      # Workload identity federation: spiced and the OpenAI model tests exchange this job's
      # GitHub OIDC token for provider access tokens with these IDs, and exchange again
      # before each expires.
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: download artifacts - build_darwin_aarch64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_darwin_aarch64
          path: ./build

      # The model tests: `spiced` from `build_macos` against one Spicepod each, driven
      # through the REPL expect scripts. Every wait inside them is bounded (readiness, then
      # the scripts' idle timeouts), so a host starved by a neighbouring job fails a step
      # rather than slowing it (#13761). The step bounds stand in for the 10-minute bound
      # each had as a job of its own (#12644). Each model runs whatever the other model and
      # the expect scripts' own tests did, so one failure does not hide another's result;
      # each step needs only the previous step of its own model to have passed.
      - name: Install spice
        id: install-spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      # Once for both models: it drives stand-in processes rather than `spiced`, so it needs
      # no runtime and its result is the same whichever model is configured. Run once per
      # model it took 2m41s each time.
      - name: 'model tests: test the expect scripts driving the REPLs'
        timeout-minutes: 5
        run: |
          ./test/models/expect_test.sh

      - name: 'openai model: init spice app'
        id: openai-init
        if: ${{ !cancelled() && steps.install-spice.outcome == 'success' }}
        run: |
          cp ./test/models/spicepod_openai.yml ./spicepod.yaml
          cat ./spicepod.yaml

      # Several runner instances share one host and therefore one network namespace, so
      # spiced's default 8090/50051 cannot be assumed free (#12419).
      - name: 'openai model: allocate Spice runtime ports'
        id: openai-ports
        if: ${{ !cancelled() && steps.openai-init.outcome == 'success' }}
        uses: $/.github/actions/allocate-spice-ports

      - name: 'openai model: start spice runtime'
        id: openai-start
        if: ${{ !cancelled() && steps.openai-ports.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &

      - name: 'openai model: wait for Spice runtime to be ready'
        id: openai-ready
        if: ${{ !cancelled() && steps.openai-start.outcome == 'success' }}
        uses: $/.github/actions/wait-for-spice-ready
        with:
          url: ${{ env.SPICE_HTTP_ENDPOINT }}/v1/ready
          timeout: '60'

      - name: 'openai model: test vector search'
        id: openai-search
        if: ${{ !cancelled() && steps.openai-ready.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          ./test/models/search_01.exp

      - name: 'openai model: test chat'
        if: ${{ !cancelled() && steps.openai-search.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          ./test/models/chat_01.exp

      - name: 'openai model: stop spice and check logs'
        if: always() && steps.openai-start.outcome != 'skipped'
        uses: $/.github/actions/stop-spice

      - name: 'huggingface model: init spice app'
        id: hf-init
        if: ${{ !cancelled() && steps.install-spice.outcome == 'success' }}
        run: |
          cp ./test/models/spicepod_hf.yml ./spicepod.yaml
          cat ./spicepod.yaml

      - name: 'huggingface model: authenticate the Hugging Face cache'
        id: hf-auth
        if: ${{ !cancelled() && steps.hf-init.outcome == 'success' }}
        uses: $/.github/actions/hf-cache-auth
        with:
          token: ${{ secrets.SPICE_SECRET_HF_TOKEN }}

      # Fail here, in seconds and by name, rather than as an unexplained five-minute
      # readiness timeout. The retries ride out the transient per-IP 401/429 responses
      # the pool draws from the Hub; this retries a *download*, never an assertion.
      - name: 'huggingface model: pre-flight the Hugging Face components'
        id: hf-preflight
        if: ${{ !cancelled() && steps.hf-auth.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          set -uo pipefail

          repos="$(sed -n 's|^[[:space:]]*-\{0,1\}[[:space:]]*from:[[:space:]]*huggingface:huggingface\.co/\([^[:space:]]*\).*$|\1|p' ./spicepod.yaml)"
          if [ -z "${repos}" ]; then
            echo "No Hugging Face components in the spicepod; nothing to pre-flight."
            exit 0
          fi

          # The same token spiced will use: `HF_TOKEN`, else the runner's token file.
          token="${HF_TOKEN:-}"
          token_file="${HOME}/.cache/huggingface/token"
          if [ -z "${token}" ] && [ -s "${token_file}" ]; then
            token="$(cat "${token_file}")"
          fi

          # The token goes to curl through a config on stdin rather than an -H argument,
          # so it never appears in this process's argv. `printf` is a shell builtin, so
          # it spawns nothing that could carry it either. curl drops the header on a
          # cross-host redirect by default, which is what keeps `-L` safe here.
          probe() {
            if [ -n "${token}" ]; then
              printf 'header = "Authorization: Bearer %s"\n' "${token}" |
                curl -K - -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$1" 2>/dev/null
            else
              curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$1" 2>/dev/null
            fi
          }

          rc=0
          while IFS= read -r component; do
            [ -n "${component}" ] || continue

            # A spicepod pins a revision by joining it onto the repo id as
            # `org/model:revision` — both `models` and `embeddings` do, and
            # `split_hf_model_id` in crates/spicepod exists to undo that join before a
            # loader talks to the Hub. The Hub has no repo under the joined name: a
            # revision is a path segment, `<repo>/resolve/<revision>/…`. So probing the
            # joined string asks for a repo that does not exist, which the Hub answers
            # 404 with a token and 401 without — and both land in a branch below that
            # blames the Hub or a quota rather than this URL. Undo the join here too.
            repo_id="${component%%:*}"
            revision="${component#*:}"
            if [ "${revision}" = "${component}" ] || [ -z "${revision}" ]; then
              revision=main
            fi
            url="https://huggingface.co/${repo_id}/resolve/${revision}/config.json"

            code=""
            for attempt in 1 2 3 4 5; do
              code="$(probe "${url}")" || code="000"
              if [ "${code}" -lt 400 ] 2>/dev/null; then
                echo "  ok    ${component} @ ${revision} (HTTP ${code}, attempt ${attempt})"
                break
              fi
              echo "  retry ${component} @ ${revision}: HTTP ${code} (attempt ${attempt}/5)"
              sleep $((attempt * 3))
            done

            if ! { [ "${code}" -lt 400 ]; } 2>/dev/null; then
              case "${code}" in
                401|403)
                  echo "::error::Hugging Face returned ${code} for ${component} after 5 attempts (${url}). This is a Hub access/quota failure, not a code failure in this branch — anonymous downloads share a per-IP quota across the whole self-hosted pool. Set the SPICE_SECRET_HF_TOKEN secret, or run 'huggingface-cli login' on the runner." ;;
                429)
                  echo "::error::Hugging Face rate-limited ${component} (429) after 5 attempts (${url}). Not a code failure in this branch." ;;
                404)
                  echo "::error::Hugging Face has no ${repo_id} at revision ${revision} (404, ${url}). Unlike the other codes here this one is about the spicepod: check the repo id and the pinned revision." ;;
                *)
                  echo "::error::Could not reach Hugging Face for ${component} (HTTP ${code}) after 5 attempts (${url}). Not a code failure in this branch." ;;
              esac
              rc=1
            fi
          # A here-string, not a pipe: a pipe would run the loop in a subshell and `rc`
          # would never make it back out, so every failure would exit 0.
          done <<< "${repos}"

          exit "${rc}"

      - name: 'huggingface model: allocate Spice runtime ports'
        id: hf-ports
        if: ${{ !cancelled() && steps.hf-preflight.outcome == 'success' }}
        uses: $/.github/actions/allocate-spice-ports

      - name: 'huggingface model: start spice runtime'
        id: hf-start
        if: ${{ !cancelled() && steps.hf-ports.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &

      - name: 'huggingface model: wait for Spice runtime to be ready'
        id: hf-ready
        if: ${{ !cancelled() && steps.hf-start.outcome == 'success' }}
        uses: $/.github/actions/wait-for-spice-ready
        with:
          url: ${{ env.SPICE_HTTP_ENDPOINT }}/v1/ready
          timeout: '300'

      - name: 'huggingface model: test vector search'
        id: hf-search
        if: ${{ !cancelled() && steps.hf-ready.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          ./test/models/search_01.exp

      # No step retry: in merge-queue job 103597842965 a fixed 30s budget ran out
      # while Qwen2.5-3B was still streaming a long answer on Metal, not on a
      # Hub download (config probe HTTP 200; `search_01.exp` had already
      # passed). The REPL scripts bound silence rather than total response
      # time (90s, override with SPICE_REPL_IDLE_TIMEOUT) and spicepod_hf.yml
      # caps hf_max_completion_tokens at 64. A stall after that is a hang.
      - name: 'huggingface model: test chat'
        if: ${{ !cancelled() && steps.hf-search.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          ./test/models/chat_01_simple.exp

      - name: 'huggingface model: stop spice and check logs'
        if: always() && steps.hf-start.outcome != 'skipped'
        uses: $/.github/actions/stop-spice

      # The scenario scripts tagged `macos-smoke`: they need no Docker (their sources are
      # `files`, `mock-http`, `duckdb` or none), which this pool does not have. Every other script
      # runs on Linux, in `test_spicescript`. They run whatever the model tests did.
      # Built by `build_macos`, which holds no credentials (see its build step).
      - name: 'spicescript: download'
        id: spicescript
        if: ${{ !cancelled() && steps.install-spice.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spicescript_darwin_aarch64
          path: ${{ runner.temp }}/spicescript-bin

      # Several runner instances share each host; spicescript binds free ports and keeps
      # its work under this job's temporary directory.
      - name: 'spicescript: run the macos-smoke scripts'
        if: ${{ !cancelled() && steps.spicescript.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          chmod +x "$RUNNER_TEMP/spicescript-bin/spicescript"
          "$RUNNER_TEMP/spicescript-bin/spicescript" --jobs 2 \
            --only-tag macos-smoke \
            --spiced "$(command -v spiced)" \
            --spice-cli "$(command -v spice)" \
            --work-dir "$RUNNER_TEMP/spicescript" \
            --results "$RUNNER_TEMP/spicescript-macos-results.json" \
            --log-capture "$RUNNER_TEMP/spicescript-logs" \
            test/spicescript

      # Not `spicescript-results-*`: update_durations.py reads those for the Linux
      # shards' durations.
      - name: 'spicescript: upload script results'
        if: ${{ !cancelled() && steps.spicescript.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spicescript-macos-results
          path: ${{ runner.temp }}/spicescript-macos-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 'spicescript: upload captured logs'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spicescript-macos-logs
          path: ${{ runner.temp }}/spicescript-logs
          if-no-files-found: ignore
          retention-days: 7

  test_quickstart_dremio:
    environment: secret-free
    name: 'Test Dremio quickstart (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    runs-on: ${{ matrix.target.runner }}
    # run quickstart with external service dependency only on manual trigger
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs:
      - build_linux
      - build_macos
      - setup-matrix
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Init spice app
        run: |
          spice init test_app

      - name: Connect Dremio
        working-directory: test_app
        run: |
          spice login dremio -u demo -p demo1234

      # The macOS leg shares its host with other jobs' runtimes, so spiced's default
      # 8090/50051 cannot be assumed free (#12419). The actions below read these ports.
      - name: Allocate Spice runtime ports
        uses: $/.github/actions/allocate-spice-ports

      - name: Start spice runtime
        working-directory: test_app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &
          # time to initialize added dataset
          sleep 10

      - name: Wait for Spice runtime healthy
        working-directory: test_app
        timeout-minutes: 1
        run: |
          while [[ "$(curl -s "${SPICE_HTTP_ENDPOINT}/health")" != "ok" ]]; do sleep 1; done

      - name: Add spiceai/quickstart
        working-directory: test_app
        run: |
          spice add spiceai/quickstart
          cat spicepod.yaml

      - name: Wait for dataset to be ready
        uses: $/.github/actions/wait-for-spice-ready
        with:
          working-directory: test_app
          timeout: '60'
          datasets: taxi_trips

      - name: Verify dataset
        uses: $/.github/actions/verify-dataset
        with:
          name: taxi_trips

      - name: Stop spice and check logs
        if: always()
        uses: $/.github/actions/stop-spice
        with:
          working-directory: test_app

  test_quickstart_spiceai:
    name: 'Test Spice.ai quickstart (${{ matrix.target.target_os }}-${{ matrix.target.target_arch }})'
    runs-on: ${{ matrix.target.runner }}
    environment: ci
    # run quickstart with external service dependency only on manual trigger
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs:
      - build_linux
      - build_macos
      - setup-matrix
    timeout-minutes: 5

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Init spice app
        run: |
          spice init test_app

      - name: Spice dataset configure
        working-directory: test_app
        run: |
          spice dataset configure taxi_trips --description "new york taxi trips" --from spice.ai/spiceai/quickstart/datasets/taxi_trips --param spiceai_region=us-east-1
          cat spicepod.yaml

      # The macOS leg shares its host with other jobs' runtimes, so spiced's default
      # 8090/50051 cannot be assumed free (#12419). The actions below read these ports.
      - name: Allocate Spice runtime ports
        uses: $/.github/actions/allocate-spice-ports

      - name: Start spice runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICE_SPICEAI_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_KEY }}
        working-directory: test_app
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &
          # time to initialize added dataset
          sleep 10

      - name: Wait for dataset to be ready
        uses: $/.github/actions/wait-for-spice-ready
        with:
          working-directory: test_app
          timeout: '60'

      - name: Verify dataset
        uses: $/.github/actions/verify-dataset
        with:
          name: taxi_trips

      - name: Stop spice and check logs
        if: always()
        uses: $/.github/actions/stop-spice
        with:
          working-directory: test_app

  test_cloud_connect_state_dir:
    environment: secret-free
    name: 'Cloud Connect: state directory in layouts only root can set up'
    # The Cloud Connect state-directory rule (#16474) refuses a `cloud-connect/`
    # directory another account owns, repairs this account's own, and moves state an
    # earlier version kept in `.spice/`. Its cases need root to create directories
    # owned by other uids and to start `spiced` as them, so they run here against the
    # Linux build rather than in `bin/spiced/tests`. See test/cloud-connect/README.md.
    runs-on: spiceai-dev-runners
    needs:
      - build_linux
    # Reads the repository and the build artifact; no credentials.
    permissions:
      contents: read
    # Ten `spiced` starts, each stopped as soon as it shows the outcome; a start that
    # never shows one is cut by the script after two minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: download artifacts - build_linux_x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_linux_x86_64
          path: ./build

      - name: Run the state-directory cases as root
        # The script works in its own temporary directory, binds `spiced` to ephemeral
        # ports, and removes everything it created when it exits.
        run: sudo bash test/cloud-connect/state-dir.sh "$GITHUB_WORKSPACE/build/spiced"

  test_cold_start_unkeyed_append:
    environment: ci
    name: 'Cold start: unkeyed Cayenne append loads without rewriting itself'
    # The nightly `testoperator run cold-start` workflow times every acceleration shape
    # against the previous release; this is its timing-free bound, cheap enough for the
    # merge queue. A load into an empty table must not trigger a full compaction.
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    needs:
      - build_linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: download artifacts - build_linux_x86_64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_linux_x86_64
          path: ./build

      - name: Install spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '1200'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Check for the fixture
        run: |
          if ! mc stat spice-minio/benchmarks/cold_start/audit_events_3m/_SEEDED >/dev/null 2>&1; then
            echo "The cold-start fixture is missing from MinIO; run the 'testoperator run cold-start' workflow once to seed it."
            exit 1
          fi

      - name: Start spiced
        run: |
          mkdir -p cold_start_app
          cp 'test/spicepods/cold_start/delta_lake-cayenne[file]-append_unkeyed_sorted.yaml' cold_start_app/spicepod.yaml
          cd cold_start_app
          spiced --cpu-cores 2 --metrics 127.0.0.1:9095 &> spice.log &
        env:
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}

      - name: Wait for the dataset to be ready
        uses: $/.github/actions/wait-for-spice-ready
        with:
          working-directory: cold_start_app
          timeout: '600'

      - name: Check the load committed no full compaction and holds every row
        run: |
          set -o pipefail
          full=$(curl -sf http://127.0.0.1:9095/metrics \
            | awk '/^cayenne_compaction_outcome_total\{/ && /kind="full"/ && /outcome="committed"/ && /table="audit_events"/ {sum += $NF} END {print sum + 0}')
          rows=$(curl -sf -X POST -H 'Content-Type: text/plain' --data 'SELECT COUNT(*) AS n FROM audit_events' \
            http://127.0.0.1:8090/v1/sql | tr -dc '0-9')
          echo "full compactions before ready: ${full}; rows: ${rows}"
          test "${full}" = 0
          test "${rows}" = 2940086

      - name: Stop spice and check logs
        if: always()
        uses: $/.github/actions/stop-spice
        with:
          working-directory: cold_start_app

  gh_connector_quickstart:
    environment: secret-free
    name: 'Test GitHub connector on ${{ matrix.target.name }}'
    runs-on: ${{ matrix.target.runner }}
    needs:
      - build_linux
      - setup-matrix
      - check_changes
    if: ${{ needs.check_changes.outputs.merge_queue_passed != 'true' }}
    timeout-minutes: 15
    permissions:
      # Required by GitHub's GraphQL stargazers read query; match integration.
      # Reproduction: https://github.com/spiceai/spiceai/actions/runs/34186688336
      contents: write
    concurrency:
      group: github-connector-live-api
      queue: max

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        # run only on "Linux x64"
        exclude:
          - target:
              target_os: 'darwin'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify GitHub API permissions
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 test/github/check_permissions.py --artifacts github-api-results

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Test GitHub against a local API fixture
        run: |
          python3 test/github/test_connector.py --spiced "$(command -v spiced)" \
            --artifacts github-fixture-results --repeat 3

      - name: Configure live GitHub smoke test
        run: |
          mkdir -p test_app
          cp test/github/github-cayenne-smoke.yaml test_app/spicepod.yaml

      - name: Allocate runtime ports
        uses: $/.github/actions/allocate-spice-ports

      - name: Start spice runtime
        working-directory: test_app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run --http-endpoint "${SPICE_HTTP_ENDPOINT}" --flight-endpoint "${SPICE_FLIGHT_ENDPOINT}" &> spice.log &

      - name: Wait for all accelerated datasets
        uses: $/.github/actions/wait-for-spice-ready
        with:
          working-directory: test_app
          url: ${{ env.SPICE_HTTP_ENDPOINT }}/v1/ready
          timeout: '240'

      - name: Verify live GitHub rows and file content
        run: |
          python3 test/github/check_live.py --endpoint "${SPICE_HTTP_ENDPOINT}" \
            --artifacts github-live-results

      # Pull request and merge-queue checks keep no diagnostic artifacts.
      - name: Upload GitHub test evidence
        if: always() && github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-connector-results-${{ matrix.target.target_os }}-${{ matrix.target.target_arch }}
          path: |
            github-api-results/
            github-fixture-results/
            github-live-results/
            test_app/spice.log

      - name: Stop spice and check logs
        if: always()
        uses: $/.github/actions/stop-spice
        with:
          working-directory: test_app

  # The runner for the scenario scripts in test/spicescript. Built beside spiced
  # rather than after it, so it adds nothing to the run's critical path.
  build_spicescript:
    environment: ci
    name: Build spicescript
    needs: check_changes
    # `test_spicescript`, which needs this job, is skipped with it.
    if: ${{ needs.check_changes.outputs.relevant_changes == 'true' && needs.check_changes.outputs.merge_queue_passed != 'true' }}
    runs-on: spiceai-dev-runners
    permissions:
      contents: read
      id-token: write  # RustFS credentials
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '1800'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Check documented SQL cases
        run: |
          python3 -m unittest discover -s test/spicescript/corpus -p test_sql_surface.py
          python3 test/spicescript/corpus/sql_surface.py --check

      - name: Test update_durations.py
        run: python3 -m unittest discover -s test/spicescript -p test_update_durations.py

      - name: Build spicescript
        uses: $/.github/actions/build-tool
        with:
          package: spicescript

  # Runs the scenario scripts not tagged `long` against this run's spiced and
  # spice CLI, plus every script this run adds or changes. Every script, the
  # known-failing ledger, the older DuckDB releases and the live providers run
  # after merge, on trunk, in trunk_tests.yml.
  test_spicescript:
    name: ${{ matrix.name }}
    needs: [build_linux, build_spicescript]
    runs-on: spiceai-dev-runners
    environment: ci
    permissions:
      contents: read
      id-token: write  # RustFS and Docker Hub credentials
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Scripts without `tags: [long]`: any failure fails the job. Each
          # shard runs its share of them (--partition), balanced by their
          # recorded durations.
          - { name: 'spicescript: scripts (1/2)', partition: 1/2 }
          - { name: 'spicescript: scripts (2/2)', partition: 2/2 }
          # The `long` and known-failing scripts this run adds or changes (the
          # others already run in the shards above): a new regression script
          # runs before it merges, and a fix whose known-failing script now
          # passes learns it here rather than from the next trunk tests run.
          - { name: 'spicescript: changed scripts', changed: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What changed against the base of the merge group, or the previous trunk
      # commit on a push. Scripts are the *.yaml files directly in
      # test/spicescript and in test/spicescript/known-failing/<group>/; the
      # other directories under it are not run by CI (see its README), and the
      # live scripts need the provider tokens only trunk_tests.yml mints. A
      # changed known-failing ledger (a re-record) runs its whole group against
      # the new ledger. An edit to a script's `tags:` line alone changes which
      # run it belongs to, not what it does, and its `duration:` line is a
      # recorded run time, so an edit to those lines alone selects nothing here.
      - name: Find changed scripts
        id: changed
        if: ${{ matrix.changed }}
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            echo "No base commit to compare with; no changed scripts to run."
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          # Scripts without `tags: [long]` run in the script shards from this
          # same commit, so only the changed `long` ones run again here.
          # `--numstat`, not `--name-only`: `--name-only` lists a file whose
          # changed lines all match `-I`.
          passing=$(git diff --numstat --no-renames --diff-filter=AM -I'^tags:' -I'^duration:' -I'^  "duration":' "$BASE_SHA" HEAD -- \
            ':(glob)test/spicescript/*.yaml' ':(exclude)test/spicescript/variants.yaml' |
            cut -f3 | while read -r script; do
              if grep -qE '^tags:.*[^a-z_-]long([^a-z_-]|$)' "$script"; then echo "$script"; fi
            done | xargs)
          groups=$(git diff --name-only --diff-filter=AMRD "$BASE_SHA" HEAD -- \
            ':(glob)test/spicescript/known-failing/*/recordings/expected-failures.json' \
            | sed 's#/recordings/expected-failures.json$##' | while read -r dir; do
              # A group a fix emptied is gone; under pipefail a bare test would
              # end the loop with status 1 and abort this step.
              if [ -d "$dir" ]; then echo "$dir"; fi
            done | sort -u)
          known=$( {
            echo "$groups"
            git diff --numstat --no-renames --diff-filter=AM -I'^tags:' -I'^duration:' -I'^  "duration":' "$BASE_SHA" HEAD -- \
              ':(glob)test/spicescript/known-failing/*/*.yaml' | cut -f3 | while read -r script; do
                # A script whose whole group already runs is not listed again.
                grep -qx "$(dirname "$script")" <<<"$groups" || echo "$script"
              done
          } | sed '/^$/d' | xargs)
          echo "Changed scripts: ${passing:-none}"
          echo "Changed known-failing scripts: ${known:-none}"
          {
            echo "passing=$passing"
            echo "known=$known"
          } >> "$GITHUB_OUTPUT"

      - name: download artifacts - build_linux_x86_64
        if: ${{ !matrix.changed || steps.changed.outputs.passing != '' || steps.changed.outputs.known != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build_linux_x86_64
          path: ./build

      - name: Install spice
        if: ${{ !matrix.changed || steps.changed.outputs.passing != '' || steps.changed.outputs.known != '' }}
        uses: $/.github/actions/install-spice
        with:
          build-path: ./build
          install-scope: job

      - name: Set up spicescript
        id: spicescript
        if: ${{ !matrix.changed || steps.changed.outputs.passing != '' || steps.changed.outputs.known != '' }}
        uses: $/.github/actions/setup-spicescript
        with:
          minio-endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          dockerhub-username: ${{ vars.DOCKERHUB_ORGANIZATION }}
          dockerhub-oidc-connection-id: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          hf-token: ${{ secrets.SPICE_SECRET_HF_TOKEN }}

      - name: Check harness rejects incorrect answers
        if: ${{ matrix.partition == '1/2' }}
        run: |
          python3 test/spicescript/check_harness.py \
            --runner "${{ steps.spicescript.outputs.path }}" \
            --spiced "$(command -v spiced)" \
            --work-dir "$RUNNER_TEMP/spicescript/harness-checks"

      # Upgrade scripts start on the release their `from:` names and upgrade
      # to this build: spicescript resolves `X.Y.x` against the GitHub releases
      # and downloads each release it needs into ~/.cache/spicescript, so no
      # `--from` is passed here. The token is for the releases API's rate limit.
      - name: Run scenario scripts
        if: ${{ !matrix.changed }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "${{ steps.spicescript.outputs.path }}" --jobs 4 \
            --exclude-tag long \
            --partition ${{ matrix.partition }} \
            --spiced "$(command -v spiced)" \
            --spice-cli "$(command -v spice)" \
            --work-dir "$RUNNER_TEMP/spicescript" \
            --results "$RUNNER_TEMP/spicescript-results.json" \
            --log-capture "$RUNNER_TEMP/spicescript-logs" \
            test/spicescript

      - name: Run changed scripts
        if: ${{ matrix.changed && steps.changed.outputs.passing != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPTS: ${{ steps.changed.outputs.passing }}
        run: |
          # shellcheck disable=SC2086 # SCRIPTS holds several paths
          "${{ steps.spicescript.outputs.path }}" --jobs 4 \
            --spiced "$(command -v spiced)" \
            --spice-cli "$(command -v spice)" \
            --work-dir "$RUNNER_TEMP/spicescript" \
            --results "$RUNNER_TEMP/spicescript-results.json" \
            --log-capture "$RUNNER_TEMP/spicescript-logs" \
            $SCRIPTS

      # Each must fail exactly as its group's recordings/expected-failures.json
      # says, so a fix (or a change in how a bug shows) fails this job.
      # --max-wait: a known-failing script otherwise waits out every limit of
      # the checks it is expected to fail.
      - name: Run changed known-failing scripts
        if: ${{ !cancelled() && matrix.changed && steps.changed.outputs.known != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRIPTS: ${{ steps.changed.outputs.known }}
        run: |
          # shellcheck disable=SC2086 # SCRIPTS holds several paths
          "${{ steps.spicescript.outputs.path }}" --jobs 4 --max-wait 30s \
            --spiced "$(command -v spiced)" \
            --spice-cli "$(command -v spice)" \
            --work-dir "$RUNNER_TEMP/spicescript" \
            --results "$RUNNER_TEMP/spicescript-results-known-failing.json" \
            --log-capture "$RUNNER_TEMP/spicescript-logs" \
            $SCRIPTS

      # Every script's outcome, passes included, from every run: a script's
      # failure rate across runs is read off these rather than off job logs.
      - name: Upload script results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spicescript-results-${{ strategy.job-index }}
          path: ${{ runner.temp }}/spicescript-results*.json
          if-no-files-found: ignore
          retention-days: 30

      # A directory per script with a failure: the script, what the run
      # printed for it, its source containers' output and its instances' logs.
      - name: Upload captured logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spicescript-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/spicescript-logs
            ${{ runner.temp }}/spicescript/harness-checks/*.log
          if-no-files-found: warn
          retention-days: 7

  # Stable, matrix-proof summary check. It succeeds only if every E2E job above
  # succeeded (or was skipped), so the whole matrix is gated by one ruleset entry
  # rather than dozens of shifting matrix names. On a pull request it is skipped
  # along with every job it summarises, so the required check reads `skipped`,
  # not a `success` nothing ran for (#13841).
  e2e-gate:
    environment: secret-free
    name: E2E Test CI
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    # The gate only reads the results it already has. Bounding it matters because it is
    # the required check: a stuck gate blocks the queue even when every job it summarises
    # has finished.
    timeout-minutes: 5
    needs:
      - check_changes
      - setup-matrix
      - build_linux
      - build_macos
      - setup-model-matrix
      - test-bigquery
      - test_openai_model
      - test_macos
      - test_quickstart_dremio
      - test_quickstart_spiceai
      - gh_connector_quickstart
      - test_cold_start_unkeyed_append
      - test_cloud_connect_state_dir
      - build_spicescript
      # Every spicescript job gates: the script shards and the changed scripts.
      # A failing shard names its failing scripts in its own log.
      - test_spicescript
    steps:
      - name: Verify all E2E jobs succeeded
        # Named rather than left to the runner default: this gate is the required
        # merge-queue context, so the shell it reads `set -uo pipefail`, `command -v`
        # and `$(…)` under must not depend on the image's default staying bash.
        shell: bash
        env:
          # Read through the environment rather than interpolated into the script:
          # the results are GitHub's own, but keeping workflow expressions out of
          # `run:` bodies is the habit that stops the next one being attacker-
          # controlled.
          E2E_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail

          # `contains(needs.*.result, 'failure')` can answer only *whether*
          # something went wrong, never which job it was, so this gate used to
          # fail with a single line — "One or more E2E Test CI jobs did not
          # succeed" — whichever of the jobs above it was. Since it is the required
          # merge-queue context standing in for the whole matrix, that line is also
          # the entire failure summary a dequeued PR gets: whoever triages it has
          # to open the run and read down the job list to learn anything at all
          # (#12643). Name the jobs instead. `toJSON(needs)` carries each one's
          # result, so this needs no extra API call and no token.
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is not available on this runner, so this gate cannot read the E2E job results. Failing closed rather than reporting a pass it did not verify."
            exit 1
          fi

          # A `jq` that dies must not be mistaken for "nothing failed" — that
          # would turn this gate into a rubber stamp on exactly the runs it exists
          # to catch. Hence the explicit status check before the emptiness test.
          # Allow-list the two results that pass rather than deny-listing the two
          # that fail: an entry whose result were absent, or some state GitHub
          # adds later, would be silently ignored by a deny-list and this gate
          # would report a pass it had not established.
          if ! not_succeeded="$(printf '%s' "$E2E_JOB_RESULTS" | jq -r '
                to_entries
                | map((.value.result // "missing") as $r
                      | select($r != "success" and $r != "skipped")
                      | "\(.key) (\($r))")
                | join(", ")
              ')"; then
            echo "::error::Could not read the E2E job results, so this gate cannot tell whether the matrix passed. Failing closed."
            exit 1
          fi

          if [ -n "$not_succeeded" ]; then
            # `needs` keys are job ids, and a matrix job reports one result for
            # the whole matrix — so this names the job to open, not the cell. That
            # is still the difference between one click and twenty.
            echo "::error::E2E Test CI jobs did not succeed: ${not_succeeded}"
            exit 1
          fi

          echo "All E2E Test CI jobs succeeded"
