name: E2E Test CI

on:
  push:
    branches:
      - trunk
      - release-*
      - release/*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  pull_request:
    branches:
      - trunk
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'

  workflow_dispatch:

concurrency:
  # Allow only one workflow per any non-trunk branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Setup strategy matrix
    runs-on: spiceai-dev-runners
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}

    steps:
      - name: Set up matrix
        uses: actions/github-script@v8
        id: setup-matrix
        with:
          script: |
            const matrix = [
              {
                name: "Linux x64",
                builder: "spiceai-dev-runners",
                runner: "ubuntu-latest",
                target_os: "linux",
                target_arch: "x86_64",
                target_arch_go: "amd64"
              }, {
                name: "macOS aarch64 (Apple Silicon)",
                builder: "spiceai-macos",
                runner: "macos-15",
                target_os: "darwin",
                target_arch: "aarch64",
                target_arch_go: "arm64"
              }
            ];

            const isPrEvent = context.eventName === 'pull_request';
            return isPrEvent ? matrix.slice(0, 1) : matrix;

  build:
    name: Build ${{ matrix.target.name }} binaries
    runs-on: ${{ matrix.target.builder }}
    needs: setup-matrix
    env:
      GOVER: 1.25.3
      GOOS: ${{ matrix.target.target_os }}
      GOARCH: ${{ matrix.target.target_arch_go }}

    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Configure Cargo directories (self-hosted macOS)
        if: matrix.target.builder == 'spiceai-macos'
        run: |
          set -euo pipefail
          cargo_home="${{ runner.temp }}/cargo-${{ github.run_id }}-${{ github.job }}"
          mkdir -p "$cargo_home/bin"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVER }}
          cache: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          os: ${{ matrix.target.target_os }}

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      - name: Set up make
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-make

      - name: Set up cc
        if: matrix.target.target_os == 'linux'
        uses: ./.github/actions/setup-cc

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build spiced
        if: matrix.target.target_os != 'darwin'
        run: make -C bin/spiced SPICED_NON_DEFAULT_FEATURES="tpc-extension,models"

      - name: Build spiced (macOS)
        if: matrix.target.target_os == 'darwin'
        env:
          MISTRALRS_METAL_PRECOMPILE: 0
        run: make -C bin/spiced SPICED_NON_DEFAULT_FEATURES="tpc-extension,models,metal"

      - name: Build spice
        run: make -C bin/spice

      - name: make spiced executable
        if: matrix.target.target_os != 'windows'
        run: |
          mv target/release/spiced spiced
          chmod +x spiced

      - name: make spice executable
        if: matrix.target.target_os != 'windows'
        run: |
          mv target/release/spice spice
          chmod +x spice

      - name: Save spice artifact
        uses: actions/upload-artifact@v5
        if: matrix.target.target_os != 'windows'
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: |
            spice
            spiced

  build-macos-pr:
    name: Build macOS aarch64 binaries (PR)
    runs-on: spiceai-macos
    if: github.event_name == 'pull_request'
    needs: setup-matrix
    env:
      GOVER: 1.25.3
      GOOS: darwin
      GOARCH: arm64

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Configure Cargo directories (self-hosted macOS)
        run: |
          set -euo pipefail
          cargo_home="${{ runner.temp }}/cargo-${{ github.run_id }}-${{ github.job }}"
          mkdir -p "$cargo_home/bin"
          echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"

      - name: Set REL_VERSION from version.txt
        run: python3 ./.github/scripts/get_release_version.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOVER }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          os: darwin

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/trunk' }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build spiced (macOS)
        env:
          MISTRALRS_METAL_PRECOMPILE: 0
        run: make -C bin/spiced SPICED_NON_DEFAULT_FEATURES="tpc-extension,models,metal"

      - name: Build spice
        run: make -C bin/spice

      - name: make spiced executable
        run: |
          mv target/release/spiced spiced
          chmod +x spiced

      - name: make spice executable
        run: |
          mv target/release/spice spice
          chmod +x spice

      - name: Save spice artifact
        uses: actions/upload-artifact@v5
        with:
          name: build_darwin_aarch64
          path: |
            spice
            spiced

  graceful_shutdown_test_append:
    name: '${{ matrix.spicepod }} acceleration and graceful shutdown on ${{ matrix.target.name }}'
    runs-on: ${{ matrix.target.runner }}
    needs:
      - build
      - setup-matrix
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        spicepod:
          [
            duckdb_append_with_pk_and_indexes.yaml,
            duckdb_append_with_pk.yaml,
            duckdb_append_with_indexes.yaml,
          ]
        # run only on "Linux x64"
        exclude:
          - target:
              target_os: 'darwin'

    steps:
      - uses: actions/checkout@v5

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@v6
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: ./.github/actions/install-spice
        with:
          build-path: ./build

      - name: check installation
        run: |
          spice version

      - name: Install DuckDB CLI
        run: |
          curl https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> $GITHUB_PATH

      - name: Install oha (macOS)
        if: matrix.target.target_os == 'darwin'
        run: |
          brew install oha

      - name: Install oha (Linux)
        if: matrix.target.target_os == 'linux'
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          wget -O oha https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64
          chmod +x ./oha
          ./oha --version

      - name: Start append data simulation
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          ./simulate_append_data.sh &

      - name: Configure Spicepod
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          cp ${{ matrix.spicepod }} spicepod.yaml
          cat spicepod.yaml

      - name: Start Spice runtime
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run &> spice.log &

      - name: Wait for dataset to be ready
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 1
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Run test workfload for 120s
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 5
        run: |
          ./oha --method POST "http://127.0.0.1:8090/v1/sql" -D append_query.sql -z 120s -c 10

      - name: Send SIGTERM to Spice
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 0.5
        run: |
          killall spice
          while pgrep spice > /dev/null; do sleep 1; done

      - name: Verify local DuckDB database
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          ls -la .spice/data

          if [ -f .spice/data/accelerated_duckdb.db ]; then
            echo "Verification successful: accelerated_duckdb.db exists."
          else
            echo "Verification failed: accelerated_duckdb.db does not exist."
            exit 1
          fi

          if [ ! -f .spice/data/accelerated_duckdb.db.wal ]; then
            echo "Verification successful: accelerated_duckdb.db.wal does not exist."
          else
            echo "Verification failed: accelerated_duckdb.db.wal exists."
            exit 1
          fi

      - name: Check logs
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        if: always()
        run: |
          killall spice || true
          cat spice.log
          if grep -iE "(failed|error)" spice.log; then
            echo "Failures detected in spice.log"
            exit 1
          fi

      - name: Restart Spice runtime
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          spice run &> spice.log &

      - name: Wait for dataset to be ready
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 1
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Verify data_upsert dataset
        uses: ./.github/actions/verify-dataset
        with:
          name: data_upsert

      - name: Verify data_drop dataset
        uses: ./.github/actions/verify-dataset
        with:
          name: data_drop

      - name: Check logs
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        if: always()
        run: |
          killall spice || true
          cat spice.log
          if grep -iE "(failed|error)" spice.log; then
            echo "Failures detected in spice.log"
            exit 1
          fi

      - name: Fail
        run: |
          exit 1

  graceful_shutdown_test_full:
    name: '${{ matrix.spicepod }} acceleration and graceful shutdown on ${{ matrix.target.name }}'
    runs-on: ${{ matrix.target.runner }}
    needs:
      - build
      - setup-matrix
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        spicepod:
          [
            duckdb_full_with_pk_and_indexes.yaml,
            duckdb_full_with_pk.yaml,
            duckdb_full_with_indexes.yaml,
          ]
        # run only on "Linux x64"
        exclude:
          - target:
              target_os: 'darwin'

    steps:
      - uses: actions/checkout@v5

      - name: download artifacts - build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
        uses: actions/download-artifact@v6
        with:
          name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
          path: ./build

      - name: Install spice
        uses: ./.github/actions/install-spice
        with:
          build-path: ./build

      - name: check installation
        run: |
          spice version

      - name: Install oha (macOS)
        if: matrix.target.target_os == 'darwin'
        run: |
          brew install oha

      - name: Install oha (Linux)
        if: matrix.target.target_os == 'linux'
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          wget -O oha https://github.com/hatoo/oha/releases/latest/download/oha-linux-amd64
          chmod +x ./oha
          ./oha --version

      - name: Configure Spicepod
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          cp ${{ matrix.spicepod }} spicepod.yaml
          cat spicepod.yaml

      - name: Start Spice runtime
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .spice/tpch.db
          spice run &> spice.log &

      - name: Wait for dataset to be ready
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 3
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Run test workfload for 120s
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 5
        run: |
          ./oha --method POST "http://127.0.0.1:8090/v1/sql" -D tpch_query.sql -z 120s -c 10

      - name: Send SIGTERM to Spice
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 0.5
        run: |
          killall spice
          while pgrep spice > /dev/null; do sleep 1; done

      - name: Verify local DuckDB database
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        run: |
          ls -la .spice/data

          if [ -f .spice/data/accelerated_duckdb.db ]; then
            echo "Verification successful: accelerated_duckdb.db exists."
          else
            echo "Verification failed: accelerated_duckdb.db does not exist."
            exit 1
          fi

          if [ ! -f .spice/data/accelerated_duckdb.db.wal ]; then
            echo "Verification successful: accelerated_duckdb.db.wal does not exist."
          else
            echo "Verification failed: accelerated_duckdb.db.wal exists."
            exit 1
          fi

      - name: Check logs
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        if: always()
        run: |
          killall spice || true
          cat spice.log
          if grep -iE "(failed|error)" spice.log; then
            echo "Failures detected in spice.log"
            exit 1
          fi

      - name: Restart Spice runtime
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .spice/tpch.db
          spice run &> spice.log &

      - name: Wait for dataset to be ready
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        timeout-minutes: 3
        run: |
          while [[ "$(curl -s http://localhost:8090/v1/ready)" != "ready" ]]; do sleep 1; done

      - name: Verify dataset
        uses: ./.github/actions/verify-dataset
        with:
          name: customer

      - name: Check logs
        working-directory: ./test/spicepods/tpch/sf1/accelerated/constraints
        if: always()
        run: |
          killall spice || true
          cat spice.log
          if grep -iE "(failed|error)" spice.log; then
            echo "Failures detected in spice.log"
            exit 1
          fi
