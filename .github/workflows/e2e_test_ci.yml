name: E2E Test CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expect-diagnostic:
    name: Bounded Expect first-spawn diagnostic
    runs-on: spiceai-macos
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Trace two isolated self-test suites
        env:
          EXPECT_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/expect-13761-evidence
        run: |
          nice -n 15 python3 ./test/models/diagnose_expect.py
      - name: Preserve boundary traces and task-child stacks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: expect-13761-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/expect-13761-evidence
          retention-days: 7
          if-no-files-found: error
