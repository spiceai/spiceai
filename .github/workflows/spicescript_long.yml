---
name: spicescript long scripts

# Runs the scenario scripts in test/spicescript/long: scripts that wait on a
# source's own clock for many minutes (a DynamoDB Streams shard iterator
# expires after about five), too long for every pull request and merge-queue
# run. Nightly, after build_nightly, against the newest nightly spiced; on
# demand, against the Linux build of an E2E Test CI run of this repo, such as
# a pull request's from a branch here, with the scripts of the commit that run
# built. A fork's pull request run is refused: its author built that spiced and
# wrote those scripts, and this job has id-token: write on the self-hosted runners.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'An E2E Test CI run whose Linux build to test (default: the newest nightly build)'
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  long:
    environment: ci
    name: 'spicescript: long'
    runs-on: spiceai-dev-runners
    permissions:
      actions: read
      contents: read
      id-token: write  # RustFS and Docker Hub credentials
    # The scripts' own waits are about 15 minutes; the rest is starting
    # containers and building spicescript when no earlier run built it.
    timeout-minutes: 90
    steps:
      - name: Find the build
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a numeric run ID, got '$RUN_ID'"; exit 1; }
            # `gh run view --json` has no head repository field, so read the run from the API.
            info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
              -q '.event, (.head_repository.full_name // ""), .name')
            { read -r event; read -r head_repo; read -r workflow; } <<<"$info"
            refuse() { echo "::error::Run $RUN_ID ($workflow, $event event, head repo '$head_repo') $1"; exit 1; }
            [ "$workflow" = "E2E Test CI" ] || refuse "is not an E2E Test CI run"
            [ "$event" != pull_request_target ] || refuse "is a pull_request_target run"
            [ "$head_repo" = "$GITHUB_REPOSITORY" ] || refuse "was not built from $GITHUB_REPOSITORY"
            run="$RUN_ID"
            artifact=build_linux_x86_64
          else
            # A nightly run with no new commits succeeds without building, so
            # take the newest one that still holds the binary.
            artifact=spiced_linux_x86_64
            run=""
            for id in $(gh run list -R "$GITHUB_REPOSITORY" -w build_nightly.yml -b trunk \
                --status success -L 20 --json databaseId -q '.[].databaseId'); do
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts" \
                  -q ".artifacts[] | select(.name == \"$artifact\" and (.expired | not)) | .id" | grep -q .; then
                run="$id"
                break
              fi
            done
            [ -n "$run" ] || { echo "No build_nightly run holds $artifact" >&2; exit 1; }
          fi
          sha=$(gh run view "$run" -R "$GITHUB_REPOSITORY" --json headSha -q .headSha)
          echo "Testing the spiced of run $run ($artifact), commit $sha"
          {
            echo "run=$run"
            echo "artifact=$artifact"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.build.outputs.sha }}
          persist-credentials: false

      - name: Download spiced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_RUN: ${{ steps.build.outputs.run }}
          BUILD_ARTIFACT: ${{ steps.build.outputs.artifact }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n "$BUILD_ARTIFACT" -D "$RUNNER_TEMP/build"
          cd "$RUNNER_TEMP/build"
          # The nightly artifact is a tarball; an E2E run's holds the binary.
          if [ -f spiced_linux_x86_64.tar.gz ]; then
            tar xzf spiced_linux_x86_64.tar.gz -C "$RUNNER_TEMP/build"
          fi
          chmod +x spiced
          ./spiced --version

      - name: Get RustFS credentials
        id: rustfs
        uses: ./.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '3600'
          export-env: 'false'

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Download spicescript
        id: spicescript
        uses: ./.github/actions/build-tool
        with:
          package: spicescript

      # Sources run in containers; log in so image pulls are not rate limited. Scripts pull
      # images as they start, so the login has to last the whole job. Docker Hub logins use
      # the job's GitHub OIDC token (id-token: write above), as E2E Test CI's do; there are
      # no Docker Hub password secrets.
      - name: Login to DockerHub
        if: github.repository == 'spiceai/spiceai'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          DOCKERHUB_OIDC_EXPIREIN: '21600'
        with:
          username: ${{ vars.DOCKERHUB_ORGANIZATION }}

      - name: Run long scripts
        run: |
          "${{ steps.spicescript.outputs.path }}" --jobs 4 \
            --spiced "$RUNNER_TEMP/build/spiced" \
            --work-dir "$RUNNER_TEMP/spicescript" \
            --results "$RUNNER_TEMP/spicescript-results.json" \
            --log-capture "$RUNNER_TEMP/spicescript-logs" \
            test/spicescript/long

      - name: Upload script results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spicescript-results-long
          path: ${{ runner.temp }}/spicescript-results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload captured logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spicescript-logs-long
          path: ${{ runner.temp }}/spicescript-logs
          if-no-files-found: warn
          retention-days: 7
