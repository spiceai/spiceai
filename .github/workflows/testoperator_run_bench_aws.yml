---
# The jobs of testoperator_run_bench.yml that assume a CI AWS role.
# testoperator_run_bench.yml calls this file at `@trunk`, so whichever ref it runs on, the definition
# that chooses the role is trunk's.
# A job here assumes the full roles only on trunk (a merge-queue run is not trunk) and
# the read-only pull request role anywhere else, and skips its writes there (the `Choose
# the CI role` step). check_workflow_yaml.py keeps every such job in a file like this.
name: benchmark e2e tests (CI AWS role jobs)

on:
  workflow_call:
    # The secrets the jobs below read. A reusable workflow gets only the secrets its
    # caller passes, environment secrets included, and one it is not passed reads as
    # empty with no error, so each is required and every caller passes it by name.
    # check_workflow_yaml.py keeps this list and the callers' `secrets:` complete.
    secrets:
      BIGQUERY_SERVICE_ACCOUNT:
        required: true
      BIGQUERY_WIF_PROVIDER:
        required: true
      CI_AWS_DYNAMODB_ROLE_ARN:
        required: true
      CI_AWS_PULL_REQUEST_ROLE_ARN:
        required: true
      CI_AWS_S3_ATHENA_ROLE_ARN:
        required: true
      CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN:
        required: true
      ORACLE_CLOUD_CONNECTION_STRING:
        required: true
      ORACLE_CLOUD_PASSWORD:
        required: true
      ORACLE_CLOUD_USERNAME:
        required: true
      ORACLE_CLOUD_WALLET_SSO_CERT:
        required: true
      SNOWFLAKE_ACCOUNT:
        required: true
      SNOWFLAKE_PASSWORD:
        required: true
      SNOWFLAKE_USERNAME:
        required: true
      SPICEAI_BENCHMARK_METRICS_KEY:
        required: true
      SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY:
        required: true
      SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY:
        required: true
      SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY:
        required: true
      SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY:
        required: true
      TEST_MONGODB_PASSWORD:
        required: true
      TEST_MYSQL_PASSWORD:
        required: true
      TEST_MYSQL_USERNAME:
        required: true
      TEST_POSTGRES_PASSWORD:
        required: true
    inputs:
      disable_caching:
        type: string
        required: false
        default: ''
      layout:
        type: string
        required: false
        default: ''
      postgres_version:
        type: string
        required: false
        default: ''
      profile_option:
        type: string
        required: false
        default: ''
      query_overrides:
        type: string
        required: false
        default: ''
      query_set:
        type: string
        required: false
        default: ''
      ready_wait:
        type: string
        required: false
        default: ''
      runner_type:
        type: string
        required: false
        default: ''
      scale_factor:
        type: string
        required: false
        default: ''
      scenario_query_file:
        type: string
        required: false
        default: ''
      spiced_commit:
        type: string
        required: false
        default: ''
      spiced_ref:
        type: string
        required: false
        default: ''
      spicepod_path:
        type: string
        required: false
        default: ''
      update_snapshots:
        type: string
        required: false
        default: ''
      validate_results:
        type: string
        required: false
        default: ''

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-bench:
    # The Databricks service principal's federation policy trusts this environment's subject.
    # The environment also holds the BigQuery workload identity federation settings (`BIGQUERY_*` secrets).
    environment: ci
    name: Run benchmark e2e tests
    runs-on: ${{ inputs.runner_type }}
    permissions:
      actions: write  # approves the held runs of its snapshot PR
      contents: write  # pushes a snapshot branch
      pull-requests: write  # and opens or auto-merges its PR
      id-token: write  # RustFS credentials, Databricks access tokens, and Google Cloud access tokens for the BigQuery tests
    timeout-minutes: 600
    services:
      mssql_tpch:
        # Pinned by digest: spice_mssql_tpch_bench_docker.yml publishes it, from trunk only.
        image: ${{ contains(inputs.spicepod_path, 'mssql') && 'ghcr.io/spiceai/spice-mssql-bench@sha256:d324b103e29ef6abb62f062ca82457af5db97624c7a1b2cd21b738c8e0afbb22' || '' }}
        ports:
          - 1433:1433
        env:
          MSSQL_SA_PASSWORD: S3cretP@ssw0rd
          DB_NAME: tpch_sf1
      # Local, ephemeral PostgreSQL for TPC-H/TPC-DS SF1/SF10 (used by both the
      # postgres data connector and postgres catalog connector benches); avoids
      # depending on an externally-provisioned benchmarking-postgres host for
      # these cheap-to-generate scale factors (see #11730). Larger scale
      # factors (SF100+) target benchmarking-postgres directly instead. Either
      # way the target starts empty and is seeded by the "Seed postgres..."
      # step below (a plain postgres image with no pre-baked data, unlike the
      # earlier iteration of this fix). Excludes ducklake[postgres+s3], which provisions its own
      # local postgres catalog DB on the same port, and clickbench's
      # postgres-source configs, which read the pre-loaded hits data on the
      # hosted cluster (too large to seed inline).
      postgres_tpch:
        # One image per PostgreSQL line test/source_versions.json lists, each pinned by digest; a
        # line without one starts no service, and the version check below fails the job.
        image: >-
          ${{ (contains(inputs.spicepod_path, 'postgres') && !contains(inputs.spicepod_path, 'ducklake') && (((startsWith(inputs.query_set, 'tpch') || inputs.query_set == 'tpcds') && (inputs.scale_factor == '1' || inputs.scale_factor == '10')))) && fromJSON('{
          "14":"postgres:14@sha256:c0e9c0e9bac7e4c1834b698217a03ee5c708de30d313c84a506972de0e24b059",
          "15":"postgres:15@sha256:91b9edc40277faf94bc1e3d7ae621b185fa70f3099b94309c4731a8296114870",
          "16":"postgres:16@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8",
          "17":"postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf",
          "18":"postgres:18@sha256:c699303802144847d238196173655dbbecf7a96aeca1565f2b02eb671a1f0b6b"
          }')[inputs.postgres_version || '16'] || '' }}
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          # Byte-order collation, matching Spice; the image default (en_US.utf8) sorts strings case-insensitively.
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        # --shm-size: postgres's default 64MB /dev/shm (Docker's own default)
        # is too small for parallel-worker queries against TPC-H/TPC-DS data;
        # several queries fail with "could not resize shared memory segment"
        # otherwise.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g
    steps:
      # Which CI AWS role this job gets, and whether its writes run; see the action.
      - name: Choose the CI role
        id: ci-role
        uses: $/.github/actions/ci-role
        with:
          pull-request-role-set: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN != '' }}
          builds: |
            spiced_commit=${{ inputs.spiced_commit }}
            spiced_ref=${{ inputs.spiced_ref }}

      # A self-hosted Mac reuses its workspace across jobs of every ref: start from an empty one.
      - name: Empty the workspace (self-hosted Macs)
        uses: $/.github/actions/clean-mac-workspace

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Several steps below call apt-get directly (GH CLI, postgresql-client,
      # git, unzip); without this they fetch from one archive and one security
      # host with no fallback.
      - name: Configure apt mirrors
        uses: $/.github/actions/configure-apt

      - name: Set up Rust toolchain
        uses: $/.github/actions/setup-rust

      - name: Determine snapshot update mode
        id: determine_update_snapshots
        env:
          SPICED_REF: ${{ inputs.spiced_ref }}
          INPUT_UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}
        run: |
          update_mode="${INPUT_UPDATE_SNAPSHOTS}"
          if [ -n "${SPICED_REF}" ]; then
            update_mode="no"
          elif [ "${update_mode}" = "default" ] || [ -z "${update_mode}" ]; then
            branch_name="${GITHUB_REF_NAME}"
            if [[ "${branch_name}" == "release/"* ]]; then
              update_mode="no"
            else
              update_mode="always"
            fi
          fi

          echo "Using update_snapshots=${update_mode}" >&2
          echo "update_snapshots=${update_mode}" >> "${GITHUB_OUTPUT}"

      - name: Set spicepod path
        id: set_spicepod_path
        env:
          INPUT_QUERY_SET: ${{ inputs.query_set }}
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
          INPUT_SCALE_FACTOR: ${{ inputs.scale_factor }}
        run: |
          query_set="${INPUT_QUERY_SET}"
          query_set="${query_set%%\[*\]*}"

          if [ "${query_set}" = "chbench" ]; then
            SPICEPOD_PATH="./test/spicepods/${query_set}/${INPUT_SPICEPOD_PATH}"
          else
            SPICEPOD_PATH="./test/spicepods/${query_set}/sf${INPUT_SCALE_FACTOR}/${INPUT_SPICEPOD_PATH}"
          fi

          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      # The postgres_tpch service has already started by now; this refuses a line
      # the version list does not carry (a typo, or a retired release) before any
      # result is reported against it.
      - name: Check the PostgreSQL version is supported
        env:
          POSTGRES_VERSION: ${{ inputs.postgres_version || '16' }}
        run: |
          if ! jq -e --arg v "${POSTGRES_VERSION}" '.postgres.versions | map(.version) | index($v)' test/source_versions.json > /dev/null; then
            echo "::error::PostgreSQL ${POSTGRES_VERSION} is not a supported version; use one of: $(jq -r '[.postgres.versions[].version] | join(", ")' test/source_versions.json)"
            exit 1
          fi

      - name: Validate spicepod file exists
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          if [ ! -f "${SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '36000'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Build spicepod validator
        uses: $/.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Validate spicepod
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          spicepod-validator "${SPICEPOD_PATH}"

      # A release tag benchmarks the binary that release published, so releases older than the
      # MinIO builds (kept only for recent commits) can be measured.
      - name: Resolve the spiced source
        id: spiced_source
        env:
          SPICED_COMMIT_INPUT: ${{ inputs.spiced_commit }}
          SPICED_REF: ${{ inputs.spiced_ref }}
        run: |
          if [ -z "${SPICED_COMMIT_INPUT}" ] && [[ "${SPICED_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup spiced
        if: steps.spiced_source.outputs.release != 'true'
        uses: $/.github/actions/setup-spiced
        id: setup-spiced
        with:
          verify: ${{ steps.ci-role.outputs.full }}
          spiced_commit: ${{ inputs.spiced_commit }}
          ref: ${{ inputs.spiced_ref || 'refs/heads/trunk' }}
          with_odbc: ${{ contains(inputs.spicepod_path, 'odbc') }}

      - name: Install the released spiced
        if: steps.spiced_source.outputs.release == 'true'
        id: release-spiced
        uses: $/.github/actions/setup-released-spiced
        with:
          release: ${{ inputs.spiced_ref }}
          spicepod_file: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          with_odbc: ${{ contains(inputs.spicepod_path, 'odbc') }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display spiced commit
        env:
          SPICED_COMMIT_OUTPUT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT || steps.release-spiced.outputs.SPICED_COMMIT }}
        run: echo "SPICED_COMMIT=${SPICED_COMMIT_OUTPUT}"

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup Testoperator
        uses: $/.github/actions/setup-testoperator-data
        with:
          query_set: ${{ inputs.query_set }}

      - name: Setup MySQL
        env:
          INPUT_QUERY_SET: ${{ inputs.query_set }}
        run: |
          if [[ "${INPUT_QUERY_SET}" == "tpcds" ]]; then
            echo "MYSQL_DB=tpcds_sf1" >> $GITHUB_ENV
          elif [[ "${INPUT_QUERY_SET}" == "tpch" ]]; then
            echo "MYSQL_DB=tpch_sf1" >> $GITHUB_ENV
            echo "MYSQL_DB_SF100=tpch_sf100" >> $GITHUB_ENV
          fi

      # One seeding path for every scale factor, just pointed at a different
      # (always-empty-until-seeded) target: the local postgres_tpch container
      # for SF1/SF10, or benchmarking-postgres directly for SF100+ — avoiding
      # the separate, ts-dev-runner-backed `Load - Benchmark Data` workflow in
      # spicehq/ai-platform. Checks for existing data first, so the local
      # container (always empty on a fresh run) always seeds, while a
      # benchmarking-postgres scale factor that's already loaded skips
      # straight through.
      - name: Seed postgres TPC-H/TPC-DS data if missing
        if: ${{ contains(inputs.spicepod_path, 'postgres') && !contains(inputs.spicepod_path, 'ducklake') && (startsWith(inputs.query_set, 'tpch') || inputs.query_set == 'tpcds') }}
        timeout-minutes: 120
        env:
          PGHOST: ${{ (inputs.scale_factor == '1' || inputs.scale_factor == '10') && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          PGPASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          INPUT_QUERY_SET: ${{ inputs.query_set }}
          INPUT_SCALE_FACTOR: ${{ inputs.scale_factor }}
        run: |
          set -e
          QUERY_SET="${INPUT_QUERY_SET}"
          QUERY_SET="${QUERY_SET%%\[*\]*}"
          SCALE_FACTOR="${INPUT_SCALE_FACTOR}"
          DB_NAME="${QUERY_SET}_sf${SCALE_FACTOR}"

          sudo apt-get update -y
          # make is needed before the "already seeded" check below, not just by the
          # seeding path further down: a database that already has data still runs
          # `make pg-create-index`, and on a runner without make preinstalled that
          # exits 127 before the later install line is ever reached. Only a
          # pre-provisioned target takes that branch, so it surfaced solely on
          # SF100 while the always-empty SF1/SF10 containers stayed green.
          sudo apt-get install -y postgresql-client make

          echo "Checking whether $DB_NAME already has data on $PGHOST..."
          set +e
          PSQL_OUTPUT="$(PGCONNECT_TIMEOUT=10 psql -U postgres -d "$DB_NAME" -tAc 'SELECT count(*) FROM customer;' 2>&1)"
          PSQL_EXIT=$?
          set -e

          if [ "$PSQL_EXIT" -eq 0 ]; then
            EXISTING_ROWS="$PSQL_OUTPUT"
          elif echo "$PSQL_OUTPUT" | grep -qi "does not exist"; then
            # Database or the customer table doesn't exist yet - genuinely unseeded.
            echo "$DB_NAME (or its customer table) doesn't exist yet on $PGHOST."
            EXISTING_ROWS=0
          else
            # Any other failure (auth, network, host unreachable, timeout) is a
            # real problem, not "unseeded" - don't silently treat it as empty.
            echo "::error::Could not check $DB_NAME on $PGHOST - this looks like a connectivity or authentication problem, not a missing database:"
            echo "$PSQL_OUTPUT"
            exit 1
          fi

          cd test/tpc-bench

          if [ "${EXISTING_ROWS:-0}" -gt 0 ] 2>/dev/null; then
            echo "$DB_NAME already has $EXISTING_ROWS rows in 'customer' - skipping data load, but ensuring indexes are up to date (idempotent, no rebuild if already present)."
            if [ "$QUERY_SET" = "tpcds" ]; then
              DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-create-index
            else
              DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index
            fi
            exit 0
          fi

          # SF1/SF10 always run against the self-contained postgres_tpch service
          # container (PGHOST=127.0.0.1), so generating fresh data inline is
          # cheap and expected. Anything larger targets the shared hosted
          # cluster - generating+loading that inline risks a multi-hour job
          # that can time out or exhaust the runner's disk, and a failure
          # partway through would leave the shared database partially seeded.
          # Require those scale factors to be pre-provisioned instead.
          if [ "$PGHOST" != "127.0.0.1" ]; then
            echo "::error::$DB_NAME is missing or empty on the hosted $PGHOST cluster. Scale factor $SCALE_FACTOR is too large to safely generate and load inline from a CI runner. Pre-provision it first, e.g.:"
            echo "  cd test/tpc-bench && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME DBGEN_SCALE=$SCALE_FACTOR make tpch-clone tpch-fleet-gen pg-init && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME TPCH_DATA_DIR=./tmp/fleet make pg-load && DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index"
            echo "(for a tpcds run: make tpcds-init tpcds-gen pg-tpcds-init pg-tpcds-load pg-tpcds-create-index)"
            exit 1
          fi

          echo "$DB_NAME is missing or empty on $PGHOST - seeding it now."
          sudo apt-get install -y git
          # Both query sets seed the data the rest of the benchmark fleet holds:
          # TPC-DS from tpcds-kit's dsdgen, built here, and TPC-H from the pinned
          # DuckDB CLI (tpch-fleet-gen), whose tpch extension writes dbgen's
          # data, so tpch-kit is only cloned for its DDL (dss.ddl).

          if [ "$QUERY_SET" = "tpcds" ]; then
            sudo apt-get install -y make gcc flex bison byacc
            make tpcds-init
            DBGEN_SCALE=$SCALE_FACTOR make tpcds-gen
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-init
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-load
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-tpcds-create-index
          else
            make tpch-clone
            DBGEN_SCALE=$SCALE_FACTOR make tpch-fleet-gen
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-init
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME TPCH_DATA_DIR=./tmp/fleet make pg-load
            DB_HOST=$PGHOST DB_PORT=5432 DB_USER=postgres DB_NAME=$DB_NAME make pg-create-index
          fi
          echo "Seed complete: $DB_NAME on $PGHOST."

      - name: Setup ODBC
        if: ${{ contains(inputs.spicepod_path, 'odbc') }}
        uses: $/.github/actions/setup-odbc

      - name: Install Oracle ODPI-C
        if: ${{ contains(inputs.spicepod_path, 'oracle') }}
        uses: $/.github/actions/setup-oracle-odpi

      - name: Install ADBC BigQuery Driver
        if: ${{ contains(inputs.spicepod_path, 'adbc[bigquery]') }}
        uses: $/.github/actions/setup-adbc-bigquery

      - name: Set up BigQuery credentials (workload identity federation)
        if: ${{ contains(inputs.spicepod_path, 'adbc[bigquery]') }}
        uses: $/.github/actions/bigquery-credentials
        with:
          workload-identity-provider: ${{ secrets.BIGQUERY_WIF_PROVIDER }}
          service-account: ${{ secrets.BIGQUERY_SERVICE_ACCOUNT }}

      # duckdb: and ducklake: datasets load the installed DuckDB through ADBC.
      - name: Install libduckdb
        if: ${{ contains(inputs.spicepod_path, 'duckdb') || contains(inputs.spicepod_path, 'ducklake') }}
        uses: $/.github/actions/setup-libduckdb

      - name: Set up Python
        if: ${{ contains(inputs.spicepod_path, 'scylladb') || contains(inputs.spicepod_path, 'ducklake') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Setup ScyllaDB
        if: ${{ contains(inputs.spicepod_path, 'scylladb') }}
        uses: $/.github/actions/setup-scylladb
        with:
          keyspace: tpch_sf1

      - name: Install PostgreSQL for DuckLake
        if: ${{ contains(inputs.spicepod_path, 'ducklake') }}
        uses: $/.github/actions/install-postgres
        with:
          pg-db: ducklake_catalog

      - name: Setup CH-benCH PostgreSQL
        if: ${{ inputs.query_set == 'chbench' }}
        uses: $/.github/actions/setup-chbench-postgres
        with:
          version: ${{ inputs.postgres_version || '16' }}

      - name: Start local MinIO for DuckLake
        if: ${{ contains(inputs.spicepod_path, 'ducklake') }}
        run: |
          # MinIO no longer publishes images or binaries: quay.io/minio/minio and minio/minio refuse
          # anonymous pulls and dl.min.io answers 410. Chainguard builds the same server from the
          # upstream source; it runs as a non-root user that cannot create /data, hence --user.
          # Pinned by digest: Chainguard publishes only `latest` and rebuilds it, so a bump takes the
          # digest `latest` names then (the multi-arch index from cgr.dev).
          image=cgr.dev/chainguard/minio:latest@sha256:f6243be11aaaa2fe654d260558e2b3fcef50135e78a3abfd0db802b13444f059
          if ! docker run -d --name minio --user 0:0 \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            "$image" server /data --console-address ':9001'; then
            echo "::error::Could not start MinIO from $image. If the pull was refused, the image is no longer published there; point this step at a registry that still serves MinIO."
            exit 1
          fi

      - name: Wait for local MinIO
        if: ${{ contains(inputs.spicepod_path, 'ducklake') }}
        run: |
          for _ in {1..30}; do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'MinIO did not become ready in time.'
          docker logs minio
          exit 1

      - name: Bootstrap DuckLake TPCH SF1 catalog
        if: ${{ contains(inputs.spicepod_path, 'ducklake') }}
        run: |
          # DuckLake stamps its catalog with the version of the extension that wrote it, and spiced reads it
          # with the installed DuckDB, which setup-libduckdb takes from the newest release in
          # test/duckdb_versions.json. A newer duckdb writes a catalog an older one rejects, so write it with
          # that same release.
          duckdb_version=$(jq -r '.versions[-1].version' test/duckdb_versions.json)
          [ -n "$duckdb_version" ] || { echo 'could not read the duckdb version from test/duckdb_versions.json'; exit 1; }
          # Every package at the version and hashes .github/requirements/ducklake_bootstrap.txt pins.
          python -m pip install --upgrade --require-hashes --only-binary=:all: -r .github/requirements/ducklake_bootstrap.txt
          installed=$(python -c 'import duckdb; print(duckdb.__version__)')
          if [ "$installed" != "$duckdb_version" ]; then
            echo "::error::.github/requirements/ducklake_bootstrap.txt installs duckdb $installed, but test/duckdb_versions.json lists $duckdb_version last; pin that release there."
            exit 1
          fi

          python <<'PY'
          import duckdb
          from minio import Minio

          bucket_name = "ducklake"
          minio = Minio(
              "127.0.0.1:9000",
              access_key="minioadmin",
              secret_key="minioadmin",
              secure=False,
          )
          if not minio.bucket_exists(bucket_name):
              minio.make_bucket(bucket_name)

          tables = [
              "customer",
              "lineitem",
              "nation",
              "orders",
              "part",
              "partsupp",
              "region",
              "supplier",
          ]

          connection = duckdb.connect()
          connection.execute("INSTALL ducklake; LOAD ducklake;")
          connection.execute("INSTALL postgres; LOAD postgres;")
          connection.execute("INSTALL httpfs; LOAD httpfs;")
          connection.execute("INSTALL tpch; LOAD tpch;")

          connection.execute(
              """
              CREATE OR REPLACE SECRET minio_secret (
                TYPE s3,
                PROVIDER config,
                KEY_ID 'minioadmin',
                SECRET 'minioadmin',
                REGION 'us-east-1',
                ENDPOINT '127.0.0.1:9000',
                URL_STYLE 'path',
                USE_SSL false
              );
              """
          )

          connection.execute(
              """
              ATTACH 'ducklake:postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' AS ducklake
                (DATA_PATH 's3://ducklake/tpch_sf1/');
              """
          )

          connection.execute("CALL dbgen(sf=1);")

          for table in tables:
              connection.execute(
                  f"CREATE TABLE ducklake.main.{table} AS SELECT * FROM memory.main.{table};"
              )

          connection.close()
          PY

      # The Databricks cluster auto-terminates when idle. A run that arrives while it is still starting
      # fails every dataset with "The cluster is in unexpected state Pending, while waiting for RUNNING",
      # and spiced never reaches ready. Bring it up and wait before launching spiced.
      - name: Start the Databricks cluster
        if: ${{ contains(inputs.spicepod_path, 'spark') }}
        env:
          DATABRICKS_HOST: ${{ vars.CI_DATABRICKS_HOST }}
          DATABRICKS_OIDC_CLIENT_ID: ${{ vars.DATABRICKS_OIDC_CLIENT_ID }}
          DATABRICKS_OIDC_AUDIENCE: ${{ vars.DATABRICKS_OIDC_AUDIENCE }}
          DATABRICKS_CLUSTER_ID: ${{ vars.CI_DATABRICKS_CLUSTER_ID }}
        run: |
          # The Clusters API takes cluster_id as a query/body parameter; a path segment such as
          # /clusters/<id>/start returns ENDPOINT_NOT_FOUND.
          base="https://${DATABRICKS_HOST}/api/2.1/clusters"

          # A Databricks token lasts as long as the job's OIDC token, about five minutes, which is
          # shorter than a cluster can take to start.
          auth() {
            printf 'Authorization: Bearer %s' "$(bash .github/scripts/databricks_oidc_token.sh)"
          }

          state() {
            curl -s "${base}/get?cluster_id=${DATABRICKS_CLUSTER_ID}" -H "$(auth)" | jq -r '.state // .message'
          }

          state_now=$(state)
          echo "cluster ${DATABRICKS_CLUSTER_ID} state: ${state_now}"
          if [ "$state_now" = "TERMINATED" ]; then
            curl -s -X POST "${base}/start" -H "$(auth)" -H 'Content-Type: application/json' \
              -d "{\"cluster_id\":\"${DATABRICKS_CLUSTER_ID}\"}" > /dev/null
          fi

          for _ in $(seq 1 80); do
            state_now=$(state)
            echo "cluster ${DATABRICKS_CLUSTER_ID} state: ${state_now}"
            case "$state_now" in
              RUNNING) exit 0 ;;
              ERROR) echo "cluster ${DATABRICKS_CLUSTER_ID} is ERROR"; exit 1 ;;
            esac
            sleep 15
          done
          echo "cluster ${DATABRICKS_CLUSTER_ID} did not reach RUNNING"
          exit 1

      # The image restores its database once, after a fixed sleep, and never retries;
      # see .github/scripts/mssql_tpch_restore.sh.
      - name: Wait for the SQL Server TPC-H database
        if: ${{ contains(inputs.spicepod_path, 'mssql') }}
        # The script gives up after ten minutes; this also bounds a hung docker call.
        timeout-minutes: 15
        env:
          MSSQL_SA_PASSWORD: S3cretP@ssw0rd
        run: bash .github/scripts/mssql_tpch_restore.sh "${{ job.services.mssql_tpch.id }}" tpch_sf1

      # Short-lived AWS credentials, kept out of the job's environment and passed to the step below.
      - name: Assume the Databricks Delta role
        id: aws-databricks-delta
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_NEW_AWS_DATABRICKS_DELTA_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-databricks-delta-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Assume the S3 and Glue role
        id: aws-s3-athena
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_AWS_S3_ATHENA_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-s3-athena-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Assume the DynamoDB role
        id: aws-dynamodb
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_AWS_DYNAMODB_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-dynamodb-${{ github.run_id }}
          role-duration-seconds: 36000
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      # `--disable-caching` sends `Cache-Control: no-cache` on the benchmark's Flight
      # connection. It is load-bearing: `runtime.caching.sql_results` is enabled by
      # default with a one-second `item_ttl`, and the harness runs one warmup query
      # followed by N timed iterations of the identical SQL back-to-back. Without it
      # the warmup populates the cache and every timed iteration is a cache read, so
      # the recorded durations describe the cache rather than the engine.
      - name: Run the benchmark test - ${{ inputs.spicepod_path }}
        run: |
          [ -z "$AWS_ENDPOINT_URL" ] && unset AWS_ENDPOINT_URL

          rm -rf .spice/data
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" testoperator run bench \
            -s /usr/local/bin/spiced \
            -p "${SPICEPOD_PATH}" \
            -d /opt/spiced/data \
            --query-set "${INPUT_QUERY_SET}" \
            ${INPUT_SCENARIO_QUERY_FILE:+--scenario-query-file "./test/scenario/${INPUT_SCENARIO_QUERY_FILE}"} \
            ${INPUT_QUERY_OVERRIDES:+--query-overrides "${INPUT_QUERY_OVERRIDES}"} \
            --ready-wait "${INPUT_READY_WAIT}" \
            --disable-progress-bars \
            --disable-caching="${INPUT_DISABLE_CACHING}" \
            --validate="${INPUT_VALIDATE_RESULTS}" \
            ${LAYOUT:+--layout "$LAYOUT"} \
            --snapshots="${SNAPSHOTS_ON}" \
            --metrics \
            --scale-factor "${INPUT_SCALE_FACTOR}"
        env:
          LAYOUT: ${{ inputs.layout }}
          S3_ENDPOINT: ${{ vars.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ steps.rustfs.outputs.access-key-id }}
          S3_SECRET: ${{ steps.rustfs.outputs.secret-access-key }}
          S3_SESSION_TOKEN: ${{ steps.rustfs.outputs.session-token }}
          DATABRICKS_HOST: ${{ vars.CI_DATABRICKS_HOST }}
          DATABRICKS_OIDC_CLIENT_ID: ${{ vars.DATABRICKS_OIDC_CLIENT_ID }}
          DATABRICKS_OIDC_AUDIENCE: ${{ vars.DATABRICKS_OIDC_AUDIENCE }}
          DATABRICKS_CLUSTER_ID: ${{ vars.CI_DATABRICKS_CLUSTER_ID }}
          AWS_DATABRICKS_DELTA_ACCESS_KEY_ID: ${{ steps.aws-databricks-delta.outputs.aws-access-key-id }}
          AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY: ${{ steps.aws-databricks-delta.outputs.aws-secret-access-key }}
          AWS_DATABRICKS_DELTA_SESSION_TOKEN: ${{ steps.aws-databricks-delta.outputs.aws-session-token }}
          AWS_ACCESS_KEY_ID: ${{ contains(inputs.spicepod_path, 'ducklake') && 'minioadmin' || steps.aws-s3-athena.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ contains(inputs.spicepod_path, 'ducklake') && 'minioadmin' || steps.aws-s3-athena.outputs.aws-secret-access-key }}
          # MinIO takes no session token. The negated form is needed: `a && '' || b` yields b.
          AWS_SESSION_TOKEN: ${{ !contains(inputs.spicepod_path, 'ducklake') && steps.aws-s3-athena.outputs.aws-session-token || '' }}
          AWS_DYNAMODB_ACCESS_KEY_ID: ${{ steps.aws-dynamodb.outputs.aws-access-key-id }}
          AWS_DYNAMODB_SECRET_ACCESS_KEY: ${{ steps.aws-dynamodb.outputs.aws-secret-access-key }}
          AWS_DYNAMODB_SESSION_TOKEN: ${{ steps.aws-dynamodb.outputs.aws-session-token }}
          AWS_ENDPOINT_URL: ${{ contains(inputs.spicepod_path, 'ducklake') && 'http://127.0.0.1:9000' || '' }}
          AWS_ALLOW_HTTP: ${{ contains(inputs.spicepod_path, 'ducklake') && 'true' || '' }}
          DUCKLAKE_CONNECTION_STRING: ${{ contains(inputs.spicepod_path, 'ducklake') && 'postgres:dbname=ducklake_catalog host=localhost user=postgres password=postgres' || '' }}
          GLUE_AWS_KEY: ${{ steps.aws-s3-athena.outputs.aws-access-key-id }}
          GLUE_AWS_SECRET: ${{ steps.aws-s3-athena.outputs.aws-secret-access-key }}
          GLUE_AWS_SESSION_TOKEN: ${{ steps.aws-s3-athena.outputs.aws-session-token }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_USERNAME: ${{ secrets.SNOWFLAKE_USERNAME }}
          MYSQL_HOST: ${{ vars.TEST_MYSQL_HOST }}
          MYSQL_TCP_PORT: 3306
          MYSQL_USER: ${{ secrets.TEST_MYSQL_USERNAME }}
          MYSQL_PASSWORD: ${{ secrets.TEST_MYSQL_PASSWORD }}
          MONGODB_HOST: ${{ vars.TEST_MONGODB_HOST }}
          MONGODB_PASSWORD: ${{ secrets.TEST_MONGODB_PASSWORD }}
          POSTGRES_HOST: ${{ (contains(inputs.spicepod_path, 'postgres') && !contains(inputs.spicepod_path, 'ducklake') && (startsWith(inputs.query_set, 'tpch') || inputs.query_set == 'tpcds') && (inputs.scale_factor == '1' || inputs.scale_factor == '10')) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          POSTGRES_RW_HOST: ${{ (contains(inputs.spicepod_path, 'postgres') && !contains(inputs.spicepod_path, 'ducklake') && (((startsWith(inputs.query_set, 'tpch') || inputs.query_set == 'tpcds') && (inputs.scale_factor == '1' || inputs.scale_factor == '10')))) && '127.0.0.1' || vars.TEST_POSTGRES_HOST }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          SPICEAI_TEST_ENDPOINT: ${{ vars.SPICE_SECRET_SPICEAI_TEST_ENDPOINT }}
          SPICEAI_TEST_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCH_BENCHMARK_KEY }}
          SPICEAI_TEST_TPCDS_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TEST_TPCDS_BENCHMARK_KEY }}
          SPICEAI_CLICKBENCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_CLICKBENCH_BENCHMARK_KEY }}
          SPICEAI_TPCH_API_KEY: ${{ secrets.SPICE_SECRET_SPICEAI_TPCH_BENCHMARK_KEY }}
          SQL_WAREHOUSE_DATABRICKS_HOST: ${{ vars.CI_DATABRICKS_HOST }}
          SQL_WAREHOUSE_DATABRICKS_SQL_WAREHOUSE_ID: ${{ vars.CI_DATABRICKS_SQL_WAREHOUSE_ID }}
          INSTA_UPDATE: ${{ steps.determine_update_snapshots.outputs.update_snapshots}}
          MSSQL_HOST: localhost
          MSSQL_USER: sa
          MSSQL_PASSWORD: S3cretP@ssw0rd
          MSSQL_TPCH_DB: tpch_sf1
          ORACLE_CLOUD_CONNECTION_STRING: ${{ secrets.ORACLE_CLOUD_CONNECTION_STRING }}
          ORACLE_CLOUD_USERNAME: ${{ secrets.ORACLE_CLOUD_USERNAME }}
          ORACLE_CLOUD_PASSWORD: ${{ secrets.ORACLE_CLOUD_PASSWORD }}
          ORACLE_CLOUD_WALLET_SSO_CERT: ${{ secrets.ORACLE_CLOUD_WALLET_SSO_CERT }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT || steps.release-spiced.outputs.SPICED_COMMIT }}
          SCYLLADB_HOST: ${{ contains(inputs.spicepod_path, 'scylladb') && '127.0.0.1' || '' }}
          SCYLLADB_PORT: ${{ contains(inputs.spicepod_path, 'scylladb') && '9042' || '' }}
          SCYLLADB_KEYSPACE: ${{ contains(inputs.spicepod_path, 'scylladb') && 'tpch_sf1' || '' }}
          CHBENCH_PG_HOST: 127.0.0.1
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          INPUT_QUERY_SET: ${{ inputs.query_set }}
          INPUT_SCENARIO_QUERY_FILE: ${{ inputs.scenario_query_file }}
          INPUT_QUERY_OVERRIDES: ${{ inputs.query_overrides }}
          INPUT_READY_WAIT: ${{ inputs.ready_wait }}
          INPUT_DISABLE_CACHING: ${{ inputs.disable_caching }}
          INPUT_VALIDATE_RESULTS: ${{ inputs.validate_results }}
          SNAPSHOTS_ON: ${{ inputs.spiced_ref == '' }}
          INPUT_SCALE_FACTOR: ${{ inputs.scale_factor }}

      - name: Install GH CLI
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always'
        uses: $/.github/actions/install-gh-cli

      - name: Upload benchmark snapshots to branch
        # Writes to the repository: only with the full CI roles.
        if: steps.determine_update_snapshots.outputs.update_snapshots == 'always' && steps.ci-role.outputs.full == 'true'
        run: |
          git fetch --unshallow || true

          # if the spiced commit is set, use that as the branch ID
          if [ -n "${INPUT_SPICED_COMMIT}" ]; then
            BRANCH_ID="${INPUT_SPICED_COMMIT}"
          else
            BRANCH_ID=${{ github.run_id }}
          fi

          BASE_BRANCH="testoperator-snapshot-update/${BRANCH_ID}"
          BRANCH_NAME="${BASE_BRANCH}"

          git config --global user.name 'Spice Benchmark Snapshot Update Bot'
          git config --global user.email 'spiceaibot@spice.ai'
          git checkout -b "${BRANCH_NAME}"
          git add '*.snap'
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Update ${INPUT_QUERY_SET} benchmark snapshots for ${INPUT_SPICEPOD_PATH}"
            SNAPSHOT_COMMIT="$(git rev-parse HEAD)"

            # Every run dispatched for one spiced commit pushes to the same
            # branch, so the push can lose in two ways that say nothing about
            # the benchmark:
            # - another run pushed first ("fetch first", or any rejection after
            #   which the branch tip has moved): move this run's snapshot
            #   commit onto the new tip and push again;
            # - the branch's PR is already in the merge queue (GH006: queued
            #   branches cannot be updated): carry on in the next branch,
            #   <base>-2, <base>-3, ..., which gets its own PR.
            # Any other rejection fails the step.
            remote_tip() { git ls-remote --heads origin "refs/heads/$1" | cut -f1; }
            suffix=1
            pushed=false
            for attempt in 1 2 3 4 5 6 7 8; do
              git checkout -B "${BRANCH_NAME}" "${SNAPSHOT_COMMIT}"
              tip_before="$(remote_tip "${BRANCH_NAME}")"
              if [ -n "${tip_before}" ]; then
                # Move only the snapshot commit. Runs for one spiced commit can
                # check out different trunk heads, and `git pull --rebase` would
                # also replay every trunk commit between them onto the branch
                # as new commits, putting unrelated source changes in the PR.
                git fetch origin "refs/heads/${BRANCH_NAME}"
                if ! git rebase --onto FETCH_HEAD "${SNAPSHOT_COMMIT}^"; then
                  git rebase --abort || true
                  echo "::error::This run's snapshots conflict with snapshots another run already pushed to ${BRANCH_NAME}; resolve the .snap conflict on that branch by hand."
                  exit 1
                fi
              fi
              # Non-interactive: a credential helper on the runner can otherwise intercept
              # this push and block on a prompt forever. See
              # scripts/check_ci_git_push_noninteractive.py.
              if push_log="$(git -c credential.helper='' -c credential.interactive=false \
                push origin "${BRANCH_NAME}" 2>&1)"; then
                echo "${push_log}"
                pushed=true
                break
              fi
              echo "${push_log}"
              # GH006 is any protected-branch rejection; only the merge-queue lock
              # moves the snapshots to the next branch.
              if grep -q 'GH006' <<<"${push_log}" && grep -q 'queued for merging' <<<"${push_log}"; then
                suffix=$((suffix + 1))
                echo "::notice::${BRANCH_NAME} is locked by the merge queue; pushing these snapshots to ${BASE_BRANCH}-${suffix} instead."
                BRANCH_NAME="${BASE_BRANCH}-${suffix}"
              elif grep -qE 'fetch first|non-fast-forward' <<<"${push_log}" \
                || [ "$(remote_tip "${BRANCH_NAME}")" != "${tip_before}" ]; then
                echo "::notice::Another run pushed to ${BRANCH_NAME} first (attempt ${attempt}); rebasing onto it and pushing again."
                # Jittered, so runs that collided do not retry in lockstep.
                if [ "${attempt}" -lt 8 ]; then sleep $((RANDOM % 5 + 1)); fi
              else
                # A new branch from a release-branch commit is refused on every
                # attempt (GitHub times out checking it for workflow changes);
                # keep the snapshots as an artifact and say so.
                printf '%s\n' "${push_log}" >"${RUNNER_TEMP}/snapshot-push.log"
                if bash .github/scripts/save_unpushable_snapshots.sh \
                  "${RUNNER_TEMP}/snapshot-push.log" "${BRANCH_NAME}" "${GITHUB_REF_NAME}"; then
                  exit 1
                fi
                echo "::error::Pushing the benchmark snapshots to ${BRANCH_NAME} was rejected for a reason other than a concurrent push or a queued branch; see the git output above."
                exit 1
              fi
            done
            if [ "${pushed}" != true ]; then
              echo "::error::The benchmark snapshots were not pushed after 8 attempts; the last branch tried was ${BRANCH_NAME}."
              exit 1
            fi

            PR_URL="$(gh pr list --head "${BRANCH_NAME}" --state open --json url --jq .[].url)"
            if [[ -n "${PR_URL}" ]]; then
              echo "PR already exists -> ${PR_URL}"
            else
              BODY=$(cat <<EOF
          Automated benchmark snapshot update from workflow run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          **Query set:** \`${INPUT_QUERY_SET}\`
          **Spicepod:** \`${INPUT_SPICEPOD_PATH}\`
          **Profile:** \`${INPUT_PROFILE_OPTION}\`
          EOF
          )
              # Target the branch the run was dispatched on. enforce-pull-with-spice, a required
              # check, fails a PR without both a kind/ and an area/ label.
              gh pr create --title "fix: Update ${INPUT_QUERY_SET} benchmark snapshots for ${INPUT_SPICEPOD_PATH}" --body "${BODY}" --base "${GITHUB_REF_NAME}" --head "${BRANCH_NAME}" --label kind/bug --label area/tests
              # Auto-merge only into trunk: on an unprotected feature branch
              # --auto merges immediately, before the branch owner can review
              # the snapshots.
              if [ "${GITHUB_REF_NAME}" = "trunk" ]; then
                gh pr merge --squash --auto "${BRANCH_NAME}"
              fi
            fi
            # Release the pull_request runs GitHub holds on a GITHUB_TOKEN push (see the script).
            bash .github/scripts/approve_bot_pr_runs.sh "${BRANCH_NAME}" "$(git rev-parse HEAD)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never fall back to an interactive prompt; fail fast if auth is rejected.
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'never'
          INPUT_SPICED_COMMIT: ${{ inputs.spiced_commit }}
          INPUT_QUERY_SET: ${{ inputs.query_set }}
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
          INPUT_PROFILE_OPTION: ${{ inputs.profile_option || 'release' }}

      - name: Upload snapshots GitHub refused to push
        # save_unpushable_snapshots.sh leaves the snapshot commit here when
        # GitHub will not let GITHUB_TOKEN create the snapshot branch.
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpushed-snapshots
          path: ${{ runner.temp }}/unpushed-snapshots/
          if-no-files-found: ignore
          retention-days: 14
