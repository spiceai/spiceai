---
name: Approve Bot PR Runs Tests

# `.github/scripts/approve_bot_pr_runs.sh` approves held pull_request runs, which
# starts CI on a commit nobody reviewed, so the runs it must leave alone (another
# commit, a fork, a run a person triggered) are tested as carefully as the ones
# it must release.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - '.github/scripts/approve_bot_pr_runs.sh'
      - '.github/scripts/test_approve_bot_pr_runs.sh'
      - '.github/workflows/approve_bot_pr_runs_test.yml'
  push:
    branches:
      - trunk
    paths:
      - '.github/scripts/approve_bot_pr_runs.sh'
      - '.github/scripts/test_approve_bot_pr_runs.sh'
      - '.github/workflows/approve_bot_pr_runs_test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-approve-bot-pr-runs:
    name: Unit tests for approve_bot_pr_runs.sh
    runs-on: spiceai-dev-runners
    timeout-minutes: 5
    # A checkout plus a local bash script against a stub `gh`, so the job reads
    # the repository and nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        # Invoked through `bash` rather than as `./…` so the job does not depend
        # on the script's executable bit surviving a checkout on every platform.
        run: bash .github/scripts/test_approve_bot_pr_runs.sh
