---
name: integration tests (models)

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC

  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests'
        type: boolean
        required: false
        default: false
      update_snapshots:
        description: 'Update the snapshots?'
        required: false
        default: 'no'
        type: choice
        options:
          - 'always'
          - 'no'

concurrency:
  # Allow only one workflow per any non-trunk branch.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # CI performance optimizations
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  AI_INTEGRATION_TEST_ARCHIVE_S3_URI: s3://build/test_binaries/${{ github.run_id }}/ai-integration-test-archive/integration.tar.zst
  AI_INTEGRATION_EXTENDED_TEST_ARCHIVE_S3_URI: s3://build/test_binaries/${{ github.run_id }}/ai-integration-test-archive-extended/integration-extended.tar.zst

# The spiceio setup action exports AWS_ENDPOINT_URL (alongside SCCACHE_ENDPOINT) so that sccache
# and the AWS CLI reach the local cache. The build jobs need it. The test jobs must not hand it to
# spiced: it honours AWS_ENDPOINT_URL for every s3:// dataset and for the S3 Vectors API, so the
# public fixtures these tests load resolve to the build cache instead of AWS and never become
# ready. Every step below that runs the test binary drops it first.
jobs:
  build:
    name: Build Test Binary (macOS)
    runs-on: spiceai-macos-large
    environment: ci-build
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1
          immutable-objects: "true"
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Set up sccache
        if: runner.os == 'macOS' && steps.setup-spiceio.outputs.endpoint != ''
        uses: ./.github/actions/setup-sccache
        with:
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      # Build the test binary without running tests
      - name: Build AI integration test binary
        env:
          # Metal runners do not have `xcrun metal`
          # See `https://github.com/EricLBuehler/mistral.rs/pull/1311`
          MISTRALRS_METAL_PRECOMPILE: 0
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          FEATURES="flightsql,models,metal,s3_vectors,kafka"
          if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            FEATURES="${FEATURES},bedrock,extended_tests"
            echo "Including extended_tests"
          else
            echo "Excluding extended_tests"
          fi

          cargo nextest archive -p runtime --test integration_models --features ${FEATURES} --archive-file integration.tar.zst

      - name: Preserve sccache spiceio log
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: cp "${{ runner.temp }}/spiceio.log" "${{ runner.temp }}/spiceio-sccache.log" || true

      - name: Stop sccache spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      - name: Clean spiceio install directory
        if: env.HAS_SPICEIO_SECRET == 'true'
        run: rm -rf "${{ runner.temp }}/spiceio-bin"

      - name: Set up spiceio for build archive
        if: env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio-build
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Upload test archive to spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio-build.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to upload the AI integration test archive}"
          archive_url="${SPICEIO_ENDPOINT%/}/${AI_INTEGRATION_TEST_ARCHIVE_S3_URI#s3://}"
          curl --fail --silent --show-error --upload-file ./integration.tar.zst "$archive_url"

      # `test-models` and `test-bedrock` run in `ci`, which has no NAS password, so they
      # read this copy.
      - name: Upload test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-integration-test-archive
          path: ./integration.tar.zst
          retention-days: 3
          compression-level: 1

      - name: Kill build archive spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio-build.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio-build.outputs.pid }} || true

      - name: Upload spiceio logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spiceio-models-build-logs
          path: ${{ runner.temp }}/spiceio*.log
          if-no-files-found: ignore

  test-models:
    name: Test Models & AI
    needs: build
    # `spiceai-macos-large`, like every other job that runs this archive: the
    # Mac minis behind `spiceai-macos` cannot reliably start the debug
    # `integration_models` binary. dyld fails to map the shared cache into it
    # (`dyld cache '(null)' not loaded: syscall to map cache into shared region
    # failed`, then `Library not loaded: /usr/lib/libiconv.2.dylib`), so
    # `nextest --list` and every test process abort with SIGABRT before any
    # test code runs, while the same archive starts cleanly on the MacBook Pros.
    runs-on: spiceai-macos-large
    # Holds the OpenAI and Anthropic workload identity federation IDs (`OPENAI_*` and
    # `ANTHROPIC_*` secrets).
    environment: ci
    permissions:
      contents: write
      pull-requests: write
      # Approves the snapshot PR's held pull_request runs.
      actions: write
      # Exchanged for OpenAI and Anthropic access tokens: workload identity federation.
      id-token: write
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}
      HAS_OPENAI_WIF: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID != '' }}
      HAS_ANTHROPIC_WIF: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID != '' }}
      HAS_XAI_SECRET: ${{ secrets.SPICE_SECRET_XAI_API_KEY != '' }}
      HAS_HF_SECRET: ${{ secrets.SPICE_SECRET_HF_TOKEN != '' }}
      # Workload identity federation: spiced and the tests exchange this job's GitHub OIDC token
      # for provider access tokens with these IDs, and exchange again before each expires.
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Download test archive from spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to download the AI integration test archive}"
          mkdir -p ./integration_test
          archive_url="${SPICEIO_ENDPOINT%/}/${AI_INTEGRATION_TEST_ARCHIVE_S3_URI#s3://}"
          curl --fail --silent --show-error --output ./integration_test/integration.tar.zst "$archive_url"

      - name: Download test archive
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ai-integration-test-archive
          path: ./integration_test

      - name: Set up API Keys
        env:
          SPICE_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
        run: |
          printf 'SPICE_XAI_API_KEY="%s"\n' "$SPICE_XAI_API_KEY" > .env

      # OpenAI tests
      - name: Run OpenAI integration test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- openai_test

      - name: Run OpenAI Beta functionality embeddings test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- openai_embeddings_beta_requirements

      # AI UDF tests
      - name: Run AI UDF basic test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' && env.HAS_ANTHROPIC_WIF == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          if [ -z "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            echo "ERROR: ANTHROPIC_FEDERATION_RULE_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_basic

      - name: Run Anthropic prompt caching test
        if: ${{ !cancelled() && env.HAS_ANTHROPIC_WIF == 'true' }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            echo "ERROR: ANTHROPIC_FEDERATION_RULE_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- anthropic_prompt_caching_through_tool_calls

      - name: Run AI UDF with dataset test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' && env.HAS_ANTHROPIC_WIF == 'true' && env.HAS_XAI_SECRET == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_SECRET_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          if [ -z "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            echo "ERROR: ANTHROPIC_FEDERATION_RULE_ID is required but not set"
            exit 1
          fi
          if [ -z "${SPICE_SECRET_XAI_API_KEY:-}" ]; then
            echo "ERROR: SPICE_SECRET_XAI_API_KEY is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_with_dataset

      # Tools that Spice runs for a model: the tool calls of earlier turns reach the provider, and
      # each provider round reuses the prompt cache.
      - name: Run Spice tool turns test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' && env.HAS_ANTHROPIC_WIF == 'true' && env.HAS_XAI_SECRET == 'true' }}
        env:
          SPICE_SECRET_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          if [ -z "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            echo "ERROR: ANTHROPIC_FEDERATION_RULE_ID is required but not set"
            exit 1
          fi
          if [ -z "${SPICE_SECRET_XAI_API_KEY:-}" ]; then
            echo "ERROR: SPICE_SECRET_XAI_API_KEY is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- spice_tool_turns

      # The Anthropic Messages API: an Anthropic model receives each request as sent, Spice's tool
      # calls replay against Anthropic, and an OpenAI model receives the request as a chat completion.
      - name: Run Messages API test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' && env.HAS_ANTHROPIC_WIF == 'true' }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          if [ -z "${ANTHROPIC_FEDERATION_RULE_ID:-}" ]; then
            echo "ERROR: ANTHROPIC_FEDERATION_RULE_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- models::messages::

      # NOTE: Step-level `if:` conditionals on secret-requiring AI test steps (OpenAI, workers, search, xAI/HF UDFs, etc.) cause the step to report "skipped" (neutral, job succeeds) on PRs where secrets are intentionally unavailable for security (forks/external PRs). When a step *does* execute (schedule/workflow_dispatch with secrets present), an explicit fast-fail guard at the start of `run:` errors immediately if a required key is missing, preserving the original intent. This is intentional and confirmed for schedule + workflow_dispatch (incl. `run_all_tests`). See Copilot review threads for context; prevents spurious reds unrelated to code.
      - name: Run AI UDF LEFT truncate test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' && env.HAS_ANTHROPIC_WIF == 'true' && env.HAS_XAI_SECRET == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_SECRET_XAI_API_KEY: ${{ secrets.SPICE_SECRET_XAI_API_KEY }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_left_truncate

      # Local model tests
      - name: Run local embeddings Beta functionality test
        if: ${{ !cancelled() }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- local_embeddings_beta_requirements

      # Embeddings come from a local stub, so no credentials are needed
      - name: Run embedding filter and limit tests
        if: ${{ !cancelled() }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- embedding_filter_limit

      - name: Run AI UDF with local model test
        if: ${{ !cancelled() && env.HAS_HF_SECRET == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- test_ai_udf_with_local_model

      # Workers tests
      - name: Run workers integration test
        if: ${{ !cancelled() && env.HAS_OPENAI_WIF == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${OPENAI_IDENTITY_PROVIDER_ID:-}" ]; then
            echo "ERROR: OPENAI_IDENTITY_PROVIDER_ID is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- workers

      - name: Push snapshots to branch
        if: ${{ !cancelled() && (github.event.inputs.update_snapshots == 'always' || github.event_name == 'schedule') }}
        timeout-minutes: 10
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  test-hf:
    name: Test Hugging Face Models
    needs: build
    if: ${{ github.event.inputs.run_all_tests == 'true' || github.event_name == 'schedule' }}
    runs-on: spiceai-macos-large
    environment: ci-build
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}
      HAS_HF_SECRET: ${{ secrets.SPICE_SECRET_HF_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Download test archive from spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to download the AI integration test archive}"
          mkdir -p ./integration_test
          archive_url="${SPICEIO_ENDPOINT%/}/${AI_INTEGRATION_TEST_ARCHIVE_S3_URI#s3://}"
          curl --fail --silent --show-error --output ./integration_test/integration.tar.zst "$archive_url"

      - name: Download test archive
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ai-integration-test-archive
          path: ./integration_test

      - name: Run integration test
        if: ${{ !cancelled() && env.HAS_HF_SECRET == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${SPICE_HF_TOKEN:-}" ]; then
            echo "ERROR: SPICE_SECRET_HF_TOKEN is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- huggingface_test

      - name: Run Beta functionality embedding tests
        if: ${{ !cancelled() && env.HAS_HF_SECRET == 'true' }}
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          SPICE_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          if [ -z "${SPICE_HF_TOKEN:-}" ]; then
            echo "ERROR: SPICE_SECRET_HF_TOKEN is required but not set"
            exit 1
          fi
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- hf_embeddings_beta_requirements

      - name: Push snapshots to branch
        if: ${{ !cancelled() && (github.event.inputs.update_snapshots == 'always' || github.event_name == 'schedule') }}
        timeout-minutes: 10
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  test-bedrock:
    name: Test Bedrock Models
    needs: [build]
    if: ${{ github.event.inputs.run_all_tests == 'true' || github.event_name == 'schedule' }}
    # The large pool for the same reason as `test-models`: a Mac mini cannot
    # reliably start this archive's test binary.
    runs-on: spiceai-macos-large
    # Holds the ARN of the IAM role the tests call Bedrock as (`AWS_BEDROCK_ROLE_ARN`).
    environment: ci
    permissions:
      contents: write
      pull-requests: write
      # Approves the snapshot PR's held pull_request runs.
      actions: write
      # Exchanged for the Bedrock role's AWS credentials: workload identity federation.
      id-token: write
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      # The role trusts this job's GitHub OIDC token (subject
      # `repo:spiceai/spiceai:environment:ci`), so CI holds no AWS access key. The credentials
      # go to the test step alone, not the job's environment. Assumed before spiceio starts, so
      # no build-cache endpoint can reach the STS call.
      - name: Check for the Bedrock role
        env:
          AWS_BEDROCK_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
        run: |
          if [ -z "$AWS_BEDROCK_ROLE_ARN" ]; then
            echo "::error::AWS_BEDROCK_ROLE_ARN is not set in the ci environment, so the Bedrock tests cannot authenticate. Create the IAM role that trusts this repository's GitHub OIDC tokens and set the secret to its ARN."
            exit 1
          fi

      - name: Assume the Bedrock role
        id: bedrock-role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          role-session-name: gha-bedrock-${{ github.run_id }}
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Download test archive from spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to download the AI integration test archive}"
          mkdir -p ./integration_test
          archive_url="${SPICEIO_ENDPOINT%/}/${AI_INTEGRATION_TEST_ARCHIVE_S3_URI#s3://}"
          curl --fail --silent --show-error --output ./integration_test/integration.tar.zst "$archive_url"

      - name: Download test archive
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ai-integration-test-archive
          path: ./integration_test

      - name: Run Beta functionality embedding tests
        env:
          INSTA_UPDATE: ${{ github.event_name == 'schedule' && 'always' || github.event.inputs.update_snapshots }}
          AWS_BEDROCK_KEY: ${{ steps.bedrock-role.outputs.aws-access-key-id }}
          AWS_BEDROCK_SECRET: ${{ steps.bedrock-role.outputs.aws-secret-access-key }}
          AWS_BEDROCK_SESSION_TOKEN: ${{ steps.bedrock-role.outputs.aws-session-token }}
        run: |
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- bedrock_test

      # The path EKS (IRSA) and any other OIDC token file take: no key at all, only
      # `AWS_ROLE_ARN` and `AWS_WEB_IDENTITY_TOKEN_FILE`, which spiced's AWS credential chain
      # exchanges with STS itself. A GitHub OIDC token lives 5 minutes, which this one test
      # needs for a single exchange; STS's credentials then last the role's session.
      - name: Run a Bedrock test with web identity credentials
        if: ${{ !cancelled() }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          AWS_ROLE_SESSION_NAME: gha-bedrock-web-identity-${{ github.run_id }}
        run: |
          set -euo pipefail
          unset AWS_ENDPOINT_URL # spiced must not use the build cache's S3 endpoint
          export AWS_WEB_IDENTITY_TOKEN_FILE="${RUNNER_TEMP}/aws-web-identity-token"
          trap 'rm -f "$AWS_WEB_IDENTITY_TOKEN_FILE"' EXIT
          umask 077
          # The request token goes to curl on stdin, out of the process list.
          printf 'header = "Authorization: bearer %s"\n' "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" |
            curl --config - --fail --silent --show-error --max-time 30 \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c 'import json, sys; sys.stdout.write(json.load(sys.stdin)["value"])' \
              > "$AWS_WEB_IDENTITY_TOKEN_FILE"
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo nextest run --workspace-remap "${PWD}" --archive-file ./integration_test/integration.tar.zst -- bedrock_test_ai_if_answers

      - name: Push snapshots to branch
        if: ${{ !cancelled() && (github.event.inputs.update_snapshots == 'always' || github.event_name == 'schedule') }}
        timeout-minutes: 10
        uses: ./.github/actions/push-snap-changes
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kill spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

  build-extended:
    name: Build Test Binary (Extended)
    runs-on: spiceai-macos-large
    environment: ci-build
    env:
      HAS_SPICEIO_SECRET: ${{ secrets.SMB_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # Shallow clone for faster checkout

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up spiceio
        if: runner.os == 'macOS' && env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: sccache
          region: us-west-1
          immutable-objects: "true"
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Set up sccache
        if: runner.os == 'macOS' && steps.setup-spiceio.outputs.endpoint != ''
        uses: ./.github/actions/setup-sccache
        with:
          spiceio_endpoint: ${{ steps.setup-spiceio.outputs.endpoint }}

      - name: Set up Nextest
        uses: ./.github/actions/setup-nextest

      # Build the test binary without running tests
      - name: Build AI integration test binary
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
        run: |
          FEATURES="flightsql,models,s3_vectors,kafka"
          if [[ "${{ github.event.inputs.run_all_tests }}" == "true" ]] || [[ "${{ github.event_name }}" == "schedule" ]]; then
            FEATURES="${FEATURES},bedrock,extended_tests"
            echo "Including extended_tests"
          else
            echo "Excluding extended_tests"
          fi

          cargo nextest archive -p runtime --test integration_models --features ${FEATURES} --archive-file integration-extended.tar.zst

      - name: Preserve sccache spiceio log
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: cp "${{ runner.temp }}/spiceio.log" "${{ runner.temp }}/spiceio-sccache.log" || true

      - name: Stop sccache spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio.outputs.pid }} || true

      - name: Clean spiceio install directory
        if: env.HAS_SPICEIO_SECRET == 'true'
        run: rm -rf "${{ runner.temp }}/spiceio-bin"

      - name: Set up spiceio for build archive
        if: env.HAS_SPICEIO_SECRET == 'true'
        id: setup-spiceio-build
        uses: spiceai/spiceio/.github/actions/setup@dd13a600d4af72fb179563000674f76812208534 # v0.11.0 assets; no gh; strips Authorization on cross-host redirect
        with:
          smb-url: smb://runner@192.168.3.148/ai_platform_dev
          smb-pass: ${{ secrets.SMB_PASSWORD }}
          token: ${{ github.token }}
          bucket: build
          region: us-west-1
          otel-endpoint: spicehq/spiceio
          otel-api-key: ${{ secrets.SCP_SPICEHQ_SPICEIO_API_KEY }}
          otel-region: us-west-2
          instance-id: ci-${{ github.run_id }}-${{ github.job }}
          machine: ${{ runner.name }}

      - name: Upload test archive to spiceio
        if: env.HAS_SPICEIO_SECRET == 'true'
        env:
          SPICEIO_ENDPOINT: ${{ steps.setup-spiceio-build.outputs.endpoint }}
        run: |
          set -euo pipefail
          : "${SPICEIO_ENDPOINT:?spiceio endpoint is required to upload the extended AI integration test archive}"
          archive_url="${SPICEIO_ENDPOINT%/}/${AI_INTEGRATION_EXTENDED_TEST_ARCHIVE_S3_URI#s3://}"
          curl --fail --silent --show-error --upload-file ./integration-extended.tar.zst "$archive_url"

      - name: Upload test archive
        if: env.HAS_SPICEIO_SECRET != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ai-integration-test-archive-extended
          path: ./integration-extended.tar.zst
          retention-days: 3
          compression-level: 1

      - name: Kill build archive spiceio
        if: always() && runner.os == 'macOS' && steps.setup-spiceio-build.outputs.pid != ''
        run: kill ${{ steps.setup-spiceio-build.outputs.pid }} || true

      - name: Upload spiceio logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spiceio-models-build-extended-logs
          path: ${{ runner.temp }}/spiceio*.log
          if-no-files-found: ignore
