---
name: Save Unpushable Snapshots Tests

# `.github/scripts/save_unpushable_snapshots.sh` recognises one push refusal and
# keeps the snapshots it blocked, so the sibling refusals it must leave to the
# caller (a real workflow-file change, a merge-queue lock, a lost race) are
# tested as carefully as the one it handles.
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - '.github/scripts/save_unpushable_snapshots.sh'
      - '.github/scripts/test_save_unpushable_snapshots.sh'
      - '.github/workflows/save_unpushable_snapshots_test.yml'
  push:
    branches:
      - trunk
    paths:
      - '.github/scripts/save_unpushable_snapshots.sh'
      - '.github/scripts/test_save_unpushable_snapshots.sh'
      - '.github/workflows/save_unpushable_snapshots_test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-save-unpushable-snapshots:
    environment: secret-free
    name: Unit tests for save_unpushable_snapshots.sh
    runs-on: spiceai-dev-runners
    timeout-minutes: 5
    # Self-hosted pool: skip PRs from forks so an approved fork run does not
    # execute here. Non-PR events and same-repo PRs still run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    # A checkout plus a local bash script against a throwaway git repository, so
    # the job reads the repository and nothing else.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        # Invoked through `bash` rather than as `./…` so the job does not depend
        # on the script's executable bit surviving a checkout on every platform.
        run: bash .github/scripts/test_save_unpushable_snapshots.sh
