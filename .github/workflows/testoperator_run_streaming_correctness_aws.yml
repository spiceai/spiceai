---
# The jobs of testoperator_run_streaming_correctness.yml that assume a CI AWS role.
# testoperator_run_streaming_correctness.yml calls this file at `@trunk`, so whichever ref it runs on, the definition
# that chooses the role is trunk's.
# A job here assumes the full roles only on trunk (a merge-queue run is not trunk) and
# the read-only pull request role anywhere else, and skips its writes there (the `Choose
# the CI role` step). check_workflow_yaml.py keeps every such job in a file like this.
name: testoperator streaming dynamodb correctness (CI AWS role jobs)

on:
  workflow_call:
    inputs:
      mutation_ratio:
        type: string
        required: false
        default: ''
      mutation_seed:
        type: string
        required: false
        default: ''
      queryset:
        type: string
        required: false
        default: ''
      ready_wait:
        type: string
        required: false
        default: ''
      rounds:
        type: string
        required: false
        default: ''
      runner_type:
        type: string
        required: false
        default: ''
      scale_factor:
        type: string
        required: false
        default: ''
      spiced_commit:
        type: string
        required: false
        default: ''
      spicepod_path:
        type: string
        required: false
        default: ''

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-streaming-correctness:
    environment: ci
    name: Run DynamoDB streaming correctness test
    runs-on: ${{ inputs.runner_type }}
    timeout-minutes: 180
    permissions:
      id-token: write
      contents: read
    steps:
      # Which CI AWS role this job gets, and whether its writes run; see the action.
      - name: Choose the CI role
        id: ci-role
        uses: $/.github/actions/ci-role
        with:
          pull-request-role-set: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN != '' }}
          builds: |
            spiced_commit=${{ inputs.spiced_commit }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assume the streaming benchmark role
        id: aws-streaming
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ steps.ci-role.outputs.full == 'true' && secrets.CI_AWS_STREAMING_BENCH_ROLE_ARN || secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
          role-session-name: gha-streaming-${{ github.run_id }}
          role-duration-seconds: 10800
          aws-region: us-east-1
          output-env-credentials: false
          output-credentials: true

      - name: Set spicepod path
        id: set_spicepod_path
        env:
          INPUT_SPICEPOD_PATH: ${{ inputs.spicepod_path }}
        run: |
          # Support both relative paths (from repo root) and paths with ./ prefix
          INPUT_PATH="${INPUT_SPICEPOD_PATH}"
          if [[ "${INPUT_PATH}" == ./* ]]; then
            SPICEPOD_PATH="${INPUT_PATH}"
          else
            SPICEPOD_PATH="./${INPUT_PATH}"
          fi
          echo "SPICEPOD_PATH=${SPICEPOD_PATH}" >> $GITHUB_OUTPUT

      - name: Validate spicepod file exists
        env:
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
        run: |
          if [ ! -f "${SPICEPOD_PATH}" ]; then
            echo "Error: Spicepod file not found at ${SPICEPOD_PATH}"
            exit 1
          fi
          echo "Spicepod file found at ${SPICEPOD_PATH}"

      - name: Get RustFS credentials
        id: rustfs
        uses: $/.github/actions/rustfs-credentials
        with:
          endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          duration-seconds: '10800'
          export-env: 'false'

      - name: Install MinIO
        uses: $/.github/actions/setup-minio
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Setup spiced
        uses: $/.github/actions/setup-spiced
        id: setup-spiced
        with:
          verify: ${{ steps.ci-role.outputs.full }}
          spiced_commit: ${{ inputs.spiced_commit }}

      - name: Display spiced commit
        env:
          SETUP_SPICED_SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
        run: echo "SPICED_COMMIT=${SETUP_SPICED_SPICED_COMMIT}"

      # testoperator generates and checks its data with the DuckDB library installed on the host.
      - name: Set up libduckdb
        uses: $/.github/actions/setup-libduckdb

      - name: Build Testoperator
        uses: $/.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ vars.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
          minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
          minio_session_token: ${{ steps.rustfs.outputs.session-token }}

      - name: Run DynamoDB streaming correctness test
        run: |
          testoperator run streaming-dynamodb-correctness \
            -s /usr/local/bin/spiced \
            -p "${SPICEPOD_PATH}" \
            --queryset "${INPUT_QUERYSET}" \
            --scale-factor "${INPUT_SCALE_FACTOR}" \
            --ready-wait "${INPUT_READY_WAIT}" \
            --rounds "${INPUT_ROUNDS}" \
            --mutation-ratio "${INPUT_MUTATION_RATIO}" \
            --mutation-seed "${INPUT_MUTATION_SEED}" \
            --metrics
        env:
          # DynamoDB credentials
          DYNAMODB_AWS_REGION: us-east-1
          DYNAMODB_AWS_ACCESS_KEY_ID: ${{ steps.aws-streaming.outputs.aws-access-key-id }}
          DYNAMODB_AWS_SECRET_ACCESS_KEY: ${{ steps.aws-streaming.outputs.aws-secret-access-key }}
          DYNAMODB_AWS_SESSION_TOKEN: ${{ steps.aws-streaming.outputs.aws-session-token }}
          # Metrics
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          SPICEPOD_PATH: ${{ steps.set_spicepod_path.outputs.SPICEPOD_PATH }}
          INPUT_QUERYSET: ${{ inputs.queryset }}
          INPUT_SCALE_FACTOR: ${{ inputs.scale_factor }}
          INPUT_READY_WAIT: ${{ inputs.ready_wait }}
          INPUT_ROUNDS: ${{ inputs.rounds }}
          INPUT_MUTATION_RATIO: ${{ inputs.mutation_ratio }}
          INPUT_MUTATION_SEED: ${{ inputs.mutation_seed }}
