name: testoperator search tests

run-name: ${{ github.event_name == 'schedule' && 'search benchmarks - scheduled dispatch' || format('search - {0}', github.event.inputs.spicepod_path) }}

on:
  schedule:
    - cron: '0 6 * * 2,5' # Every Monday and Thursday at 8pm PST (6am UTC next day)
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      benchmark_dataset:
        description: 'Search benchmark dataset to run against'
        required: true
        default: 'quora_retrieval'
        type: choice
        options:
          - 'quora_retrieval'
      ready_wait:
        description: 'Seconds to wait for the spiced instance to become ready'
        required: false
        default: 1800
        type: number

jobs:
  run-bench:
    name: Run Search tests
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ github.event.inputs.spicepod_path }}" ]; then
            echo "Error: Spicepod file not found at ${{ github.event.inputs.spicepod_path }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ github.event.inputs.spicepod_path }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ github.event.inputs.spicepod_path }}"

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Extract spicepod filename path
        id: extract_spicepod_filename
        run: |
          SPICEPOD_PATH="${{ github.event.inputs.spicepod_path }}"
          SPICEPOD_FILENAME=$(basename $SPICEPOD_PATH)
          echo "SPICEPOD_FILENAME=${SPICEPOD_FILENAME}" >> $GITHUB_OUTPUT

      - name: Run the benchmark test - ${{ steps.extract_spicepod_filename.outputs.SPICEPOD_FILENAME }}
        run: |
          rm -rf .spice/data
          testoperator run search \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            --concurrency 10 \
            --benchmark-dataset ${{ github.event.inputs.benchmark_dataset }} \
            --metrics \
            -p "${{ github.event.inputs.spicepod_path }}"
        env:
          OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
          AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
          AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}

  # On schedule, this workflow dispatches `workflow_dispatch` runs of itself — one per
  # configuration in tools/testoperator/dispatch/search — instead of running a spicepod matrix.
  dispatch-scheduled:
    name: Dispatch search benchmarks - Scheduled
    if: ${{ github.event_name == 'schedule' }}
    runs-on: spiceai-dev-runners
    timeout-minutes: 720
    concurrency:
      group: testoperator-run-search-scheduled
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          ref: refs/heads/trunk

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      # --max-concurrent 1 serializes the dispatched runs: configurations that share an
      # embedding model provider throttle each other when run concurrently
      # (https://github.com/spiceai/spiceai/issues/6653). The slot wait must exceed one
      # run's wall clock (up to 60 minutes) so the queue drains instead of giving up.
      # This job is itself an active run of this workflow file; testoperator excludes it
      # from the active-run count via GITHUB_RUN_ID.
      - name: Dispatch search benchmarks - MTEB Quora
        run: |
          testoperator dispatch ./tools/testoperator/dispatch/search \
            --workflow search \
            --max-concurrent 1 \
            --max-concurrent-wait-timeout-mins 90
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
          WORKFLOW_COMMIT: trunk
