name: testoperator search tests
run-name: bench - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      ready_wait:
        description: 'Seconds to wait for the spiced instance to become ready'
        required: false
        default: 1800
        type: number
      sql_pipeline:
        description: 'Parameterized SQL search pipeline: a file path or the SQL text. Leave empty to search through /v1/search.'
        required: false
        default: ''
        type: string

# Every job declares its own token permissions; nothing is granted by default.
permissions: {}

jobs:
  run-bench:
    # Assumes a CI AWS role, so it runs from testoperator_run_search_aws.yml; see that file.
    permissions:
      contents: read
      actions: read
      # Exchanged for OpenAI access tokens: workload identity federation.
      id-token: write
    uses: spiceai/spiceai/.github/workflows/testoperator_run_search_aws.yml@trunk
    # By name, exactly what the called workflow declares in on.workflow_call.secrets.
    secrets:
      CI_AWS_PULL_REQUEST_ROLE_ARN: ${{ secrets.CI_AWS_PULL_REQUEST_ROLE_ARN }}
      CI_AWS_S3_VECTORS_ROLE_ARN: ${{ secrets.CI_AWS_S3_VECTORS_ROLE_ARN }}
      OPENAI_IDENTITY_PROVIDER_ID: ${{ secrets.OPENAI_IDENTITY_PROVIDER_ID }}
      OPENAI_SERVICE_ACCOUNT_ID: ${{ secrets.OPENAI_SERVICE_ACCOUNT_ID }}
      SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
      SPICE_SECRET_HF_TOKEN: ${{ secrets.SPICE_SECRET_HF_TOKEN }}
    with:
      ready_wait: ${{ github.event.inputs.ready_wait }}
      runner_type: ${{ github.event.inputs.runner_type }}
      spiced_commit: ${{ github.event.inputs.spiced_commit }}
      spicepod_path: ${{ github.event.inputs.spicepod_path }}
      sql_pipeline: ${{ github.event.inputs.sql_pipeline }}
