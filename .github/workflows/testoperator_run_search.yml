name: testoperator search tests
run-name: bench - ${{ github.event.inputs.benchmark_dataset }} - ${{ github.event.inputs.spicepod_path }}

on:
  workflow_dispatch:
    inputs:
      spiced_commit:
        description: 'spiced build commit'
        required: false
        type: string
      spicepod_path:
        description: 'The spicepod file to test with'
        required: true
        type: string
      runner_type:
        description: 'Runner type'
        required: true
        default: 'spiceai-dev-runners'
        type: choice
        options:
          - 'spiceai-dev-runners'
          - 'spiceai-dev-large-runners'
      benchmark_dataset:
        description: 'Built-in MTEB dataset to run against. Select "custom" to test the spicepod as-is.'
        required: false
        default: 'custom'
        type: choice
        options:
          - 'custom'
          - 'quora_retrieval'
          - 'miracl_en_retrieval'
          - 'fiqa_retrieval'
          - 'trec_covid_retrieval'
          - 'arguana_retrieval'
          - 'scidocs_retrieval'
          - 'scifact_retrieval'
          - 'nfcorpus_retrieval'
          - 'touche2020_retrieval'
          - 'msmarco_retrieval'
          - 'stackoverflow_qa_retrieval'
      ready_wait:
        description: 'Seconds to wait for the spiced instance to become ready'
        required: false
        default: 1800
        type: number

jobs:
  run-bench:
    name: Run Search tests
    runs-on: ${{ github.event.inputs.runner_type }}
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate spicepod file exists
        run: |
          if [ ! -f "${{ github.event.inputs.spicepod_path }}" ]; then
            echo "Error: Spicepod file not found at ${{ github.event.inputs.spicepod_path }}"
            exit 1
          fi
          echo "Spicepod file found at ${{ github.event.inputs.spicepod_path }}"

      - name: Install MinIO
        uses: ./.github/actions/setup-minio
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Build spicepod validator
        uses: ./.github/actions/build-spicepod-validator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      - name: Validate spicepod
        run: |
          spicepod-validator "${{ github.event.inputs.spicepod_path }}"

      - name: Setup spiced
        uses: ./.github/actions/setup-spiced
        id: setup-spiced
        with:
          spiced_commit: ${{ github.event.inputs.spiced_commit }}

      - name: Display spiced commit
        run: echo "SPICED_COMMIT=${{ steps.setup-spiced.outputs.SPICED_COMMIT }}"

      - name: Build Testoperator
        uses: ./.github/actions/build-testoperator
        with:
          minio_endpoint: ${{ secrets.TEST_MINIO_ENDPOINT }}
          minio_access_key: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          minio_secret_key: ${{ secrets.TEST_MINIO_SECRET_KEY }}

      # The FinanceBench spicepods read a pre-built corpus and its qrels from the bench MinIO
      # bucket (s3://benchmarks/financebench/). That data is not committed, so a fresh bucket
      # leaves the datasets forever unavailable and the run times out waiting for readiness.
      # Stage it here once per bucket for any FinanceBench spicepod, so every workflow that
      # runs one finds the data. Both steps no-op for non-FinanceBench runs.
      - name: Set up Python for FinanceBench staging
        if: contains(github.event.inputs.spicepod_path, 'financebench')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Stage FinanceBench corpus to MinIO
        if: contains(github.event.inputs.spicepod_path, 'financebench')
        env:
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}
        run: |
          set -euo pipefail
          # relevance_data.parquet is the last object financebench_stage.py writes, so its
          # presence means a prior run staged the corpus in full. Skip the work when it is
          # already there, so the corpus is built once and reused across every run.
          if mc stat spice-minio/benchmarks/financebench/relevance_data.parquet >/dev/null 2>&1; then
            echo "FinanceBench data already staged in MinIO; skipping."
            exit 0
          fi
          echo "FinanceBench data not found in MinIO; staging now."
          cargo build --release -p pdf-split
          python3 -m pip install --upgrade boto3 pyarrow
          # Pin --source to a commit so the corpus cannot change under a staged run.
          ./scripts/financebench_stage.py \
            --source https://raw.githubusercontent.com/patronus-ai/financebench/cc39aeb4afdf33909ee1412188bf89035950c2eb \
            --dest s3://benchmarks/financebench/

      - name: Extract spicepod filename path
        id: extract_spicepod_filename
        run: |
          SPICEPOD_PATH="${{ github.event.inputs.spicepod_path }}"
          SPICEPOD_FILENAME=$(basename $SPICEPOD_PATH)
          echo "SPICEPOD_FILENAME=${SPICEPOD_FILENAME}" >> $GITHUB_OUTPUT

      - name: Run the benchmark test - ${{ steps.extract_spicepod_filename.outputs.SPICEPOD_FILENAME }}
        env:
          BENCHMARK_DATASET: ${{ github.event.inputs.benchmark_dataset }}
          S3_ENDPOINT: ${{ secrets.TEST_MINIO_ENDPOINT }}
          S3_KEY: ${{ secrets.TEST_MINIO_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.TEST_MINIO_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.SPICE_SECRET_OPENAI_API_KEY }}
          AWS_S3_VECTORS_KEY: ${{ secrets.AWS_S3_VECTORS_KEY }}
          AWS_S3_VECTORS_SECRET: ${{ secrets.AWS_S3_VECTORS_SECRET }}
          SPICEAI_BENCHMARK_METRICS_KEY: ${{ secrets.SPICEAI_BENCHMARK_METRICS_KEY }}
          SPICED_COMMIT: ${{ steps.setup-spiced.outputs.SPICED_COMMIT }}
        run: |
          rm -rf .spice/data
          # A "custom" (or empty) selection tests the spicepod as-is: omit --benchmark-dataset so the
          # tool runs a custom search rather than downloading an MTEB dataset.
          dataset_flag=""
          if [ -n "$BENCHMARK_DATASET" ] && [ "$BENCHMARK_DATASET" != "custom" ]; then
            dataset_flag="--benchmark-dataset $BENCHMARK_DATASET"
          fi
          testoperator run search \
            --ready-wait ${{ github.event.inputs.ready_wait }} \
            --concurrency 10 \
            $dataset_flag \
            --metrics \
            -p "${{ github.event.inputs.spicepod_path }}"
