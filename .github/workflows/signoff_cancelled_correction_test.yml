---
name: Sign-off Cancelled-Correction Tests

# `scripts/signoff correct-cancelled` runs only while a Remote Sign-off job is
# being torn down, so nothing else exercises it and neither direction of its
# decision is observable until it is already wrong in production.
#
# Under-correcting leaves the bogus `signoff=failure` a signal-killed run posts,
# and Attestation reports a code failure that never happened (#12424).
# Over-correcting overwrites a `signoff=success` that genuinely completed —
# either this run's own, or one another run posted for the same commit — which
# discards passing checks and forces a 1-4 hour re-dispatch (#12428).
on:
  pull_request:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_cancelled_correction.sh'
      - '.github/workflows/signoff_cancelled_correction_test.yml'
  push:
    branches:
      - trunk
    paths:
      - 'scripts/signoff'
      - 'scripts/test_signoff_cancelled_correction.sh'
      - '.github/workflows/signoff_cancelled_correction_test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test-signoff-cancelled-correction:
    name: Unit tests for the sign-off cancelled-correction
    # GitHub-hosted on purpose: this is a sub-second check and must not queue
    # behind the self-hosted pool that runs sign-off itself.
    runs-on: ubuntu-24.04
    # A checkout plus a local bash script against a stub `gh` — the job reads the
    # repository and nothing else, so it needs no write scope. In particular it
    # posts no commit status: the stub records the write instead of making it.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        # Invoked through `bash` rather than as `./…` so the job does not depend
        # on the script's executable bit surviving a checkout on every platform.
        run: bash scripts/test_signoff_cancelled_correction.sh
