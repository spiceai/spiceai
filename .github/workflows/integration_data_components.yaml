---
name: integration tests (data_components)

on:
  push:
    branches:
      - trunk
      - release/*
  pull_request_target:
    branches:
      - trunk
      - release-*
      - release/*
      - feature-*
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'README.md'
      - 'Makefile'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/**'
      - 'version.txt'
      - '.schema/**'
      - '.vscode/**'
      - 'deploy/**'
      - 'install/**'
      - 'media/**'
      - 'monitoring/**'
      - 'acknowledgements.md'
      - 'Dockerfile*'
      - 'bin/spice/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true

env:
  CONTAINER_REGISTRY: spiceaitestimages.azurecr.io/

jobs:
  test:
    name: Test Data Components (Hadoop Catalog)
    runs-on: spiceai-dev-runners
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          os: 'linux'

      - name: Set up make
        uses: ./.github/actions/setup-make

      - name: Set up cc
        uses: ./.github/actions/setup-cc

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1

      - name: Start compose
        working-directory: ./crates/data_components/tests/hadoop_data
        run: |
          docker compose up -d --wait --remove-orphans

      - name: Run tests
        env:
          RUSTC_WRAPPER: ${{ env.RUSTC_WRAPPER }}
          CARGO_INCREMENTAL: 0
        run: |
          INSTA_WORKSPACE_ROOT="${PWD}" CARGO_MANIFEST_DIR="${PWD}" cargo test -p data_components --test hadoop_catalog_test
      
      - name: Stop compose
        if: always()
        working-directory: ./crates/data_components/tests/hadoop_data
        run: |
          docker compose down --remove-orphans -v || true