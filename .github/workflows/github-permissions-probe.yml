name: GitHub credential reproduction
on:
  push:
    branches: [ci/github-permissions-pr-13939]
jobs:
  contents-read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test diagnostics
        run: python3 -m unittest discover -s test/github -p test_permissions.py -v
      - name: Verify full stargazers selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 test/github/check_permissions.py --artifacts github-api-results
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contents-read-permissions
          path: github-api-results/
  contents-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test diagnostics
        run: python3 -m unittest discover -s test/github -p test_permissions.py -v
      - name: Verify full stargazers selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 test/github/check_permissions.py --artifacts github-api-results
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contents-write-permissions
          path: github-api-results/
