name: Generate Acknowledgements

on:
  workflow_dispatch:

jobs:
  generate:
    environment: secret-free
    name: Generate Acknowledgements
    runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: write
      # Approves the PR's held pull_request runs.
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: ./.github/actions/setup-rust

      - name: Set up make
        if: runner.os != 'macOS'
        uses: ./.github/actions/setup-make

      - name: Generate Acknowledgements
        shell: bash
        run: |
          echo -e "# Open Source Acknowledgements\n\nSpice.ai acknowledges the following open source projects for making this project possible:\n\n" > acknowledgements.md
          make -s generate-acknowledgements-rust
          sed -i.bak -e 's/\"//g' -e 's/,/, /g' -e 's/,  /, /g' acknowledgements.md
          rm acknowledgements.md.bak
          cat acknowledgements.md

      - name: Create PR
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git diff acknowledgements.md
          # Committed through GitHub's API rather than pushed, so GitHub signs the commit
          # (see .github/actions/signed-commit/signed_commit.py).
          sha="$(python3 .github/actions/signed-commit/signed_commit.py \
            --branch "acknowledgements/${GITHUB_RUN_ID}" --message "Update acknowledgements" \
            -- acknowledgements.md)"
          if [[ -z "${sha}" ]]; then
            echo "No changes detected"
            exit 0
          fi
          # enforce-pull-with-spice, a required check, fails a PR without both a kind/ and
          # an area/ label.
          gh pr create --title "Update acknowledgements" --body "Updated OSS acknowledgements" --base trunk --head acknowledgements/${GITHUB_RUN_ID} --label kind/documentation --label area/docs
          # Release the pull_request runs GitHub holds on a GITHUB_TOKEN commit (see the script).
          bash .github/scripts/approve_bot_pr_runs.sh "acknowledgements/${GITHUB_RUN_ID}" "${sha}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Never fall back to an interactive prompt; fail fast if auth is rejected.
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: 'never'
