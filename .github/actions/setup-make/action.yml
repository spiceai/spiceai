name: Installs the make tool
description: 'composite action'

runs:
  using: 'composite'
  steps:
    - name: Configure apt mirrors (Linux)
      if: runner.os == 'Linux'
      uses: $/.github/actions/configure-apt

    - name: Install make (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y make

    - name: Install make (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # use choco to install make. GitHub's Windows images ship Chocolatey; a runner
        # without it fails here rather than running Chocolatey's unpinned web installer.
        if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
          Write-Output "::error::Chocolatey is not installed on this Windows runner, and this action does not run its unpinned web installer."
          exit 1
        }
        choco install make -y

    - name: Install make (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Check if make is already installed
        if ! command -v make &> /dev/null; then
          brew install make
        fi
