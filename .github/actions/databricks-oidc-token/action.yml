name: 'Databricks OIDC token'
description: >-
  Exchange the job's GitHub OIDC token for a Databricks OAuth token. The job needs
  `id-token: write`, and the service principal needs a federation policy for the job's subject.

inputs:
  host:
    description: 'Workspace host, without a scheme'
    required: true
  client-id:
    description: "Application ID of the service principal"
    required: true
  audience:
    description: "Audience in the service principal's federation policy"
    required: true

outputs:
  token:
    description: 'Databricks token. It expires with the GitHub OIDC token, 5 minutes after this action runs.'
    value: ${{ steps.exchange.outputs.token }}

runs:
  using: composite
  steps:
    - id: exchange
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        CLIENT_ID: ${{ inputs.client-id }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        curl_args=(--silent --show-error --fail-with-body --max-time 30 --retry 3 --retry-all-errors)

        oidc_token="$(curl "${curl_args[@]}" --get --data-urlencode "audience=${AUDIENCE}" \
          --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}" | jq -er .value)"
        echo "::add-mask::${oidc_token}"

        if ! response="$(curl "${curl_args[@]}" "https://${HOST}/oidc/v1/token" \
          --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
          --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
          --data-urlencode "subject_token=${oidc_token}" \
          --data-urlencode "client_id=${CLIENT_ID}" \
          --data-urlencode "scope=all-apis")"; then
          echo "::error::Databricks refused the token exchange at ${HOST}: ${response}"
          exit 1
        fi

        token="$(jq -er .access_token <<<"${response}")"
        echo "::add-mask::${token}"
        echo "Databricks token expires in $(jq -r .expires_in <<<"${response}") seconds."
        echo "token=${token}" >> "${GITHUB_OUTPUT}"
