name: 'Setup Nextest'
description: >-
  Installs the cargo-nextest release pinned in .github/ci-cache/pins.json into
  CARGO_HOME's bin and puts it on PATH. The release archive comes through
  .github/scripts/cached_fetch.sh, from the host's CI_CACHE_DIR or the CI cache when
  the job has one and from GitHub otherwise, and is checked against its pinned SHA-256
  before anything is extracted.

runs:
  using: 'composite'
  steps:
    - name: Install Nextest (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        RUNNER_ENV: ${{ runner.environment }}
      run: |
        set -euo pipefail
        github_dir="$ACTION_PATH/../.."
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64) target=aarch64-unknown-linux-gnu ;;
          Darwin-arm64) target=universal-apple-darwin ;;
          Darwin-x86_64) target=universal-apple-darwin ;;
          *)
            echo "::error::.github/ci-cache/pins.json pins no cargo-nextest release for $(uname -s) $(uname -m)."
            exit 1
            ;;
        esac
        version='' sha256='' url=''
        pin="$(python3 -I -c '
        import json, sys
        pin = json.load(open(sys.argv[1]))["cargo-nextest"]
        print(pin["version"])
        print(pin["sha256"].get(sys.argv[2], ""))
        print(pin["url"].format(version=pin["version"], target=sys.argv[2]))
        ' "$github_dir/ci-cache/pins.json" "$target")" || pin=''
        { read -r version; read -r sha256; read -r url; } <<<"$pin" || true
        if [ -z "$sha256" ] || [ -z "$url" ]; then
          echo "::error::.github/ci-cache/pins.json pins no cargo-nextest release for $target."
          exit 1
        fi

        # A self-hosted Mac outlives the job, so the archive can be kept on the host for
        # the next job there, as install-cargo-deny does; cached_fetch.sh checks every copy
        # it reads from there against the pin.
        if [ -z "${CI_CACHE_DIR:-}" ] && [ "${RUNNER_ENV:-}" = self-hosted ] && [ "$(uname -s)" = Darwin ]; then
          export CI_CACHE_DIR="$HOME/Library/Caches/spice-ci/downloads"
        fi

        # Only the verified archive's cargo-nextest is installed, into CARGO_HOME's bin,
        # which setup-rust makes the job's own on a self-hosted Mac.
        dir="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/cargo-nextest.XXXXXX")"
        bash "$github_dir/scripts/cached_fetch.sh" "$sha256" "$dir/cargo-nextest.tar.gz" "$url"
        tar -xzf "$dir/cargo-nextest.tar.gz" -C "$dir" cargo-nextest
        cargo_bin="${CARGO_HOME:-$HOME/.cargo}/bin"
        mkdir -p "$cargo_bin"
        chmod 0755 "$dir/cargo-nextest"
        mv -f "$dir/cargo-nextest" "$cargo_bin/cargo-nextest"
        rm -rf "$dir"
        echo "$cargo_bin" >> "$GITHUB_PATH"
        "$cargo_bin/cargo-nextest" nextest --version

    # pins.json pins no cargo-nextest for Windows, and no Windows job runs this action, so
    # a Windows runner fails here rather than running an unpinned download.
    - name: Install Nextest (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Output "::error::setup-nextest installs cargo-nextest only from a release pinned in .github/ci-cache/pins.json, which pins none for Windows."
        exit 1
