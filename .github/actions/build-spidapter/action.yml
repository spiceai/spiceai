name: Build Spidapter
description: 'Builds the spidapter binary with caching based on commit SHA'

inputs:
  install_to_system_path:
    description: 'Whether to install spidapter to system path'
    required: false
    default: 'true'
  upload_artifact:
    description: 'Whether to upload the spidapter as an artifact'
    required: false
    default: 'false'
  force_rebuild:
    description: 'Whether to force a rebuild (skip cache)'
    required: false
    default: 'false'
  download_from_minio:
    description: 'Whether to try downloading from MinIO before checking GitHub cache'
    required: false
    default: 'true'
  minio_endpoint:
    description: 'MinIO endpoint for sccache'
    required: false
    type: string
  minio_access_key:
    description: 'MinIO access key for sccache'
    required: false
    type: string
  minio_secret_key:
    description: 'MinIO secret key for sccache'
    required: false
    type: string

outputs:
  cache-hit:
    description: 'Whether the spidapter was found in cache'
    value: ${{ steps.cache-spidapter.outputs.cache-hit }}
  spidapter-path:
    description: 'Path to the spidapter binary'
    value: ${{ steps.set-path.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Detect OS
      id: detect-os
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)
            echo "os=linux" >> $GITHUB_OUTPUT
            echo "ext=" >> $GITHUB_OUTPUT
            ;;
          macOS)
            echo "os=darwin" >> $GITHUB_OUTPUT
            echo "ext=" >> $GITHUB_OUTPUT
            ;;
          Windows)
            echo "os=windows" >> $GITHUB_OUTPUT
            echo "ext=.exe" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
            ;;
        esac

    - name: Set spidapter commit SHA
      id: commit-sha
      shell: bash
      run: |
        echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

    - name: Download spidapter from MinIO
      if: inputs.download_from_minio == 'true' && inputs.force_rebuild != 'true'
      id: minio-download
      shell: bash
      run: |
        if mc stat spice-minio/artifacts/spidapter/${{ steps.detect-os.outputs.os }}-x86_64/${{ steps.commit-sha.outputs.sha }}/spidapter${{ steps.detect-os.outputs.ext }}; then
          echo "Found spidapter in MinIO"
          mkdir -p target/release
          mc cp spice-minio/artifacts/spidapter/${{ steps.detect-os.outputs.os }}-x86_64/${{ steps.commit-sha.outputs.sha }}/spidapter${{ steps.detect-os.outputs.ext }} target/release/spidapter${{ steps.detect-os.outputs.ext }}
          chmod +x target/release/spidapter${{ steps.detect-os.outputs.ext }}
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "Spidapter not found in MinIO"
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Cache spidapter binary
      if: inputs.force_rebuild != 'true' && steps.minio-download.outputs.found != 'true'
      id: cache-spidapter
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          target/release/spidapter${{ steps.detect-os.outputs.ext }}
        key: spidapter-${{ steps.detect-os.outputs.os }}-${{ steps.commit-sha.outputs.sha }}
        lookup-only: true

    - name: Setup Rust
      if: inputs.force_rebuild == 'true' || (steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true')
      uses: ./.github/actions/setup-rust

    - name: Setup cc
      if: (inputs.force_rebuild == 'true' || (steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true')) && steps.detect-os.outputs.os == 'linux'
      uses: ./.github/actions/setup-cc

    - name: Check if sccache can be set up
      if: inputs.force_rebuild == 'true' || (steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true')
      id: check-sccache
      shell: bash
      run: |
        if [ -z "${{ inputs.minio_endpoint }}" ]; then
          echo "SCCACHE_SETUP=false" >> $GITHUB_OUTPUT
          echo "RUSTC_WRAPPER=" >> $GITHUB_OUTPUT
        else
          echo "SCCACHE_SETUP=true" >> $GITHUB_OUTPUT
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_OUTPUT
        fi

    - name: Set up sccache
      if: (inputs.force_rebuild == 'true' || (steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true')) && steps.check-sccache.outputs.SCCACHE_SETUP == 'true'
      uses: ./.github/actions/setup-sccache
      with:
        minio_endpoint: ${{ inputs.minio_endpoint }}
        os: ${{ steps.detect-os.outputs.os }}

    - name: Build spidapter
      if: inputs.force_rebuild == 'true' || (steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true')
      shell: bash
      run: |
        cargo build -p spidapter --release
      env:
        RUSTC_WRAPPER: ${{ steps.check-sccache.outputs.RUSTC_WRAPPER }}
        AWS_ACCESS_KEY_ID: ${{ inputs.minio_access_key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.minio_secret_key }}
        CARGO_INCREMENTAL: 0
        CARGO_NET_GIT_FETCH_WITH_CLI: true

    - name: Save to cache
      if: inputs.force_rebuild != 'true' && steps.minio-download.outputs.found != 'true' && steps.cache-spidapter.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          target/release/spidapter${{ steps.detect-os.outputs.ext }}
        key: spidapter-${{ steps.detect-os.outputs.os }}-${{ steps.commit-sha.outputs.sha }}

    - name: Upload spidapter to MinIO
      if: inputs.download_from_minio == 'true' && steps.minio-download.outputs.found != 'true' && (inputs.force_rebuild == 'true' || steps.cache-spidapter.outputs.cache-hit != 'true')
      shell: bash
      run: |
        mc cp target/release/spidapter${{ steps.detect-os.outputs.ext }} spice-minio/artifacts/spidapter/${{ steps.detect-os.outputs.os }}-x86_64/${{ steps.commit-sha.outputs.sha }}/spidapter${{ steps.detect-os.outputs.ext }}

    - name: Install spidapter to system path (Linux/macOS)
      if: inputs.install_to_system_path == 'true' && steps.detect-os.outputs.os != 'windows'
      shell: bash
      run: |
        sudo mkdir -p /usr/local/bin
        sudo cp target/release/spidapter${{ steps.detect-os.outputs.ext }} /usr/local/bin/spidapter
        sudo chmod +x /usr/local/bin/spidapter

    - name: Install spidapter to system path (Windows)
      if: inputs.install_to_system_path == 'true' && steps.detect-os.outputs.os == 'windows'
      shell: bash
      run: |
        mkdir -p /c/usr/local/bin
        cp target/release/spidapter.exe /c/usr/local/bin/spidapter.exe
        chmod +x /c/usr/local/bin/spidapter.exe

    - name: Set output path
      id: set-path
      shell: bash
      run: |
        if [ "${{ inputs.install_to_system_path }}" = "true" ]; then
          if [ "${{ steps.detect-os.outputs.os }}" = "windows" ]; then
            echo "path=/c/usr/local/bin/spidapter.exe" >> $GITHUB_OUTPUT
          else
            echo "path=/usr/local/bin/spidapter" >> $GITHUB_OUTPUT
          fi
        else
          echo "path=${{ github.workspace }}/target/release/spidapter${{ steps.detect-os.outputs.ext }}" >> $GITHUB_OUTPUT
        fi

    - name: Upload spidapter artifact
      if: inputs.upload_artifact == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: spidapter-${{ steps.detect-os.outputs.os }}
        path: target/release/spidapter${{ steps.detect-os.outputs.ext }}
        retention-days: 28
