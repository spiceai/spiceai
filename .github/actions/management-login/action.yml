name: "Management Login"
description: "Fetches a Spice OAuth access token and exports it as an env var for remaining steps."

inputs:
  client-id:
    description: "OAuth client id"
    required: true
  client-secret:
    description: "OAuth client secret"
    required: true
  token-url:
    description: "OAuth token endpoint"
    required: false
    default: "https://dev.spice.ai/api/oauth/token"
  env-name:
    description: "Environment variable name to set"
    required: false
    default: "SPICEAI_API_KEY"

outputs:
  token:
    description: "Extracted access token from response"
    value: ${{ steps.token.outputs.value }}

runs:
  using: "composite"
  steps:
    - name: Request OAuth token
      id: token
      shell: bash
      # The credentials are passed through the environment rather than
      # interpolated into the script body, so they are never part of the
      # rendered command.
      env:
        CLIENT_ID: ${{ inputs.client-id }}
        CLIENT_SECRET: ${{ inputs.client-secret }}
        TOKEN_URL: ${{ inputs.token-url }}
        ENV_NAME: ${{ inputs.env-name }}
      run: |
        set -euo pipefail

        if ! command -v jq >/dev/null 2>&1; then
          echo "jq is required but not found on PATH" >&2
          exit 1
        fi

        # The name is appended to $GITHUB_ENV as NAME=value, so one carrying a
        # newline would inject further environment entries into every remaining
        # step. The token value is already checked for this in
        # token_response.sh; the name needs the same guarantee.
        case "$ENV_NAME" in
          '' | *[!A-Za-z0-9_]* | [0-9]*)
            echo "::error::Management login: 'env-name' must be a variable name matching [A-Za-z_][A-Za-z0-9_]*." >&2
            exit 1
            ;;
        esac

        # An unset repository secret interpolates to an empty string, so this is
        # what a missing secret looks like from inside the action.
        if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
          echo "::error::Management login: the 'client-id'/'client-secret' inputs are empty. The secrets the calling workflow passes are not set on this repository." >&2
          exit 1
        fi

        request="$(jq -cn --arg client_id "$CLIENT_ID" --arg client_secret "$CLIENT_SECRET" \
          '{client_id: $client_id, client_secret: $client_secret, grant_type: "client_credentials"}')"

        # -w appends the status on its own trailing line, so a failing exchange
        # can report which HTTP status it got.
        response="$(curl -sS -X POST "$TOKEN_URL" -H "Content-Type: application/json" \
          -w '\n%{http_code}' -d "$request")"
        http_status="${response##*$'\n'}"
        body="${response%$'\n'*}"

        value="$(printf '%s' "$body" | "$GITHUB_ACTION_PATH/token_response.sh" "$http_status" "$TOKEN_URL")"

        # Matches load-aws-secrets: a credential fetched at run time is unknown
        # to the runner, so register it for redaction explicitly.
        echo "::add-mask::$value"

        {
          echo "$ENV_NAME=$value"
        } >> "$GITHUB_ENV"

        {
          echo "value=$value"
        } >> "$GITHUB_OUTPUT"
