name: Sets up the Rust toolchain
description: 'composite action'

inputs:
  toolchain:
    description: 'Rust toolchain to install; defaults to the repository rust-toolchain.toml channel'
    required: false

runs:
  using: 'composite'
  steps:
    # The merge queue can textually merge two branches into a Cargo.lock that is valid
    # TOML but not a valid lockfile: git sees two edits to different regions and emits
    # the same `[[package]]` block twice. Cargo then refuses to parse it, so every job
    # that shells out to cargo dies at once, each reporting only an opaque `exit code
    # 101` with the real cause buried deep in the log. Every affected workflow already
    # uses this action, so asserting it here names the problem once, before any
    # expensive cargo work.
    #
    # Deliberately textual rather than `cargo metadata`: no registry index, no network,
    # no warm cache, so it runs in milliseconds and cannot itself become a flake. Note
    # for anyone tempted by the cargo route that `cargo metadata --locked --no-deps`
    # exits 0 on this corruption — it skips the dependency resolution that notices a
    # duplicate — so `--no-deps` would pass on exactly the input it exists to catch.
    - name: Validate Cargo.lock is coherent
      shell: bash
      run: |
        set -uo pipefail

        [ -f Cargo.lock ] || exit 0
        command -v awk >/dev/null 2>&1 || {
          echo "::warning::awk is unavailable, skipping the Cargo.lock coherence check."
          exit 0
        }

        # Keyed on (name, version, source) because that is cargo's own package
        # identity: several versions of one crate are legal, and so is one version from
        # two different sources (a [patch] against a registry dep). Only an exact
        # triple duplicate is something cargo rejects, so a lockfile cargo accepts can
        # never trip this.
        # `set -e` is deliberately not used: a guard that hard-fails when the guard
        # itself misbehaves would be worse than the problem it detects. But an awk that
        # runs and errors must not be mistaken for an awk that ran and found nothing —
        # that would silently retire the check — so its status is captured and surfaced.
        if ! dupes="$(
          awk '
            function flush() {
              if (inpkg && name != "") {
                key = name " " version " " source
                if (key in seen) dup[name " " version] = 1
                seen[key] = 1
              }
              inpkg = 0; name = ""; version = ""; source = ""
            }
            { sub(/\r$/, "") }
            /^\[\[package\]\][[:space:]]*$/ { flush(); inpkg = 1; next }
            /^\[/                           { flush(); next }
            inpkg && /^name = "/    { name = $0;    sub(/^name = "/, "", name);       sub(/"[[:space:]]*$/, "", name) }
            inpkg && /^version = "/ { version = $0; sub(/^version = "/, "", version); sub(/"[[:space:]]*$/, "", version) }
            inpkg && /^source = "/  { source = $0;  sub(/^source = "/, "", source);   sub(/"[[:space:]]*$/, "", source) }
            END { flush(); for (k in dup) print k }
          ' Cargo.lock
        )"; then
          echo "::warning::The Cargo.lock coherence check could not run (awk exited non-zero); skipping it."
          exit 0
        fi

        if [ -n "${dupes}" ]; then
          list="$(echo "${dupes}" | tr '\n' ';' | sed 's/;$//')"
          echo "::error::Cargo.lock lists the same package twice: ${list}. Cargo cannot parse this lockfile, so every cargo job in this run will fail. This is usually the merge queue textually merging two branches that each edited the same package entry — regenerate the lockfile on the PR branch ('cargo update --workspace') and re-queue."
          exit 1
        fi

    - name: Set up Rust toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail

        # The Rust host this runner is, for the pinned downloads below.
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) host_triple=x86_64-unknown-linux-gnu ;;
          Linux-aarch64) host_triple=aarch64-unknown-linux-gnu ;;
          Darwin-arm64) host_triple=aarch64-apple-darwin ;;
          Darwin-x86_64) host_triple=x86_64-apple-darwin ;;
          *) host_triple='' ;;
        esac

        # A self-hosted Mac keeps its disk between jobs, and all of its runner instances run
        # as one user, so any job there can write ~/.cargo and ~/.rustup: a pull request job
        # could replace rustup, a toolchain or a crate source that a later trunk job runs.
        # So a job there gets its own CARGO_HOME and RUSTUP_HOME under RUNNER_TEMP, which the
        # runner empties when a job starts and again when it ends, and never reads ~/.cargo
        # or ~/.rustup. Its rustup comes from the rustup-init that
        # .github/ci-cache/pins.json pins, and its toolchain from the verified mirror below.
        # The cargo registry and git checkouts live in CARGO_HOME, and sccache's local
        # directory goes next to it, so no job reuses another's crate sources. Any Mac that
        # is not GitHub-hosted counts, so one whose runner does not say is isolated too.
        # GitHub-hosted runners and the Linux pods start each job empty and are unchanged.
        per_job_home=false
        if [ "${RUNNER_OS:-}" = macOS ] && [ "${RUNNER_ENVIRONMENT:-}" != github-hosted ]; then
          per_job_home=true
          rust_home="${RUNNER_TEMP:?RUNNER_TEMP is not set}/rust-home"
          export CARGO_HOME="$rust_home/cargo" RUSTUP_HOME="$rust_home/rustup"
          mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$rust_home/sccache"
          {
            echo "CARGO_HOME=$CARGO_HOME"
            echo "RUSTUP_HOME=$RUSTUP_HOME"
            echo "SCCACHE_DIR=$rust_home/sccache"
          } >> "$GITHUB_ENV"

          # cargo also reads .cargo/config.toml (and .cargo/config) in every directory above
          # the one it runs in, whatever CARGO_HOME is, and on these hosts the directories
          # above the checkout belong to that same user. A file there could set the compiler,
          # a linker or a crate source for this job, so the job stops instead.
          found=''
          add_configs_above() {
            local dir
            case "$1" in /*) dir="$(dirname "$1")" ;; *) return 0 ;; esac
            while :; do
              for config in "$dir/.cargo/config" "$dir/.cargo/config.toml"; do
                if { [ -e "$config" ] || [ -L "$config" ]; } && [[ " $found " != *" $config "* ]]; then
                  found="$found $config"
                fi
              done
              [ "$dir" = / ] && return 0
              dir="$(dirname "$dir")"
            done
          }
          for start in "${GITHUB_WORKSPACE:-$PWD}" "$RUNNER_TEMP"; do
            add_configs_above "$start"
            add_configs_above "$(cd "$start" 2>/dev/null && pwd -P)"
          done
          if [ -n "$found" ]; then
            echo "::error::cargo would read${found}: cargo configuration above this job's checkout, which any job on this host can write, and which can set the compiler, a linker or a crate source. Remove it from the host."
            exit 1
          fi

          # As install-cargo-deny does, downloads are kept in a host directory for the next
          # job here. cached_fetch.sh checks every copy it reads from it against the pin.
          export CI_CACHE_DIR="${CI_CACHE_DIR:-$HOME/Library/Caches/spice-ci/downloads}"
          rustup_version='' rustup_sha256='' rustup_url=''
          rustup_pin="$(python3 -I -c '
        import json, sys
        pin = json.load(open(sys.argv[1]))["rustup-init"]
        print(pin["version"])
        print(pin["sha256"].get(sys.argv[2], ""))
        print(pin["url"].format(version=pin["version"], target=sys.argv[2]))
        ' "$GITHUB_ACTION_PATH/../../ci-cache/pins.json" "$host_triple")" || rustup_pin=''
          { read -r rustup_version; read -r rustup_sha256; read -r rustup_url; } <<<"$rustup_pin" || true
          if [ -z "$host_triple" ] || [ -z "$rustup_sha256" ] || [ -z "$rustup_url" ]; then
            echo "::error::.github/ci-cache/pins.json pins no rustup-init for $(uname -s) $(uname -m)${host_triple:+ ($host_triple)}, so this job cannot install its own rustup. It does not fall back to the host's ~/.cargo or an unpinned installer."
            exit 1
          fi
          rustup_init="$rust_home/rustup-init"
          fetch_status=0
          bash "$GITHUB_ACTION_PATH/../../scripts/cached_fetch.sh" "$rustup_sha256" "$rustup_init" "$rustup_url" ||
            fetch_status=$?
          if [ "$fetch_status" -ne 0 ]; then
            echo "::error::Could not get rustup-init $rustup_version for $host_triple at its pinned SHA-256 (cached_fetch.sh exited $fetch_status; the error above says why). This job does not fall back to the host's ~/.cargo or an unpinned installer."
            exit 1
          fi
          chmod 0755 "$rustup_init"
          "$rustup_init" --no-modify-path -y --default-toolchain none
          rm -f "$rustup_init"
          if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
            echo "::error::rustup-init $rustup_version did not install rustup in $CARGO_HOME/bin."
            exit 1
          fi
        fi

        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"
        export PATH="$cargo_home/bin:$PATH"

        if [ -f "$cargo_home/env" ]; then
          source "$cargo_home/env" || true
        fi

        # Resolve which toolchain to use.
        toolchain="${INPUT_TOOLCHAIN}"
        if [ -z "$toolchain" ] && [ -f rust-toolchain.toml ]; then
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
        fi
        if [ -z "$toolchain" ]; then
          toolchain='stable'
        fi

        # Runner instances that share a RUSTUP_HOME (the self-hosted Macs did, before
        # each of their jobs got its own above) race when two jobs install the same
        # toolchain at once: cargo can land first, the
        # other job skips install, then `rustup which rustc` tries to recover a
        # half-written tree and dies with "Directory not empty" (os error 66).
        # One lock covers the whole home. A toolchain counts as present only when
        # rustc and cargo are on disk. If either is missing, remove the partial
        # tree before install so rustup does not rename components onto leftovers.
        rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
        mkdir -p "$rustup_home"
        # The lock is an OS advisory lock (flock(2)) on a file, not a directory or
        # PID-file lock. The kernel drops it when the shell that holds it exits,
        # however it exits (a cancelled job's SIGKILL included), so nothing ever
        # has to decide a holder is dead and delete its lock. Every stale-reaping
        # scheme has a check/delete race: a waiter that decided the old lock was
        # stale can run its `rm` after another waiter has already recreated it,
        # deleting a live lock and letting two installs in at once.
        lockfile="$rustup_home/setup-rust.flock"
        exec 9>>"$lockfile"
        if command -v flock >/dev/null 2>&1; then
          # util-linux flock(1) (Linux runners).
          if ! flock -w 900 9; then
            echo "Timed out waiting for $lockfile" >&2
            exit 1
          fi
        else
          # macOS has no flock(1), but ships perl. flock(2) locks the open file
          # description, which perl shares with this shell's fd 9, so the lock
          # outlives the perl process and is held until this shell closes fd 9.
          if ! perl -MFcntl=:flock -e '
            open(my $fh, ">>&=", 9) or die "cannot open fd 9: $!\n";
            my $deadline = time + 900;
            until (flock($fh, LOCK_EX | LOCK_NB)) {
              die "flock: $!\n" unless $!{EWOULDBLOCK} || $!{EAGAIN};
              die "timed out\n" if time >= $deadline;
              sleep 2;
            }
          '; then
            echo "Could not lock $lockfile" >&2
            exit 1
          fi
        fi

        if [ ! -x "$cargo_home/bin/rustup" ]; then
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
          if [ -f "$cargo_home/env" ]; then
            source "$cargo_home/env" || true
          fi
        fi

        case "$toolchain" in
          *[!A-Za-z0-9._-]*)
            echo "Invalid toolchain name: $toolchain" >&2
            exit 1
            ;;
        esac

        # With a CI cache (CI_CACHE_URL, set by the workflow), and in a self-hosted Mac job's
        # own homes, install the toolchain from a local mirror of its pinned release before
        # anything below asks rustup for it: `rustup show` installs the toolchain
        # rust-toolchain.toml names from static.rust-lang.org when it is missing, which
        # every fresh runner pod and every such Mac job pays. The mirror is built by
        # .github/scripts/rust_dist_mirror.py from the host's CI_CACHE_DIR or the CI cache,
        # or from static.rust-lang.org for any file they lack, and every file is checked
        # against the manifest pinned in .github/ci-cache/pins.json; rustup checks the
        # component hashes again. RUSTUP_DIST_SERVER points at the mirror for this install
        # only, so a later `rustup target add` still reaches static.rust-lang.org. If any
        # of it fails, the install below runs from static.rust-lang.org as before. Only a
        # toolchain without rustc or cargo is installed this way, since it replaces the
        # whole toolchain directory: one that lacks only rustfmt or clippy keeps its
        # targets and components, and `rustup component add` below adds the two. Two
        # failures have no fallback, because rustup would download the same files without
        # the settings or the bound they were refused under, so the step fails instead:
        # wrong download settings such as a malformed CI_FETCH_MAX_BYTES (exit 2), and a
        # file larger than CI_FETCH_MAX_BYTES (exit 4).
        if [ -n "${CI_CACHE_URL:-}" ] || [ "$per_job_home" = true ]; then
          cache_host="$host_triple"
          cache_tool_dir="$rustup_home/toolchains/${toolchain}-${cache_host}"
          if [ -n "$cache_host" ] && ! { [ -x "$cache_tool_dir/bin/rustc" ] && [ -x "$cache_tool_dir/bin/cargo" ]; }; then
            mirror="${RUNNER_TEMP:-/tmp}/rust-dist-${toolchain}"
            rm -rf "$mirror"
            status=0
            python3 "$GITHUB_ACTION_PATH/../../scripts/rust_dist_mirror.py" \
              --toolchain "$toolchain" --host "$cache_host" --out "$mirror" || status=$?
            if [ "$status" -eq 0 ]; then
              rm -rf "$cache_tool_dir"
              rm -f "$rustup_home/update-hashes/${toolchain}-${cache_host}"
              if RUSTUP_DIST_SERVER="file://$mirror" rustup toolchain install "$toolchain" \
                --profile minimal --component rustfmt --component clippy --no-self-update; then
                echo "Installed Rust $toolchain from the CI cache's pinned release."
              else
                echo "::warning::Installing Rust $toolchain from the local mirror of its pinned release failed; installing it from static.rust-lang.org instead."
                rm -rf "$cache_tool_dir"
                rm -f "$rustup_home/update-hashes/${toolchain}-${cache_host}"
              fi
            elif [ "$status" -eq 4 ]; then
              echo "::error::A file of Rust $toolchain's pinned release is larger than CI_FETCH_MAX_BYTES, so it is not installed from static.rust-lang.org either, where rustup would download it with no bound. If the release really is that large, raise CI_FETCH_MAX_BYTES."
              rm -rf "$mirror"
              exit 1
            elif [ "$status" -eq 2 ]; then
              echo "::error::The download settings for Rust $toolchain's pinned release were refused (the error above says which), so it is not installed from static.rust-lang.org either, where rustup would ignore them. Fix the setting."
              rm -rf "$mirror"
              exit 1
            elif [ "$status" -ne 3 ]; then
              echo "::warning::Could not assemble Rust $toolchain from its pinned release (exit $status); installing it from static.rust-lang.org instead."
            fi
            rm -rf "$mirror"
          fi
        fi

        host="$(rustup show | awk '/^Default host:/ { print $3; exit }')"
        if [ -z "$host" ]; then
          echo "rustup did not report a default host" >&2
          exit 1
        fi
        tool_dir="$rustup_home/toolchains/${toolchain}-${host}"

        if [ -x "$tool_dir/bin/rustc" ] && [ -x "$tool_dir/bin/cargo" ] && [ -x "$tool_dir/bin/rustfmt" ] && [ -x "$tool_dir/bin/cargo-clippy" ]; then
          echo "Toolchain $toolchain already available, skipping install"
        elif [ -x "$tool_dir/bin/rustc" ] && [ -x "$tool_dir/bin/cargo" ]; then
          echo "Toolchain $toolchain is missing rustfmt or clippy; adding them"
          rustup component add rustfmt clippy --toolchain "$toolchain"
        else
          echo "Toolchain $toolchain is missing or incomplete; reinstalling"
          rm -rf "$tool_dir"
          rm -f "$rustup_home/update-hashes/${toolchain}-${host}"
          rustup toolchain install "$toolchain" \
            --component cargo \
            --component rustc \
            --component rustfmt \
            --component clippy
        fi

        # Release the install lock; nothing below writes to RUSTUP_HOME.
        exec 9>&-

        resolved="$(basename "$(dirname "$(dirname "$(rustup which --toolchain "$toolchain" rustc)")")")"
        if [ -z "$resolved" ]; then
          echo "Failed to resolve installed Rust toolchain for $toolchain" >&2
          exit 1
        fi

        # Export RUSTUP_TOOLCHAIN so subsequent steps use this toolchain
        # without modifying the global default (which races when multiple
        # runners share the same RUSTUP_HOME on one machine).
        echo "RUSTUP_TOOLCHAIN=$resolved" >> "$GITHUB_ENV"

        cargo --version
        rustc --version

    - name: Set up Rust toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Rust..."
          Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
          Start-Process -FilePath "rustup-init.exe" -ArgumentList "-q", "-y", "--default-toolchain", "none", "--profile", "default" -Wait
        }

        $toolchain = "${env:INPUT_TOOLCHAIN}"
        if (-not $toolchain) {
          $activeToolchain = rustup show active-toolchain 2>$null
          if ($activeToolchain) {
            $toolchain = ($activeToolchain -split '\s+')[0]
          }
        }
        if (-not $toolchain -and (Test-Path "rust-toolchain.toml")) {
          $match = Select-String -Path "rust-toolchain.toml" -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($match) {
            $toolchain = $match.Matches[0].Groups[1].Value
          }
        }
        if (-not $toolchain) {
          $toolchain = "stable"
        }

        # Validate that the resolved toolchain name is safe to use in paths.
        if ($toolchain -notmatch '^[a-zA-Z0-9._-]+$') {
          Write-Error "Invalid toolchain name: $toolchain"
          exit 1
        }

        $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { "$env:USERPROFILE\.rustup" }

        # Use a mutex to prevent races when multiple jobs share RUSTUP_HOME.
        $mutex = New-Object System.Threading.Mutex($false, "Global\setup-rust-$toolchain")
        try {
          [void]$mutex.WaitOne()
          Remove-Item -Recurse -Force "$rustupHome\toolchains\$toolchain", "$rustupHome\toolchains\$toolchain-*" -ErrorAction SilentlyContinue
          Remove-Item -Force "$rustupHome\update-hashes\$toolchain", "$rustupHome\update-hashes\$toolchain-*" -ErrorAction SilentlyContinue
          rustup toolchain install $toolchain --component cargo --component rustc --component rustfmt --component clippy
        } finally {
          $mutex.ReleaseMutex()
          $mutex.Dispose()
        }

        $rustcPath = rustup which --toolchain $toolchain rustc
        if (-not $rustcPath) {
          Write-Error "Failed to resolve installed Rust toolchain for $toolchain"
          exit 1
        }

        $resolved = Split-Path (Split-Path $rustcPath -Parent) -Parent | Split-Path -Leaf

        "RUSTUP_TOOLCHAIN=$resolved" >> $env:GITHUB_ENV

        $toolchainBin = "$rustupHome\toolchains\$resolved\bin"
        $toolchainBin >> $env:GITHUB_PATH
        $env:PATH = "$toolchainBin;$env:PATH"

        cargo --version
        rustc --version
