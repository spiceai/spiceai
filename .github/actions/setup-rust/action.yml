name: Sets up the Rust toolchain
description: 'composite action'

runs:
  using: 'composite'
  steps:
    - name: Install Rust if not installed (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
        if [ -d $HOME/.cargo ]; then
          source $HOME/.cargo/env || true
        fi
        if ! command -v rustup &> /dev/null ; then
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
          source $HOME/.cargo/env || true
        fi

    - name: Install Rust if not installed (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Rust..."
          Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
          Start-Process -FilePath "rustup-init.exe" -ArgumentList "-q", "-y", "--default-toolchain", "none", "--profile", "default" -Wait
          echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        }

    - name: Install Rust 1.93.1 toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        TOOLCHAIN=1.93.1

        rustup toolchain install "${TOOLCHAIN}" --profile minimal
        rustup component add cargo rustc rustfmt clippy --toolchain "${TOOLCHAIN}"
        rustup default "${TOOLCHAIN}"
        rustup run "${TOOLCHAIN}" cargo --version
        rustup run "${TOOLCHAIN}" rustc --version

    - name: Install Rust 1.93.1 toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $toolchain = "1.93.1"

        rustup toolchain install $toolchain --profile minimal
        rustup component add cargo rustc rustfmt clippy --toolchain $toolchain
        rustup default $toolchain
        rustup run $toolchain cargo --version
        rustup run $toolchain rustc --version
