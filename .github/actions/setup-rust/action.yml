name: Sets up the Rust toolchain
description: 'composite action'

inputs:
  toolchain:
    description: 'Rust toolchain to install; defaults to the repository rust-toolchain.toml channel'
    required: false

runs:
  using: 'composite'
  steps:
    # The merge queue can textually merge two branches into a Cargo.lock that is valid
    # TOML but not a valid lockfile: git sees two edits to different regions, and emits
    # the same `[[package]]` block twice. Cargo then refuses to parse it, so every job
    # that shells out to cargo dies at once — on 2026-08-02 that was 42 failed runs
    # across 7 queue branches and 6 workflows in 40 minutes, each reporting only
    # `make build-cli Error 101` / `exit code 101` with the real cause one line deep in
    # a 4,000-line log. Every affected workflow already uses this action, so asserting
    # it here names the problem once, before any expensive cargo work.
    #
    # Deliberately textual rather than `cargo metadata`: no registry index, no network,
    # no warm cache, so it runs in milliseconds and cannot itself become a flake. Note
    # for anyone tempted by the cargo route that `cargo metadata --locked --no-deps`
    # exits 0 on this corruption — it skips the dependency resolution that notices a
    # duplicate — so `--no-deps` would pass on exactly the input it exists to catch.
    - name: Validate Cargo.lock is coherent
      shell: bash
      run: |
        set -uo pipefail

        [ -f Cargo.lock ] || exit 0
        command -v awk >/dev/null 2>&1 || {
          echo "::warning::awk is unavailable, skipping the Cargo.lock coherence check."
          exit 0
        }

        # Keyed on (name, version, source) because that is cargo's own package
        # identity: several versions of one crate are legal, and so is one version from
        # two different sources (a [patch] against a registry dep). Only an exact
        # triple duplicate is something cargo rejects, so a lockfile cargo accepts can
        # never trip this.
        dupes="$(
          awk '
            function flush() {
              if (inpkg && name != "") {
                key = name " " version " " source
                if (key in seen) dup[name " " version] = 1
                seen[key] = 1
              }
              inpkg = 0; name = ""; version = ""; source = ""
            }
            { sub(/\r$/, "") }
            /^\[\[package\]\][[:space:]]*$/ { flush(); inpkg = 1; next }
            /^\[/                           { flush(); next }
            inpkg && /^name = "/    { name = $0;    sub(/^name = "/, "", name);       sub(/"[[:space:]]*$/, "", name) }
            inpkg && /^version = "/ { version = $0; sub(/^version = "/, "", version); sub(/"[[:space:]]*$/, "", version) }
            inpkg && /^source = "/  { source = $0;  sub(/^source = "/, "", source);   sub(/"[[:space:]]*$/, "", source) }
            END { flush(); for (k in dup) print k }
          ' Cargo.lock
        )"

        if [ -n "${dupes}" ]; then
          list="$(echo "${dupes}" | tr '\n' ';' | sed 's/;$//')"
          echo "::error::Cargo.lock lists the same package twice: ${list}. Cargo cannot parse this lockfile, so every cargo job in this run will fail. This is usually the merge queue textually merging two branches that each edited the same package entry — regenerate the lockfile on the PR branch ('cargo update --workspace') and re-queue."
          exit 1
        fi

    - name: Set up Rust toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"
        export PATH="$cargo_home/bin:$PATH"

        if [ -f "$cargo_home/env" ]; then
          source "$cargo_home/env" || true
        fi

        # Resolve which toolchain to use.
        toolchain='${{ inputs.toolchain }}'
        if [ -z "$toolchain" ] && [ -f rust-toolchain.toml ]; then
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
        fi
        if [ -z "$toolchain" ]; then
          toolchain='stable'
        fi

        # If the toolchain is already installed (e.g. spiceai-macos self-hosted
        # runners), just verify it. Otherwise install it.
        if rustup run "$toolchain" cargo --version >/dev/null 2>&1; then
          echo "Toolchain $toolchain already available, skipping install"
        else
          if [ ! -x "$cargo_home/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
            if [ -f "$cargo_home/env" ]; then
              source "$cargo_home/env" || true
            fi
          fi
          rustup toolchain install "$toolchain" \
            --component cargo \
            --component rustc \
            --component rustfmt \
            --component clippy
        fi

        resolved="$(basename "$(dirname "$(dirname "$(rustup which --toolchain "$toolchain" rustc)")")")"
        if [ -z "$resolved" ]; then
          echo "Failed to resolve installed Rust toolchain for $toolchain" >&2
          exit 1
        fi

        # Export RUSTUP_TOOLCHAIN so subsequent steps use this toolchain
        # without modifying the global default (which races when multiple
        # runners share the same RUSTUP_HOME on one machine).
        echo "RUSTUP_TOOLCHAIN=$resolved" >> "$GITHUB_ENV"

        cargo --version
        rustc --version

    - name: Set up Rust toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Rust..."
          Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
          Start-Process -FilePath "rustup-init.exe" -ArgumentList "-q", "-y", "--default-toolchain", "none", "--profile", "default" -Wait
        }

        $toolchain = "${{ inputs.toolchain }}"
        if (-not $toolchain) {
          $activeToolchain = rustup show active-toolchain 2>$null
          if ($activeToolchain) {
            $toolchain = ($activeToolchain -split '\s+')[0]
          }
        }
        if (-not $toolchain -and (Test-Path "rust-toolchain.toml")) {
          $match = Select-String -Path "rust-toolchain.toml" -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($match) {
            $toolchain = $match.Matches[0].Groups[1].Value
          }
        }
        if (-not $toolchain) {
          $toolchain = "stable"
        }

        # Validate that the resolved toolchain name is safe to use in paths.
        if ($toolchain -notmatch '^[a-zA-Z0-9._-]+$') {
          Write-Error "Invalid toolchain name: $toolchain"
          exit 1
        }

        $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { "$env:USERPROFILE\.rustup" }

        # Use a mutex to prevent races when multiple jobs share RUSTUP_HOME.
        $mutex = New-Object System.Threading.Mutex($false, "Global\setup-rust-$toolchain")
        try {
          [void]$mutex.WaitOne()
          Remove-Item -Recurse -Force "$rustupHome\toolchains\$toolchain", "$rustupHome\toolchains\$toolchain-*" -ErrorAction SilentlyContinue
          Remove-Item -Force "$rustupHome\update-hashes\$toolchain", "$rustupHome\update-hashes\$toolchain-*" -ErrorAction SilentlyContinue
          rustup toolchain install $toolchain --component cargo --component rustc --component rustfmt --component clippy
        } finally {
          $mutex.ReleaseMutex()
          $mutex.Dispose()
        }

        $rustcPath = rustup which --toolchain $toolchain rustc
        if (-not $rustcPath) {
          Write-Error "Failed to resolve installed Rust toolchain for $toolchain"
          exit 1
        }

        $resolved = Split-Path (Split-Path $rustcPath -Parent) -Parent | Split-Path -Leaf

        "RUSTUP_TOOLCHAIN=$resolved" >> $env:GITHUB_ENV

        $toolchainBin = "$rustupHome\toolchains\$resolved\bin"
        $toolchainBin >> $env:GITHUB_PATH
        $env:PATH = "$toolchainBin;$env:PATH"

        cargo --version
        rustc --version
