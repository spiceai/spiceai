name: Sets up the Rust toolchain
description: 'composite action'

inputs:
  toolchain:
    description: 'Rust toolchain to install; defaults to the repository rust-toolchain.toml channel'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install Rust if not installed (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        cargo_home="${CARGO_HOME:-$HOME/.cargo}"
        echo "$cargo_home/bin" >> "$GITHUB_PATH"
        export PATH="$cargo_home/bin:$PATH"

        if [ -f "$cargo_home/env" ]; then
          source "$cargo_home/env" || true
        fi

        if [ ! -x "$cargo_home/bin/rustup" ]; then
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
          if [ -f "$cargo_home/env" ]; then
            source "$cargo_home/env" || true
          fi
        fi

    - name: Install Rust if not installed (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "$env:USERPROFILE\.cargo\bin" >> $env:GITHUB_PATH
        if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
          Write-Host "Installing Rust..."
          Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
          Start-Process -FilePath "rustup-init.exe" -ArgumentList "-q", "-y", "--default-toolchain", "none", "--profile", "default" -Wait
        }

    - name: Resolve Rust toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      id: resolve-toolchain-unix
      shell: bash
      run: |
        set -euo pipefail

        toolchain='${{ inputs.toolchain }}'
        if [ -z "$toolchain" ]; then
          toolchain="$(rustup show active-toolchain 2>/dev/null | awk '{ print $1; exit }')"
        fi

        if [ -z "$toolchain" ] && [ -f rust-toolchain.toml ]; then
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
        fi

        if [ -z "$toolchain" ]; then
          toolchain='stable'
        fi

        default_host="$(rustup show 2>/dev/null | awk -F ': ' '/^Default host:/ { print $2; exit }')"
        if [ -n "$default_host" ]; then
          case "$toolchain" in
            *-"$default_host")
              ;;
            stable|beta|nightly|stable-*|beta-*|nightly-*|[0-9]*)
              toolchain="${toolchain}-${default_host}"
              ;;
          esac
        fi

        echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

    - name: Resolve Rust toolchain (Windows)
      if: runner.os == 'Windows'
      id: resolve-toolchain-windows
      shell: pwsh
      run: |
        $toolchain = "${{ inputs.toolchain }}"
        if (-not $toolchain) {
          $activeToolchain = rustup show active-toolchain 2>$null
          if ($activeToolchain) {
            $toolchain = ($activeToolchain -split '\s+')[0]
          }
        }

        if (-not $toolchain -and (Test-Path "rust-toolchain.toml")) {
          $match = Select-String -Path "rust-toolchain.toml" -Pattern '^\s*channel\s*=\s*"([^"]+)"' | Select-Object -First 1
          if ($match) {
            $toolchain = $match.Matches[0].Groups[1].Value
          }
        }

        if (-not $toolchain) {
          $toolchain = "stable"
        }

        $defaultHostMatch = rustup show 2>$null | Select-String -Pattern '^Default host:\s+(.+)$' | Select-Object -First 1
        if ($defaultHostMatch) {
          $defaultHost = $defaultHostMatch.Matches[0].Groups[1].Value
          if ($toolchain -notlike "*-$defaultHost" -and ($toolchain -match '^(stable|beta|nightly)(-.+)?$' -or $toolchain -match '^\d')) {
            $toolchain = "$toolchain-$defaultHost"
          }
        }

        "toolchain=$toolchain" >> $env:GITHUB_OUTPUT

    - name: Install Rust toolchain (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        toolchain='${{ steps.resolve-toolchain-unix.outputs.toolchain }}'

        rustup toolchain install "$toolchain" --profile minimal
        rustup component add cargo rustc rustfmt clippy --toolchain "$toolchain"
        rustup default "$toolchain"

        rustup component list --toolchain "$toolchain" --installed
        rustup run "$toolchain" cargo --version
        rustup run "$toolchain" rustc --version
        cargo --version
        rustc --version

    - name: Install Rust toolchain (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $toolchain = "${{ steps.resolve-toolchain-windows.outputs.toolchain }}"

        rustup toolchain install $toolchain --profile minimal
        rustup component add cargo rustc rustfmt clippy --toolchain $toolchain
        rustup default $toolchain

        rustup component list --toolchain $toolchain --installed
        rustup run $toolchain cargo --version
        rustup run $toolchain rustc --version
        cargo --version
        rustc --version
