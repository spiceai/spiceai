# This action updates the apt sources from HTTP to HTTPS.
# Add to workflow when HTTP sources are down
name: Update HTTP to HTTPS sources
description: 'composite action'

runs:
  using: 'composite'
  steps:
    - name: Configure apt mirrors (Linux)
      if: runner.os == 'Linux'
      uses: $/.github/actions/configure-apt

    - name: Use HTTPS in apt sources
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Classic sources.list (pre-noble / when present)
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list
        fi
        # deb822 format used by Ubuntu 24.04+ (noble)
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i 's|http://|https://|g' /etc/apt/sources.list.d/ubuntu.sources
        fi
        # The archive and security mirrors configure-apt lists for apt's
        # mirror method
        for MIRROR_LIST in /etc/apt/spice-ubuntu-mirrors.txt /etc/apt/spice-ubuntu-security-mirrors.txt; do
          if [ -f "${MIRROR_LIST}" ]; then
            sudo sed -i 's|http://|https://|g' "${MIRROR_LIST}"
          fi
        done
        sudo apt-get update
