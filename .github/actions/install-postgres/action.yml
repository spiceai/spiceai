name: Install PostgreSQL
description: 'Performs PostgreSQL installation and setup on the target operating system'
inputs:
  pg-db:
    description: 'Name of the database to create'
    default: 'postgres'
  isolated:
    description: 'Run a private server from a data directory of its own on CI_PG_PORT (allocate-service-ports) and export PGHOST, PGPORT, and CI_PG_DIR, instead of the system service on 5432.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Configure apt mirrors (Linux)
      if: runner.os == 'Linux'
      uses: ./.github/actions/configure-apt

    - name: Install PostgreSQL (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql
        if [ "${{ inputs.isolated }}" = "true" ]; then
          port="${CI_PG_PORT:-}"
          if [ -z "$port" ]; then
            echo "CI_PG_PORT is empty. Run allocate-service-ports before this action."
            exit 1
          fi
          pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          # RUNNER_TEMP is mode 700 on GitHub-hosted Ubuntu, so the postgres
          # user cannot traverse it. initdb then fails with "could not access
          # directory". /var/tmp is traversable; the cluster itself stays 700.
          dir="/var/tmp/spice-pgdata-${port}"
          sudo rm -rf "$dir"
          sudo install -d -o postgres -g postgres -m 700 "$dir"
          if ! sudo -u postgres test -w "$dir"; then
            echo "The postgres user cannot write ${dir}."
            ls -ld /var/tmp "$dir" || true
            exit 1
          fi
          if [ ! -f "$dir/PG_VERSION" ]; then
            sudo -u postgres "${pg_bin}/initdb" -D "$dir" --username=postgres --auth=trust --auth-host=trust --no-instructions
          fi
          sudo -u postgres "${pg_bin}/pg_ctl" -D "$dir" -o "-p ${port} -k ${dir} -c listen_addresses=127.0.0.1" -l "$dir/server.log" start
          sudo -u postgres psql -h 127.0.0.1 -p "$port" -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          if [ "${{ inputs.pg-db }}" != "postgres" ]; then
            sudo -u postgres dropdb --if-exists -h 127.0.0.1 -p "$port" "${{ inputs.pg-db }}"
            sudo -u postgres createdb -h 127.0.0.1 -p "$port" "${{ inputs.pg-db }}"
          fi
          echo "PGPORT=${port}" >> "$GITHUB_ENV"
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "CI_PG_DIR=${dir}" >> "$GITHUB_ENV"
        else
          sudo service postgresql start
          for attempt in {1..30}; do
            pg_isready -q && break
            sleep 1
          done
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='postgres'" | grep -q 1 || sudo -u postgres createuser -s postgres
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${{ inputs.pg-db }}' AND pid <> pg_backend_pid();"
          sudo -u postgres dropdb --if-exists ${{ inputs.pg-db }}
          sudo -u postgres createdb ${{ inputs.pg-db }}
        fi

    - name: Install PostgreSQL (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Homebrew's API and bottle hosts fail transiently; retry each network step.
        retry() {
          for attempt in 1 2 3; do
            "$@" && return 0
            echo "::warning::'$*' failed (attempt ${attempt}/3)"
            sleep $((attempt * 15))
          done
          return 1
        }
        if [ "${{ inputs.isolated }}" = "true" ]; then
          # A self-hosted Mac may run several runner instances, so the server runs from
          # its own data directory on CI_PG_PORT, as the isolated Linux path does. A
          # GitHub-hosted Mac is a fresh VM, so 5432 is free there without allocation.
          port="${CI_PG_PORT:-5432}"
          brew list --versions postgresql@18 >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 retry brew install postgresql@18
          pg_bin="$(brew --prefix postgresql@18)/bin"
          dir="/var/tmp/spice-pgdata-${port}"
          rm -rf "$dir"
          "${pg_bin}/initdb" -D "$dir" --username=postgres --auth=trust --auth-host=trust --no-instructions
          "${pg_bin}/pg_ctl" -D "$dir" -o "-p ${port} -k ${dir} -c listen_addresses=127.0.0.1" -l "$dir/server.log" -w start
          "${pg_bin}/psql" -h 127.0.0.1 -p "$port" -U postgres -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"
          if [ "${{ inputs.pg-db }}" != "postgres" ]; then
            "${pg_bin}/createdb" -h 127.0.0.1 -p "$port" -U postgres "${{ inputs.pg-db }}"
          fi
          echo "${pg_bin}" >> "$GITHUB_PATH"
          echo "PGPORT=${port}" >> "$GITHUB_ENV"
          echo "PGHOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "CI_PG_DIR=${dir}" >> "$GITHUB_ENV"
          exit 0
        fi
        # macos-15 runner bug requires 'brew update': https://github.com/actions/runner-images/issues/11855#issuecomment-2754201066
        # A stale index only matters if the install below fails, so don't fail on it here.
        retry brew update || echo "::warning::brew update failed; installing with the image's formula index"
        retry brew install postgresql@18
        pg_bin="$(brew --prefix postgresql@18)/bin"
        export PATH="${pg_bin}:$PATH"
        echo "${pg_bin}" >> "$GITHUB_PATH"
        brew services start postgresql@18
        for attempt in {1..30}; do
          pg_isready -q && break
          sleep 1
        done
        createuser -s postgres
        psql -d postgres -c "ALTER USER postgres PASSWORD 'postgres';"
        createdb ${{ inputs.pg-db }}

    - name: Wait for PostgreSQL to start
      shell: bash
      run: |
        for attempt in {1..30}; do
          pg_isready -h "${PGHOST:-localhost}" -p "${PGPORT:-5432}" -q && exit 0
          sleep 1
        done
        echo "::error::PostgreSQL is not accepting connections on ${PGHOST:-localhost}:${PGPORT:-5432} after 30s"
        pg_isready -h "${PGHOST:-localhost}" -p "${PGPORT:-5432}"
        exit 1

    - name: Check PostgreSQL
      shell: bash
      env:
        PGPASSWORD: postgres
      run: psql -h 127.0.0.1 -p "${PGPORT:-5432}" -U postgres -c 'SELECT version();'
