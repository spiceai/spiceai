name: Setup libduckdb
description: >-
  Install the DuckDB shared library that duckdb: and ducklake: datasets, the
  DuckDB test oracles and testoperator load through ADBC, and register it as
  the 'duckdb' ADBC driver for the rest of the job. scripts/libduckdb.py
  downloads the release, checks it against the SHA-256 recorded in
  test/duckdb_versions.json, and writes a driver manifest, which is found
  through ADBC_DRIVER_PATH, so nothing is installed system-wide and the
  setting survives macOS, which strips DYLD_* variables from /bin/bash.

inputs:
  version:
    description: 'DuckDB release to install; defaults to the newest in test/duckdb_versions.json.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install libduckdb
      shell: bash
      env:
        LIBDUCKDB_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # A cache of this job's own, created here under a name no earlier job could choose:
        # the runner skips what it cannot delete when it empties RUNNER_TEMP, so a fixed
        # directory there can be one an earlier job left.
        cache="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/libduckdb.XXXXXX")"
        cache="$(cd "$cache" && pwd -P)"
        dir="$(LIBDUCKDB_CACHE_DIR="$cache" python3 scripts/libduckdb.py)"
        # GITHUB_ENV takes one variable per line, and ADBC_DRIVER_PATH is a list split at
        # ':', so the path goes there only if it is inside this cache, on one line, and
        # without a ':'.
        case "$dir" in
          "$cache"/*) ;;
          *)
            echo "::error::scripts/libduckdb.py printed a directory outside $cache; it is not registered."
            exit 1
            ;;
        esac
        if [[ "$dir" == *$'\n'* || "$dir" == *$'\r'* || "$dir" == *:* ]]; then
          echo "::error::scripts/libduckdb.py printed a directory with a line break or a ':' in it; it is not registered."
          exit 1
        fi
        echo "ADBC_DRIVER_PATH=${dir}${ADBC_DRIVER_PATH:+:${ADBC_DRIVER_PATH}}" >> "$GITHUB_ENV"
        echo "Registered $(grep '^shared' "$dir/duckdb.toml") as the 'duckdb' ADBC driver"
