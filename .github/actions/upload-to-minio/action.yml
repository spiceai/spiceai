name: Upload to MinIO
description: 'Setup MinIO client and upload a file to MinIO'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint'
    required: true
  minio_access_key:
    description: 'MinIO access key'
    required: true
  minio_secret_key:
    description: 'MinIO secret key'
    required: true
  minio_session_token:
    description: 'Session token of temporary MinIO credentials; the alias then comes from MC_HOST_spice-minio.'
    required: false
  source_path:
    description: 'Path to the file to upload'
    required: true
  destination_path:
    description: 'Destination path in MinIO (e.g., spice-minio/bucket/path/)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Install MinIO client
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
      run: |
        set -euo pipefail
        # The mc release pinned in .github/ci-cache/pins.json, installed as setup-minio
        # installs it: checked against its SHA-256 first, into a new directory of the job's
        # own, first on PATH, whatever mc the runner already has. The pin is for Linux
        # x86_64, the only platform this action runs on.
        if [ "$(uname -s)-$(uname -m)" != Linux-x86_64 ]; then
          echo "::error::.github/ci-cache/pins.json pins a MinIO client for Linux x86_64 only; run this job on Linux x86_64."
          exit 1
        fi
        dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/mc.XXXXXX")"
        bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" mc "$dir/mc" linux-amd64
        chmod 0755 "$dir/mc"
        echo "$dir" >> "$GITHUB_PATH"
        export PATH="$dir:$PATH"
        if [[ -n "$MINIO_SESSION_TOKEN" ]]; then
          # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
          for value in "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" "${MINIO_SESSION_TOKEN}"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::upload-to-minio: MinIO inputs must not contain a newline"
              exit 1
            fi
          done
          echo "MC_HOST_spice-minio=${MINIO_ENDPOINT%%://*}://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}:${MINIO_SESSION_TOKEN}@${MINIO_ENDPOINT#*://}" >> "$GITHUB_ENV"
        else
          mc alias set spice-minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
        fi

    - name: Upload to MinIO
      shell: bash
      env:
        INPUT_SOURCE_PATH: ${{ inputs.source_path }}
        INPUT_DESTINATION_PATH: ${{ inputs.destination_path }}
      run: |
        if [ -f "${INPUT_SOURCE_PATH}" ]; then
          if ! mc cp "${INPUT_SOURCE_PATH}" "${INPUT_DESTINATION_PATH}"; then
            echo "::warning::Failed to upload ${INPUT_SOURCE_PATH} to MinIO."
          fi
        else
          echo "File ${INPUT_SOURCE_PATH} not found, skipping upload"
        fi
