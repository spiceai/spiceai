name: Build Spicepod Validator
description: 'Builds the spicepod-validator binary with caching based on commit SHA'

inputs:
  install_to_system_path:
    description: 'Whether to install spicepod-validator to system path'
    required: false
    default: 'true'
  force_rebuild:
    description: 'Whether to force a rebuild (skip cache)'
    required: false
    default: 'false'
  download_from_minio:
    description: 'Whether to try downloading from MinIO before checking GitHub cache'
    required: false
    default: 'true'
  minio_endpoint:
    description: 'MinIO endpoint for sccache'
    required: false
  minio_access_key:
    description: 'MinIO access key for sccache'
    required: false
  minio_secret_key:
    description: 'MinIO secret key for sccache'
    required: false

outputs:
  cache-hit:
    description: 'Whether the spicepod-validator was found in cache'
    value: ${{ steps.build.outputs.cache-hit }}
  validator-path:
    description: 'Path to the spicepod-validator binary'
    value: ${{ steps.build.outputs.binary-path }}

runs:
  using: 'composite'
  steps:
    - name: Build spicepod-validator
      id: build
      uses: ./.github/actions/build-cached-rust-binary
      with:
        binary_name: spicepod-validator
        build_command: make build-validator
        install_to_system_path: ${{ inputs.install_to_system_path }}
        force_rebuild: ${{ inputs.force_rebuild }}
        download_from_minio: ${{ inputs.download_from_minio }}
        minio_endpoint: ${{ inputs.minio_endpoint }}
        minio_access_key: ${{ inputs.minio_access_key }}
        minio_secret_key: ${{ inputs.minio_secret_key }}
        setup_make: 'true'
