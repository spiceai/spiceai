name: 'Spiced CUDA Build Action'
description: 'Set up CUDA, verify prerequisites, build and package spiced with CUDA support.'
inputs:
  cuda-version:
    description: 'The CUDA version to install'
    required: true
    default: '12.6.0'
  cuda-compute-capability:
    description: 'The CUDA compute capability to target'
    required: true
  artifact-tag:
    description: "Tag artifacts, generally os/hardware dependent e.g. 'linux_x86_64' or 'linux_aarch64'"
    required: true
  target_os:
    description: 'operating system to target'
    required: true
  rust-profile:
    description: 'Rust build profile (release, release-lto)'
    required: false
    default: 'release'

outputs:
  artifact-name:
    description: 'The name of the uploaded artifact'
    value: 'spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}.tar.gz'

runs:
  using: 'composite'
  steps:
    # The build and package commands read the inputs through `env` instead of
    # being assembled into `$GITHUB_ENV` and run back as an `env` expression, so an input
    # carrying shell metacharacters or a newline stays a value.
    - name: Define Shell
      run: |
        echo "SHELL=bash" >> $GITHUB_ENV
      shell: bash

    - name: Install CUDA Toolkit (Linux)
      uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
      id: cuda-toolkit-linux
      with:
        cuda: ${{ inputs.cuda-version }}
        method: 'network'
        use-github-cache: false
        non-cuda-sub-packages: '["libcurand-dev", "libcublas","libcublas-dev"]'
        # nvml-dev: llama.cpp's CUDA backend includes <nvml.h> (it loads
        # libnvidia-ml at run time, so only the header is needed to build).
        sub-packages: '["nvcc","compiler","libraries","libraries-dev","cudart","cudart-dev","nvml-dev"]'

    - name: Verify CUDA prerequisites
      run: |
        nvcc --version
        # Fail here, not two hours into the llama.cpp CUDA compile.
        if [[ ! -f "${CUDA_PATH}/include/nvml.h" ]]; then
          echo "::error::spiced-cuda-build: ${CUDA_PATH}/include/nvml.h is missing; llama.cpp's CUDA backend needs the NVML header (the cuda-nvml-dev package)"
          exit 1
        fi
      shell: ${{ env.SHELL }}

    - name: Build spiced (models, cuda)
      env:
        CUDA_COMPUTE_CAP: ${{ inputs.cuda-compute-capability }}
        INPUT_RUST_PROFILE: ${{ inputs.rust-profile }}
      # Make re-parses RUST_PROFILE, so `$(...)` in it would still run; accept only a
      # cargo profile name.
      run: |
        if [[ ! "${INPUT_RUST_PROFILE}" =~ ^[A-Za-z0-9_-]*$ ]]; then
          echo "::error::spiced-cuda-build: rust-profile must be a cargo profile name"
          exit 1
        fi
        make -C bin/spiced SPICED_NON_DEFAULT_FEATURES='cuda' RUST_PROFILE="${INPUT_RUST_PROFILE}"
      shell: ${{ env.SHELL }}

    - name: Package binary
      env:
        INPUT_RUST_PROFILE: ${{ inputs.rust-profile }}
        INPUT_CUDA_COMPUTE_CAPABILITY: ${{ inputs.cuda-compute-capability }}
        INPUT_ARTIFACT_TAG: ${{ inputs.artifact-tag }}
      run: mv "target/${INPUT_RUST_PROFILE}/spiced" spiced && chmod +x spiced && tar czf "spiced_cuda_${INPUT_CUDA_COMPUTE_CAPABILITY}_${INPUT_ARTIFACT_TAG}.tar.gz" spiced
      shell: ${{ env.SHELL }}

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}
        path: spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}.tar.gz
