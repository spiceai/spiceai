name: 'Spiced CUDA Build Action'
description: 'Set up CUDA, verify prerequisites, build and package spiced with CUDA support.'
inputs:
  cuda-version:
    description: 'The CUDA version to install'
    required: true
    default: '12.6.0'
  cuda-compute-capability:
    description: 'The CUDA compute capability to target'
    required: true
  artifact-tag:
    description: "Tag artifacts, generally os/hardware dependent e.g. 'linux_x86_64' or 'linux_aarch64'"
    required: true
  target_os:
    description: 'operating system to target'
    required: true
  rust-profile:
    description: 'Rust build profile (release, release-lto)'
    required: false
    default: 'release'

outputs:
  artifact-name:
    description: 'The name of the uploaded artifact'
    value: 'spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}.tar.gz'

runs:
  using: 'composite'
  steps:
    - name: Define Shell and Commands
      run: |
        echo "SHELL=bash" >> $GITHUB_ENV
        echo "BUILD_CMD=make -C bin/spiced SPICED_NON_DEFAULT_FEATURES='cuda' RUST_PROFILE=${{ inputs.rust-profile }}" >> $GITHUB_ENV
        echo "PACKAGE_CMD=mv target/${{ inputs.rust-profile }}/spiced spiced && chmod +x spiced && tar czf spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}.tar.gz spiced" >> $GITHUB_ENV
      shell: bash

    - name: Install CUDA Toolkit (Linux)
      uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
      id: cuda-toolkit-linux
      with:
        cuda: ${{ inputs.cuda-version }}
        method: 'network'
        use-github-cache: false
        non-cuda-sub-packages: '["libcurand-dev", "libcublas","libcublas-dev"]'
        sub-packages: '["nvcc","compiler","libraries","libraries-dev","cudart","cudart-dev"]'

    - name: Verify CUDA prerequisites
      run: |
        nvcc --version
      shell: ${{ env.SHELL }}

    - name: Build spiced (models, cuda)
      env:
        CUDA_COMPUTE_CAP: ${{ inputs.cuda-compute-capability }}
      run: ${{ env.BUILD_CMD }}
      shell: ${{ env.SHELL }}

    - name: Package binary
      run: ${{ env.PACKAGE_CMD }}
      shell: ${{ env.SHELL }}

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}
        path: spiced_cuda_${{ inputs.cuda-compute-capability }}_${{ inputs.artifact-tag }}.tar.gz
