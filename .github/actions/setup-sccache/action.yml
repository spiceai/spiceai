name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint (used for Linux and Windows)'
    required: false
  spiceio_endpoint:
    description: 'Spiceio S3-compatible endpoint (used for macOS)'
    required: false
  minio_access_key:
    description: >-
      MinIO access key. Required by every configuration that signs its requests, which is
      all of them except macOS via `spiceio_endpoint`. The action needs it here rather than
      wherever cargo eventually runs, because the pre-flight below signs a request before
      rustc is ever wrapped.
    required: false
  minio_secret_key:
    description: 'MinIO secret key. See minio_access_key.'
    required: false
  minio_session_token:
    description: >-
      Session token of temporary MinIO credentials. With it, the credentials go only to the
      cache server, which the pre-flight below starts and which serves the rest of the job.
      They are not exported to later steps, where the token would join any other AWS keys a
      step sets.
    required: false

# Only a run on trunk reads and writes the cache's shared keys. Any other run keeps its cache
# under `sccache/untrusted/<repository id>/<ref>/` (.github/actions/ci-store-prefix), the only
# keys the CI object store lets it write. The macOS spiceio endpoint is an SMB share that store
# policy does not cover: any `ci` job can write any key there, so the prefix only separates
# refs. A job with the full CI roles does not mount it (the `Set up spiceio` steps of the
# `*_aws.yml` workflows); trunk's own share, writable from trunk alone, is planned. sccache 0.9.1 has no
# read-only mode for S3 (`rw_mode` is for its disk and GCS caches), so such a run starts from
# its own keys rather than reading trunk's.
runs:
  using: 'composite'
  steps:
    - name: Choose the CI store prefix
      uses: $/.github/actions/ci-store-prefix

    - name: Set sccache environment variables
      if: inputs.minio_endpoint != '' || (runner.os == 'macOS' && inputs.spiceio_endpoint != '')
      shell: bash
      # Read through `env` rather than interpolating `${{ }}` into the script, so a value
      # containing shell metacharacters stays a value.
      env:
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
        SPICEIO_ENDPOINT: ${{ inputs.spiceio_endpoint }}
      run: |
        echo "SCCACHE_DIRECT=true" >> $GITHUB_ENV
        echo "SCCACHE_SETUP=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

        # Job-private config + daemon. Self-hosted Macs run several GitHub
        # runners as the same uid, so ~/.config/sccache/config and the default
        # daemon port 4226 are shared. A sibling job's spiceio auto-increments
        # onto the next port, overwrites that file, and this job's sccache then
        # probes a Connection-refused endpoint (see run 32895059022).
        #
        # A hashed TCP port is not job-unique (20k values) and sccache v0.9.1
        # attaches to whatever daemon already holds that port — `--zero-stats`
        # then succeeds against the stale job's config. Unix gets a socket
        # under RUNNER_TEMP instead; Windows (no UDS) gets an ephemeral TCP
        # port. Both use a finite idle timeout: a unique listen address plus
        # IDLE_TIMEOUT=0 would leak one immortal daemon per job.
        conf_dir="${RUNNER_TEMP}/sccache"
        mkdir -p "$conf_dir"
        echo "SCCACHE_CONF=${conf_dir}/config" >> "$GITHUB_ENV"
        echo "SCCACHE_IDLE_TIMEOUT=7200" >> "$GITHUB_ENV"

        if [[ "${RUNNER_OS}" != "Windows" ]]; then
          sock="${conf_dir}/sccache.sock"
          rm -f "$sock"
          echo "SCCACHE_SERVER_UDS=${sock}" >> "$GITHUB_ENV"
          echo "sccache isolated: SCCACHE_CONF=${conf_dir}/config SCCACHE_SERVER_UDS=${sock}"
        else
          port=""
          if command -v python3 >/dev/null 2>&1; then
            port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()') || port=""
          elif command -v python >/dev/null 2>&1; then
            port=$(python -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()') || port=""
          fi
          if [[ -z "${port}" ]]; then
            ident="${GITHUB_RUN_ID:-0}:${GITHUB_JOB:-job}:${GITHUB_RUN_ATTEMPT:-1}:${RUNNER_NAME:-}"
            hash=$(printf '%s' "$ident" | cksum | awk '{print $1}')
            port=$((42000 + hash % 20000))
          fi
          echo "SCCACHE_SERVER_PORT=${port}" >> "$GITHUB_ENV"
          echo "sccache isolated: SCCACHE_CONF=${conf_dir}/config SCCACHE_SERVER_PORT=${port}"
        fi

        # Credentials have to be in the environment from here on -- before the cache config
        # is written and before the pre-flight signs its probe request -- and not in
        # whichever later step happens to run cargo. A probe that cannot sign falls through
        # to the EC2 instance metadata service, which a self-hosted runner does not have;
        # the pre-flight then clears `RUSTC_WRAPPER` for the whole job and the build
        # compiles uncached, reporting nothing worse than a `::warning::`. Owning the
        # credentials here is what makes that ordering impossible to get wrong at a call
        # site.
        # Export only where the cache actually signs. macOS prefers `spiceio_endpoint` and
        # writes `no_credentials = true` for it, so keys are unnecessary there -- and
        # `$GITHUB_ENV` is job-wide, so exporting them anyway would leave MinIO credentials
        # in every later step's environment, where they can displace that step's own AWS
        # identity. Linux and Windows always write `no_credentials = false`, and macOS falls
        # back to the signing minio path whenever the spiceio endpoint resolves empty, so
        # both of those still need them.
        if [[ "${RUNNER_OS}" == "macOS" && -n "${SPICEIO_ENDPOINT}" ]]; then
          echo "Compiler cache signs no requests on this path; leaving credentials out of the job environment."
        elif [[ -n "${MINIO_ACCESS_KEY}" && -n "${MINIO_SECRET_KEY}" && -n "${MINIO_SESSION_TOKEN}" ]]; then
          echo "Temporary credentials go to the cache server only; leaving them out of the job environment."
        elif [[ -n "${MINIO_ACCESS_KEY}" && -n "${MINIO_SECRET_KEY}" ]]; then
          # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
          for value in "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::setup-sccache: MinIO credentials must not contain a newline"
              exit 1
            fi
          done
          echo "AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY}" >> $GITHUB_ENV
        else
          # Warn rather than fail: a cache that cannot answer is meant to degrade, and
          # failing here would fail builds for an infrastructure outage -- in the merge queue
          # that dequeues the whole batch (see #12770).
          echo "::warning::No compiler-cache credentials supplied (minio_access_key/minio_secret_key). This cache configuration signs its requests, so the pre-flight will disable the cache and this job will compile uncached."
        fi

    - name: Configure apt mirrors (Linux)
      if: runner.os == 'Linux' && inputs.minio_endpoint != ''
      uses: $/.github/actions/configure-apt

    - name: Set up sccache (Linux)
      id: linux
      if: runner.os == 'Linux' && inputs.minio_endpoint != ''
      shell: bash
      env:
        INPUT_MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
      run: |
        set -eo pipefail
        # The sccache release pinned in .github/ci-cache/pins.json, checked against its
        # SHA-256 before anything is extracted, and installed into a new directory of the
        # job's own, first on PATH: an sccache already on the runner is never what wraps
        # rustc. It pins the x86_64 build only; elsewhere the job compiles uncached, and
        # nothing runs sccache.
        case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-musl.tar.gz ;;
          *) target='' ;;
        esac
        if [ -z "$target" ]; then
          echo "::warning::.github/ci-cache/pins.json pins no sccache for Linux $(uname -m); building without the compiler cache."
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_SETUP=false"
          } >> "$GITHUB_ENV"
          echo "installed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/sccache.XXXXXX")"
        bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" sccache "$dir/sccache.tar.gz" "$target"
        mkdir "$dir/bin"
        tar -xzf "$dir/sccache.tar.gz" -C "$dir"
        install -m 0755 "$dir"/sccache-v*/sccache "$dir/bin/sccache"
        rm -rf "$dir/sccache.tar.gz" "$dir"/sccache-v*
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "installed=true" >> "$GITHUB_OUTPUT"
        echo "SCCACHE_CACHE_SIZE=4T" >> $GITHUB_ENV
        : "${SCCACHE_CONF:=${RUNNER_TEMP}/sccache/config}"
        mkdir -p "$(dirname "${SCCACHE_CONF}")"
        printf '[cache.s3]\nbucket = "sccache"\nkey_prefix = "%s"\nendpoint = "%s"\nuse_ssl = false\nserver_side_encryption = false\nno_credentials = false\nregion = "us-east-1"\n' "${CI_STORE_PREFIX%/}" "${INPUT_MINIO_ENDPOINT}" > "${SCCACHE_CONF}"

    # The release pinned in .github/ci-cache/pins.json, as on Linux, into a new directory of the
    # job's own: a self-hosted Mac's own sccache is one any job on that host can replace, so it never
    # wraps rustc.
    - name: Install sccache (macOS)
      id: macos
      if: runner.os == 'macOS' && (inputs.minio_endpoint != '' || inputs.spiceio_endpoint != '')
      shell: bash
      run: |
        set -eo pipefail
        case "$(uname -m)" in
          arm64) target=aarch64-apple-darwin.tar.gz ;;
          x86_64) target=x86_64-apple-darwin.tar.gz ;;
          *) target='' ;;
        esac
        if [ -z "$target" ]; then
          echo "::warning::.github/ci-cache/pins.json pins no sccache for macOS $(uname -m); building without the compiler cache."
          {
            echo "RUSTC_WRAPPER="
            echo "SCCACHE_SETUP=false"
          } >> "$GITHUB_ENV"
          echo "installed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/sccache.XXXXXX")"
        bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" sccache "$dir/sccache.tar.gz" "$target"
        mkdir "$dir/bin"
        tar -xzf "$dir/sccache.tar.gz" -C "$dir"
        install -m 0755 "$dir"/sccache-v*/sccache "$dir/bin/sccache"
        rm -rf "$dir/sccache.tar.gz" "$dir"/sccache-v*
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: Set up sccache (macOS)
      if: runner.os == 'macOS' && steps.macos.outputs.installed == 'true'
      shell: bash
      env:
        INPUT_SPICEIO_ENDPOINT: ${{ inputs.spiceio_endpoint }}
        INPUT_MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
      run: |
        sccache --version

        SCCACHE_ENDPOINT="http://localhost:9000"
        SCCACHE_REGION="us-east-1"
        SCCACHE_NO_CREDS="false"

        # Use spiceio if its endpoint was provided
        if [[ -n "${INPUT_SPICEIO_ENDPOINT}" ]]; then
          SCCACHE_ENDPOINT="${INPUT_SPICEIO_ENDPOINT}"
          SCCACHE_REGION="us-west-1"
          SCCACHE_NO_CREDS="true"
          echo "SCCACHE_CACHE_SIZE=2T" >> $GITHUB_ENV
          echo "Using spiceio at $SCCACHE_ENDPOINT"
        elif [[ -n "${INPUT_MINIO_ENDPOINT}" ]]; then
          SCCACHE_ENDPOINT="${INPUT_MINIO_ENDPOINT}"
          echo "SCCACHE_CACHE_SIZE=200G" >> $GITHUB_ENV
          echo "Using MinIO at $SCCACHE_ENDPOINT"
        else
          echo "sccache endpoint not configured"
          exit 0
        fi

        : "${SCCACHE_CONF:=${RUNNER_TEMP}/sccache/config}"
        mkdir -p "$(dirname "${SCCACHE_CONF}")"
        printf '[cache.s3]\nbucket = "sccache"\nkey_prefix = "%ssccache"\nendpoint = "%s"\nuse_ssl = false\nserver_side_encryption = false\nno_credentials = %s\nregion = "%s"\n' "${CI_STORE_PREFIX}" "$SCCACHE_ENDPOINT" "$SCCACHE_NO_CREDS" "$SCCACHE_REGION" > "${SCCACHE_CONF}"

    - name: Set up sccache (Windows)
      if: runner.os == 'Windows' && inputs.minio_endpoint != ''
      shell: pwsh
      env:
        INPUT_MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
      run: |
        $ErrorActionPreference = 'Stop'
        # The sccache release pinned in .github/ci-cache/pins.json, checked against its
        # SHA-256 before it is extracted.
        $pin = (Get-Content -Raw (Join-Path $env:GITHUB_ACTION_PATH '..\..\ci-cache\pins.json') | ConvertFrom-Json).'sccache'
        $target = 'x86_64-pc-windows-msvc.zip'
        $expectedSha256 = $pin.sha256.$target
        if ([string]::IsNullOrEmpty($expectedSha256)) {
          Write-Output "::error::.github/ci-cache/pins.json pins no sccache for $target."
          exit 1
        }
        $sccacheVersion = "v$($pin.version)"
        $sccacheUrl = $pin.url.Replace('{version}', $pin.version).Replace('{target}', $target)
        $sccacheZip = "$env:TEMP\sccache.zip"
        $sccacheDir = "$env:USERPROFILE\sccache"

        Invoke-WebRequest -Uri $sccacheUrl -OutFile $sccacheZip
        $actualSha256 = (Get-FileHash -Algorithm SHA256 -Path $sccacheZip).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256) {
          Remove-Item -Force $sccacheZip
          Write-Output "::error::$sccacheUrl does not match its pinned SHA-256: expected $expectedSha256, got $actualSha256. It was not used."
          exit 1
        }
        Expand-Archive -Path $sccacheZip -DestinationPath $sccacheDir -Force
        $sccacheExtractedDir = Join-Path $sccacheDir "sccache-$sccacheVersion-x86_64-pc-windows-msvc"
        $sccacheExePath = Join-Path $sccacheExtractedDir "sccache.exe"
        if (-not (Test-Path $sccacheExePath)) {
          Write-Error "sccache.exe not found at expected path: $sccacheExePath"
          exit 1
        }
        $sccacheBinDir = Split-Path $sccacheExePath -Parent
        echo "$sccacheBinDir" >> $env:GITHUB_PATH

        # Configure sccache (job-private path from SCCACHE_CONF, not the
        # per-user APPDATA file — several self-hosted runners can share one uid).
        $configPath = $env:SCCACHE_CONF
        if ([string]::IsNullOrEmpty($configPath)) {
          $configPath = Join-Path $env:RUNNER_TEMP "sccache\config"
        }
        $configDir = Split-Path $configPath -Parent
        New-Item -ItemType Directory -Force -Path $configDir | Out-Null
        $config = "[cache.s3]`nbucket = `"sccache`"`nkey_prefix = `"$($env:CI_STORE_PREFIX.TrimEnd('/'))`"`nendpoint = `"${env:INPUT_MINIO_ENDPOINT}`"`nuse_ssl = false`nserver_side_encryption = false`nno_credentials = false`nregion = `"us-east-1`""
        $config | Out-File -FilePath $configPath -Encoding utf8

    - name: Confirm the compiler cache answers before wrapping rustc
      if: (runner.os == 'Linux' && inputs.minio_endpoint != '' && steps.linux.outputs.installed == 'true') || (runner.os == 'macOS' && steps.macos.outputs.installed == 'true')
      shell: bash
      # Invoked through `bash` rather than as `./…` so the step does not depend on
      # the script's executable bit surviving a checkout on every platform. The probe
      # starts the cache server, so temporary credentials reach the server here.
      env:
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
      run: |
        if [[ -n "${MINIO_SESSION_TOKEN}" ]]; then
          export AWS_ACCESS_KEY_ID="${MINIO_ACCESS_KEY}" AWS_SECRET_ACCESS_KEY="${MINIO_SECRET_KEY}" AWS_SESSION_TOKEN="${MINIO_SESSION_TOKEN}"
        fi
        bash "$GITHUB_ACTION_PATH/verify_compiler_cache.sh"

    - name: Confirm the compiler cache answers before wrapping rustc (Windows)
      if: runner.os == 'Windows' && inputs.minio_endpoint != ''
      shell: pwsh
      run: |
        # `--zero-stats` goes through sccache's connect_or_start_server, so it fails
        # when the server cannot come up. `--show-stats` does not: with no daemon
        # running it reports synthesized empty stats and exits 0, succeeding on
        # exactly the unreachable storage this step exists to catch.
        $ErrorActionPreference = 'Continue'
        $reachable = $false
        $detail = 'sccache was not found on PATH'
        if (Get-Command sccache -ErrorAction SilentlyContinue) {
          $output = & sccache --zero-stats 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            $reachable = $true
          } else {
            $detail = ($output -replace '\r?\n', ' ').Trim()
          }
        }
        if ($reachable) {
          Write-Output 'Compiler cache is reachable.'
        } else {
          Write-Output "::warning::Compiler cache is unreachable; building without it. sccache reported: $detail"
          "RUSTC_WRAPPER=" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SCCACHE_SETUP=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        }
