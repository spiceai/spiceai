name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint for self-hosted Linux sccache'
    required: false
  macos_sccache_dir:
    description: 'Optional cache directory for self-hosted macOS runners; defaults to the detected SMB mount'
    required: false

outputs:
  enabled:
    description: 'Whether sccache was configured for this runner'
    value: ${{ steps.detect.outputs.enabled }}
  backend:
    description: 'Configured sccache backend for this runner'
    value: ${{ steps.setup-macos.outputs.backend || steps.detect.outputs.backend }}
  rustc_wrapper:
    description: 'Rust compiler wrapper to use for subsequent steps'
    value: ${{ steps.detect.outputs.rustc_wrapper }}

runs:
  using: 'composite'
  steps:
    - name: Determine sccache configuration
      id: detect
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ] && [ "${{ runner.environment }}" = "self-hosted" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=sccache" >> "$GITHUB_OUTPUT"
        elif [ "$RUNNER_OS" = "Linux" ] && [ "${{ runner.environment }}" = "self-hosted" ] && [ -n "${{ inputs.minio_endpoint }}" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "backend=minio" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=sccache" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "backend=none" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up sccache (Linux)
      if: steps.detect.outputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v sccache &> /dev/null; then
          if ! command -v wget &> /dev/null; then
            sudo apt-get update
            sudo apt-get install wget -y
          fi
          wget -q https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv sccache-v0.9.1-x86_64-unknown-linux-musl/sccache /usr/local/bin
        fi
        sccache --version
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.s3]
        bucket = "sccache"
        endpoint = "${{ inputs.minio_endpoint }}"
        use_ssl = false
        server_side_encryption = false
        no_credentials = false
        region = "us-east-1"
        EOF

        export SCCACHE_CACHE_SIZE=200G
        export SCCACHE_DIRECT=true
        export SCCACHE_IDLE_TIMEOUT=0
        export SCCACHE_SETUP=true
        export RUSTC_WRAPPER=sccache
        {
          echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          echo "SCCACHE_DIRECT=$SCCACHE_DIRECT"
          echo "SCCACHE_IDLE_TIMEOUT=$SCCACHE_IDLE_TIMEOUT"
          echo "SCCACHE_SETUP=$SCCACHE_SETUP"
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
        } >> "$GITHUB_ENV"

        sccache --stop-server || true

    - name: Set up sccache (macOS - self-hosted only)
      id: setup-macos
      if: steps.detect.outputs.enabled == 'true' && runner.os == 'macOS' && runner.environment == 'self-hosted'
      shell: bash
      run: |
        if ! command -v sccache &> /dev/null; then
          echo "Error: sccache is not installed on this macOS runner"
          exit 1
        fi
        sccache --version

        list_smb_mounts() {
          while IFS= read -r mount_line; do
            case "$mount_line" in
              *" (smbfs,"*|*" (smbfs)"*)
                mount_point="${mount_line#* on }"
                mount_point="${mount_point%% (*}"
                printf '%s\n' "$mount_point"
                ;;
            esac
          done < <(mount)
        }

        probe_cache_dir() {
          local candidate="$1"
          local probe_file

          [ -n "$candidate" ] || return 1

          if ! mkdir -p "$candidate" 2>/dev/null; then
            return 1
          fi

          if [ ! -w "$candidate" ]; then
            return 1
          fi

          probe_file="$candidate/.sccache-probe-$$"
          if ! touch "$probe_file" 2>/dev/null; then
            return 1
          fi

          rm -f "$probe_file"
          printf '%s\n' "$candidate"
          return 0
        }

        resolve_macos_cache_dir() {
          local candidate
          if [ -n "${{ inputs.macos_sccache_dir }}" ]; then
            candidate="$(probe_cache_dir "${{ inputs.macos_sccache_dir }}" || true)"
            if [ -n "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          fi

          if [ -n "${SCCACHE_DIR:-}" ]; then
            candidate="$(probe_cache_dir "$SCCACHE_DIR" || true)"
            if [ -n "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          fi

          if [ -d "/Volumes/sccache" ]; then
            candidate="$(probe_cache_dir "/Volumes/sccache/spiceai-sccache" || true)"
            if [ -n "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi
          fi

          local smb_mounts=()
          local mount_point
          local cache_candidates=()
          while IFS= read -r mount_point; do
            [ -n "$mount_point" ] && smb_mounts+=("$mount_point")
          done < <(list_smb_mounts)

          for mount_point in "${smb_mounts[@]}"; do
            cache_candidates=(
              "$mount_point/spiceai-sccache"
              "$mount_point/.cache/spiceai-sccache"
              "$mount_point/cache/spiceai-sccache"
              "$mount_point/tmp/spiceai-sccache"
              "$mount_point/var/tmp/spiceai-sccache"
              "$mount_point/data/spiceai-sccache"
              "$mount_point/data/cache/spiceai-sccache"
            )

            for candidate in "${cache_candidates[@]}"; do
              candidate="$(probe_cache_dir "$candidate" || true)"
              if [ -n "$candidate" ]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done
          done

          echo "No writable SMB cache directory detected; falling back to local cache." >&2
          echo "Detected SMB mounts:" >&2
          list_smb_mounts >&2 || true
          candidate="$(probe_cache_dir "$HOME/.cache/sccache" || true)"
          if [ -n "$candidate" ]; then
            printf '%s\n' "$candidate"
            return 0
          fi

          printf '%s\n' "$HOME/.cache/sccache"
        }

        cache_dir="$(resolve_macos_cache_dir)"
        if ! mkdir -p "$cache_dir" 2>/dev/null; then
          echo "Error: failed to create sccache directory: $cache_dir"
          exit 1
        fi

        if [ ! -w "$cache_dir" ]; then
          echo "Error: sccache directory is not writable: $cache_dir"
          exit 1
        fi

        backend="local"
        mount_point="$(df "$cache_dir" | tail -1 | awk '{print $NF}')"
        mount_line="$(mount | grep -F " on $mount_point (" || true)"
        if printf '%s\n' "$mount_line" | grep -q 'smbfs'; then
          backend="smb"
        fi

        rm -f ~/.config/sccache/config

        export SCCACHE_CACHE_SIZE=200G
        export SCCACHE_DIRECT=true
        export SCCACHE_IDLE_TIMEOUT=0
        export SCCACHE_SETUP=true
        export RUSTC_WRAPPER=sccache
        export SCCACHE_DIR="$cache_dir"
        {
          echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          echo "SCCACHE_DIRECT=$SCCACHE_DIRECT"
          echo "SCCACHE_IDLE_TIMEOUT=$SCCACHE_IDLE_TIMEOUT"
          echo "SCCACHE_SETUP=$SCCACHE_SETUP"
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
          echo "SCCACHE_DIR=$SCCACHE_DIR"
        } >> "$GITHUB_ENV"

        echo "backend=$backend" >> "$GITHUB_OUTPUT"

        echo "Using macOS sccache directory: $SCCACHE_DIR"
        sccache --stop-server || true
        sccache --start-server
