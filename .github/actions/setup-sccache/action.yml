name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint for self-hosted Linux sccache'
    required: false
  macos_sccache_dir:
    description: 'Optional override for the self-hosted macOS sccache directory; must be /Volumes/ai_platform_dev/build/sccache'
    required: false
  require_macos_smb:
    description: 'Fail on self-hosted macOS unless /Volumes/ai_platform_dev is mounted as smbfs and /Volumes/ai_platform_dev/build/sccache is writable'
    required: false

outputs:
  enabled:
    description: 'Whether sccache was configured for this runner'
    value: ${{ steps.detect.outputs.enabled }}
  backend:
    description: 'Configured sccache backend for this runner'
    value: ${{ steps.setup-macos.outputs.backend || steps.detect.outputs.backend }}
  rustc_wrapper:
    description: 'Rust compiler wrapper to use for subsequent steps'
    value: ${{ steps.detect.outputs.rustc_wrapper }}

runs:
  using: 'composite'
  steps:
    - name: Determine sccache configuration
      id: detect
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ] && [ "${{ runner.environment }}" = "self-hosted" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "backend=auto" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=sccache" >> "$GITHUB_OUTPUT"
        elif [ "$RUNNER_OS" = "Linux" ] && [ "${{ runner.environment }}" = "self-hosted" ] && [ -n "${{ inputs.minio_endpoint }}" ]; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "backend=minio" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=sccache" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "backend=none" >> "$GITHUB_OUTPUT"
          echo "rustc_wrapper=" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up sccache (Linux)
      if: steps.detect.outputs.enabled == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        if ! command -v sccache &> /dev/null; then
          if ! command -v wget &> /dev/null; then
            sudo apt-get update
            sudo apt-get install wget -y
          fi
          wget -q https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
          sudo mv sccache-v0.9.1-x86_64-unknown-linux-musl/sccache /usr/local/bin
        fi
        sccache --version
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.s3]
        bucket = "sccache"
        endpoint = "${{ inputs.minio_endpoint }}"
        use_ssl = false
        server_side_encryption = false
        no_credentials = false
        region = "us-east-1"
        EOF

        export SCCACHE_CACHE_SIZE=200G
        export SCCACHE_DIRECT=true
        export SCCACHE_IDLE_TIMEOUT=0
        export SCCACHE_SETUP=true
        export RUSTC_WRAPPER=sccache
        {
          echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          echo "SCCACHE_DIRECT=$SCCACHE_DIRECT"
          echo "SCCACHE_IDLE_TIMEOUT=$SCCACHE_IDLE_TIMEOUT"
          echo "SCCACHE_SETUP=$SCCACHE_SETUP"
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
        } >> "$GITHUB_ENV"

        sccache --stop-server || true

    - name: Set up sccache (macOS - self-hosted only)
      id: setup-macos
      if: steps.detect.outputs.enabled == 'true' && runner.os == 'macOS' && runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail

        expected_macos_smb_mount='/Volumes/ai_platform_dev'
        expected_macos_sccache_dir='/Volumes/ai_platform_dev/build/sccache'

        if ! command -v sccache &> /dev/null; then
          echo "Error: sccache is not installed on this macOS runner"
          exit 1
        fi
        sccache --version

        require_macos_smb='${{ inputs.require_macos_smb }}'
        if [ "$require_macos_smb" != 'true' ]; then
          require_macos_smb='false'
        fi

        list_smb_mounts() {
          while IFS= read -r mount_line; do
            case "$mount_line" in
              *" (smbfs,"*|*" (smbfs)"*)
                mount_point="${mount_line#* on }"
                mount_point="${mount_point%% (*}"
                printf '%s\n' "$mount_point"
                ;;
            esac
          done < <(mount)
        }

        print_smb_diagnostics() {
          echo "Expected SMB mount: $expected_macos_smb_mount" >&2
          echo "Expected sccache directory: $expected_macos_sccache_dir" >&2
          echo "Detected mount entry for expected SMB share:" >&2
          expected_smb_mount_line >&2 || true
          echo "Detected SMB mounts:" >&2
          list_smb_mounts >&2 || true
          echo "Contents of /Volumes:" >&2
          ls -la /Volumes >&2 || true
        }

        expected_smb_mount_line() {
          mount | grep -F " on $expected_macos_smb_mount (" || true
        }

        mount_line_for_path() {
          local candidate="$1"
          local mount_point

          mount_point="$(df "$candidate" | tail -1 | awk '{print $NF}')"
          [ -n "$mount_point" ] || return 1

          mount | grep -F " on $mount_point (" || true
        }

        probe_cache_dir() {
          local candidate="$1"
          local probe_file
          local mount_line

          [ -n "$candidate" ] || return 1

          if ! mkdir -p "$candidate" 2>/dev/null; then
            return 1
          fi

          mount_line="$(mount_line_for_path "$candidate")"
          if [ -z "$mount_line" ]; then
            return 1
          fi

          probe_file="$candidate/.sccache-probe-$$"
          if ! touch "$probe_file"; then
            return 1
          fi

          rm -f "$probe_file"
          printf '%s\n' "$candidate"
          return 0
        }

        resolve_macos_cache_dir() {
          local candidate mount_line

          candidate='${{ inputs.macos_sccache_dir }}'
          if [ -z "$candidate" ]; then
            candidate="$expected_macos_sccache_dir"
          fi

          if [ "$candidate" != "$expected_macos_sccache_dir" ]; then
            echo "Expected macOS sccache directory to be $expected_macos_sccache_dir, got: $candidate" >&2
            return 1
          fi

          mount_line="$(expected_smb_mount_line)"
          if [ -n "$mount_line" ]; then
            if ! printf '%s\n' "$mount_line" | grep -q 'smbfs'; then
              echo "Expected $expected_macos_smb_mount to be mounted as smbfs." >&2
              print_smb_diagnostics
              return 1
            fi

            candidate="$(probe_cache_dir "$candidate" || true)"
            if [ -n "$candidate" ]; then
              printf '%s\n' "$candidate"
              return 0
            fi

            echo "Expected writable sccache directory at $expected_macos_sccache_dir." >&2
            print_smb_diagnostics
            return 1
          fi

          if [ "$require_macos_smb" = 'true' ]; then
            echo "Expected SMB share to be mounted at $expected_macos_smb_mount." >&2
            print_smb_diagnostics
            return 1
          fi

          echo "Expected SMB share is not mounted at $expected_macos_smb_mount; falling back to local cache." >&2
          print_smb_diagnostics
          candidate="$(probe_cache_dir "$HOME/.cache/sccache" || true)"
          if [ -n "$candidate" ]; then
            printf '%s\n' "$candidate"
            return 0
          fi

          printf '%s\n' "$HOME/.cache/sccache"
        }

        cache_dir="$(resolve_macos_cache_dir)"
        if ! mkdir -p "$cache_dir" 2>/dev/null; then
          echo "Error: failed to create sccache directory: $cache_dir"
          exit 1
        fi

        if [ "$require_macos_smb" = 'true' ] && [ "$cache_dir" != "$expected_macos_sccache_dir" ]; then
          echo "Expected sccache directory to resolve to $expected_macos_sccache_dir, got: $cache_dir" >&2
          exit 1
        fi

        backend="local"
        mount_point="$(df "$cache_dir" | tail -1 | awk '{print $NF}')"
        mount_line="$(mount | grep -F " on $mount_point (" || true)"
        if [ "$mount_point" = "$expected_macos_smb_mount" ] && printf '%s\n' "$mount_line" | grep -q 'smbfs'; then
          backend="smb"
        fi

        if [ "$require_macos_smb" = 'true' ] && [ "$backend" != 'smb' ]; then
          echo "Expected an SMB-backed sccache directory on self-hosted macOS, but resolved: $cache_dir" >&2
          print_smb_diagnostics
          exit 1
        fi

        rm -f ~/.config/sccache/config

        export SCCACHE_CACHE_SIZE=200G
        export SCCACHE_DIRECT=true
        export SCCACHE_IDLE_TIMEOUT=0
        export SCCACHE_SETUP=true
        export RUSTC_WRAPPER=sccache
        export SCCACHE_DIR="$cache_dir"
        {
          echo "SCCACHE_CACHE_SIZE=$SCCACHE_CACHE_SIZE"
          echo "SCCACHE_DIRECT=$SCCACHE_DIRECT"
          echo "SCCACHE_IDLE_TIMEOUT=$SCCACHE_IDLE_TIMEOUT"
          echo "SCCACHE_SETUP=$SCCACHE_SETUP"
          echo "RUSTC_WRAPPER=$RUSTC_WRAPPER"
          echo "SCCACHE_DIR=$SCCACHE_DIR"
        } >> "$GITHUB_ENV"

        echo "backend=$backend" >> "$GITHUB_OUTPUT"

        echo "Using macOS sccache directory: $SCCACHE_DIR"
        sccache --stop-server || true
        sccache --start-server
