name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint (used for Linux)'
    required: false
    type: string

runs:
  using: 'composite'
  steps:
    - name: Set up sccache (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install wget -y
        wget -q https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
        tar -xzf sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
        sudo mv sccache-v0.9.1-x86_64-unknown-linux-musl/sccache /usr/local/bin
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.s3]
        bucket = "sccache"
        endpoint = "${{ inputs.minio_endpoint }}"
        server_side_encryption = false
        no_credentials = false
        region = "us-east-1"
        EOF

    - name: Set up sccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        # Download sccache for macOS
        curl -L -o sccache.tar.gz https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-aarch64-apple-darwin.tar.gz
        tar -xzf sccache.tar.gz
        sudo mv sccache-v0.9.1-aarch64-apple-darwin/sccache /usr/local/bin
        rm -rf sccache.tar.gz sccache-v0.9.1-aarch64-apple-darwin

        # SMB share is auto-mounted by the OS at /Volumes/ai_platform_dev
        SCCACHE_DIR="/Volumes/ai_platform_dev/build/sccache"
        mkdir -p "$SCCACHE_DIR"

        # Configure sccache to use disk cache on the SMB mount
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.disk]
        dir = "$SCCACHE_DIR"
        size = 10737418240
        EOF
