name: Setup sccache
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint (used for Linux)'
    required: false
  unas_smb_pass:
    description: 'SMB password for UNAS share (used by spiceio on macOS)'
    required: false
  spiceio_bin:
    description: 'Path to spiceio binary (from setup-spiceio action)'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Set sccache environment variables
      if: runner.os == 'macOS' || inputs.minio_endpoint != ''
      shell: bash
      run: |
        echo "SCCACHE_CACHE_SIZE=200G" >> $GITHUB_ENV
        echo "SCCACHE_DIRECT=true" >> $GITHUB_ENV
        echo "SCCACHE_IDLE_TIMEOUT=0" >> $GITHUB_ENV
        echo "SCCACHE_SETUP=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

    - name: Set up sccache (Linux)
      if: runner.os == 'Linux' && inputs.minio_endpoint != ''
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install wget -y
        wget -q https://github.com/mozilla/sccache/releases/download/v0.9.1/sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
        tar -xzf sccache-v0.9.1-x86_64-unknown-linux-musl.tar.gz
        sudo mv sccache-v0.9.1-x86_64-unknown-linux-musl/sccache /usr/local/bin
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.s3]
        bucket = "sccache"
        endpoint = "${{ inputs.minio_endpoint }}"
        use_ssl = false
        server_side_encryption = false
        no_credentials = false
        region = "us-east-1"
        EOF

    - name: Set up sccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      env:
        UNAS_SMB_PASS: ${{ inputs.unas_smb_pass }}
        SPICEIO_BIN: ${{ inputs.spiceio_bin }}
      run: |
        if ! command -v sccache &> /dev/null; then
          echo "Error: sccache is not installed on this macOS runner"
          exit 1
        fi
        sccache --version

        SCCACHE_ENDPOINT="http://localhost:9000"
        SCCACHE_REGION="us-east-1"
        SCCACHE_NO_CREDS="false"

        # Try to start spiceio (S3-to-SMB proxy) if available
        if [ -n "$SPICEIO_BIN" ] && [ -n "$UNAS_SMB_PASS" ]; then
          echo "Starting spiceio S3-to-SMB proxy..."
          SPICEIO_LOG="/tmp/spiceio.log"
          SPICEIO_BIND="127.0.0.1:8333" \
          SPICEIO_SMB_SERVER="192.168.3.148" \
          SPICEIO_SMB_USER="runner" \
          SPICEIO_SMB_PASS="$UNAS_SMB_PASS" \
          SPICEIO_SMB_SHARE="ai_platform_dev" \
          SPICEIO_BUCKET="sccache" \
          SPICEIO_REGION="us-west-1" \
          "$SPICEIO_BIN" > "$SPICEIO_LOG" 2>&1 &
          SPICEIO_PID=$!

          SPICEIO_READY=false
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:8333/" 2>/dev/null; then
              SPICEIO_READY=true
              echo "spiceio is ready (PID: $SPICEIO_PID)"
              break
            fi
            if ! kill -0 "$SPICEIO_PID" 2>/dev/null; then
              echo "spiceio exited unexpectedly"
              break
            fi
            sleep 0.5
          done

          if [ "$SPICEIO_READY" = true ]; then
            SCCACHE_ENDPOINT="http://127.0.0.1:8333"
            SCCACHE_REGION="us-west-1"
            SCCACHE_NO_CREDS="true"
            echo "Using spiceio at $SCCACHE_ENDPOINT"
          else
            echo "Failed to start spiceio, falling back to local MinIO"
            echo "--- spiceio log ---"
            cat "$SPICEIO_LOG" 2>/dev/null || true
            echo "--- end spiceio log ---"
            kill "$SPICEIO_PID" 2>/dev/null || true
          fi
        else
          echo "spiceio not available or SMB password not set, using local MinIO"
        fi
        rm -rf ~/.config/sccache/config
        mkdir -p ~/.config/sccache
        cat <<EOF > ~/.config/sccache/config
        [cache.s3]
        bucket = "sccache"
        endpoint = "$SCCACHE_ENDPOINT"
        use_ssl = false
        server_side_encryption = false
        no_credentials = $SCCACHE_NO_CREDS
        region = "$SCCACHE_REGION"
        EOF

    - name: Set up sccache (Windows)
      if: runner.os == 'Windows' && inputs.minio_endpoint != ''
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Download and install sccache
        $sccacheVersion = "v0.9.1"
        $sccacheUrl = "https://github.com/mozilla/sccache/releases/download/$sccacheVersion/sccache-$sccacheVersion-x86_64-pc-windows-msvc.zip"
        $sccacheZip = "$env:TEMP\sccache.zip"
        $sccacheDir = "$env:USERPROFILE\sccache"

        Invoke-WebRequest -Uri $sccacheUrl -OutFile $sccacheZip
        Expand-Archive -Path $sccacheZip -DestinationPath $sccacheDir -Force
        $sccacheExtractedDir = Join-Path $sccacheDir "sccache-$sccacheVersion-x86_64-pc-windows-msvc"
        $sccacheExePath = Join-Path $sccacheExtractedDir "sccache.exe"
        if (-not (Test-Path $sccacheExePath)) {
          Write-Error "sccache.exe not found at expected path: $sccacheExePath"
          exit 1
        }
        $sccacheBinDir = Split-Path $sccacheExePath -Parent
        echo "$sccacheBinDir" >> $env:GITHUB_PATH

        # Configure sccache
        $configDir = "$env:APPDATA\Mozilla\sccache"
        New-Item -ItemType Directory -Force -Path $configDir | Out-Null
        $config = @"
        [cache.s3]
        bucket = "sccache"
        endpoint = "${{ inputs.minio_endpoint }}"
        use_ssl = false
        server_side_encryption = false
        no_credentials = false
        region = "us-east-1"
        "@
        $config | Out-File -FilePath "$configDir\config" -Encoding utf8
