name: RustFS credentials
description: >-
  Exchanges the job's GitHub Actions OIDC token for short-lived RustFS credentials (STS
  AssumeRoleWithWebIdentity), with .github/scripts/rustfs_credentials.sh. The job needs
  `permissions: id-token: write`, and RustFS must have a policy for the repository. Pull
  requests from forks get no OIDC token, so this step fails there.

inputs:
  endpoint:
    description: RustFS S3 endpoint.
    required: true
  audience:
    description: >-
      OIDC token audience RustFS trusts. Empty uses the one rustfs_credentials.sh names, which
      cached_fetch.sh uses as well.
    required: false
    default: ''
  duration-seconds:
    description: Credential lifetime in seconds, from 900 to 43200. It must cover the job's last RustFS request.
    required: false
    default: '3600'
  session-policy:
    description: >-
      The name of a session policy in .github/store-policies/ (`benchmark-data-read-only` for
      `benchmark-data-read-only.json`), for credentials handed to code this job does not
      control: they may do only what both it and the store's policy allow. It is read from this
      action's own copy of the repository, never the job's checkout. Empty for the store's policy
      alone.
    required: false
    default: ''
  export-env:
    description: >-
      'true' exports AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY and AWS_SESSION_TOKEN to the steps
      that follow. Use 'false' in a job that also uses other AWS credentials, and pass the outputs
      where they are needed.
    required: false
    default: 'true'

outputs:
  access-key-id:
    description: Access key ID (masked).
    value: ${{ steps.sts.outputs.access-key-id }}
  secret-access-key:
    description: Secret access key (masked).
    value: ${{ steps.sts.outputs.secret-access-key }}
  session-token:
    description: Session token (masked).
    value: ${{ steps.sts.outputs.session-token }}

runs:
  using: composite
  steps:
    - name: Exchange the OIDC token for RustFS credentials
      id: sts
      shell: bash
      env:
        ENDPOINT: ${{ inputs.endpoint }}
        AUDIENCE: ${{ inputs.audience }}
        DURATION_SECONDS: ${{ inputs.duration-seconds }}
        SESSION_POLICY: ${{ inputs.session-policy }}
        EXPORT_ENV: ${{ inputs.export-env }}
      run: |
        set -euo pipefail
        policy_file=''
        if [[ -n "$SESSION_POLICY" ]]; then
          if ! [[ "$SESSION_POLICY" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::session-policy '$SESSION_POLICY' is not the name of a policy in .github/store-policies/."
            exit 1
          fi
          policy_file="$GITHUB_ACTION_PATH/../../store-policies/$SESSION_POLICY.json"
          if [[ ! -f "$policy_file" ]]; then
            echo "::error::.github/store-policies/$SESSION_POLICY.json does not exist."
            exit 1
          fi
        fi
        err="$(mktemp)"
        trap 'rm -f "$err"' EXIT
        status=0
        credentials="$(bash "$GITHUB_ACTION_PATH/../../scripts/rustfs_credentials.sh" \
          "$ENDPOINT" "$DURATION_SECONDS" "$AUDIENCE" ${policy_file:+"$policy_file"} 2>"$err")" || status=$?
        if [[ "$status" -ne 0 ]]; then
          reason="$(head -n 1 "$err")"
          echo "::error::${reason:-rustfs_credentials.sh failed with exit ${status}.}"
          exit 1
        fi
        # The script validated each value. The expiration can be empty, and `$( )` drops
        # the empty line it leaves, so its `read` may find no line at all.
        {
          read -r access_key
          read -r secret_key
          read -r session_token
          read -r expiration || expiration=''
        } <<<"$credentials"
        echo "::add-mask::${access_key}"
        echo "::add-mask::${secret_key}"
        echo "::add-mask::${session_token}"
        {
          echo "access-key-id=${access_key}"
          echo "secret-access-key=${secret_key}"
          echo "session-token=${session_token}"
        } >>"${GITHUB_OUTPUT}"
        if [[ "${EXPORT_ENV}" == 'true' ]]; then
          {
            echo "AWS_ACCESS_KEY_ID=${access_key}"
            echo "AWS_SECRET_ACCESS_KEY=${secret_key}"
            echo "AWS_SESSION_TOKEN=${session_token}"
          } >>"${GITHUB_ENV}"
        fi
        echo "RustFS credentials expire at ${expiration}."
