name: 'Check Code Changes'
description: 'Detects if there are relevant code changes that require running tests'

outputs:
  relevant_changes:
    description: 'Whether there are relevant code changes'
    value: ${{ steps.check_changes.outputs.relevant_changes }}
  integration_tests_changed:
    description: 'Whether integration test files changed'
    value: ${{ steps.check_integration.outputs.integration_tests }}
  integration_test_filter:
    description: 'Nextest filter expression for changed test modules (empty = run all)'
    value: ${{ steps.changed_modules.outputs.filter }}

runs:
  using: 'composite'
  steps:
    - name: Detect all code changes
      id: changed-code-files
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      with:
        filters: |
          code_changes:
            - '.github/**'
            - 'crates/**'
            - 'bin/**'
            - 'test/**'
            - 'tools/**'
            - 'install/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'go.mod'
            - 'go.sum'
            - 'Makefile'

    - name: Check for relevant changes
      id: check_changes
      shell: bash
      run: |
        echo "relevant_changes=${{ steps.changed-code-files.outputs.code_changes }}" >> $GITHUB_OUTPUT

    - name: Check for integration test changes
      id: check_integration
      uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
      with:
        list-files: shell
        filters: |
          integration_tests:
            - 'crates/runtime/tests/**'

    - name: Detect changed test modules
      id: changed_modules
      if: steps.check_integration.outputs.integration_tests == 'true'
      shell: bash
      run: |
        # Only filter for pull_request events where we can reliably diff
        if [ "${{ github.event_name }}" != "pull_request" ]; then
          echo "filter=" >> $GITHUB_OUTPUT
          echo "Non-PR event, will run all integration tests"
          exit 0
        fi

        # Use the file list from dorny/paths-filter (covers the full PR diff)
        CHANGED_FILES="${{ steps.check_integration.outputs.integration_tests_files }}"

        if [ -z "$CHANGED_FILES" ]; then
          echo "filter=" >> $GITHUB_OUTPUT
          echo "No test files changed"
          exit 0
        fi

        RUN_ALL=false
        MODULES=""

        for file in $CHANGED_FILES; do
          [ -z "$file" ] && continue
          rel="${file#crates/runtime/tests/}"
          mod="${rel%%/*}"
          mod="${mod%.rs}"
          # Shared infrastructure changes require running all tests
          case "$mod" in
            integration|utils|test_data|docker)
              RUN_ALL=true
              break
              ;;
          esac
          MODULES="$MODULES $mod"
        done

        if [ "$RUN_ALL" = "true" ]; then
          echo "filter=" >> $GITHUB_OUTPUT
          echo "Shared test infrastructure changed, will run all integration tests"
          exit 0
        fi

        UNIQUE=$(echo "$MODULES" | tr ' ' '\n' | sort -u | tr '\n' ' ')
        FILTER=""
        for mod in $UNIQUE; do
          [ -z "$mod" ] && continue
          if [ -n "$FILTER" ]; then
            FILTER="$FILTER | test(~${mod}::)"
          else
            FILTER="test(~${mod}::)"
          fi
        done

        echo "filter=$FILTER" >> $GITHUB_OUTPUT
        echo "Will run tests matching: $FILTER"
