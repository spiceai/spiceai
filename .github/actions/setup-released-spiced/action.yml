name: Setup released spiced
description: 'Installs the spiced a release published, once its archive is verified'

# The archive must match the digest .github/release-digests.json records for the release, a file
# only a reviewed trunk change edits. A release that also publishes SHA256SUMS is checked against
# it too, with SHA256SUMS and the archive each carrying a build attestation from build_release.yml
# on a release branch, for the commit the tag names. Off trunk, outside a job with the full CI
# roles, a release that is not recorded may run on SHA256SUMS and the attestations alone. Release binaries are built without ODBC and without the
# PostgreSQL accelerator, so a spicepod that needs either is refused rather than run without it.
inputs:
  release:
    description: 'Release tag, e.g. v2.1.0'
    required: true
  spicepod_file:
    description: 'Spicepod the binary will run'
    required: true
  with_odbc:
    description: 'Whether the spicepod needs an ODBC-enabled spiced'
    required: false
    default: 'false'
  github_token:
    description: 'Token that can read the release and its attestations'
    required: true
outputs:
  SPICED_COMMIT:
    description: 'Commit the release tag points to'
    value: ${{ steps.find.outputs.SPICED_COMMIT }}
runs:
  using: 'composite'
  steps:
    - name: Download the released spiced
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RELEASE: ${{ inputs.release }}
        SPICEPOD_FILE: ${{ inputs.spicepod_file }}
        WITH_ODBC: ${{ inputs.with_odbc }}
        DIGESTS: ${{ github.action_path }}/../../release-digests.json
      run: |
        set -euo pipefail
        if ! [[ "${RELEASE}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.?[0-9]+)?$ ]]; then
          echo "::error::'${RELEASE}' is not a release tag such as v2.1.0"
          exit 1
        fi
        if [ "${WITH_ODBC}" = "true" ]; then
          echo "::error::Release binaries are built without ODBC; benchmark ${RELEASE} with ODBC from a commit or branch build instead"
          exit 1
        fi
        if grep -Eq '^[[:space:]]*engine:[[:space:]]*postgres[[:space:]]*$' "${SPICEPOD_FILE}"; then
          echo "::error::Release binaries are built without the PostgreSQL accelerator; benchmark ${RELEASE} with it from a commit or branch build instead"
          exit 1
        fi
        api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
        auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
        asset="spiced_linux_x86_64.tar.gz"
        dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/released-spiced.XXXXXX")"
        curl -fsSL "${auth[@]}" "${api}/releases/tags/${RELEASE}" > "${dir}/release.json"
        ids="$(python3 -c 'import json,sys; a = {x["name"]: x["id"] for x in json.load(open(sys.argv[1]))["assets"]}; print(a.get(sys.argv[2], "-"), a.get("SHA256SUMS", "-"))' "${dir}/release.json" "${asset}")"
        read -r asset_id sums_id <<< "${ids}"
        if [ "${asset_id}" = "-" ]; then
          echo "::error::${RELEASE} has no ${asset}"
          exit 1
        fi
        get() {
          curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
            -o "$2" "${api}/releases/assets/$1"
        }
        pinned="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["releases"].get(sys.argv[2], {}).get(sys.argv[3], ""))' "${DIGESTS}" "${RELEASE}" "${asset}")"
        if [ -n "${pinned}" ] && ! [[ "${pinned}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::.github/release-digests.json records '${pinned}' for ${RELEASE} ${asset}, which is not a SHA-256 digest"
          exit 1
        fi
        if [ -z "${pinned}" ] && { [ "${GITHUB_REF:-}" = refs/heads/trunk ] || [ "${CI_ROLE_FULL:-}" = true ]; }; then
          echo "::error::${RELEASE} is not recorded in .github/release-digests.json, and a run on trunk or with the full CI roles runs only a recorded release; record it with a trunk change"
          exit 1
        fi
        get "${asset_id}" "${dir}/${asset}"
        attested=false
        expected="${pinned}"
        source=".github/release-digests.json"
        if [ "${sums_id}" != "-" ]; then
          get "${sums_id}" "${dir}/SHA256SUMS"
          listed="$(awk -v f="${asset}" '$2 == f || $2 == "*" f { print $1 }' "${dir}/SHA256SUMS")"
          if ! [[ "${listed}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The SHA256SUMS of ${RELEASE} does not list ${asset}, so its spiced cannot be verified; not running it"
            exit 1
          fi
          if [ -n "${pinned}" ] && [ "${listed}" != "${pinned}" ]; then
            echo "::error::${RELEASE} ${asset} is recorded as ${pinned} in .github/release-digests.json, but its SHA256SUMS lists ${listed}; not running it"
            exit 1
          fi
          attested=true
          if [ -z "${pinned}" ]; then
            expected="${listed}"
            source="the SHA256SUMS of ${RELEASE}"
          else
            source=".github/release-digests.json and the SHA256SUMS of ${RELEASE}"
          fi
        fi
        if ! [[ "${expected}" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::${RELEASE} is not recorded in .github/release-digests.json and publishes no SHA256SUMS, so its spiced cannot be verified; not running it"
          exit 1
        fi
        actual="$(sha256sum "${dir}/${asset}" | cut -d ' ' -f 1)"
        if [ "${actual}" != "${expected}" ]; then
          echo "::error::${asset} of ${RELEASE} has SHA-256 ${actual}, not ${expected} from ${source}; not running it"
          exit 1
        fi
        echo "${asset} of ${RELEASE} matches ${source}."
        # By its full name: a branch can share a tag's name.
        commit="$(curl -fsSL "${auth[@]}" "${api}/commits/refs/tags/${RELEASE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
        if ! [[ "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::Could not read the commit ${RELEASE} names"
          exit 1
        fi
        {
          echo "archive=${dir}/${asset}"
          echo "sums=${dir}/SHA256SUMS"
          echo "attested=${attested}"
          echo "SPICED_COMMIT=${commit}"
        } >> "${GITHUB_OUTPUT}"

    - name: Verify SHA256SUMS's build attestation
      if: steps.find.outputs.attested == 'true'
      uses: $/.github/actions/verify-attestation
      with:
        file: ${{ steps.find.outputs.sums }}
        release: 'true'
        source-commit: ${{ steps.find.outputs.SPICED_COMMIT }}
        token: ${{ inputs.github_token }}

    - name: Verify the archive's build attestation
      if: steps.find.outputs.attested == 'true'
      uses: $/.github/actions/verify-attestation
      with:
        file: ${{ steps.find.outputs.archive }}
        release: 'true'
        source-commit: ${{ steps.find.outputs.SPICED_COMMIT }}
        token: ${{ inputs.github_token }}

    - name: Install the released spiced
      shell: bash
      env:
        ARCHIVE: ${{ steps.find.outputs.archive }}
        SPICED_COMMIT: ${{ steps.find.outputs.SPICED_COMMIT }}
      run: |
        set -euo pipefail
        dir="$(dirname "${ARCHIVE}")"
        tar -xzf "${ARCHIVE}" -C "${dir}" spiced
        if [ ! -f "${dir}/spiced" ] || [ -L "${dir}/spiced" ]; then
          echo "::error::${ARCHIVE} holds no spiced"
          exit 1
        fi
        sudo cp "${dir}/spiced" /usr/local/bin/spiced
        spiced --version
        echo "SPICED_COMMIT=${SPICED_COMMIT}"
