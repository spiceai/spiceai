name: Setup released spiced
description: 'Installs the spiced a release published, verified against its SHA-256 digest'

# GitHub publishes asset digests only from v1.3.2 on; an earlier release has none to verify
# against and is refused. Release binaries are built without ODBC and without the PostgreSQL
# accelerator, so a spicepod that needs either is refused rather than run without it.
inputs:
  release:
    description: 'Release tag, e.g. v2.1.0'
    required: true
  spicepod_file:
    description: 'Spicepod the binary will run'
    required: true
  with_odbc:
    description: 'Whether the spicepod needs an ODBC-enabled spiced'
    required: false
    default: 'false'
  github_token:
    description: 'Token that can read the release'
    required: true
outputs:
  SPICED_COMMIT:
    description: 'Commit the release tag points to'
    value: ${{ steps.install.outputs.SPICED_COMMIT }}
runs:
  using: 'composite'
  steps:
    - name: Install the released spiced
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RELEASE: ${{ inputs.release }}
        SPICEPOD_FILE: ${{ inputs.spicepod_file }}
        WITH_ODBC: ${{ inputs.with_odbc }}
      run: |
        set -euo pipefail
        if [ "${WITH_ODBC}" = "true" ]; then
          echo "::error::Release binaries are built without ODBC; benchmark ${RELEASE} with ODBC from a commit or branch build instead"
          exit 1
        fi
        if grep -Eq '^[[:space:]]*engine:[[:space:]]*postgres[[:space:]]*$' "${SPICEPOD_FILE}"; then
          echo "::error::Release binaries are built without the PostgreSQL accelerator; benchmark ${RELEASE} with it from a commit or branch build instead"
          exit 1
        fi
        api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
        auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
        asset="spiced_linux_x86_64.tar.gz"
        release_asset="$(curl -fsSL "${auth[@]}" "${api}/releases/tags/${RELEASE}" \
          | python3 -c 'import json,sys; a = next((a for a in json.load(sys.stdin)["assets"] if a["name"] == sys.argv[1]), {}); print(a.get("id") or "-", a.get("digest") or "-")' "${asset}")"
        read -r asset_id digest <<< "${release_asset}"
        if [ "${asset_id}" = "-" ]; then
          echo "::error::${RELEASE} has no ${asset}"
          exit 1
        fi
        case "${digest}" in
          sha256:*) ;;
          *) echo "::error::${RELEASE} has no published SHA-256 digest for ${asset}, so its binary cannot be verified; benchmark it from a commit or branch build instead"; exit 1 ;;
        esac
        curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
          -o "${asset}" "${api}/releases/assets/${asset_id}"
        echo "${digest#sha256:}  ${asset}" | sha256sum --check
        tar -xzf "${asset}" spiced
        sudo cp ./spiced /usr/local/bin/spiced
        spiced --version
        commit="$(curl -fsSL "${auth[@]}" "${api}/commits/${RELEASE}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
        echo "SPICED_COMMIT=${commit}"
        echo "SPICED_COMMIT=${commit}" >> "${GITHUB_OUTPUT}"
