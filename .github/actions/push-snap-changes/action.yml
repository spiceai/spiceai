name: 'Add snapshots to PR'
description: 'Commits and pushes updated snapshots to an automation PR.'
inputs:
  token:
    description: 'GitHub token with permissions to push to the repository'
    required: true
  title:
    description: 'Title for the PR created in this action'
    required: false
    default: 'fix: Update test snapshots'
  description:
    description: 'Body description for the PR created in this action'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install GH CLI if not installed
      shell: bash
      run: |
        if ! command -v gh &> /dev/null; then
          (type -p wget >/dev/null || (sudo apt update && sudo apt install wget -y)) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && out=$(mktemp) && wget -nv -O"$out" https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            && cat "$out" | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && sudo mkdir -p -m 755 /etc/apt/sources.list.d \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
        else
          echo "GH CLI is already installed"
        fi
    - name: Upload snapshots to branch
      shell: bash
      run: |
        set -euo pipefail

        git add '*.snap'
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Every run gets its own branch off the commit it just tested (never an old
        # branch's history) so there is never a divergent base to rebase or merge onto.
        BRANCH_NAME="snapshot-update/${GITHUB_JOB:-job}-${GITHUB_RUN_ID}"

        # Target the ref the workflow ran on: trunk for the scheduled daily run,
        # the dispatched branch for a manual workflow_dispatch. This keeps the PR
        # diff limited to the snapshot changes (the branch already holds any other
        # commits) instead of always diffing against trunk.
        BASE_BRANCH="${GITHUB_REF_NAME:-trunk}"

        git config --global user.name 'Spice Snapshot Update Bot'
        git config --global user.email 'spiceaibot@spice.ai'
        AUTHENTICATED_REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git remote set-url origin "${AUTHENTICATED_REMOTE_URL}"
        git checkout -b "${BRANCH_NAME}"
        git commit -m "${PR_TITLE}"
        # Disable any credential helper configured on the (self-hosted) runner so
        # git authenticates with the URL-embedded token only. Otherwise a helper
        # (osxkeychain / git-credential-manager) can intercept the push and block on
        # an interactive credential prompt, hanging the job until the 360-minute
        # limit and discarding the test result this step was reporting on.
        git -c credential.helper='' -c credential.interactive=false \
          push origin "HEAD:${BRANCH_NAME}"

        BODY="${PR_DESCRIPTION}"
        if [[ -z "${BODY}" ]]; then
          BODY="$(printf 'Automated snapshot update from workflow run [#%s](%s/%s/actions/runs/%s).\n\n<!-- spice-snapshot-update -->' "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
        fi
        PR_URL="$(gh pr create --title "${PR_TITLE}" --body "${BODY}" --base "${BASE_BRANCH}" --head "${BRANCH_NAME}" --label kind/bug)"
        echo "Created snapshot update PR -> ${PR_URL}"
        gh pr merge --squash --auto "${BRANCH_NAME}" || echo "Auto-merge not available for this branch; PR created and requires manual merge."

        # Close any earlier open snapshot-update PR against the same base with the
        # same title: it carries a snapshot diff against a now-outdated base and is
        # superseded by the one above. Scope to this base so a manual branch run does
        # not close the scheduled trunk PRs (or vice versa).
        EXISTING_PR_JSON="$(mktemp)"
        gh pr list --state open --base "${BASE_BRANCH}" --limit 100 --json number,title,headRefName,author,body,url > "${EXISTING_PR_JSON}"
        jq -r --arg title "${PR_TITLE}" --arg url "${PR_URL}" '
          [.[]
            | select(.title == $title)
            | select(.url != $url)
            | select(
                .author.login == "github-actions[bot]"
                or .author.login == "spiceaibot"
                or ((.body // "") | contains("Automated snapshot update from workflow run"))
                or ((.body // "") | contains("<!-- spice-snapshot-update -->"))
              )]
          | .[]
          | "\(.number)\t\(.headRefName)"
        ' "${EXISTING_PR_JSON}" | while IFS=$'\t' read -r OLD_PR_NUMBER OLD_BRANCH; do
          echo "Closing superseded snapshot update PR #${OLD_PR_NUMBER}"
          gh pr close "${OLD_PR_NUMBER}" --comment "Superseded by ${PR_URL} (fresher snapshot diff against current ${BASE_BRANCH})." || true
          # `|| true` bounds the exit status, not the wall clock: the same credential
          # helper can block this push too, so it needs the same guard.
          git -c credential.helper='' -c credential.interactive=false \
            push origin --delete "${OLD_BRANCH}" || true
        done
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.title }}
        # Never fall back to an interactive prompt; fail fast if auth is rejected.
        GIT_TERMINAL_PROMPT: '0'
        GCM_INTERACTIVE: 'never'
        PR_DESCRIPTION: ${{ inputs.description }}
