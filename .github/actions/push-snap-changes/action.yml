name: 'Add snapshots to PR'
description: 'Commits and pushes updated snapshots to an automation PR.'
inputs:
  token:
    description: 'GitHub token with permissions to push to the repository'
    required: true
  title:
    description: 'Title for the PR created in this action'
    required: false
    default: 'fix: Update test snapshots'
  description:
    description: 'Body description for the PR created in this action'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install GH CLI if not installed
      uses: $/.github/actions/install-gh-cli

    - name: Upload snapshots to branch
      shell: bash
      run: |
        set -euo pipefail
        # git's own config file for this step, never the shared ~/.gitconfig or the system
        # one: on a self-hosted Mac any job can write those, and a `url.<x>.insteadOf` there
        # would send this push, token and all, elsewhere.
        GIT_CONFIG_GLOBAL="$(mktemp "${RUNNER_TEMP:?RUNNER_TEMP is not set}/gitconfig.XXXXXX")"
        export GIT_CONFIG_GLOBAL GIT_CONFIG_NOSYSTEM=1
        # The checkout's own config can redirect the push too, pull in another file, or run a
        # program, and its hooks run in this step: anything that set them is not this action. So
        # such config is refused, and no hook runs (core.hooksPath given through the environment
        # overrides the repository's). Every file git reads for this checkout is checked, not just
        # .git/config: with extensions.worktreeConfig it also reads config.worktree, and it
        # follows includes.
        if redirects="$(git config --name-only --get-regexp '^(url\..*|include\..*|includeif\..*|core\.(hookspath|fsmonitor|sshcommand|askpass|gitproxy|pager|editor|attributesfile|worktree|excludesfile)|trace2\..*|filter\..*|diff\.external|diff\..*\.(textconv|command)|gpg\..*|commit\.gpgsign|tag\.gpgsign|credential\..*|http\..*|remote\..*\.(pushurl|proxy|receivepack|uploadpack|vcs)|protocol\..*)$')"; then
          echo "::error::The checkout's git config sets ${redirects//$'\n'/, }, which can send this push elsewhere or run other code; not pushing."
          exit 1
        fi
        export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null

        git add '*.snap'
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi

        # Every run gets its own branch off the commit it just tested (never an old
        # branch's history) so there is never a divergent base to rebase or merge onto.
        BRANCH_PREFIX="snapshot-update/${GITHUB_JOB:-job}-"
        BRANCH_NAME="${BRANCH_PREFIX}${GITHUB_RUN_ID}"

        # Target the ref the workflow ran on: trunk for the scheduled daily run,
        # the dispatched branch for a manual workflow_dispatch. This keeps the PR
        # diff limited to the snapshot changes (the branch already holds any other
        # commits) instead of always diffing against trunk.
        BASE_BRANCH="${GITHUB_REF_NAME:-trunk}"

        git config --global user.name 'Spice Snapshot Update Bot'
        git config --global user.email 'spiceaibot@spice.ai'
        AUTHENTICATED_REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git remote set-url origin "${AUTHENTICATED_REMOTE_URL}"
        git checkout -b "${BRANCH_NAME}"
        git commit -m "${PR_TITLE}"
        # Non-interactive: a credential helper on the runner can otherwise intercept
        # this push and block on a prompt forever. See
        # scripts/check_ci_git_push_noninteractive.py.
        git -c credential.helper='' -c credential.interactive=false \
          push origin "HEAD:${BRANCH_NAME}"

        BODY="${PR_DESCRIPTION}"
        if [[ -z "${BODY}" ]]; then
          BODY="$(printf 'Automated snapshot update from workflow run [#%s](%s/%s/actions/runs/%s).\n\n<!-- spice-snapshot-update -->' "${GITHUB_RUN_ID}" "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
        fi
        # enforce-pull-with-spice, a required check, fails a PR without both a kind/ and an
        # area/ label.
        PR_URL="$(gh pr create --title "${PR_TITLE}" --body "${BODY}" --base "${BASE_BRANCH}" --head "${BRANCH_NAME}" --label kind/bug --label area/tests)"
        echo "Created snapshot update PR -> ${PR_URL}"
        gh pr merge --squash --auto "${BRANCH_NAME}" || echo "Auto-merge not available for this branch; PR created and requires manual merge."
        # Release the pull_request runs GitHub holds on a GITHUB_TOKEN push (see the script).
        bash .github/scripts/approve_bot_pr_runs.sh "${BRANCH_NAME}" "$(git rev-parse HEAD)"

        # Close any earlier open snapshot-update PR this job opened against the same
        # base with the same title: the one above supersedes it. Matching the base keeps
        # a manual branch run from closing the scheduled trunk PRs (or vice versa), and
        # matching this job's branches keeps jobs that share the default title
        # (integration_models.yml) from closing each other's PRs, which hold other files.
        EXISTING_PR_JSON="$(mktemp)"
        gh pr list --state open --base "${BASE_BRANCH}" --limit 100 --json number,title,headRefName,author,body,url > "${EXISTING_PR_JSON}"
        jq -r --arg title "${PR_TITLE}" --arg url "${PR_URL}" --arg prefix "${BRANCH_PREFIX}" '
          [.[]
            | select(.title == $title)
            | select(.url != $url)
            # Run IDs are all digits, so job "test" does not claim "test-models" branches.
            | select(.headRefName | startswith($prefix) and (ltrimstr($prefix) | test("^[0-9]+$")))
            | select(
                .author.login == "github-actions[bot]"
                or .author.login == "spiceaibot"
                or ((.body // "") | contains("Automated snapshot update from workflow run"))
                or ((.body // "") | contains("<!-- spice-snapshot-update -->"))
              )]
          | .[]
          | "\(.number)\t\(.headRefName)"
        ' "${EXISTING_PR_JSON}" | while IFS=$'\t' read -r OLD_PR_NUMBER OLD_BRANCH; do
          echo "Closing superseded snapshot update PR #${OLD_PR_NUMBER}"
          gh pr close "${OLD_PR_NUMBER}" --comment "Superseded by ${PR_URL} (fresher snapshot diff against current ${BASE_BRANCH})." || true
          # `|| true` bounds the exit status, not the wall clock: the same credential
          # helper can block this push too, so it needs the same guard.
          git -c credential.helper='' -c credential.interactive=false \
            push origin --delete "${OLD_BRANCH}" || true
        done
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_TITLE: ${{ inputs.title }}
        PR_DESCRIPTION: ${{ inputs.description }}
        # Never fall back to an interactive prompt; fail fast if auth is rejected.
        GIT_TERMINAL_PROMPT: '0'
        GCM_INTERACTIVE: 'never'
