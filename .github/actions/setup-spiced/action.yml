name: Setup spiced
description: 'composite action'

# Downloads the most recent spiced build from MinIO, within the last 10 commits. A build lives
# where the ref that built it stores it (.github/actions/ci-store-prefix): trunk's builds at the
# shared keys, another ref's, this release branch's included, under
# `artifacts/untrusted/<repository id>/<ref>/`. So the place to read is the build's ref, never the
# reader's: trunk's builds, and a `spiced_commit` on trunk, are read at trunk's keys from any ref.
# Another ref's build runs only in a run of that same ref, whose store credentials write only that
# ref's keys.
#
# Requires the MinIO CLI to be installed and configured to use this action
inputs:
  spiced_commit: # optionally override the commit to download
    description: 'spiced build commit'
    required: false
  ref: # optionally override the branch to fetch latest 10 commits from
    description: 'target ref: trunk, or the ref this run is on'
    required: false
    default: 'refs/heads/trunk'
  with_odbc: # whether to download the ODBC-enabled binary
    description: 'download the ODBC-enabled spiced binary'
    required: false
  token:
    description: A token that can read this repository, to check whether `spiced_commit` is on trunk.
    required: false
    default: ${{ github.token }}
outputs:
  spiced_commit:
    value: ${{ steps.output_spiced_commit.outputs.SPICED_COMMIT || steps.output_spiced_commit_windows.outputs.SPICED_COMMIT }}
runs:
  using: 'composite'
  steps:
    - name: Determine platform (Linux/macOS)
      id: platform
      if: runner.os != 'Windows'
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          echo "os=linux" >> $GITHUB_OUTPUT
          echo "arch=x86_64" >> $GITHUB_OUTPUT
          echo "ext=tar.gz" >> $GITHUB_OUTPUT
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "os=darwin" >> $GITHUB_OUTPUT
          echo "ext=tar.gz" >> $GITHUB_OUTPUT
          if [[ "$(uname -m)" == "arm64" ]]; then
            echo "arch=aarch64" >> $GITHUB_OUTPUT
          else
            echo "arch=x86_64" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Determine platform (Windows)
      id: platform-windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        echo "os=windows" >> $env:GITHUB_OUTPUT
        echo "arch=x86_64" >> $env:GITHUB_OUTPUT
        echo "ext=zip" >> $env:GITHUB_OUTPUT

    # Which ref built the spiced to read, and so where it is stored: trunk for the latest build of
    # trunk and for a `spiced_commit` on trunk; otherwise `ref`, or this run's own ref when `ref`
    # is trunk. That ref must be trunk or this run's own: a ref's build runs only in a run of that
    # ref, whose credentials write only that ref's keys. Outputs `ref` and `prefix` (empty for
    # trunk).
    - name: Locate spiced's build
      id: locate
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        INPUT_SPICED_COMMIT: ${{ inputs.spiced_commit }}
        GH_TOKEN: ${{ inputs.token }}
        # From the event itself, not the environment an earlier step can add to.
        RUN_EVENT: ${{ github.event_name }}
        PULL_REQUEST_BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
      run: |
        set -euo pipefail
        # Trunk's commit history (no trees or blobs), fetched into a scratch repository and never
        # run. The token goes to git through GIT_CONFIG_*.
        on_trunk() {
          local git_dir server auth fetched=""
          git_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/setup-spiced.XXXXXX")"
          git init -q --bare "$git_dir"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          for attempt in 1 2 3; do
            if GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$server/.extraheader" \
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
              git --git-dir "$git_dir" fetch -q --no-tags --filter=tree:0 "$server/$GITHUB_REPOSITORY.git" \
                '+refs/heads/trunk:refs/remotes/origin/trunk'; then
              fetched=1
              break
            fi
            [ "$attempt" = 3 ] || sleep 5
          done
          if [ -z "$fetched" ]; then
            echo "::error::Could not fetch trunk to tell whether spiced_commit $1 is trunk's build. Re-run the job."
            exit 1
          fi
          # GIT_NO_LAZY_FETCH keeps a commit trunk lacks missing, so: not on trunk.
          GIT_NO_LAZY_FETCH=1 git --git-dir "$git_dir" merge-base --is-ancestor "$1" refs/remotes/origin/trunk 2>/dev/null
        }
        # Builds are stored under the full commit hash that built them. The commit is also part of
        # a store key and of a later step's script, so anything else is refused before either.
        if [ -n "$INPUT_SPICED_COMMIT" ] && ! [[ "$INPUT_SPICED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::setup-spiced: spiced_commit must be a full 40-character commit hash."
          exit 1
        fi
        # A bare branch name is that branch (`trunk`, `release/2.4`). A ref becomes part of a store
        # key and of this step's outputs, so anything but a plain ref is refused.
        plain_ref() {
          [[ "$1" =~ ^refs/[A-Za-z0-9._/-]+$ ]] && [[ "$1" != *..* && "$1" != *//* && "$1" != */ ]]
        }
        case "$REF" in
          refs/*) ;;
          *) REF="refs/heads/$REF" ;;
        esac
        if ! plain_ref "$REF"; then
          echo "::error::setup-spiced: ref '$REF' is not a plain ref."
          exit 1
        fi
        if [ -z "$INPUT_SPICED_COMMIT" ]; then
          source_ref="$REF"
        elif on_trunk "$INPUT_SPICED_COMMIT"; then
          source_ref=refs/heads/trunk
        elif [ "$REF" != refs/heads/trunk ]; then
          source_ref="$REF"
        elif [ "$GITHUB_REF" != refs/heads/trunk ]; then
          source_ref="$GITHUB_REF"
        else
          # Trunk's keys hold no build of a commit trunk lacks.
          echo "::error::This run, on refs/heads/trunk, runs only a spiced that trunk or this run's own ref built, and $INPUT_SPICED_COMMIT is not on trunk. Run the workflow on the ref that built it."
          exit 1
        fi
        if ! plain_ref "$source_ref"; then
          echo "::error::setup-spiced: '$source_ref' is not a plain ref."
          exit 1
        fi
        # A pull request's run may also read its base branch's builds, as a pull request into trunk
        # reads trunk's: the run is unprivileged (its credentials write only its own prefix, and its
        # CI role is the read-only one), and the build is one the base branch's own runs made.
        pull_request_base() {
          [ "${RUN_EVENT:-}" = pull_request ] && [ -n "${PULL_REQUEST_BASE:-}" ] &&
            [ "$1" = "refs/heads/${PULL_REQUEST_BASE}" ]
        }
        if [ "$source_ref" != refs/heads/trunk ] && [ "$source_ref" != "$GITHUB_REF" ] && ! pull_request_base "$source_ref"; then
          echo "::error::This run, on $GITHUB_REF, runs only a spiced that trunk or this run's own ref built (or, for a pull request, its base branch), and $source_ref built this one. Run the workflow on that ref instead: its build runs only with that ref's own credentials."
          exit 1
        fi
        case "$source_ref" in
          refs/heads/trunk) prefix='' ;;
          *)
            if ! [[ "${GITHUB_REPOSITORY_ID:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::GITHUB_REPOSITORY_ID is '${GITHUB_REPOSITORY_ID:-}', not a repository id."
              exit 1
            fi
            prefix="untrusted/${GITHUB_REPOSITORY_ID}/${source_ref}/"
            ;;
        esac
        {
          echo "ref=$REF"
          echo "prefix=$prefix"
        } >> "$GITHUB_OUTPUT"
        echo "Reading the spiced that $source_ref built, at artifacts/${prefix}spiced/."

    - name: Find the latest built spiced commit (Linux/macOS)
      if: ${{ !inputs.spiced_commit && runner.os != 'Windows' }}
      shell: bash
      env:
        REF: ${{ steps.locate.outputs.ref }}
        SOURCE_PREFIX: ${{ steps.locate.outputs.prefix }}
      run: |
        git fetch --depth=10 origin -- "$REF"
        echo "Fetching latest 10 commits from $REF"

        commit_hashes=($(git log FETCH_HEAD --pretty=format:"%H" -n 10))

        if [[ "${{ inputs.with_odbc }}" == "true" ]]; then
          features="odbc_"
        else
          features=""
        fi

        PLATFORM="${{ steps.platform.outputs.os }}_${{ steps.platform.outputs.arch }}"
        EXT="${{ steps.platform.outputs.ext }}"

        for hash in "${commit_hashes[@]}"; do
          echo "Checking $hash in MinIO for $PLATFORM"
          if mc stat "spice-minio/artifacts/${SOURCE_PREFIX}spiced/${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}/$hash/spiced_${features}${PLATFORM}.${EXT}"; then
            echo "Found $hash in MinIO"
            echo "SPICED_COMMIT=$hash" >> $GITHUB_ENV
            exit 0
          fi
        done

        echo "::error::No spiced build of $REF's last 10 commits is stored for $PLATFORM, under artifacts/${SOURCE_PREFIX}spiced/. A run reads only builds of trunk, its own ref, or a pull request's base branch: run build_and_release.yml on $REF first, or run this workflow on a ref that has a build."
        exit 1

    - name: Find the latest built spiced commit (Windows)
      if: ${{ !inputs.spiced_commit && runner.os == 'Windows' }}
      shell: pwsh
      env:
        REF: ${{ steps.locate.outputs.ref }}
        SOURCE_PREFIX: ${{ steps.locate.outputs.prefix }}
      run: |
        $ErrorActionPreference = 'Stop'
        git fetch --depth=10 origin -- "$env:REF"
        Write-Host "Fetching latest 10 commits from $env:REF"

        $commitHashes = git log FETCH_HEAD --pretty=format:"%H" -n 10 | ForEach-Object { $_.Trim() }

        if ("${{ inputs.with_odbc }}" -eq "true") {
          $features = "odbc_"
        } else {
          $features = ""
        }

        $platform = "${{ steps.platform-windows.outputs.os }}-${{ steps.platform-windows.outputs.arch }}"
        $ext = "${{ steps.platform-windows.outputs.ext }}"

        foreach ($hash in $commitHashes) {
          Write-Host "Checking $hash in MinIO for $platform"
          $statOutput = mc stat "spice-minio/artifacts/$($env:SOURCE_PREFIX)spiced/$platform/$hash/spiced_${features}${platform}.${ext}" 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Found $hash in MinIO"
            echo "SPICED_COMMIT=$hash" >> $env:GITHUB_ENV
            exit 0
          } else {
            Write-Host "mc stat failed for $hash on $platform: $statOutput"
          }
        }

        Write-Host "::error::No spiced build of $($env:REF)'s last 10 commits is stored for $platform, under artifacts/$($env:SOURCE_PREFIX)spiced/. A run reads only builds of trunk, its own ref, or a pull request's base branch: run build_and_release.yml on $($env:REF) first, or run this workflow on a ref that has a build."
        exit 1

    - name: Set SPICED_COMMIT from workflow input (Linux/macOS)
      shell: bash
      if: ${{ inputs.spiced_commit && runner.os != 'Windows' }}
      run: |
        echo "SPICED_COMMIT=${{ inputs.spiced_commit }}" >> $GITHUB_ENV

    - name: Set SPICED_COMMIT from workflow input (Windows)
      shell: pwsh
      if: ${{ inputs.spiced_commit && runner.os == 'Windows' }}
      run: |
        $ErrorActionPreference = 'Stop'
        echo "SPICED_COMMIT=${{ inputs.spiced_commit }}" >> $env:GITHUB_ENV

    - name: Output SPICED_COMMIT (Linux/macOS)
      id: output_spiced_commit
      if: runner.os != 'Windows'
      shell: bash
      run: echo "SPICED_COMMIT=$SPICED_COMMIT" >> $GITHUB_OUTPUT

    - name: Output SPICED_COMMIT (Windows)
      id: output_spiced_commit_windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        echo "SPICED_COMMIT=$env:SPICED_COMMIT" >> $env:GITHUB_OUTPUT

    - name: Download spiced from MinIO (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        SOURCE_PREFIX: ${{ steps.locate.outputs.prefix }}
      run: |
        if [[ "${{ inputs.with_odbc }}" == "true" ]]; then
          features="odbc_"
        else
          features=""
        fi
        PLATFORM="${{ steps.platform.outputs.os }}_${{ steps.platform.outputs.arch }}"
        EXT="${{ steps.platform.outputs.ext }}"
        mc cp "spice-minio/artifacts/${SOURCE_PREFIX}spiced/${{ steps.platform.outputs.os }}-${{ steps.platform.outputs.arch }}/$SPICED_COMMIT/spiced_${features}${PLATFORM}.${EXT}" spiced_${features}${PLATFORM}.${EXT}
        tar -xzf spiced_${features}${PLATFORM}.${EXT}
        sudo cp ./spiced /usr/local/bin/spiced

    - name: Download spiced from MinIO (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SOURCE_PREFIX: ${{ steps.locate.outputs.prefix }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ("${{ inputs.with_odbc }}" -eq "true") {
          $features = "odbc_"
        } else {
          $features = ""
        }
        $platform = "${{ steps.platform-windows.outputs.os }}-${{ steps.platform-windows.outputs.arch }}"
        $ext = "${{ steps.platform-windows.outputs.ext }}"
        $artifact = "spiced_${features}${platform}.${ext}"
        mc cp "spice-minio/artifacts/$($env:SOURCE_PREFIX)spiced/$platform/$env:SPICED_COMMIT/$artifact" $artifact
        Expand-Archive -Path $artifact -DestinationPath . -Force
        $spicedDir = "$env:USERPROFILE\spiced"
        New-Item -ItemType Directory -Force -Path $spicedDir | Out-Null
        Copy-Item -Path .\spiced.exe -Destination "$spicedDir\spiced.exe"
        echo "$spicedDir" >> $env:GITHUB_PATH
