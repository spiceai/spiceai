name: Authenticate the Hugging Face cache
description: 'Puts a Hugging Face token where hf-hub reads it, for a job whose spiced downloads Hub models'

# The token is exported to the rest of the job as `HF_TOKEN`, which spiced's
# Hugging Face client reads before any token file (`crates/huggingface-hub`), for
# chat and embedding models alike. An environment variable is private to this
# job: a token file in the shared $HOME would be read by every overlapping job on
# the host and could be removed by one of them while another still relies on it.
# An unset secret exports nothing, rather than an empty token, which the Hub
# answers with 401 — worse than no token at all.
inputs:
  token:
    description: 'The Hugging Face token, normally secrets.SPICE_SECRET_HF_TOKEN; may be empty'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Export the token for hf-hub
      shell: bash
      env:
        SPICE_HF_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail

        # hf-hub caches artifacts under $HOME/.cache/huggingface/hub. $HOME persists
        # between jobs on the self-hosted runners while the _work tree does not, so
        # once a model is on disk, later runs need no Hub round-trip at all.
        mkdir -p "${HOME}/.cache/huggingface/hub"

        if [ -n "${SPICE_HF_TOKEN:-}" ]; then
          echo "::add-mask::${SPICE_HF_TOKEN}"
          echo "HF_TOKEN=${SPICE_HF_TOKEN}" >> "$GITHUB_ENV"
          echo "Exported the Hugging Face token to this job as HF_TOKEN."
        elif [ -s "${HOME}/.cache/huggingface/token" ]; then
          echo "Using the Hugging Face token already present on this runner."
        else
          echo "::warning::No Hugging Face token available. Downloads will be anonymous, and anonymous requests share a per-IP quota across this whole runner pool — exhausting it surfaces as HTTP 401 or 429 on model files."
        fi
