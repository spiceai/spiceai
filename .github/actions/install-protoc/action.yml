name: Install protoc
description: 'Install the protoc compiler from GitHub releases for consistent versions across platforms'

inputs:
  version:
    description: 'Version of protoc to install (e.g. "v29.3"). If empty, installs the latest release.'
    required: false
    default: ''
  token:
    description: 'GitHub token for release API requests (avoids unauthenticated api.github.com rate limits). Defaults to the workflow github.token.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Determine version and download protoc (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      run: |
        set -euo pipefail

        github_api_curl() {
          local url="$1"
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${url}"
          else
            curl -fsSL "${url}"
          fi
        }

        # Ensure jq is available
        if ! command -v jq &>/dev/null; then
          echo "jq not found, installing..."
          if [ "$(uname -s)" = "Darwin" ]; then
            brew install jq
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq jq
          fi
        fi

        # Fetch release metadata (authenticated to avoid shared-runner IP rate limits)
        if [ -z "${INPUT_VERSION}" ]; then
          RELEASE_JSON=$(github_api_curl "https://api.github.com/repos/protocolbuffers/protobuf/releases/latest")
        else
          QUERY_VERSION="${INPUT_VERSION}"
          if [[ ! "${QUERY_VERSION}" =~ ^v ]]; then
            QUERY_VERSION="v${QUERY_VERSION}"
          fi
          RELEASE_JSON=$(github_api_curl "https://api.github.com/repos/protocolbuffers/protobuf/releases/tags/${QUERY_VERSION}")
        fi

        VERSION=$(echo "${RELEASE_JSON}" | jq -r '.tag_name')
        if [ -z "${VERSION}" ] || [ "${VERSION}" = "null" ]; then
          echo "Failed to determine protoc version from release metadata" >&2
          exit 1
        fi

        # Ensure version starts with 'v'
        if [[ ! "${VERSION}" =~ ^v ]]; then
          VERSION="v${VERSION}"
        fi

        # Tag without leading 'v' is what `protoc --version` prints (libprotoc 28.0-rc1).
        # The zip filename uses a different RC spelling (28.0-rc-1). Keep them apart:
        # FILE_VERSION is for assets and the cache path only.
        REPORTED_VERSION="${VERSION#v}"
        FILE_VERSION="${REPORTED_VERSION}"

        # Handle rc releases (e.g. 28.0rc1 or 28.0-rc1 -> 28.0-rc-1)
        if [[ "${FILE_VERSION}" == *rc* ]]; then
          FILE_VERSION=$(echo "${FILE_VERSION}" | sed -E 's/-?rc([0-9]+)$/-rc-\1/')
        fi

        # Determine OS
        OS="$(uname -s)"
        case "${OS}" in
          Linux)  OS_NAME="linux" ;;
          Darwin) OS_NAME="osx" ;;
          *)      echo "Unsupported OS: ${OS}" && exit 1 ;;
        esac

        # Determine architecture
        ARCH="$(uname -m)"
        case "${ARCH}" in
          x86_64)  ARCH_SUFFIX="x86_64" ;;
          aarch64) ARCH_SUFFIX="aarch_64" ;;
          arm64)   ARCH_SUFFIX="aarch_64" ;;
          s390x)   ARCH_SUFFIX="s390_64" ;;
          ppc64le) ARCH_SUFFIX="ppcle_64" ;;
          *)
            echo "Unsupported architecture for protoc release asset selection: ${ARCH}" >&2
            exit 1
            ;;
        esac

        FILENAME="protoc-${FILE_VERSION}-${OS_NAME}-${ARCH_SUFFIX}.zip"
        DOWNLOAD_URL="https://github.com/protocolbuffers/protobuf/releases/download/${VERSION}/${FILENAME}"

        # Extract expected SHA256 from release metadata
        EXPECTED_SHA256=$(echo "${RELEASE_JSON}" | jq -r --arg name "${FILENAME}" '.assets[] | select(.name == $name) | .digest' | sed 's/^sha256://')
        if [ -z "${EXPECTED_SHA256}" ] || [ "${EXPECTED_SHA256}" = "null" ]; then
          echo "Failed to find SHA256 digest for asset '${FILENAME}' in release metadata" >&2
          exit 1
        fi

        # Install into the per-agent tool cache, never into a shared $HOME path.
        # Two self-hosted agents on one Mac both run as `runner`, so they share
        # /Users/runner/.local/bin/protoc. Concurrent `unzip -o` onto that file is
        # what Info-ZIP reports as "write error (disk full?)" + fchmod EBADF and a
        # truncated binary, even when the volume has hundreds of GiB free
        # (https://github.com/spiceai/spiceai/actions/runs/34808408443/job/103865050346
        # overlapped Build (release) on spiceai-macos-mbp-runner-03-02 writing the
        # same path).
        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          INSTALL_DIR="${RUNNER_TOOL_CACHE}/protoc/${FILE_VERSION}/${ARCH_SUFFIX}"
        else
          INSTALL_DIR="${HOME}/.local/protoc/${FILE_VERSION}/${ARCH_SUFFIX}-${RUNNER_NAME:-shared}"
        fi
        PROTOC_BIN="${INSTALL_DIR}/bin/protoc"
        STAGING_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
        mkdir -p "${STAGING_ROOT}"

        protoc_version_ok() {
          local bin="$1"
          [ -x "${bin}" ] || return 1
          local got
          got="$("${bin}" --version 2>/dev/null | awk '{print $NF}')"
          [ "${got}" = "${REPORTED_VERSION}" ]
        }

        publish_protoc() {
          echo "${INSTALL_DIR}/bin" >> "${GITHUB_PATH}"
          echo "protoc installed: ${PROTOC_BIN} (${VERSION})"
          "${PROTOC_BIN}" --version
        }

        if protoc_version_ok "${PROTOC_BIN}"; then
          echo "protoc ${VERSION} already present at ${PROTOC_BIN}; skipping download."
          publish_protoc
          exit 0
        fi

        echo "Downloading protoc ${VERSION}: ${DOWNLOAD_URL}"
        echo "Expected SHA256: ${EXPECTED_SHA256}"
        echo "Install dir: ${INSTALL_DIR}"

        download_and_verify() {
          local zip="$1"
          curl -fsSL --retry 5 --retry-delay 2 -o "${zip}" "${DOWNLOAD_URL}"
          local actual
          if command -v sha256sum &>/dev/null; then
            actual=$(sha256sum "${zip}" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "${zip}" | awk '{print $1}')
          fi
          if [ "${actual}" != "${EXPECTED_SHA256}" ]; then
            echo "SHA256 mismatch for ${FILENAME}" >&2
            echo "  Expected: ${EXPECTED_SHA256}" >&2
            echo "  Actual:   ${actual}" >&2
            return 1
          fi
          echo "SHA256 verified: ${actual}"
        }

        extract_to() {
          local zip="$1"
          local dest="$2"
          if command -v python3 &>/dev/null; then
            python3 - "${zip}" "${dest}" <<'PY'
        import sys, zipfile
        with zipfile.ZipFile(sys.argv[1]) as zf:
            zf.extractall(sys.argv[2])
        PY
          else
            unzip -qo "${zip}" -d "${dest}"
          fi
        }

        extract_atomically() {
          local zip="$1"
          local staging replacing old
          staging="$(mktemp -d "${STAGING_ROOT}/protoc-extract.XXXXXX")"
          if ! extract_to "${zip}" "${staging}"; then
            echo "::warning::failed extracting ${FILENAME} into ${staging}"
            df -h "${STAGING_ROOT}" "${HOME}" / 2>/dev/null || df -h
            rm -rf "${staging}"
            return 1
          fi
          if [ ! -f "${staging}/bin/protoc" ]; then
            echo "extract did not produce ${staging}/bin/protoc" >&2
            rm -rf "${staging}"
            return 1
          fi
          chmod +x "${staging}/bin/protoc"
          mkdir -p "$(dirname "${INSTALL_DIR}")"
          replacing="${INSTALL_DIR}.new.$$"
          old="${INSTALL_DIR}.old.$$"
          rm -rf "${replacing}" "${old}"
          mv "${staging}" "${replacing}"
          if [ -e "${INSTALL_DIR}" ]; then
            mv "${INSTALL_DIR}" "${old}" || true
          fi
          if ! mv "${replacing}" "${INSTALL_DIR}"; then
            # Another process won the replace; keep a working dest if it is already good.
            rm -rf "${replacing}"
            if [ -f "${INSTALL_DIR}/bin/protoc" ]; then
              rm -rf "${old}"
              return 0
            fi
            if [ -e "${old}" ]; then
              mv "${old}" "${INSTALL_DIR}" || true
            fi
            return 1
          fi
          rm -rf "${old}"
        }

        success=0
        for attempt in 1 2 3; do
          TEMP_ZIP="$(mktemp "${STAGING_ROOT}/protoc.XXXXXX")"
          if download_and_verify "${TEMP_ZIP}" && extract_atomically "${TEMP_ZIP}"; then
            rm -f "${TEMP_ZIP}"
            if protoc_version_ok "${PROTOC_BIN}"; then
              success=1
              break
            fi
            echo "::warning::protoc at ${PROTOC_BIN} did not report version ${REPORTED_VERSION} after extract"
          else
            echo "::warning::protoc install attempt ${attempt}/3 failed"
          fi
          rm -f "${TEMP_ZIP}"
          sleep $((attempt * 2))
        done

        if [ "${success}" -ne 1 ]; then
          echo "::error::Failed to install protoc ${VERSION} after 3 attempts"
          df -h "${STAGING_ROOT}" "${HOME}" / 2>/dev/null || df -h
          exit 1
        fi

        publish_protoc

    - name: Determine version and download protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.token || github.token }}
      run: |
        $ErrorActionPreference = "Stop"

        $ApiHeaders = @{
          Accept = "application/vnd.github+json"
          "X-GitHub-Api-Version" = "2022-11-28"
        }
        if (-not [string]::IsNullOrEmpty($env:GITHUB_TOKEN)) {
          $ApiHeaders.Authorization = "Bearer $($env:GITHUB_TOKEN)"
        }

        # Fetch release metadata (authenticated to avoid shared-runner IP rate limits)
        if ([string]::IsNullOrEmpty($env:INPUT_VERSION)) {
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/protocolbuffers/protobuf/releases/latest" -Headers $ApiHeaders
        } else {
          $QueryVersion = $env:INPUT_VERSION
          if (-not $QueryVersion.StartsWith("v")) {
            $QueryVersion = "v$QueryVersion"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/protocolbuffers/protobuf/releases/tags/$QueryVersion" -Headers $ApiHeaders
        }

        $Version = $release.tag_name
        if ([string]::IsNullOrEmpty($Version)) {
          throw "Failed to determine protoc version from release metadata"
        }

        # Ensure version starts with 'v'
        if (-not $Version.StartsWith("v")) {
          $Version = "v$Version"
        }

        # Tag without leading 'v' is what `protoc --version` prints (libprotoc 28.0-rc1).
        # The zip filename uses a different RC spelling (28.0-rc-1). Keep them apart:
        # $FileVersion is for assets and the cache path only.
        $ReportedVersion = $Version.TrimStart("v")
        $FileVersion = $ReportedVersion

        # Handle rc releases
        $FileVersion = $FileVersion -replace "-?rc(\d+)$", "-rc-`$1"

        # Determine architecture
        $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLower()
        switch ($Arch) {
          "x64" {
            $ArchSuffix = "64"
          }
          "x86" {
            $ArchSuffix = "32"
          }
          "arm64" {
            throw "Failed to install protoc for Windows architecture '${Arch}': No supported protoc release asset is configured for this architecture. Use an x64 Windows runner or update this action to map arm64 to a verified upstream asset."
          }
          default {
            throw "Failed to install protoc for Windows architecture '${Arch}': Unsupported architecture. Supported Windows architectures are x64 and x86."
          }
        }

        $Filename = "protoc-${FileVersion}-win${ArchSuffix}.zip"
        $DownloadUrl = "https://github.com/protocolbuffers/protobuf/releases/download/${Version}/${Filename}"

        # Extract expected SHA256 from release metadata
        $asset = $release.assets | Where-Object { $_.name -eq $Filename }
        if (-not $asset -or [string]::IsNullOrEmpty($asset.digest)) {
          throw "Failed to find SHA256 digest for asset '${Filename}' in release metadata"
        }
        $ExpectedSha256 = $asset.digest -replace '^sha256:', ''

        if (-not [string]::IsNullOrEmpty($env:RUNNER_TOOL_CACHE)) {
          $InstallDir = Join-Path $env:RUNNER_TOOL_CACHE "protoc\$FileVersion\$ArchSuffix"
        } else {
          $suffix = if ($env:RUNNER_NAME) { $env:RUNNER_NAME } else { "shared" }
          $InstallDir = Join-Path $env:USERPROFILE ".local\protoc\$FileVersion\$ArchSuffix-$suffix"
        }
        $ProtocBin = Join-Path $InstallDir "bin\protoc.exe"

        function Test-ProtocVersion {
          param([string]$Bin)
          if (-not (Test-Path $Bin)) { return $false }
          try {
            $got = (& $Bin --version | Out-String).Trim().Split()[-1]
            return $got -eq $ReportedVersion
          } catch {
            return $false
          }
        }

        if (Test-ProtocVersion $ProtocBin) {
          Write-Host "protoc ${Version} already present at ${ProtocBin}; skipping download."
          "$InstallDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "protoc installed: $ProtocBin ($Version)"
          & $ProtocBin --version
          return
        }

        Write-Host "Downloading protoc ${Version}: ${DownloadUrl}"
        Write-Host "Expected SHA256: ${ExpectedSha256}"
        Write-Host "Install dir: ${InstallDir}"

        $stagingRoot = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
        $success = $false
        foreach ($attempt in 1, 2, 3) {
          try {
            $TempZip = Join-Path $stagingRoot ("protoc-" + [guid]::NewGuid().ToString() + ".zip")
            Invoke-WebRequest -Uri $DownloadUrl -OutFile $TempZip

            $ActualSha256 = (Get-FileHash -Path $TempZip -Algorithm SHA256).Hash.ToLower()
            if ($ActualSha256 -ne $ExpectedSha256) {
              throw "SHA256 mismatch for ${Filename}: expected ${ExpectedSha256}, got ${ActualSha256}"
            }
            Write-Host "SHA256 verified: ${ActualSha256}"

            $staging = Join-Path $stagingRoot ("protoc-extract-" + [guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            Expand-Archive -Path $TempZip -DestinationPath $staging -Force
            if (-not (Test-Path (Join-Path $staging "bin\protoc.exe"))) {
              throw "extract did not produce bin\protoc.exe"
            }
            New-Item -ItemType Directory -Force -Path (Split-Path $InstallDir) | Out-Null
            if (Test-Path $InstallDir) {
              Remove-Item -Recurse -Force $InstallDir
            }
            Move-Item -Path $staging -Destination $InstallDir
            Remove-Item -Force $TempZip
            if (Test-ProtocVersion $ProtocBin) {
              $success = $true
              break
            }
            Write-Host "::warning::protoc at $ProtocBin did not report version $ReportedVersion after extract"
          } catch {
            Write-Host "::warning::protoc install attempt ${attempt}/3 failed: $_"
            Start-Sleep -Seconds (2 * $attempt)
          }
        }

        if (-not $success) {
          throw "Failed to install protoc ${Version} after 3 attempts"
        }

        "$InstallDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "protoc installed: $ProtocBin ($Version)"
        & $ProtocBin --version
