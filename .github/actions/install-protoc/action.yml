name: Install protoc
description: >-
  Install the protoc release pinned in .github/ci-cache/pins.json, the same version on
  every platform, checked against its pinned SHA-256 before it is extracted.

runs:
  using: 'composite'
  steps:
    - name: Download protoc (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        # The release and the SHA-256 of each platform's zip come from pins.json, never
        # from the releases API: an answer that names the file to download cannot also be
        # what vouches for it. To move to another release, update the pin (see
        # .github/ci-cache/README.md).
        case "$(uname -s)-$(uname -m)" in
          Linux-x86_64) target=linux-x86_64 ;;
          Linux-aarch64) target=linux-aarch_64 ;;
          Linux-s390x) target=linux-s390_64 ;;
          Linux-ppc64le) target=linux-ppcle_64 ;;
          Darwin-x86_64) target=osx-x86_64 ;;
          Darwin-arm64) target=osx-aarch_64 ;;
          *)
            echo "::error::.github/ci-cache/pins.json pins no protoc for $(uname -s) $(uname -m)." >&2
            exit 1
            ;;
        esac
        PINS="$GITHUB_ACTION_PATH/../../ci-cache/pins.json"
        VERSION="$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["protoc"]["version"])' "$PINS")"
        FILENAME="protoc-${VERSION}-${target}.zip"

        # What `protoc --version` prints (libprotoc 36.2).
        REPORTED_VERSION="${VERSION}"

        # Each job installs its own copy, from a zip checked against the pin, into a new
        # directory under RUNNER_TEMP. A copy kept in the runner's tool cache or under HOME
        # outlives the job: every job a self-hosted host runs, from any ref, can write it,
        # so it is never what a job runs. The zip itself comes from the CI cache, checked
        # against the same pin, so this costs no source download.
        STAGING_ROOT="${RUNNER_TEMP:?RUNNER_TEMP is not set}"
        mkdir -p "${STAGING_ROOT}"

        protoc_version_ok() {
          local bin="$1"
          [ -x "${bin}" ] || return 1
          local got
          got="$("${bin}" --version 2>/dev/null | awk '{print $NF}')"
          [ "${got}" = "${REPORTED_VERSION}" ]
        }

        echo "Installing protoc v${VERSION} (${FILENAME})"

        # fetch_pinned.sh moves the zip to its destination only once it matches the pin.
        download_and_verify() {
          bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" protoc "$1" "$target"
        }

        extract_to() {
          local zip="$1"
          local dest="$2"
          if command -v python3 &>/dev/null; then
            python3 - "${zip}" "${dest}" <<'PY'
        import sys, zipfile
        with zipfile.ZipFile(sys.argv[1]) as zf:
            zf.extractall(sys.argv[2])
        PY
          else
            unzip -qo "${zip}" -d "${dest}"
          fi
        }

        INSTALL_DIR=""
        for attempt in 1 2 3; do
          # `set -e` is still on in this loop, and a function called from `if` runs without
          # it, so each failure is checked here.
          if ! dir="$(mktemp -d "${STAGING_ROOT}/protoc.XXXXXX")" || [ -z "${dir}" ] || [ ! -d "${dir}" ]; then
            echo "::warning::protoc install attempt ${attempt}/3 failed: could not create a directory under ${STAGING_ROOT}"
            sleep $((attempt * 2))
            continue
          fi
          if download_and_verify "${dir}/${FILENAME}" \
            && mkdir "${dir}/root" \
            && extract_to "${dir}/${FILENAME}" "${dir}/root" \
            && [ -f "${dir}/root/bin/protoc" ] \
            && chmod +x "${dir}/root/bin/protoc" \
            && protoc_version_ok "${dir}/root/bin/protoc"; then
            rm -f "${dir}/${FILENAME}"
            INSTALL_DIR="${dir}/root"
            break
          fi
          echo "::warning::protoc install attempt ${attempt}/3 failed"
          df -h "${STAGING_ROOT}" / 2>/dev/null || df -h
          rm -rf "${dir}"
          sleep $((attempt * 2))
        done

        if [ -z "${INSTALL_DIR}" ]; then
          echo "::error::Failed to install protoc v${VERSION} after 3 attempts"
          exit 1
        fi

        echo "${INSTALL_DIR}/bin" >> "${GITHUB_PATH}"
        echo "protoc installed: ${INSTALL_DIR}/bin/protoc (v${VERSION})"
        "${INSTALL_DIR}/bin/protoc" --version

    - name: Download protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # The release and the SHA-256 of each zip come from pins.json, as on Linux and macOS.
        $pin = (Get-Content -Raw (Join-Path $env:GITHUB_ACTION_PATH '..\..\ci-cache\pins.json') | ConvertFrom-Json).'protoc'
        $Version = "v$($pin.version)"
        # What `protoc --version` prints, and the version in the file name.
        $ReportedVersion = $pin.version
        $FileVersion = $pin.version

        # Determine architecture
        $Arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLower()
        switch ($Arch) {
          "x64" {
            $target = 'win64'
          }
          "x86" {
            $target = 'win32'
          }
          "arm64" {
            throw "Failed to install protoc for Windows architecture '${Arch}': No supported protoc release asset is configured for this architecture. Use an x64 Windows runner or update this action to map arm64 to a verified upstream asset."
          }
          default {
            throw "Failed to install protoc for Windows architecture '${Arch}': Unsupported architecture. Supported Windows architectures are x64 and x86."
          }
        }

        $Filename = "protoc-${FileVersion}-${target}.zip"
        $DownloadUrl = $pin.url.Replace('{version}', $pin.version).Replace('{target}', $target)
        $ExpectedSha256 = $pin.sha256.$target
        if ([string]::IsNullOrEmpty($ExpectedSha256)) {
          throw ".github/ci-cache/pins.json pins no protoc for ${target}"
        }

        # Each job installs its own copy into a new directory under RUNNER_TEMP, as on Linux
        # and macOS: a copy kept in the tool cache outlives the job, and any job on the host
        # can write it.
        if ([string]::IsNullOrEmpty($env:RUNNER_TEMP)) {
          throw "RUNNER_TEMP is not set"
        }
        $stagingRoot = $env:RUNNER_TEMP

        function Test-ProtocVersion {
          param([string]$Bin)
          if (-not (Test-Path $Bin)) { return $false }
          try {
            $got = (& $Bin --version | Out-String).Trim().Split()[-1]
            return $got -eq $ReportedVersion
          } catch {
            return $false
          }
        }

        Write-Host "Downloading protoc ${Version}: ${DownloadUrl}"
        Write-Host "Expected SHA256: ${ExpectedSha256}"

        $success = $false
        foreach ($attempt in 1, 2, 3) {
          try {
            $TempZip = Join-Path $stagingRoot ("protoc-" + [guid]::NewGuid().ToString() + ".zip")
            Invoke-WebRequest -Uri $DownloadUrl -OutFile $TempZip

            $ActualSha256 = (Get-FileHash -Path $TempZip -Algorithm SHA256).Hash.ToLower()
            if ($ActualSha256 -ne $ExpectedSha256) {
              throw "SHA256 mismatch for ${Filename}: expected ${ExpectedSha256}, got ${ActualSha256}"
            }
            Write-Host "SHA256 verified: ${ActualSha256}"

            $staging = Join-Path $stagingRoot ("protoc-extract-" + [guid]::NewGuid().ToString())
            New-Item -ItemType Directory -Force -Path $staging | Out-Null
            Expand-Archive -Path $TempZip -DestinationPath $staging -Force
            if (-not (Test-Path (Join-Path $staging "bin\protoc.exe"))) {
              throw "extract did not produce bin\protoc.exe"
            }
            Remove-Item -Force $TempZip
            $InstallDir = $staging
            $ProtocBin = Join-Path $InstallDir "bin\protoc.exe"
            if (Test-ProtocVersion $ProtocBin) {
              $success = $true
              break
            }
            Write-Host "::warning::protoc at $ProtocBin did not report version $ReportedVersion after extract"
          } catch {
            Write-Host "::warning::protoc install attempt ${attempt}/3 failed: $_"
            Start-Sleep -Seconds (2 * $attempt)
          }
        }

        if (-not $success) {
          throw "Failed to install protoc ${Version} after 3 attempts"
        }

        "$InstallDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Host "protoc installed: $ProtocBin ($Version)"
        & $ProtocBin --version
