name: Build tool
description: 'Builds a workspace tool binary once per commit: download it from MinIO if this commit built it already, otherwise build and upload it'

# Requires the MinIO CLI (`setup-minio`) and a checkout of the commit to build.
inputs:
  package:
    description: 'The cargo package, which is also the binary name'
    required: true
  features:
    description: 'Cargo features to build with'
    required: false
    default: ''
  profile:
    description: 'Cargo profile: release or dev'
    required: false
    default: 'release'

outputs:
  path:
    description: 'Path to the binary'
    value: ${{ steps.paths.outputs.path }}

runs:
  using: 'composite'
  steps:
    - name: Locate the binary
      id: paths
      shell: bash
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_PACKAGE: ${{ inputs.package }}
      run: |
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "build-tool supports Linux and macOS runners, not $RUNNER_OS" >&2; exit 1 ;;
        esac
        # The checked-out commit, not github.sha: a pull_request run's
        # github.sha is a merge commit, and a dispatch may check out a ref.
        sha="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
        dir=$([ "${INPUT_PROFILE}" = dev ] && echo debug || echo release)
        features="${INPUT_FEATURES}"
        echo "object=spice-minio/artifacts/${INPUT_PACKAGE}/${os}-$(uname -m)/${INPUT_PROFILE}/${sha}${features:+-${features//,/_}}/${INPUT_PACKAGE}" >> "$GITHUB_OUTPUT"
        echo "path=$GITHUB_WORKSPACE/target/$dir/${INPUT_PACKAGE}" >> "$GITHUB_OUTPUT"

    - name: Download from MinIO
      id: download
      shell: bash
      env:
        PATHS_OBJECT: ${{ steps.paths.outputs.object }}
        PATHS_PATH: ${{ steps.paths.outputs.path }}
        INPUT_PACKAGE: ${{ inputs.package }}
      run: |
        if mc stat "${PATHS_OBJECT}" >/dev/null 2>&1; then
          mkdir -p "$(dirname "${PATHS_PATH}")"
          mc cp "${PATHS_OBJECT}" "${PATHS_PATH}"
          chmod +x "${PATHS_PATH}"
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "No ${INPUT_PACKAGE} built for this commit yet; building it"
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Rust
      if: steps.download.outputs.found != 'true'
      uses: $/.github/actions/setup-rust

    - name: Setup cc
      if: steps.download.outputs.found != 'true' && runner.os == 'Linux'
      uses: $/.github/actions/setup-cc

    - name: Build
      if: steps.download.outputs.found != 'true'
      shell: bash
      env:
        CARGO_INCREMENTAL: 0
        CARGO_NET_GIT_FETCH_WITH_CLI: true
        INPUT_FEATURES: ${{ inputs.features }}
        INPUT_PACKAGE: ${{ inputs.package }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: |
        features="${INPUT_FEATURES}"
        cargo build -p "${INPUT_PACKAGE}" --profile "${INPUT_PROFILE}" ${features:+--features "$features"}

    - name: Upload to MinIO
      # Not on a read-only run (a CI AWS role job off trunk; see .github/actions/ci-role).
      if: steps.download.outputs.found != 'true' && env.CI_CACHE_READ_ONLY != 'true'
      shell: bash
      env:
        PATHS_PATH: ${{ steps.paths.outputs.path }}
        PATHS_OBJECT: ${{ steps.paths.outputs.object }}
      run: mc cp "${PATHS_PATH}" "${PATHS_OBJECT}"
