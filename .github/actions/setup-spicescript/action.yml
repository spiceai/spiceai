name: Set up spicescript
description: >-
  Everything a spicescript job needs before it runs scripts: RustFS credentials
  and the MinIO client, the spicescript binary, a Docker Hub login, the AWS and
  DuckDB CLIs, and the Hugging Face token. The calling job needs
  `id-token: write` (RustFS and Docker Hub use its GitHub OIDC token).

inputs:
  minio-endpoint:
    description: 'vars.TEST_MINIO_ENDPOINT'
    required: true
  dockerhub-username:
    description: 'vars.DOCKERHUB_ORGANIZATION'
    required: true
  dockerhub-oidc-connection-id:
    description: 'vars.DOCKERHUB_OIDC_CONNECTIONID'
    required: true
  hf-token:
    description: 'secrets.SPICE_SECRET_HF_TOKEN; may be empty'
    required: false
    default: ''

outputs:
  path:
    description: 'Path to the spicescript binary'
    value: ${{ steps.spicescript.outputs.path }}

runs:
  using: composite
  steps:
    - name: Get RustFS credentials
      id: rustfs
      uses: $/.github/actions/rustfs-credentials
      with:
        endpoint: ${{ inputs.minio-endpoint }}
        duration-seconds: '3600'
        export-env: 'false'

    - name: Install MinIO
      uses: $/.github/actions/setup-minio
      with:
        minio_endpoint: ${{ inputs.minio-endpoint }}
        minio_access_key: ${{ steps.rustfs.outputs.access-key-id }}
        minio_secret_key: ${{ steps.rustfs.outputs.secret-access-key }}
        minio_session_token: ${{ steps.rustfs.outputs.session-token }}

    - name: Download spicescript
      id: spicescript
      uses: $/.github/actions/build-tool
      with:
        package: spicescript

    # Sources run in containers; log in so image pulls are not rate limited. Scripts pull
    # images as they start, so the login has to last the whole job. Docker Hub logins use
    # the job's GitHub OIDC token; there are no Docker Hub password secrets.
    - name: Login to DockerHub
      if: github.repository == 'spiceai/spiceai'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.dockerhub-oidc-connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: '21600'
      with:
        username: ${{ inputs.dockerhub-username }}

    # Object-store sources (rustfs) are managed with the aws CLI.
    - name: Install the AWS CLI
      uses: $/.github/actions/install-aws-cli

    # Iceberg sources and dbgen write and read through the DuckDB CLI. The
    # DuckLake source fetches the release matching spiced's embedded DuckDB.
    - name: Install DuckDB CLI
      shell: bash
      run: |
        set -euo pipefail
        # DuckDB CLI v1.5.5, pinned in .github/ci-cache/pins.json and checked against its
        # SHA-256, unpacked into a new directory of the job's own.
        dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/duckdb.XXXXXX")"
        bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" duckdb-cli "$dir/duckdb.zip"
        unzip -q "$dir/duckdb.zip" -d "$dir/bin"
        rm -f "$dir/duckdb.zip"
        echo "$dir/bin" >> "$GITHUB_PATH"

    # The search and embedding scripts download a Hub model at startup. Without
    # a token they share the pool's anonymous per-IP quota, and a rate limit fails
    # every one of them at once as "model 'potion' … failed to load".
    - name: Authenticate the Hugging Face cache
      uses: $/.github/actions/hf-cache-auth
      with:
        token: ${{ inputs.hf-token }}
