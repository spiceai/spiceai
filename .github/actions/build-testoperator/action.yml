name: Build Testoperator
description: 'Builds the testoperator binary with caching based on commit SHA'

inputs:
  install_to_system_path:
    description: 'Whether to install testoperator to system path'
    required: false
    default: 'true'
  upload_artifact:
    description: 'Whether to upload the testoperator as an artifact'
    required: false
    default: 'false'
  force_rebuild:
    description: 'Whether to force a rebuild (skip cache)'
    required: false
    default: 'false'
  download_from_minio:
    description: 'Whether to try downloading from MinIO before checking GitHub cache'
    required: false
    default: 'true'
  minio_endpoint:
    description: 'MinIO endpoint for sccache'
    required: false
  minio_access_key:
    description: 'MinIO access key for sccache'
    required: false
  minio_secret_key:
    description: 'MinIO secret key for sccache'
    required: false

outputs:
  cache-hit:
    description: 'Whether the testoperator was found in cache'
    value: ${{ steps.build.outputs.cache-hit }}
  testoperator-path:
    description: 'Path to the testoperator binary'
    value: ${{ steps.build.outputs.binary-path }}

runs:
  using: 'composite'
  steps:
    - name: Build testoperator
      id: build
      uses: ./.github/actions/build-cached-rust-binary
      with:
        binary_name: testoperator
        build_command: cargo build -p testoperator --release --features models
        install_to_system_path: ${{ inputs.install_to_system_path }}
        upload_artifact: ${{ inputs.upload_artifact }}
        force_rebuild: ${{ inputs.force_rebuild }}
        download_from_minio: ${{ inputs.download_from_minio }}
        minio_endpoint: ${{ inputs.minio_endpoint }}
        minio_access_key: ${{ inputs.minio_access_key }}
        minio_secret_key: ${{ inputs.minio_secret_key }}
