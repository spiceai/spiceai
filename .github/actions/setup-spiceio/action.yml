name: Setup spiceio
description: 'Download and install spiceio (S3-to-SMB proxy) from spiceai/spiceio releases'

inputs:
  github_token:
    description: 'GitHub token for downloading from the private spiceai/spiceio repo'
    required: true

outputs:
  spiceio_bin:
    description: 'Path to the spiceio binary'
    value: ${{ steps.setup.outputs.spiceio_bin }}

runs:
  using: 'composite'
  steps:
    - name: Setup spiceio
      id: setup
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        # Use pre-installed binary if available
        if command -v spiceio &> /dev/null; then
          echo "spiceio already installed: $(which spiceio)"
          echo "spiceio_bin=$(which spiceio)" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Downloading latest spiceio release..."
        INSTALL_DIR="/usr/local/bin"
        TEMP_DIR=$(mktemp -d)

        # Download the latest release asset
        gh release download --repo spiceai/spiceio --pattern "spiceio-macOS-ARM64.tar.gz" --dir "$TEMP_DIR"

        # Extract and install
        tar -xzf "$TEMP_DIR/spiceio-macOS-ARM64.tar.gz" -C "$TEMP_DIR"
        SPICEIO_BIN="$TEMP_DIR/spiceio"
        if [ -f "$SPICEIO_BIN" ]; then
          chmod +x "$SPICEIO_BIN"
          echo "spiceio downloaded successfully"
          echo "spiceio_bin=$SPICEIO_BIN" >> $GITHUB_OUTPUT
        else
          echo "::warning::Failed to download spiceio"
          echo "spiceio_bin=" >> $GITHUB_OUTPUT
        fi
