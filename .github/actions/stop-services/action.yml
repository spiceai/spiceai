name: 'Stop database services'
description: |
  Stops the private database servers a job started on its allocated ports
  (allocate-service-ports) and removes their data directories, so none outlives
  the job on a shared self-hosted host: PostgreSQL from install-postgres with
  isolated: 'true' (CI_PG_DIR), and servers that record a pid file and directory
  in CI_MYSQL_PID / CI_MYSQL_DIR and CI_CLICKHOUSE_PID / CI_CLICKHOUSE_DIR.
  Does nothing for a service the job did not start that way. Then frees the
  job's port reservations from allocate-service-ports.
runs:
  using: 'composite'
  steps:
    - name: Stop database services
      shell: bash
      run: |
        if [ -n "${CI_PG_DIR:-}" ]; then
          if [ "$RUNNER_OS" = "Linux" ]; then
            pg_bin="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
            sudo -u postgres "${pg_bin}/pg_ctl" -D "$CI_PG_DIR" stop -m fast || true
            sudo rm -rf "$CI_PG_DIR"
          else
            pg_ctl -D "$CI_PG_DIR" stop -m fast || true
            rm -rf "$CI_PG_DIR"
          fi
        fi
        stop() {
          local pid_file="$1" dir="$2" pid
          if [ -f "$pid_file" ]; then
            pid="$(cat "$pid_file")"
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 30); do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
          fi
          if [ -n "$dir" ]; then
            rm -rf "$dir" || true
          fi
        }
        stop "${CI_MYSQL_PID:-}" "${CI_MYSQL_DIR:-}"
        stop "${CI_CLICKHOUSE_PID:-}" "${CI_CLICKHOUSE_DIR:-}"

    - name: Release service port reservations
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/../allocate-service-ports/release_ports.sh"
