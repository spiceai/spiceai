name: Require release approval
description: >-
  Fails the job unless a reviewer approved this workflow run's deployment to the
  given environment. publish_release's later jobs run in an environment without
  reviewers, so each one calls this first to stay behind the one approval of its
  `publish` job. Needs `actions: read`.

inputs:
  environment:
    description: Environment whose approval this run must have
    required: false
    default: github-publish
  github-token:
    description: "Token with `actions: read` on this repository"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check the ${{ inputs.environment }} approval of this run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ENVIRONMENT: ${{ inputs.environment }}
        RUN_ID: ${{ github.run_id }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        approvers=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/approvals" \
          --jq "[.[] | select(.state == \"approved\" and any(.environments[]; .name == env.ENVIRONMENT)) | .user.login] | join(\", \")")
        if [ -z "$approvers" ]; then
          echo "::error::Workflow run ${RUN_ID} has no approved deployment to the '${ENVIRONMENT}' environment, so this job will not publish. Start publish_release on the release branch and have a reviewer approve its 'publish' job."
          exit 1
        fi
        echo "Run ${RUN_ID} was approved for '${ENVIRONMENT}' by ${approvers}."
