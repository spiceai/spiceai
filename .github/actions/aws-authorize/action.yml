name: 'Authorize with AWS'
description: 'Authorize with an AWS account and role'
inputs:
  region:
    description: 'The AWS region to authorize with'
    required: true
  environment:
    description: 'The environment to deploy to (e.g. dev, sandbox, production)'
    required: true
  role_name:
    description: 'The name of the role to assume'
    required: true
outputs:
  account_id:
    description: 'The AWS account ID for the environment'
    value: ${{ steps.set_account_id.outputs.ACCOUNT_ID }}
runs:
  using: 'composite'
  steps:
    - name: Set Account ID for environment
      id: set_account_id
      shell: bash
      run: |
        echo "ACCOUNT_ID=211125479522" >> $GITHUB_ENV
        echo "ACCOUNT_ID=211125479522" >> $GITHUB_OUTPUT

    - name: Set AWS Role to Assume
      shell: bash
      env:
        INPUT_ROLE_NAME: ${{ inputs.role_name }}
      run: |
        # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
        if [[ "${INPUT_ROLE_NAME}" == *$'\n'* || "${INPUT_ROLE_NAME}" == *$'\r'* ]]; then
          echo "::error::aws-authorize: role_name must not contain a newline"
          exit 1
        fi
        echo "AWS_ROLE_TO_ASSUME=arn:aws:iam::${ACCOUNT_ID}:role/${INPUT_ROLE_NAME}" >> $GITHUB_ENV

    - name: Set Role Session Name with uuidgen
      shell: bash
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
        if [[ "${INPUT_ENVIRONMENT}" == *$'\n'* || "${INPUT_ENVIRONMENT}" == *$'\r'* ]]; then
          echo "::error::aws-authorize: environment must not contain a newline"
          exit 1
        fi
        echo "ROLE_SESSION_NAME=gha-${INPUT_ENVIRONMENT}-${GITHUB_RUN_ID}" >> $GITHUB_ENV

    - name: Acquire role
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
        role-session-name: ${{ env.ROLE_SESSION_NAME }}
        aws-region: ${{ inputs.region }}
