name: Setup minio
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint'
    required: true
  minio_access_key:
    description: 'MinIO access key'
    required: true
  minio_secret_key:
    description: 'MinIO secret key'
    required: true
  minio_session_token:
    description: >-
      Session token of temporary MinIO credentials. `mc alias set` cannot take one, so with it
      the alias comes from MC_HOST_spice-minio for the rest of the job.
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install MinIO on Linux
      shell: bash
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        if command -v mc >/dev/null 2>&1; then
          exit 0
        fi

        # Mirror of mc; dl.min.io currently serves an expired TLS cert.
        mc_url="https://public-data.spiceai.org/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z"
        tmp_mc="$(mktemp)"

        # Retry only a failure of the network or the mirror, which says nothing
        # about the change under test, as .github/scripts/mc_cp.sh does for
        # `mc cp`. Any other error, such as a 404, fails at once. `curl --retry`
        # alone does not retry a dropped connection (exit 56), and
        # `--retry-all-errors` would retry a 404 as well.
        download_mc_with_curl() {
          local attempts=4 delay=5 attempt status code retry
          for ((attempt = 1; ; attempt++)); do
            status=0
            code="$(curl --fail --silent --show-error --location --connect-timeout 30 --max-time 300 \
              --write-out '%{http_code}' --output "$tmp_mc" "$mc_url")" || status=$?
            [ "$status" -eq 0 ] && return 0
            retry=false
            case "$status" in
              # Could not resolve or connect, partial body, timeout, TLS connect
              # error, empty reply, send or receive failure, HTTP/2 stream error.
              6 | 7 | 18 | 28 | 35 | 52 | 55 | 56 | 92) retry=true ;;
              # --fail turns every HTTP error into 22; retry only a mirror-side one.
              22) if [[ "$code" =~ ^(408|429|5[0-9][0-9])$ ]]; then retry=true; fi ;;
            esac
            if [ "$retry" != true ]; then
              echo "::error::Downloading the MinIO client from $mc_url failed (curl exit $status, HTTP $code), which is not a network or mirror failure, so it was not retried."
              return "$status"
            fi
            if [ "$attempt" -ge "$attempts" ]; then
              echo "::error::Downloading the MinIO client from $mc_url failed $attempt times with a network or mirror error (last curl exit $status). The mirror may be down; re-run the job once it recovers."
              return "$status"
            fi
            echo "::warning::Downloading the MinIO client failed with a network or mirror error (curl exit $status, attempt $attempt of $attempts); retrying in ${delay}s."
            sleep "$delay"
            delay=$((delay * 2))
          done
        }

        if command -v curl >/dev/null 2>&1; then
          download_mc_with_curl
        elif command -v wget >/dev/null 2>&1; then
          wget --quiet --output-document="$tmp_mc" "$mc_url"
        else
          echo "curl or wget is required to install the MinIO client" >&2
          exit 1
        fi
        sudo install -m 0755 "$tmp_mc" /usr/local/bin/mc

    - name: Install MinIO on macOS
      shell: bash
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install minio/stable/mc

    - name: Install MinIO on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $mcPath = "$env:USERPROFILE\mc"
        New-Item -ItemType Directory -Force -Path $mcPath | Out-Null
        Invoke-WebRequest -Uri "https://dl.min.io/client/mc/release/windows-amd64/mc.exe" -OutFile "$mcPath\mc.exe"
        echo "$mcPath" >> $env:GITHUB_PATH

    # Read through `env` rather than interpolating `${{ }}` into the script, so a
    # value containing shell metacharacters stays a value. A run that cannot read
    # the repository's Actions secrets (a Dependabot or fork pull request) passes
    # all three empty, and mc then fails with only "Incorrect number of
    # arguments", so name that cause instead.
    - name: Set MinIO alias (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
      run: |
        missing=()
        [[ -n "$MINIO_ENDPOINT" ]] || missing+=(minio_endpoint)
        [[ -n "$MINIO_ACCESS_KEY" ]] || missing+=(minio_access_key)
        [[ -n "$MINIO_SECRET_KEY" ]] || missing+=(minio_secret_key)
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "::error::setup-minio received an empty ${missing[*]}. The secrets that feed these inputs are not available to this run (event: ${GITHUB_EVENT_NAME}, actor: ${GITHUB_ACTOR}); Dependabot and fork pull requests cannot read the repository's Actions secrets. Rerun from a branch of this repository, or dispatch the workflow."
          exit 1
        fi
        if [[ -n "$MINIO_SESSION_TOKEN" ]]; then
          # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
          for value in "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" "${MINIO_SESSION_TOKEN}"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::setup-minio: MinIO inputs must not contain a newline"
              exit 1
            fi
          done
          echo "MC_HOST_spice-minio=${MINIO_ENDPOINT%%://*}://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}:${MINIO_SESSION_TOKEN}@${MINIO_ENDPOINT#*://}" >> "$GITHUB_ENV"
        else
          mc alias set spice-minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
        fi

    - name: Set MinIO alias (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
      run: |
        $ErrorActionPreference = 'Stop'
        $missing = @('MINIO_ENDPOINT', 'MINIO_ACCESS_KEY', 'MINIO_SECRET_KEY') | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
        if ($missing) {
          Write-Output "::error::setup-minio received an empty $(($missing | ForEach-Object { $_.ToLower() }) -join ' '). The secrets that feed these inputs are not available to this run (event: $env:GITHUB_EVENT_NAME, actor: $env:GITHUB_ACTOR); Dependabot and fork pull requests cannot read the repository's Actions secrets. Rerun from a branch of this repository, or dispatch the workflow."
          exit 1
        }
        if ($env:MINIO_SESSION_TOKEN) {
          # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
          if (@($env:MINIO_ENDPOINT, $env:MINIO_ACCESS_KEY, $env:MINIO_SECRET_KEY, $env:MINIO_SESSION_TOKEN) -match "[`r`n]") {
            Write-Output "::error::setup-minio: MinIO inputs must not contain a newline"
            exit 1
          }
          $scheme, $hostPort = $env:MINIO_ENDPOINT -split '://', 2
          "MC_HOST_spice-minio=${scheme}://$($env:MINIO_ACCESS_KEY):$($env:MINIO_SECRET_KEY):$($env:MINIO_SESSION_TOKEN)@${hostPort}" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        } else {
          $mcExePath = Join-Path $env:USERPROFILE 'mc\mc.exe'
          & $mcExePath alias set spice-minio $env:MINIO_ENDPOINT $env:MINIO_ACCESS_KEY $env:MINIO_SECRET_KEY
        }
