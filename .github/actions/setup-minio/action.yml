name: Setup minio
description: 'composite action'

inputs:
  minio_endpoint:
    description: 'MinIO endpoint'
    required: true
  minio_access_key:
    description: 'MinIO access key'
    required: true
  minio_secret_key:
    description: 'MinIO secret key'
    required: true
  minio_session_token:
    description: >-
      Session token of temporary MinIO credentials. `mc alias set` cannot take one, so with it
      the alias comes from MC_HOST_spice-minio for the rest of the job.
    required: false

runs:
  using: 'composite'
  steps:
    # Every job runs the mc release pinned in .github/ci-cache/pins.json, checked against
    # its SHA-256 by .github/scripts/cached_fetch.sh (which also retries a failure of the
    # network or the server) and installed into a new directory of the job's own, first on
    # PATH. An mc already on the runner is never what a job runs. dl.min.io no longer
    # serves mc, so the pin's source is a mirror, which holds the Linux x86_64 build only.
    - name: Install MinIO on Linux
      shell: bash
      if: runner.os == 'Linux'
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) target=linux-amd64 ;;
          *)
            echo "::error::.github/ci-cache/pins.json pins no MinIO client for Linux $(uname -m)."
            exit 1
            ;;
        esac
        dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/mc.XXXXXX")"
        bash "$GITHUB_ACTION_PATH/../../scripts/fetch_pinned.sh" mc "$dir/mc" "$target"
        chmod 0755 "$dir/mc"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Refuse a MinIO client that is not pinned
      if: runner.os != 'Linux'
      shell: bash
      run: |
        echo "::error::.github/ci-cache/pins.json pins a MinIO client for Linux x86_64 only, and no source serves a $RUNNER_OS build to pin; run this job on Linux."
        exit 1

    # Read through `env` rather than interpolating `${{ }}` into the script, so a
    # value containing shell metacharacters stays a value. A run that cannot read
    # the repository's Actions secrets (a Dependabot or fork pull request) passes
    # all three empty, and mc then fails with only "Incorrect number of
    # arguments", so name that cause instead.
    - name: Set MinIO alias
      if: runner.os == 'Linux'
      shell: bash
      env:
        MINIO_ENDPOINT: ${{ inputs.minio_endpoint }}
        MINIO_ACCESS_KEY: ${{ inputs.minio_access_key }}
        MINIO_SECRET_KEY: ${{ inputs.minio_secret_key }}
        MINIO_SESSION_TOKEN: ${{ inputs.minio_session_token }}
      run: |
        missing=()
        [[ -n "$MINIO_ENDPOINT" ]] || missing+=(minio_endpoint)
        [[ -n "$MINIO_ACCESS_KEY" ]] || missing+=(minio_access_key)
        [[ -n "$MINIO_SECRET_KEY" ]] || missing+=(minio_secret_key)
        if [[ ${#missing[@]} -gt 0 ]]; then
          echo "::error::setup-minio received an empty ${missing[*]}. The secrets that feed these inputs are not available to this run (event: ${GITHUB_EVENT_NAME}, actor: ${GITHUB_ACTOR}); Dependabot and fork pull requests cannot read the repository's Actions secrets. Rerun from a branch of this repository, or dispatch the workflow."
          exit 1
        fi
        if [[ -n "$MINIO_SESSION_TOKEN" ]]; then
          # Appended to $GITHUB_ENV as NAME=value: a newline would inject more entries.
          for value in "${MINIO_ENDPOINT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}" "${MINIO_SESSION_TOKEN}"; do
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::setup-minio: MinIO inputs must not contain a newline"
              exit 1
            fi
          done
          echo "MC_HOST_spice-minio=${MINIO_ENDPOINT%%://*}://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}:${MINIO_SESSION_TOKEN}@${MINIO_ENDPOINT#*://}" >> "$GITHUB_ENV"
        else
          mc alias set spice-minio "$MINIO_ENDPOINT" "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"
        fi
