name: 'Install Spice'
description: 'Installs Spice locally from build artifacts directory'
inputs:
  build-path:
    description: 'Directory containing Spice binaries'
    required: true
  install-scope:
    description: |
      Where to install `spice` and `spiced` (not used on Windows, which always
      installs into `$HOME\.spice\bin`). `user` (the default) installs into
      `$HOME/.spice/bin`, the directory `spice install` and `spice upgrade` manage.
      `job` installs into a new directory that `mktemp -d` creates under the runner's
      temporary directory (`RUNNER_TEMP`), so nothing an earlier job left there is
      reused: the runner skips what it cannot delete when it empties `RUNNER_TEMP`.
      The directory goes on `PATH` only once it holds exactly the two binaries this
      step moved there. Pass `job` on a self-hosted runner whose instances share a
      host and a user: two jobs installing into one shared `$HOME/.spice/bin`
      replace each other's binaries, so a job can start the other job's `spiced`.
      `spice run` starts the `spiced` beside the `spice` it runs, so the two stay
      paired in either directory. The action picks the directory itself rather
      than taking a path, so no caller-supplied string is added to `PATH`.
    required: false
    default: 'user'

runs:
  using: 'composite'
  steps:
    - name: Install Spice binaries
      id: install
      shell: bash
      if: runner.os != 'Windows'
      env:
        INPUT_BUILD_PATH: ${{ inputs.build-path }}
        INPUT_INSTALL_SCOPE: ${{ inputs.install-scope }}
      run: |
        set -euo pipefail
        file_sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$1" | awk '{print $1}'
          else
            shasum -a 256 "$1" | awk '{print $1}'
          fi
        }
        case "$INPUT_INSTALL_SCOPE" in
          user | '') install_dir="$HOME/.spice/bin" ;;
          job)
            # Created here, exclusively and under a name no earlier job can know.
            install_dir="$(mktemp -d "${RUNNER_TEMP:?RUNNER_TEMP is not set}/spice-bin.XXXXXX")" || {
              echo "::error::install-spice: could not create a directory under RUNNER_TEMP"
              exit 1
            }
            ;;
          *)
            echo "::error::install-spice: install-scope must be 'user' or 'job'"
            exit 1
            ;;
        esac
        echo "Installing Spice from local folder: ${INPUT_BUILD_PATH}"

        chmod +x "${INPUT_BUILD_PATH}/spice"
        chmod +x "${INPUT_BUILD_PATH}/spiced"
        spice_sha256="$(file_sha256 "${INPUT_BUILD_PATH}/spice")"
        spiced_sha256="$(file_sha256 "${INPUT_BUILD_PATH}/spiced")"

        mkdir -p "$install_dir"

        mv "${INPUT_BUILD_PATH}/spice" "$install_dir"
        mv "${INPUT_BUILD_PATH}/spiced" "$install_dir"

        # The job's directory goes on PATH only if it holds exactly the two files moved
        # into it, as regular files with the bytes they had: anything else there would
        # run ahead of the system's own commands.
        if [ "$INPUT_INSTALL_SCOPE" = job ]; then
          entries="$(cd "$install_dir" && ls -A | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$entries" != "spice spiced " ] ||
            [ -L "$install_dir/spice" ] || [ ! -f "$install_dir/spice" ] ||
            [ -L "$install_dir/spiced" ] || [ ! -f "$install_dir/spiced" ] ||
            [ "$(file_sha256 "$install_dir/spice")" != "$spice_sha256" ] ||
            [ "$(file_sha256 "$install_dir/spiced")" != "$spiced_sha256" ]; then
            echo "::error::install-spice: $install_dir does not hold exactly the spice and spiced this step installed (it holds: ${entries}), so it is not put on PATH."
            exit 1
          fi
        fi

        echo "dir=$install_dir" >> "$GITHUB_OUTPUT"
        echo "$install_dir" >> "$GITHUB_PATH"

        echo "Spice binaries installed successfully into $install_dir."
        ls -la "$install_dir"

    - name: Install Spice binaries (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      env:
        INPUT_BUILD_PATH: ${{ inputs.build-path }}
      run: |
        echo "Installing Spice from local folder: ${env:INPUT_BUILD_PATH}"

        $spiceBin = ".spice\bin"
        $spiceInstallDir = Join-Path $HOME $spiceBin
        $spiceCliFileName = "spice.exe"
        $spiceRuntimeFileName = "spiced.exe"
        $spiceCliFullPath= Join-Path $spiceInstallDir $spiceCliFileName
        $spiceRuntimeFullPath= Join-Path $spiceInstallDir $spiceRuntimeFileName

        Write-Host "Spice Binaries directory created"
        New-Item -Path $spiceInstallDir -ItemType Directory -Force > $null

        Write-Host "Moving spice CLI"
        Move-Item -Force "${env:INPUT_BUILD_PATH}\spice.exe" -Destination $spiceCliFullPath

        Write-Host "Moving spice Runtime"
        Move-Item -Force "${env:INPUT_BUILD_PATH}\spiced.exe" -Destination $spiceRuntimeFullPath

        echo "$spiceInstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        Write-Host "Spice binaries installed successfully into $spiceInstallDir"
        Get-ChildItem -Path "$spiceInstallDir" -Force

    - name: Verify Spice installation
      shell: bash
      if: runner.os != 'Windows'
      env:
        INSTALL_DIR: ${{ steps.install.outputs.dir }}
      run: |
        install_dir="${INSTALL_DIR:?the install step reported no directory}"
        # Verify binaries exist and are executable
        if [ ! -x "$install_dir/spice" ]; then
          echo "ERROR: spice binary not found or not executable"
          exit 1
        fi
        if [ ! -x "$install_dir/spiced" ]; then
          echo "ERROR: spiced binary not found or not executable"
          exit 1
        fi
        # Later steps call `spice` and `spiced` by name, so the ones on PATH must be
        # the ones just installed, not a copy another job left elsewhere on the host.
        for name in spice spiced; do
          found="$(command -v "$name" || true)"
          if [ "$found" != "$install_dir/$name" ]; then
            echo "ERROR: '$name' on PATH is '${found:-nothing}', not the one installed at '$install_dir/$name'"
            exit 1
          fi
        done
        echo "Spice binaries verified successfully"
        # Test spiced --version directly to debug any issues
        echo "Testing spiced --version:"
        "$install_dir/spiced" --version 2>&1 || echo "spiced --version failed with exit code $?"
        # Show spice version (which calls spiced --version internally)
        echo "Testing spice version:"
        "$install_dir/spice" version 2>&1 || echo "spice version failed with exit code $?"

    - name: Verify Spice installation (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Verify binaries exist
        $spiceInstallDir = Join-Path $HOME ".spice\bin"
        if (!(Test-Path (Join-Path $spiceInstallDir "spice.exe"))) {
          Write-Error "spice.exe not found"
          exit 1
        }
        if (!(Test-Path (Join-Path $spiceInstallDir "spiced.exe"))) {
          Write-Error "spiced.exe not found"
          exit 1
        }
        Write-Host "Spice binaries verified successfully"
