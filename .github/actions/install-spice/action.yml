name: 'Install Spice'
description: 'Installs Spice locally from build artifacts directory'
inputs:
  build-path:
    description: 'Directory containing Spice binaries'
    required: true

runs:
  using: 'composite'
  steps:
    # Runner instances on a self-hosted host share $HOME, so a job there installs into
    # its own RUNNER_TEMP; otherwise concurrent jobs from different runs would replace
    # each other's binaries. `spice` runs the `spiced` beside it.
    - name: Install Spice binaries
      id: install
      shell: bash
      if: runner.os != 'Windows'
      run: |
        echo "Installing Spice from local folder: ${{ inputs.build-path }}"

        bin_dir="$HOME/.spice/bin"
        if [ "${RUNNER_ENVIRONMENT:-}" = "self-hosted" ]; then
          bin_dir="$RUNNER_TEMP/spice/bin"
        fi

        chmod +x "${{ inputs.build-path }}/spice"
        chmod +x "${{ inputs.build-path }}/spiced"

        mkdir -p "$bin_dir"

        mv "${{ inputs.build-path }}/spice" "$bin_dir"
        mv "${{ inputs.build-path }}/spiced" "$bin_dir"

        echo "$bin_dir" >> $GITHUB_PATH
        echo "bin-dir=$bin_dir" >> $GITHUB_OUTPUT

        echo "Spice binaries installed successfully into $bin_dir."
        ls -la "$bin_dir"

    - name: Install Spice binaries (Windows)
      shell: pwsh
      if: runner.os == 'Windows'
      run: |
        echo "Installing Spice from local folder: ${{ inputs.build-path }}"

        $spiceBin = ".spice\bin"
        $spiceInstallDir = Join-Path $HOME $spiceBin
        $spiceCliFileName = "spice.exe"
        $spiceRuntimeFileName = "spiced.exe"
        $spiceCliFullPath= Join-Path $spiceInstallDir $spiceCliFileName
        $spiceRuntimeFullPath= Join-Path $spiceInstallDir $spiceRuntimeFileName

        Write-Host "Spice Binaries directory created"
        New-Item -Path $spiceInstallDir -ItemType Directory -Force > $null

        Write-Host "Moving spice CLI"
        Move-Item -Force "${{ inputs.build-path }}\spice.exe" -Destination $spiceCliFullPath

        Write-Host "Moving spice Runtime"
        Move-Item -Force "${{ inputs.build-path }}\spiced.exe" -Destination $spiceRuntimeFullPath

        echo "$spiceInstallDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        Write-Host "Spice binaries installed successfully into $spiceInstallDir"
        Get-ChildItem -Path "$spiceInstallDir" -Force

    - name: Verify Spice installation
      shell: bash
      if: runner.os != 'Windows'
      env:
        SPICE_BIN_DIR: ${{ steps.install.outputs.bin-dir }}
      run: |
        # Verify binaries exist and are executable
        if [ ! -x "$SPICE_BIN_DIR/spice" ]; then
          echo "ERROR: spice binary not found or not executable"
          exit 1
        fi
        if [ ! -x "$SPICE_BIN_DIR/spiced" ]; then
          echo "ERROR: spiced binary not found or not executable"
          exit 1
        fi
        echo "Spice binaries verified successfully"
        # Test spiced --version directly to debug any issues
        echo "Testing spiced --version:"
        "$SPICE_BIN_DIR/spiced" --version 2>&1 || echo "spiced --version failed with exit code $?"
        # Show spice version (which calls spiced --version internally)
        echo "Testing spice version:"
        "$SPICE_BIN_DIR/spice" version 2>&1 || echo "spice version failed with exit code $?"

    - name: Verify Spice installation (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Verify binaries exist
        $spiceInstallDir = Join-Path $HOME ".spice\bin"
        if (!(Test-Path (Join-Path $spiceInstallDir "spice.exe"))) {
          Write-Error "spice.exe not found"
          exit 1
        }
        if (!(Test-Path (Join-Path $spiceInstallDir "spiced.exe"))) {
          Write-Error "spiced.exe not found"
          exit 1
        }
        Write-Host "Spice binaries verified successfully"
