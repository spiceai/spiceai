name: 'Seed the cold-start fixture'
description: |
  Generates the synthetic audit-events Delta Lake table that `test/spicepods/cold_start`
  loads and uploads it to MinIO, unless it is already there. Requires `setup-minio` first.
  The `_SEEDED` object at the table root marks a completed upload; without it, any
  partial upload is removed and the table is seeded again. Run it from one job at a
  time: concurrent seeds would interleave their Delta logs. A run off trunk seeds and reads its
  own copy under the bucket's `untrusted/<github.ref>/` (.github/actions/ci-store-prefix).
inputs:
  prefix:
    description: 'MinIO path of the table, `<bucket>/<path>` under the `spice-minio` alias; the CI store prefix goes after the bucket'
    required: false
    default: 'benchmarks/cold_start/audit_events_3m'
runs:
  using: 'composite'
  steps:
    - name: Choose the CI store prefix
      uses: $/.github/actions/ci-store-prefix

    - name: Check for the fixture
      id: fixture
      shell: bash
      env:
        INPUT_PREFIX: ${{ inputs.prefix }}
      run: |
        table="${INPUT_PREFIX%%/*}/${CI_STORE_PREFIX?}${INPUT_PREFIX#*/}"
        echo "table=${table}" >> "$GITHUB_OUTPUT"
        if mc stat "spice-minio/${table}/_SEEDED" >/dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Java
      if: steps.fixture.outputs.present != 'true'
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python
      if: steps.fixture.outputs.present != 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.11'

    - name: Generate and upload the fixture
      if: steps.fixture.outputs.present != 'true'
      shell: bash
      env:
        INPUT_PREFIX: ${{ steps.fixture.outputs.table }}
      run: |
        python -m pip install 'pyspark==3.5.5' 'delta-spark==3.3.2'
        python test/scripts/cold_start_delta_fixture.py --out "${RUNNER_TEMP}/cold_start_fixture" \
          --rows 3000000 --commits 24 --post-optimize-commits 8
        mc rm --recursive --force "spice-minio/${INPUT_PREFIX}/" || true
        mc cp --recursive "${RUNNER_TEMP}/cold_start_fixture/" "spice-minio/${INPUT_PREFIX}/"
        echo "seeded by ${GITHUB_REPOSITORY}@${GITHUB_SHA} run ${GITHUB_RUN_ID}" \
          | mc pipe "spice-minio/${INPUT_PREFIX}/_SEEDED"
