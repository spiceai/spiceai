name: 'Seed the cold-start fixture'
description: |
  Generates the synthetic audit-events Delta Lake table that `test/spicepods/cold_start`
  loads and uploads it to MinIO, unless it is already there. Requires `setup-minio` first.
  The `_SEEDED` object at the table root marks a completed upload; without it, any
  partial upload is removed and the table is seeded again. Run it from one job at a
  time: concurrent seeds would interleave their Delta logs.
inputs:
  prefix:
    description: 'MinIO path of the table, under the `spice-minio` alias'
    required: false
    default: 'benchmarks/cold_start/audit_events_3m'
runs:
  using: 'composite'
  steps:
    - name: Check for the fixture
      id: fixture
      shell: bash
      run: |
        if mc stat "spice-minio/${{ inputs.prefix }}/_SEEDED" >/dev/null 2>&1; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set up Java
      if: steps.fixture.outputs.present != 'true'
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python
      if: steps.fixture.outputs.present != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Generate and upload the fixture
      if: steps.fixture.outputs.present != 'true'
      shell: bash
      run: |
        python -m pip install 'pyspark==3.5.5' 'delta-spark==3.3.2'
        python test/scripts/cold_start_delta_fixture.py --out "${RUNNER_TEMP}/cold_start_fixture" \
          --rows 3000000 --commits 24 --post-optimize-commits 8
        mc rm --recursive --force "spice-minio/${{ inputs.prefix }}/" || true
        mc cp --recursive "${RUNNER_TEMP}/cold_start_fixture/" "spice-minio/${{ inputs.prefix }}/"
        echo "seeded by ${GITHUB_REPOSITORY}@${GITHUB_SHA} run ${GITHUB_RUN_ID}" \
          | mc pipe "spice-minio/${{ inputs.prefix }}/_SEEDED"
