# Crate layering manifest — see docs/dev/crate_layering.md
#
# `scripts/check_crate_layers.py` reads this file and the workspace dependency
# graph, then fails if any *normal* dependency edge points to a crate in a
# HIGHER tier. Only `kind = "normal"` edges are checked; dev- and
# build-dependencies are exempt. Tiers are listed low -> high; a crate may
# depend only on crates in its own tier or a lower one.
#
# This encodes the layering that ALREADY holds on the current tree so it cannot
# regress. It is NOT the target architecture — notably, connectors currently sit
# in `extension` (ABOVE `runtime`) because the `DataConnector` trait/registry
# live in the `runtime` crate. The target is to invert that so connectors live
# in a `data` tier BELOW `runtime`. See docs/dev/crate_layering.md for the plan
# and for how to tighten these rules as crates move.

# Tiers, lowest first. A dependency edge must go to this tier or lower.
#
# The two "utility" tiers split what used to be one `domain` tier by *who is
# allowed to build on the crate*:
#   - shared-utility   — below `runtime`, so `runtime` (and everything under it)
#                        may depend on it. The always-shipped building blocks.
#   - extension-utility — above `runtime`, below `extension`. Only extensions may
#                        depend on it; `runtime` cannot. Connector-specific
#                        building blocks that no runtime code touches live here.
#                        These should themselves depend ONLY on foundation/
#                        shared-utility (at most the runtime-*-api interface
#                        crates) — NOT on the `runtime` crate. The linear order
#                        enforces runtime->extension-utility (rejected as
#                        upward); the reverse is enforced by `forbid` below.
# Extensions may therefore depend on BOTH utility tiers; `runtime-*` may depend
# only on shared-utility. See docs/dev/crate_layering.md.
order = ["foundation", "shared-utility", "runtime", "extension-utility", "extension", "binary"]

# Crates not matched by a rule or override land here. shared-utility is the
# conservative default: it sits below `runtime`, so runtime may build on it. A
# connector-specific utility must be deliberately placed in extension-utility.
default_tier = "shared-utility"

# Explicit forbidden tier edges, checked IN ADDITION to the upward-edge rule —
# for constraints the linear tier order can't express. Each entry is a
# [from_tier, to_tier] pair; an edge whose endpoints match is a violation even
# when it points "downward". extension-utility sits ABOVE runtime, so
# runtime->extension-utility is already caught as upward; this forbids the
# REVERSE, keeping connector-only building blocks from pulling in the
# orchestrator (they may still use the low runtime-*-api interface crates).
forbid = [["extension-utility", "runtime"]]

# Dependency-ownership rules, checked IN ADDITION to the tier rule. The tier check
# only catches UPWARD edges; a driver/format crate sits at/below `foundation`, so a
# normal-dependency on it from ANYWHERE is a legal *downward* edge the tier check
# cannot flag. This table confines such a crate to its owning connector(s): a normal
# dep on a restricted crate from any crate NOT listed is a violation. The key may be
# an external crate; every listed crate must be a real workspace member. Dev/build
# deps are exempt. Ratchet: add one entry per source as its driver is fully evacuated
# into the corresponding connector crate (see docs/dev/crate_layering.md).
[restricted_deps]
# clickhouse-rs now lives only in connector-clickhouse (provider + pool + block
# decoder all moved out of data_components / db_connection_pool / arrow_sql_gen).
clickhouse-rs = ["connector-clickhouse"]
# The mongodb driver moved out of data_components into connector-mongodb (runtime keeps it as a
# dev-dep-exempt test dependency; the spice_sys/mongodb resume-token checkpoint stores JSON, no driver). spidapter is the MongoDB bench/adapter tool.
mongodb = ["connector-mongodb", "spidapter"]

# The DynamoDB AWS SDK drivers moved out of runtime + data_components into
# connector-dynamodb. `dynamodb-streams` is the low-level streams client the
# connector builds on; `testoperator`/`spidapter` drive DynamoDB in bench/adapter
# tooling. runtime keeps aws-sdk-dynamodb only as a (dev-dep-exempt) test dependency,
# so it is intentionally absent here — a normal-dep regression into runtime/
# data_components would fail this guard.
aws-sdk-dynamodbstreams = ["connector-dynamodb", "dynamodb-streams"]
aws-sdk-dynamodb = ["connector-dynamodb", "dynamodb-streams", "testoperator", "spidapter"]

# git2 now lives only in connector-git (the git provider moved out of data_components).
git2 = ["connector-git"]

# The IMAP driver stack (imap client + charset + mailparse) moved out of
# data_components into connector-imap.
charset = ["connector-imap"]
imap = ["connector-imap"]
mailparse = ["connector-imap"]

# scylla now lives only in connector-scylladb (provider + pool + connection all moved
# out of data_components / db_connection_pool), like clickhouse-rs.
scylla = ["connector-scylladb"]

# odbc-api + arrow-odbc now live only in connector-odbc (provider + pool + connection
# all moved out of data_components / db_connection_pool), like clickhouse-rs.
odbc-api = ["connector-odbc"]
arrow-odbc = ["connector-odbc"]
# Azure Cosmos DB provider (client + resilience + schema inference) moved out of
# data_components into connector-cosmosdb. `azure_data_cosmos` is Cosmos-specific
# and now lives only there. (`azure_core` is intentionally NOT confined — it is
# shared by runtime/runtime-secrets for Azure Blob storage + Key Vault secrets.)
azure_data_cosmos = ["connector-cosmosdb"]

# SharePoint/OneDrive provider (Graph client + object-store + auth + table)
# moved out of data_components into connector-sharepoint. The Microsoft Graph
# SDK now lives only there.
graph-rs-sdk = ["connector-sharepoint"]

# Path-prefix rules (checked after per-crate overrides, in order).
[[rules]]
path_prefix = "bin/"
tier = "binary"

[[rules]]
path_prefix = "tools/"
tier = "binary"

[[rules]]
path_prefix = "crates/data-connectors/"
tier = "extension"

[[rules]]
path_prefix = "crates/vendor/"
tier = "foundation"

# Per-crate overrides win over rules.
[override]
runtime = "runtime"
# Config-only component specs (DatasetSpec/CatalogSpec/ViewSpec + their config
# submodules) carved out of the `runtime` crate body. It names nothing from
# `runtime` (no Arc<Runtime>/App/secrets/datafusion) and its own deps are all
# shared-utility/foundation, so it sits below `runtime` — which is what lets the
# interface crates a connector needs (data-connector-api) name a component's
# configuration without pulling in the orchestrator.
runtime-component = "shared-utility"
# Extensions that sit above the runtime crate (depend on `runtime`).
spice-cloud = "extension"
tpc-extension = "extension"
# TEMPORARY (see docs/dev/crate_layering.md). This crate lives under
# crates/data-connectors/ (which the path rule would place in `extension`), but
# it is a leaf helper — its entire workspace-internal dep closure is empty (only
# external deps: datafusion-common, datafusion-table-providers, snafu,
# tokio-postgres). It holds the PostgreSQL catalog/CDC-support queries
# (list_schemas/list_tables/primary_key_columns/check_cdc_prerequisites), which
# `data_components::postgres::provider` re-exports so `runtime` reaches them
# WITHOUT a direct dependency on a connector-* crate. Placing it in
# `shared-utility` keeps the data_components -> connector-postgres-common edge a
# legal same-tier dep. The eventual goal is to consolidate ALL PostgreSQL
# functionality — `data_components::postgres`, this crate, and
# `runtime::catalogconnector::postgres_accelerated` — into a single
# `connector-postgres` crate that owns the CDC mechanisms; once runtime no longer
# depends (even transitively via re-export) on these queries, drop this override
# so the crate returns to the default `extension` tier.
connector-postgres-common = "shared-utility"

# --- foundation: near-dependency-free utilities + config/platform primitives.
# (crates/ libraries whose full normal-dep closure stays within foundation.)
ansi_colors = "foundation"
arrow_tools = "foundation"
aws-sdk-credential-bridge = "foundation"
chunking = "foundation"
# Shared by implementations outside this repo via a git dependency, so its
# dependency closure has to stay small — foundation is also a budget here.
cloud-connect-crypto = "foundation"
cpu-budget = "foundation"
dataformat-json = "foundation"
datafusion-dml = "foundation"
datafusion-flightsql = "foundation"
db_connection_pool = "foundation"
document_parse = "foundation"
dotenv = "foundation"
duration-parse = "foundation"
dynamodb-streams = "foundation"
elasticsearch = "foundation"
event_stream = "foundation"
flight_client = "foundation"
google-genai = "foundation"
hash-index = "foundation"
libnfs = "foundation"
ns_lookup = "foundation"
object_store_occ = "foundation"
otel-arrow = "foundation"
repl = "foundation"
runtime-api-types = "foundation"
runtime-async = "foundation"
# Interface crate: the accelerator (runtime side) satisfies CheckpointStore; a
# connector only calls it, so it lives low (foundation) below both.
runtime-checkpoint-api = "foundation"
runtime-cloud-connect = "foundation"
runtime-datafusion-index = "foundation"
runtime-metrics = "foundation"
runtime-object-store = "foundation"
runtime-parameter-spec = "foundation"
runtime-parameters-typed = "foundation"
runtime-proto = "foundation"
runtime-query-engine = "foundation"
runtime-rate-control = "foundation"
runtime-status = "foundation"
s3_vectors = "foundation"
s3_vectors_metadata_filter = "foundation"
scheduler = "foundation"
smb = "foundation"
spice-cloud-client = "foundation"
spicepod = "foundation"
system-open = "foundation"
telemetry = "foundation"
token_provider = "foundation"
tools = "foundation"
turso-shared = "foundation"
util = "foundation"
vortex-datafusion = "foundation"
yaml = "foundation"

# --- shared-utility: composable libraries the runtime is built from (default
# tier, but listed here for clarity / auditability). Everything else defaults to
# `shared-utility`:
#   app, cache, cayenne, data-accelerator-api, data_components, datafusion-ddl,
#   datafusion-optimizer-rules, llms, package, runtime-acceleration,
#   runtime-auth, runtime-cluster, runtime-datafusion, runtime-datafusion-udfs,
#   runtime-parameters, runtime-request-context, runtime-search, runtime-secrets,
#   runtime-table-partition, runtime-tools, search, test-framework, workers
#
# --- extension-utility: connector-specific building blocks that only extensions
# depend on (never `runtime`). Populated as the data_components monolith is
# dissolved and connector-only deps are lifted out of `foundation`; a crate can
# move here only once nothing at or below `runtime` still depends on it.
