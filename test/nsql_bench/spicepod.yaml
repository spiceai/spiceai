version: v1
kind: Spicepod
name: "nsql_benchmark"

default_acceleration: &default_acceleration
  enabled: true
  mode: file
  engine: duckdb

models:
  - name: gpt-4o-mini
    from: openai:gpt-4o-mini
    params:
      spice_tools: auto
      openai_api_key: ${ secrets:SPICE_OPENAI_API_KEY }
      system_prompt: |
        Use the SQL tool when:
          1. The query involves precise numerical data, statistics, or aggregations
          2. The user asks for specific counts, sums, averages, or other calculations
          3. The query requires joining or comparing data from multiple related tables

        Instructions for Responses:
          1. When the answer is known, return a single value without any formatting.
          2. If the answer is not known, respond with "I don't know" and do NOT guess.
          3. Ensure responses are concise and to the point.

evals:
  - name: tpch_nsql
    dataset: tpch_nsql
    scorers:
      - match

datasets:

  - from: file:./tpch_nsql.jsonl
    name: tpch_nsql

  - from: s3://spiceai-demo-datasets/tpch/customer/
    name: customer
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/lineitem/
    name: lineitem
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/nation/
    name: nation
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/orders/
    name: orders
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/part/
    name: part
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/partsupp/
    name: partsupp
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/region/
    name: region
    params:
      file_format: parquet
    acceleration: *default_acceleration

  - from: s3://spiceai-demo-datasets/tpch/supplier/
    name: supplier
    params:
      file_format: parquet
    acceleration: *default_acceleration
