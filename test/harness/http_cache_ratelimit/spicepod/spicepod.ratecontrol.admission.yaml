version: v1
kind: Spicepod
name: http-cache-ratelimit-ratecontrol-admission

# Phase 2, admission-coefficient strategy. Two federated HTTP datasets, one
# per origin. #14143 ships a single admission-coefficient strategy (an
# exponentially-decayed accept/request ratio) — `http_adaptive_rate_control`
# is only `enabled`/`disabled`; there is no separate AIMD control law. Every
# ratecontrol-* scenario in run_phase2.py (ratecontrol-admission,
# ratecontrol-cooldown, ratecontrol-ietf-headers) shares this one pod. K
# comes from the `_failure_threshold` param, not a numeric value on the
# switch itself:
#
#   http_adaptive_rate_control: enabled
#   http_adaptive_rate_control_failure_threshold: "10%"  -> K = 1/(1-0.1) = 1.111
#   http_adaptive_rate_control_window: "3s"
#
# coefficient = min(1, (K*accepts + 1) / (requests + 1))
# over the `_window` exponentially-decaying half-life. run_phase2.py's oracle
# must be run with the ADMISSION_K and ADMISSION_WINDOW_S env vars set to
# match the values above (defaults in run_phase2.py assume K=2.0/window=10s).
#
# The static limit is still required (adaptive control modifies a defined
# limit); it is the scale the reported effective_limit is expressed on.

runtime:
  telemetry:
    enabled: true
  task_history:
    enabled: true
  query:
    # Unset defaults to 4 plans/core from the CPU budget (40 on this box).
    # runtime.query.max_concurrent_queries's permit is held for a query
    # plan's FULL execution/result-streaming lifetime -- including any time
    # spent blocked on an HTTP rate-control permit -- so a heavily throttled
    # origin's queries can saturate this global admission bound and starve
    # an unrelated, never-faulted origin's queries of a slot too. `0` opts
    # out of admission control entirely; used here to test that hypothesis.
    max_concurrent_queries: 0
  caching:
    sql_results:
      enabled: false
  params:
    http_adaptive_rate_control: enabled
    http_adaptive_rate_control_failure_threshold: "10%"
    http_adaptive_rate_control_window: "3s"
    http_requests_per_second_limit: "100"

datasets:
  - from: http://127.0.0.1:9001/data
    name: d1
    params:
      file_format: json
      client_timeout: "2"
      connect_timeout: "1s"
      allowed_request_paths: "/data"
      # Each distinct `request_query` value is its own upstream request, so
      # the offered load hits many keys per origin, not a single endpoint.
      request_query_filters: enabled
    columns:
      # HTTP metadata column (passed through, not JSON-shredded). Declaring it
      # puts `request_query` in the schema so `WHERE request_query = '...'`
      # plans instead of being rejected as an unknown column.
      - name: request_query
        type: text
      - name: id
        type: bigint
      - name: version
        type: bigint
      - name: served_at_ms
        type: bigint
      - name: origin
        type: text
      - name: payload
        type: text
      - name: extra
        type: text
        metadata:
          json_object: "*"

  - from: http://127.0.0.1:9002/data
    name: d2
    params:
      file_format: json
      client_timeout: "2"
      connect_timeout: "1s"
      allowed_request_paths: "/data"
      # Each distinct `request_query` value is its own upstream request, so
      # the offered load hits many keys per origin, not a single endpoint.
      request_query_filters: enabled
    columns:
      # HTTP metadata column (passed through, not JSON-shredded). Declaring it
      # puts `request_query` in the schema so `WHERE request_query = '...'`
      # plans instead of being rejected as an unknown column.
      - name: request_query
        type: text
      - name: id
        type: bigint
      - name: version
        type: bigint
      - name: served_at_ms
        type: bigint
      - name: origin
        type: text
      - name: payload
        type: text
      - name: extra
        type: text
        metadata:
          json_object: "*"
