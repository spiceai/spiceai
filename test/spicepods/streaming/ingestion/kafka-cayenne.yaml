version: v2
kind: Spicepod
name: streaming-ingestion-kafka-cayenne

datasets:
  - from: kafka:events
    name: events
    params:
      kafka_bootstrap_servers: localhost:9092
      kafka_security_protocol: PLAINTEXT
      kafka_consumer_group_id: spice-ingestion-placeholder
      kafka_message_format: json
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: append
    metrics:
      - name: records_consumed_total
