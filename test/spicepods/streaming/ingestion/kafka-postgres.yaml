version: v1
kind: Spicepod
name: streaming-ingestion-kafka-postgres

datasets:
  - from: kafka:events
    name: events
    params:
      kafka_bootstrap_servers: localhost:9092
      kafka_security_protocol: PLAINTEXT
      kafka_consumer_group_id: spice-ingestion-placeholder
      kafka_message_format: json
    acceleration:
      enabled: true
      engine: postgres
      refresh_mode: append
      params:
        pg_host: ${env:ACCEL_PG_HOST}
        pg_port: ${env:ACCEL_PG_PORT}
        pg_db: ${env:ACCEL_PG_DB}
        pg_user: ${env:ACCEL_PG_USER}
        pg_pass: ${env:ACCEL_PG_PASSWORD}
    metrics:
      - name: records_consumed_total
