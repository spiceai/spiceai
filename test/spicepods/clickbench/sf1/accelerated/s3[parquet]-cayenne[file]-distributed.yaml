version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]-distributed
datasets:
  - from: s3://spiceai-public-datasets/clickbench/hits.parquet
    name: hits
    params:
      file_format: parquet
      s3_auth: public
      s3_region: us-east-1
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, "EventTime")
