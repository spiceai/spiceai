version: v1
kind: Spicepod
name: spicecloud-cayenne[file]
datasets:
  - from: spice.ai:spiceai/benchmarks-clickbench/datasets/clickbench.hits
    name: hits
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
    params:
      spiceai_api_key: ${secrets:SPICEAI_CLICKBENCH_API_KEY}
      spiceai_region: us-east-1