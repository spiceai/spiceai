version: v1
kind: Spicepod
name: spicecloud-arrow
datasets:
  - from: spice.ai:spiceai/benchmarks-clickbench/datasets/clickbench.hits
    name: hits
    acceleration:
      enabled: true
      engine: arrow
      # dev-runners do not have enough memory for full clickbench.
      # Limit data but ensure certain questions have sufficient data
      refresh_sql: |
        SELECT *
        FROM hits
        WHERE "UserID" = 435090932899640449 -- q20
        -- q42
        OR (
          "CounterID" = 62 AND to_timestamp("EventDate" * 86400) >= '2013-07-01' AND to_timestamp("EventDate" * 86400) <= '2013-07-31' AND "IsRefresh" = 0 AND "DontCountHits" = 0 AND "URLHash" = 2868770270353813622
        )
        -- Add more generic data to get close to limit
        OR (
          date_trunc('day', to_timestamp("EventTime")) >= '2013-07-01' AND date_trunc('day', to_timestamp("EventTime")) <= '2013-07-14'
        )
        LIMIT 50000000
    params:
      spiceai_api_key: ${secrets:SPICEAI_CLICKBENCH_API_KEY}
      spiceai_region: us-east-1
