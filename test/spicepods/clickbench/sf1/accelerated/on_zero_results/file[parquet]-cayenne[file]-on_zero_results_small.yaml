version: v1
kind: Spicepod
name: file[parquet]-cayenne[file]-on_zero_results_small
datasets:
  - from: file:data/hits_0.parquet
    name: hits
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_sql: "SELECT * FROM hits LIMIT 0"
      on_zero_results: use_source
