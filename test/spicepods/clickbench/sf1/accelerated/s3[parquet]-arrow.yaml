version: v1
kind: Spicepod
name: s3[parquet]-arrow
datasets:
  - from: s3://benchmarks/clickbench/hits.parquet
    name: hits
    params:
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      enabled: true
      engine: arrow
      # dev-runners do not have enough memory for full clickbench in-memory.
      # Limit data but ensure certain questions have sufficient data
      refresh_sql: |
        SELECT *
        FROM hits
        WHERE "UserID" = 435090932899640449 -- q20
        -- q42
        OR (
          "CounterID" = 62 AND to_timestamp("EventDate" * 86400) >= '2013-07-01' AND to_timestamp("EventDate" * 86400) <= '2013-07-31' AND "IsRefresh" = 0 AND "DontCountHits" = 0 AND "URLHash" = 2868770270353813622
        )
        -- Add more generic data to get close to limit
        OR (
          date_trunc('day', from_unixtime("EventTime")) >= '2013-07-01' AND date_trunc('day', from_unixtime("EventTime")) <= '2013-07-14'
        )
        LIMIT 50000000
