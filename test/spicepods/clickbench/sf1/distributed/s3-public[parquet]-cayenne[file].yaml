version: v1
kind: Spicepod
name: s3-public[parquet]-cayenne[file]-distributed
# ClickBench SF1 served by a single Cayenne file-mode acceleration partitioned
# by UserID. This complements TPCH/TPCDS by exercising the distributed
# acceleration path on a wide single-table analytical workload.
datasets:
  - from: s3://spiceai-public-datasets/clickbench/hits.parquet
    name: hits
    params:
      file_format: parquet
      s3_auth: public
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      params:
        partition_mode: tables
      partition_by:
        - bucket(10, UserID)
