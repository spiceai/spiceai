version: v1
kind: Spicepod
name: mysql-cayenne[file]-full-refresh

# Full-refresh variant of postgres-cayenne[file].yaml, intended for the `bench` workflow
# (no OLTP load) for robust explain-plan snapshots for analytical queries.

mysql_connection_params: &mysql_params
  mysql_host: ${env:CHBENCH_MYSQL_HOST}
  mysql_tcp_port: 3306
  mysql_db: chbench
  mysql_user: bench
  mysql_pass: bench
  mysql_sslmode: disabled

cayenne_full_accel: &cayenne_accel
  enabled: true
  engine: cayenne
  mode: file
  refresh_mode: full

runtime:
  query:
    target_partitions: 48
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: false

datasets:
  # ---- TPC-C core tables (mutated by OLTP in the CDC configs; full-refresh here) ----

  - from: mysql:warehouse
    name: warehouse
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: w_id
      on_conflict:
        w_id: upsert

  - from: mysql:district
    name: district
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (d_w_id, d_id)
      on_conflict:
        (d_w_id, d_id): upsert

  - from: mysql:customer
    name: customer
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (c_w_id, c_d_id, c_id)
      on_conflict:
        (c_w_id, c_d_id, c_id): upsert

  - from: mysql:new_order
    name: new_order
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (no_w_id, no_d_id, no_o_id)
      on_conflict:
        (no_w_id, no_d_id, no_o_id): upsert

  - from: mysql:oorder
    name: oorder
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (o_w_id, o_d_id, o_id)
      on_conflict:
        (o_w_id, o_d_id, o_id): upsert

  - from: mysql:order_line
    name: order_line
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (ol_w_id, ol_d_id, ol_o_id, ol_number)
      on_conflict:
        (ol_w_id, ol_d_id, ol_o_id, ol_number): upsert

  - from: mysql:stock
    name: stock
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: (s_w_id, s_i_id)
      on_conflict:
        (s_w_id, s_i_id): upsert

  # ---- Static reference tables ----

  - from: mysql:item
    name: item
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: i_id
      on_conflict:
        i_id: upsert

  - from: mysql:region
    name: region
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: r_regionkey
      on_conflict:
        r_regionkey: upsert

  - from: mysql:nation
    name: nation
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: n_nationkey
      on_conflict:
        n_nationkey: upsert

  - from: mysql:supplier
    name: supplier
    params:
      <<: *mysql_params
    acceleration:
      <<: *cayenne_accel
      primary_key: su_suppkey
      on_conflict:
        su_suppkey: upsert
