version: v1
kind: Spicepod
name: postgres-cayenne[file]-adaptive-4slots

# 4-SHARED-SLOT variant of `postgres-cayenne[file]-adaptive`. IDENTICAL to that pod (adaptive
# self-tuning: `cayenne_tuning: adaptive` + `schema_inference: extended` on every dataset, the
# global `cayenne_goal_*` SLOs, no hand-pinned actuator knobs) EXCEPT the changes-mode tables are
# split across 4 shared replication slots instead of one slot per table. Kept as a SEPARATE pod so
# the slot topology can be A/B'd against the slot-per-table baseline (`-adaptive`) and the single
# shared slot (`-adaptive-1slot`) while holding the adaptive tuning constant — isolating the effect
# of replication-slot fan-out on the shared CDC pump.
#
# GROUPED SHARED REPLICATION SLOTS (4 groups) for the changes-mode tables.
# Each Postgres logical slot spawns ONE walsender that decodes the FULL WAL stream and filters to
# its tables, so server decode cost scales with the slot COUNT — while a single slot funnels the
# whole change stream through ONE client pump. 4 groups isolates BOTH heavy producers
# (order_line, stock) on their own pumps, isolates the bursty apply-bound new_order (so its write
# bursts cannot head-of-line-block a shared connection), and shares only the light upsert tables
# (customer/district/oorder/warehouse). Server decode is held at 4x (vs 7x slot-per-table):
#   spiceai_cdc_order_line -> order_line  (heaviest producer; own pump)
#   spiceai_cdc_stock      -> stock       (2nd heaviest; own pump)
#   spiceai_cdc_ref        -> customer, district, oorder, warehouse (light; shared)
#   spiceai_cdc_new_order  -> new_order   (bursty apply-bound; isolated for HOL safety)
# Each group derives its own `{slot}_pub`; connection params match via the anchor. Trade-off
# retained per-group: confirmed_flush_lsn is the min across a group's members, so a stall pins WAL
# retention for that group only (fine for the bench).
#
# As in `-adaptive`, no primary_key / on_conflict / indexes are declared: `schema_inference:
# extended` detects them from the PostgreSQL source and seeds the upsert on_conflict the CDC
# (changes) path requires. sql_results / task_history stay off to match the baseline.

postgres_connection_params: &postgres_params
  pg_host: ${env:CHBENCH_PG_HOST}
  pg_port: 5432
  pg_db: chbench
  pg_user: bench
  pg_pass: bench
  pg_sslmode: disable

runtime:
  flight:
    ipc_compression: lz4_frame
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: false
  # Goal-driven adaptive SLOs, set GLOBALLY once here and inherited by every Cayenne
  # dataset. These are the high-level targets the closed loop converges toward — NOT
  # actuator knobs. QPH is GLOBAL-ONLY (measured across all datasets).
  params:
    cayenne_goal_replication_lag: '5s'
    cayenne_goal_freshness: '30s'
    cayenne_goal_query_latency: '10s'
    cayenne_goal_qph: '5000'

datasets:
  # ---- TPC-C core tables (mutated by OLTP workload) ----
  # No primary_key / on_conflict / indexes: `schema_inference: extended` detects them from the
  # PostgreSQL source and seeds the upsert on_conflict the CDC (changes) path requires.

  - from: postgres:warehouse
    name: warehouse
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_ref
      pg_replication_initial_snapshot: 'true'
    acceleration: &cayenne_accel
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      params: &cayenne_params
        cayenne_tuning: adaptive
        # In-memory CDC intra-apply sharding: 4 PK-hash shards validate+append in
        # parallel within one apply on the memory-tier (changes) tables. Inert on the
        # full-refresh reference tables that share this anchor (not CDC memory mode).
        cayenne_cdc_mem_tier_shards: '4'
        # Goal-driven SLOs are set globally under `runtime.params` (above) and
        # inherited by every dataset, so they are intentionally not repeated here.

  - from: postgres:district
    name: district
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_ref
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  - from: postgres:customer
    name: customer
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_ref
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  - from: postgres:new_order
    name: new_order
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_new_order
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  - from: postgres:oorder
    name: oorder
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_ref
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  - from: postgres:order_line
    name: order_line
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_order_line
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  - from: postgres:stock
    name: stock
    schema_inference: extended
    params:
      <<: *postgres_params
      pg_replication_slot: spiceai_cdc_stock
      pg_replication_initial_snapshot: 'true'
    acceleration: *cayenne_accel

  # ---- Static reference tables (no OLTP mutations, full refresh) ----
  # Same: PK / on_conflict / indexes come from extended inference.

  - from: postgres:item
    name: item
    schema_inference: extended
    params:
      <<: *postgres_params
    acceleration: &cayenne_accel_full
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      params: *cayenne_params

  - from: postgres:region
    name: region
    schema_inference: extended
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full

  - from: postgres:nation
    name: nation
    schema_inference: extended
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full

  - from: postgres:supplier
    name: supplier
    schema_inference: extended
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full
