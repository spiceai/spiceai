version: v1
kind: Spicepod
name: postgres-cayenne[file]-cdc-tuned-cold-sf10

# Datalake (cold) tier variant of `…-cdc-tuned-sf10`, sized for LOCAL verification and PR-scale
# smoke runs: the same tuning as sf10, plus the third storage tier (RAM mem-tier -> warm
# local-disk Vortex -> COLD object store) on the high-volume tables with a deliberately LOW
# promotion trigger (256 MB) so warm->cold graduations actually fire at SF10 volumes.
#
# The cold store is MinIO/S3 via the dedicated `cayenne_datalake_s3_*` credentials — the engine
# registers the store on the promotion, scan, and delete paths itself (no anchor dataset).
# Locally: run MinIO (`docker run -p 9000:9000 minio/minio server /data`), create the
# `benchmarks` bucket, and export S3_ENDPOINT=http://localhost:9000 S3_KEY/S3_SECRET before
# starting spiced/testoperator. In CI the HTAP run workflow provides them from TEST_MINIO_*.
runtime:
  params:
    cdc_prefetch_buffer: '16384'
    cdc_max_coalesced_envelopes: '16384'
    cdc_max_coalesced_bytes: '536870912' # 512 MB
    cdc_max_coalesce_age_ms: '4000'
    cdc_commit_timeout_ms: '60000'
    cayenne_sort_merge_min_rows: '50000000'
    cayenne_footer_cache_mb: '1024'
    cayenne_metastore_cache_mb: '1024'
    cayenne_metastore_mmap_mb: '4096'
  query:
    target_partitions: 48
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: false

postgres_connection_params: &postgres_params
  pg_host: ${env:CHBENCH_PG_HOST}
  pg_port: '5432'
  pg_db: chbench
  pg_user: bench
  pg_pass: bench
  pg_sslmode: disable

datasets:
  # ------------------------------------------------------------------
  # High-volume PK upsert tables (datalake tier enabled).
  # ------------------------------------------------------------------

  - from: postgres:district
    name: district
    params:
      <<: *postgres_params
      pg_replication_slot: spice_district
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (d_w_id, d_id)
      on_conflict:
        (d_w_id, d_id): upsert
      params: &accel_high_volume
        cayenne_metastore: sqlite
        cayenne_file_path: .spice/cayenne/district
        cayenne_write_concurrency: '4'
        cayenne_segment_cache_mb: '1024'
        cayenne_compaction_trigger_protected_snapshots: '3'
        cayenne_pk_keyset_cache_mb: '1024'
        cayenne_compaction_trigger_snapshot_age_ms: '15000'
        cayenne_compaction_max_files_per_pick: '64'
        cayenne_compaction_background_interval_ms: '3000'
        # --- Datalake (cold) object-store tier. Location namespaced by table_id, so one shared
        # prefix is safe for every table. LOW 256 MB trigger so promotions fire at SF10. ---
        cayenne_datalake_location: s3://benchmarks/cayenne-cold-sf10/
        cayenne_datalake_s3_auth: key
        cayenne_datalake_s3_endpoint: ${secrets:S3_ENDPOINT}
        cayenne_datalake_s3_key: ${secrets:S3_KEY}
        cayenne_datalake_s3_secret: ${secrets:S3_SECRET}
        cayenne_datalake_s3_allow_http: 'true'
        # Expert overrides (mechanics; auto-tuned once the size trigger lands):
        cayenne_datalake_warm_max_bytes: '268435456' # 256 MB — low so SF10 promotes
        cayenne_datalake_target_file_size_mb: '512'
        cayenne_datalake_tiering_check_interval_ms: '15000'

  - from: postgres:customer
    name: customer
    params:
      <<: *postgres_params
      pg_replication_slot: spice_customer
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (c_w_id, c_d_id, c_id)
      on_conflict:
        (c_w_id, c_d_id, c_id): upsert
      params:
        <<: *accel_high_volume
        cayenne_file_path: .spice/cayenne/customer
        cayenne_target_file_size_mb: '256'

  - from: postgres:new_order
    name: new_order
    params:
      <<: *postgres_params
      pg_replication_slot: spice_new_order
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (no_w_id, no_d_id, no_o_id)
      on_conflict:
        (no_w_id, no_d_id, no_o_id): upsert
      params:
        <<: *accel_high_volume
        cayenne_file_path: .spice/cayenne/new_order

  - from: postgres:oorder
    name: oorder
    params:
      <<: *postgres_params
      pg_replication_slot: spice_oorder
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (o_w_id, o_d_id, o_id)
      on_conflict:
        (o_w_id, o_d_id, o_id): upsert
      params:
        <<: *accel_high_volume
        cayenne_file_path: .spice/cayenne/oorder

  - from: postgres:order_line
    name: order_line
    params:
      <<: *postgres_params
      pg_replication_slot: spice_order_line
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (ol_w_id, ol_d_id, ol_o_id, ol_number)
      on_conflict:
        (ol_w_id, ol_d_id, ol_o_id, ol_number): upsert
      params:
        <<: *accel_high_volume
        cayenne_file_path: .spice/cayenne/order_line
        cayenne_write_concurrency: '4'
        cayenne_target_file_size_mb: '256'
        cayenne_compaction_trigger_files: '8'
        cayenne_compaction_trigger_snapshot_age_ms: '30000'
        cayenne_compaction_max_files_per_pick: '128'
        cayenne_segment_cache_mb: '2048'

  - from: postgres:stock
    name: stock
    params:
      <<: *postgres_params
      pg_replication_slot: spice_stock
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: (s_w_id, s_i_id)
      on_conflict:
        (s_w_id, s_i_id): upsert
      params:
        <<: *accel_high_volume
        cayenne_file_path: .spice/cayenne/stock
        cayenne_target_file_size_mb: '256'

  # ------------------------------------------------------------------
  # Low-volume reference tables (stay warm — no datalake tier).
  # ------------------------------------------------------------------

  - from: postgres:warehouse
    name: warehouse
    params:
      <<: *postgres_params
      pg_replication_slot: spice_warehouse
      pg_replication_initial_snapshot: 'true'
      pg_replication_bootstrap_batch_size: '1048576'
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      primary_key: w_id
      on_conflict:
        w_id: upsert
      params: &accel_medium
        cayenne_metastore: sqlite
        cayenne_file_path: .spice/cayenne/warehouse
        cayenne_write_concurrency: '4'
        cayenne_segment_cache_mb: '64'
        # Pin 1 GiB explicitly (don't leave to the backwards memory-aware auto-default).
        cayenne_pk_keyset_cache_mb: '1024'

  # ------------------------------------------------------------------
  # Static reference tables (no OLTP mutations, full refresh).
  # ------------------------------------------------------------------

  - from: postgres:item
    name: item
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      primary_key: i_id
      on_conflict:
        i_id: upsert
      params:
        <<: *accel_medium
        cayenne_file_path: .spice/cayenne/item

  - from: postgres:region
    name: region
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      primary_key: r_regionkey
      on_conflict:
        r_regionkey: upsert
      params: &accel_small
        cayenne_metastore: sqlite
        cayenne_file_path: .spice/cayenne/region
        cayenne_write_concurrency: '2'
        cayenne_segment_cache_mb: '16'
        # Pin 1 GiB explicitly (don't leave to the backwards memory-aware auto-default).
        cayenne_pk_keyset_cache_mb: '1024'

  - from: postgres:nation
    name: nation
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      primary_key: n_nationkey
      on_conflict:
        n_nationkey: upsert
      params:
        <<: *accel_small
        cayenne_file_path: .spice/cayenne/nation

  - from: postgres:supplier
    name: supplier
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      primary_key: su_suppkey
      on_conflict:
        su_suppkey: upsert
      params:
        <<: *accel_small
        cayenne_file_path: .spice/cayenne/supplier
