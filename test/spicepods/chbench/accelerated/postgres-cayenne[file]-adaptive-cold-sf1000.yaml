version: v1
kind: Spicepod
name: postgres-cayenne[file]-adaptive-cold-sf1000

# Adaptive-tuning variant of `…-cdc-tuned-memory-cold-sf1000`: the same three-tier storage cascade
# (RAM mem-tier -> warm local-disk Vortex -> COLD object store), but every Cayenne table runs
# `cayenne_tuning: adaptive` instead of the hand-pinned knobs. The runtime warm-starts each adaptive
# actuator (inline-flush, mem-tier bytes, compaction interval / trigger-files, deletion-index bake,
# write concurrency, WARM target file size, query-admission reserve) from the detected host
# (schema inference is always on), then adapts them toward the `cayenne_goal_*` SLOs.
#
# The cold (datalake) tier is NOT adaptive-tuned — no cold knob is an actuator — so its static knobs
# are set explicitly on the high-volume tables and collapse no adaptive tuning bound:
#   - cayenne_datalake_location                enables the tier (unset => disabled). Datalake + an
#                                              inferred PK auto-forces deletion_mode: key, so
#                                              cayenne_deletion_mode is intentionally left unset.
#   - cayenne_datalake_warm_max_bytes         4 GiB warm->cold promotion trigger (expert override;
#                                              unset defaults to 16 x cayenne_datalake_target_file_size_mb
#                                              = ~11.7 GiB at this pod's 750 MB file size — pin 4 GiB
#                                              so the big tables graduate after bootstrap).
#   - cayenne_datalake_target_file_size_mb         750 — read-optimized cold files, larger than the warm
#                                              target so cold scans open fewer footers; kept under the
#                                              per-file PK-bloom cap so cold files stay bloom-backed.
#   - cayenne_datalake_tiering_check_interval_ms 30s tiering-check cadence.
# NOTE: `cayenne_target_file_size_mb` (the WARM/hot file size) is deliberately NOT set — it is an
# adaptive actuator, and pinning it would collapse its tuning bounds to a point. Only the COLD file
# size is set here; they are different knobs.
#
# Cold store = the shared local MinIO (`s3://benchmarks`), reached via the dedicated
# `cayenne_datalake_s3_*` credentials below. The HTAP run workflow provides
# S3_ENDPOINT/S3_KEY/S3_SECRET (from the TEST_MINIO_* secrets).
# Sized for a 64 vCPU / 256 GiB host (m7a.16xlarge-class) with EBS gp3.

postgres_connection_params: &postgres_params
  pg_host: ${env:CHBENCH_PG_HOST}
  pg_port: 5432
  pg_db: chbench
  pg_user: bench
  pg_pass: bench
  pg_sslmode: disable

runtime:
  flight:
    ipc_compression: lz4_frame
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: false
  # Goal-driven adaptive SLOs, set GLOBALLY once here and inherited by every Cayenne dataset — the
  # high-level targets the closed loop converges toward (NOT actuator knobs). QPH is global-only.
  params:
    cayenne_goal_replication_lag: '5s'
    cayenne_goal_freshness: '30s'
    cayenne_goal_query_latency: '10s'
    cayenne_goal_qph: '5000'

datasets:
  # ------------------------------------------------------------------
  # High-volume PK upsert tables — adaptive tuning + COLD object-store tier.
  # No primary_key / on_conflict / indexes: schema inference (always on) detects them from the
  # PostgreSQL source and seeds the upsert on_conflict the CDC (changes) path requires (it also
  # supplies the row_count/table_bytes the adaptive warm-start gates on, and the PK the cold tier
  # needs both to promote and to auto-force key deletes).
  # ------------------------------------------------------------------
  - from: postgres:district
    name: district
    params:
      <<: *postgres_params
      pg_replication_slot: spice_district
      pg_replication_initial_snapshot: auto
    acceleration: &cayenne_accel_cold
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      params: &cayenne_params_cold
        cayenne_tuning: adaptive
        # In-memory CDC intra-apply sharding: 4 PK-hash shards validate+append in parallel within
        # one apply on the memory-tier (changes) tables. Not an adaptive actuator.
        cayenne_cdc_mem_tier_shards: '4'
        # --- Datalake (cold) object-store tier (RAM mem-tier -> warm local disk -> COLD). All
        # static config; none of these are adaptive actuators, so setting them collapses no tuning
        # bound. The location is namespaced by table_id, so one shared prefix is safe for every
        # table here. Dedicated datalake credentials (MinIO): the engine registers this store on
        # the promotion, scan, and delete paths — no anchor dataset needed. ---
        cayenne_datalake_location: s3://benchmarks/cayenne-cold-sf1000/
        cayenne_datalake_s3_auth: key
        cayenne_datalake_s3_endpoint: ${secrets:S3_ENDPOINT}
        cayenne_datalake_s3_key: ${secrets:S3_KEY}
        cayenne_datalake_s3_secret: ${secrets:S3_SECRET}
        cayenne_datalake_s3_allow_http: 'true'

        cayenne_datalake_warm_max_bytes: '4294967296' # 4 GiB warm->cold promotion trigger
        cayenne_datalake_target_file_size_mb: '750'
        cayenne_datalake_tiering_check_interval_ms: '30000'

  - from: postgres:customer
    name: customer
    params:
      <<: *postgres_params
      pg_replication_slot: spice_customer
      pg_replication_initial_snapshot: auto
    acceleration: *cayenne_accel_cold

  - from: postgres:new_order
    name: new_order
    params:
      <<: *postgres_params
      pg_replication_slot: spice_new_order
      pg_replication_initial_snapshot: auto
    acceleration: *cayenne_accel_cold

  - from: postgres:oorder
    name: oorder
    params:
      <<: *postgres_params
      pg_replication_slot: spice_oorder
      pg_replication_initial_snapshot: auto
    acceleration: *cayenne_accel_cold

  - from: postgres:order_line
    name: order_line
    params:
      <<: *postgres_params
      pg_replication_slot: spice_order_line
      pg_replication_initial_snapshot: auto
    acceleration: *cayenne_accel_cold

  - from: postgres:stock
    name: stock
    params:
      <<: *postgres_params
      pg_replication_slot: spice_stock
      pg_replication_initial_snapshot: auto
    acceleration: *cayenne_accel_cold

  # ------------------------------------------------------------------
  # Low-volume CDC reference table — adaptive, NO cold tier (it never crosses the warm-size trigger,
  # matching the tuned cold pod, which keeps warehouse on the warm tier).
  # ------------------------------------------------------------------
  - from: postgres:warehouse
    name: warehouse
    params:
      <<: *postgres_params
      pg_replication_slot: spice_warehouse
      pg_replication_initial_snapshot: auto
    acceleration: &cayenne_accel
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      params: &cayenne_params
        cayenne_tuning: adaptive
        cayenne_cdc_mem_tier_shards: '4'

  # ------------------------------------------------------------------
  # Static reference tables (no OLTP mutations, full refresh) — adaptive, no cold tier.
  # PK / indexes come from schema inference (always on); on_conflict is seeded only
  # for CDC (changes) datasets — a full refresh replaces the table and needs no upsert.
  # ------------------------------------------------------------------
  - from: postgres:item
    name: item
    params:
      <<: *postgres_params
    acceleration: &cayenne_accel_full
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      params: *cayenne_params

  - from: postgres:region
    name: region
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full

  - from: postgres:nation
    name: nation
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full

  - from: postgres:supplier
    name: supplier
    params:
      <<: *postgres_params
    acceleration: *cayenne_accel_full
