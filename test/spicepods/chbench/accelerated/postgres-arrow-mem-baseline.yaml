version: v1
kind: Spicepod
name: arrow-mem-baseline

runtime:
  params:
    cdc_prefetch_buffer: '1024'
    # 4096 = the runtime max (changes.rs:CDC_MAX_COALESCED_ENVELOPES_MAX). 8192
    # was silently rejected and fell back to the default 256 — ~16x smaller CDC
    # batches, multiplying the per-batch apply_on_conflict_deletions O(N)
    # deletion-index clone and starving WAL drain under bursty OLTP.
    cdc_max_coalesced_envelopes: '4096'
    cdc_max_coalesced_bytes: '134217728' # 128 MB
    cdc_max_coalesce_age_ms: '4000'
    cdc_commit_timeout_ms: '60000'
  query:
    # No memory_limit set on purpose — spiced auto-detects the budget from the
    # cgroup/host memory cap and sizes the DataFusion pool to a safe fraction of
    # it. Auto-detection is the right default here: it tracks the deployment's
    # actual memory and inherently leaves headroom for the off-pool Vortex encode
    # buffers + segment/footer caches that a fixed `memory_limit` would not count.
    #
    # Read-path scan/join parallelism = 2x the 16 logical cores. Does NOT raise the
    # write/compaction shard count (parallel encode is CPU-bound and ceilings at
    # the core count); per-table write fan-out is set via `cayenne_write_concurrency`.
    target_partitions: 32

postgres_connection_params: &postgres_params
  pg_host: 127.0.0.1
  pg_port: '5432'
  pg_db: chbench
  pg_user: bench
  pg_pass: bench
  pg_sslmode: disable

datasets:
  # ------------------------------------------------------------------
  # High-volume PK upsert tables.
  # ------------------------------------------------------------------

  - from: postgres:district
    name: district
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (d_w_id, d_id)
      params:
        # 8-way parallel encode = half the 16 cores: leaves ~half for OLAP during
        # an ingest burst (16-way encode would pin every core and cause the 80-90s
        # single-query latency outliers). Compaction no longer competes here — it
        # is now pinned to a single output shard. Raise toward the core count on
        # larger hosts.

  - from: postgres:customer
    name: customer
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (c_w_id, c_d_id, c_id)
      params:

  - from: postgres:new_order
    name: new_order
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (no_w_id, no_d_id, no_o_id)
      params:

  - from: postgres:oorder
    name: oorder
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (o_w_id, o_d_id, o_id)
      params:

  - from: postgres:order_line
    name: order_line
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (ol_w_id, ol_d_id, ol_o_id, ol_number)
      params:
        # 8 to match the HTAP budget (was 32, which a 16-core host clamped to 16
        # anyway). order_line is the heaviest compactor, so capping its fan-out
        # matters most for query latency. See the accel_high_volume note.

  - from: postgres:stock
    name: stock
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: (s_w_id, s_i_id)
      params:

  # ------------------------------------------------------------------
  # Low-volume reference tables.
  # ------------------------------------------------------------------

  - from: postgres:warehouse
    name: warehouse
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: w_id
      params:

  # ------------------------------------------------------------------
  # Static reference tables (no OLTP mutations, full refresh).
  # ------------------------------------------------------------------

  - from: postgres:item
    name: item
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: i_id
      params:

  - from: postgres:region
    name: region
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: r_regionkey
      params:

  - from: postgres:nation
    name: nation
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: n_nationkey
      params:

  - from: postgres:supplier
    name: supplier
    params:
      <<: *postgres_params
    acceleration:
      enabled: true
      engine: arrow
      mode: memory
      refresh_mode: full
      primary_key: su_suppkey
      params: