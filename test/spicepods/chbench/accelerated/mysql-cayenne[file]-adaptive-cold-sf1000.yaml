version: v1
kind: Spicepod
name: mysql-cayenne[file]-adaptive-cold-sf1000

# Adaptive-tuning variant of `…-cdc-tuned-memory-cold-sf1000`: the same three-tier storage cascade
# (RAM mem-tier -> warm local-disk Vortex -> COLD object store), but every Cayenne table runs
# `cayenne_tuning: adaptive` instead of the hand-pinned knobs. The runtime warm-starts each adaptive
# actuator (inline-flush, mem-tier bytes, compaction interval / trigger-files, deletion-index bake,
# write concurrency, WARM target file size, query-admission reserve) from the detected host +
# `schema_inference: extended`, then adapts them toward the `cayenne_goal_*` SLOs.
#
# The cold tier is NOT adaptive-tuned — no cold knob is an actuator — so its static knobs are set
# explicitly on the high-volume tables and collapse no adaptive tuning bound:
#   - cayenne_cold_tier_location               enables the tier (unset => disabled). Cold + an
#                                              inferred PK auto-forces deletion_mode: key, so
#                                              cayenne_deletion_mode is intentionally left unset.
#   - cayenne_cold_tier_warm_max_bytes         4 GiB warm->cold promotion trigger (the unset default
#                                              is 0 = never promote, which would leave the tier inert).
#   - cayenne_cold_target_file_size_mb         1024 — read-optimized cold files, larger than the warm
#                                              target so cold scans open fewer footers.
#   - cayenne_cold_tier_background_interval_ms 30s promoter cadence.
# NOTE: `cayenne_target_file_size_mb` (the WARM/hot file size) is deliberately NOT set — it is an
# adaptive actuator, and pinning it would collapse its tuning bounds to a point. Only the COLD file
# size is set here; they are different knobs.
#
# Cold store = the shared local MinIO (`s3://benchmarks`), registered via the `cold_tier_store_anchor`
# anchor dataset below (a local `mode: file` warm tier does not itself register the s3:// cold store).
# The HTAP run workflow provides S3_ENDPOINT/S3_KEY/S3_SECRET (from the TEST_MINIO_* secrets).
# Sized for a 64 vCPU / 256 GiB host (m7a.16xlarge-class) with EBS gp3.

mysql_connection_params: &mysql_params
  mysql_host: ${env:CHBENCH_MYSQL_HOST}
  mysql_tcp_port: 3306
  mysql_db: chbench
  mysql_user: bench
  mysql_pass: bench
  mysql_sslmode: disabled

runtime:
  flight:
    ipc_compression: lz4_frame
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: false
  # Goal-driven adaptive SLOs, set GLOBALLY once here and inherited by every Cayenne dataset — the
  # high-level targets the closed loop converges toward (NOT actuator knobs). QPH is global-only.
  params:
    cayenne_goal_replication_lag: '5s'
    cayenne_goal_freshness: '30s'
    cayenne_goal_query_latency: '10s'
    cayenne_goal_qph: '5000'

datasets:
  # ------------------------------------------------------------------
  # Cold-tier object-store registration anchor.
  #
  # Cayenne writes cold files to `s3://benchmarks/cayenne-cold-sf1000/` (the shared local MinIO).
  # With a local `mode: file` warm tier, Cayenne does not itself register the s3:// cold store, so
  # this federated dataset references the same bucket to register a path-style MinIO object store
  # under `s3://benchmarks`; the shared registry then reuses it for cold promotion + cross-tier
  # scans. It is NOT part of the CH-benCH schema and no query set touches it — it exists solely to
  # register the store. `region.parquet` is a tiny object present in the bench bucket; if ever
  # absent, point this at any existing object in `s3://benchmarks`.
  # ------------------------------------------------------------------
  - from: s3://benchmarks/tpch_sf1/region.parquet
    name: cold_tier_store_anchor
    params:
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}

  # ------------------------------------------------------------------
  # High-volume PK upsert tables — adaptive tuning + COLD object-store tier.
  # No primary_key / on_conflict / indexes: `schema_inference: extended` detects them from the
  # PostgreSQL source and seeds the upsert on_conflict the CDC (changes) path requires (it also
  # supplies the row_count/table_bytes the adaptive warm-start gates on, and the PK the cold tier
  # needs both to promote and to auto-force key deletes).
  # ------------------------------------------------------------------
  - from: mysql:district
    name: district
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1001'
    acceleration: &cayenne_accel_cold
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      params: &cayenne_params_cold
        cayenne_tuning: adaptive
        # In-memory CDC intra-apply sharding: 4 PK-hash shards validate+append in parallel within
        # one apply on the memory-tier (changes) tables. Not an adaptive actuator.
        cayenne_cdc_mem_tier_shards: '4'
        # --- Cold object-store tier (RAM mem-tier -> warm local disk -> COLD). All static config;
        # none of these are adaptive actuators, so setting them collapses no tuning bound. The cold
        # location is namespaced by table_id, so one shared prefix is safe for every table here. ---
        cayenne_cold_tier_location: s3://benchmarks/cayenne-cold-sf1000/
        cayenne_cold_tier_warm_max_bytes: '4294967296' # 4 GiB warm->cold promotion trigger
        cayenne_cold_target_file_size_mb: '1024'
        cayenne_cold_tier_background_interval_ms: '30000'

  - from: mysql:customer
    name: customer
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1002'
    acceleration: *cayenne_accel_cold

  - from: mysql:new_order
    name: new_order
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1003'
    acceleration: *cayenne_accel_cold

  - from: mysql:oorder
    name: oorder
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1004'
    acceleration: *cayenne_accel_cold

  - from: mysql:order_line
    name: order_line
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1005'
    acceleration: *cayenne_accel_cold

  - from: mysql:stock
    name: stock
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1006'
    acceleration: *cayenne_accel_cold

  # ------------------------------------------------------------------
  # Low-volume CDC reference table — adaptive, NO cold tier (it never crosses the warm-size trigger,
  # matching the tuned cold pod, which keeps warehouse on the warm tier).
  # ------------------------------------------------------------------
  - from: mysql:warehouse
    name: warehouse
    schema_inference: extended
    params:
      <<: *mysql_params
      mysql_replication_snapshot_mode: auto
      mysql_replication_server_id: '1007'
    acceleration: &cayenne_accel
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: changes
      params: &cayenne_params
        cayenne_tuning: adaptive
        cayenne_cdc_mem_tier_shards: '4'

  # ------------------------------------------------------------------
  # Static reference tables (no OLTP mutations, full refresh) — adaptive, no cold tier.
  # PK / on_conflict / indexes come from extended inference.
  # ------------------------------------------------------------------
  - from: mysql:item
    name: item
    schema_inference: extended
    params:
      <<: *mysql_params
    acceleration: &cayenne_accel_full
      enabled: true
      engine: cayenne
      mode: file
      refresh_mode: full
      params: *cayenne_params

  - from: mysql:region
    name: region
    schema_inference: extended
    params:
      <<: *mysql_params
    acceleration: *cayenne_accel_full

  - from: mysql:nation
    name: nation
    schema_inference: extended
    params:
      <<: *mysql_params
    acceleration: *cayenne_accel_full

  - from: mysql:supplier
    name: supplier
    schema_inference: extended
    params:
      <<: *mysql_params
    acceleration: *cayenne_accel_full
