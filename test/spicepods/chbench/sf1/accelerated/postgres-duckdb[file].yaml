version: v1
kind: Spicepod
name: postgres-cayenne[file]

runtime:
  caching:
    sql_results:
      enabled: false


datasets:
  # ---- TPC-C core tables (mutated by OLTP workload) ----

  - from: postgres:warehouse
    name: warehouse
    params: &postgres_params
      pg_host: 127.0.0.1
      pg_port: 5432
      pg_db: chbench
      pg_user: bench
      pg_pass: bench
      pg_sslmode: disable
      pg_replication_slot: spice_warehouse
      pg_replication_initial_snapshot: "true"
    acceleration: &cayenne_accel
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: changes
      primary_key: w_id
      on_conflict:
        w_id: upsert

  - from: postgres:district
    name: district
    params:
      <<: *postgres_params
      pg_replication_slot: spice_district
    acceleration:
      <<: *cayenne_accel
      primary_key: (d_w_id, d_id)
      on_conflict:
        (d_w_id, d_id): upsert

  - from: postgres:customer
    name: customer
    params:
      <<: *postgres_params
      pg_replication_slot: spice_customer
    acceleration:
      <<: *cayenne_accel
      primary_key: (c_w_id, c_d_id, c_id)
      on_conflict:
        (c_w_id, c_d_id, c_id): upsert

  - from: postgres:new_order
    name: new_order
    params:
      <<: *postgres_params
      pg_replication_slot: spice_new_order
    acceleration:
      <<: *cayenne_accel
      primary_key: (no_w_id, no_d_id, no_o_id)
      on_conflict:
        (no_w_id, no_d_id, no_o_id): upsert

  - from: postgres:orders
    name: orders
    params:
      <<: *postgres_params
      pg_replication_slot: spice_orders
    acceleration:
      <<: *cayenne_accel
      primary_key: (o_w_id, o_d_id, o_id)
      on_conflict:
        (o_w_id, o_d_id, o_id): upsert

  - from: postgres:order_line
    name: order_line
    params:
      <<: *postgres_params
      pg_replication_slot: spice_order_line
    acceleration:
      <<: *cayenne_accel
      primary_key: (ol_w_id, ol_d_id, ol_o_id, ol_number)
      on_conflict:
        (ol_w_id, ol_d_id, ol_o_id, ol_number): upsert

  - from: postgres:item
    name: item
    params:
      <<: *postgres_params
      pg_replication_slot: spice_item
    acceleration:
      <<: *cayenne_accel
      primary_key: i_id
      on_conflict:
        i_id: upsert

  - from: postgres:stock
    name: stock
    params:
      <<: *postgres_params
      pg_replication_slot: spice_stock
    acceleration:
      <<: *cayenne_accel
      primary_key: (s_w_id, s_i_id)
      on_conflict:
        (s_w_id, s_i_id): upsert

  - from: postgres:region
    name: region
    params:
      <<: *postgres_params
      pg_replication_slot: spice_region
    acceleration:
      <<: *cayenne_accel
      primary_key: r_regionkey
      on_conflict:
        r_regionkey: upsert

  - from: postgres:nation
    name: nation
    params:
      <<: *postgres_params
      pg_replication_slot: spice_nation
    acceleration:
      <<: *cayenne_accel
      primary_key: n_nationkey
      on_conflict:
        n_nationkey: upsert

  - from: postgres:supplier
    name: supplier
    params:
      <<: *postgres_params
      pg_replication_slot: spice_supplier
    acceleration:
      <<: *cayenne_accel
      primary_key: s_suppkey
      on_conflict:
        s_suppkey: upsert
