version: v1
kind: Spicepod
name: hf[all-minilm-l6-v2]-arrow

metadata:
  benchmark_dataset: arguana_retrieval

datasets:

  # MTEB ArguAna Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/arguana

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow
    columns:
      - name: text
        embeddings:
          - from: minilm_embed
            row_id:
              - _id

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow

embeddings:
  - from: huggingface:huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    name: minilm_embed
    params:
      truncate: END
