version: v1
kind: Spicepod
name: model2vec[potion-multilingual-128M]-cayenne[file]

metadata:
  benchmark_dataset: arguana_retrieval

datasets:

  # MTEB ArguAna Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/arguana

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
    columns:
      - name: text
        embeddings:
          - from: potion
            row_id:
              - _id

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/arguana/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true

embeddings:
  - from: model2vec:minishlab/potion-multilingual-128M
    name: potion
