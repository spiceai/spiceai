version: v1
kind: Spicepod
name: model2vec[potion-multilingual-128M]-s3_vectors

metadata:
  benchmark_dataset: miracl_en_retrieval

datasets:

  # MTEB MIRACL English Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/corpus/test-00000-of-00001.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
    vectors:
      enabled: true
      engine: s3_vectors
      params:
        s3_vectors_bucket: spice-ci-search-benchmarks-variant-001
        s3_vectors_index: miracl-en
        s3_vectors_aws_region: us-east-2
        s3_vectors_aws_access_key_id: ${env:AWS_S3_VECTORS_KEY}
        s3_vectors_aws_secret_access_key: ${env:AWS_S3_VECTORS_SECRET}
    columns:
      - name: text
        embeddings:
          - from: potion
            row_id:
              - _id

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/queries/test-00000-of-00001.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/data/test-00000-of-00001.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true

embeddings:
  - from: model2vec:minishlab/potion-multilingual-128M
    name: potion
