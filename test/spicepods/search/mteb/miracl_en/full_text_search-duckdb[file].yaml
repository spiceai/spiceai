version: v1
kind: Spicepod
name: full_text_search-duckdb[file]

metadata:
  benchmark_dataset: miracl_en_retrieval

datasets:

  # MTEB MIRACL English Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/corpus/test-00000-of-00001.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/queries/test-00000-of-00001.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/datasets/mteb/MIRACLRetrieval_en_top_250_only_w_correct-v2/resolve/main/data/test-00000-of-00001.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
