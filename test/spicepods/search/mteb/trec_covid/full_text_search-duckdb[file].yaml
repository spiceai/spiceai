version: v1
kind: Spicepod
name: full_text_search-duckdb[file]

metadata:
  benchmark_dataset: trec_covid_retrieval

datasets:

  # MTEB TREC-COVID Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/trec-covid

  - from: https://huggingface.co/api/datasets/mteb/trec-covid/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/api/datasets/mteb/trec-covid/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/trec-covid/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
