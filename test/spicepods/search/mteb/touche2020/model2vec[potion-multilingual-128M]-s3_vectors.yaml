version: v1
kind: Spicepod
name: model2vec[potion-multilingual-128M]-s3_vectors

metadata:
  benchmark_dataset: touche2020_retrieval

datasets:

  # MTEB Touche-2020 Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/touche2020

  # The corpus has 2 parquet shards. Each shard is its own dataset, and the
  # `corpus` view below joins them. Acceleration and search live on the view, so one refresh
  # of the view reads every shard and builds the search indexes.
  - from: https://huggingface.co/api/datasets/mteb/touche2020/parquet/corpus/corpus/0.parquet
    name: corpus_0
    params:
      file_format: parquet

  - from: https://huggingface.co/api/datasets/mteb/touche2020/parquet/corpus/corpus/1.parquet
    name: corpus_1
    params:
      file_format: parquet

  - from: https://huggingface.co/api/datasets/mteb/touche2020/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/touche2020/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true

views:
  - name: corpus
    sql: |
      SELECT * FROM corpus_0
      UNION ALL SELECT * FROM corpus_1
    acceleration:
      enabled: true
    vectors:
      enabled: true
      engine: s3_vectors
      params:
        s3_vectors_bucket: spice-ci-search-benchmarks-variant-001
        s3_vectors_index: touche2020
        s3_vectors_aws_region: us-east-2
        s3_vectors_aws_access_key_id: ${env:AWS_S3_VECTORS_KEY}
        s3_vectors_aws_secret_access_key: ${env:AWS_S3_VECTORS_SECRET}
    columns:
      - name: text
        embeddings:
          - from: potion
            row_id:
              - _id

embeddings:
  - from: model2vec:minishlab/potion-multilingual-128M
    name: potion
