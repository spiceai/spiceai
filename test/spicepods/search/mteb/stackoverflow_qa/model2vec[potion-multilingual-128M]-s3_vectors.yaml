version: v1
kind: Spicepod
name: model2vec[potion-multilingual-128M]-s3_vectors

metadata:
  benchmark_dataset: stackoverflow_qa_retrieval

datasets:

  # MTEB StackOverflowQA Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/stackoverflow-qa

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
    vectors:
      enabled: true
      engine: s3_vectors
      params:
        s3_vectors_bucket: spice-ci-search-benchmarks-variant-001
        s3_vectors_index: stackoverflow-qa
        s3_vectors_aws_region: us-east-2
        s3_vectors_aws_access_key_id: ${env:AWS_S3_VECTORS_KEY}
        s3_vectors_aws_secret_access_key: ${env:AWS_S3_VECTORS_SECRET}
    columns:
      - name: text
        embeddings:
          - from: potion
            row_id:
              - _id

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true

embeddings:
  - from: model2vec:minishlab/potion-multilingual-128M
    name: potion
