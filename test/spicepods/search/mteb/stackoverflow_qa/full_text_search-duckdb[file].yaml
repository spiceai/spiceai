version: v1
kind: Spicepod
name: full_text_search-duckdb[file]

metadata:
  benchmark_dataset: stackoverflow_qa_retrieval

datasets:

  # MTEB StackOverflowQA Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/stackoverflow-qa

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/stackoverflow-qa/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
