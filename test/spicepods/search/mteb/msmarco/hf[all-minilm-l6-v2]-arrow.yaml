version: v1
kind: Spicepod
name: hf[all-minilm-l6-v2]-arrow

metadata:
  benchmark_dataset: msmarco_retrieval

datasets:

  # MTEB MSMARCO Retrieval: https://huggingface.co/datasets/mteb/msmarco. testoperator_run_search.yml
  # downloads the files in data-files.tsv and passes the directory as `--data-dir`, so they are
  # local `data/` files here. Reading them over HTTP never finished (see data-files.tsv).

  # The corpus has 7 parquet shards. Each shard is its own dataset, and the
  # `corpus` view below joins them. Acceleration and search live on the view, so one refresh
  # of the view reads every shard and builds the search indexes.
  - from: file:data/msmarco/corpus/0000.parquet
    name: corpus_0
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0001.parquet
    name: corpus_1
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0002.parquet
    name: corpus_2
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0003.parquet
    name: corpus_3
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0004.parquet
    name: corpus_4
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0005.parquet
    name: corpus_5
    params:
      file_format: parquet

  - from: file:data/msmarco/corpus/0006.parquet
    name: corpus_6
    params:
      file_format: parquet

  - from: file:data/msmarco/queries.parquet
    name: queries
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow

  - from: file:data/msmarco/test.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: arrow

views:
  # `queries` holds all 509,962 MS MARCO queries, but only the 43 in the `test` split have relevance
  # judgments, and the test scores only judged queries. Searching the rest took more than 10 hours
  # without changing a retrieval metric, so the test searches only the judged queries.
  - name: test_queries
    sql: |
      SELECT _id, text FROM queries
      WHERE _id IN (SELECT DISTINCT "query-id" FROM relevance_data)

  - name: corpus
    sql: |
      SELECT * FROM corpus_0
      UNION ALL SELECT * FROM corpus_1
      UNION ALL SELECT * FROM corpus_2
      UNION ALL SELECT * FROM corpus_3
      UNION ALL SELECT * FROM corpus_4
      UNION ALL SELECT * FROM corpus_5
      UNION ALL SELECT * FROM corpus_6
    acceleration:
      enabled: true
      engine: arrow
    columns:
      - name: text
        embeddings:
          - from: minilm_embed
            row_id:
              - _id

embeddings:
  - from: huggingface:huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    name: minilm_embed
    params:
      truncate: END
