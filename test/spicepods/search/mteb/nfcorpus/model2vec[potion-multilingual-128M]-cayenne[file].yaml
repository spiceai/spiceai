version: v1
kind: Spicepod
name: model2vec[potion-multilingual-128M]-cayenne[file]
datasets:

  # MTEB NFCorpus Retrieval dataset files (*.parquet) are automatically downloaded by the test operator.
  # https://huggingface.co/datasets/mteb/nfcorpus

  - from: file:./corpus.parquet
    name: corpus
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
    columns:
      - name: text
        embeddings:
          - from: potion
            row_id:
              - _id

  - from: file:./queries.parquet
    name: test_queries
    acceleration:
      enabled: true

  - from: file:./data.parquet
    name: relevance_data
    acceleration:
      enabled: true

embeddings:
  - from: model2vec:minishlab/potion-multilingual-128M
    name: potion
