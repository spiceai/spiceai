version: v1
kind: Spicepod
name: full_text_search-cayenne[file]

metadata:
  benchmark_dataset: nfcorpus_retrieval

datasets:

  # MTEB NFCorpus Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/nfcorpus

  - from: https://huggingface.co/api/datasets/mteb/nfcorpus/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/api/datasets/mteb/nfcorpus/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/nfcorpus/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true
