version: v1
kind: Spicepod
name: full_text_search-arrow-sql_eval

# A retrieval benchmark that runs in SQL, with no `testoperator run search`.
# The `search_pipeline` function is the search. To test a different search,
# change only its body. After the runtime is ready:
#
#   SELECT * FROM retrieval_metrics ORDER BY k;   -- mean metrics at k = 1..10
#   SELECT * FROM query_metrics WHERE k = 10;     -- one row per judged query
#
# The metrics use the definitions of `testoperator run search`
# (crates/test-framework/src/spicetest/search/evaluate.rs): linear-gain nDCG,
# recall over relevant judgments, MRR, and precision over k. Each mean is over
# every query in `relevance_data`.

metadata:
  benchmark_dataset: scifact_retrieval

runtime:
  functions:
    enabled: true

datasets:

  # MTEB SciFact Retrieval, read straight from Hugging Face: https://huggingface.co/datasets/mteb/scifact

  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true

functions:
  # The search to evaluate: the top 10 corpus rows for one query, best first.
  - name: search_pipeline
    from: sql
    kind: table
    volatility: stable
    signature:
      args: [{ name: query, type: utf8 }]
      returns:
        - { name: _id, type: largeutf8 }
        - { name: _score, type: float64 }
    body: SELECT _id, _score FROM text_search(corpus, query, limit => 10)

views:
  - name: relevance_judgments
    sql: |
      SELECT CAST("query-id" AS VARCHAR) AS query_id,
             CAST("corpus-id" AS VARCHAR) AS corpus_id,
             CAST(score AS DOUBLE) AS grade
      FROM relevance_data

  # The search run: `search_pipeline` once for each judged query. Accelerated
  # so that the search runs once, at load time.
  - name: search_results
    dependsOn: [corpus, test_queries, relevance_data]
    sql: |
      SELECT CAST(q._id AS VARCHAR) AS query_id,
             CAST(r._id AS VARCHAR) AS corpus_id,
             r._score AS score,
             ROW_NUMBER() OVER (
               PARTITION BY q._id ORDER BY r._score DESC, r._id
             ) AS rank
      FROM test_queries q
      CROSS JOIN LATERAL search_pipeline(q.text) r
      WHERE CAST(q._id AS VARCHAR) IN (SELECT CAST("query-id" AS VARCHAR) FROM relevance_data)
    acceleration:
      enabled: true

  # Per-query metrics at each cutoff k = 1..10. A judged query with no
  # results gets 0 for every metric.
  - name: query_metrics
    dependsOn: [search_results, relevance_judgments]
    sql: |
      WITH cutoffs AS (
        SELECT unnest(range(1, 11)) AS k
      ),
      graded_results AS (
        SELECT r.query_id, r.rank, COALESCE(j.grade, 0.0) AS grade
        FROM search_results r
        LEFT JOIN relevance_judgments j
          ON j.query_id = r.query_id AND j.corpus_id = r.corpus_id
      ),
      ideal_ranking AS (
        SELECT query_id, grade,
               ROW_NUMBER() OVER (PARTITION BY query_id ORDER BY grade DESC) AS rank
        FROM relevance_judgments
      ),
      ideal AS (
        SELECT c.k, i.query_id,
               SUM(CASE WHEN i.rank <= c.k THEN i.grade / log2(i.rank + 1) ELSE 0.0 END) AS idcg,
               SUM(CASE WHEN i.grade > 0 THEN 1 ELSE 0 END) AS relevant
        FROM cutoffs c CROSS JOIN ideal_ranking i
        GROUP BY c.k, i.query_id
      ),
      actual AS (
        SELECT c.k, g.query_id,
               SUM(g.grade / log2(g.rank + 1)) AS dcg,
               SUM(CASE WHEN g.grade > 0 THEN 1 ELSE 0 END) AS hits,
               MIN(CASE WHEN g.grade > 0 THEN g.rank END) AS first_hit_rank
        FROM cutoffs c
        JOIN graded_results g ON g.rank <= c.k
        GROUP BY c.k, g.query_id
      )
      SELECT i.query_id,
             i.k,
             CASE WHEN i.idcg = 0 THEN 0.0 ELSE COALESCE(a.dcg, 0.0) / i.idcg END AS ndcg,
             CASE WHEN i.relevant = 0 THEN 0.0
                  ELSE CAST(COALESCE(a.hits, 0) AS DOUBLE) / i.relevant END AS recall,
             COALESCE(1.0 / a.first_hit_rank, 0.0) AS mrr,
             CAST(COALESCE(a.hits, 0) AS DOUBLE) / i.k AS precision
      FROM ideal i
      LEFT JOIN actual a ON a.query_id = i.query_id AND a.k = i.k

  # The run-level result: mean metrics over all judged queries, per cutoff.
  - name: retrieval_metrics
    dependsOn: [query_metrics]
    sql: |
      SELECT k,
             AVG(ndcg) AS ndcg,
             AVG(recall) AS recall,
             AVG(mrr) AS mrr,
             AVG(precision) AS precision,
             COUNT(*) AS queries
      FROM query_metrics
      GROUP BY k
