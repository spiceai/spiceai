version: v1
kind: Spicepod
name: mteb-scifact

# MTEB SciFact Retrieval, read straight from Hugging Face:
# https://huggingface.co/datasets/mteb/scifact
#
# Gives the tables that `search/offline-evals` needs: `corpus` (full-text
# search on `text`), `test_queries` and `relevance_data`.

datasets:
  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/corpus/corpus/0.parquet
    name: corpus
    params:
      file_format: parquet
    acceleration:
      enabled: true
    columns:
      - name: text
        full_text_search:
          enabled: true
          row_id:
            - _id

  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/queries/queries/0.parquet
    name: test_queries
    params:
      file_format: parquet
    acceleration:
      enabled: true

  - from: https://huggingface.co/api/datasets/mteb/scifact/parquet/default/test/0.parquet
    name: relevance_data
    params:
      file_format: parquet
    acceleration:
      enabled: true
