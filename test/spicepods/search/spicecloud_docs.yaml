version: v1
kind: Spicepod
name: spicecloud_docs
datasets:
  - from: spice.ai/spiceai/docs/datasets/spice.spiceai.cookbook
    name: cookbook
    params:
      spiceai_api_key: ${ secrets:SPICEAI_API_KEY }
      spiceai_region: us-east-1
    acceleration:
      enabled: true
    columns:
      - name: content
        embeddings:
          - from: xl_embed
  - from: spice.ai/spiceai/docs/datasets/spice.spiceai.docs
    name: docs
    params:
      spiceai_api_key: ${ secrets:SPICEAI_API_KEY }
      spiceai_region: us-east-1
    acceleration:
      enabled: true
    columns:
      - name: content
        embeddings:
          - from: xl_embed
embeddings:
  - from: openai:text-embedding-3-small
    name: xl_embed
    params:
      openai_identity_provider_id: ${ secrets:OPENAI_IDENTITY_PROVIDER_ID }
      openai_service_account_id: ${ secrets:OPENAI_SERVICE_ACCOUNT_ID }
      openai_identity_token_audience: https://api.openai.com