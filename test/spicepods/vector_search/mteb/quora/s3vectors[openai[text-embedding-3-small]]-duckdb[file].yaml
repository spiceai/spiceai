version: v1
kind: Spicepod
name: s3vectors[openai[text-embedding-3-small]]-duckdb[file]
datasets:

  # MTEB Quora Retrieval dataset files (*.parquet) are automatically downloaded by the test operator.
  # https://huggingface.co/datasets/mteb/QuoraRetrieval_test_top_250_only_w_correct-v2/tree/main

  - from: file:./corpus.parquet
    name: corpus
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
    vectors:
      enabled: true
      engine: s3_vectors
      params:
        s3_vectors_bucket: ${ secrets:TEST_S3_VECTORS_BUCKET }
        s3_vectors_aws_access_key_id: ${ secrets:AWS_ACCESS_KEY_ID }
        s3_vectors_aws_secret_access_key: ${ secrets:AWS_SECRET_ACCESS_KEY }
        s3_vectors_aws_region: ${ secrets:TEST_S3_VECTORS_REGION }
        s3_vectors_aws_session_token: ${ secrets:AWS_SESSION_TOKEN }
    columns:
      - name: text
        embeddings:
          - from: openai_embed
            row_id:
              - _id

  - from: file:./queries.parquet
    name: test_queries
    acceleration:
      enabled: true

  - from: file:./data.parquet
    name: relevance_data
    acceleration:
      enabled: true

embeddings:
  - from: openai:text-embedding-3-small
    name: openai_embed
    params:
      openai_api_key: ${ secrets:OPENAI_API_KEY }