# Query set for basic HTTP connector tests with httpbin.org
name: http_basic
queries:
  # Test 1: Basic GET request to /json endpoint
  - name: basic_json_get
    sql: SELECT request_path, content FROM httpbin_json WHERE request_path = '/json'
    expected_results:
      row_count: 1

  # Test 2: Verify JSON content is valid
  - name: verify_json_content
    sql: |
      SELECT 
        request_path,
        json_get(content, 'slideshow') as slideshow
      FROM httpbin_json
      WHERE request_path = '/json'
    expected_results:
      row_count: 1

  # Test 3: GET with query parameters
  - name: get_with_params
    sql: |
      SELECT request_path, request_query, content 
      FROM httpbin_get 
      WHERE request_path = '/get' AND request_query = 'param1=value1&param2=value2'
    expected_results:
      row_count: 1

  # Test 4: Verify query params are in response
  - name: verifyrequest_query_params
    sql: |
      SELECT 
        request_path,
        json_get(content, 'args') as args
      FROM httpbin_get
      WHERE request_query = 'param1=value1&param2=value2'
    expected_results:
      row_count: 1

  # Test 5: Multiple paths with OR
  - name: multiplerequest_paths_or
    sql: |
      SELECT request_path, COUNT(*) as count 
      FROM httpbin_multiple 
      GROUP BY request_path 
      ORDER BY request_path
    expected_results:
      row_count: 2

  # Test 6: Verify both endpoints returned data
  - name: verify_multiple_endpoints
    sql: |
      SELECT COUNT(DISTINCT request_path) as uniquerequest_paths
      FROM httpbin_multiple
    expected_results:
      row_count: 1

  # Test 7: Status code endpoints
  - name: status_codes
    sql: |
      SELECT request_path 
      FROM httpbin_status 
      ORDER BY request_path
    expected_results:
      row_count: 2

  # Test 8: Test content-only projection (no metadata columns)
  - name: content_only_projection
    sql: SELECT content FROM httpbin_json WHERE request_path = '/json'
    expected_results:
      row_count: 1

  # Test 9: Count all results without WHERE clause
  - name: count_all_no_filter
    sql: SELECT COUNT(*) as total FROM httpbin_json
    expected_results:
      row_count: 1
