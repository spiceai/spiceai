version: v1
kind: Spicepod
name: financebench

runtime:
  flight:
    max_message_size: 1G

dependencies:
  - models
  - evals

datasets:
  - from: flightsql:spice.financebench.data
    name: financebench.data
    description: Financial information
    params:
      flightsql_endpoint: https://flight.spiceai.io
      flightsql_username: ''
      flightsql_password: ${ secrets:SPICEAI_FINANCEBENCH_API_KEY }
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
    columns:
      - name: content
        embeddings:
          - from: openai_embed
            row_id: location
