version: v1
kind: Spicepod
name: s3[parquet]-duckdb[file]_indexes

datasets:
  - from: s3://benchmarks/saffron/number_info_sf1
    name: number_info
    time_column: DateCreated
    time_format: timestamptz
    params: &params_s3
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: append
      params:
        duckdb_preserve_insertion_order: false
      indexes:
        '(AccountSid, NumberPoolSid)': enabled
  
  - from: s3://benchmarks/saffron/number_caps_sf1
    name: number_caps
    params: *params_s3
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      params:
        duckdb_preserve_insertion_order: false
      indexes:
        NumberSid: enabled

  - from: s3://benchmarks/saffron/sender_info_sf1
    name: sender_info
    params: *params_s3
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      params:
        duckdb_preserve_insertion_order: false