version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]_view

runtime:
  caching:
    sql_results:
      enabled: false
  task_history:
    enabled: true
    captured_plan: explain
    min_plan_duration: 50ms

refresh_check_interval: &refresh_check_interval 3m

# Uses static dataset because on_conflict is not yet supported: https://github.com/spiceai/spiceai/issues/7762
datasets:
  - from: s3://benchmarks/saffron/number_info_sf1
    name: number_info
    time_column: DateCreated
    time_format: timestamptz
    params: &params_s3
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      enabled: true
      refresh_check_interval: *refresh_check_interval
      engine: cayenne
      mode: file
      refresh_mode: append

  - from: s3://benchmarks/saffron/number_caps_sf1
    name: number_caps
    params: *params_s3
    acceleration:
      enabled: true
      refresh_check_interval: *refresh_check_interval
      engine: cayenne
      mode: file

  - from: s3://benchmarks/saffron/sender_info_sf1
    name: sender_info_by_arrival
    params: *params_s3
    acceleration:
      enabled: true
      refresh_check_interval: *refresh_check_interval
      engine: cayenne
      mode: file

views:
  - name: sender_info
    sql: |
      select
      AutoId,
      AccountSid,
      NumberPoolSid,
      SenderSid,
      SenderIdentity,
      Region,
      Rate,
      SenderType,
      DateCreated,
      DateUpdated,
      LastUsed
      from sender_info_by_arrival
      order by AccountSid, NumberPoolSid
    acceleration:
      enabled: true
      refresh_check_interval: *refresh_check_interval
      engine: cayenne
      mode: file
      refresh_on_startup: auto

  - name: number_info_with_cap
    sql: |
      select
      ni.DateCreated,
      ni.DateUpdated,
      ni.AccountSid,
      ni.NumberPoolSid,
      ni.NumberSid,
      ni.MaxRate,
      ni.NumberDid,
      ni.NumberType,
      ni.SupportedDestRegion,
      ni.NumberRegion,
      ni.CurrentRate,
      ni.IsAvailable,
      ni.ProviderSid,
      ni.AreaCodeRegion,
      ni.AvailableForNumberSelection,
      nc.Capability
      from number_info ni
      inner join number_caps nc
      on ni.NumberSid = nc.NumberSid
      order by ni.AccountSid, ni.NumberPoolSid
    acceleration:
      enabled: true
      refresh_check_interval: *refresh_check_interval
      engine: cayenne
      mode: file
