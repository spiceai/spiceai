version: v1
kind: Spicepod
name: s3[parquet]-pepper[file]_view_with_partitioning

datasets:
  - from: s3://benchmarks/saffron/number_info_sf1
    name: number_info
    time_column: DateCreated
    time_format: timestamp
    params: &params_s3
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: append
      params:
        duckdb_preserve_insertion_order: false

  - from: s3://benchmarks/saffron/number_caps_sf1
    name: number_caps
    params: *params_s3
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      params:
        duckdb_preserve_insertion_order: false

views:
  - name: number_info_with_cap
    sql: |
      select ni.*, nc.Capability from number_info ni
      inner join number_caps nc
      on ni.NumberSid = nc.NumberSid
      order by ni.AccountSid, ni.NumberPoolSid
    acceleration:
      enabled: true
      engine: pepper
      mode: file
      partition_by:
        - bucket(32, AccountSid)