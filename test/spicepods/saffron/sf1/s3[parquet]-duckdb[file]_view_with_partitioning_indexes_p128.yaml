version: v1
kind: Spicepod
name: s3[parquet]-duckdb[file]_view_with_partitioning_indexes

datasets:
  - from: s3://benchmarks/saffron/number_info_sf1
    name: number_info
    time_column: DateCreated
    time_format: timestamptz
    params: &params_s3
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: append
      params:
        duckdb_preserve_insertion_order: false

  - from: s3://benchmarks/saffron/number_caps_sf1
    name: number_caps
    params: *params_s3
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      params:
        duckdb_preserve_insertion_order: false

  - from: s3://benchmarks/saffron/sender_info_sf1
    name: sender_info_by_arrival
    params: *params_s3
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      params:
        duckdb_preserve_insertion_order: false

views:
  - name: sender_info
    sql: |
      select
      AutoId,
      AccountSid,
      NumberPoolSid,
      SenderSid,
      SenderIdentity,
      Region,
      Rate,
      sendertype as SenderType,
      DateCreated,
      DateUpdated,
      LastUsed
      from sender_info_by_arrival
      order by AccountSid, NumberPoolSid
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_on_startup: auto
      params:
        partition_mode: tables
        query_federation: disabled
        duckdb_file: sender_info.duckdb
        duckdb_preserve_insertion_order: true
        duckdb_partitioned_write_flush_threshold: 256000
      partition_by:
        - bucket(32, AccountSid)
      indexes:
        '(AccountSid, NumberPoolSid, SenderType)': enabled
        '(AccountSid, NumberPoolSid, SenderType, Region)': enabled

  - name: number_info_with_cap
    sql: |
      select
      ni.DateCreated,
      ni.DateUpdated,
      ni.AccountSid,
      ni.NumberPoolSid,
      ni.NumberSid,
      ni.MaxRate,
      ni.NumberDid,
      ni.NumberType,
      ni.SupportedDestRegion,
      ni.NumberRegion,
      ni.CurrentRate,
      ni.IsAvailable,
      ni.ProviderSid,
      ni.AreaCodeRegion,
      ni.AvailableForNumberSelection,
      nc.Capability
      from number_info ni
      inner join number_caps nc
      on ni.NumberSid = nc.NumberSid
      order by ni.AccountSid, ni.NumberPoolSid
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_on_startup: auto
      params:
        query_federation: disabled
        duckdb_preserve_insertion_order: true
        partition_mode: tables
        duckdb_partitioned_write_flush_threshold: 256000
        duckdb_file: number_info_with_cap.duckdb
      partition_by:
        - bucket(128, AccountSid)
      indexes:
        '(AccountSid, NumberPoolSid, NumberType)': enabled
        '(NumberPoolSid, SupportedDestRegion, IsAvailable)': enabled
        '(NumberPoolSid, NumberRegion)': enabled
        '(AreaCodeRegion, NumberType)': enabled
