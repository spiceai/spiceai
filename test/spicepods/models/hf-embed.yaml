version: v1
kind: Spicepod
name: huggingface-embed

embeddings:
  - from: huggingface:huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    name: all_minilm_l6_v2
    params:
      # all-MiniLM-L6-v2 caps inputs at 256 tokens; discard the tail of an
      # over-length input instead of failing the embedding call.
      truncate: END
