version: v1
kind: Spicepod
name: file_duckdb_memory
datasets:
  - from: file:data/customer.parquet
    name: customer
    time_column: c_created_at
    acceleration: &acceleration
      enabled: true
      engine: duckdb
      mode: memory
      refresh_mode: append
      refresh_check_interval: 3m 
  - from: file:data/lineitem.parquet
    name: lineitem
    time_column: l_created_at
    acceleration: *acceleration
  - from: file:data/nation.parquet
    name: nation
    time_column: n_created_at
    acceleration: *acceleration
  - from: file:data/orders.parquet
    name: orders
    time_column: o_created_at
    acceleration: *acceleration
  - from: file:data/part.parquet
    name: part
    time_column: p_created_at
    acceleration: *acceleration
  - from: file:data/partsupp.parquet
    name: partsupp
    time_column: ps_created_at
    acceleration: *acceleration
  - from: file:data/region.parquet
    name: region
    time_column: r_created_at
    acceleration: *acceleration
  - from: file:data/supplier.parquet
    name: supplier
    time_column: s_created_at
    acceleration: *acceleration
