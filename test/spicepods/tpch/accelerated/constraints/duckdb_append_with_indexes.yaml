version: v1
kind: Spicepod
name: append-refresh-with-indexes

runtime:
  task_history:
    enabled: true
    captured_output: truncated
  results_cache:
    enabled: false

datasets:
  - from: file:.spice/service_data.parquet
    name: data_upsert
    time_column: DateUpdated
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: append
      refresh_check_interval: &default_refresh_check_interval 1s
      indexes:
        Id: enabled

  - from: file:.spice/service_data.parquet
    name: data_drop
    time_column: DateUpdated
    acceleration:
      enabled: true
      engine: duckdb
      mode: file
      refresh_mode: append
      refresh_check_interval: *default_refresh_check_interval
