version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]-distributed
datasets:
  - from: s3://spiceai-public-datasets/tpch_sf100/customer.parquet
    name: customer
    params: &s3_params
      file_format: parquet
      s3_auth: public
      s3_region: us-east-1
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, c_name)
  - from: s3://spiceai-public-datasets/tpch_sf100/lineitem.parquet
    name: lineitem
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, l_shipdate)
  - from: s3://spiceai-public-datasets/tpch_sf100/nation.parquet
    name: nation
    params: *s3_params
    acceleration: &acceleration
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(3, n_name)
  - from: s3://spiceai-public-datasets/tpch_sf100/orders.parquet
    name: orders
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, o_custkey)
  - from: s3://spiceai-public-datasets/tpch_sf100/part.parquet
    name: part
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, p_name)
  - from: s3://spiceai-public-datasets/tpch_sf100/partsupp.parquet
    name: partsupp
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, ps_partkey)
  - from: s3://spiceai-public-datasets/tpch_sf100/region.parquet
    name: region
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(3, r_name)
  - from: s3://spiceai-public-datasets/tpch_sf100/supplier.parquet
    name: supplier
    params: *s3_params
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, s_name)