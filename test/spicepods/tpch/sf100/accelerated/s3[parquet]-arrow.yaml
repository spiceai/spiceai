version: v1
kind: Spicepod
name: s3[parquet]-arrow
datasets:
  - from: s3://benchmarks/tpch_sf100/customer.parquet
    name: customer
    params: &s3_params
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration: &acceleration
      enabled: true
  # Limit large tables to ~75% of rows to prevent OOM on currently used CI runner (https://github.com/spiceai/spiceai/issues/10729)
  - from: s3://benchmarks/tpch_sf100/lineitem.parquet
    name: lineitem
    params: *s3_params
    acceleration:
      enabled: true
      refresh_sql: "SELECT * FROM lineitem LIMIT 450000000"
  - from: s3://benchmarks/tpch_sf100/nation.parquet
    name: nation
    params: *s3_params
    acceleration: *acceleration
  - from: s3://benchmarks/tpch_sf100/orders.parquet
    name: orders
    params: *s3_params
    acceleration:
      enabled: true
      refresh_sql: "SELECT * FROM orders LIMIT 112000000"
  - from: s3://benchmarks/tpch_sf100/part.parquet
    name: part
    params: *s3_params
    acceleration: *acceleration
  - from: s3://benchmarks/tpch_sf100/partsupp.parquet
    name: partsupp
    params: *s3_params
    acceleration:
      enabled: true
      refresh_sql: "SELECT * FROM partsupp LIMIT 60000000"
  - from: s3://benchmarks/tpch_sf100/region.parquet
    name: region
    params: *s3_params
    acceleration: *acceleration
  - from: s3://benchmarks/tpch_sf100/supplier.parquet
    name: supplier
    params: *s3_params
    acceleration: *acceleration
