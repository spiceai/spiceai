version: v1beta1
kind: Spicepod
name: iceberg_catalog

catalogs:
  - from: iceberg:http://iceberg-rest.dataplatform.svc.cluster.local:8181/v1/namespaces
    name: ice
    params:
      iceberg_s3_endpoint: ${secrets:MINIO_ENDPOINT}
      iceberg_s3_access_key_id: ${secrets:MINIO_ACCESS_KEY}
      iceberg_s3_secret_access_key: ${secrets:MINIO_SECRET_KEY}
      iceberg_s3_region: us-east-1
