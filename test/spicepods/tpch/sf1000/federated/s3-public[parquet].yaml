version: v1
kind: Spicepod
name: s3-public[parquet]-federated

datasets:
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/customer/
    name: customer
    params: &s3_params
      file_format: parquet
      s3_auth: public
      s3_region: us-west-2
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/lineitem/
    name: lineitem
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/nation/
    name: nation
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/orders/
    name: orders
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/part/
    name: part
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/partsupp/
    name: partsupp
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/region/
    name: region
    params: *s3_params
  - from: s3://spiceai-sandbox-tpch-us-west-2/tpch_sf1000/supplier/
    name: supplier
    params: *s3_params
