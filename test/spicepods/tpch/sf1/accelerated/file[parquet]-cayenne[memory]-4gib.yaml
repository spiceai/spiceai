version: v1
kind: Spicepod
name: file[parquet]-cayenne[memory]-4gib

# Every TPC-H query must answer within a 4 GiB query memory limit, spilling
# to disk where it needs more.
runtime:
  query:
    memory_limit: 4GiB

datasets:
  - from: file:data/customer.parquet
    name: customer
    acceleration: &acceleration
      enabled: true
      engine: cayenne
      mode: memory
  - from: file:data/lineitem.parquet
    name: lineitem
    acceleration: *acceleration
  - from: file:data/nation.parquet
    name: nation
    acceleration: *acceleration
  - from: file:data/orders.parquet
    name: orders
    acceleration: *acceleration
  - from: file:data/part.parquet
    name: part
    acceleration: *acceleration
  - from: file:data/partsupp.parquet
    name: partsupp
    acceleration: *acceleration
  - from: file:data/region.parquet
    name: region
    acceleration: *acceleration
  - from: file:data/supplier.parquet
    name: supplier
    acceleration: *acceleration
