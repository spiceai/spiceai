version: v1
kind: Spicepod
name: turso-arrow
datasets:
  - from: turso:customer
    name: customer
    params: &turso_params
      turso_file: ./data/tpch.db
    acceleration: &acceleration
      enabled: true
      engine: arrow
      mode: memory
  - from: turso:lineitem
    name: lineitem
    params: *turso_params
    acceleration: *acceleration
  - from: turso:nation
    name: nation
    params: *turso_params
    acceleration: *acceleration
  - from: turso:orders
    name: orders
    params: *turso_params
    acceleration: *acceleration
  - from: turso:part
    name: part
    params: *turso_params
    acceleration: *acceleration
  - from: turso:partsupp
    name: partsupp
    params: *turso_params
    acceleration: *acceleration
  - from: turso:region
    name: region
    params: *turso_params
    acceleration: *acceleration
  - from: turso:supplier
    name: supplier
    params: *turso_params
    acceleration: *acceleration
