version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]-view
datasets:
  - from: s3://benchmarks/tpch_sf1/customer.parquet
    name: customer
    params: &s3_params
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
      s3_session_token: ${secrets:S3_SESSION_TOKEN}
    acceleration: &acceleration1
      enabled: true
      engine: cayenne
      mode: file
      params:
        cayenne_file_path: cayenne-1
        cayenne_metadata_dir: cayenne-metadata
  - from: s3://benchmarks/tpch_sf1/lineitem.parquet
    name: lineitem
    params: *s3_params
    acceleration: *acceleration1
  - from: s3://benchmarks/tpch_sf1/nation.parquet
    name: nation
    params: *s3_params
    acceleration: *acceleration1
  - from: s3://benchmarks/tpch_sf1/orders.parquet
    name: orders
    params: *s3_params
    acceleration: &acceleration2
      enabled: true
      engine: cayenne
      mode: file
      params:
        cayenne_file_path: cayenne-2
        cayenne_metadata_dir: cayenne-metadata
  - from: s3://benchmarks/tpch_sf1/part.parquet
    name: part
    params: *s3_params
    acceleration: *acceleration2
  - from: s3://benchmarks/tpch_sf1/partsupp.parquet
    name: partsupp_ds
    params: *s3_params
    acceleration: &acceleration3
      enabled: true
      engine: cayenne
      mode: file
      params:
        cayenne_file_path: cayenne-3
        cayenne_metadata_dir: cayenne-metadata
  - from: s3://benchmarks/tpch_sf1/region.parquet
    name: region_ds
    params: *s3_params
    acceleration: *acceleration3
  - from: s3://benchmarks/tpch_sf1/supplier.parquet
    name: supplier_ds
    params: *s3_params
    acceleration: *acceleration3

views:
  - name: partsupp
    sql: |
      SELECT * FROM partsupp_ds
    acceleration: &acceleration4
      enabled: true
      engine: cayenne
      mode: file
      params:
        cayenne_file_path: cayenne-view
        cayenne_metadata_dir: cayenne-metadata
  - name: region
    sql: |
      SELECT * FROM region_ds
    acceleration: *acceleration4
  - name: supplier
    sql: |
      SELECT * FROM supplier_ds
    acceleration: *acceleration4
