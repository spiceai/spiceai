version: v1
kind: Spicepod
name: file[parquet]-cayenne[file]-covering-indexes
datasets:
  - from: file:data/customer.parquet
    name: customer
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      indexes:
        c_name: enabled
  - from: file:data/nation.parquet
    name: nation
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      indexes:
        n_nationkey: enabled
  - from: file:data/region.parquet
    name: region
    acceleration:
      enabled: true
      engine: cayenne
      mode: file
      indexes:
        r_regionkey: enabled
