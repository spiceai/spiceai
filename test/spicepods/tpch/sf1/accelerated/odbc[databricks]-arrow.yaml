version: v1
kind: Spicepod
name: odbc[databricks]-arrow
datasets:
  - from: odbc:spiceai_ci.tpch.customer
    name: customer
    params: &odbc_params
      odbc_connection_string: |
        Driver={Databricks ODBC Driver};
        Host=${ env:DATABRICKS_HOST };
        Port=443;
        HTTPPath=${ env:DATABRICKS_ODBC_PATH };
        SSL=1;
        ThriftTransport=2;
        AuthMech=3;
        UID=token;
        PWD=${ env:DATABRICKS_TOKEN }
    acceleration: &acceleration
      enabled: true
      engine: arrow
  - from: odbc:spiceai_ci.tpch.lineitem
    name: lineitem
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.nation
    name: nation
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.orders
    name: orders
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.part
    name: part
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.partsupp
    name: partsupp
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.region
    name: region
    params: *odbc_params
    acceleration: *acceleration
  - from: odbc:spiceai_ci.tpch.supplier
    name: supplier
    params: *odbc_params
    acceleration: *acceleration
