version: v1
kind: Spicepod
name: smb[parquet]-federated
datasets:
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/customer.parquet
    name: customer
    params: &smb_params
      file_format: parquet
      user: ${env:SMB_USER}
      pass: ${secrets:SMB_PASS}
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/lineitem.parquet
    name: lineitem
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/nation.parquet
    name: nation
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/orders.parquet
    name: orders
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/part.parquet
    name: part
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/partsupp.parquet
    name: partsupp
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/region.parquet
    name: region
    params: *smb_params
  - from: smb://${env:SMB_HOST}/${env:SMB_SHARE}/tpch/supplier.parquet
    name: supplier
    params: *smb_params
