version: v1
kind: Spicepod
name: mssql[catalog]-federated
catalogs:
  - from: mssql
    name: mssql
    params:
      mssql_host: ${secrets:MSSQL_HOST}
      mssql_username: ${secrets:MSSQL_USER}
      mssql_password: ${secrets:MSSQL_PASSWORD}
      mssql_database: ${secrets:MSSQL_TPCH_DB}
      mssql_encrypt: false
      mssql_trust_server_certificate: true
