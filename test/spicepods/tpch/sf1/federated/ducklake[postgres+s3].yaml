version: v1
kind: Spicepod
name: ducklake[postgres+s3]-federated

runtime:
  telemetry:
    enabled: false
datasets:
  - from: ducklake:customer
    name: customer
    params: &ducklake_params
      connection_string: ${secrets:DUCKLAKE_CONNECTION_STRING}
  - from: ducklake:lineitem
    name: lineitem
    params: *ducklake_params
  - from: ducklake:nation
    name: nation
    params: *ducklake_params
  - from: ducklake:orders
    name: orders
    params: *ducklake_params
  - from: ducklake:part
    name: part
    params: *ducklake_params
  - from: ducklake:partsupp
    name: partsupp
    params: *ducklake_params
  - from: ducklake:region
    name: region
    params: *ducklake_params
  - from: ducklake:supplier
    name: supplier
    params: *ducklake_params
