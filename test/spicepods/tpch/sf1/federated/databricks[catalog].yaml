version: v1
kind: Spicepod
name: databricks[catalog]-federated
catalogs:
  - from: databricks:spiceai_sandbox
    name: tpch
    include:
      - "tpch.*"
    params:
      mode: delta_lake
      databricks_aws_access_key_id: ${ secrets:AWS_DATABRICKS_DELTA_ACCESS_KEY_ID }
      databricks_aws_secret_access_key: ${ secrets:AWS_DATABRICKS_DELTA_SECRET_ACCESS_KEY }
      databricks_aws_session_token: ${ secrets:AWS_DATABRICKS_DELTA_SESSION_TOKEN }
      databricks_aws_region: us-west-2
      databricks_client_id: ${ secrets:DATABRICKS_OIDC_CLIENT_ID }
      databricks_token_audience: ${ secrets:DATABRICKS_OIDC_AUDIENCE }
      databricks_endpoint: ${ secrets:DATABRICKS_HOST }