version: v1
kind: Spicepod
name: s3-public[parquet]-cayenne[file]-distributed
# TPC-DS SF1 served by Cayenne file-mode accelerations partitioned across
# cluster executors. Every accelerated table has a partition key because
# cluster partition assignment requires partition metadata for each dataset.
datasets:
  - from: s3://spiceai-public-datasets/tpcds/catalog_sales/catalog_sales.parquet
    name: catalog_sales
    params: &s3_params
      file_format: parquet
      s3_auth: public
    acceleration:
      <<: &distributed_acceleration
        enabled: true
        engine: cayenne
        mode: file
        params:
          partition_mode: tables
      partition_by:
        - bucket(10, cs_item_sk)
  - from: s3://spiceai-public-datasets/tpcds/catalog_returns/catalog_returns.parquet
    name: catalog_returns
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, cr_item_sk)
  - from: s3://spiceai-public-datasets/tpcds/inventory/inventory.parquet
    name: inventory
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, inv_item_sk)
  - from: s3://spiceai-public-datasets/tpcds/store_sales/store_sales.parquet
    name: store_sales
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, ss_item_sk)
  - from: s3://spiceai-public-datasets/tpcds/store_returns/store_returns.parquet
