version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]-distributed
# TPC-DS SF1 served by Cayenne file-mode accelerations partitioned across
# cluster executors. Partitioning is concentrated on fact tables plus the
# highest-cardinality dimensions to keep this benchmark signal focused on
# distributed accelerated scans/joins without over-sharding every small lookup
# table.
datasets:
  - from: s3://benchmarks/tpcds_sf1/catalog_sales.parquet
    name: catalog_sales
    params: &s3_params
      file_format: parquet
      allow_http: true
      s3_auth: key
      s3_endpoint: ${secrets:S3_ENDPOINT}
      s3_key: ${secrets:S3_KEY}
      s3_secret: ${secrets:S3_SECRET}
    acceleration:
      <<: &distributed_acceleration
        enabled: true
        engine: cayenne
        mode: file
        params:
          partition_mode: tables
      partition_by:
        - bucket(10, cs_item_sk)
  - from: s3://benchmarks/tpcds_sf1/catalog_returns.parquet
    name: catalog_returns
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, cr_item_sk)
  - from: s3://benchmarks/tpcds_sf1/inventory.parquet
    name: inventory
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, inv_item_sk)
  - from: s3://benchmarks/tpcds_sf1/store_sales.parquet
    name: store_sales
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, ss_item_sk)
  - from: s3://benchmarks/tpcds_sf1/store_returns.parquet
    name: store_returns
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, sr_item_sk)
  - from: s3://benchmarks/tpcds_sf1/web_sales.parquet
    name: web_sales
    params: *s3_params
    acceleration:
      <<: *distributed_acceleration
      partition_by:
        - bucket(10, ws_item_sk)
  - from: s3://benchmarks/tpcds_sf1/web_returns.parquet
