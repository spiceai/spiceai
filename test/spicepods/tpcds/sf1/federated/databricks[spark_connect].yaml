version: v1
kind: Spicepod
name: databricks[spark_connect]-federated
datasets:
  - from: databricks:spiceai_sandbox.tpcds.catalog_sales
    name: catalog_sales
    params: &databricks_spark_params
      mode: spark_connect
      databricks_endpoint: ${ env:DATABRICKS_HOST }
      databricks_cluster_id: ${ env:DATABRICKS_CLUSTER_ID }
      databricks_client_id: ${ env:DATABRICKS_OIDC_CLIENT_ID }
      databricks_token_audience: ${ env:DATABRICKS_OIDC_AUDIENCE }
  - from: databricks:spiceai_sandbox.tpcds.catalog_returns
    name: catalog_returns
    params: *databricks_spark_params
