version: v1
kind: Spicepod
name: s3[parquet]-cayenne[file]-distributed
datasets:
  - from: s3://spiceai-public-datasets/tpcds_sf100/catalog_sales.parquet
    name: catalog_sales
    params: &s3_params
      file_format: parquet
      s3_auth: public
      s3_region: us-east-1
    acceleration: &acceleration
      enabled: true
      engine: cayenne
      mode: file
      partition_by:
        - bucket(6, cs_sold_date_sk)
  - from: s3://spiceai-public-datasets/tpcds_sf100/catalog_returns.parquet
    name: catalog_returns
    params: *s3_params
    acceleration:
      <<: *acceleration
      partition_by:
        - bucket(6, cr_returned_date_sk)
  - from: s3://spiceai-public-datasets/tpcds_sf100/inventory.parquet
    name: inventory
    params: *s3_params
    acceleration:
      <<: *acceleration
      partition_by:
        - bucket(6, inv_date_sk)
