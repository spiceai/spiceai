name: tlp
description: >
  Ternary logic partitioning over random predicates: for each predicate p the
  rows of a table equal those WHERE p, WHERE NOT (p) and WHERE (p) IS NULL
  together, its count, sum, min and max equal the parts', and each partition
  answers as PostgreSQL answers it over the same rows; federated to each
  backend, including DuckLake, and DuckDB through the duckdb connector and ADBC with the
  DuckDB driver, and accelerated into each engine.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql, clickhouse, duckdb, ducklake]

variants:
  federated: {}
  cayenne: cayenne-file
  duckdb: duckdb-file
  sqlite: sqlite-file
  arrow: arrow
  adbc:
    when: { backend: duckdb }
    datasets:
      t:
        from: adbc:t
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      u:
        from: adbc:u
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null

spicepod:
  version: v1
  kind: Spicepod
  name: tlp
  datasets:
    - from: '${matrix.backend}:t'
      name: t
      params: ${sources.backend.params}
    - from: '${matrix.backend}:u'
      name: u
      params: ${sources.backend.params}

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }
  expect: { oracle: ref }
  # Each answer is checked against the reference; the variants' answers to
  # one another add nothing but a second report of the same mismatch.
  compare-variants: false

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - tlp: { table: t, seed: 1, queries: 300, depth: 3, aggregate: d, oracle: ref }
    when: { backend: [postgres, clickhouse, duckdb, ducklake] }
    except: [federated, adbc]
  - tlp: { table: t, seed: 1, queries: 300, depth: 3, aggregate: d, oracle: ref }
    when: { backend: [postgres, clickhouse, duckdb, ducklake] }
    only: [federated, adbc]
  # MySQL's BOOLEAN reaches Spice as Int8, so `b` is left out.
  - tlp: { table: t, seed: 1, queries: 300, depth: 3, aggregate: d, oracle: ref, skip-columns: [b] }
    when: { backend: mysql }
