name: append-embeddings
description: >
  Append refresh on a day-granular time column re-reads the rows on the latest
  stored date and keeps only the ones not already stored. A dataset with column
  embeddings does the same when the embedding model returns a different vector
  for the same text in a different batch: refreshing an unchanged source adds
  no rows, and new rows on the latest date arrive once.

sources:
  src: { kind: postgres }
  # An OpenAI-compatible embeddings endpoint whose vectors depend on the batch
  # size, as hosted models' do. It records each request's batch size.
  emb:
    kind: docker
    image: docker.io/library/python:3.12-slim
    ports: [8000]
    command:
      - python
      - -c
      - |
        import json
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()

            def do_POST(self):
                request = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                inputs = request["input"]
                if isinstance(inputs, str):
                    inputs = [inputs]
                with open("/tmp/sizes", "a") as sizes:
                    sizes.write(f"{len(inputs)}\n")
                data = [
                    {"object": "embedding", "index": i, "embedding": [float(len(text)), float(len(inputs))]}
                    for i, text in enumerate(inputs)
                ]
                body = json.dumps({
                    "object": "list",
                    "data": data,
                    "model": request["model"],
                    "usage": {"prompt_tokens": 0, "total_tokens": 0},
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    ready: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"

matrix:
  engine: [cayenne, arrow, duckdb]

spicepod:
  version: v1
  kind: Spicepod
  name: append-embeddings
  embeddings:
    - from: openai:batch-dependent
      name: emb
      params:
        endpoint: http://127.0.0.1:${sources.emb.port.8000}/v1
        openai_api_key: test
  datasets:
    - from: postgres:public.docs
      name: docs
      params: ${sources.src.params}
      time_column: d
      time_format: date
      acceleration:
        enabled: true
        engine: '${matrix.engine}'
        refresh_mode: append
      columns:
        - name: body
          embeddings: [{ from: emb }]

defaults:
  expect: { oracle: src }

steps:
  # 200 rows over four dates; 50 on the latest, 2001-10-27.
  - source-exec:
      src: |
        CREATE TABLE docs (id bigint NOT NULL, d date NOT NULL, body text NOT NULL);
        INSERT INTO docs
          SELECT i, DATE '2001-10-24' + i % 4, 'document ' || repeat('x', i % 17) || i
          FROM generate_series(1, 200) AS i;
  - start: {}
  - query: SELECT id, d, body FROM docs
  - query: SELECT count(*) AS n FROM docs WHERE body_embedding IS NOT NULL
    expect: { rows: [['200']] }
  # The initial load embeds no batch of 50.
  - source-query: { emb: grep -cx 50 /tmp/sizes || true }
    expect: { rows: [['0']] }

  # A refresh re-embeds the 50 rows on the latest date in a batch of their own,
  # so their vectors differ from the stored ones, and adds nothing.
  - refresh: docs
  - source-query: { emb: grep -cx 50 /tmp/sizes }
    expect: { rows: [['1']] }
  - query: SELECT id, d, body FROM docs

  # Rows on a new date arrive once; so do rows added later on that same date,
  # while the ones stored with it are re-read in a different batch.
  - source-exec:
      src: INSERT INTO docs SELECT i, DATE '2001-10-28', 'later ' || i FROM generate_series(201, 210) AS i
  - refresh: docs
  - query: SELECT id, d, body FROM docs
  - source-exec:
      src: INSERT INTO docs SELECT i, DATE '2001-10-28', 'latest ' || i FROM generate_series(211, 215) AS i
  - refresh: docs
  - query: SELECT id, d, body FROM docs
  - query: SELECT count(*) AS n FROM docs WHERE body_embedding IS NOT NULL
    expect: { rows: [['215']] }
