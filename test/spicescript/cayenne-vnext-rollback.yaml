name: cayenne-vnext-rollback
duration: 72s
description: >
  An upgrade into the object-native Cayenne metastore, a rollback, and an
  upgrade again, with a full acceleration and PostgreSQL and MySQL change
  capture. The release keeps them in the SQLite metastore; the binary under
  test loads each from its source instead, follows the sources further, and
  leaves the release's copy exactly as it was. Default slots keep the two
  copies' acknowledgements separate; an explicit slot shares them. The release
  then starts again on that copy while the sources changed again, and must
  answer as its sources do, even when the upgraded copy acknowledged changes
  the release's copy does not hold. Upgrading again
  serves each dataset from its object-native copy, which catches up from its
  source in turn.

matrix:
  from: [2.3.x, 2.4.x]
  slot: [default, explicit]
from: '${matrix.from}'

sources:
  pg: { kind: postgres }
  my: { kind: mysql }

# Default slots belong to different durable copies. An explicit slot exercises
# rollback when the upgraded copy has acknowledged past the release's copy.
variants:
  default:
    when: { slot: default }
  explicit:
    when: { slot: explicit }
    datasets:
      pg_a:
        params: { $merge: '${sources.pg.params}', pg_replication_slot: spice_rollback }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext-rollback
  runtime: { params: { cayenne_vnext: enabled } }
  datasets:
    - from: postgres:public.items
      name: full
      params: ${sources.pg.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_check_interval: 1h }
    - from: postgres:public.ta
      name: pg_a
      params: ${sources.pg.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: mysql:ma
      name: my_a
      params: ${sources.my.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }

# `on_conflict` is deprecated for Cayenne, but the release requires it for
# change capture. The release ignores `runtime.params.cayenne_vnext`.
defaults:
  compare-variants: false

steps:
  - source-exec:
      pg: |
        CREATE TABLE items (id int PRIMARY KEY, v text);
        INSERT INTO items SELECT g, 'v' || g FROM generate_series(1, 500) g;
        CREATE TABLE ta (id int PRIMARY KEY, v text);
        INSERT INTO ta SELECT g, 'v' || g FROM generate_series(1, 1000) g;
  - source-exec:
      my: |
        CREATE TABLE ma (id int PRIMARY KEY, v varchar(50));
        INSERT INTO ma SELECT n, CONCAT('v', n) FROM (WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM s WHERE n < 1000) SELECT n FROM s) s;
  - start: {}
  - query: SELECT * FROM pg_a
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM my_a
    expect: { oracle: my }
    oracle-sql: SELECT * FROM ma
    eventually: 60s

  # Upgraded: each dataset loads from its source (with the changes made while
  # spiced was down), not from the release's copy, which is left as it was.
  - stop: {}
  - mark-files:
      id: release-copy
      matching: ['^\.spice/data/(full|pg_a|my_a)/', '^\.spice/data/metadata/cayenne\.db']
  - source-exec: { pg: "UPDATE items SET v = 'while down' WHERE id <= 20; UPDATE ta SET v = 'while down' WHERE id BETWEEN 500 AND 520" }
  - source-exec: { my: "UPDATE ma SET v = 'while down' WHERE id BETWEEN 500 AND 520" }
  # Capture the release's slot by identity, not a prefix matching both copies.
  - source-exec: { pg: "CREATE TABLE acked AS SELECT slot_name, confirmed_flush_lsn AS before FROM pg_replication_slots" }
  - source-query: { pg: "SELECT count(*) FROM acked" }
    expect: { rows: [['1']] }
  - upgrade: {}
  - query: SELECT * FROM full
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM items
  - query: SELECT * FROM pg_a
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM my_a
    expect: { oracle: my }
    oracle-sql: SELECT * FROM ma
    eventually: 60s
  - assert-log:
      contains: ["Dataset 'pg_a' will have its acceleration created by reading the source"]
      lacks: 'resuming from persisted GTID position dataset=my_a'
  - assert-files: { unchanged-since: release-copy }

  # Following the sources past what the release saw.
  - source-exec: { pg: "UPDATE ta SET v = 'after upgrade' WHERE id <= 100; DELETE FROM ta WHERE id BETWEEN 900 AND 950" }
  - source-exec: { my: "UPDATE ma SET v = 'after upgrade' WHERE id <= 100; DELETE FROM ma WHERE id BETWEEN 900 AND 950" }
  - query: SELECT * FROM pg_a
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM my_a
    expect: { oracle: my }
    oracle-sql: SELECT * FROM ma
    eventually: 60s
  # A shared slot must advance past the release's saved position. The default
  # location-scoped slot advances independently and leaves the release's slot
  # unchanged. Both checks require a slot, so neither can pass on an empty join.
  - source-query:
      pg: "SELECT CASE WHEN count(*) = 1 AND bool_and(s.confirmed_flush_lsn > a.before) THEN 'advanced' ELSE 'not yet' END AS slot FROM pg_replication_slots s JOIN acked a USING (slot_name)"
    when: { slot: explicit }
    expect: { rows: [['advanced']] }
    eventually: 60s
  - source-query:
      pg: "SELECT count(*) FROM pg_replication_slots s JOIN acked a USING (slot_name) WHERE s.confirmed_flush_lsn = a.before AND NOT s.active"
    when: { slot: default }
    expect: { rows: [['1']] }
  - source-query:
      pg: "SELECT count(*) FROM pg_replication_slots s, acked a WHERE s.slot_name <> a.slot_name AND s.active AND s.confirmed_flush_lsn > a.before"
    when: { slot: default }
    expect: { rows: [['1']] }
    eventually: 60s

  # Rolled back: the release on its own copy, which holds the state from
  # before the upgrade, while the sources changed again.
  - stop: {}
  - assert-files: { unchanged-since: release-copy }
  - source-exec: { pg: "UPDATE ta SET v = 'while rolled back' WHERE id BETWEEN 200 AND 250; UPDATE items SET v = 'while rolled back' WHERE id > 480" }
  - source-exec: { my: "UPDATE ma SET v = 'while rolled back' WHERE id BETWEEN 200 AND 250" }
  - downgrade: {}
  - refresh: full
  - query: SELECT * FROM full
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM items
  - query: SELECT * FROM pg_a
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM my_a
    expect: { oracle: my }
    oracle-sql: SELECT * FROM ma
    eventually: 60s
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM pg_a
    expect: { rows: [['0']] }
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM my_a
    expect: { rows: [['0']] }
  # With an explicit slot, the release finds it acknowledged past the position
  # its copy recorded as applied, and rebuilds that acceleration from the source
  # (a full re-read, which keeps no row the source no longer has); it resumes
  # MySQL from the GTID position its copy recorded, re-reading the binlog since.
  - assert-log:
      contains: ['Dataset ''pg_a'' will have its acceleration rebuilt from the source.*rebuild_cause="acknowledged_past"']
    when: { slot: explicit }
  - assert-log:
      lacks: "Dataset 'pg_a' will have its acceleration rebuilt from the source"
    when: { slot: default }
  - assert-log:
      count: { "resuming from persisted GTID position dataset=my_a": 1 }

  # Upgraded again: each dataset is served from its object-native copy, which
  # missed the changes made while rolled back, and catches up from its source.
  - stop: {}
  - source-exec: { pg: "UPDATE ta SET v = 'upgraded again' WHERE id BETWEEN 300 AND 320; UPDATE items SET v = 'upgraded again' WHERE id <= 5" }
  - source-exec: { my: "UPDATE ma SET v = 'upgraded again' WHERE id BETWEEN 300 AND 320" }
  - upgrade: {}
  - refresh: full
  - query: SELECT * FROM full
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM items
  - query: SELECT * FROM pg_a
    expect: { oracle: pg }
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM my_a
    expect: { oracle: my }
    oracle-sql: SELECT * FROM ma
    eventually: 60s
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM pg_a
    expect: { rows: [['0']] }
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM my_a
    expect: { rows: [['0']] }
