name: model-workload-identity
description: >
  OpenAI and Anthropic models follow one workload identity contract. An
  Anthropic model with no params takes its federation settings from the
  variables the Anthropic SDKs read (`ANTHROPIC_FEDERATION_RULE_ID`,
  `ANTHROPIC_ORGANIZATION_ID`, `ANTHROPIC_SERVICE_ACCOUNT_ID`,
  `ANTHROPIC_IDENTITY_TOKEN_FILE`), so it reads that token file, while an API
  key the Spicepod sets wins over those variables. An audience beside a token
  file, which carries its own, is a configuration error for both providers, and
  an OpenAI model with no credential says how to give it one instead of sending
  OpenAI a request without one. None of them reaches a network.

variants:
  sdk-env:
    env:
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_test
      ANTHROPIC_ORGANIZATION_ID: 00000000-0000-0000-0000-000000000000
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_test
      ANTHROPIC_IDENTITY_TOKEN_FILE: '${instance.dir}/missing-anthropic-token'

spicepod:
  version: v1
  kind: Spicepod
  name: model-workload-identity
  models:
    - from: anthropic:claude-sonnet-5-5
      name: claude_from_env
    - from: anthropic:claude-sonnet-5-5
      name: claude_key_wins
      params:
        anthropic_api_key: not-a-key
    - from: anthropic:claude-sonnet-5-5
      name: claude_audience_and_file
      params:
        anthropic_federation_rule_id: fdrl_test
        anthropic_organization_id: 00000000-0000-0000-0000-000000000000
        anthropic_service_account_id: svac_test
        anthropic_identity_token_audience: https://api.anthropic.com
        anthropic_identity_token_file: '${instance.dir}/identity-token'
    - from: openai:gpt-5-mini
      name: gpt_audience_and_file
      params:
        openai_identity_provider_id: idp_test
        openai_service_account_id: user-test
        openai_identity_token_audience: https://api.openai.com/v1
        openai_identity_token_file: '${instance.dir}/identity-token'
    - from: openai:gpt-5-mini
      name: gpt_no_credential
steps:
  - start: { ready: false }
  - assert-log:
      count:
        "WARN .*claude_from_env.*Failed to read the workload identity token file '.*/missing-anthropic-token'": '>=1'
        "WARN .*Invalid value for parameter anthropic_identity_token_audience\\. `anthropic_identity_token_audience` applies only to an identity token Spice requests, from GitHub Actions or the workload's cloud identity, but the identity token comes from `anthropic_identity_token_file`, whose audience is set where it is issued\\. Remove one of them\\. See: https://spiceai\\.org/docs/components/models/anthropic": 1
        "WARN .*Invalid value for parameter openai_identity_token_audience\\. `openai_identity_token_audience` applies only to an identity token Spice requests, from GitHub Actions or the workload's cloud identity, but the identity token comes from `openai_identity_token_file`, whose audience is set where it is issued\\. Remove one of them\\. See: https://spiceai\\.org/docs/components/models/openai": 1
        "WARN .*Found no credential for model 'gpt_no_credential' \\(openai\\): set `openai_api_key`, or workload identity federation with `openai_identity_provider_id` and `openai_service_account_id`\\. See: https://spiceai\\.org/docs/components/models/openai": '>=1'
      lacks:
        - "claude_key_wins.*identity token"
        - "You didn't provide an API key"
        - "gpt_no_credential.*Report a bug"
    eventually: 60s
