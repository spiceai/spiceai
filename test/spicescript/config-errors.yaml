name: config-errors
description: >
  A dataset with a configuration or connection mistake is reported in Error
  with a message that names it and what is wrong — an unknown connector
  (listing the known ones), an unreachable host, a rejected password, a
  primary key, time column or partition naming no column, refresh_sql over
  another table, a missing file, a missing table — while a healthy dataset
  beside them serves. A Cayenne dataset that still names the retired Turso
  metastore loads on the SQLite metastore it shares with a healthy one, and
  is warned once to drop the param. A dataset and a view that set the removed
  `turso` acceleration engine each fail to load with one error naming the fix,
  and are never switched to Cayenne.

sources:
  src: { kind: postgres }
spicepod:
  version: v1
  kind: Spicepod
  name: probe-config
  datasets:
    - { from: 'postgres:public.t', name: healthy, params: '${sources.src.params}' }
    - { from: 'nosuchconnector:whatever', name: bad_connector }
    - { from: 'postgres:public.t', name: bad_host, params: { $merge: '${sources.src.params}', pg_host: no-such-host.invalid } }
    - { from: 'postgres:public.t', name: bad_password, params: { $merge: '${sources.src.params}', pg_pass: wrong } }
    - { from: 'postgres:public.t', name: bad_pk, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, primary_key: nosuchcol } }
    - { from: 'postgres:public.t', name: bad_time_column, params: '${sources.src.params}', time_column: nosuchcol, acceleration: { enabled: true, engine: cayenne, refresh_mode: append } }
    - { from: 'postgres:public.t', name: bad_partition, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, partition_by: [nosuchcol] } }
    - { from: 'postgres:public.t', name: bad_refresh_sql, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, refresh_sql: 'SELECT * FROM somewhere_else' } }
    - { from: 'file:/no/such/file.parquet', name: bad_file }
    - { from: 'postgres:public.no_such_table', name: bad_table, params: '${sources.src.params}' }
    - { from: 'postgres:public.t', name: healthy_cayenne, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, mode: file, params: { cayenne_metastore: sqlite, cayenne_file_path: '${instance.dir}/healthy_cayenne', cayenne_metadata_dir: '${instance.dir}/meta' } } }
    - { from: 'postgres:public.t', name: turso_param, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, mode: file, params: { cayenne_metastore: turso, cayenne_file_path: '${instance.dir}/turso_param', cayenne_metadata_dir: '${instance.dir}/meta' } } }
    - { from: 'postgres:public.t', name: turso_param_memory, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, mode: memory, params: { cayenne_metastore: turso } } }
    - { from: 'postgres:public.t', name: turso_engine, params: '${sources.src.params}', acceleration: { enabled: true, engine: turso } }
  views:
    - { name: turso_view, sql: 'SELECT * FROM healthy', acceleration: { enabled: true, engine: turso } }
steps:
  - source-exec: { src: "CREATE TABLE t (id int PRIMARY KEY, v text); INSERT INTO t VALUES (1, 'a')" }
  - start: { ready: false }
  - query: SELECT * FROM healthy
    expect: { rows: [['1', a]] }
    eventually: 30s
  - assert-status: { dataset: bad_connector, status: Error, message-contains: "Unknown data connector 'nosuchconnector'. Available: abfs" }
    eventually: 30s
  - assert-status: { dataset: bad_host, status: Error, message-contains: "Cannot connect to the dataset bad_host (postgres) on no-such-host.invalid" }
    eventually: 30s
  - assert-status: { dataset: bad_password, status: Error, message-contains: "Cannot connect to the dataset bad_password (postgres). Authentication failed. Ensure that the username and password are correctly configured" }
    eventually: 30s
  - assert-status: { dataset: bad_pk, status: Error, message-contains: "Failed to setup the dataset bad_pk (postgres). Unable to create dataset acceleration: Invalid configuration: Primary key column 'nosuchcol' was not found in the schema. Valid columns: id, v" }
    eventually: 30s
  - assert-status: { dataset: bad_time_column, status: Error, message-contains: "time_column 'nosuchcol' was not found in dataset bad_time_column" }
    eventually: 30s
  - assert-status: { dataset: bad_partition, status: Error, message-contains: "Failed to setup the dataset bad_partition (postgres)" }
    eventually: 30s
  - assert-status: { dataset: bad_refresh_sql, status: Error, message-contains: "Table name in refresh_sql should be bad_refresh_sql, is somewhere_else" }
    eventually: 30s
  - assert-status: { dataset: bad_file, status: Error, message-contains: "No data files are yet available for the dataset bad_file (file)" }
    eventually: 30s
  - assert-status: { dataset: bad_table, status: Error, message-contains: "Failed to load the dataset bad_table (postgres). The table, 'public.no_such_table', was not found." }
    eventually: 30s
  # The Turso metastore is removed: a dataset that still names it has no effect,
  # so it loads on the SQLite catalog it shares with a healthy dataset, in both
  # modes, and is warned once to drop the param.
  - query: SELECT * FROM healthy_cayenne
    expect: { rows: [['1', a]] }
    eventually: 30s
  - query: SELECT * FROM turso_param
    expect: { rows: [['1', a]] }
    eventually: 30s
  - query: SELECT * FROM turso_param_memory
    expect: { rows: [['1', a]] }
    eventually: 30s
  - assert-log:
      count:
        "Dataset 'turso_param' sets `cayenne_metastore: turso`, which is no longer supported and has no effect: the dataset uses the built-in metastore. Remove `cayenne_metastore` from this dataset. See: https://spiceai.org/docs/components/data-accelerators/cayenne/migration": 1
        "Dataset 'turso_param_memory' sets `cayenne_metastore: turso`, which is no longer supported and has no effect": 1
  - assert-files: { contains: ['^meta/cayenne\.db$'], lacks: ['^meta/cayenne\.db-log$'] }
  # The `turso` acceleration engine is removed. Only the dataset and the view
  # that set it fail to load, each with one error, and neither is rebuilt on
  # Cayenne behind the user's back: a dataset that falls back to Cayenne would
  # answer this query.
  - query: SELECT * FROM turso_engine
    expect-error: turso_engine
  - query: SELECT * FROM turso_view
    expect-error: turso_view
  - assert-log:
      count:
        "ERROR .*Failed to load dataset 'turso_engine': the acceleration engine `turso` is no longer supported as of v2\\.5 and cannot be used\\. Set `acceleration\\.engine: cayenne`, or remove `engine` to use the default, which is `cayenne`, then delete the old engine's acceleration files and snapshots\\. See: https://spiceai\\.org/docs/components/data-accelerators/cayenne/migration dataset=\"turso_engine\"$": 1
        "ERROR .*Failed to load view 'turso_view': the acceleration engine `turso` is no longer supported as of v2\\.5 and cannot be used\\. Set `acceleration\\.engine: cayenne`, or remove `engine` to use the default, which is `cayenne`, then delete the old engine's acceleration files and snapshots\\. See: https://spiceai\\.org/docs/components/data-accelerators/cayenne/migration view=\"turso_view\"$": 1
      lacks: ["deprecated .*turso_(engine|view)", "Unknown acceleration engine 'turso'"]
