name: truncate-probe-3
description: >
  Probe for spiceai/spiceai#16292 (not for merge): the object-native variant of
  postgres-cdc-truncate, repeated, at debug log level.
sources:
  src: { kind: postgres }
variants:
  object-native: object-native
spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-truncate-probe
  datasets:
    - from: postgres:public.a
      name: a
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: postgres:public.b
      name: b
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  compare-variants: false
  spiced-args: ["-v"]
steps:
  - source-exec:
      src: |
        CREATE TABLE a (id int PRIMARY KEY, v text);
        CREATE TABLE b (id int PRIMARY KEY, v text);
        INSERT INTO a SELECT i, 'a' || i FROM generate_series(1, 1000) i;
        INSERT INTO b SELECT i, 'b' || i FROM generate_series(1, 1000) i;
  - start: {}
  - query: SELECT * FROM a
  - source-exec: { src: "TRUNCATE a" }
  - query: SELECT count(*) AS n FROM a
    eventually: 30s
  - source-exec: { src: "INSERT INTO a VALUES (5, 'new5'), (2000, 'new2000')" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "BEGIN; TRUNCATE a; INSERT INTO a SELECT i, 'again' || i FROM generate_series(1, 10) i; COMMIT" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "TRUNCATE a, b; INSERT INTO b VALUES (1, 'b-after')" }
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 30s
  - restart: {}
  - query: SELECT * FROM a
    expect-empty: true
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 15s
  - source-exec: { src: "INSERT INTO a VALUES (5, 'new5'), (2000, 'new2000')" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "BEGIN; TRUNCATE a; INSERT INTO a SELECT i, 'again' || i FROM generate_series(1, 10) i; COMMIT" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "TRUNCATE a, b; INSERT INTO b VALUES (1, 'b-after')" }
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 30s
  - restart: {}
  - query: SELECT * FROM a
    expect-empty: true
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 15s
  - source-exec: { src: "INSERT INTO a VALUES (5, 'new5'), (2000, 'new2000')" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "BEGIN; TRUNCATE a; INSERT INTO a SELECT i, 'again' || i FROM generate_series(1, 10) i; COMMIT" }
  - query: SELECT * FROM a
    eventually: 30s
  - source-exec: { src: "TRUNCATE a, b; INSERT INTO b VALUES (1, 'b-after')" }
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 30s
  - restart: {}
  - query: SELECT * FROM a
    expect-empty: true
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 15s
