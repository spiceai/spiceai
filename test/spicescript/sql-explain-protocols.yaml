{
  "name": "sql-explain-protocols",
  "description": "Documented EXPLAIN options over Flight SQL and HTTP; metric text is execution-dependent.",
  "spicepod": {
    "version": "v1",
    "kind": "Spicepod",
    "name": "sql-explain-protocols"
  },
  "steps": [
    {
      "start": {}
    },
    {
      "query": "EXPLAIN ANALYZE SELECT 1 AS n",
      "protocols": [
        "flightsql"
      ],
      "expect": {}
    },
    {
      "http": {
        "method": "POST",
        "path": "/v1/sql",
        "headers": {
          "content-type": "text/plain"
        },
        "body": "EXPLAIN ANALYZE SELECT 1 AS n"
      },
      "expect": {
        "status": 200,
        "body-contains": "plan"
      }
    },
    {
      "query": "EXPLAIN ANALYZE VERBOSE SELECT 1 AS n",
      "protocols": [
        "flightsql"
      ],
      "expect": {}
    },
    {
      "http": {
        "method": "POST",
        "path": "/v1/sql",
        "headers": {
          "content-type": "text/plain"
        },
        "body": "EXPLAIN ANALYZE VERBOSE SELECT 1 AS n"
      },
      "expect": {
        "status": 200,
        "body-contains": "plan"
      }
    },
    {
