name: full-refresh-chaos
description: >
  A Cayenne acceleration refreshed in full never serves a partial table
  through faults, whatever the source: with the source down a refresh fails
  and the last good rows stay served; when every row is replaced and spiced is
  killed during the refresh that picks them up, it comes back with whole rows
  and then catches up. Readers always see the full row count, and the table
  ends equal to the same rows in PostgreSQL. Run over databases, lakehouse
  tables, an object store and local files. With object-native data, the table's
  files are in the state location, and an instance that loses its directory
  serves the whole table again while the source is down.

sources:
  src: { kind: '${matrix.src}' }
  ref: { kind: postgres }
  # The state locations of the object-native-data variants.
  lake: { kind: rustfs }
  slow-lake: { kind: rustfs, latency: 20ms }

matrix:
  src: [postgres, mysql, clickhouse, iceberg, ducklake, rustfs, files]

# The spicepod as written, and the same with the prototype object-native Cayenne
# metastore in place of SQLite.
variants:
  as-written: federated
  object-native: object-native
  # Object-native data (#16131): data files in the state location, which an
  # instance that loses its directory serves again without the source.
  object-native-data-local: object-native-data-local
  object-native-data-rustfs: object-native-data-rustfs
  object-native-data-rustfs-latency: object-native-data-rustfs-latency

spicepod:
  version: v1
  kind: Spicepod
  name: full-refresh-chaos
  datasets:
    - from: '${sources.src.from_prefix}facts${sources.src.from_suffix}'
      name: facts
      params: ${sources.src.table_params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_check_interval: 1h }

defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: ref }
  query-timeout: 30s

steps:
  # Every version of the table has 50,000 rows, so a reader can tell a
  # partial one.
  - generate:
      src: &facts
        table: facts
        rows: 50000
        seed: 41
        files: 4
        columns:
          - { name: id, sequence: 1 }
          - { name: grp, int: [1, 200] }
          - { name: amount, decimal: { range: [0, 1000], scale: 2 } }
          - { name: label, choice: [alpha, beta, gamma, delta] }
          - { name: note, text: [3, 20], nulls: 0.2 }
    mirror: ref
  - start: {}
  - query: SELECT count(*) AS n, sum(amount) AS total, count(note) AS notes FROM facts
  - background:
      id: whole-table
      concurrency: 2
      query: SELECT count(*) AS n FROM facts
      expect: { n: '50000' }

  # The source down: a refresh fails and the last good rows stay served.
  # (Local files have no server to stop.)
  - stop-source: src
    when: &stoppable { src: [postgres, mysql, clickhouse, iceberg, ducklake, rustfs] }
  - refresh: facts
    expect-error: true
    when: *stoppable
  - query: SELECT count(*) AS n, sum(amount) AS total FROM facts
    when: *stoppable
  - start-source: src
    when: *stoppable
  # The failed refresh retries until the source is back. Let it succeed
  # before the rows are replaced: `generate` loads in batches, and a retry
  # reading the source half-loaded would rightly serve a partial table.
  - refresh: facts
    when: *stoppable

  # Every row replaced, and spiced killed during the refresh that reads them.
  - generate:
      src:
        <<: *facts
        seed: 42
        files: 3
    mirror: ref
  - refresh: { dataset: facts, wait: false }
  - restart: { kill: KILL }
  - refresh: facts
  - query: SELECT count(*) AS n, sum(amount) AS total, count(note) AS notes FROM facts
    eventually: 60s
  - query: SELECT label, count(*) AS n, sum(amount) AS total FROM facts GROUP BY label ORDER BY label
    eventually: 30s
  - query: SELECT * FROM facts WHERE grp = 17 ORDER BY id

  - stop-background: { id: whole-table, allow: ['^[45][0-9][0-9] ', 'error sending request', 'connection', 'not ready'] }

  # Object-native data (#16131): the table's files are in the state
  # location, under its log's data/ folder, and none at a local `s3:` path.
  - assert-files: { contains: '^state/cayenne/v1/datasets/facts-[^/]+/data/' }
    only: object-native-data-local
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/facts-, contains: /data/, min: 1 }
    only: object-native-data-rustfs
  - assert-objects: { source: slow-lake, prefix: state/cayenne/v1/datasets/facts-, contains: /data/, min: 1 }
    only: object-native-data-rustfs-latency
  - assert-files: { lacks: '(^|/)s3:' }
    only: &object-native-data [object-native-data-local, object-native-data-rustfs, object-native-data-rustfs-latency]

  # An instance that loses its directory serves the whole table from the
  # location alone: the source is down, so it cannot read the rows again.
  - stop: {}
    only: *object-native-data
    when: *stoppable
  - wipe-instance-dir: { keep: [state] }
    only: *object-native-data
    when: *stoppable
  - assert-files: { lacks: '^\.spice/' }
    only: *object-native-data
    when: *stoppable
  - stop-source: src
    when: *stoppable
  - start: { ready: false }
    only: *object-native-data
    when: *stoppable
  - query: SELECT count(*) AS n, sum(amount) AS total, count(note) AS notes FROM facts
    eventually: 60s
    only: *object-native-data
    when: *stoppable
  - query: SELECT * FROM facts WHERE grp = 17 ORDER BY id
    only: *object-native-data
    when: *stoppable
  - assert-files: { lacks: '(^|/)s3:' }
    only: *object-native-data
    when: *stoppable
  - start-source: src
    when: *stoppable
