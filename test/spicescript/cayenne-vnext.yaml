name: cayenne-vnext
description: >
  `runtime.params.cayenne_vnext: enabled` puts new Cayenne datasets on the
  object-native metastore and never moves one already on SQLite: that dataset
  stops with a message naming it and the fix, and starting it once with
  `mode: file_create` reloads it from its source into the object-native
  metastore, where it stays across a restart. With the flag off, a dataset in
  the object-native metastore stops the same way, with a message naming it
  and the fix, until a `mode: file_create` start reloads it from its source
  into SQLite; and an object-store data path (an `s3://` `cayenne_file_path`,
  S3 Express included) fails to load with a message naming the dataset, the
  path and the fix. Turning the flag on again stops the datasets now on
  SQLite rather than moving them.
  Every answer matches the PostgreSQL source throughout, and a value other than
  `enabled` or `disabled` stops the dataset with a message naming the param.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext
  datasets:
    - from: postgres:public.before_flag
      name: before_flag
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE before_flag (id integer PRIMARY KEY, v text);
        INSERT INTO before_flag SELECT i, 'b' || i FROM generate_series(1, 2000) AS i;
        CREATE TABLE after_flag (id integer PRIMARY KEY, v text);
        INSERT INTO after_flag SELECT i, 'a' || i FROM generate_series(1, 3000) AS i;
  - start: {}
  - query: SELECT * FROM before_flag
    eventually: 60s
  - assert-log: { lacks: ['object-native metastore'] }

  # The flag on, and a dataset added: the new one goes to the object-native
  # metastore, and the one already on SQLite stops rather than moving.
  - restart:
      ready: false
      patch:
        spicepod:
          runtime: { params: { cayenne_vnext: enabled } }
          datasets:
            - from: postgres:public.before_flag
              name: before_flag
              params: ${sources.src.params}
              acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
            - from: postgres:public.after_flag
              name: after_flag
              params: ${sources.src.params}
              acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the SQLite Cayenne metastore, but `runtime.params.cayenne_vnext` is enabled" }
    eventually: 60s
  - query: SELECT * FROM after_flag
    eventually: 60s
  - assert-log: { contains: ['Created the Cayenne object-native metastore'] }
  - source-exec: { src: "UPDATE after_flag SET v = 'changed' WHERE id % 7 = 0; DELETE FROM after_flag WHERE id > 2900" }
  - refresh: after_flag
  - query: SELECT * FROM after_flag
    eventually: 60s

  # Starting before_flag once with `mode: file_create` reloads it into the
  # object-native metastore, and it stays there across a restart.
  - source-exec: { src: "UPDATE before_flag SET v = 'moved' WHERE id % 3 = 0" }
  - restart:
      patch: { datasets: { before_flag: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM before_flag
    eventually: 60s
  - source-exec: { src: "UPDATE before_flag SET v = 'post move' WHERE id % 11 = 0" }
  - restart:
      patch: { datasets: { before_flag: { acceleration: { mode: file } } } }
  - refresh: before_flag
  - query: SELECT * FROM before_flag
    eventually: 60s

  # The flag off: both datasets are in the object-native metastore, so both
  # stop rather than move to SQLite, as before_flag stopped rather than move
  # when the flag came on. Starting them once with `mode: file_create` reloads
  # them from the source into SQLite (the changes made just before the restart
  # are in the answers, which an older copy would not have).
  - source-exec: { src: "UPDATE after_flag SET v = 'flag off' WHERE id % 5 = 0; UPDATE before_flag SET v = 'flag off' WHERE id % 13 = 0" }
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: disabled } } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "Dataset 'after_flag' is accelerated in the object-native Cayenne metastore, but `runtime.params.cayenne_vnext` is not enabled, and an existing acceleration is not moved to the SQLite metastore. Set `runtime.params.cayenne_vnext: enabled` to keep serving it, or start it once with `acceleration.mode: file_create`" }
    eventually: 60s
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the object-native Cayenne metastore, but `runtime.params.cayenne_vnext` is not enabled" }
    eventually: 60s
  - restart:
      patch: { datasets: { after_flag: { acceleration: { mode: file_create } }, before_flag: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM after_flag
    eventually: 60s
  - query: SELECT * FROM before_flag
    eventually: 60s
  - restart:
      patch: { datasets: { after_flag: { acceleration: { mode: file } }, before_flag: { acceleration: { mode: file } } } }
  - query: SELECT * FROM after_flag
    eventually: 60s

  # The flag on again: both datasets are on SQLite now, so both stop rather
  # than move to the object-native metastore.
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: enabled } } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "Dataset 'after_flag' is accelerated in the SQLite Cayenne metastore" }
    eventually: 60s
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the SQLite Cayenne metastore" }
    eventually: 60s

  # A value the flag does not take.
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: 'yes' } } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "`runtime.params.cayenne_vnext` is 'yes'. Set it to 'enabled' or 'disabled'." }
    eventually: 60s

  # The flag off: an object-store data path fails to load, a standard bucket
  # and an S3 Express one alike, before anything is read or written there.
  - restart:
      ready: false
      patch:
        spicepod: { runtime: { params: { cayenne_vnext: disabled } } }
        datasets:
          after_flag: { acceleration: { params: { cayenne_file_path: 's3://cayenne-vnext-data/prefix' } } }
          before_flag: { acceleration: { params: { cayenne_file_path: 's3://cayenne-vnext--usw2-az1--x-s3/prefix' } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "Failed to load dataset 'after_flag' (cayenne): `cayenne_file_path` 's3://cayenne-vnext-data/prefix' is an object-store path, which Cayenne does not support for a dataset's own data. Remove `cayenne_file_path` (and `cayenne_s3_zone_ids`) to keep the data on local disk; Cayenne data in a bucket comes with `runtime.state.location`." }
    eventually: 60s
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Failed to load dataset 'before_flag' (cayenne): `cayenne_file_path` 's3://cayenne-vnext--usw2-az1--x-s3/prefix' is an object-store path" }
    eventually: 60s
  - assert-log:
      contains: ["Failed to load dataset 'after_flag' \\(cayenne\\): `cayenne_file_path` 's3://cayenne-vnext-data/prefix' is an object-store path, which Cayenne does not support for a dataset's own data\\. .*See: https://spiceai\\.org/docs/components/data-accelerators/cayenne"]
  - assert-files: { lacks: ['s3:'] }
