name: cayenne-vnext
description: >
  `runtime.params.cayenne_vnext: enabled` puts new Cayenne datasets on the
  object-native metastore and never moves an existing one: a dataset whose
  metastore differs from the flag stops with a message naming the dataset and
  the fix, in either direction. Starting it once with `mode: file_create`
  reloads it from its source into the metastore the flag names, and it stays
  there across a restart. Every answer matches the PostgreSQL source
  throughout, and a value other than `enabled` or `disabled` stops the dataset
  with a message naming the param.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext
  datasets:
    - from: postgres:public.before_flag
      name: before_flag
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE before_flag (id integer PRIMARY KEY, v text);
        INSERT INTO before_flag SELECT i, 'b' || i FROM generate_series(1, 2000) AS i;
        CREATE TABLE after_flag (id integer PRIMARY KEY, v text);
        INSERT INTO after_flag SELECT i, 'a' || i FROM generate_series(1, 3000) AS i;
  - start: {}
  - query: SELECT * FROM before_flag
    eventually: 60s
  - assert-log: { lacks: ['object-native metastore'] }

  # The flag on, and a dataset added: the new one goes to the object-native
  # metastore, and the one already on SQLite stops rather than moving.
  - restart:
      ready: false
      patch:
        spicepod:
          runtime: { params: { cayenne_vnext: enabled } }
          datasets:
            - from: postgres:public.before_flag
              name: before_flag
              params: ${sources.src.params}
              acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
            - from: postgres:public.after_flag
              name: after_flag
              params: ${sources.src.params}
              acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the SQLite Cayenne metastore, but `runtime.params.cayenne_vnext` is enabled" }
    eventually: 60s
  - query: SELECT * FROM after_flag
    eventually: 60s
  - assert-log: { contains: ['Created the Cayenne object-native metastore'] }
  - source-exec: { src: "UPDATE after_flag SET v = 'changed' WHERE id % 7 = 0; DELETE FROM after_flag WHERE id > 2900" }
  - refresh: after_flag
  - query: SELECT * FROM after_flag
    eventually: 60s

  # Starting before_flag once with `mode: file_create` reloads it into the
  # object-native metastore, and it stays there across a restart.
  - source-exec: { src: "UPDATE before_flag SET v = 'moved' WHERE id % 3 = 0" }
  - restart:
      patch: { datasets: { before_flag: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM before_flag
    eventually: 60s
  - source-exec: { src: "UPDATE before_flag SET v = 'post move' WHERE id % 11 = 0" }
  - restart:
      patch: { datasets: { before_flag: { acceleration: { mode: file } } } }
  - refresh: before_flag
  - query: SELECT * FROM before_flag
    eventually: 60s

  # The flag off: both datasets are in the object-native metastore, so both
  # stop rather than moving to SQLite.
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: disabled } } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "Dataset 'after_flag' is accelerated in the object-native Cayenne metastore, but `runtime.params.cayenne_vnext` is not enabled" }
    eventually: 60s
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the object-native Cayenne metastore" }
    eventually: 60s

  # `mode: file_create` reloads after_flag into SQLite; before_flag still stops.
  - source-exec: { src: "UPDATE after_flag SET v = 'to sqlite' WHERE id % 5 = 0" }
  - restart:
      ready: false
      patch: { datasets: { after_flag: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM after_flag
    eventually: 60s
  - assert-status: { dataset: before_flag, status: Error, message-contains: "Dataset 'before_flag' is accelerated in the object-native Cayenne metastore" }
    eventually: 60s

  # The flag on again: before_flag is served from the object-native metastore,
  # and after_flag, now on SQLite, stops. Its object-native copy is gone, so the
  # recreate left nothing for it to fall back to.
  - restart:
      ready: false
      patch:
        spicepod: { runtime: { params: { cayenne_vnext: enabled } } }
        datasets: { after_flag: { acceleration: { mode: file } } }
  - refresh: before_flag
  - query: SELECT * FROM before_flag
    eventually: 60s
  - assert-status: { dataset: after_flag, status: Error, message-contains: "Dataset 'after_flag' is accelerated in the SQLite Cayenne metastore" }
    eventually: 60s

  # A value the flag does not take.
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: 'yes' } } } }
  - assert-status: { dataset: after_flag, status: Error, message-contains: "`runtime.params.cayenne_vnext` is 'yes'. Set it to 'enabled' or 'disabled'." }
    eventually: 60s
