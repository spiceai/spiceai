name: mysql-cdc-served-while-source-down
description: >
  A MySQL `refresh_mode: changes` dataset whose acceleration is already on disk
  is served from that acceleration when the runtime restarts while MySQL is
  stopped or frozen, as a `refresh_mode: full` dataset is. Once MySQL answers,
  replication resumes from the recorded GTID position and applies every change
  made during the outage.

sources:
  my: { kind: mysql }

matrix:
  engine: [cayenne]

variants:
  as-written: {}
  object-native: object-native

spicepod:
  version: v1
  kind: Spicepod
  name: mysql-cdc-served-while-source-down
  datasets:
    - from: mysql:busy
      name: busy
      params: ${sources.my.params}
      acceleration: { enabled: true, engine: '${matrix.engine}', mode: file, refresh_mode: changes, primary_key: id }
    - from: mysql:idle
      name: idle
      params: ${sources.my.params}
      acceleration: { enabled: true, engine: '${matrix.engine}', mode: file, refresh_mode: changes, primary_key: id }

defaults:
  expect: { oracle: my }

steps:
  - source-exec:
      my: |
        CREATE TABLE busy (id int PRIMARY KEY, v varchar(50), n decimal(12, 2));
        INSERT INTO busy SELECT n, CONCAT('v', n), n * 1.5 FROM (WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM s WHERE n < 1000) SELECT n FROM s) s;
        CREATE TABLE idle (id int PRIMARY KEY, v varchar(50));
        INSERT INTO idle VALUES (1, 'a'), (2, 'b'), (3, 'c');
  - start: {}
  - query: SELECT * FROM busy
    oracle-sql: SELECT * FROM busy
    eventually: 60s
    id: busy-loaded
  - query: SELECT * FROM idle
    oracle-sql: SELECT * FROM idle
    eventually: 60s
    id: idle-loaded

  # Restart with MySQL stopped: served from the acceleration.
  - kill-spiced: {}
  - stop-source: my
  - start: { ready: false }
  - query: SELECT * FROM busy
    expect: { same-as: busy-loaded }
    eventually: 30s
  - query: SELECT * FROM idle
    expect: { same-as: idle-loaded }
    eventually: 30s
  - assert-status: { dataset: busy, ready: true }
    eventually: 30s

  # MySQL returns with changes made while it was unreachable to Spice.
  - start-source: my
  - source-exec:
      my: |
        UPDATE busy SET v = 'after outage' WHERE id % 7 = 0;
        DELETE FROM busy WHERE id > 990;
        INSERT INTO idle VALUES (4, 'd');
  - query: SELECT * FROM busy
    oracle-sql: SELECT * FROM busy
    eventually: 90s
    id: busy-caught-up
  - query: SELECT * FROM idle
    oracle-sql: SELECT * FROM idle
    eventually: 90s
    id: idle-caught-up
  - assert-log: { lacks: 'rebuilt the acceleration from the source' }

  # Restart with MySQL frozen: served from the acceleration. A graceful stop
  # makes the applied changes durable, so the restart serves them.
  - stop: {}
  - pause-source: my
  - start: { ready: false }
  - query: SELECT * FROM busy
    expect: { same-as: busy-caught-up }
    eventually: 30s
  - query: SELECT * FROM idle
    expect: { same-as: idle-caught-up }
    eventually: 30s
  - assert-status: { dataset: busy, ready: true }
    eventually: 30s
  - unpause-source: my
  - source-exec: { my: "INSERT INTO busy VALUES (5000, 'after freeze', 0)" }
  - query: SELECT * FROM busy
    oracle-sql: SELECT * FROM busy
    eventually: 60s

  # Each row once.
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM busy
    expect: { rows: [['0']] }
