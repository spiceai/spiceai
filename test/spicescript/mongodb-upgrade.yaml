name: mongodb-upgrade
duration: 26s
description: >
  MongoDB change capture resumes across an upgrade in place from each of the
  last two releases: a `refresh_mode: changes` acceleration applies every
  change made while the runtime was down, each once, resuming from the resume
  token the release recorded rather than snapshotting the collection again,
  and keeps following afterwards. With the object-native metastore the
  acceleration loads from its source instead: the collection is snapshotted
  again, and the binary under test follows it from there.

matrix:
  from: [2.3.x, 2.4.x]
from: '${matrix.from}'

sources:
  mongo:
    kind: docker
    image: docker.io/library/mongo:9.0
    ports: [27017]
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ready: >-
      mongosh --quiet --eval "try { rs.status(); db.hello().isWritablePrimary ? 1 : 0 } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); 0 }" | grep -qx 1
  ref: { kind: postgres }

# The MongoDB connector's lines about its resume token are at `info` under its
# own target, which the default log filter leaves out.
variants:
  sqlite: { env: { SPICED_LOG: info } }
  object-native: { env: { SPICED_LOG: info }, spicepod: { runtime: { params: { cayenne_vnext: enabled } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: mongodb-upgrade
  datasets:
    - from: mongodb:t
      name: t
      params:
        mongodb_connection_string: 'mongodb://127.0.0.1:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id, on_conflict: { _id: upsert } }

# String `_id`s: a NumberLong `_id` cannot resume from its token at all (#15544).
# `on_conflict` is deprecated for Cayenne, but 2.3 requires it for change streams.
defaults:
  expect: { oracle: ref }
  compare-variants: false

steps:
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          const docs = [];
          for (let g = 1; g <= 500; g++) { docs.push({ _id: 'k' + g, i: NumberLong(g % 17 - 8), s: 'v' + g }); }
          db.t.insertMany(docs);"
  - source-exec:
      ref: >-
        CREATE TABLE t (_id text PRIMARY KEY, i bigint, s text);
        INSERT INTO t SELECT 'k' || g, g % 17 - 8, 'v' || g FROM generate_series(1, 500) g;
  - start: {}
  - query: SELECT * FROM t
    eventually: 60s
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          db.t.updateMany({ i: NumberLong(1) }, { \$set: { s: 'running' } });
          db.t.deleteMany({ i: NumberLong(-8) });"
  - source-exec:
      ref: "UPDATE t SET s = 'running' WHERE i = 1; DELETE FROM t WHERE i = -8;"
  - query: SELECT * FROM t
    eventually: 60s

  # Down, the source changes; then up on the binary under test.
  - stop: {}
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          db.t.insertMany([{ _id: 'k1001', i: NumberLong(0), s: 'while down' }]);
          db.t.updateMany({ i: NumberLong(2) }, { \$set: { s: 'while down' } });
          db.t.deleteMany({ i: NumberLong(3) });"
  - source-exec:
      ref: "INSERT INTO t VALUES ('k1001', 0, 'while down'); UPDATE t SET s = 'while down' WHERE i = 2; DELETE FROM t WHERE i = 3;"
  - upgrade: {}
  - query: SELECT * FROM t
    eventually: 60s
  - query: SELECT count(*) - count(DISTINCT _id) AS duplicates FROM t
    expect: { rows: [['0']] }
  # Resumed from the recorded token: the collection was snapshotted once, by the
  # release's first start.
  - assert-log:
      count:
        'bootstrapping accelerator from collection snapshot': 1
        'resumed from persisted resume token': '>=1'
    except: object-native
  # Loaded from the source: the collection is snapshotted again, and nothing
  # resumes from the release's token.
  - assert-log:
      count: { 'bootstrapping accelerator from collection snapshot': 2 }
      lacks: 'resumed from persisted resume token'
    only: object-native

  # And the upgraded runtime keeps following.
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "db.t.updateOne({ _id: 'k1001' }, { \$set: { s: 'after' } });"
  - source-exec: { ref: "UPDATE t SET s = 'after' WHERE _id = 'k1001'" }
  - query: SELECT * FROM t
    eventually: 30s
