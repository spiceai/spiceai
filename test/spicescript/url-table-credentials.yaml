name: url-table-credentials
duration: 13s
description: >
  Object-store URL tables (`runtime.params.url_tables: enabled`) read with the
  credentials of the dataset whose `from` covers the URL, and only the objects
  that dataset reads: objects under its `from` with the suffix it lists by. A
  URL no dataset covers is read without credentials: a public container still
  reads, and a private object is refused with an error that names the nearest
  dataset. The runtime's own environment credentials (here Azurite's emulator
  key) never reach a location the query chose. A dataset covers its location
  whether or not it loaded, and a covering dataset whose secret does not
  resolve fails the URL table rather than reading without credentials.

sources:
  az:
    kind: docker
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: [azurite-blob, --blobHost, 0.0.0.0, --blobPort, '10000']
    ports: [10000]
    ready: wget -q -O /dev/null http://127.0.0.1:10000/devstoreaccount1?comp=list 2>&1 | grep -q 403 || wget -S -q -O /dev/null http://127.0.0.1:10000/devstoreaccount1?comp=list 2>&1 | grep -q HTTP/

variants:
  azurite:
    env:
      # The runtime's own Azure credentials: the emulator account and its key.
      AZURE_STORAGE_USE_EMULATOR: 'true'
      AZURITE_BLOB_STORAGE_URL: 'http://127.0.0.1:${sources.az.port.10000}'

spicepod:
  version: v1
  kind: Spicepod
  name: url-table-credentials
  runtime:
    params:
      url_tables: enabled
  datasets:
    - from: abfs://hrdata@devstoreaccount1.dfs.core.windows.net/exports/
      name: exports
      params: { file_format: csv, abfs_use_emulator: 'true' }
    - from: abfs://hrdata@devstoreaccount1.dfs.core.windows.net/empty/
      name: never_loads
      params: { file_format: csv, abfs_use_emulator: 'true' }
    - from: abfs://hrdata@devstoreaccount1.dfs.core.windows.net/locked/
      name: locked
      params:
        file_format: csv
        abfs_use_emulator: 'true'
        abfs_access_key: '${secrets:no_such_secret}'

steps:
  - source-exec:
      az: |
        cat > /tmp/put.js <<'JS'
        // Seeds Azurite with SharedKey-signed requests: put.js <container> [<blob> <body>] [public]
        const crypto = require("crypto"), http = require("http");
        const account = "devstoreaccount1";
        const key = Buffer.from("Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==", "base64");
        function put(path, query, body, extra) {
          return new Promise((resolve, reject) => {
            const headers = Object.assign({ "x-ms-date": new Date().toUTCString(), "x-ms-version": "2021-08-06" }, extra);
            const length = body ? String(Buffer.byteLength(body)) : "";
            const canonical = Object.keys(headers).filter(k => k.startsWith("x-ms-")).sort().map(k => k + ":" + headers[k] + "\n").join("");
            const resource = "/" + account + path + Object.keys(query).sort().map(k => "\n" + k + ":" + query[k]).join("");
            const toSign = ["PUT", "", "", length, "", headers["Content-Type"] || "", "", "", "", "", "", ""].join("\n") + "\n" + canonical + resource;
            headers.Authorization = "SharedKey " + account + ":" + crypto.createHmac("sha256", key).update(toSign, "utf8").digest("base64");
            if (body) headers["Content-Length"] = length;
            const qs = Object.keys(query).map(k => k + "=" + query[k]).join("&");
            const req = http.request({ host: "127.0.0.1", port: 10000, method: "PUT", path: path + (qs ? "?" + qs : ""), headers }, res => {
              res.resume();
              res.on("end", () => (res.statusCode < 300 ? resolve() : reject(new Error(path + ": " + res.statusCode))));
            });
            req.on("error", reject);
            if (body) req.write(body);
            req.end();
          });
        }
        const [container, blob, body, access] = process.argv.slice(2);
        const run = blob
          ? put("/" + account + "/" + container + "/" + blob, {}, body.replace(/\\n/g, "\n"), { "x-ms-blob-type": "BlockBlob", "Content-Type": "text/plain" })
          : put("/" + account + "/" + container, { restype: "container" }, "", access ? { "x-ms-blob-public-access": "container" } : {});
        run.catch(e => { console.error(e.message); process.exit(1); });
        JS
        node /tmp/put.js hrdata
        node /tmp/put.js hrdata exports/a.csv 'id,name\n1,alice\n'
        node /tmp/put.js hrdata exports/notes.json '{"id": 9}\n'
        node /tmp/put.js hrdata backups/payroll.csv 'employee,salary\nalice,250000\n'
        node /tmp/put.js hrdata empty/readme.txt 'not csv'
        node /tmp/put.js hrdata locked/c.csv 'id\n3\n'
        node /tmp/put.js open '' '' public
        node /tmp/put.js open data.csv 'id,city\n1,paris\n'
  - start: { ready: false }

  # Under the dataset's `from`, with the suffix it lists by: read with its credentials.
  - query: SELECT id, name FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/exports/a.csv'
    expect: { rows: [['1', alice]] }
    eventually: 30s
  - query: SELECT id, name FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/exports/'
    expect: { rows: [['1', alice]] }

  # Under the dataset's `from`, but an object the dataset does not list: refused.
  - query: SELECT * FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/exports/notes.json'
    expect-error: "dataset 'exports' covers this location but does not read this object (it reads '.csv' objects under 'abfs://hrdata@devstoreaccount1.dfs.core.windows.net/exports/')"

  # Outside every dataset's `from` in a private container: read without credentials, and
  # refused, naming the dataset that covers the most of this container.
  - query: SELECT * FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/backups/payroll.csv'
    expect-error: "no dataset's `from` covers this location (dataset 'exports' covers 'abfs://hrdata@devstoreaccount1.dfs.core.windows.net/exports/'), so it was read without credentials, and the object store refused the request (403 Forbidden)"

  # A public container reads without credentials.
  - query: SELECT id, city FROM 'abfss://open@devstoreaccount1.dfs.core.windows.net/data.csv'
    expect: { rows: [['1', paris]] }

  # A dataset that did not load (its `from` held no CSV object) still covers its `from`.
  - assert-status: { dataset: never_loads, status: Error }
    eventually: 30s
  - source-exec: { az: "node /tmp/put.js hrdata empty/b.csv 'id\\n2\\n'" }
  - query: SELECT id FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/empty/b.csv'
    expect: { rows: [['2']] }

  # A covering dataset whose secret does not resolve fails the URL table; it never falls back
  # to an unsigned read or to the runtime's credentials.
  - query: SELECT id FROM 'abfss://hrdata@devstoreaccount1.dfs.core.windows.net/locked/c.csv'
    expect-error: "dataset 'locked' covers this location, and its credentials could not be loaded"
