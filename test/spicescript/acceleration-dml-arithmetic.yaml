name: acceleration-dml-arithmetic
description: >
  UPDATE and DELETE with integer arithmetic on an acceleration that takes its
  own writes (`access: read_write`, `write_mode: acceleration`) change the rows
  PostgreSQL changes for the same statements, on every engine. Cayenne
  evaluates the arithmetic in Spice, with Spice's overflow checks; SQLite and PostgreSQL evaluate the statement Spice renders for them, which
  carries the operators, not those checks.

sources:
  src: { kind: postgres }
  # A database of its own for the PostgreSQL acceleration, whose table would
  # otherwise be the source table.
  accel: { kind: postgres }

variants:
  cayenne-file: cayenne-file
  cayenne-memory: cayenne-memory
  sqlite-file: sqlite-file
  sqlite-memory: sqlite-memory
  postgres: { datasets: { '*': { acceleration: { enabled: true, engine: postgres, params: '${sources.accel.params}' } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: acceleration-dml-arithmetic
  datasets:
    - from: postgres:public.acc
      name: acc
      params: ${sources.src.params}
      access: read_write
      acceleration: { enabled: true, refresh_mode: full, write_mode: acceleration, primary_key: id }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE acc (id int PRIMARY KEY, n bigint NOT NULL);
        INSERT INTO acc VALUES (1, 100), (2, 200), (3, 300), (4, 9223372036854775807);
        CREATE TABLE model AS SELECT * FROM acc;
  - start: {}
  - query: SELECT id, n FROM acc
    oracle-sql: SELECT id, n FROM model

  - spice-exec: UPDATE acc SET n = n + 1 WHERE id = 1
  - source-exec: { src: "UPDATE model SET n = n + 1 WHERE id = 1" }
  - query: SELECT id, n FROM acc
    oracle-sql: SELECT id, n FROM model

  - spice-exec: UPDATE acc SET n = n * 2 - 1 WHERE n - 199 = 1
  - source-exec: { src: "UPDATE model SET n = n * 2 - 1 WHERE n - 199 = 1" }
  - query: SELECT id, n FROM acc
    oracle-sql: SELECT id, n FROM model

  - spice-exec: DELETE FROM acc WHERE n - 1 = 100
  - source-exec: { src: "DELETE FROM model WHERE n - 1 = 100" }
  - query: SELECT id, n FROM acc
    oracle-sql: SELECT id, n FROM model

  # Cayenne, DuckDB and PostgreSQL refuse the overflow and change nothing.
  # SQLite has no such check: it turns the sum into a REAL.
  - spice-exec: UPDATE acc SET n = n + 1 WHERE id = 4
    expect-error: true
    except: [sqlite-file, sqlite-memory]
  - query: SELECT id, n FROM acc
    oracle-sql: SELECT id, n FROM model
    except: [sqlite-file, sqlite-memory]
