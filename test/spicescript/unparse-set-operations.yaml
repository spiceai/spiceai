name: unparse-set-operations
description: >
  INTERSECT and EXCEPT answer as PostgreSQL does, NULLs included, wherever the
  query runs.

sources:
  src: { kind: postgres }

variants:
  federated: {}
  cayenne: cayenne-file
  duckdb: duckdb

spicepod:
  version: v1
  kind: Spicepod
  name: unparse-set-operations
  datasets:
    - { from: 'postgres:public.w', name: w, params: '${sources.src.params}' }
    - { from: 'postgres:public.w2', name: w2, params: '${sources.src.params}' }

defaults:
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE w (id int PRIMARY KEY, a int, s text);
        INSERT INTO w VALUES (1, 1, 'x'), (2, NULL, 'y'), (3, 3, NULL), (4, NULL, NULL), (5, 1, 'x');
        CREATE TABLE w2 (id int PRIMARY KEY, a int, s text);
        INSERT INTO w2 VALUES (10, NULL, 'y'), (11, 3, NULL), (12, 7, 'z');
  - start: {}
  # Control: no NULLs on either side.
  - query: SELECT a FROM w WHERE a IS NOT NULL INTERSECT SELECT a FROM w2 WHERE a IS NOT NULL
  - query: SELECT a FROM w INTERSECT SELECT a FROM w2
  - query: SELECT a FROM w EXCEPT SELECT a FROM w2
  - query: SELECT a, s FROM w INTERSECT SELECT a, s FROM w2
  - query: SELECT a, s FROM w EXCEPT SELECT a, s FROM w2
  - query: SELECT a FROM w INTERSECT SELECT a FROM w WHERE id > 1
  - query: SELECT a, s FROM w EXCEPT SELECT a, s FROM w WHERE id IN (2, 4)
  - query: SELECT a AS x FROM w INTERSECT SELECT a AS x FROM w WHERE id > 1
  - query: SELECT a + 1 AS x FROM w EXCEPT SELECT a + 1 AS x FROM w WHERE id > 1
    expect-empty: true
  - query: SELECT count(*) AS n, sum(x) AS s FROM (SELECT a + 1 AS x FROM w INTERSECT SELECT a + 1 AS x FROM w WHERE id > 1) q
  - query: SELECT count(*) AS n, sum(x) AS s FROM (SELECT a + 1 AS x FROM w EXCEPT SELECT a + 1 AS x FROM w WHERE id > 1) q
  - query: >-
      SELECT x FROM (SELECT y AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE label IS NOT NULL INTERSECT SELECT y AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE y > 0) r
  - query: >-
      SELECT x FROM (SELECT y AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE label IS NOT NULL EXCEPT SELECT y AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE y > 0) r
  - query: >-
      SELECT count(*) AS n, sum(x) AS s FROM (SELECT y + 1 AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE label IS NOT NULL EXCEPT SELECT y + 1 AS x FROM (SELECT a AS y, s AS label FROM w) q WHERE y > 0) r
  - query: SELECT count(*) AS n FROM (SELECT a + 1 FROM w INTERSECT SELECT a + 1 FROM w WHERE id > 1) q
