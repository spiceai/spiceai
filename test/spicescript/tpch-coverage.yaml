name: tpch-coverage
description: >
  TPC-H (scale 0.01, generated by DuckDB's dbgen) answers through Spice as
  PostgreSQL answers it over the same rows, for each query in the shared
  TPC-H query set: federated to PostgreSQL and MySQL, and accelerated into
  Cayenne and DuckDB.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql]

variants:
  federated: {}
  cayenne: cayenne-file
  duckdb: duckdb-file

spicepod:
  version: v1
  kind: Spicepod
  name: tpch-coverage
  datasets:
    - from: '${matrix.backend}:region'
      name: region
      params: ${sources.backend.params}
    - from: '${matrix.backend}:nation'
      name: nation
      params: ${sources.backend.params}
    - from: '${matrix.backend}:supplier'
      name: supplier
      params: ${sources.backend.params}
    - from: '${matrix.backend}:customer'
      name: customer
      params: ${sources.backend.params}
    - from: '${matrix.backend}:part'
      name: part
      params: ${sources.backend.params}
    - from: '${matrix.backend}:partsupp'
      name: partsupp
      params: ${sources.backend.params}
    - from: '${matrix.backend}:orders'
      name: orders
      params: ${sources.backend.params}
    - from: '${matrix.backend}:lineitem'
      name: lineitem
      params: ${sources.backend.params}

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { region: r_regionkey, nation: n_nationkey, supplier: s_suppkey, customer: c_custkey, part: p_partkey, partsupp: ps_partkey, orders: o_orderkey, lineitem: l_orderkey }
  expect: { oracle: ref }
  compare-variants: false
  # Q20 federated to PostgreSQL takes 26-134 s at this scale (here and on CI
  # runners), far longer than PostgreSQL alone; the answer is still checked.
  query-timeout: 300s

steps:
  - dbgen: { scale: 0.01, into: [backend, ref] }
  - start: {}
  - corpus: ../../crates/test-framework/src/queries/tpch/q*.sql
