name: flight-auth-handshake-limit
duration: 10s
description: >
  With API keys required, a client that authenticates with a handshake before
  each query, as `flight_client` does (and so the `spice.ai` connector a
  sidecar reads its upstream with), gets every answer to 11,000 Flight queries
  from 8 connections, and to the query after them, although each handshake
  opens a session and the runtime holds at most 10,000. Those sessions do not
  evict another key's: a statement the other key prepared in its session
  before the load still executes there, and the other key still authenticates.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: flight-auth-handshake-limit
  runtime:
    auth:
      api-key: { enabled: true, keys: [handshake-key, "other-key:rw"] }
  datasets:
    - { from: 'postgres:public.orders', name: orders, params: '${sources.src.params}' }

defaults:
  api-key: handshake-key
  expect: { oracle: src }

steps:
  - generate:
      src:
        table: orders
        rows: 100
        seed: 12
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: amount, decimal: { range: [0, 1000], scale: 2 } }
  - start: {}
  - query: PREPARE by_id(INT) AS SELECT id, amount FROM orders WHERE id = $1
    flight-session: other
    api-key: other-key
    expect: { rows: [] }
    expect-empty: true
  - load:
      queries: ['SELECT count(*) AS n, sum(amount) AS total FROM orders']
      clients: 8
      count: 11000
  - query: SELECT count(*) AS n FROM orders
  - query: EXECUTE by_id(7)
    flight-session: other
    api-key: other-key
    oracle-sql: SELECT id, amount FROM orders WHERE id = 7
  - query: SELECT count(*) AS n FROM orders
    api-key: other-key
