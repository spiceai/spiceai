    expect: { status: 202 }

  # Every scheduler lists the jobs of the shared state location: 2 x 64 running, 2 x 6 waiting.
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 128 } ] }
    eventually: 90s
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 12 } ] }
    eventually: 30s

  # Each scheduler holds its own 64 running and 6 waiting, and refused nothing.
  - wait-metric: { name: async_query_active_count, labels: { status: running }, above: 63, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: running }, below: 65, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, above: 5, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, below: 7, timeout: 30s }
  - wait-metric: { name: async_query_submissions_rejected, labels: { reason: queue_full }, below: 1, timeout: 30s }
