name: async-query-budgets-schedulers
description: >
  Each scheduler of a cluster keeps its own async query budget for a caller,
  in memory: two schedulers over one state location each run up to 64 of
  one caller's async queries and queue the rest, so the cluster runs up to
  2 × 64 for that caller. This is the documented per-scheduler limit; one
  limit shared across schedulers is a later change.

sources:
  lake: { kind: files }
  state: { kind: rustfs }

# Two schedulers, each with its own executor, share one state location.
variants:
  a: {}
  b: {}

spicepod:
  version: v1
  kind: Spicepod
  name: async-query-budgets-schedulers
  runtime:
    auth:
      api-key:
        enabled: true
        keys: [a-key:rw]
    state:
      location: s3://${sources.state.shared_bucket}/state/
      params:
        s3_endpoint: ${sources.state.endpoint}
        s3_region: us-east-1
        s3_auth: key
        s3_key: ${sources.state.key}
        s3_secret: ${sources.state.secret}
        allow_http: 'true'
  datasets:
    - from: 'file://${sources.lake.path}/nums/'
      name: nums
      params: { file_format: parquet }
    - from: 'file://${sources.lake.path}/wide/'
      name: wide
      params: { file_format: parquet }

defaults:
  cluster: { executors: 1 }
  api-key: a-key
  # The schedulers work together over one state location, so they run side by side.
  run-variants: side-by-side
  compare-variants: false

steps:
  - generate:
      lake:
        table: nums
        rows: 2000
        seed: 31
        primary-key: id
        format: parquet
        columns:
          - { name: id, sequence: 1 }
  # Each query reads 2000 x 2000 x 16000 rows, so none finishes on its own while the script
  # runs.
  - generate:
      lake:
        table: wide
        rows: 16000
        seed: 32
        primary-key: id
        format: parquet
        columns:
          - { name: id, sequence: 1 }
  - start: {}

  # The same caller submits 70 long queries to each scheduler: each runs 64 and queues 6.
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 1"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 2"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 3"}' }
    expect: { status: 202 }
