name: cron-and-reload
description: >
  refresh_cron refreshes a Cayenne acceleration on its schedule: a full
  refresh, an append and an accelerated view each follow the source with no
  manual refresh. With the spicepod watched, edits take effect without a
  restart: a slower cron made faster, a dataset added and one removed, and a
  view's SQL changed. A dataset and a view added by an edit with the removed
  `postgres` acceleration engine each fail to load with the removal error,
  while the dataset added beside them loads.

sources:
  src: { kind: postgres }

# The spicepod as written, and the same with the prototype object-native
# Cayenne metastore (`runtime.params.cayenne_vnext`) in place of SQLite.
variants:
  as-written: federated
  object-native: object-native

spicepod:
  version: v1
  kind: Spicepod
  name: cron-and-reload
  datasets:
    - from: postgres:public.t
      name: full_cron
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_cron: '*/2 * * * * *' }
    - from: postgres:public.events
      name: append_cron
      params: ${sources.src.params}
      time_column: at
      time_format: timestamptz
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: append, refresh_cron: '*/2 * * * * *' }
    - from: postgres:public.t
      name: slow_cron
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_cron: '0 0 * * * *' }
    - from: postgres:public.t
      name: removed_later
      params: ${sources.src.params}
  views:
    - name: v
      sql: SELECT id, v FROM full_cron WHERE id <= 10
      acceleration: { enabled: true, engine: cayenne, refresh_cron: '*/2 * * * * *' }

defaults:
  expect: { oracle: src }
  spiced-args: [--pods-watcher-enabled]

steps:
  - source-exec:
      src: |
        CREATE TABLE t (id int PRIMARY KEY, v text);
        INSERT INTO t SELECT i, 'v' || i FROM generate_series(1, 100) i;
        CREATE TABLE events (id int PRIMARY KEY, at timestamptz NOT NULL);
        INSERT INTO events SELECT i, TIMESTAMPTZ '2025-01-01 00:00:00+00' + i * INTERVAL '1 minute' FROM generate_series(1, 100) i;
  - start: {}
  - query: SELECT id, v FROM full_cron
    oracle-sql: SELECT id, v FROM t

  # Each schedule picks up source changes on its own.
  - source-exec:
      src: |
        UPDATE t SET v = 'changed' WHERE id <= 5;
        DELETE FROM t WHERE id > 90;
        INSERT INTO events SELECT i, TIMESTAMPTZ '2025-06-01 00:00:00+00' + i * INTERVAL '1 minute' FROM generate_series(101, 120) i;
  - query: SELECT id, v FROM full_cron
    oracle-sql: SELECT id, v FROM t
    eventually: 30s
  - query: SELECT id, at FROM append_cron
    oracle-sql: SELECT id, at FROM events
    eventually: 30s
  - query: SELECT id, v FROM v
    oracle-sql: SELECT id, v FROM t WHERE id <= 10
    eventually: 30s
  # The hourly schedule has not run.
  - query: SELECT count(*) AS n FROM slow_cron
    expect: { rows: [['100']] }
    consistently: 5s

  # Edits to the watched spicepod.
  - edit-spicepod:
      datasets:
        slow_cron: { acceleration: { refresh_cron: '*/2 * * * * *' } }
  - query: SELECT id, v FROM slow_cron
    oracle-sql: SELECT id, v FROM t
    eventually: 60s
  - edit-spicepod:
      spicepod:
        datasets:
          - { from: 'postgres:public.t', name: full_cron, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_cron: '*/2 * * * * *' } }
          - { from: 'postgres:public.events', name: added_later, params: '${sources.src.params}' }
          - { from: 'postgres:public.t', name: postgres_engine_later, params: '${sources.src.params}', acceleration: { enabled: true, engine: postgres } }
        views:
          - name: v
            sql: SELECT id, v FROM full_cron WHERE id > 80
          - name: postgres_view_later
            sql: SELECT id, v FROM full_cron
            acceleration: { enabled: true, engine: postgres }
  - query: SELECT id, at FROM added_later
    oracle-sql: SELECT id, at FROM events
    eventually: 60s
  - query: SELECT count(*) FROM removed_later
    expect-error: removed_later
    eventually: 60s
  - query: SELECT id, v FROM v
    oracle-sql: SELECT id, v FROM t WHERE id > 80
    eventually: 60s
  # The `postgres` engine is removed: a dataset and a view the edit adds with it
  # each fail to load with the removal error, and are never switched to Cayenne.
  - query: SELECT * FROM postgres_engine_later
    expect-error: postgres_engine_later
    eventually: 60s
  - query: SELECT * FROM postgres_view_later
    expect-error: postgres_view_later
    eventually: 60s
  - assert-log:
      count:
        "ERROR .*Failed to load dataset 'postgres_engine_later': the acceleration engine `postgres` is no longer supported as of v2\\.5 and cannot be used\\. Set `acceleration\\.engine: cayenne`, or remove `engine` to use the default, which is `cayenne`, then delete the old engine's acceleration files and snapshots\\. See: https://spiceai\\.org/docs/components/data-accelerators/cayenne/migration dataset=\"postgres_engine_later\"$": 1
        "ERROR .*Failed to load view 'postgres_view_later': the acceleration engine `postgres` is no longer supported as of v2\\.5 and cannot be used\\. Set `acceleration\\.engine: cayenne`, or remove `engine` to use the default, which is `cayenne`, then delete the old engine's acceleration files and snapshots\\. See: https://spiceai\\.org/docs/components/data-accelerators/cayenne/migration view=\"postgres_view_later\"$": 1
      lacks: ["deprecated .*postgres_(engine|view)_later", "Unknown acceleration engine 'postgres"]
