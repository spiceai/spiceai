name: postgres-upgrade
description: >
  A runtime upgraded in place (`--from <older spiced>`; without it, a
  restart) keeps serving what it held: file accelerations on Cayenne, DuckDB
  and SQLite answer as before and as the source does, a CDC acceleration
  applies the changes made while it was down, and a write-back write still
  pending at the upgrade is delivered once afterwards.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-upgrade
  datasets:
    - from: postgres:public.items
      name: on_cayenne
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file }
    - from: postgres:public.items
      name: on_duckdb
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: duckdb, mode: file }
    - from: postgres:public.items
      name: on_sqlite
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: sqlite, mode: file }
    - from: postgres:public.events
      name: events
      params: { $merge: '${sources.src.params}', pg_replication_slot: 'upgrade_${sources.src.namespace}' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id,
        on_conflict: { id: upsert } }
    - from: postgres:public.accounts
      name: accounts
      params: ${sources.src.params}
      access: read_write
      replication: { enabled: true }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, write_mode: write_back, primary_key: id,
        on_conflict: { id: upsert } }

# `on_conflict` is deprecated for Cayenne, which keeps the last write per key,
# but older releases require it for CDC and write-back, and a spicepod written
# for them must keep loading.
defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  compare-variants: false

steps:
  - generate:
      src:
        table: items
        rows: 2000
        seed: 71
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-1000, 1000], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-1000, 1000], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, banana, "O'Brien", naïve, ''], nulls: 0.1 }
          - { name: dt, date: ['2020-01-01', '2026-12-31'] }
          - { name: ts, timestamp: ['2020-01-01', '2026-12-31'] }
          - { name: b, bool: 0.4 }
  - source-exec:
      src: |
        CREATE TABLE events (id bigint PRIMARY KEY, kind text NOT NULL, amount numeric(12, 2), at timestamptz NOT NULL);
        INSERT INTO events SELECT g, 'k' || (g % 7), g * 1.25, TIMESTAMPTZ '2025-01-01 00:00:00+00' + g * INTERVAL '1 minute'
          FROM generate_series(1, 1000) g;
        CREATE TABLE accounts (id bigint PRIMARY KEY, balance numeric(12, 2) NOT NULL);
        INSERT INTO accounts SELECT g, g * 10 FROM generate_series(1, 50) g;
        CREATE TABLE accounts_gate (open boolean NOT NULL);
        INSERT INTO accounts_gate VALUES (true);
        CREATE FUNCTION accounts_gate() RETURNS trigger AS $$
        BEGIN
          IF NOT (SELECT open FROM accounts_gate) THEN RAISE EXCEPTION 'accounts is closed for delivery'; END IF;
          RETURN NEW;
        END;
        $$ LANGUAGE plpgsql;
        CREATE TRIGGER accounts_gate_trigger BEFORE INSERT OR UPDATE ON accounts
          FOR EACH ROW EXECUTE FUNCTION accounts_gate();
  - start: {}

  # What the older runtime serves.
  - query: SELECT * FROM on_cayenne
    oracle-sql: SELECT * FROM items
    id: cayenne-before
  - query: SELECT * FROM on_duckdb
    oracle-sql: SELECT * FROM items
    id: duckdb-before
  - query: SELECT * FROM on_sqlite
    oracle-sql: SELECT * FROM items
    id: sqlite-before
  - source-exec:
      src: |
        UPDATE events SET amount = amount * 2 WHERE id % 5 = 0;
        DELETE FROM events WHERE id % 11 = 0;
        INSERT INTO events SELECT g, 'late', NULL, TIMESTAMPTZ '2026-01-01 00:00:00+00' FROM generate_series(1001, 1100) g;
  - query: SELECT * FROM events
    eventually: 60s
  # A write-back write held at the source, so it is still pending at the upgrade.
  - source-exec: { src: "UPDATE accounts_gate SET open = false" }
  - spice-exec: "BEGIN; UPDATE accounts SET balance = balance + 1000 WHERE id <= 5; COMMIT;"
  - query: SELECT sum(balance) AS total FROM accounts
    expect: { rows: [['17750.00']] }
  - wait-metric: { name: dataset_acceleration_write_back_pending_keys, labels: { dataset: accounts }, above: 0, timeout: 30s }

  # Down, the source changes; then up on the binary under test.
  - stop: {}
  - source-exec:
      src: |
        UPDATE events SET kind = 'while down' WHERE id BETWEEN 100 AND 150;
        DELETE FROM events WHERE id BETWEEN 200 AND 210;
        INSERT INTO events VALUES (5000, 'while down', 1.00, TIMESTAMPTZ '2026-06-01 00:00:00+00');
  - upgrade: {}

  - query: SELECT * FROM on_cayenne
    oracle-sql: SELECT * FROM items
    expect: { same-as: cayenne-before }
  - query: SELECT * FROM on_duckdb
    oracle-sql: SELECT * FROM items
    expect: { same-as: duckdb-before }
  - query: SELECT * FROM on_sqlite
    oracle-sql: SELECT * FROM items
    expect: { same-as: sqlite-before }
  - query: SELECT * FROM events
    eventually: 60s
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM events
    expect: { rows: [['1001', '1001']] }
  # The pending write is still served, and is delivered once the source lets it.
  - query: SELECT sum(balance) AS total FROM accounts
    expect: { rows: [['17750.00']] }
  - source-query: { src: "SELECT sum(balance) FROM accounts" }
    expect: { rows: [['12750.00']] }
  - source-exec: { src: "UPDATE accounts_gate SET open = true" }
  - source-query: { src: "SELECT sum(balance) FROM accounts" }
    expect: { rows: [['17750.00']] }
    eventually: 60s
  - query: SELECT * FROM accounts
    eventually: 30s
  - wait-metric: { name: dataset_acceleration_write_back_pending_keys, labels: { dataset: accounts }, below: 1, timeout: 30s }

  # And the upgraded runtime keeps following the source and taking writes.
  - source-exec: { src: "INSERT INTO events VALUES (6000, 'after', 2.00, TIMESTAMPTZ '2026-07-01 00:00:00+00')" }
  - query: SELECT * FROM events
    eventually: 30s
  - spice-exec: "BEGIN; UPDATE accounts SET balance = 0 WHERE id = 50; COMMIT;"
  - source-query: { src: "SELECT balance FROM accounts WHERE id = 50" }
    expect: { rows: [['0.00']] }
    eventually: 30s
