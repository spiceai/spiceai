name: slt-strings
description: >
  String functions over non-ASCII text answer as recorded through Spice, over
  PostgreSQL and MySQL, federated and accelerated.

sources:
  src: { kind: '${matrix.source}' }

matrix:
  source: [postgres, mysql]

variants:
  federated: {}
  cayenne:
    datasets: { '*': { acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full } } }

spicepod:
  version: v1
  kind: Spicepod
  name: slt-strings
  datasets:
    - from: '${matrix.source}:s1'
      name: s1
      params: ${sources.src.params}

steps:
  - slt-setup: { file: slt/strings.slt, source: src }
  - start: {}
  - slt: { file: slt/strings.slt, source: src }
