name: secret-redaction
description: >
  What a query sends through the HTTP connector (a request_path, request_query,
  request_body or request_headers value) stays out of spiced's log at every level,
  trace included: each value is logged as its size and a digest, so a token in it is
  never written and a body's line break cannot start a log line of its own. A rejected
  request_path is not repeated in the error either, and EXPLAIN shows the dataset's
  configured URL without the key in it. A remote function's endpoint URL
  is reported without its userinfo and secret query values in its registration log
  line, /v1/functions and list_udfs(), and a failed call's error names the function
  rather than the URL. A model's, an embedding's, a reranker's and a tool's source, a
  model's `endpoint`, the OTEL exporter's endpoint, S3 and ABFS endpoints, and the errors
  that quote any of them (an HTTP client's `for url (...)`, an object store's `GET ...`)
  are logged and listed the same way. Needs a spiced built with the `http-functions`
  feature.

sources:
  api: { kind: mock-http }

variants:
  # The connector's own trace and debug events, and the runtime's at info: the levels
  # an operator turns on to troubleshoot a dataset.
  traced:
    env:
      SPICED_LOG: 'warn,data_components=trace,runtime=info,runtime::init::tool=debug,runtime_tools=info,llms=info,runtime_otel_push=info,runtime_object_store=info,data_connector_api=info,app=info,spiced=info'

spicepod:
  version: v1
  kind: Spicepod
  name: secret-redaction
  runtime:
    functions: { enabled: true }
  datasets:
    - from: ${sources.api.url}/api
      name: api
      params:
        file_format: json
        allowed_request_paths: '/hooks/*'
        request_query_filters: enabled
        request_body_filters: enabled
        request_header_filters: enabled
        request_header_allowlist: x-api-key
        response_cache_max_size_bytes: '0'
    # A key in the configured URL, which any caller can EXPLAIN a query against.
    - from: ${sources.api.url}/cfg?api_key=CONF-SECRET-4b1e&region=us
      name: configured
      params:
        file_format: json
        allowed_request_paths: /x
        response_cache_max_size_bytes: '0'
  functions:
    # Registered without a request, so the host need not exist.
    - name: remote_userinfo
      from: https://alice:UDF-PASSWORD-1@udf.example.invalid/v1/score?sig=UDF-SIGNATURE-2&region=us
      signature:
        args: [{ name: x, type: int64 }]
        returns: int64
    # Nothing listens on port 1, so a call fails before any response.
    - name: remote_refused
      from: http://127.0.0.1:1/score?api_key=UDF-API-KEY-3
      params:
        allowed_endpoint_ranges: ['127.0.0.1/32']
      signature:
        args: [{ name: x, type: int64 }]
        returns: int64

steps:
  - source-exec:
      api:
        - |
          path: /api/hooks/PATH-SECRET-7f3a
          headers: { content-type: application/json }
          body: '[{"route": "path"}]'
        - |
          path: /api/hooks/q
          query: api_key=QUERY-SECRET-91bc
          headers: { content-type: application/json }
          body: '[{"route": "query"}]'
        - |
          path: /api/hooks/b
          method: POST
          headers: { content-type: application/json }
          body: '[{"route": "body"}]'
        - |
          path: /api/hooks/h
          headers-match: { x-api-key: HEADER-SECRET-55aa }
          headers: { content-type: application/json }
          body: '[{"route": "header"}]'
        - |
          path: /cfg/x
          query: api_key=CONF-SECRET-4b1e&region=us
          headers: { content-type: application/json }
          body: '[{"route": "configured"}]'
  - start: {}

  # Each request column carries a secret, and each request reaches its route.
  - query: SELECT content FROM api WHERE request_path = '/hooks/PATH-SECRET-7f3a'
    expect: { rows: [['{"route":"path"}']] }
  - query: SELECT content FROM api WHERE request_path = '/hooks/q' AND request_query = 'api_key=QUERY-SECRET-91bc'
    expect: { rows: [['{"route":"query"}']] }
  - query: >-
      SELECT content FROM api WHERE request_path = '/hooks/b' AND request_body = '{"token":"BODY-SECRET-c4d2"}'
    expect: { rows: [['{"route":"body"}']] }
  - query: >-
      SELECT content FROM api WHERE request_path = '/hooks/h' AND request_headers = '{"x-api-key":"HEADER-SECRET-55aa"}'
    expect: { rows: [['{"route":"header"}']] }
  # A body whose line break is followed by text shaped like a log line.
  - query: "SELECT content FROM api WHERE request_path = '/hooks/b' AND request_body = '{\"note\":\"x\"}\n2026-01-01T00:00:00.000000Z ERROR runtime: FORGED-RECORD'"
    expect: { rows: [['{"route":"body"}']] }
  - source-query: { api: count /api/hooks/b }
    expect: { rows: [['2']] }

  # A path outside the allowlist is refused without repeating it.
  - query: SELECT content FROM api WHERE request_path = '/admin/PATH-SECRET-2e9d'
    expect-error: does not match any allowed path patterns
  - http:
      method: POST
      path: /v1/sql
      headers: { content-type: text/plain }
      body: SELECT content FROM api WHERE request_path = '/admin/PATH-SECRET-2e9d'
    expect: { status: 400, body-contains: does not match any allowed path patterns, body-lacks: PATH-SECRET-2e9d }

  # A key in the dataset's configured URL is sent, and EXPLAIN shows the URL as
  # /v1/datasets does: without the key.
  - query: SELECT content FROM configured WHERE request_path = '/x'
    expect: { rows: [['{"route":"configured"}']] }
  - http:
      method: POST
      path: /v1/sql
      headers: { content-type: text/plain }
      body: EXPLAIN SELECT content FROM configured WHERE request_path = '/x'
    expect: { status: 200, body-contains: '/cfg?api_key=***&region=us', body-lacks: CONF-SECRET }
  - http: { path: /v1/datasets }
    expect: { status: 200, body-contains: '/cfg?api_key=***&region=us', body-lacks: CONF-SECRET }

  # A remote function's endpoint is listed without its credentials, and the
  # parts that are not credentials as written.
  - http: { path: /v1/functions }
    expect:
      status: 200
      body-lacks: UDF-
      json:
        - { pointer: '', length: 2 }
        - { pointer: /0/name, equals: remote_userinfo }
        - { pointer: /0/from, equals: 'https://udf.example.invalid/v1/score?sig=***&region=us' }
        - { pointer: /1/name, equals: remote_refused }
        - { pointer: /1/from, equals: 'http://127.0.0.1:1/score?api_key=***' }
  # Every column: list_udfs() does not apply a projection, so selecting some of them fails.
  - query: SELECT * FROM list_udfs() WHERE source = 'user' ORDER BY name
    expect: { rows: [
      [remote_refused, user, scalar, volatile, 'http://127.0.0.1:1/score?api_key=***', null],
      [remote_userinfo, user, scalar, volatile, 'https://udf.example.invalid/v1/score?sig=***&region=us', null]] }

  # A call that fails before any response names the function, not the URL.
  - query: SELECT remote_refused(1) AS v
    expect-error: "remote function 'remote_refused' request failed"
  - http:
      method: POST
      path: /v1/sql
      headers: { content-type: text/plain }
      body: SELECT remote_refused(1) AS v
    expect: { body-contains: "remote function 'remote_refused' request failed", body-lacks: UDF-API-KEY-3 }

  # None of it reached the log. The first two patterns show the trace events and the
  # registration lines that would have carried the values were written.
  - assert-log:
      contains:
        - 'apply_literal_filter: column=request_body, value=<redacted \d+ bytes, digest [0-9a-f]{16}>'
        - 'Registered user function.*from=https://udf\.example\.invalid/v1/score\?sig=\*\*\*&region=us'
      lacks:
        - PATH-SECRET
        - QUERY-SECRET
        - BODY-SECRET
        - HEADER-SECRET
        - FORGED-RECORD
        - UDF-PASSWORD
        - UDF-SIGNATURE
        - UDF-API-KEY
        - CONF-SECRET

  # Models and embeddings whose sources carry credentials. No source exists, so none
  # loads and spiced stays not ready; what is checked is how the sources are logged, in
  # the loading line and the error, and listed.
  - restart:
      ready: false
      patch:
        spicepod:
          models:
            - name: credentialed_model
              from: https://alice:MODEL-PASSWORD-5@models.example.invalid/v1/chat?api_key=MODEL-KEY-6
            # A space in the password and in the query value, after a connector prefix.
            - name: spaced_model
              from: 'custom:https://alice:MY SPACED-MODEL-PASSWORD-19@models.example.invalid/v1/chat?api_key=MY SPACED-MODEL-KEY-20'
            # Whitespace before the URL, at the start of the source or after its connector prefix.
            - name: leading_space_model
              from: ' https://alice:LEAD-MODEL-PASSWORD-23@models.example.invalid/v1/chat?api_key=LEAD-MODEL-KEY-24'
            - name: prefix_space_model
              from: 'custom: https://alice:PREFIX-MODEL-PASSWORD-25@models.example.invalid/v1/chat?api_key=PREFIX-MODEL-KEY-26'
          embeddings:
            - name: credentialed_embedding
              from: https://alice:EMBED-PASSWORD-9@models.example.invalid/v1/embed?api_key=EMBED-KEY-10
            - name: spaced_embedding
              from: 'custom:https://alice:MY SPACED-EMBED-PASSWORD-21@models.example.invalid/v1/embed?api_key=MY SPACED-EMBED-KEY-22'
            - name: tab_embedding
              from: "\thttps://alice:TAB-EMBED-PASSWORD-27@models.example.invalid/v1/embed?api_key=TAB-EMBED-KEY-28"
  - assert-log:
      contains:
        - 'Loading model \[credentialed_model\] from https://models\.example\.invalid/v1/chat\?api_key=\*\*\*'
        - "Failed to load LLM: credentialed_model.*'https://models\\.example\\.invalid/v1/chat\\?api_key=\\*\\*\\*'"
        - 'Loading model \[spaced_model\] from custom:https://models\.example\.invalid/v1/chat\?api_key=\*\*\*'
        - "Failed to load LLM: spaced_model.*'custom:https://models\\.example\\.invalid/v1/chat\\?api_key=\\*\\*\\*'"
        - "Failed to load Embedding Model spaced_embedding\\..*'custom:https://models\\.example\\.invalid/v1/embed\\?api_key=\\*\\*\\*'"
        - 'Loading model \[leading_space_model\] from  https://models\.example\.invalid/v1/chat\?api_key=\*\*\*'
        - "Failed to load LLM: leading_space_model.*' https://models\\.example\\.invalid/v1/chat\\?api_key=\\*\\*\\*'"
        - 'Loading model \[prefix_space_model\] from custom: https://models\.example\.invalid/v1/chat\?api_key=\*\*\*'
        - "Failed to load LLM: prefix_space_model.*'custom: https://models\\.example\\.invalid/v1/chat\\?api_key=\\*\\*\\*'"
        - "Failed to load Embedding Model tab_embedding\\..*'\thttps://models\\.example\\.invalid/v1/embed\\?api_key=\\*\\*\\*'"
      lacks:
        - SPACED-MODEL-PASSWORD
        - SPACED-MODEL-KEY
        - SPACED-EMBED-PASSWORD
        - SPACED-EMBED-KEY
        - LEAD-MODEL-PASSWORD
        - LEAD-MODEL-KEY
        - PREFIX-MODEL-PASSWORD
        - PREFIX-MODEL-KEY
        - TAB-EMBED-PASSWORD
        - TAB-EMBED-KEY
    eventually: 30s
  - http: { path: /v1/models, query: { status: 'true' } }
    expect:
      status: 200
      body-lacks: MODEL-
      json:
        - { pointer: /data/0/id, equals: credentialed_model }
        - { pointer: /data/0/owned_by, equals: 'https://models.example.invalid/v1/chat?api_key=***' }
        - { pointer: /data/1/id, equals: spaced_model }
        - { pointer: /data/1/owned_by, equals: 'custom:https://models.example.invalid/v1/chat?api_key=***' }
        - { pointer: /data/2/id, equals: leading_space_model }
        - { pointer: /data/2/owned_by, equals: ' https://models.example.invalid/v1/chat?api_key=***' }
        - { pointer: /data/3/id, equals: prefix_space_model }
        - { pointer: /data/3/owned_by, equals: 'custom: https://models.example.invalid/v1/chat?api_key=***' }

  # MCP tools whose URLs carry a token, one over plain HTTP to a remote host, which is warned
  # about. Neither host exists, so both keep retrying; their first lines are what is checked.
  - restart:
      ready: false
      patch:
        spicepod:
          tools:
            - name: credentialed_tool
              from: mcp:https://alice:TOOL-PASSWORD-7@tools.example.invalid/sse?token=TOOL-TOKEN-8
            - name: plain_http_tool
              from: mcp:http://tools.example.invalid/sse?token=TOOL-TOKEN-11
  - assert-log:
      contains:
        - 'Loading tool \[credentialed_tool\] from mcp:https://tools\.example\.invalid/sse\?token=\*\*\*'
        - "unencrypted HTTP connection to non-localhost host 'tools\\.example\\.invalid': http://tools\\.example\\.invalid/sse\\?token=\\*\\*\\*"
      lacks:
        - MODEL-PASSWORD
        - MODEL-KEY
        - EMBED-PASSWORD
        - EMBED-KEY
        - TOOL-PASSWORD
        - TOOL-TOKEN
    eventually: 30s

  - source-exec:
      api:
        - |
          path: /llm/v1
          method: POST
          headers: { content-type: application/json }
          body: '{"id":"c1","object":"chat.completion","created":0,"model":"gpt-4o-mini","choices":[{"index":0,"message":{"role":"assistant","content":"pong"},"finish_reason":"stop"}],"usage":{"prompt_tokens":1,"completion_tokens":1,"total_tokens":2}}'
        - |
          path: /llm/v1
          method: GET
          delay-ms: 8000
          headers: { content-type: application/json }
          body: '{"object":"list","data":[]}'
        - |
          path: /files/rows.csv
          headers: { content-type: text/csv }
          body: "id,name\n1,one\n"
  # Rerankers, one from a source no reranker handles and one over HTTP to an endpoint that
  # refuses the connection, and two chat models whose `endpoint` carries credentials: one
  # refuses the connection, the other answers the model's probe but not, within its
  # timeout, the request for its token limits.
  - restart:
      ready: false
      patch:
        spicepod:
          tools: []
          embeddings: []
          models:
            - name: endpoint_model
              from: openai:gpt-4o-mini
              params:
                endpoint: http://alice:EP-PASSWORD-5@127.0.0.1:1/v1?api_key=EP-KEY-6
                openai_api_key: sk-not-a-real-key
            - name: slow_listing_model
              from: openai:gpt-4o-mini
              params:
                endpoint: ${sources.api.url}/llm/v1?api_key=EP-KEY-15
                openai_api_key: sk-not-a-real-key
          rerankers:
            - name: unknown_reranker
              from: rerankhub:https://alice:RR-PASSWORD-1@rerank.example.invalid/v1/rerank?api_key=RR-KEY-2
            - name: http_reranker
              from: http://alice:RR-PASSWORD-3@127.0.0.1:1/rerank?api_key=RR-KEY-4
  - assert-log:
      contains:
        - "Failed to load Reranker unknown_reranker\\. Unknown reranker source in `from: rerankhub:https://rerank\\.example\\.invalid/v1/rerank\\?api_key=\\*\\*\\*`"
        - "Reranker 'http_reranker' failed health check: .*for url \\(http://127\\.0\\.0\\.1:1/rerank\\?api_key=\\*\\*\\*\\)"
        - "Failed to load LLM: endpoint_model\\..*for url \\(http://127\\.0\\.0\\.1:1/v1\\?api_key=\\*\\*\\*\\) Verify"
        - "Failed to read the token limits of model 'gpt-4o-mini' from 'http://127\\.0\\.0\\.1:[0-9]+/[^']*/llm/v1\\?api_key=\\*\\*\\*'"
      lacks: [RR-PASSWORD, RR-KEY, EP-PASSWORD, EP-KEY]
    eventually: 30s
  - http: { path: /v1/models, query: { status: 'true' } }
    expect: { status: 200, body-lacks: KEY- }
  - query: SELECT task, error_message FROM runtime.task_history WHERE error_message LIKE '%KEY-%' OR error_message LIKE '%PASSWORD-%'
    expect-empty: true

  # An MCP directive with a quote in its password, which does not parse.
  - restart:
      ready: false
      patch:
        spicepod:
          models: []
          rerankers: []
          tools:
            - name: quoted_tool
              from: 'mcp:https://alice:pa"ss-MCP-PASSWORD-7@tools.example.invalid/sse?token=MCP-TOKEN-8'
  - assert-log:
      contains:
        - "Invalid MCP directive 'from: mcp:https://tools\\.example\\.invalid/sse\\?token=\\*\\*\\*'"
      lacks: [MCP-PASSWORD, MCP-TOKEN]
    eventually: 30s

  # Datasets and the OTEL exporter with credentials in URLs: an append acceleration with
  # no time column, an S3 changes prefix that is a glob (refused before any request), S3
  # and ABFS endpoints with a trailing '/', over HTTP without and with `allow_http` (the
  # latter fail to connect), and an OTLP endpoint that refuses the connection.
  - restart:
      ready: false
      patch:
        spicepod:
          tools: []
          runtime:
            telemetry:
              otel_exporter:
                endpoint: http://alice:OTEL-PASSWORD-13@127.0.0.1:1/v1/metrics?api_key=OTEL-KEY-14
                signals: [metrics, logs]
                push_interval: 1s
          datasets:
            - from: ${sources.api.url}/files/rows.csv?api_key=APPEND-KEY-9
              name: append_no_time
              params: { file_format: csv }
              acceleration: { enabled: true, engine: arrow, refresh_mode: append }
            - from: s3://alice:S3C-PASSWORD-10@bucket/events/*.parquet
              name: s3_glob_changes
              params:
                s3_auth: key
                s3_key: AKIAEXAMPLEEXAMPLE
                s3_secret: example-not-a-secret
                s3_region: us-east-1
                s3_changes_queue_url: https://sqs.us-east-1.amazonaws.com/123456789012/events
              acceleration: { enabled: true, engine: cayenne, refresh_mode: changes }
            - from: s3://bucket/data/
              name: s3_endpoint_trim
              params:
                s3_endpoint: http://alice:S3EP-PASSWORD-11@127.0.0.1:1/
                s3_auth: public
            - from: s3://bucket/data/
              name: s3_endpoint_http
              params:
                s3_endpoint: http://alice:S3EP-PASSWORD-17@127.0.0.1:1/
                s3_auth: public
                allow_http: 'true'
                file_format: parquet
            - from: abfs://container/data/
              name: abfs_endpoint_trim
              params:
                abfs_endpoint: http://alice:AZ-PASSWORD-12@127.0.0.1:1/
                abfs_account: account
            - from: abfs://container/data/
              name: abfs_endpoint_http
              params:
                abfs_endpoint: http://alice:AZ-PASSWORD-18@127.0.0.1:1/
                abfs_account: account
                abfs_access_key: ZXhhbXBsZQ==
                allow_http: 'true'
                file_format: parquet
            # Whitespace before the URL does not hide it. No connector is named ' https', so
            # the dataset fails, and its source is listed.
            - from: ' https://alice:LEAD-DATA-PASSWORD-29@data.example.invalid/rows.csv?sig=LEAD-DATA-PASSWORD-30'
              name: leading_space_source
              params: { file_format: csv }
  - assert-log:
      contains:
        - 'OTEL logs exporter enabled endpoint=http://127\.0\.0\.1:1/v1/metrics\?api_key=\*\*\* '
        - 'Creating OTEL metrics periodic reader endpoint=http://127\.0\.0\.1:1/v1/metrics\?api_key=\*\*\* '
        - 'OTEL metrics exporter enabled endpoint=http://127\.0\.0\.1:1/v1/metrics\?api_key=\*\*\* '
        - "Failed to export logs to the OpenTelemetry endpoint 'http://127\\.0\\.0\\.1:1/v1/metrics\\?api_key=\\*\\*\\*'"
        - 'requires `time_column` parameter for source http://127\.0\.0\.1:[0-9]+/[^ ]*/files/rows\.csv\?api_key=\*\*\*\. '
        - "needs `from` to name an S3 prefix, but 's3://bucket/events/\\*\\.parquet' contains a wildcard"
        - "Trimming trailing '/' from S3 endpoint http://127\\.0\\.0\\.1:1/$"
        - "Insecure HTTP endpoint 'http://127\\.0\\.0\\.1:1' requires 'allow_http: true'"
        - "Trimming trailing '/' from Azure endpoint http://127\\.0\\.0\\.1:1/$"
        - "The 'http://127\\.0\\.0\\.1:1/' is a HTTP URL, but 'allow_http' is not enabled"
        - 'Cannot connect to the dataset abfs_endpoint_http \(abfs\)\..*GET http://127\.0\.0\.1:1/container'
        - 'Cannot connect to the dataset s3_endpoint_http \(s3\)\..*GET http://127\.0\.0\.1:1/bucket'
      lacks: [APPEND-KEY, S3C-PASSWORD, S3EP-PASSWORD, AZ-PASSWORD, OTEL-PASSWORD, OTEL-KEY, LEAD-DATA-PASSWORD]
    eventually: 30s
  - http: { path: /v1/datasets, query: { status: 'true' } }
    expect:
      status: 200
      body-lacks: PASSWORD-
      body-contains: '"from":" https://data.example.invalid/rows.csv?sig=***"'
