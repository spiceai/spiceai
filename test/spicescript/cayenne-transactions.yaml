name: cayenne-transactions
description: >
  A SQL transaction (`BEGIN; SELECT assert(<gate>); UPDATE …; INSERT …;
  COMMIT;`) that writes two Cayenne accelerations commits both or neither,
  with each answer checked against the same transactions run on PostgreSQL. A
  gate that fails after both writes leaves both tables as they were. The
  committed state survives a graceful restart and a kill. The SQLite metastore
  and the object-native one, local and in an S3 state location, give
  identical answers. In the object-native metastore each dataset has its own
  log, so the commit crosses two logs, and a committed transaction leaves no
  transaction records behind. With object-native data, the committed state is
  in the state location, and an instance that loses its directory serves it
  while the source is down (a reload from the source would lose it, since the
  writes went only to the accelerations), then takes transactions again.

sources:
  src: { kind: postgres }
  lake: { kind: rustfs }

variants:
  sqlite: {}
  object-native: { spicepod: { runtime: { params: { cayenne_vnext: enabled } } } }
  # Object-native data (#16131): the metastore and the data files in the state
  # location, local or S3, which an instance that loses its directory serves
  # again without the source.
  object-native-local: object-native-local
  object-native-s3: object-native-s3

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-transactions
  datasets:
    - from: postgres:public.accounts
      name: accounts
      params: ${sources.src.params}
      access: read_write
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, write_mode: acceleration, primary_key: id }
    - from: postgres:public.ledger
      name: ledger
      params: ${sources.src.params}
      access: read_write
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, write_mode: acceleration, primary_key: id }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE accounts (id bigint PRIMARY KEY, balance bigint NOT NULL);
        INSERT INTO accounts VALUES (1, 100), (2, 0);
        CREATE TABLE ledger (id bigint PRIMARY KEY, account bigint NOT NULL, amount bigint NOT NULL);
        INSERT INTO ledger VALUES (1, 1, 100);
        CREATE TABLE accounts_model AS SELECT * FROM accounts;
        CREATE TABLE ledger_model AS SELECT * FROM ledger;
  - start: {}
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # A transfer whose gate holds commits on both tables.
  - spice-exec: 'BEGIN; SELECT assert((SELECT balance FROM accounts WHERE id = 1) >= 30); UPDATE accounts SET balance = balance - 30 WHERE id = 1; INSERT INTO ledger VALUES (2, 1, -30); COMMIT;'
  - source-exec: { src: 'BEGIN; UPDATE accounts_model SET balance = balance - 30 WHERE id = 1; INSERT INTO ledger_model VALUES (2, 1, -30); COMMIT;' }
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # A gate that fails after both writes leaves both tables as they were.
  - spice-exec: 'BEGIN; UPDATE accounts SET balance = balance - 500 WHERE id = 1; INSERT INTO ledger VALUES (3, 1, -500); SELECT assert((SELECT balance FROM accounts WHERE id = 1) >= 500); COMMIT;'
    expect-error: true
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # The second account, then both tables again.
  # A transaction writes each table once.
  - spice-exec: 'BEGIN; SELECT assert((SELECT balance FROM accounts WHERE id = 1) >= 20); UPDATE accounts SET balance = balance + CASE WHEN id = 1 THEN -20 ELSE 20 END WHERE id IN (1, 2); INSERT INTO ledger VALUES (3, 1, -20), (4, 2, 20); COMMIT;'
  - source-exec: { src: 'BEGIN; UPDATE accounts_model SET balance = balance - 20 WHERE id = 1; UPDATE accounts_model SET balance = balance + 20 WHERE id = 2; INSERT INTO ledger_model VALUES (3, 1, -20), (4, 2, 20); COMMIT;' }
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # Each dataset has its own log, so the commits crossed two logs, and nothing
  # of the committed transactions is left in `transactions/`.
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/accounts-, contains: /head, min: 1 }
    only: object-native-s3
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/ledger-, contains: /head, min: 1 }
    only: object-native-s3
  - assert-objects: { source: lake, prefix: state/cayenne/v1/transactions/, max: 0 }
    only: object-native-s3

  # The committed state survives a graceful restart and a kill.
  - restart: {}
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model
  - kill-spiced: {}
  - start: {}
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # And both tables still take transactions after it.
  - spice-exec: 'BEGIN; SELECT assert((SELECT balance FROM accounts WHERE id = 2) >= 5); UPDATE accounts SET balance = balance - 5 WHERE id = 2; INSERT INTO ledger VALUES (5, 2, -5); COMMIT;'
  - source-exec: { src: 'BEGIN; UPDATE accounts_model SET balance = balance - 5 WHERE id = 2; INSERT INTO ledger_model VALUES (5, 2, -5); COMMIT;' }
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model

  # Object-native data (#16131): both tables' files are in the state
  # location, under each log's data/ folder, and none at a local `s3:` path.
  - assert-files: { contains: ['^state/cayenne/v1/datasets/accounts-[^/]+/data/', '^state/cayenne/v1/datasets/ledger-[^/]+/data/'] }
    only: object-native-local
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/accounts-, contains: /data/, min: 1 }
    only: object-native-s3
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/ledger-, contains: /data/, min: 1 }
    only: object-native-s3
  - assert-files: { lacks: '(^|/)s3:' }
    only: &object-native-data [object-native-local, object-native-s3]

  # Killed, and its directory lost: the committed state comes back from the
  # location alone. The source is up but holds none of the rows written through
  # SQL (`write_mode: acceleration`), so they survive only if nothing reloaded.
  # (The source cannot be stopped here: a read-write dataset binds its source
  # when its table is built, so it is never served before the source answers.)
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
    id: accounts-before-wipe
    only: *object-native-data
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model
    id: ledger-before-wipe
    only: *object-native-data
  - kill-spiced: {}
    only: *object-native-data
  - wipe-instance-dir: { keep: [state] }
    only: *object-native-data
  - assert-files: { lacks: '^\.spice/' }
    only: *object-native-data
  - start: {}
    only: *object-native-data
  - query: SELECT id, balance FROM accounts
    expect: { same-as: accounts-before-wipe }
    eventually: 60s
    only: *object-native-data
  - query: SELECT id, account, amount FROM ledger
    expect: { same-as: ledger-before-wipe }
    eventually: 30s
    only: *object-native-data
  - assert-files: { lacks: '(^|/)s3:' }
    only: *object-native-data

  # And both tables take transactions again, on top of the restored state.
  - spice-exec: 'BEGIN; SELECT assert((SELECT balance FROM accounts WHERE id = 1) >= 10); UPDATE accounts SET balance = balance - 10 WHERE id = 1; INSERT INTO ledger VALUES (6, 1, -10); COMMIT;'
    only: *object-native-data
  - source-exec: { src: 'BEGIN; UPDATE accounts_model SET balance = balance - 10 WHERE id = 1; INSERT INTO ledger_model VALUES (6, 1, -10); COMMIT;' }
    only: *object-native-data
  - query: SELECT id, balance FROM accounts
    oracle-sql: SELECT id, balance FROM accounts_model
    eventually: 30s
    only: *object-native-data
  - query: SELECT id, account, amount FROM ledger
    oracle-sql: SELECT id, account, amount FROM ledger_model
    only: *object-native-data
