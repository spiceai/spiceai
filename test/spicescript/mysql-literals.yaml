name: mysql-literals
description: >
  Every column of a MySQL table of edge values compared with each edge value
  of its type, in each comparison form (=, <, >=, <>, IN, BETWEEN), answers
  as MySQL answers it: federated, where the literal is rewritten into MySQL's
  SQL, and accelerated into Cayenne. The queries are generated by
  corpus/mysql_literals.py.

sources:
  src: { kind: mysql }

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: mysql-literals
  datasets:
    - from: mysql:m
      name: m
      params: ${sources.src.params}

defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE m (
          id int PRIMARY KEY, f double, r float, d decimal(65, 30), i8 bigint, u8 bigint unsigned,
          s varchar(100) COLLATE utf8mb4_0900_bin, dtm datetime(6), dt date);
        INSERT INTO m VALUES
          (1, -1.7976931348623157e308, -3.4e38, -99999999999999999999999999999999999.999999999999999999999999999999,
           -9223372036854775808, 0, '', '1000-01-01 00:00:00', '1000-01-01'),
          (2, 1e308, 3.4e38, 99999999999999999999999999999999999.999999999999999999999999999999,
           9223372036854775807, 18446744073709551615, ' ', '9999-12-31 23:59:59.999999', '9999-12-31'),
          (3, 0, 0, 0, 0, 1, 'a''b"c_d%e', '1970-01-01 00:00:00.000001', '1969-12-31'),
          (4, 5e-324, 1e-45, -0.000000000000000000000000000001, -1, 0, 'naïve', '2000-02-29 12:00:00.000001', '2000-02-29'),
          (5, 2.2250738585072014e-308, 0.1, 2.5, 1, 1, 'tab\there', '2038-01-19 03:14:08', '2000-02-29'),
          (6, 0.30000000000000004, 0.1, 2.5, 7, 7, '日本語', '2038-01-19 03:14:08', '1969-12-31'),
          (7, -1, 1, 0, 0, 0, '😀 emoji', '2000-02-29 12:00:00.000001', '9999-12-31'),
          (8, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL);
  - start: {}
  - corpus: corpus/mysql-literals.sql
