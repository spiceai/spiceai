name: clickhouse-literals
description: >
  Every column of a ClickHouse table of edge values compared with each edge
  value of its type, in each comparison form (=, <, >=, <>, IN, BETWEEN),
  answers as ClickHouse answers it: federated, where the literal is rewritten
  into ClickHouse's SQL, and accelerated into Cayenne. The queries are
  generated by corpus/clickhouse_literals.py. (A Decimal(38, …) column, and negative decimals above -0.1:
  known-failing/clickhouse/clickhouse-decimals.yaml.)

sources:
  src: { kind: clickhouse }

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: clickhouse-literals
  datasets:
    - from: clickhouse:c
      name: c
      params: ${sources.src.params}

defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE c (
          id Int32, f Nullable(Float64), d Nullable(Decimal(18, 6)), i8 Nullable(Int64), u8 Nullable(UInt64),
          s Nullable(String), dtm Nullable(DateTime64(6, 'UTC')), dt Nullable(Date32))
        ENGINE = MergeTree ORDER BY id;
        INSERT INTO c VALUES
          (1, -1.7976931348623157e308, -999999999999.999999, -9223372036854775808, 0,
           '', '1900-01-01 00:00:00', '1900-01-01'),
          (2, 1e308, 999999999999.999999, 9223372036854775807, 18446744073709551615,
           ' ', '2261-12-31 23:59:59.999999', '2299-12-31'),
          (3, 0, 0, 0, 1, 'a''b"c_d%e', '1970-01-01 00:00:00.000001', '1969-12-31'),
          (4, 1e-300, -0.5, -1, 0, 'naïve', '2000-02-29 12:00:00.000001', '2000-02-29'),
          (5, 1e-300, 2.5, 1, 1, '日本語', '2038-01-19 03:14:08', '2000-02-29'),
          (6, 0.30000000000000004, 2.5, 7, 7, '😀 emoji', '2038-01-19 03:14:08', '1969-12-31'),
          (7, -1, 0, 0, 0, '😀 emoji', '2000-02-29 12:00:00.000001', '2299-12-31'),
          (8, NULL, NULL, NULL, NULL, NULL, NULL, NULL);
  - start: {}
  - query: SELECT id, f, d, i8, u8, s FROM c ORDER BY id
  - corpus: corpus/clickhouse-literals.sql
