name: debezium-offset-recovery
description: >
  Debezium Server posting PostgreSQL changes straight to Spice (`from: cdc:`)
  loses and duplicates nothing through faults: spiced killed while changes
  stream in, and Debezium itself killed, each followed by Debezium restarting
  from its committed offsets as a supervisor would. Events it sends again are
  applied once, a reader never sees a duplicate key, and the acceleration ends
  equal to PostgreSQL.

sources:
  src: { kind: postgres }
  # One Debezium Server per instance, started inside this container once the
  # instance's spiced is listening. 3.2 and 3.3 resend the HTTP sink's context
  # headers with every event until servers refuse the request (431).
  dbz:
    kind: docker
    image: quay.io/debezium/server:3.1
    host-network: true
    command: [sleep, infinity]
    ready: 'true'

# The spicepod as written, and the same with the prototype object-native Cayenne
# metastore in place of SQLite.
variants:
  as-written: federated
  object-native: object-native

spicepod:
  version: v1
  kind: Spicepod
  name: debezium-offset-recovery
  datasets:
    - from: cdc:acct
      name: acct
      columns:
        - { name: id, type: bigint }
        - { name: bal, type: bigint }
        - { name: note, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE acct (id bigint PRIMARY KEY, bal bigint NOT NULL, note text);
        ALTER TABLE acct REPLICA IDENTITY FULL;
        INSERT INTO acct SELECT g, 1000, 'start' FROM generate_series(1, 200) g;
  - start: {}
  # Starts Debezium (again), resuming from its offsets file when it has one.
  - source-exec:
      dbz: &debezium >-
        mkdir -p /tmp/${sources.src.namespace};
        cd /debezium;
        DEBEZIUM_SINK_TYPE=http
        DEBEZIUM_SINK_HTTP_URL=http://${sources.dbz.host_from_container}:${instance.http_port}/v1/datasets/acct/cdc
        DEBEZIUM_SOURCE_CONNECTOR_CLASS=io.debezium.connector.postgresql.PostgresConnector
        DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME=/tmp/${sources.src.namespace}/offsets.dat
        DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS=0
        DEBEZIUM_SOURCE_DATABASE_HOSTNAME=${sources.dbz.host_from_container}
        DEBEZIUM_SOURCE_DATABASE_PORT=${sources.src.params.pg_port}
        DEBEZIUM_SOURCE_DATABASE_USER=${sources.src.params.pg_user}
        DEBEZIUM_SOURCE_DATABASE_PASSWORD=${sources.src.params.pg_pass}
        DEBEZIUM_SOURCE_DATABASE_DBNAME=${sources.src.params.pg_db}
        DEBEZIUM_SOURCE_TOPIC_PREFIX=${sources.src.namespace}
        DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST=public.acct
        DEBEZIUM_SOURCE_PLUGIN_NAME=pgoutput
        DEBEZIUM_SOURCE_SLOT_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_SOURCE_PUBLICATION_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_FORMAT_VALUE=json
        DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE=false
        DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE=false
        QUARKUS_HTTP_PORT=${instance.port}
        QUARKUS_LOG_FILE_ENABLE=false
        nohup /debezium/run.sh >> /tmp/${sources.src.namespace}/debezium.log 2>&1 < /dev/null &
        echo $! > /tmp/${sources.src.namespace}/pid
  - query: SELECT * FROM acct
    eventually: 120s

  - background:
      id: changes
      source-exec:
        src: >-
          WITH p AS (SELECT 1 + (random() * 199)::int AS a, 1 + (random() * 199)::int AS b)
          UPDATE acct SET bal = bal + CASE WHEN acct.id = p.a THEN -1 ELSE 1 END, note = 'moved'
          FROM p WHERE acct.id IN (p.a, p.b) AND p.a <> p.b
      every: 20ms
  - background:
      id: no-duplicates
      query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM acct
      expect: { duplicates: '0' }

  # Changes flow for a while, then spiced is killed while they keep coming.
  # Debezium gives up once its retries run out; a supervisor restarts it.
  - sleep: 5s
  - kill-spiced: {}
  - sleep: 5s
  - start: {}
  - source-exec: { dbz: "kill $(cat /tmp/${sources.src.namespace}/pid) 2>/dev/null; sleep 3; true" }
  - source-exec: { dbz: *debezium }
  - sleep: 5s

  # Debezium itself is killed mid-stream and restarted.
  - source-exec: { dbz: "kill -9 $(cat /tmp/${sources.src.namespace}/pid)" }
  - sleep: 3s
  - source-exec: { dbz: *debezium }
  - sleep: 5s

  - stop-background: { id: changes }
  - query: SELECT * FROM acct
    eventually: 120s
  - query: SELECT sum(bal) AS total FROM acct
    expect: { rows: [['200000']] }
  - stop-background: { id: no-duplicates, allow: ['^[45][0-9][0-9] ', 'error sending request', 'connection', 'not ready'] }
