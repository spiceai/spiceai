name: ducklake-coverage
description: >
  DuckLake tables answer the extended corpus and ternary logic partitioning as PostgreSQL answers them over the same generated rows: federated to DuckLake, and accelerated into Cayenne.

sources:
  lake: { kind: ducklake }
  ref: { kind: postgres }

# One value: names the place in the corpus's known-failing notes.
matrix:
  source: [ducklake]

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: ducklake-coverage
  datasets:
    - from: 'ducklake:main.t'
      name: t
      params: ${sources.lake.params}
    - from: 'ducklake:main.u'
      name: u
      params: ${sources.lake.params}

defaults:
  expect: { oracle: ref }
  compare-variants: false

steps:
  - generate:
      lake:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      lake:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - corpus: corpus/queries-extended.sql
  - tlp: { table: t, seed: 3, queries: 200, depth: 3, aggregate: d, oracle: ref, avoid: [not] }
