# Known failing (#15538): queries pushed to ClickHouse keep
# PostgreSQL/DataFusion semantics they do not have there (NOT IN with NULL,
# ASCII-only upper, byte substr, date_part, Decimal(38) sums, correlated
# EXISTS). Fold back into federation-matrix.yaml once it passes.
name: clickhouse-federation
description: >
  The pushdown corpus answers the same through Spice when its tables
  federate to ClickHouse as when they federate to PostgreSQL: checked against
  PostgreSQL holding the same generated rows.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [clickhouse]

spicepod:
  version: v1
  kind: Spicepod
  name: clickhouse-federation
  datasets:
    - from: '${matrix.backend}:t'
      name: t
      params: ${sources.backend.params}
    - from: '${matrix.backend}:u'
      name: u
      params: ${sources.backend.params}

defaults:
  expect: { oracle: ref }

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - corpus: ../../corpus/pushdown.sql
  # The federated query reached the backend rather than being answered locally.
  - explain: SELECT id FROM t WHERE i > 40
    contains: [VirtualExecutionPlan]
