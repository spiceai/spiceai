        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
        - { name: name, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:created3_${sources.ddb.namespace}
      name: created3
      params:
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
        - { name: name, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:streamed0_${sources.ddb.namespace}
      name: streamed0
      params:
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
        - { name: name, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:streamed1_${sources.ddb.namespace}
      name: streamed1
      params:
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
