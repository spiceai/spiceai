steps:
  - source-exec:
      ddb: |
        python3 - <<'PY'
        import boto3
        d = boto3.resource('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')
        c = boto3.client('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')
        N = '${sources.ddb.namespace}'
        def make(name, stream):
            spec = dict(TableName=name + '_' + N, KeySchema=[{'AttributeName': 'id', 'KeyType': 'HASH'}],
                AttributeDefinitions=[{'AttributeName': 'id', 'AttributeType': 'S'}], BillingMode='PAY_PER_REQUEST')
            if stream:
                spec['StreamSpecification'] = {'StreamEnabled': True, 'StreamViewType': 'NEW_AND_OLD_IMAGES'}
            d.create_table(**spec).wait_until_exists()
        for i in range(4):
            make('streamed' + str(i), False)
        PY
  - start: { ready: false }
  - source-exec:
      ddb: |
        python3 - <<'PY'
        import boto3
        d = boto3.resource('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')
        c = boto3.client('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')
        N = '${sources.ddb.namespace}'
        def make(name, stream):
            spec = dict(TableName=name + '_' + N, KeySchema=[{'AttributeName': 'id', 'KeyType': 'HASH'}],
                AttributeDefinitions=[{'AttributeName': 'id', 'AttributeType': 'S'}], BillingMode='PAY_PER_REQUEST')
            if stream:
                spec['StreamSpecification'] = {'StreamEnabled': True, 'StreamViewType': 'NEW_AND_OLD_IMAGES'}
            d.create_table(**spec).wait_until_exists()
        for i in range(4):
            make('created' + str(i), True)
            c.update_table(TableName='streamed' + str(i) + '_' + N, StreamSpecification={'StreamEnabled': True, 'StreamViewType': 'NEW_AND_OLD_IMAGES'})
        for t in ['created', 'streamed']:
            for i in range(4):
                for k in range(3):
                    d.Table(t + str(i) + '_' + N).put_item(Item={'id': str(k), 'name': 'Item ' + str(k)})
        PY
  - query: SELECT id, name FROM created0
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM created1
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM created2
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM created3
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM streamed0
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM streamed1
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM streamed2
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
  - query: SELECT id, name FROM streamed3
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 90s
