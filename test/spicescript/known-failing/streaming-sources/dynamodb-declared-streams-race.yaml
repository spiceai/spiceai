# Known failing (no issue filed yet): with declared columns, a DynamoDB
# Streams dataset over a table that is created (with streams) or gets streams
# enabled after startup registers empty, and rows written right afterwards can
# be missed for good — in 3 of 4 runs at least one such table stays empty.
name: dynamodb-declared-streams-race
description: >
  A DynamoDB Streams dataset with declared columns, over a table created with
  streams, or given streams, after Spice has started, loads every row written
  to it afterwards.

sources:
  ddb:
    kind: docker
    image: docker.io/localstack/localstack:4.9
    ports: [4566]
    env: { SERVICES: dynamodb, AWS_DEFAULT_REGION: us-east-1 }
    ready: awslocal dynamodb list-tables

spicepod:
  version: v1
  kind: Spicepod
  name: dynamodb-declared-streams-race
  datasets:
    - from: dynamodb:created0_${sources.ddb.namespace}
      name: created0
      params:
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
        - { name: name, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:created1_${sources.ddb.namespace}
      name: created1
      params:
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://localhost:${sources.ddb.port.4566}
      columns:
        - { name: id, type: text }
        - { name: name, type: text }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:created2_${sources.ddb.namespace}
      name: created2
      params:
