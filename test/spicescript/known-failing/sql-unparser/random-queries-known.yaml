# Native MySQL collation remains a mismatch with the PostgreSQL reference.
# PostgreSQL and accelerated variants guard the shared nested-query paths.
# Failing queries are saved beside each instance's log.
name: random-queries-known
description: >
  Random queries over nested subqueries (filters, groupings, DISTINCT,
  ORDER BY … LIMIT on a unique key, joins, UNION ALL) under outer queries that
  read some, none or all of their columns answer through Spice as PostgreSQL
  answers them over the same rows: federated to PostgreSQL and MySQL, and
  accelerated into each engine.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql]

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: query-coverage
  datasets:
    - from: '${matrix.backend}:t'
      name: t
      params: ${sources.backend.params}
    - from: '${matrix.backend}:u'
      name: u
      params: ${sources.backend.params}

defaults:
  compare-variants: false

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - random-queries: { tables: [t, u], joins: ['t.id = u.t_id'], seed: 1, queries: 300, depth: 2, oracle: ref }
    when: { backend: postgres }
  - random-queries: { tables: [t, u], joins: ['t.id = u.t_id'], seed: 1, queries: 300, depth: 2, oracle: ref, skip-columns: [b] }
    when: { backend: mysql }
