# Known failing (#15538) wherever Spice sends SQL to an engine (federated PostgreSQL,
# DuckDB accelerations): INTERSECT and EXCEPT are sent as
# EXISTS / NOT EXISTS with `=`, where a set operation compares NULLs as equal,
# so INTERSECT drops a shared NULL row and EXCEPT keeps one; and over one table
# with a filter on the right, the SQL sent filters on a column its subquery
# does not select, which fails.
name: unparse-set-operations
description: >
  INTERSECT and EXCEPT answer as PostgreSQL does, NULLs included, wherever the
  query runs.

sources:
  src: { kind: postgres }

variants:
  federated: {}
  duckdb: duckdb
  arrow: arrow

spicepod:
  version: v1
  kind: Spicepod
  name: unparse-set-operations
  datasets:
    - { from: 'postgres:public.w', name: w, params: '${sources.src.params}' }
    - { from: 'postgres:public.w2', name: w2, params: '${sources.src.params}' }

defaults:
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE w (id int PRIMARY KEY, a int, s text);
        INSERT INTO w VALUES (1, 1, 'x'), (2, NULL, 'y'), (3, 3, NULL), (4, NULL, NULL), (5, 1, 'x');
        CREATE TABLE w2 (id int PRIMARY KEY, a int, s text);
        INSERT INTO w2 VALUES (10, NULL, 'y'), (11, 3, NULL), (12, 7, 'z');
  - start: {}
  # Control: no NULLs on either side.
  - query: SELECT a FROM w WHERE a IS NOT NULL INTERSECT SELECT a FROM w2 WHERE a IS NOT NULL
  - query: SELECT a FROM w INTERSECT SELECT a FROM w2
  - query: SELECT a FROM w EXCEPT SELECT a FROM w2
  - query: SELECT a, s FROM w INTERSECT SELECT a, s FROM w2
  - query: SELECT a, s FROM w EXCEPT SELECT a, s FROM w2
  - query: SELECT a FROM w INTERSECT SELECT a FROM w WHERE id > 1
  - query: SELECT a, s FROM w EXCEPT SELECT a, s FROM w WHERE id IN (2, 4)
