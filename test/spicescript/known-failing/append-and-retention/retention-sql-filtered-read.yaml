name: retention-sql-filtered-read
description: >
  Known failing (#16062): after retention_sql deletes a row from an
  append-refreshed Cayenne acceleration that upserts on a primary key, a query
  that filters on the deleted column still returns the row, while SELECT * no
  longer does. The fix moves this check back into retention.yaml.
sources:
  src: { kind: postgres }
variants:
  cayenne: {}
  # The spicepod as written, with the prototype object-native Cayenne metastore.
  object-native: object-native
spicepod:
  version: v1
  kind: Spicepod
  name: retention-sql-filtered-read
  runtime:
    caching: { sql_results: { enabled: false } }
  datasets:
    - from: postgres:public.widgets
      name: appended
      params: ${sources.src.params}
      time_column: updated_at
      time_format: timestamptz
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: append
        refresh_check_interval: 200ms
        primary_key: id
        on_conflict: { id: upsert }
        retention_sql: DELETE FROM appended WHERE deleted = true
steps:
  - source-exec:
      src: |
        CREATE TABLE widgets (id int PRIMARY KEY, name text, updated_at timestamptz NOT NULL DEFAULT now(), deleted boolean NOT NULL DEFAULT false);
        INSERT INTO widgets (id, name) VALUES (1, 'a'), (2, 'b'), (3, 'c');
  - start: {}
  - query: SELECT * FROM appended
    oracle-sql: SELECT * FROM widgets
    eventually: 30s
  - source-exec: { src: "UPDATE widgets SET deleted = true, updated_at = now() + INTERVAL '1 second' WHERE id = 1" }
  - refresh: appended
  # SELECT * no longer returns row 1 once retention_sql has run.
  - query: SELECT * FROM appended
    oracle-sql: SELECT * FROM widgets WHERE NOT deleted
    eventually: 30s
  # A query filtered on the deleted column must not return it either.
  - query: SELECT id, deleted FROM appended WHERE deleted = true
    expect: { rows: [] }
    expect-empty: true
