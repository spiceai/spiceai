# Known failing (#15543) from 2.3.x only, intermittently: v2.3.3 sometimes
# acknowledges the replication slots past what it recorded as applied before a
# clean stop, so the upgraded runtime rebuilds every dataset from the source
# (rebuild_cause="acknowledged_past") instead of resuming. The rows still match;
# the check that nothing was rebuilt fails. From 2.4.x it passes.
name: postgres-cdc-upgrade
description: >
  PostgreSQL change capture resumes across an upgrade in place from each of the last
  two releases: datasets sharing one replication slot (one
  keyed on two columns) and one on the default slot apply every change made
  while the runtime was down, each once, and keep following the source
  afterwards — resuming where they stopped rather than re-reading their
  tables.

matrix:
  from: [2.3.x, 2.4.x]
from: '${matrix.from}'

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-upgrade
  datasets:
    - from: postgres:public.ta
      name: pg_a
      params: { $merge: '${sources.src.params}', pg_replication_slot: 'shared_${sources.src.namespace}' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: postgres:public.tp
      name: pg_p
      params: { $merge: '${sources.src.params}', pg_replication_slot: 'shared_${sources.src.namespace}' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: '(id, at)', on_conflict: { '(id, at)': upsert } }
    - from: postgres:public.tc
      name: pg_c
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }

# `on_conflict` is deprecated for Cayenne, but older releases require it for
# change capture.
defaults:
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE ta (id int PRIMARY KEY, v text, n numeric(12, 2));
        INSERT INTO ta SELECT g, 'v' || g, g * 1.5 FROM generate_series(1, 1000) g;
        CREATE TABLE tp (id int, at date, v int, PRIMARY KEY (id, at));
        INSERT INTO tp SELECT g % 100, DATE '2025-01-01' + g / 100, g FROM generate_series(0, 999) g;
        CREATE TABLE tc (id int PRIMARY KEY, v text);
        INSERT INTO tc SELECT g, 'c' || g FROM generate_series(1, 500) g;
  - start: {}

  # Following the source on the older runtime.
  - source-exec:
      src: |
        UPDATE ta SET v = 'running' WHERE id % 7 = 0;
        DELETE FROM ta WHERE id % 13 = 0;
        UPDATE tp SET v = -v WHERE at = DATE '2025-01-03';
        DELETE FROM tp WHERE id = 5;
        INSERT INTO tc SELECT g, 'running' FROM generate_series(501, 600) g;
  - query: SELECT * FROM pg_a
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM pg_p
    oracle-sql: SELECT * FROM tp
    eventually: 60s
  - query: SELECT * FROM pg_c
    oracle-sql: SELECT * FROM tc
    eventually: 60s

  # Down, the source changes; then up on the binary under test.
  - stop: {}
  - source-exec:
      src: |
        UPDATE ta SET v = 'while down', n = -n WHERE id BETWEEN 100 AND 300;
        DELETE FROM ta WHERE id BETWEEN 400 AND 450;
        INSERT INTO ta SELECT g, 'while down', 0 FROM generate_series(2001, 2100) g;
        UPDATE tp SET v = 0 WHERE id = 7;
        DELETE FROM tp WHERE at = DATE '2025-01-05';
        INSERT INTO tp VALUES (500, DATE '2026-01-01', 1), (500, DATE '2026-01-02', 2);
        UPDATE tc SET v = 'while down' WHERE id <= 50;
        DELETE FROM tc WHERE id > 590;
  - upgrade: {}

  - query: SELECT * FROM pg_a
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM pg_p
    oracle-sql: SELECT * FROM tp
    eventually: 60s
  - query: SELECT * FROM pg_c
    oracle-sql: SELECT * FROM tc
    eventually: 60s
  # Resumed, not rebuilt.
  - assert-log: { lacks: 'rebuilt the acceleration from the source' }
  - assert-log: { count: { 'Resuming from existing replication slot': '>=4' } }

  # Each row once.
  - query: SELECT (SELECT count(*) - count(DISTINCT id) FROM pg_a) + (SELECT count(*) - count(DISTINCT (id, at)) FROM pg_p) + (SELECT count(*) - count(DISTINCT id) FROM pg_c) AS duplicates
    expect: { rows: [['0']] }

  # And the upgraded runtime keeps following.
  - source-exec: { src: "INSERT INTO ta VALUES (3000, 'after', 1); UPDATE tp SET v = 42 WHERE id = 1; DELETE FROM tc WHERE id = 1" }
  - query: SELECT * FROM pg_a
    oracle-sql: SELECT * FROM ta
    eventually: 30s
  - query: SELECT * FROM pg_p
    oracle-sql: SELECT * FROM tp
    eventually: 30s
  - query: SELECT * FROM pg_c
    oracle-sql: SELECT * FROM tc
    eventually: 30s
