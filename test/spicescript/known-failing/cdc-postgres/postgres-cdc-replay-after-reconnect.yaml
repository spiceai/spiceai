# Known failing (#16625).
name: postgres-cdc-replay-after-reconnect
tags: [long]
description: >
  When Spice re-establishes a PostgreSQL replication connection while a
  file-mode Cayenne CDC acceleration (refresh_mode: changes) holds changes it
  has applied but not yet checkpointed, the source sends those changes again.
  Spice reconnects when the connection drops, and when a dataset on a shared
  slot finishes its initial snapshot or a rebuild from the source, as one does
  after spiced is killed during its initial snapshot. The re-sent changes must
  not undo later ones: a key inserted, updated and deleted at the source stays
  deleted, and a row updated many times keeps its last value, also after a
  restart. Today a re-sent INSERT or UPDATE can be applied after the DELETE or
  the later UPDATE that followed it, while the re-sent DELETE or later UPDATE
  is skipped as already applied, so the deleted key comes back and the updated
  row goes back to an older value, for good.

sources:
  src: { kind: postgres }
  # Embeddings for `g` and `h`. A request whose inputs contain SNAP or HOLD waits
  # while /tmp/hold-<namespace>-SNAP or /tmp/hold-<namespace>-HOLD exists;
  # each instance calls the container under its own namespace, the first path
  # segment.
  emb:
    kind: docker
    image: docker.io/library/python:3.12-slim
    ports: [8000]
    command:
      - python
      - -c
      - |
        import json, os, time
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()

            def do_POST(self):
                request = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                namespace = self.path.strip("/").split("/")[0]
                inputs = request["input"]
                if isinstance(inputs, str):
                    inputs = [inputs]
                for token in ("SNAP", "HOLD"):
                    if any(token in t for t in inputs):
                        while os.path.exists("/tmp/hold-" + namespace + "-" + token):
                            time.sleep(0.1)
                body = json.dumps({
                    "object": "list",
                    "data": [{"object": "embedding", "index": i, "embedding": [float(len(t)), 1.0]} for i, t in enumerate(inputs)],
                    "model": request["model"],
                    "usage": {"prompt_tokens": 0, "total_tokens": 0},
                }).encode()
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)

        ThreadingHTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    ready: python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"

# What makes Spice reconnect while `v` and `g` hold changes they have applied
# but not acknowledged. `h` is added to their slot after they have loaded, and
# reads its initial snapshot while they follow the source.
#   connection-lost         the replication connection is terminated at the
#                           source.
#   snapshot-done           `h` finishes its initial snapshot (no kill).
#   kill-in-snapshot        spiced is killed during `h`'s initial snapshot. `h`
#                           has no recorded position after the restart, so it
#                           is rebuilt from the source, and finishes that.
#   kill-in-rebuild         as kill-in-snapshot, and spiced is killed again
#                           during the rebuild; the next start rebuilds `h`
#                           again.
#   kill-after-checkpoint   as kill-in-snapshot, and spiced is killed while the
#                           changes sent again wait behind `g`, after `v` has
#                           checkpointed them; the wrong row is already
#                           durable.
# The kills land in `h`'s snapshot, its rebuild, and its catch-up after the
# rebuild; each phase is checked before the kill.
matrix:
  reconnect: [connection-lost, snapshot-done, kill-in-snapshot, kill-in-rebuild, kill-after-checkpoint]

# The spicepod as written (the SQLite Cayenne metastore), and the same with
# the prototype object-native metastore.
#
# Every variant hands each commit to a dataset on its own rather than folding
# consecutive commits together, so the 3,000 commits to `g` below fill its
# queue.
variants:
  as-written:
    env: &env
      SPICE_POSTGRES_CDC_MAX_ENVELOPE_AGE_MS: '0'
      SPICE_POSTGRES_CDC_MAX_BACKPRESSURE_ROWS_PER_ENVELOPE: '1'
  object-native:
    env: *env
    spicepod: { runtime: { params: { cayenne_vnext: enabled } } }

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-replay-after-reconnect
  runtime:
    caching:
      sql_results: { enabled: false }
  embeddings:
    - from: openai:held
      name: emb
      params:
        endpoint: http://127.0.0.1:${sources.emb.port.8000}/${sources.emb.namespace}/v1
        openai_api_key: test
  datasets:
    - from: postgres:public.v
      name: v
      params:
        $merge: ${sources.src.params}
        pg_replication_slot: ${sources.src.namespace}_shared
      acceleration: &cdc
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: changes
        primary_key: id
        # Checkpoint, and so acknowledge the source, once a minute rather than
        # every second: what a dataset applies below stays unacknowledged until
        # Spice reconnects, and is acknowledged while the changes sent again
        # wait behind `g`.
        params: { cayenne_cdc_mem_tier_checkpoint_interval_ms: '60000' }
    # Its changes wait while HOLD is held.
    - from: postgres:public.g
      name: g
      params:
        $merge: ${sources.src.params}
        pg_replication_slot: ${sources.src.namespace}_shared
      acceleration: *cdc
      columns:
        - name: t
          embeddings: [{ from: emb }]
    # Its initial snapshot and its rebuilds wait while SNAP is held.
    - from: postgres:public.h
      name: h
      params:
        $merge: ${sources.src.params}
        pg_replication_slot: ${sources.src.namespace}_shared
      acceleration: *cdc
      columns:
        - name: t
          embeddings: [{ from: emb }]

defaults:
  expect: { oracle: src }
  # Each variant writes to its own source database; each is checked against it.
  compare-variants: false

steps:
  # `h`'s 2,000 SNAP rows (16 MiB) are more than its apply loop gathers ahead,
  # so while their embeddings wait, its snapshot or rebuild does not finish.
  - source-exec:
      src: |
        CREATE TABLE v (id bigint PRIMARY KEY, n bigint NOT NULL);
        INSERT INTO v SELECT i, 0 FROM generate_series(1, 1000) i;
        CREATE TABLE g (id bigint PRIMARY KEY, t text NOT NULL);
        INSERT INTO g VALUES (0, 'start');
        CREATE TABLE h (id bigint PRIMARY KEY, t text NOT NULL);
        INSERT INTO h SELECT i, 'SNAP ' || i || ' ' || repeat('s', 8000) FROM generate_series(1, 2000) i;

  # `v` and `g` load and record their positions; `h` is not accelerated yet.
  - start: { patch: { datasets: { h: { acceleration: { enabled: false } } } } }
  - query: SELECT id, n FROM v
    eventually: 60s
  - query: SELECT id, t FROM g
    eventually: 60s
  - stop: {}

  # `h` joins their slot and reads its initial snapshot; `v` and `g` resume.
  - source-exec: { emb: "touch /tmp/hold-${sources.emb.namespace}-SNAP" }
    when: &held { reconnect: [snapshot-done, kill-in-snapshot, kill-in-rebuild, kill-after-checkpoint] }
  - start: { ready: false, patch: { datasets: { h: { acceleration: { enabled: true } } } } }
  - assert-log:
      contains: "Dataset 'h' will have its acceleration created by reading the source"
    eventually: 30s
  - assert-status: { dataset: h, ready: false }
    when: *held
  - wait-ready: { timeout: 120s }
    when: { reconnect: connection-lost }

  # Killed during `h`'s snapshot: the restart rebuilds `h` from the source, and
  # that rebuild waits on the SNAP rows.
  - kill-spiced: {}
    when: &killed { reconnect: [kill-in-snapshot, kill-in-rebuild, kill-after-checkpoint] }
  - start: { ready: false }
    when: *killed
  - assert-log:
      count: { "Dataset 'h' will have its acceleration rebuilt from the source before changes are applied, which re-reads the whole table: it has no recorded position": 1 }
    eventually: 30s
    when: *killed
  # Killed again during that rebuild: the next start rebuilds `h` again.
  - kill-spiced: {}
    when: { reconnect: kill-in-rebuild }
  - start: { ready: false }
    when: { reconnect: kill-in-rebuild }
  - assert-log:
      count: { "Dataset 'h' will have its acceleration rebuilt from the source before changes are applied, which re-reads the whole table: it has no recorded position": 2 }
    eventually: 30s
    when: { reconnect: kill-in-rebuild }
  # `v` and `g` resumed every time.
  - assert-log:
      lacks: ["Dataset 'v' will have its acceleration rebuilt", "Dataset 'g' will have its acceleration rebuilt"]
  - query: SELECT id, n FROM v
    eventually: 60s

  # Insert, update and delete key 5000 of `v`, with 3,000 one-row commits to
  # `g` between the update and the delete: more than `g` takes in while its
  # embeddings wait below (its apply loop gathers up to 1,024 changes and its
  # queue holds 16 more).
  - source-exec: { src: "INSERT INTO v VALUES (5000, 1)" }
  - source-exec: { src: "UPDATE v SET n = 2 WHERE id = 5000" }
  - source-exec:
      src: |
        DO $$
        BEGIN
          FOR i IN 1..3000 LOOP
            UPDATE g SET t = 'HOLD ' || i WHERE id = 0;
            COMMIT;
          END LOOP;
        END $$;
  - source-exec: { src: "UPDATE g SET t = 'last' WHERE id = 0" }
  - source-exec: { src: "DELETE FROM v WHERE id = 5000" }
  # `v` and `g` have applied every change, and acknowledged none of them.
  - query: SELECT id, n FROM v WHERE id = 5000
    expect-empty: true
    eventually: 15s
  - query: SELECT id, t FROM g WHERE id = 0
    eventually: 30s

  # Hold `g`'s embeddings, then make Spice reconnect.
  - source-exec: { emb: "touch /tmp/hold-${sources.emb.namespace}-HOLD" }
  - source-exec: { src: "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE backend_type = 'walsender' AND datname = current_database()" }
    when: { reconnect: connection-lost }
  - assert-log: { contains: 'shared replication connection resumed' }
    eventually: 15s
    when: { reconnect: connection-lost }
  - source-exec: { emb: "rm -f /tmp/hold-${sources.emb.namespace}-SNAP" }
    when: *held
  - assert-log: { contains: 'Dataset h: rebuilt the acceleration from the source; resuming change streaming' }
    eventually: 60s
    when: *killed
  # The changes sent again to `g` wait on its embeddings, and the source waits
  # to hand it more.
  - wait-metric: { name: dataset_postgres_replication_member_send_stalled_seconds_total, above: 0, timeout: 60s }
  # Meanwhile `v`'s and `g`'s next checkpoints acknowledge what they applied
  # before Spice reconnected.
  - wait-metric: { name: cayenne_mem_tier_checkpoint_tick_total, labels: { table: v }, increases: true, timeout: 90s }
  - wait-metric: { name: cayenne_mem_tier_checkpoint_tick_total, labels: { table: g }, increases: true, timeout: 90s }
  # Killed after `v` checkpoints.
  - kill-spiced: {}
    when: { reconnect: kill-after-checkpoint }
  - source-exec: { emb: "rm -f /tmp/hold-${sources.emb.namespace}-HOLD" }
  - start: {}
    when: { reconnect: kill-after-checkpoint }
  - wait-ready: { timeout: 120s }

  # Key 5000 stays deleted, and `g` keeps its last update.
  - query: SELECT id, n FROM v WHERE id = 5000
    expect-empty: true
    eventually: 30s
  - query: SELECT id, n FROM v
    eventually: 30s
  - query: SELECT id, t FROM g WHERE id = 0
    eventually: 30s
  - query: SELECT count(*) AS n FROM h
    eventually: 30s
  # The same after a restart, which resumes from the acknowledged position.
  - restart: {}
  - query: SELECT id, n FROM v WHERE id = 5000
    expect-empty: true
    eventually: 30s
  - query: SELECT id, n FROM v
    eventually: 30s
  - query: SELECT id, t FROM g WHERE id = 0
    eventually: 30s
