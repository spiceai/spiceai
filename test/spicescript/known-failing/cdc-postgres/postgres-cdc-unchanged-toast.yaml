# Known failing (#15543): Under REPLICA IDENTITY DEFAULT, one UPDATE that leaves an out-of-line value
# unchanged stops replication for the whole table until a restart rebuilds it.
# Move this script to test/spicescript/ once it passes.
name: postgres-cdc-unchanged-toast
description: >
  Under Postgres's default (primary-key) replica identity, an UPDATE that leaves
  an out-of-line value unchanged replicates, and replication keeps flowing for
  every later change to the table.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-unchanged-toast
  datasets:
    - from: postgres:public.docs
      name: docs
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: changes
        primary_key: id

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE docs (id integer PRIMARY KEY, version integer NOT NULL, body text);
        -- Out of line and uncompressed once larger than about 2 KB.
        ALTER TABLE docs ALTER COLUMN body SET STORAGE EXTERNAL;
        INSERT INTO docs VALUES (1, 1, repeat('a', 3000)), (2, 1, 'short');
  - start: {}
  - query: SELECT id, version, length(body) FROM docs
    eventually: 30s
  - assert-status: { dataset: docs, status: Ready, ready: true }

  # One update that leaves the large value alone.
  - source-exec: { src: UPDATE docs SET version = 2 WHERE id = 1 }
  - query: SELECT id, version, length(body) FROM docs
    eventually: 20s
  - assert-status: { dataset: docs }

  # An unrelated insert of a small row afterwards.
  - source-exec: { src: "INSERT INTO docs VALUES (3, 1, 'later')" }
  - query: SELECT id, version, length(body) FROM docs WHERE id = 3
    eventually: 20s
  - assert-status: { dataset: docs }

  - restart: {}
  - query: SELECT id, version, length(body) FROM docs
    eventually: 20s
  - assert-status: { dataset: docs }
