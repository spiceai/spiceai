# Known failing: a federated table of objects in an S3-compatible store keeps
# its listing and object metadata, so an added object is not seen, and after
# objects are replaced reads fail ("not found", "Request precondition failure").
# Move this script to test/spicescript/ once it passes.
name: s3-federated-stale
description: >
  A table of Parquet or CSV part files in an S3-compatible store answers like
  the same rows in a database, federated and accelerated by full refresh into
  Cayenne and DuckDB, after the first load, after a part file is added, and
  after every file is replaced.

sources:
  lake: { kind: rustfs }
  oracle: { kind: postgres }

matrix:
  format: [parquet, csv]

variants:
  federated: {}

spicepod:
  version: v1
  kind: Spicepod
  name: s3-federated-stale
  datasets:
    - from: 's3://${sources.lake.bucket}/facts/'
      name: facts
      params: { $merge: '${sources.lake.params}', file_format: '${matrix.format}' }

defaults:
  expect: { oracle: oracle }
  query-timeout: 30s

steps:
  - generate:
      lake: &facts
        table: facts
        rows: 200000
        seed: 21
        files: 4
        format: '${matrix.format}'
        columns:
          - { name: id, sequence: 1 }
          - { name: grp, int: [1, 200] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: amount, decimal: { range: [0, 1000], scale: 2 } }
          - { name: label, choice: [alpha, beta, gamma, delta] }
          - { name: note, text: [3, 20], nulls: 0.2 }
    mirror: oracle
  - start: {}
  - corpus: ../../corpus/layout.sql

  # Another part file.
  - generate:
      lake:
        <<: *facts
        rows: 20000
        seed: 22
        files: 1
        mode: append
        columns:
          - { name: id, sequence: 1000001 }
          - { name: grp, int: [1, 200] }
          - { name: ts, timestamp: ['2025-01-01', '2025-01-31'] }
          - { name: amount, decimal: { range: [0, 1000], scale: 2 } }
          - { name: label, choice: [alpha, beta, gamma, delta] }
          - { name: note, text: [3, 20], nulls: 0.2 }
    mirror: oracle
  - corpus: ../../corpus/layout.sql
    eventually: 30s

  # Every file replaced with different rows.
  - generate:
      lake:
        <<: *facts
        rows: 150000
        seed: 23
        files: 3
    mirror: oracle
  - corpus: ../../corpus/layout.sql
    eventually: 30s
