# Known failing (#15547): after a refresh removes a document, text_search asked with
# the same SQL text as before still answers with it (for at least 30 s, with
# the SQL and search results caches disabled); the same search worded
# differently answers correctly, as does vector_search with unchanged text.
name: text-search-stale-after-refresh
description: >
  After a refresh, text_search answers from the refreshed rows whatever the
  query's text. (From search.yaml:) Full-text and vector search answer correctly on every acceleration engine:
  text_search returns exactly the rows containing the term, ranked by how often
  it occurs (bodies are the same length), multi-term searches match any term,
  and vector_search ranks as an exact cosine ranking over the stored
  embeddings does. Both follow the source after a refresh that adds and
  removes documents.

sources:
  src: { kind: postgres }

variants:
  search-cache-on: {}
  search-cache-off: { spicepod: { runtime: { caching: { search_results: { enabled: false } } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: search
  embeddings:
    - from: model2vec:minishlab/potion-base-2M
      name: potion
  datasets:
    - from: postgres:public.docs
      name: docs
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
      columns:
        - name: body
          full_text_search: { enabled: true, row_id: [id] }
          embeddings: [{ from: potion, row_id: [id] }]

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: { file: ../../seed/search-postgres.sql }
  - start: { ready-timeout: 300s }

  - query: SELECT id FROM text_search(docs, 'dog')
    oracle-sql: SELECT id FROM docs WHERE dog > 0 AND body IS NOT NULL
  - query: SELECT id FROM vector_search(docs, 'dog') ORDER BY _score DESC, id LIMIT 3
    expect: {}
    id: vbefore
  - source-exec:
      src: DELETE FROM docs WHERE id = 9;
  - refresh: docs
  - query: SELECT count(*) AS n FROM docs WHERE id = 9
    expect: { rows: [['0']] }
    eventually: 30s
  # Same text as before the change.
  - query: SELECT id FROM text_search(docs, 'dog')
    oracle-sql: SELECT id FROM docs WHERE dog > 0 AND body IS NOT NULL
    eventually: 30s
  # Different text, same meaning.
  - query: SELECT id  FROM text_search(docs, 'dog')
    oracle-sql: SELECT id FROM docs WHERE dog > 0 AND body IS NOT NULL
