name: duckdb-types-known
description: >
  The types `duckdb-types-acceleration.yaml` leaves out because some engine or
  protocol cannot carry them yet. An INTERVAL column answers as the DuckDB CLI
  answers over Flight and Flight SQL, but Cayenne and SQLite refuse to
  accelerate it, and HTTP JSON writes it as text (`1.000000000 secs`) that
  does not read back as an interval. SQLite keeps a DECIMAL(20, 4) as a
  double, which rounds 9999999999999999.9999 up past what the column holds
  when read back (#14662).

sources:
  src: { kind: duckdb }

variants:
  federated: {}
  arrow: arrow-memory
  duckdb: duckdb-file
  cayenne: cayenne-file
  sqlite: sqlite-file

spicepod:
  version: v1
  kind: Spicepod
  name: duckdb-types-known
  datasets:
    - from: duckdb:main.iv
      name: iv
      params: ${sources.src.params}
      acceleration:
        enabled: false
    - from: duckdb:main.dec
      name: dec
      params: ${sources.src.params}
      acceleration:
        enabled: false

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }

steps:
  - source-exec:
      src: |
        CREATE TABLE iv (id INTEGER, t_interval INTERVAL);
        INSERT INTO iv VALUES
          (1, INTERVAL '1 second'), (2, INTERVAL '2 seconds'), (3, INTERVAL '0 seconds'), (4, NULL);
        CREATE TABLE dec (id INTEGER, t_decimal_20_4 DECIMAL(20, 4));
        INSERT INTO dec VALUES
          (1, 9999999999999999.9999), (2, -9999999999999999.9999), (3, 0.0000), (4, NULL);
  - source-query:
      src: SELECT id, t_interval FROM iv ORDER BY id
    expect:
      rows:
        - [1, '00:00:01']
        - [2, '00:00:02']
        - [3, '00:00:00']
        - [4, null]
  - source-query:
      src: SELECT id, t_decimal_20_4 FROM dec ORDER BY id
    expect:
      rows: &decimal_20_4
        - [1, '9999999999999999.9999']
        - [2, '-9999999999999999.9999']
        - [3, '0.0000']
        - [4, null]

  # Some accelerations fail to load one dataset; wait only for HTTP, so each
  # dataset's failure is its own query's.
  - start: { ready: false }

  # Each column's Arrow type, as DuckDB exports its SQL type to Arrow.
  - query: >-
      SELECT table_name, column_name, data_type FROM information_schema.columns
      WHERE table_name IN ('iv', 'dec') ORDER BY table_name, ordinal_position
    eventually: 30s
    expect:
      rows:
        - [dec, id, Int32]
        - [dec, 't_decimal_20_4', 'Decimal128(20, 4)']
        - [iv, id, Int32]
        - [iv, t_interval, Interval(MonthDayNano)]

  # The same intervals, written as Arrow parses them.
  - query: SELECT id, t_interval FROM iv ORDER BY id
    protocols: [flight, flightsql]
    eventually: 30s
    expect:
      rows:
        - [1, 1 second]
        - [2, 2 seconds]
        - [3, 0 seconds]
        - [4, null]
  - query: SELECT id, t_interval FROM iv ORDER BY id
    protocols: [flight, http]
    eventually: 30s
  - query: SELECT id, t_decimal_20_4 FROM dec ORDER BY id
    protocols: [flight, flightsql, http]
    eventually: 30s
    expect: { rows: *decimal_20_4 }
