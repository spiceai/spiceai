# Known failing (#15541) where DataFusion runs the query (Arrow, Cayenne): a CASE whose
# first branch is narrower than a later one (INT, then BIGINT) fails with
# "Schema mismatch: … expected Int32, received Int64"; and rank() and
# row_number() are unsigned, so -rank() fails. Sent to DuckDB or PostgreSQL,
# both answer.
name: case-mixed-widths
description: >
  A CASE with branches of different integer widths answers with the wider
  type, and ranking functions can be negated, wherever the query runs.

sources:
  src: { kind: postgres }

variants:
  arrow: arrow
  cayenne: cayenne-file
  duckdb: duckdb
  federated: {}

spicepod:
  version: v1
  kind: Spicepod
  name: case-mixed-widths
  datasets:
    - { from: 'postgres:public.w', name: w, params: '${sources.src.params}' }

defaults:
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: CREATE TABLE w (id int PRIMARY KEY, a int); INSERT INTO w SELECT i, i % 4 FROM generate_series(1, 20) i;
  - start: {}
  # Controls: the wider branch first, and coalesce.
  - query: SELECT id, CASE WHEN id > 10 THEN CAST(a AS BIGINT) * 2 ELSE a END AS c FROM w
  - query: SELECT id, coalesce(a, CAST(id AS BIGINT)) AS c FROM w
  - query: SELECT id, CASE WHEN id > 10 THEN a ELSE a + 1 END AS c FROM w
  - query: SELECT id, CASE WHEN id > 10 THEN a ELSE count(*) OVER (PARTITION BY a) END AS c FROM w
  - query: SELECT id, -rank() OVER (ORDER BY id) AS r FROM w
