# Known failing (#15540): a partitioned Cayenne acceleration with append refresh and a
# primary key but no time_column refuses to load, saying "Append mode requires
# either `time_column` or `primary_key`" though the primary key is set.
name: cayenne-partitioned-append-key-only
description: >
  An append-refreshed Cayenne acceleration with a primary key loads whether
  or not it is partitioned and whether or not it has a time_column.
sources:
  src: { kind: postgres }
variants:
  plain: {}
  partitioned: { datasets: { e: { acceleration: { partition_by: [region] } } } }
  partitioned-with-time: { datasets: { e: { time_column: ts, acceleration: { partition_by: [region] } } } }
spicepod:
  version: v1
  kind: Spicepod
  name: probe
  datasets:
    - from: postgres:public.e
      name: e
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: append, primary_key: id }
defaults:
  compare-variants: false
steps:
  - source-exec:
      src: CREATE TABLE e (id bigint, region text, ts timestamp); INSERT INTO e VALUES (1, 'us', '2026-01-01'), (2, 'eu', '2026-01-02');
  - start: {}
  - query: SELECT count(*) AS n FROM e
    expect: { rows: [['2']] }
