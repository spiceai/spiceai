# Known failing (#15540).
name: postgres-cdc-kill-during-compaction
description: >
  spiced killed while Cayenne is compacting a CDC-fed table loses and
  duplicates nothing: after a restart the table equals the source, and
  compaction commits again. Each run kills at the first moment a compaction
  holds a permit, after a different amount of change. Waits for compaction
  keep writing new data rather than waiting for time, since compaction needs
  new data to trigger. A full refresh killed while it overwrites a table
  leaves it with every row from before or every row from after, never part of
  either. With object-native data (#16133), the files the compactions and the
  overwrite retired are deleted from the state location after the grace.

sources:
  src: { kind: postgres }
  # The state locations of the object-native-data variants.
  lake: { kind: rustfs }
  slow-lake: { kind: rustfs, latency: 20ms }

matrix:
  run: [1, 2, 3, 4, 5]

# The spicepod as written, and the same with the prototype object-native
# Cayenne metastore (`runtime.params.cayenne_vnext`) in place of SQLite, and
# with object-native data in an S3-compatible state location.
variants:
  as-written: federated
  object-native: object-native
  object-native-data-rustfs: object-native-data-rustfs
  object-native-data-rustfs-latency: object-native-data-rustfs-latency

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-kill-during-compaction
  datasets:
    - from: postgres:public.orders
      name: orders
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: changes
        primary_key: o_id
        params:
          # Flush often and compact as soon as two files exist, so a
          # compaction is running most of the time the workload runs.
          cayenne_cdc_mem_tier_max_age_ms: '200'
          cayenne_compaction_trigger_files: '2'
          cayenne_compaction_background_interval_ms: '200'
    # Refreshed in full only when asked: each refresh overwrites the table.
    - from: postgres:public.snap
      name: snap_full
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        params: { cayenne_inline_max_rows: '0' }

defaults:
  expect: { oracle: src }
  # Each variant drives its own source until its own compaction starts, so
  # their rows differ by design; each is checked against its own source instead.
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE orders (o_id bigint PRIMARY KEY, v integer NOT NULL, grp integer NOT NULL, note text);
        INSERT INTO orders SELECT i, i % 1000, i % 97, 'note ' || i FROM generate_series(1, 1000000) AS i;
        CREATE TABLE snap (id bigint PRIMARY KEY, batch integer NOT NULL, payload text NOT NULL);
        INSERT INTO snap SELECT i, 1, repeat('a', 64) FROM generate_series(1, 300000) AS i;
  - start: {}
  - query: SELECT count(*), sum(v), sum(grp) FROM orders
    eventually: 120s

  # A different amount of change per run moves where the kill lands.
  - source-exec:
      src: |
        UPDATE orders SET v = v + ${matrix.run} WHERE o_id % 7 = ${matrix.run};
        DELETE FROM orders WHERE o_id % 101 = ${matrix.run};
        UPDATE orders SET note = NULL WHERE o_id % 13 = ${matrix.run};
        INSERT INTO orders SELECT i, 1, 1, NULL FROM generate_series(2000000, 2000000 + ${matrix.run} * 20000) AS i;
  - wait-metric:
      name: cayenne_compaction_permits_available
      below: { metric: cayenne_compaction_permits_total }
      drive: { src: "UPDATE orders SET v = v + 1 WHERE o_id % 50 = ${round} % 50", every: 1s, rounds: 60 }
  - kill-spiced: { signal: STOP-then-KILL }

  # More change while it is down.
  - source-exec:
      src: UPDATE orders SET grp = grp + 1 WHERE o_id % 11 = 0
  - start: {}
  - query: SELECT count(*), count(DISTINCT o_id), sum(v), sum(grp), count(note) FROM orders
    eventually: 120s
  - query: SELECT * FROM orders WHERE o_id % 997 = 0
    eventually: 30s
  - query: SELECT grp, count(*), sum(v) FROM orders GROUP BY grp
    eventually: 30s

  # Compaction still works afterwards: given enough new data it commits,
  # however long that takes (after a kill the dataset may first be rebuilt).
  - wait-metric:
      name: cayenne_compaction_outcome_total
      labels: { outcome: committed }
      increases: true
      drive: { src: "UPDATE orders SET v = v + 1 WHERE o_id % 50 = ${round} % 50", every: 2s, rounds: 60 }
  - query: SELECT count(*), sum(v), sum(grp) FROM orders
    eventually: 60s

  # A full refresh killed while it overwrites the table: after the restart the
  # dataset holds one whole batch, the one from before or the one from after,
  # and the source's rows once it refreshes again. Whether the kill lands in
  # the middle of the overwrite is not controlled; the load is large enough
  # that it usually does.
  - source-exec:
      src: |
        BEGIN;
        DELETE FROM snap;
        INSERT INTO snap SELECT i, 2, repeat('b', 64) FROM generate_series(1, 300000) AS i;
        COMMIT;
  - refresh: { dataset: snap_full, wait: false }
  - sleep: 500ms
  - kill-spiced: {}
  - start: {}
  - query: SELECT count(DISTINCT batch) AS batches, count(*) AS n, count(DISTINCT id) AS ids FROM snap_full
    expect: { rows: [['1', '300000', '300000']] }
  - refresh: snap_full
  - query: SELECT batch, count(*) AS n FROM snap_full GROUP BY batch
    oracle-sql: SELECT batch, count(*) AS n FROM snap GROUP BY batch

  # What the compactions and the overwrite retired stays for the data-file
  # retention (an hour), so a query on another instance still finds it: the
  # overwritten table holds the files of the batch it replaced beside the
  # current one, and none is deleted early. (Deletion once the retention has
  # passed is covered by the engine's tests, which elapse it.)
  - assert-objects: { source: lake, prefix: state/cayenne/v1/datasets/snap_full-, contains: .vortex, min: 2 }
    eventually: 60s
    only: object-native-data-rustfs
  - assert-objects: { source: slow-lake, prefix: state/cayenne/v1/datasets/snap_full-, contains: .vortex, min: 2 }
    eventually: 60s
    only: object-native-data-rustfs-latency
