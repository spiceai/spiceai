# Known failing (#16141): with the default in-memory CDC tier, a kill under
# load leaves the acceleration with rows that differ from the source; with
# no periodic seal, or with file CDC durability, it does not.
# regression test for #16141
name: postgres-cdc-kill-under-load
description: >
  spiced killed (SIGKILL) again and again while PostgreSQL keeps committing
  inserts, updates and deletes loses and duplicates nothing: once the writes
  stop, a file-mode Cayenne acceleration fed by logical replication
  (refresh_mode: changes) holds exactly the rows the source holds, one per key.
  Each matrix run uses a different id permutation for its updates and deletes.

sources:
  src: { kind: postgres }

matrix:
  run: [1, 2, 3]

variants:
  # Defaults: CDC rows land in the RAM tier, sealed to a durable shadow every 2 s.
  defaults: {}
  # Attribution: no periodic seal, so the source is acknowledged only at checkpoints.
  seal-off:
    datasets: { '*': { acceleration: { params: { cayenne_cdc_mem_tier_seal_age_ms: '0' } } } }
  # Attribution: CDC batches written to files before the source is acknowledged.
  file-durability:
    datasets: { '*': { acceleration: { params: { cayenne_cdc_durability: file } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-kill-under-load
  runtime:
    caching:
      sql_results: { enabled: false }
  datasets:
    - from: postgres:public.cdc_t
      name: cdc_t
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: changes
        primary_key: id

defaults:
  expect: { oracle: src }
  # Each instance drives its own source with timing-dependent writes, so each is
  # checked against its own source rather than against the other variants.
  compare-variants: false

steps:
  # Keep the source's WAL small: the rig's Docker disk is small, and a slot
  # retains WAL until spiced acknowledges it.
  - source-exec:
      src:
        - ALTER SYSTEM SET max_wal_size = '96MB'
        - SELECT pg_reload_conf()
  - source-exec:
      src: |
        CREATE TABLE cdc_t (id bigint PRIMARY KEY, k int NOT NULL, v bigint NOT NULL, seq bigint NOT NULL);
        INSERT INTO cdc_t SELECT g, g % 1000, g, g FROM generate_series(1, 200000) g;
  - start: {}
  - query: SELECT count(*), sum(v), sum(seq) FROM cdc_t
    eventually: 120s

  # Each round is one transaction of 100 row changes: 60 inserts of new keys,
  # 25 updates and 15 deletes, spread over the preloaded keys and the keys
  # inserted by the last few dozen rounds. Rounds may deadlock each other on
  # overlapping keys; Postgres rolls such a round back whole.
  - background:
      id: writes
      concurrency: 4
      source-exec:
        src: >
          BEGIN;
          INSERT INTO cdc_t SELECT 1000000 + ${round}::bigint * 100 + g, g % 1000, g, ${round} FROM generate_series(0, 59) g;
          UPDATE cdc_t SET v = v + 1, seq = ${round} WHERE id IN (SELECT ((${round}::bigint * 25 + g) * 7919 + ${matrix.run}) % 200000 + 1 FROM generate_series(0, 14) g);
          UPDATE cdc_t SET v = v + 1, seq = ${round} WHERE id IN (SELECT 1000000 + (${round}::bigint - 1 - g % 20) * 100 + (g * 7 + ${round}) % 60 FROM generate_series(0, 9) g);
          DELETE FROM cdc_t WHERE id IN (SELECT ((${round}::bigint * 15 + g) * 104729 + ${matrix.run} * 31) % 200000 + 1 FROM generate_series(0, 9) g);
          DELETE FROM cdc_t WHERE id IN (SELECT 1000000 + (${round}::bigint - 2 - g * 3) * 100 + (g * 11 + ${round} * 3) % 60 FROM generate_series(0, 4) g);
          COMMIT;

  # Kill at uneven points of the load and start again on the same data.
  - sleep: 6s
  - kill-spiced: {}
  - start: {}
  - sleep: 3s
  - kill-spiced: {}
  - start: {}
  - sleep: 8s
  - kill-spiced: {}
  - start: {}
  - sleep: 5s
  - kill-spiced: {}
  - start: {}
  - sleep: 11s
  - kill-spiced: {}
  - start: {}
  - sleep: 4s
  - kill-spiced: {}
  - start: {}
  - sleep: 9s
  - kill-spiced: {}
  - start: {}
  - sleep: 6s
  - kill-spiced: {}
  - start: {}
  - sleep: 13s
  - kill-spiced: {}
  - start: {}
  - sleep: 3s
  - kill-spiced: {}
  - start: {}
  - sleep: 7s
  - kill-spiced: {}
  - start: {}
  - sleep: 10s
  - kill-spiced: {}
  - start: {}
  - sleep: 5s
  - stop-background: { id: writes, allow: deadlock detected }

  # Once the writes stop, every row equals the source's, once per key.
  - query: SELECT id, k, v, seq FROM cdc_t
    oracle-sql: SELECT id, k, v, seq FROM cdc_t
    eventually: 120s
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(v) AS sv, sum(seq) AS ss FROM cdc_t
    oracle-sql: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(v) AS sv, sum(seq) AS ss FROM cdc_t
    eventually: 10s

  # The same after a clean restart.
  - restart: {}
  - query: SELECT id, k, v, seq FROM cdc_t
    oracle-sql: SELECT id, k, v, seq FROM cdc_t
    eventually: 60s
