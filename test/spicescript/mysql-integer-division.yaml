name: mysql-integer-division
description: >
  Integer `/` and `%` answer with DataFusion's semantics (truncation toward
  zero, an error on a zero divisor) whether the query is federated to MySQL or
  accelerated into Cayenne, and so does a division by a float literal. The
  MySQL oracle spells the same arithmetic with `DIV`, `MOD` and a DOUBLE
  literal so it shares no semantics with the SQL Spice sends.
sources:
  src: { kind: mysql }
variants:
  federated: {}
  cayenne: cayenne-file
spicepod:
  version: v1
  kind: Spicepod
  name: mysql-integer-division
  datasets:
    - from: mysql:m
      name: m
      params: ${sources.src.params}
    - from: mysql:big
      name: big
      params: ${sources.src.params}
    - from: mysql:overflow
      name: overflow
      params: ${sources.src.params}
defaults:
  expect: { oracle: src }
steps:
  - source-exec:
      src: |
        CREATE TABLE m (id INT PRIMARY KEY, a INT, b INT);
        INSERT INTO m VALUES
          (1, 7, 2), (2, -7, 2), (3, 7, -2), (4, 5, 0), (5, 1, 3),
          (6, NULL, 2), (7, 9, 3), (8, 3, 2);
        CREATE TABLE big (id INT PRIMARY KEY, c BIGINT, k BIGINT, d DECIMAL(10, 2), e DECIMAL(10, 2));
        INSERT INTO big VALUES
          (1, 9223372036854775807, 2, 1.00, 3.00),
          (2, -9223372036854775807, 3, 2.00, 7.00),
          (3, 1000000000000000001, 1000000000000000000, -1.00, 6.00);
        CREATE TABLE overflow (id INT PRIMARY KEY, c BIGINT, k BIGINT);
        INSERT INTO overflow VALUES (1, -9223372036854775808, -1);
  - start: {}
  - query: SELECT id, a / b AS q FROM m WHERE b <> 0 ORDER BY id
    oracle-sql: SELECT id, a DIV b AS q FROM m WHERE b <> 0 ORDER BY id
  - query: SELECT id FROM m WHERE CASE WHEN b <> 0 THEN a / b END > 1 ORDER BY id
    oracle-sql: SELECT id FROM m WHERE CASE WHEN b <> 0 THEN a DIV b END > 1 ORDER BY id
  - query: SELECT id, a / b / 3.0 * 100 AS dev FROM m WHERE b <> 0 ORDER BY id
    oracle-sql: SELECT id, (a DIV b) / 3.0E0 * 100 AS dev FROM m WHERE b <> 0 ORDER BY id
  - query: SELECT id, a / 30000.0 AS f FROM m ORDER BY id
    oracle-sql: SELECT id, a / 30000.0E0 AS f FROM m ORDER BY id
  - query: SELECT id, a % b AS r FROM m WHERE b <> 0 ORDER BY id
    oracle-sql: SELECT id, MOD(a, b) AS r FROM m WHERE b <> 0 ORDER BY id
  - query: SELECT id, a / b AS q FROM m WHERE id = 4
    expect-error: true
  - query: SELECT id, a % b AS r FROM m WHERE id = 4
    expect-error: true
  # TPC-DS q34 and q73's shape: a guarded divisor, compared to a fraction.
  - query: SELECT id FROM m WHERE CASE WHEN b > 0 THEN a / b ELSE NULL END > 1.2 ORDER BY id
    oracle-sql: SELECT id FROM m WHERE CASE WHEN b > 0 THEN a DIV b ELSE NULL END > 1.2E0 ORDER BY id
  - query: SELECT id, a / -1 AS q, a % -1 AS r FROM m ORDER BY id
    oracle-sql: SELECT id, a DIV -1 AS q, MOD(a, -1) AS r FROM m ORDER BY id
  - query: SELECT id, c / k AS q, c % k AS r FROM big ORDER BY id
    oracle-sql: SELECT id, c DIV k AS q, MOD(c, k) AS r FROM big ORDER BY id
  - query: SELECT id FROM big WHERE c / k > 1 ORDER BY id
    oracle-sql: SELECT id FROM big WHERE c DIV k > 1 ORDER BY id
  # i64::MIN / -1 overflows.
  - query: SELECT id, c / k AS q FROM overflow
    expect-error: true
  # A decimal quotient truncates at its scale; MySQL's `/` rounds the last
  # digit. The text cast compares every digit, which the comparator's float
  # tolerance would not.
  - query: SELECT id, CAST(d / e AS VARCHAR) AS q FROM big ORDER BY id
    oracle-sql: SELECT id, CAST(TRUNCATE(CAST(d AS DECIMAL(30, 10)) / e, 6) AS CHAR) AS q FROM big ORDER BY id
  # A literal divisor that is neither 0 nor -1 is pushed, as `DIV`.
  - explain: SELECT id, a / 2 AS q, a % 2 AS r FROM m
    contains: [VirtualExecutionPlan, "(`m`.`a` DIV 2)", "(`m`.`a` % 2)"]
    only: federated
  - explain: SELECT id, a / 30000.0 AS f FROM m
    contains: [VirtualExecutionPlan, "/ 3E4)"]
    only: federated
  # A column divisor might be zero, so the division stays local.
  - explain: SELECT id FROM m WHERE CASE WHEN b > 0 THEN a / b ELSE NULL END > 1.2
    contains: [VirtualExecutionPlan]
    omits: ["`m`.`a` / `m`.`b`", "`m`.`a` DIV `m`.`b`"]
    only: federated
  - explain: SELECT id, d / e AS q FROM big
    contains: [VirtualExecutionPlan]
    omits: ["`big`.`d` / `big`.`e`"]
    only: federated
