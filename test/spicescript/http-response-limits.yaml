name: http-response-limits
duration: 129s
description: >
  A response an HTTP API returns is held to the query memory limit, by its
  size once decompressed. An HTTP dataset whose response is larger than
  `runtime.query.memory_limit` fails the query with an error that names the
  dataset and the setting to raise, while a response that fits is read. A
  GraphQL dataset reads a gzip response like any other, and one whose gzip
  body decodes past the limit fails to load with an error that names the
  limit, instead of being decoded into memory. Likewise a gzip JSON document,
  which schema inference parses whole: a small one loads, and one that
  decodes past the limit fails to load with an error naming the file. With
  room in the limit, an input that expands far past what real data in its
  codec compresses to (400:1 for gzip, 2,000:1 for zstd, past 64 MiB) is
  refused as a compression bomb, an HTTP response, a GraphQL response and a
  JSON file alike, while telemetry that zstd compresses past 100:1 loads in
  full.

sources:
  api: { kind: mock-http }

spicepod:
  version: v1
  kind: Spicepod
  name: http-response-limits
  runtime:
    query:
      memory_limit: 64MiB
  datasets:
    - from: ${sources.api.url}/v1
      name: api
      params: { file_format: json, allowed_request_paths: '/*', max_retries: '0', response_cache_max_size_bytes: '0' }
    - from: graphql:${sources.api.url}/graphql-ok
      name: gql_ok
      params: { graphql_query: 'query { items { id } }', json_pointer: /data/items }
    - from: graphql:${sources.api.url}/graphql-bomb
      name: gql_bomb
      params: { graphql_query: 'query { items { id } }', json_pointer: /data/items }
    - from: ${sources.api.url}/files/small.json.gz
      name: doc_small
      params: &doc { file_format: json, json_format: object, file_compression_type: GZIP }
    - from: ${sources.api.url}/files/large.json.gz
      name: doc_large
      params: *doc
    - from: graphql:${sources.api.url}/graphql-zbomb
      name: gql_zbomb
      params: { graphql_query: 'query { items { id } }', json_pointer: /data/items }
    - from: ${sources.api.url}/files/bomb.json.gz
      name: doc_bomb
      params: *doc

steps:
  - source-exec:
      api:
        - "{ path: /v1/small, headers: { content-type: application/json }, body: '[{\"k\": \"a\"}]' }"
        # 128 MiB, twice the query memory limit.
        - "{ path: /v1/large, headers: { content-type: application/x-ndjson }, body: \"{\\\"k\\\":\\\"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\\\"}\\n\", repeat: 2097152 }"
        - "{ path: /graphql-ok, method: POST, headers: { content-type: application/json }, body: '{\"data\": {\"items\": [{\"id\": 1}, {\"id\": 2}]}}', encoding: gzip }"
        # A few MiB on the wire that decode to 160 MiB, past the limit.
        - "{ path: /graphql-bomb, method: POST, headers: { content-type: application/json }, body: '{\"a\":\"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\"}', repeat: 4194304, encoding: gzip }"
        - "{ path: /files/small.json.gz, body: '{\"a\": 1, \"b\": \"x\"}', encoding: gzip }"
        # A few MiB that decode to 160 MiB: the document is read whole to infer its schema.
        - "{ path: /files/large.json.gz, body: '{\"a\": 1, \"b\": \"xxxxxxxxxxxxxxxxxxxxxxxxx\"}', repeat: 4194304, encoding: gzip }"
  - start: { ready: false }

  # A response that fits the query memory limit is read.
  - query: SELECT content FROM api WHERE request_path = '/small'
    expect: { rows: [['{"k":"a"}']] }
    eventually: 60s

  # One larger than the limit fails the query, naming the dataset and the fix, and is
  # not asked for again.
  - query: SELECT count(*) FROM api WHERE request_path = '/large'
    expect-error: "for dataset 'api': holding the decoded data would pass the query memory limit"
  - query: SELECT count(*) FROM api WHERE request_path = '/large'
    expect-error: "Raise `runtime.query.memory_limit`"
  - source-query: { api: count /v1/large }
    expect: { rows: [['2']] }

  # A gzip GraphQL response is decoded by the connector and read.
  - query: SELECT id FROM gql_ok ORDER BY id
    expect: { rows: [['1'], ['2']] }
    eventually: 60s

  # A gzip body that decodes past the limit is refused at registration.
  - assert-status:
      dataset: gql_bomb
      status: Error
      message-contains: "holding the decoded data would pass the query memory limit"
    eventually: 60s

  # A gzip JSON document that fits is inferred and read; one that decodes past the limit
  # is refused while it is decompressed, naming the file.
  - query: SELECT a, b FROM doc_small
    expect: { rows: [['1', 'x']] }
    eventually: 60s
  - assert-status:
      dataset: doc_large
      status: Error
      message-contains: "large.json.gz' for dataset 'doc_large': holding the decoded data would pass the query memory limit"
    eventually: 60s

  # Past 64 MiB decoded, an input that expands far past what real data in its codec
  # compresses to is refused as a compression bomb, before the memory limit is reached;
  # real data that compresses well loads in full.
  - source-exec:
      api:
        # 72 MiB of one byte, past the 64 MiB floor: about 1,000:1 under gzip, tens of thousands
        # to one under zstd.
        - "{ path: /v1/bomb-gzip, body: 'a', repeat: 75497472, encoding: gzip }"
        - "{ path: /v1/bomb-zstd, body: 'a', repeat: 75497472, encoding: zstd }"
        - "{ path: /graphql-zbomb, method: POST, headers: { content-type: application/json }, body: 'a', repeat: 75497472, encoding: zstd }"
        - "{ path: /files/bomb.json.gz, body: 'a', repeat: 75497472, encoding: gzip }"
        # Telemetry lines, about 70 MiB, past the floor: about 135:1 under zstd's default
        # level, past the 100:1 a single threshold once refused, and 44:1 under gzip.
        - "{ path: /v1/telemetry-zstd, headers: { content-type: application/x-ndjson }, body: \"{\\\"ts\\\":\\\"2026-01-01T00:00:00.{i}Z\\\",\\\"level\\\":\\\"INFO\\\",\\\"service\\\":\\\"checkout\\\",\\\"host\\\":\\\"web-01\\\",\\\"msg\\\":\\\"heartbeat ok\\\",\\\"status\\\":200}\\n\", repeat: 600000, encoding: zstd }"
        - "{ path: /v1/telemetry-gzip, headers: { content-type: application/x-ndjson }, body: \"{\\\"ts\\\":\\\"2026-01-01T00:00:00.{i}Z\\\",\\\"level\\\":\\\"INFO\\\",\\\"service\\\":\\\"checkout\\\",\\\"host\\\":\\\"web-01\\\",\\\"msg\\\":\\\"heartbeat ok\\\",\\\"status\\\":200}\\n\", repeat: 600000, encoding: gzip }"
  - restart:
      ready: false
      patch: { spicepod: { runtime: { query: { memory_limit: 2GiB } } } }
  - query: SELECT count(*) FROM api WHERE request_path = '/bomb-gzip'
    expect-error: "for dataset 'api': the gzip-compressed response expanded more than 400:1"
    eventually: 60s
  - query: SELECT count(*) FROM api WHERE request_path = '/bomb-zstd'
    expect-error: "the zstd-compressed response expanded more than 2,000:1"
  - query: SELECT count(*) FROM api WHERE request_path = '/bomb-zstd'
    expect-error: "far past what real data compresses to, so it was refused as a compression bomb. If the data is genuine, have the origin serve it uncompressed or at a lower compression level. See: https://spiceai.org/docs/components/data-connectors/https"
  - http:
      path: /v1/sql
      method: POST
      headers: { content-type: text/plain }
      body: SELECT count(*) FROM api WHERE request_path = '/bomb-zstd'
    expect:
      status: 422
      json:
        - { pointer: /error, matches: "for dataset 'api': the zstd-compressed response expanded more than 2,000:1 .*refused as a compression bomb" }
        - { pointer: /error, matches: "memory_limit", count: 0 }
  - query: SELECT count(*) FROM api WHERE request_path = '/telemetry-zstd'
    expect: { rows: [['600000']] }
  - query: SELECT count(*) FROM api WHERE request_path = '/telemetry-gzip'
    expect: { rows: [['600000']] }
  - assert-status:
      dataset: gql_zbomb
      status: Error
      message-contains: "for dataset 'gql_zbomb': the zstd-compressed response expanded more than 2,000:1"
    eventually: 60s
  - assert-status:
      dataset: doc_bomb
      status: Error
      message-contains: "bomb.json.gz' for dataset 'doc_bomb': the gzip-compressed file expanded more than 400:1"
    eventually: 60s
