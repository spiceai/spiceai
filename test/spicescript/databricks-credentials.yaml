name: databricks-credentials
description: >
  A Databricks dataset or model with a workload identity federation mistake
  fails to load with one message naming the param to fix: a federation param
  without a client ID, a token file beside a token, or an audience beside a
  token file, which carries its own. None of them reaches a network: each is a
  configuration error raised before any exchange.

spicepod:
  version: v1
  kind: Spicepod
  name: databricks-credentials
  datasets:
    - from: databricks:main.default.no_client
      name: dataset_no_client
      params:
        mode: sql_warehouse
        databricks_endpoint: dbc-example.cloud.databricks.com
        databricks_sql_warehouse_id: warehouse
        databricks_oidc_token_filepath: '${instance.dir}/identity-token'
    - from: databricks:main.default.token_and_federation
      name: dataset_token_and_federation
      params:
        mode: sql_warehouse
        databricks_endpoint: dbc-example.cloud.databricks.com
        databricks_sql_warehouse_id: warehouse
        databricks_client_id: 00000000-0000-0000-0000-000000000001
        databricks_token: not-a-token
        databricks_oidc_token_filepath: '${instance.dir}/identity-token'
  models:
    - from: databricks:endpoint
      name: model_no_client
      params:
        databricks_endpoint: dbc-example.cloud.databricks.com
        databricks_token_audience: account
    - from: databricks:endpoint
      name: model_audience_and_file
      params:
        databricks_endpoint: dbc-example.cloud.databricks.com
        databricks_client_id: 00000000-0000-0000-0000-000000000001
        databricks_oidc_token_filepath: '${instance.dir}/identity-token'
        databricks_token_audience: custom
steps:
  - start: { ready: false }
  - assert-log:
      count:
        "Invalid configuration: Workload identity federation needs `databricks_client_id`": 1
        "A Databricks component authenticates with either `databricks_token` or workload identity federation \\(`databricks_oidc_token_filepath`\\), and both are set": 1
        "WARN .*Invalid value for parameter databricks_client_id\\. Workload identity federation needs `databricks_client_id`": 1
        "WARN .*Invalid value for parameter databricks_token_audience\\. `databricks_token_audience` applies only to an identity token Spice requests from GitHub Actions": 1
      lacks: ["oidc/v1/token"]
    eventually: 60s
