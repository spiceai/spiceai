name: query-coverage
description: >
  An extended corpus (window functions, CTEs, set operations, outer and self
  joins, grouping sets, casts, dates, strings, NULL semantics, aggregates,
  ordering, arithmetic, subqueries) answers through Spice as PostgreSQL
  answers it over the same generated rows: federated to PostgreSQL and MySQL,
  and accelerated into each engine.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql]

variants:
  federated: {}
  cayenne: cayenne-file
  duckdb: duckdb-file
  sqlite: sqlite-file
  arrow: arrow

spicepod:
  version: v1
  kind: Spicepod
  name: query-coverage
  datasets:
    - from: '${matrix.backend}:t'
      name: t
      params: ${sources.backend.params}
    - from: '${matrix.backend}:u'
      name: u
      params: ${sources.backend.params}

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }
  # Every answer also comes back over HTTP as JSON, the same as over Flight.
  also-http: true
  expect: { oracle: ref }
  # Each answer is checked against the reference; the variants' answers to
  # one another add nothing but a second report of the same mismatch.
  compare-variants: false

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - corpus: corpus/queries-extended.sql
