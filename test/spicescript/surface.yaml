name: surface
description: >
  Query surface beyond the extended corpus answers through Spice as PostgreSQL
  answers it over the same rows, federated and on every acceleration engine:
  time zones and daylight-saving changes, JSON, arrays and UNNEST, recursive
  CTEs, large IN lists, math, strings, conditionals, window frames, grouping
  sets, LATERAL and quantified subqueries.

sources:
  src: { kind: postgres }

variants:
  federated: {}
  cayenne-memory: cayenne-memory
  cayenne: cayenne-file
  # `cayenne` with the prototype object-native Cayenne metastore.
  cayenne-object-native: cayenne-file-object-native

spicepod:
  version: v1
  kind: Spicepod
  name: surface
  datasets:
    - { from: 'postgres:public.ev', name: ev, params: '${sources.src.params}' }
    - { from: 'postgres:public.edges', name: edges, params: '${sources.src.params}' }

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  also-http: true
  compare-variants: false

steps:
  - source-exec:
      src: { file: seed/surface-postgres.sql }
  - start: {}
  - corpus: corpus/surface.sql
  # A plan with an UNNEST: a cross join keeps every pair and a join can read
  # the unnested column.
  - query: SELECT count(*) AS n FROM ev a CROSS JOIN (SELECT * FROM unnest(range(0, 100))) b
    oracle-sql: SELECT count(*) AS n FROM ev a CROSS JOIN generate_series(0, 99) b
  - query: SELECT a.id, b.x FROM ev a JOIN (SELECT unnest([1, 2, 3]) AS x) b ON a.id = b.x
    oracle-sql: SELECT a.id, b.x FROM ev a JOIN unnest(ARRAY[1, 2, 3]) AS b(x) ON a.id = b.x
  - query: SELECT id FROM ev WHERE id IN (SELECT unnest([1, 2, 3]))
    oracle-sql: SELECT id FROM ev WHERE id IN (SELECT unnest(ARRAY[1, 2, 3]))
