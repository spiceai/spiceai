name: cayenne-vnext-recreate
description: >
  Under `runtime.params.cayenne_vnext: enabled`, recreating one dataset never
  deletes the object-native metastore that holds every dataset. With
  `runtime.state.location` inside dataset a's data directory, a `mode:
  file_create` load that would recreate a is refused with a message naming the state location, and dataset
  b keeps its catalog: after a restart it is reopened, not created again, and
  its answers still match the PostgreSQL source.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext-recreate
  runtime:
    params: { cayenne_vnext: enabled }
    state: { location: 'file://${instance.dir}/data/a_ds/state' }
  datasets:
    - from: postgres:public.a_ds
      name: a_ds
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        params: { cayenne_file_path: '${instance.dir}/data', cayenne_metadata_dir: '${instance.dir}/meta' }
    - from: postgres:public.b_ds
      name: b_ds
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        params: { cayenne_file_path: '${instance.dir}/data', cayenne_metadata_dir: '${instance.dir}/meta' }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE a_ds (id integer PRIMARY KEY, v text);
        INSERT INTO a_ds SELECT i, 'a' || i FROM generate_series(1, 1000) AS i;
        CREATE TABLE b_ds (id integer PRIMARY KEY, v text);
        INSERT INTO b_ds SELECT i, 'b' || i FROM generate_series(1, 2000) AS i;
  - start: {}
  - query: SELECT * FROM a_ds
    eventually: 60s
  - query: SELECT * FROM b_ds
    eventually: 60s
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1 } }

  # `mode: file_create` deletes a's data directory on every load: refused,
  # because the metastore lives there.
  - restart:
      ready: false
      patch: { datasets: { a_ds: { acceleration: { mode: file_create } } } }
  - assert-status: { dataset: a_ds, status: Error, message-contains: 'Set `runtime.state.location` to a directory outside' }
    eventually: 60s
  - query: SELECT * FROM b_ds
    eventually: 60s

  # b's catalog survived: a restart reopens it rather than creating a new one.
  - restart:
      patch: { datasets: { a_ds: { acceleration: { mode: file } } } }
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1 } }
  - query: SELECT * FROM b_ds
    eventually: 60s
  - query: SELECT * FROM a_ds
    eventually: 60s
