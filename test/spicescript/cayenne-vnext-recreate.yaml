name: cayenne-vnext-recreate
description: >
  Under `runtime.params.cayenne_vnext: enabled`, recreating one dataset can
  never delete the object-native metastore that holds every dataset. With
  `runtime.state.location` inside dataset a's data directory, where a recreate
  of a would delete it, a is refused when it is configured, with a message
  naming the state location, and dataset b keeps its catalog: after a restart
  it is reopened, not created again, and its answers still match the
  PostgreSQL source. With the flag disabled, a loads as it did before the
  flag existed.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext-recreate
  runtime:
    params: { cayenne_vnext: enabled }
    state: { location: 'file://${instance.dir}/data/a_ds/state' }
  datasets:
    - from: postgres:public.a_ds
      name: a_ds
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        params: { cayenne_file_path: '${instance.dir}/data', cayenne_metadata_dir: '${instance.dir}/meta' }
    - from: postgres:public.b_ds
      name: b_ds
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        params: { cayenne_file_path: '${instance.dir}/data', cayenne_metadata_dir: '${instance.dir}/meta' }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE a_ds (id integer PRIMARY KEY, v text);
        INSERT INTO a_ds SELECT i, 'a' || i FROM generate_series(1, 1000) AS i;
        CREATE TABLE b_ds (id integer PRIMARY KEY, v text);
        INSERT INTO b_ds SELECT i, 'b' || i FROM generate_series(1, 2000) AS i;
  - start: { ready: false }
  - assert-status: { dataset: a_ds, status: Error, message-contains: 'Set `runtime.state.location` to a directory outside' }
    eventually: 60s
  - query: SELECT * FROM b_ds
    eventually: 60s
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1 } }

  # A load that recreates a's acceleration is refused the same way.
  - restart:
      ready: false
      patch: { datasets: { a_ds: { acceleration: { mode: file_create } } } }
  - assert-status: { dataset: a_ds, status: Error, message-contains: 'Set `runtime.state.location` to a directory outside' }
    eventually: 60s

  # b's catalog survived: the restart reopened it rather than creating a new one.
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1, 'Opened the Cayenne object-native metastore': '>=1' } }
  - query: SELECT * FROM b_ds
    eventually: 60s

  # With the flag disabled the state location is not a metastore, so nothing is
  # refused: a loads on SQLite as it did before the flag existed.
  - restart:
      patch: { spicepod: { runtime: { params: { cayenne_vnext: disabled } } }, datasets: { a_ds: { acceleration: { mode: file } } } }
  - query: SELECT * FROM a_ds
    eventually: 60s
  - query: SELECT * FROM b_ds
    eventually: 60s
