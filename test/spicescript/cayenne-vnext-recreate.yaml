name: cayenne-vnext-recreate
description: >
  Upgrades two Cayenne datasets from SQLite to `runtime.params.cayenne_vnext`
  with a `mode: file_create` start, then recreates one of them. Each recreate
  reloads only the dataset being recreated: the other keeps its data, and the
  object-native metastore is created once and never deleted.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-vnext-recreate
  runtime:
    params: { cayenne_vnext: disabled }
  datasets:
    - from: postgres:public.a_ds
      name: a_ds
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }
    # `refresh_on_startup: auto` (the default) keeps b_ds's data on restart
    # instead of reloading it, so a reload would show in its answer.
    - from: postgres:public.b_ds
      name: b_ds
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE a_ds (id integer PRIMARY KEY, v text);
        INSERT INTO a_ds SELECT i, 'a' || i FROM generate_series(1, 1000) AS i;
        CREATE TABLE b_ds (id integer PRIMARY KEY, v text);
        INSERT INTO b_ds SELECT i, 'b' || i FROM generate_series(1, 2000) AS i;

  # Flag off: both datasets are on SQLite.
  - start: {}
  - query: SELECT * FROM a_ds
  - query: SELECT * FROM b_ds
  - assert-files: { contains: ['(^|/)\.spice/data/metadata/cayenne\.db$', '(^|/)\.spice/data/b_ds/.*\.vortex$'], lacks: ['(^|/)cayenne/v1/catalog/head$'] }

  # Flag on: both datasets are refused with the fix, and their data is kept.
  - restart:
      ready: false
      patch: { spicepod: { runtime: { params: { cayenne_vnext: enabled } } } }
  - assert-status: { dataset: a_ds, status: Error, message-contains: "Dataset 'a_ds' is accelerated in the SQLite Cayenne metastore, but `runtime.params.cayenne_vnext` is enabled" }
    eventually: 60s
  - assert-status: { dataset: b_ds, status: Error, message-contains: "or start it once with `acceleration.mode: file_create`" }
    eventually: 60s
  - assert-files: { contains: ['(^|/)\.spice/data/b_ds/.*\.vortex$'] }

  # Upgrade: one `mode: file_create` start reloads both from the source into
  # the object-native metastore.
  - source-exec: { src: "UPDATE a_ds SET v = 'moved' WHERE id % 3 = 0; UPDATE b_ds SET v = 'moved' WHERE id % 7 = 0" }
  - restart:
      patch: { datasets: { a_ds: { acceleration: { mode: file_create } }, b_ds: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM a_ds
    eventually: 60s
  - query: SELECT * FROM b_ds
    eventually: 60s
  - assert-files: { contains: ['(^|/)\.spice/data/cayenne/v1/catalog/head$', '(^|/)\.spice/data/cayenne/v1/datasets/b_ds-[^/]+/data/.*\.vortex$'], lacks: ['(^|/)\.spice/data/b_ds/.*\.vortex$'] }
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1, 'Deleted the acceleration data directory': 2 } }

  # Back to `mode: file`: the restart reopens the metastore and keeps the data.
  - restart:
      patch: { datasets: { a_ds: { acceleration: { mode: file } }, b_ds: { acceleration: { mode: file } } } }
  - query: SELECT * FROM a_ds
    eventually: 60s
  - query: SELECT * FROM b_ds
    id: b_upgraded
    eventually: 60s
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1, 'Opened the Cayenne object-native metastore': '>=1' } }

  # Recreate a_ds only: a_ds reloads, b_ds keeps its data, the metastore is
  # not recreated, and no local directory is deleted.
  - source-exec: { src: "UPDATE a_ds SET v = 'recreated' WHERE id % 5 = 0; UPDATE b_ds SET v = 'not reloaded' WHERE id % 5 = 0" }
  - restart:
      patch: { datasets: { a_ds: { acceleration: { mode: file_create } } } }
  - query: SELECT * FROM a_ds
    eventually: 60s
  - query: SELECT * FROM b_ds
    expect: { same-as: b_upgraded }
  - assert-log: { count: { 'Created the Cayenne object-native metastore': 1, 'Deleted the acceleration data directory': 2 } }

  # b_ds still refreshes from its source.
  - refresh: b_ds
  - query: SELECT * FROM b_ds
