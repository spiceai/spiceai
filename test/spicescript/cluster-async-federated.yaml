name: cluster-async-federated
description: >
  A scheduler with two executors answers asynchronous `/v1/queries` jobs over
  federated PostgreSQL tables as PostgreSQL does, each job run by an executor:
  scans, filters, aggregates, sorts, and joins PostgreSQL runs whole. The
  results cache is off, so no job is answered without running.
  (cluster-executors.yaml checks the synchronous answers; an asynchronous job
  over an accelerated dataset is refused by design. A federated subquery:
  known-failing/cluster-sql/cluster-async-federated-subquery.yaml.)

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cluster-async-federated
  runtime:
    caching: { sql_results: { enabled: false } }
  datasets:
    - { from: 'postgres:t', name: t, params: '${sources.src.params}' }
    - { from: 'postgres:u', name: u, params: '${sources.src.params}' }

defaults:
  cluster: { executors: 2 }
  also-async: true
  expect: { oracle: src }

steps:
  - generate:
      src:
        table: t
        rows: 5000
        seed: 41
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: s, choice: [apple, banana, cherry], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
  - generate:
      src:
        table: u
        rows: 800
        seed: 42
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 5200] }
          - { name: label, choice: [red, blue, green] }
  - start: {}
  # corpus/cluster.sql without its subquery.
  - query: SELECT id, i, d, s, dt FROM t
  - query: SELECT count(*) AS n, sum(i) AS si, sum(d) AS sd, min(dt) AS lo, max(dt) AS hi FROM t
  - query: SELECT s, count(*) AS n, avg(d) AS ad FROM t GROUP BY s
  - query: SELECT id FROM t WHERE i > 40 AND s = 'apple'
  - query: SELECT t.id, u.label FROM t JOIN u ON t.id = u.t_id WHERE u.label = 'red'
  - query: SELECT u.label, count(*) AS n, sum(t.d) AS sd FROM t JOIN u ON t.id = u.t_id GROUP BY u.label
  - query: SELECT id, d FROM t ORDER BY d DESC NULLS LAST, id LIMIT 10
  - query: SELECT dt, count(*) AS n FROM t GROUP BY dt ORDER BY n DESC, dt LIMIT 5
  - query: SELECT count(DISTINCT s) AS ns, count(DISTINCT dt) AS nd FROM t
