name: federation-matrix
description: >
  The pushdown and SQL-semantics corpora answer the same through Spice
  whichever database a table federates to, PostgreSQL, MySQL, ClickHouse,
  DuckDB or DuckLake: each backend receives the query rewritten in its own
  dialect, and every answer is checked against one reference, PostgreSQL
  holding the same generated rows, so one corpus in one dialect covers every
  backend. Integer division by zero and overflow fail with DataFusion's errors
  on every backend. DuckDB is read through both the duckdb connector and the
  ADBC connector with the DuckDB driver.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql, clickhouse, duckdb, ducklake]

variants:
  # Keep the existing instance name and ledger identity for other backends.
  default: federated
  adbc:
    when: { backend: duckdb }
    datasets:
      t:
        from: adbc:t
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      u:
        from: adbc:u
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      w:
        from: adbc:w
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      edge:
        from: adbc:edge
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      q:
        from: adbc:q
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null

spicepod:
  version: v1
  kind: Spicepod
  name: federation-matrix
  datasets:
    - from: '${matrix.backend}:t'
      name: t
      params: ${sources.backend.params}
    - from: '${matrix.backend}:u'
      name: u
      params: ${sources.backend.params}
    - from: '${matrix.backend}:w'
      name: w
      params: ${sources.backend.params}
    - from: '${matrix.backend}:edge'
      name: edge
      params: ${sources.backend.params}
    - from: '${matrix.backend}:q'
      name: q
      params: ${sources.backend.params}

defaults:
  expect: { oracle: ref }

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  # Arithmetic and statistics: `g` leaves some groups with one row, `k` is
  # sometimes zero, and `e` never is.
  - generate:
      backend:
        table: w
        rows: 300
        seed: 33
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: g, int: [1, 150] }
          - { name: a, int: [-100, 100], nulls: 0.1 }
          - { name: k, int: [-9, 9] }
          - { name: c, bigint: [-9223372036854775807, 9223372036854775807] }
          - { name: x, float: [0, 50], nulls: 0.1 }
          - { name: dd, decimal: { range: [-100, 100], scale: 2 } }
          - { name: e, decimal: { range: [1, 9], scale: 2 } }
    mirror: ref
  - generate:
      backend:
        table: edge
        rows: 1
        seed: 34
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: c, bigint: [-9223372036854775808, -9223372036854775808] }
          - { name: k, bigint: [-1, -1] }
    mirror: ref
  # Decimals on a 0.01 grid, so float constants such as `0.06 + 0.01` land on
  # stored values.
  - generate:
      backend:
        table: q
        rows: 200
        seed: 35
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: disc, decimal: { range: [0, 0.1], scale: 2 }, nulls: 0.1 }
          - { name: f, float: [0, 0.1] }
    mirror: ref
  - start: {}
  - corpus: corpus/pushdown.sql
  - corpus: corpus/sql-semantics.sql
  # A zero divisor and i64::MIN / -1 fail, where MySQL would answer NULL: Spice
  # computes them with DataFusion's errors, or PostgreSQL and ClickHouse raise
  # their own.
  - query: SELECT id, a / k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: Divide by zero
    when: { backend: [mysql, duckdb, ducklake] }
  - query: SELECT id, a % k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: Divide by zero
    when: { backend: [mysql, duckdb, ducklake] }
  - query: SELECT id, c / k FROM edge
    expect-error: 'Overflow happened on: -9223372036854775808 / -1'
    when: { backend: [mysql, duckdb, ducklake] }
  - query: SELECT id, a / k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: 'DB::Exception: Division by zero'
    when: { backend: clickhouse }
  - query: SELECT id, a % k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: 'DB::Exception: Division by zero'
    when: { backend: clickhouse }
  - query: SELECT id, c / k FROM edge
    expect-error: 'DB::Exception: Division of minimal signed number by minus one'
    when: { backend: clickhouse }
  - query: SELECT id, a / k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: 'ERROR: division by zero'
    when: { backend: postgres }
  - query: SELECT id, a % k FROM w WHERE k = 0 AND a IS NOT NULL
    expect-error: 'ERROR: division by zero'
    when: { backend: postgres }
  - query: SELECT id, c / k FROM edge
    expect-error: 'ERROR: bigint out of range'
    when: { backend: postgres }
  # MySQL reads `||` as OR, divides integers exactly with `/`, and reads
  # `30000.0` as a DECIMAL, so it is sent CONCAT, DIV and a float literal.
  - explain: SELECT id, s || '!' FROM t
    contains: [VirtualExecutionPlan, "CONCAT(`t`.`s`, '!')"]
    when: { backend: mysql }
  - explain: SELECT id, a / 2, a % 2, a / 30000.0 FROM w
    contains: [VirtualExecutionPlan, "(`w`.`a` DIV 2)", "(`w`.`a` % 2)", "/ 3E4)"]
    when: { backend: mysql }
  # A float constant compared with a decimal is sent as the decimal DataFusion
  # compares it as, which MySQL does not read as a DOUBLE; a float column
  # compared with a decimal stays local on MySQL, which compares them as DOUBLE.
  - explain: SELECT id FROM q WHERE disc BETWEEN 0.06 - 0.01 AND 0.06 + 0.01
    contains: [VirtualExecutionPlan, "BETWEEN 0.050000000000000 AND 0.070000000000000"]
    when: { backend: mysql }
  - explain: SELECT id FROM q WHERE disc < f
    contains: [VirtualExecutionPlan]
    omits: ["`q`.`disc` < `q`.`f`"]
    when: { backend: mysql }
  # A divisor that might be zero, or a decimal division, stays local on MySQL:
  # MySQL answers NULL for a zero divisor and rounds a decimal quotient.
  - explain: SELECT id FROM w WHERE CASE WHEN k > 0 THEN a / k ELSE NULL END > 1.2
    contains: [VirtualExecutionPlan]
    omits: ["`w`.`a` / `w`.`k`", "`w`.`a` DIV `w`.`k`"]
    when: { backend: mysql }
  - explain: SELECT id, dd / e FROM w
    contains: [VirtualExecutionPlan]
    omits: ["`w`.`dd` / `w`.`e`"]
    when: { backend: mysql }
  # Sample figures are sent under their standard names.
  - explain: SELECT g, stddev(x), var_samp(x) FROM w GROUP BY g
    contains: [VirtualExecutionPlan, "stddev_samp(", "var_samp("]
    when: { backend: [postgres, mysql, duckdb, ducklake] }
  - explain: SELECT id, stddev(x) OVER (PARTITION BY g) FROM w
    contains: [VirtualExecutionPlan, "stddev_samp(", ") OVER ("]
    when: { backend: [postgres, mysql, duckdb, ducklake] }
  # MySQL takes DISTINCT only in COUNT, SUM, AVG, MIN and MAX.
  - explain: SELECT g, stddev(DISTINCT x) FROM w GROUP BY g
    contains: [VirtualExecutionPlan]
    omits: ["(DISTINCT `"]
    when: { backend: mysql }
  - explain: SELECT g, stddev(DISTINCT x) FROM w GROUP BY g
    contains: [VirtualExecutionPlan, "stddev_samp(DISTINCT "]
    when: { backend: postgres }
  # So Spice computes `bit_xor(DISTINCT a)` beside a second DISTINCT argument,
  # and keeps the DISTINCT rather than rewriting it into a GROUP BY.
  - explain: SELECT g, bit_xor(DISTINCT a), count(DISTINCT k), sum(DISTINCT a) FROM w GROUP BY g
    contains: [VirtualExecutionPlan, "bit_xor(DISTINCT w.a)"]
    when: { backend: mysql }
  # Neither MySQL nor PostgreSQL takes DISTINCT in a window function.
  - explain: SELECT id, count(DISTINCT x) OVER (PARTITION BY g) FROM w
    contains: [VirtualExecutionPlan]
    omits: [") OVER ("]
    when: { backend: [mysql, postgres] }
  # ClickHouse's `/` divides integers as Float64, so an integer quotient is sent
  # as intDiv. Its `%` by a negative constant takes the divisor's sign, so that
  # stays local; by a positive constant or a column it is sent.
  - explain: SELECT id, a / 3, a / k, a % 3, a % k FROM w
    contains: [VirtualExecutionPlan, "intDiv(w.a, 3)", "intDiv(w.a, w.k)", "(w.a % 3)", "(w.a % w.k)"]
    when: { backend: clickhouse }
  - explain: SELECT id, a % -2 FROM w
    contains: [VirtualExecutionPlan, "base_sql=SELECT w.id, w.a FROM w"]
    omits: ["(w.a % -2)"]
    when: { backend: clickhouse }
  # PostgreSQL keeps more digits of a decimal quotient than DataFusion's scale.
  - explain: SELECT id, dd / e FROM w
    contains: [VirtualExecutionPlan, 'base_sql=SELECT "w"."id", "w"."dd", "w"."e" FROM "w"']
    omits: ['("w"."dd" / "w"."e")']
    when: { backend: postgres }
  # ClickHouse answers `nan` where SQL answers NULL, so Spice computes these:
  # the SQL sent to ClickHouse groups nothing.
  - explain: SELECT g, stddev(x), var_samp(x) FROM w GROUP BY g
    contains: [AggregateExec, VirtualExecutionPlan]
    omits: ["GROUP BY"]
    when: { backend: clickhouse }
  # The federated query reached the backend rather than being answered locally.
  - explain: SELECT id FROM t WHERE i > 40
    contains: [VirtualExecutionPlan]
