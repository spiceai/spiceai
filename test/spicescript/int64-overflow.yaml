name: int64-overflow
description: Signed BIGINT arithmetic must reject overflow rather than returning wrapped values.
spicepod:
  version: v1
  kind: Spicepod
  name: int64-overflow
  runtime:
    cpu: { cores: 2 }
steps:
  - start: {}
  - http:
      path: /v1/sql
      body: SELECT v + CAST(9223372036854775807 AS BIGINT) AS v FROM (VALUES (CAST(11 AS BIGINT))) AS t(v)
    expect: { status: 400 }
  - http:
      path: /v1/sql
      body: SELECT v + CAST(-9223372036854775808 AS BIGINT) AS v FROM (VALUES (CAST(-7 AS BIGINT))) AS t(v)
    expect: { status: 400 }
