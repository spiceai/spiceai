  - source-exec: { api: "{ path: /v1/p0, headers: { content-type: application/json }, body: '[{\"v\": 1}]' }" }
  - query: SELECT content FROM zero_0 WHERE request_path = '/p0'
    expect: { rows: [['{"v":1}']] }
  - source-exec: { api: "{ path: /v1/p0, headers: { content-type: application/json }, body: '[{\"v\": 2}]' }" }
  - query: SELECT content FROM zero_0 WHERE request_path = '/p0'
