name: probe-zero-ttl-count
description: >
  Probe (not for merge). Ten zero-TTL datasets with a stale-if-error window,
  each looked up twice back to back right after it starts. Counts how often
  the origin is asked more than twice, and checks that the stored entry ends
  up holding the newer answer.

sources:
  api: { kind: mock-http }

spicepod:
  version: v1
  kind: Spicepod
  name: probe-zero-ttl-count
  runtime:
    caching: { sql_results: { enabled: false } }
  datasets:
    - from: ${sources.api.url}/v1
      name: zero_0
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_1
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_2
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_3
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_4
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_5
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_6
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_7
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_8
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }
    - from: ${sources.api.url}/v1
      name: zero_9
      params: { file_format: json, allowed_request_paths: '/*', request_query_filters: enabled, max_retries: '0', response_cache_max_size_bytes: '0' }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: caching, params: { caching_ttl: 0s, caching_stale_if_error: 1h } }

defaults:
  spiced-args: [-v]

steps:
