name: postgres-cdc-truncate
description: >
  PostgreSQL CDC into Cayenne, file and memory, through TRUNCATE: of one
  table, then written to again; truncated and refilled with overlapping
  keys in one transaction; two tables in one statement, one refilled in the
  same transaction; and across a restart.
sources:
  src: { kind: postgres }
variants:
  file: {}
  memory: { datasets: { '*': { acceleration: { mode: memory } } } }
  object-native: object-native
spicepod:
  version: v1
  kind: Spicepod
  name: postgres-cdc-truncate
  datasets:
    - from: postgres:public.a
      name: a
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: postgres:public.b
      name: b
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: src }
  compare-variants: false
steps:
  - source-exec:
      src: |
        CREATE TABLE a (id int PRIMARY KEY, v text);
        CREATE TABLE b (id int PRIMARY KEY, v text);
        INSERT INTO a SELECT i, 'a' || i FROM generate_series(1, 1000) i;
        INSERT INTO b SELECT i, 'b' || i FROM generate_series(1, 1000) i;
  - start: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  # Truncate one table, then write to it again.
  - source-exec: { src: "TRUNCATE a" }
  - query: SELECT count(*) AS n FROM a
    eventually: 30s
  - source-exec: { src: "INSERT INTO a VALUES (5, 'new5'), (2000, 'new2000')" }
  - query: SELECT * FROM a
    eventually: 30s
  # Truncate and refill in one transaction, keys overlapping the old ones.
  - source-exec: { src: "BEGIN; TRUNCATE a; INSERT INTO a SELECT i, 'again' || i FROM generate_series(1, 10) i; COMMIT" }
  - query: SELECT * FROM a
    eventually: 30s
  # Both tables in one statement.
  - source-exec: { src: "TRUNCATE a, b; INSERT INTO b VALUES (1, 'b-after')" }
  - query: SELECT * FROM a
    expect-empty: true
    eventually: 30s
  - query: SELECT * FROM b
    eventually: 30s
  # Restart: still right.
  - restart: {}
  - query: SELECT * FROM a
    expect-empty: true
  - query: SELECT * FROM b
  # Restarts with the source busy with writes to a table no dataset reads: a
  # dataset is ready only once its rows can be read, never on a keepalive
  # that overtakes its snapshot (in memory mode every restart loads one).
  - source-exec: { src: "INSERT INTO a SELECT i, 'refill' || i FROM generate_series(1, 1000) i; CREATE TABLE unrelated (id serial PRIMARY KEY)" }
  - query: SELECT * FROM a
    eventually: 30s
  - background:
      id: unrelated-writes
      source-exec: { src: "INSERT INTO unrelated DEFAULT VALUES" }
      every: 50ms
  - restart: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  - restart: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  - restart: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  - restart: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  - restart: {}
  - query: SELECT * FROM a
  - query: SELECT * FROM b
  - stop-background: { id: unrelated-writes }
  # Restarts with the source idle: a dataset whose stream has caught up is
  # ready in seconds, without waiting for unrelated writes on the server to
  # move its WAL (#15038).
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  - restart: { ready-timeout: 10s }
  # Written while Spice is down, once the acceleration is empty: the restart
  # rebuilds it from the source and then replays these changes, which predate
  # the re-read. The dataset is ready only once that replay has caught up, so
  # no query reads the rows of an INSERT whose later TRUNCATE is still to be
  # applied (#16292).
  - source-exec: { src: "TRUNCATE a" }
  - query: SELECT count(*) AS n FROM a
    eventually: 30s
  - stop: {}
  - source-exec: { src: "INSERT INTO a VALUES (5, 'down5'), (2000, 'down2000')" }
  - source-exec: { src: "BEGIN; TRUNCATE a; INSERT INTO a SELECT i, 'down-again' || i FROM generate_series(1, 10) i; COMMIT" }
  - source-exec: { src: "TRUNCATE a" }
  - start: {}
  - query: SELECT * FROM a
    expect-empty: true
