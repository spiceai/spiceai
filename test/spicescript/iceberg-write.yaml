name: iceberg-write
description: >
  Writes through Spice to an Iceberg table — INSERT through a dataset and
  through the Iceberg catalog connector, DELETE with and without matching rows
  — are committed so that DuckDB, reading the table independently, sees exactly
  them; and Spice reads what DuckDB writes in between.

sources:
  ice: { kind: iceberg }

spicepod:
  version: v1
  kind: Spicepod
  name: iceberg-write
  datasets:
    - from: 'iceberg:${sources.ice.catalog}/v1/namespaces/${sources.ice.namespace}/tables/t'
      name: t
      access: read_write
      params: ${sources.ice.params}
  catalogs:
    - from: 'iceberg:${sources.ice.catalog}/v1/namespaces'
      name: ice
      access: read_write
      include: ['${sources.ice.namespace}.*']
      params: ${sources.ice.params}

defaults:
  expect: { oracle: ice }

steps:
  - source-exec:
      ice: |
        CREATE TABLE t (batch VARCHAR, b BOOLEAN, i INTEGER, l BIGINT, f REAL, d DOUBLE, dec DECIMAL(10, 4), dt DATE, ts TIMESTAMP, bin BLOB);
        INSERT INTO t
          SELECT 'seed', i % 2 = 0, i, i * 10000000000, i / 4.0, i / 8.0, i * 1.0001, DATE '2024-01-01' + CAST(i AS INTEGER), TIMESTAMP '2024-01-01 00:00:00' + to_seconds(i), from_hex(lpad(to_hex(i), 4, '0'))
          FROM range(1, 101) r(i);
  - start: {}
  - query: SELECT batch, b, i, l, f, d, dec, dt, ts FROM t
  - query: SELECT i, encode(bin, 'hex') FROM t
    oracle-sql: SELECT i, lower(hex(bin)) FROM t

  # INSERT through the dataset, with every type and a row of NULLs. The NULL
  # row has a batch of its own: DuckDB, the oracle, drops rows whose equality-
  # delete key columns are NULL (known-failing/files-and-lakes/iceberg-equality-delete-nulls.yaml).
  - spice-exec: >-
      INSERT INTO t (batch, b, i, l, f, d, dec, dt, ts, bin) VALUES
      ('spice-1', TRUE, 1, 10000000001, 1.5, 2.25, 12345.6789, DATE '2024-01-01', TIMESTAMP '2024-01-01 02:03:04', X'00FFAB'),
      ('spice-1', FALSE, 2, 20000000002, -0.5, -1.125, -0.0001, DATE '1999-12-31', TIMESTAMP '1999-12-31 23:59:59', X''),
      ('spice-nulls', NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL)
  - query: SELECT batch, b, i, l, f, d, dec, dt, ts FROM t
    eventually: 30s
  - query: SELECT i, encode(bin, 'hex') FROM t WHERE batch = 'spice-1' AND i IS NOT NULL
    oracle-sql: SELECT i, lower(hex(bin)) FROM t WHERE batch = 'spice-1' AND i IS NOT NULL

  # INSERT through the catalog connector's path to the same table.
  - spice-exec: "INSERT INTO ice.${sources.ice.namespace}.t (batch, b, i, l) VALUES ('spice-2', TRUE, 7, 70000000007), ('spice-2', TRUE, 8, 80000000008)"
  - query: SELECT batch, count(*), sum(i), sum(l) FROM t GROUP BY batch
    eventually: 30s
  - query: SELECT batch, b, i, l FROM ice.${sources.ice.namespace}.t WHERE batch LIKE 'spice%'
    oracle-sql: SELECT batch, b, i, l FROM t WHERE batch LIKE 'spice%'
    eventually: 30s

  # DELETE: some rows, then a filter that matches none.
  - spice-exec: DELETE FROM t WHERE batch = 'spice-1' AND b = false
  - spice-exec: DELETE FROM t WHERE batch = 'no-such-batch'
  - query: SELECT batch, b, i, l, f, d, dec, dt, ts FROM t
    eventually: 30s
  - spice-exec: DELETE FROM t WHERE batch = 'seed' AND i % 10 = 0
  - query: SELECT batch, count(*), sum(i) FROM t GROUP BY batch
    eventually: 30s

  # DuckDB writes in between; Spice reads them.
  - source-exec:
      ice:
        - DELETE FROM t WHERE batch = 'seed' AND i % 3 = 0
        - INSERT INTO t (batch, i) SELECT 'duckdb', i FROM range(1000, 1010) r(i)
  - query: SELECT batch, b, i, l, f, d, dec, dt, ts FROM t
    eventually: 30s
