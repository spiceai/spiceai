name: time-columns
description: >
  Every `time_format` against append refresh and `refresh_data_window` on
  Cayenne: append adds exactly the newer rows, and the window loads exactly
  the rows inside it (retention: time-columns-retention.yaml). The same instants are held in one column per
  format, and PostgreSQL answers each check over the instant the format
  represents (a date stands for its midnight).

sources:
  src: { kind: postgres }

matrix:
  format: [timestamptz, timestamp, unix_seconds, unix_millis, unix_nanos, iso8601, date]

spicepod:
  version: v1
  kind: Spicepod
  name: time-columns
  datasets:
    - from: postgres:public.t
      name: app
      params: ${sources.src.params}
      time_column: t_${matrix.format}
      time_format: ${matrix.format}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: append, refresh_check_interval: 1h }
    - from: postgres:public.t
      name: win
      params: ${sources.src.params}
      time_column: t_${matrix.format}
      time_format: ${matrix.format}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_check_interval: 1h, refresh_data_window: 3d }

defaults:
  cluster-partition-by: { '*': id }
  expect: { oracle: src }

steps:
  # Each row is an instant some seconds before now (negative: after now),
  # held in every format; o_<format> is the instant that format represents.
  - source-exec:
      src: |
        CREATE TABLE t (id int PRIMARY KEY, v text,
          t_timestamptz timestamptz, t_timestamp timestamp, t_unix_seconds bigint, t_unix_millis bigint,
          t_unix_nanos bigint, t_iso8601 text, t_date date,
          o_timestamptz timestamptz, o_timestamp timestamptz, o_unix_seconds timestamptz, o_unix_millis timestamptz,
          o_unix_nanos timestamptz, o_iso8601 timestamptz, o_date timestamptz);
        CREATE FUNCTION add_rows(seconds_ago numeric[]) RETURNS void LANGUAGE sql AS $$
          INSERT INTO t SELECT (SELECT coalesce(max(id), 0) FROM t) + n, 'row' || n,
            s, s AT TIME ZONE 'UTC', floor(extract(epoch FROM s))::bigint, floor(extract(epoch FROM s) * 1000)::bigint,
            floor(extract(epoch FROM s) * 1000000)::bigint * 1000,
            to_char(s AT TIME ZONE 'UTC', 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"'), (s AT TIME ZONE 'UTC')::date,
            s, s, date_trunc('second', s), date_trunc('milliseconds', s), s, date_trunc('milliseconds', s),
            ((s AT TIME ZONE 'UTC')::date)::timestamp AT TIME ZONE 'UTC'
          FROM unnest(seconds_ago) WITH ORDINALITY AS u(secs, n),
            LATERAL (SELECT date_trunc('milliseconds', now()) - secs * INTERVAL '1 second') AS x(s)
        $$;
        SELECT add_rows(ARRAY[720000, 259200.5, 180000, 108000, 43200.25, 3600, -3600, -108000]);
  - start: {}

  - query: SELECT id, v FROM app ORDER BY id
    oracle-sql: SELECT id, v FROM t ORDER BY id
  - query: SELECT id FROM win ORDER BY id
    oracle-sql: SELECT id FROM t WHERE o_${matrix.format} >= now() - INTERVAL '3 days' ORDER BY id

  # Newer rows, with fractional seconds; a full refresh reloads the window.
  - source-exec: { src: "SELECT add_rows(ARRAY[-144000.25, -144001.5, -144001.75])" }
  - refresh: app
  - refresh: win
  - query: SELECT id, v FROM app ORDER BY id
    oracle-sql: SELECT id, v FROM t ORDER BY id
  - query: SELECT id FROM win ORDER BY id
    oracle-sql: SELECT id FROM t WHERE o_${matrix.format} >= now() - INTERVAL '3 days' ORDER BY id
  # Nothing new: nothing added.
  - refresh: app
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM app
    oracle-sql: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM t
