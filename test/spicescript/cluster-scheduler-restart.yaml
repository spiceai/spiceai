name: cluster-scheduler-restart
description: >
  A cluster scheduler killed and started again at once, on the same
  address, takes over its own registration from before the crash rather than
  waiting for it to expire, and serves again.

sources:
  src: { kind: postgres }

spicepod:
  version: v1
  kind: Spicepod
  name: cluster-scheduler-restart
  datasets:
    - { from: postgres:public.t, name: t, params: '${sources.src.params}', acceleration: { enabled: true, engine: cayenne, mode: file } }

defaults:
  cluster: { executors: 1 }
  cluster-partition-by: { '*': id }
  expect: { oracle: src }

steps:
  - source-exec: { src: "CREATE TABLE t (id int PRIMARY KEY); INSERT INTO t SELECT generate_series(1, 100)" }
  - start: {}
  - query: SELECT * FROM t
  - kill-spiced: {}
  - start: {}
  - query: SELECT * FROM t
