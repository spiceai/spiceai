name: dynamodb-stream-faults
tags: [long]
description: >
  A DynamoDB Streams changes-mode acceleration survives faults in the stream
  itself: requests to open its shards that fail for a while (it becomes ready
  with every row), or for good (it reports an error instead of loading
  forever), and a stream that returns records it already delivered (it becomes
  ready, and later changes are not undone by the stale records). Regression
  test for #16627.

sources:
  # spiced reaches LocalStack through an HTTP proxy inside the container (port
  # 4567) that injects the faults, chosen by table name:
  #   flaky_*   the first 3 GetShardIterator requests fail with a 500, which the
  #             AWS SDK's own retries do not outlast;
  #   broken_*  every GetShardIterator request fails with a 500;
  #   echo_*    after the first GetRecords response with records, every empty
  #             response carries those records again (with a fresh
  #             NextShardIterator), as LocalStack's amd64 build does when a
  #             lone record sits at the start of a shard.
  ddb:
    kind: docker
    image: docker.io/localstack/localstack:4.9
    ports: [4566, 4567]
    env: { SERVICES: dynamodb, AWS_DEFAULT_REGION: us-east-1 }
    ready: awslocal dynamodb list-tables

spicepod:
  version: v1
  kind: Spicepod
  name: dynamodb-stream-faults
  datasets:
    - from: dynamodb:flaky_${sources.ddb.namespace}
      name: flaky
      params: &params
        dynamodb_aws_region: us-east-1
        dynamodb_aws_auth: key
        dynamodb_aws_access_key_id: test
        dynamodb_aws_secret_access_key: test
        endpoint_url: http://127.0.0.1:${sources.ddb.port.4567}
      acceleration: &changes { enabled: true, engine: cayenne, mode: file, refresh_mode: changes }
    - from: dynamodb:broken_${sources.ddb.namespace}
      name: broken
      params: *params
      acceleration: *changes
    - from: dynamodb:echo_${sources.ddb.namespace}
      name: echo
      params: *params
      acceleration: *changes

defaults:
  # The proxy on port 4567 and its fault counts belong to the one LocalStack
  # container, so the script runs alone.
  exclusive: true

steps:
  - source-exec:
      ddb: |
        cat > /tmp/proxy.py <<'PY'
        import json, os, threading, urllib.request, urllib.error
        from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
        # One proxy serves every instance that shares this container, so all of
        # its state is kept per table (each instance's tables are namespaced).
        lock = threading.Lock()
        state = {'injected': {}, 'redelivered': {}}
        echo_iterators, cached = {}, {}  # iterator -> table; table -> first records
        def table_of(arn):
            return arn.split(':table/')[1].split('/')[0] if ':table/' in arn else ''
        def save():
            # Called with `lock` held; published whole, so a reader never sees a
            # partly written file.
            with open('/tmp/proxy-state.json.tmp', 'w') as f:
                json.dump(state, f)
            os.replace('/tmp/proxy-state.json.tmp', '/tmp/proxy-state.json')
        class Proxy(BaseHTTPRequestHandler):
            def log_message(self, *args):
                pass
            def reply(self, status, data, headers=()):
                self.send_response(status)
                for k, v in headers:
                    if k.lower() not in ('transfer-encoding', 'connection', 'content-length'):
                        self.send_header(k, v)
                self.send_header('Content-Length', str(len(data)))
                self.end_headers()
                self.wfile.write(data)
            def do_POST(self):
                body = self.rfile.read(int(self.headers.get('Content-Length', 0)))
                op = self.headers.get('X-Amz-Target', '').rsplit('.', 1)[-1]
                req = json.loads(body or b'{}')
                table = table_of(req.get('StreamArn', ''))
                if op == 'GetShardIterator':
                    with lock:
                        n = state['injected'].get(table, 0)
                        inject = table.startswith('broken_') or (table.startswith('flaky_') and n < 3)
                        if inject:
                            state['injected'][table] = n + 1
                            save()
                    if inject:
                        return self.reply(500, b'{"__type":"InternalError","message":"injected: stream is not currently ACTIVE"}',
                                          [('Content-Type', 'application/x-amz-json-1.0')])
                headers = {k: v for k, v in self.headers.items() if k.lower() not in ('host', 'content-length')}
                upstream = urllib.request.Request('http://127.0.0.1:4566' + self.path, data=body, method='POST', headers=headers)
                try:
                    with urllib.request.urlopen(upstream, timeout=30) as r:
                        status, rheaders, data = r.status, list(r.headers.items()), r.read()
                except urllib.error.HTTPError as e:
                    status, rheaders, data = e.code, list(e.headers.items()), e.read()
                if status == 200 and op == 'GetShardIterator' and table.startswith('echo_'):
                    with lock:
                        echo_iterators[json.loads(data)['ShardIterator']] = table
                elif status == 200 and op == 'GetRecords' and req.get('ShardIterator') in echo_iterators:
                    doc = json.loads(data)
                    with lock:
                        echo = echo_iterators[req['ShardIterator']]
                        if doc.get('NextShardIterator'):
                            echo_iterators[doc['NextShardIterator']] = echo
                        if doc.get('Records') and echo not in cached:
                            cached[echo] = doc['Records']
                        elif not doc.get('Records') and echo in cached:
                            doc['Records'] = cached[echo]
                            state['redelivered'][echo] = state['redelivered'].get(echo, 0) + 1
                            save()
                    data = json.dumps(doc).encode()
                self.reply(status, data, rheaders)
        with lock:
            save()
        ThreadingHTTPServer(('0.0.0.0', 4567), Proxy).serve_forever()
        PY
        # Instances that share the container share the proxy started first: start
        # one only when nothing accepts connections on its port yet.
        if ! python3 -c "import socket, sys; sys.exit(socket.socket().connect_ex(('127.0.0.1', 4567)))"; then
          nohup python3 /tmp/proxy.py > /tmp/proxy.log 2>&1 < /dev/null &
          sleep 1
        fi
  - source-exec:
      ddb: |
        python3 - <<'PY'
        import boto3, time
        d = boto3.resource('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test')
        N = '${sources.ddb.namespace}'
        for name in ['flaky', 'broken', 'echo']:
            d.create_table(TableName=name + '_' + N, KeySchema=[{'AttributeName': 'id', 'KeyType': 'HASH'}],
                AttributeDefinitions=[{'AttributeName': 'id', 'AttributeType': 'S'}], BillingMode='PAY_PER_REQUEST',
                StreamSpecification={'StreamEnabled': True, 'StreamViewType': 'NEW_AND_OLD_IMAGES'}).wait_until_exists()
        # LocalStack drops writes made in the first ~0.5s of a new stream; the
        # echo rows must reach the stream, so it gets time to come up.
        time.sleep(2)
        for name in ['flaky', 'broken', 'echo']:
            for i in range(3):
                d.Table(name + '_' + N).put_item(Item={'id': str(i), 'name': 'Item ' + str(i)})
        PY
  # The echo rows must be older than `dynamodb_replication_ready_lag` (2s) when
  # the stream first returns them, so that only a later empty poll can make the
  # dataset ready: time itself is the condition here.
  - sleep: 4s
  - start: { ready: false }

  # Opening the shards fails, then succeeds on a retry.
  - query: SELECT id, name FROM flaky
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 60s
  - assert-status: { dataset: flaky, status: Ready }
  - assert-log:
      contains: ["Dataset 'flaky' failed to open the shards of its DynamoDB Stream, so it is not ready yet; retrying"]

  # Records returned again do not keep the dataset from becoming ready ...
  - query: SELECT id, name FROM echo
    expect: { rows: [['0', Item 0], ['1', Item 1], ['2', Item 2]] }
    eventually: 60s
  # ... and do not undo later changes.
  - source-exec:
      ddb: |
        python3 - <<'PY'
        import boto3
        t = boto3.resource('dynamodb', endpoint_url='http://localhost:4566', region_name='us-east-1', aws_access_key_id='test', aws_secret_access_key='test').Table('echo_${sources.ddb.namespace}')
        t.update_item(Key={'id': '0'}, UpdateExpression='SET #n = :n', ExpressionAttributeNames={'#n': 'name'}, ExpressionAttributeValues={':n': 'Item 0 updated'})
        t.delete_item(Key={'id': '1'})
        t.put_item(Item={'id': '3', 'name': 'Item 3'})
        PY
  - query: SELECT id, name FROM echo
    expect: { rows: [['0', Item 0 updated], ['2', Item 2], ['3', Item 3]] }
    eventually: 30s
  - query: SELECT id, name FROM echo
    expect: { rows: [['0', Item 0 updated], ['2', Item 2], ['3', Item 3]] }
    consistently: 5s

  # Opening the shards never succeeds: the dataset reports the error once the
  # retries (about two and a half minutes) run out.
  - assert-status:
      dataset: broken
      status: Error
      # The table name carries the run's namespace, which this field does not
      # substitute, so the message is matched up to the name's fixed prefix.
      message-contains: "Failed to start reading the DynamoDB Stream of table 'broken_"
    eventually: 240s

  # Every fault fired: the flaky table's first requests failed, and the echo
  # table's records came back.
  - source-query:
      ddb: |
        python3 - <<'PY'
        import json
        s = json.load(open('/tmp/proxy-state.json'))
        N = '${sources.ddb.namespace}'
        print(s['injected'].get('flaky_' + N, 0), s['injected'].get('broken_' + N, 0) > 3, s['redelivered'].get('echo_' + N, 0) > 0)
        PY
    expect: { rows: [['3 True True']] }
