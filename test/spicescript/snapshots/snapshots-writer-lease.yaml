name: snapshots-writer-lease
description: >
  Two replicas (variants a and b, each with its own copy of the source) keep
  snapshots of one dataset in one shared state location. Only the writer
  lease holder creates snapshots, and the other says it is standing by; once
  the holder is killed, the other takes the lease over after it lapses and
  publishes snapshots, and the killed replica, started again on empty local
  storage with its source down, restores the new holder's latest snapshot.

sources:
  src: { kind: postgres }
  lake: { kind: rustfs }

variants:
  a: {}
  b: {}

spicepod:
  version: v1
  kind: Spicepod
  name: snapshots-writer-lease
  runtime:
    state:
      location: s3://${sources.lake.shared_bucket}/state/
      params:
        s3_endpoint: ${sources.lake.endpoint}
        s3_region: us-east-1
        s3_auth: key
        s3_key: ${sources.lake.key}
        s3_secret: ${sources.lake.secret}
        allow_http: 'true'
  datasets:
    - from: postgres:public.t
      name: t
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        refresh_check_interval: 3s
        snapshots: enabled
        params:
          cayenne_file_path: ${instance.dir}/accel-1/data
          cayenne_metadata_dir: ${instance.dir}/accel-1/meta

defaults:
  # The variants work together, so they run side by side.
  run-variants: side-by-side
  compare-variants: false
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE t (id int PRIMARY KEY, v text);
        INSERT INTO t SELECT i, 'first' FROM generate_series(1, 1000) i;

  # a takes the lease and creates snapshots; b, started after, stands by
  # through several refreshes of its own.
  - start: {}
    only: a
  - assert-log: { contains: 'Snapshot created dataset=t' }
    eventually: 30s
    only: a
  - start: {}
    only: b
  - assert-log: { contains: "Dataset 't' is not creating snapshots while" }
    eventually: 30s
    only: b
  - assert-log: { count: { 'Loaded .* for dataset t in': '>=3' } }
    eventually: 30s
    only: b
  - assert-log: { count: { 'Snapshot created dataset=t': 0 } }
    only: b
  - assert-log: { count: { 'Snapshot created dataset=t': '>=3' } }
    eventually: 30s
    only: a

  # The holder dies; b takes over once the lease lapses (30 seconds at the
  # least) and publishes the source's new rows.
  - kill-spiced: {}
    only: a
  - source-exec: { src: "UPDATE t SET v = 'second' WHERE id <= 500" }
  - assert-log: { contains: "Dataset 't' took over its snapshot writer lease from" }
    eventually: 90s
    only: b
  - query: SELECT v, count(*) AS n FROM t GROUP BY v ORDER BY v
    eventually: 30s
    only: b
  - mark-metrics: serving-update
    only: b
  - wait-metric: { name: dataset_acceleration_snapshot_write_duration_ms_count, labels: { dataset: t }, increased-by: 1, since: serving-update, timeout: 30s }
    only: b

  # a, on empty local storage with its source down, serves b's snapshot.
  - stop-source: src
    only: a
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-2/data', cayenne_metadata_dir: '${instance.dir}/accel-2/meta' } } }
    only: a
  - query: SELECT v, count(*) AS n FROM t GROUP BY v ORDER BY v
    expect: { rows: [[first, '500'], [second, '500']] }
    eventually: 60s
    only: a
  - assert-log: { contains: 'Snapshot restored' }
    only: a
