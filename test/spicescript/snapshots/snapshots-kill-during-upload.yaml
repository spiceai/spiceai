name: snapshots-kill-during-upload
description: >
  spiced killed (SIGKILL) at points from the end of a refresh through the
  snapshot upload that follows it never leaves a snapshot that restores
  wrong: started on empty local storage with the source down, the
  acceleration serves one whole generation of the table — the one before the
  refresh or the one after — never a mix, a part, or nothing.

sources:
  src: { kind: postgres }
  lake: { kind: rustfs }

spicepod:
  version: v1
  kind: Spicepod
  name: snapshots-kill-during-upload
  runtime:
    state:
      location: s3://${sources.lake.bucket}/state/
      params:
        s3_endpoint: ${sources.lake.endpoint}
        s3_region: us-east-1
        s3_auth: key
        s3_key: ${sources.lake.key}
        s3_secret: ${sources.lake.secret}
        allow_http: 'true'
  datasets:
    - from: postgres:public.t
      name: t
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        refresh_check_interval: 1h
        snapshots: enabled
        params:
          cayenne_file_path: ${instance.dir}/accel-gen1/data
          cayenne_metadata_dir: ${instance.dir}/accel-gen1/meta

defaults:
  compare-variants: false
  ready-timeout: 5m

steps:
  # 2,000,000 rows with one generation label: a snapshot of about 75 MB,
  # uploaded in about half a second, which the kills below are spread across.
  - source-exec:
      src: |
        CREATE TABLE t (id int PRIMARY KEY, v text NOT NULL, pad text NOT NULL);
        INSERT INTO t SELECT i, 'gen1', md5(i::text) || md5((i * 7)::text) FROM generate_series(1, 2000000) i;
  - start: {}
  - assert-log: { contains: 'Snapshot created dataset=t' }
    eventually: 120s

  # Refreshed to gen2, killed 0s after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen2'" }
  - refresh: t
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen2/data', cayenne_metadata_dir: '${instance.dir}/accel-gen2/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  # Refreshed to gen3, killed 150ms after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen3'" }
  - refresh: t
  - sleep: 150ms
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen3/data', cayenne_metadata_dir: '${instance.dir}/accel-gen3/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  # Refreshed to gen4, killed 300ms after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen4'" }
  - refresh: t
  - sleep: 300ms
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen4/data', cayenne_metadata_dir: '${instance.dir}/accel-gen4/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  # Refreshed to gen5, killed 450ms after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen5'" }
  - refresh: t
  - sleep: 450ms
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen5/data', cayenne_metadata_dir: '${instance.dir}/accel-gen5/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  # Refreshed to gen6, killed 600ms after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen6'" }
  - refresh: t
  - sleep: 600ms
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen6/data', cayenne_metadata_dir: '${instance.dir}/accel-gen6/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  # Refreshed to gen7, killed 1s after the refresh completes.
  - start-source: src
  - source-exec: { src: "UPDATE t SET v = 'gen7'" }
  - refresh: t
  - sleep: 1s
  - kill-spiced: {}
  - stop-source: src
  - start:
      ready: false
      patch:
        datasets:
          t: { acceleration: { params: { cayenne_file_path: '${instance.dir}/accel-gen7/data', cayenne_metadata_dir: '${instance.dir}/accel-gen7/meta' } } }
  - query: SELECT count(*) AS n, count(DISTINCT v) AS generations, sum(id) AS ids FROM t
    expect: { rows: [['2000000', '1', '2000001000000']] }
    eventually: 120s

  - assert-log: { count: { 'Snapshot restored': '>=6' } }
