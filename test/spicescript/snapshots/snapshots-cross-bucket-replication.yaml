name: snapshots-cross-bucket-replication
description: >
  A full-refresh writer and source-free snapshot reader, with two
  S3 buckets, sorted Cayenne tables, shared metadata directories, explicit keys,
  secondary/composite indexes and SQL result caching. Byte-identical metadata
  is mirrored with archives first or delayed until after metadata. Each table
  converges independently; a join is checked after both have converged.

# Models a customer writer/reader deployment. PostgreSQL replaces MySQL;
# fixtures and resource budgets are small, and polling is shortened to 1s.
# Both tables exceed the inline-row limit to exercise sorted file scans.
# The controlled mirror models object ordering and a paused mirror, not WAN lag.
sources:
  src: { kind: postgres }
  lake: { kind: rustfs }
  control:
    kind: docker
    image: python:3.12-alpine
    host-network: true
    command: [sleep, infinity]
    ready: 'true'

matrix:
  arrival: [archive-first, metadata-first]

variants:
  writer: {}
  reader:
    env: { SPICED_LOG: 'info,runtime_acceleration::snapshot=debug' }
    spicepod:
      runtime: { state: null }
      datasets:
        - from: s3://${sources.lake.bucket}/state/snapshots/
          name: modules
          params: &snapshot-source
            file_format: snapshot
            s3_endpoint: ${sources.lake.endpoint}
            s3_region: us-east-1
            s3_auth: key
            s3_key: ${sources.lake.key}
            s3_secret: ${sources.lake.secret}
            allow_http: 'true'
          acceleration:
            primary_key: sid
            refresh_check_interval: 1s
            storage_profile: ebs
            params: { cayenne_file_path: '${instance.dir}/modules-1', cayenne_metadata_dir: '${instance.dir}/meta-1', cayenne_sort_columns: sid, cayenne_write_concurrency: '2' }
        - from: s3://${sources.lake.bucket}/state/snapshots/
          name: configuration_addresses
          params: *snapshot-source
          acceleration:
            primary_key: id
            refresh_check_interval: 1s
            storage_profile: ebs
            indexes: &address-indexes
              remote_entity_id: enabled
              '(developer_account_sid, remote_entity_id)': enabled
              module_sid: enabled
            params: { cayenne_file_path: '${instance.dir}/addresses-1', cayenne_metadata_dir: '${instance.dir}/meta-1', cayenne_sort_columns: remote_entity_id, cayenne_write_concurrency: '2' }

spicepod:
  version: v2
  kind: Spicepod
  name: snapshots-cross-bucket-replication
  runtime:
    dataset_load_parallelism: 1
    caching:
      sql_results:
        enabled: true
        max_size: 16MiB
        cache_key_type: sql
        eviction_policy: tiny_lfu
        item_ttl: 3m
        stale_while_revalidate_ttl: 1m
    state:
      location: s3://${sources.lake.shared_bucket}/state/
      params:
        s3_endpoint: ${sources.lake.endpoint}
        s3_region: us-east-1
        s3_auth: key
        s3_key: ${sources.lake.key}
        s3_secret: ${sources.lake.secret}
        allow_http: 'true'
  datasets:
    - from: postgres:public.modules
      name: modules
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        storage_profile: ebs
        primary_key: sid
        refresh_mode: full
        refresh_check_interval: 5m
        refresh_retry_enabled: true
        refresh_retry_max_attempts: 10
        refresh_jitter_enabled: true
        snapshots: create_only
        snapshots_trigger: refresh_complete
        params: { cayenne_file_path: '${instance.dir}/modules', cayenne_metadata_dir: '${instance.dir}/meta', cayenne_sort_columns: sid, cayenne_write_concurrency: '2' }
    - from: postgres:public.configuration_addresses
      name: configuration_addresses
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        storage_profile: ebs
        primary_key: id
        refresh_mode: full
        refresh_check_interval: 5m
        refresh_retry_enabled: true
        refresh_retry_max_attempts: 10
        refresh_jitter_enabled: true
        snapshots: create_only
        snapshots_trigger: refresh_complete
        indexes: *address-indexes
        params: { cayenne_file_path: '${instance.dir}/addresses', cayenne_metadata_dir: '${instance.dir}/meta', cayenne_sort_columns: remote_entity_id, cayenne_write_concurrency: '2' }

defaults:
  run-variants: side-by-side
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE modules (sid text PRIMARY KEY, label text);
        CREATE TABLE configuration_addresses (id int PRIMARY KEY, module_sid text, developer_account_sid text, remote_entity_id text, v text);
        INSERT INTO modules SELECT 'm' || i, 'old-' || i FROM generate_series(1, 2000) i;
        INSERT INTO configuration_addresses SELECT i, 'm' || (i % 2000 + 1), 'acct' || (i % 3), 'remote' || i, 'old' FROM generate_series(1, 10000) i;
        INSERT INTO configuration_addresses VALUES (0, NULL, NULL, NULL, NULL);
  - start: { ready: false }
    only: reader
  - assert-log: { contains: 'waiting|no snapshot' }
    eventually: 30s
    only: reader
  - start: {}
    only: writer
  - assert-log: { contains: 'Snapshot created dataset=modules\b' }
    eventually: 30s
    only: writer
  - assert-log: { contains: 'Snapshot created dataset=configuration_addresses\b' }
    eventually: 30s
    only: writer
  - source-exec: { control: { file: ../seed/snapshot-region-mirror.sh } }
    only: reader
  - source-exec: { control: { file: ../seed/snapshot-region-mirror.sh } }
    only: reader
  - query: SELECT * FROM modules
    expect: { oracle: src }
    eventually: 60s
    only: reader
  - query: SELECT * FROM configuration_addresses
    expect: { oracle: src }
    eventually: 60s
    only: reader
  - query: SELECT a.id, a.remote_entity_id, m.sid, m.label FROM configuration_addresses a JOIN modules m ON a.module_sid = m.sid WHERE a.developer_account_sid = 'acct1' ORDER BY a.id
    expect: { oracle: src }
    only: reader
  - query: SELECT count(*) AS n, sum(id) AS ids, count(v) AS nonnull FROM configuration_addresses
    expect: { rows: [['10001', '50005000', '10000']] }
    only: reader
  - background:
      id: whole-generation
      concurrency: 2
      every: 100ms
      query: SELECT ${round} AS sample, count(*) AS n, count(DISTINCT id) AS distinct_ids, count(DISTINCT v) AS generations, sum(id) AS ids, count(v) AS nonnull, sum(CASE WHEN id = 0 AND v IS NULL AND remote_entity_id IS NULL THEN 0 WHEN id BETWEEN 1 AND 10000 AND ((v = 'old' AND remote_entity_id = 'remote' || id) OR (v = 'new' AND remote_entity_id = 'moved')) THEN 0 ELSE 1 END) AS bad FROM configuration_addresses
      expect: { n: '10001', distinct_ids: '10001', generations: '1', ids: '50005000', nonnull: '10000', bad: '0' }
    only: reader

  # Read the same cached SQL before and after publication and mirror progress.
  - source-exec:
      src: |
        UPDATE modules SET label = 'new-' || sid;
        UPDATE configuration_addresses SET v = 'new', remote_entity_id = 'moved' WHERE id > 0;
    only: writer
  - refresh: modules
    only: writer
  - refresh: configuration_addresses
    only: writer
  - assert-log: { count: { 'Snapshot created dataset=modules\b': '>=2', 'Snapshot created dataset=configuration_addresses\b': '>=2' } }
    eventually: 30s
    only: writer
  - query: SELECT count(*) AS n FROM configuration_addresses WHERE v = 'old'
    expect: { rows: [['10000']] }
    consistently: 3s
    only: reader
  - http: { method: POST, path: /v1/sql, body: SELECT count(*) AS n FROM configuration_addresses WHERE v = 'old' }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: '10000' }
    only: reader
  - source-exec: { control: { file: ../seed/snapshot-region-mirror.sh } }
    only: reader
  - assert-log: { contains: 'Published snapshot file has not reached the snapshot location yet' }
    eventually: 30s
    when: { arrival: metadata-first }
    only: reader
  - http:
      method: POST
      path: /v1/sql
      headers: { Cache-Control: no-cache }
      body: SELECT count(*) AS n FROM configuration_addresses WHERE v = 'old'
    expect: { status: 200, body-contains: '10000' }
    consistently: 3s
    when: { arrival: metadata-first }
    only: reader
  - query: SELECT count(*) AS n FROM configuration_addresses WHERE v = 'old'
    expect: { rows: [['10000']] }
    consistently: 3s
    when: { arrival: metadata-first }
    only: reader
  - source-exec: { control: { file: ../seed/snapshot-region-mirror.sh } }
    only: reader
  # Refresh invalidates plans, but SQL results retain their TTL. Bypass them
  # to establish snapshot progress before checking the cached query converges.
  - http:
      method: POST
      path: /v1/sql
      headers: { Cache-Control: no-cache }
      body: SELECT label FROM modules WHERE sid = 'm1'
    expect: { status: 200, body-contains: 'new-m1' }
    eventually: 60s
    only: reader
  - http:
      method: POST
      path: /v1/sql
      headers: { Cache-Control: no-cache }
      body: SELECT count(*) AS changed FROM configuration_addresses WHERE v = 'new'
    expect: { status: 200, body-contains: '10000' }
    eventually: 60s
    only: reader
  - query: SELECT * FROM modules
    oracle-sql: SELECT sid, 'new-' || sid AS label FROM modules
    expect: { oracle: src }
    eventually: 5m
    only: reader
  - query: SELECT * FROM configuration_addresses
    oracle-sql: SELECT id, module_sid, developer_account_sid, CASE WHEN id > 0 THEN 'moved' ELSE remote_entity_id END AS remote_entity_id, CASE WHEN id > 0 THEN 'new' ELSE v END AS v FROM configuration_addresses
    expect: { oracle: src }
    eventually: 5m
    only: reader
  - query: SELECT count(*) AS n, sum(id) AS ids, count(v) AS nonnull FROM configuration_addresses
    expect: { rows: [['10001', '50005000', '10000']] }
    only: reader
  - query: SELECT a.id, a.remote_entity_id, m.sid, m.label FROM configuration_addresses a JOIN modules m ON a.module_sid = m.sid WHERE a.developer_account_sid = 'acct1' ORDER BY a.id
    oracle-sql: SELECT a.id, 'moved' AS remote_entity_id, m.sid, 'new-' || m.sid AS label FROM configuration_addresses a JOIN modules m ON a.module_sid = m.sid WHERE a.developer_account_sid = 'acct1' ORDER BY a.id
    expect: { oracle: src }
    eventually: 5m
    only: reader
  - query: SELECT id FROM configuration_addresses WHERE developer_account_sid = 'acct1' AND remote_entity_id = 'moved' ORDER BY id
    oracle-sql: SELECT id FROM configuration_addresses WHERE developer_account_sid = 'acct1' AND id > 0 ORDER BY id
    expect: { oracle: src }
    only: reader
  - query: SELECT id FROM configuration_addresses WHERE remote_entity_id = 'remote1'
    expect: { rows: [] }
    expect-empty: true
    only: reader
  - explain: SELECT id FROM configuration_addresses WHERE developer_account_sid = 'acct1' AND remote_entity_id = 'moved'
    contains: 'lookup_index=(developer_account_sid, remote_entity_id)'
    only: reader
  - explain: SELECT id FROM configuration_addresses WHERE remote_entity_id = 'moved'
    contains: lookup_index=remote_entity_id
    only: reader
  - stop-background: { id: whole-generation }
    only: reader

  # A fresh local volume must use the target bucket even though metadata names the origin.
  - kill-spiced: {}
    only: writer
  - stop-source: src
    only: writer
  - source-exec: { control: 'python3 /tmp/${sources.control.namespace}-snapshot-mirror.py remove-origin' }
    only: reader
  - restart:
      kill: KILL
      patch:
        datasets:
          modules: { acceleration: { params: { cayenne_file_path: '${instance.dir}/modules-2', cayenne_metadata_dir: '${instance.dir}/meta-2' } } }
          configuration_addresses: { acceleration: { params: { cayenne_file_path: '${instance.dir}/addresses-2', cayenne_metadata_dir: '${instance.dir}/meta-2' } } }
    only: reader
  - query: SELECT id, remote_entity_id, v FROM configuration_addresses WHERE id IN (0, 1, 200) ORDER BY id
    expect: { rows: [['0', null, null], ['1', moved, new], ['200', moved, new]] }
    only: reader
  - query: SELECT count(*) AS n, sum(id) AS ids, count(v) AS nonnull FROM configuration_addresses
    expect: { rows: [['10001', '50005000', '10000']] }
    only: reader
  - query: SELECT sid, label FROM modules WHERE sid IN ('m1', 'm20') ORDER BY sid
    expect: { rows: [[m1, new-m1], [m20, new-m20]] }
    only: reader
  - assert-status: { dataset: modules, status: Ready, ready: true }
    only: reader
  - assert-status: { dataset: configuration_addresses, status: Ready, ready: true }
    only: reader
  - assert-log: { count: { 'Snapshot created dataset=': 0 } }
    only: reader
