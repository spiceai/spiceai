name: snapshots-reader-publication-failures
description: >
  A snapshot reader keeps serving the exact loaded rows when published
  metadata rolls back, names a missing archive, or fails checksum verification
  (#15310, #15472). Each failure has its snapshot-mode reason metric and leaves
  the old data intact. Repair followed by a new publication advances the reader.

sources:
  src: { kind: postgres }
  lake: { kind: rustfs }
  control:
    kind: docker
    image: python:3.12-alpine
    host-network: true
    command: [sleep, infinity]
    ready: 'true'

matrix:
  fault: [checksum, missing, rollback]

variants:
  writer: {}
  reader:
    spicepod:
      runtime: { state: null }
      datasets:
        - from: s3://${sources.lake.shared_bucket}/state/snapshots/
          name: t
          params:
            file_format: snapshot
            s3_endpoint: ${sources.lake.endpoint}
            s3_region: us-east-1
            s3_auth: key
            s3_key: ${sources.lake.key}
            s3_secret: ${sources.lake.secret}
            allow_http: 'true'
            client_timeout: 2s
          acceleration:
            refresh_check_interval: 1s
            indexes: { grp: enabled }
            params: { cayenne_file_path: '${instance.dir}/reader-1/data', cayenne_metadata_dir: '${instance.dir}/reader-1/meta' }

spicepod:
  version: v1
  kind: Spicepod
  name: snapshots-reader-publication-failures
  runtime:
    state:
      location: s3://${sources.lake.shared_bucket}/state/
      params:
        s3_endpoint: ${sources.lake.endpoint}
        s3_region: us-east-1
        s3_auth: key
        s3_key: ${sources.lake.key}
        s3_secret: ${sources.lake.secret}
        allow_http: 'true'
  datasets:
    - from: postgres:public.t
      name: t
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        refresh_check_interval: 1h
        snapshots: create_only
        primary_key: id
        indexes: { grp: enabled }

defaults:
  run-variants: side-by-side
  compare-variants: false

steps:
  - source-exec:
      src: |
        CREATE TABLE t (id int PRIMARY KEY, grp int, v text);
        INSERT INTO t SELECT i, i % 97, 'old' FROM generate_series(1, 10000) i;
        INSERT INTO t VALUES (0, NULL, NULL);
    only: writer
  - start: { ready: false }
    only: reader
  - assert-log: { contains: 'waiting|no snapshot' }
    eventually: 30s
    only: reader
  - start: {}
    only: writer
  - query: SELECT * FROM t
    expect: { oracle: src }
    only: writer
  - query: SELECT count(*) AS n, sum(id) AS ids, count(v) AS nonnull FROM t
    expect: { rows: [['10001', '50005000', '10000']] }
    eventually: 60s
    only: reader
  - assert-log: { contains: "loads the cayenne snapshots" }
    only: reader
  - source-exec: { src: "UPDATE t SET v = 'new', grp = 42 WHERE id > 0" }
    only: writer
  - refresh: t
    only: writer
  - query: SELECT count(*) AS n FROM t WHERE v = 'new'
    expect: { rows: [['10000']] }
    eventually: 60s
    only: reader
  - query: SELECT id, grp, v FROM t WHERE id IN (0, 1, 10000)
    expect: { rows: [['0', null, null], ['1', '42', new], ['10000', '42', new]] }
    only: reader

  - query: SELECT * FROM t
    expect: {}
    id: loaded
    only: reader

  # Freeze publication before editing the metadata of the second generation.
  - stop: {}
    only: writer
  - mark-metrics: before-fault
    only: reader
  - source-exec:
      control: { file: ../seed/snapshot-publication-fault.sh }
    only: writer
  - wait-metric:
      name: dataset_acceleration_refresh_errors
      labels: { dataset: t, mode: snapshot, reason: snapshot_download_failed }
      increased-by: 1
      since: before-fault
      # A missing file is retried for 90s to allow cross-region replication.
      timeout: 150s
    when: { fault: [checksum, missing] }
    only: reader
  - wait-metric:
      name: dataset_acceleration_refresh_errors
      labels: { dataset: t, mode: snapshot, reason: snapshot_older_than_loaded }
      increased-by: 1
      since: before-fault
      timeout: 30s
    when: { fault: rollback }
    only: reader
  - assert-log: { contains: 'checksum mismatch' }
    when: { fault: checksum }
    only: reader
  - assert-log: { contains: 'has no file at.*[.]missing' }
    when: { fault: missing }
    only: reader
  - assert-status: { dataset: t, status: Ready, ready: true }
    eventually: 10s
    only: reader
  - query: SELECT * FROM t
    expect: { same-as: loaded }
    consistently: 3s
    only: reader

  - assert-log: { contains: "cannot refresh from its snapshot location, so it keeps serving snapshot" }
    only: reader

  # Calling the fixture again restores the saved metadata. A real publication
  # after repair must advance the reader; a logged error alone is insufficient.
  - source-exec:
      control: { file: ../seed/snapshot-publication-fault.sh }
    only: writer
  - start: {}
    only: writer
  - source-exec: { src: "UPDATE t SET v = 'repaired' WHERE id > 0" }
    only: writer
  - refresh: t
    only: writer
  - query: SELECT count(*) AS n FROM t WHERE v = 'repaired'
    expect: { rows: [['10000']] }
    # A missing-file poll already in flight may finish its 90s grace period.
    eventually: 3m
    only: reader
  - query: SELECT id, grp, v FROM t WHERE id IN (0, 1, 10000)
    expect: { rows: [['0', null, null], ['1', '42', repaired], ['10000', '42', repaired]] }
    only: reader
