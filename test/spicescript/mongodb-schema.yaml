name: mongodb-schema
description: >
  MongoDB collections whose schema is not known at startup, federated and
  through change streams into Cayenne: a collection that does not exist yet
  registers once it is created, an empty one fills once documents arrive,
  declared columns register at once (missing, empty or populated) and type
  later documents, nested fields fold into a json_object column, and a field that
  appears later becomes a column after a restart (sync_all_columns), filled
  by the next refresh.

sources:
  mongo:
    kind: docker
    image: docker.io/library/mongo:8.0
    ports: [27017]
    command: [mongod, --replSet, rs0, --bind_ip_all]
    # Initiates the replica set on the first probe; ready once it is primary.
    ready: >-
      mongosh --quiet --eval "try { rs.status().myState } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); 0 }" | grep -qx 1

spicepod:
  version: v1
  kind: Spicepod
  name: mongodb-schema
  datasets:
    - from: mongodb:missing
      name: missing
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
    - from: mongodb:empty
      name: empty
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id }
    - from: mongodb:dm
      name: declared_missing
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
    - from: mongodb:nested
      name: nested
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id }
        - { name: name }
        - { name: data, metadata: { json_object: '*' } }
    - from: mongodb:widen
      name: widen
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      on_schema_change: sync_all_columns
      acceleration: { enabled: true, engine: cayenne, mode: file }
    - from: mongodb:missing2
      name: missing_cdc
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id }
    - from: mongodb:empty2
      name: empty_fed
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
    - from: mongodb:de
      name: declared_empty
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
    - from: mongodb:dec
      name: declared_empty_cdc
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id }
    - from: mongodb:dd
      name: declared_docs
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
    - from: mongodb:ddc
      name: declared_docs_cdc
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id }
    - from: mongodb:dmc
      name: declared_missing_cdc
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms
      columns:
        - { name: _id, type: int32 }
        - { name: name, type: text }
        - { name: version, type: bigint }
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id }

steps:
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          db.createCollection('empty');
          db.createCollection('empty2');
          db.createCollection('de');
          db.createCollection('dec');
          for (const c of ['dd', 'ddc']) {
            db[c].insertMany([0, 1, 2].map(i => ({ _id: NumberInt(i), name: 'Item ' + i, version: NumberLong(i) })));
          }
          db.nested.insertMany([{ _id: 1, name: 'Alice', email: 'a@x', address: { city: 'NYC', zip: '10001' } }, { _id: 2, name: 'Bob', tags: ['x', 'y'] }]);
          db.widen.insertMany([{ _id: 1, name: 'one' }, { _id: 2, name: 'two' }]);"
  - start: { ready: false }

  # Declared columns register at once, before the collection exists.
  - query: SELECT count(*) AS n FROM declared_missing
    expect: { rows: [['0']] }
    eventually: 30s
  - query: SELECT count(*) AS n FROM declared_empty
    expect: { rows: [['0']] }
    eventually: 30s
  - query: SELECT count(*) AS n FROM declared_empty_cdc
    expect: { rows: [['0']] }
    eventually: 30s
  - query: SELECT count(*) AS n FROM declared_missing_cdc
    expect: { rows: [['0']] }
    eventually: 30s
  - query: SELECT _id, name, version FROM declared_docs
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 30s
  - query: SELECT _id, name, version FROM declared_docs_cdc
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 30s
  - query: SELECT name, data FROM nested
    expect: { rows: [[Alice, '{"address":{"city":"NYC","zip":"10001"},"email":"a@x"}'], [Bob, '{"tags":["x","y"]}']] }
    eventually: 30s
  - query: SELECT _id, name FROM widen
    expect: { rows: [['1', one], ['2', two]] }
    eventually: 30s

  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          for (const c of ['missing', 'empty', 'dm', 'missing2', 'empty2', 'de', 'dmc', 'dec']) {
            db[c].insertMany([0, 1, 2].map(i => ({ _id: NumberInt(i), name: 'Item ' + i, version: NumberLong(i) })));
          }
          db.widen.insertOne({ _id: 3, name: 'three', country: 'NZ' });
          db.ddc.insertOne({ _id: NumberInt(3), name: 'Item 3', version: NumberLong(3) });"
  - query: SELECT _id, name, version FROM missing
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM empty
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM declared_missing
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s

  - query: SELECT _id, name, version FROM missing_cdc
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM empty_fed
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM declared_empty
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM declared_missing_cdc
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM declared_empty_cdc
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2']] }
    eventually: 60s
  - query: SELECT _id, name, version FROM declared_docs_cdc
    expect: { rows: [['0', Item 0, '0'], ['1', Item 1, '1'], ['2', Item 2, '2'], ['3', Item 3, '3']] }
    eventually: 60s

  # A new field becomes a column at the next start, over the rows already
  # held, and a refresh brings in the document that carries it.
  - restart: {}
  - query: SELECT _id, name, country FROM widen
    expect: { rows: [['1', one, null], ['2', two, null]] }
    eventually: 60s
  - refresh: widen
  - query: SELECT _id, name, country FROM widen
    expect: { rows: [['1', one, null], ['2', two, null], ['3', three, NZ]] }
