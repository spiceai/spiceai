name: duckdb-types-acceleration
description: >
  A DuckDB table with a column of each Arrow type a `duckdb:` dataset reads
  (boolean, the signed integers, both floats, date, timestamps at millisecond
  and microsecond precision, time, string, binary, decimals up to 38 digits,
  and lists of integers and strings), holding each type's limits, its zero or
  empty value, and NULL, answers through Spice as the DuckDB CLI answers it:
  federated, and accelerated into every engine. Every answer comes back the
  same over Flight, Flight SQL and HTTP JSON. (Intervals, Turso's timestamps
  before 1970 and SQLite's decimals are in
  known-failing/duckdb/duckdb-types-known.yaml.)

sources:
  src: { kind: duckdb }

variants:
  federated: {}
  arrow: arrow-memory
  duckdb: duckdb-file
  duckdb-memory: duckdb-memory
  sqlite: sqlite-file
  cayenne: cayenne-file
  cayenne-memory: cayenne-memory

spicepod:
  version: v1
  kind: Spicepod
  name: duckdb-types-acceleration
  datasets:
    - from: duckdb:main.t
      name: t
      params: ${sources.src.params}
      acceleration:
        enabled: false

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }

steps:
  # Row 1 holds each type's largest value, row 2 its smallest, row 3 its zero
  # or empty value, and row 4 NULL.
  - source-exec:
      src: |
        CREATE TABLE t (
          id INTEGER,
          t_boolean BOOLEAN,
          t_int8 TINYINT, t_int16 SMALLINT, t_int32 INTEGER, t_int64 BIGINT,
          t_float32 FLOAT, t_float64 DOUBLE,
          t_date DATE, t_timestamp_ms TIMESTAMP_MS, t_timestamp TIMESTAMP, t_time TIME,
          t_string VARCHAR, t_binary BLOB,
          t_decimal_10_2 DECIMAL(10, 2), t_decimal_20_4 DECIMAL(20, 4), t_decimal_38_10 DECIMAL(38, 10),
          t_list_int INTEGER[], t_list_string VARCHAR[]
        );
        INSERT INTO t VALUES
          (1, true, 127, 32767, 2147483647, 9223372036854775807, 3.4028235e38, 1.7976931348623157e308,
           DATE '2024-01-15', TIMESTAMP_MS '2024-01-15 21:00:33.999', TIMESTAMP '2262-04-11 23:47:16.854775',
           TIME '23:59:59.999999', 'hello', '\xAB\xCD'::BLOB,
           99999999.99, 9999999999999999.9999, 9999999999999999999999999999.9999999999,
           [1, 2, 3], ['abc', 'def']),
          (2, false, -128, -32768, -2147483648, -9223372036854775808, -3.4028235e38, -1.7976931348623157e308,
           DATE '1900-01-01', TIMESTAMP_MS '1900-01-01 00:00:00.001', TIMESTAMP '1677-09-22 00:00:00',
           TIME '00:00:00', '日本語 naïve 😀', '\x00\xFF'::BLOB,
           -99999999.99, -9999999999999999.9999, -9999999999999999999999999999.9999999999,
           [-1, NULL], [NULL, '']),
          (3, false, 0, 0, 0, 0, 0.0, 0.0,
           DATE '1970-01-01', TIMESTAMP_MS '1970-01-01 00:00:00', TIMESTAMP '1970-01-01 00:00:00',
           TIME '12:00:00', '', ''::BLOB,
           0.00, 0.0000, 0.0000000000,
           [], []),
          (4, NULL, NULL, NULL, NULL, NULL, NULL, NULL,
           NULL, NULL, NULL, NULL, NULL, NULL,
           NULL, NULL, NULL,
           NULL, NULL);

  # Each type's answer from the DuckDB CLI, before Spice opens the file.
  - source-query:
      src: SELECT id, t_boolean FROM t ORDER BY id
    expect: { rows: &boolean [[1, 'true'], [2, 'false'], [3, 'false'], [4, null]] }
  - source-query:
      src: SELECT id, t_int8, t_int16, t_int32, t_int64 FROM t ORDER BY id
    expect:
      rows: &ints
        - [1, 127, 32767, 2147483647, 9223372036854775807]
        - [2, -128, -32768, -2147483648, -9223372036854775808]
        - [3, 0, 0, 0, 0]
        - [4, null, null, null, null]
  - source-query:
      src: SELECT id, t_float32, t_float64 FROM t ORDER BY id
    expect:
      rows: &floats
        - [1, '3.4028235e+38', '1.7976931348623157e+308']
        - [2, '-3.4028235e+38', '-1.7976931348623157e+308']
        - [3, '0.0', '0.0']
        - [4, null, null]
  - source-query:
      src: SELECT id, t_date, t_timestamp_ms, t_timestamp, t_time FROM t ORDER BY id
    expect:
      rows: &times
        - [1, '2024-01-15', '2024-01-15 21:00:33.999', '2262-04-11 23:47:16.854775', '23:59:59.999999']
        - [2, '1900-01-01', '1900-01-01 00:00:00.001', '1677-09-22 00:00:00', '00:00:00']
        - [3, '1970-01-01', '1970-01-01 00:00:00', '1970-01-01 00:00:00', '12:00:00']
        - [4, null, null, null, null]
  - source-query:
      src: SELECT id, t_string, t_binary FROM t ORDER BY id
    expect:
      rows:
        - [1, hello, '\xAB\xCD']
        - [2, 日本語 naïve 😀, '\x00\xFF']
        - [3, '', '']
        - [4, null, null]
  - source-query:
      src: SELECT id, t_decimal_10_2, t_decimal_20_4, t_decimal_38_10 FROM t ORDER BY id
    expect:
      rows: &decimals
        - [1, '99999999.99', '9999999999999999.9999', '9999999999999999999999999999.9999999999']
        - [2, '-99999999.99', '-9999999999999999.9999', '-9999999999999999999999999999.9999999999']
        - [3, '0.00', '0.0000', '0.0000000000']
        - [4, null, null, null]
  - source-query:
      src: SELECT id, t_list_int, t_list_string FROM t ORDER BY id
    expect:
      rows:
        - [1, '[1, 2, 3]', '[abc, def]']
        - [2, '[-1, NULL]', "[NULL, '']"]
        - [3, '[]', '[]']
        - [4, null, null]

  - start: {}

  - query: SELECT id, t_boolean FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect: { rows: *boolean }
  - query: SELECT id, t_int8, t_int16, t_int32, t_int64 FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect: { rows: *ints }
  - query: SELECT id, t_float32, t_float64 FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect: { rows: *floats }
  - query: SELECT id, t_date, t_timestamp_ms, t_timestamp, t_time FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect: { rows: *times }
  # The same bytes, written as one hex string after `\x`.
  - query: SELECT id, t_string, t_binary FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect:
      rows:
        - [1, hello, '\xabcd']
        - [2, 日本語 naïve 😀, '\x00ff']
        - [3, '', '\x']
        - [4, null, null]
  # SQLite keeps a decimal as a double, which cannot hold these (#14662;
  # known-failing/duckdb/duckdb-types-known.yaml).
  - query: SELECT id, t_decimal_10_2, t_decimal_20_4, t_decimal_38_10 FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect: { rows: *decimals }
    except: sqlite
  # The same lists; an empty string is an empty element.
  - query: SELECT id, t_list_int, t_list_string FROM t ORDER BY id
    protocols: [flight, flightsql, http]
    expect:
      rows:
        - [1, '[1, 2, 3]', '[abc, def]']
        - [2, '[-1, NULL]', '[NULL, ]']
        - [3, '[]', '[]']
        - [4, null, null]
