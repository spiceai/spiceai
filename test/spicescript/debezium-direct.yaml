name: debezium-direct
description: >
  Debezium Server reading PostgreSQL posts its change events straight to
  Spice (`from: cdc:`, `POST /v1/datasets/{name}/cdc`, no Kafka): the initial
  snapshot, inserts, updates (including the key's row moving between values)
  and deletes are applied once each, and the acceleration answers as
  PostgreSQL does, in Cayenne and in Arrow, and in Cayenne after spiced
  restarts.

sources:
  src: { kind: postgres }
  # One Debezium Server per instance, started inside this container once the
  # instance's spiced is listening: each has its own slot, publication and
  # offsets, and posts to its own spiced.
  dbz:
    kind: docker
    # 3.2 and 3.3 resend the HTTP sink's context headers with every event,
    # so after about 30 events a request carries more headers than servers
    # accept (431 Request Header Fields Too Large) and the engine stops.
    image: quay.io/debezium/server:3.1
    host-network: true
    command: [sleep, infinity]
    ready: 'true'

variants:
  cayenne: { datasets: { '*': { acceleration: { engine: cayenne, mode: file } } } }
  arrow: { datasets: { '*': { acceleration: { engine: arrow, mode: memory, on_conflict: { id: upsert } } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: debezium-direct
  datasets:
    - from: cdc:t
      name: t
      columns:
        - { name: id, type: bigint }
        - { name: v, type: text }
        - { name: n, type: bigint }
      acceleration: { enabled: true, refresh_mode: changes, primary_key: id }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE t (id bigint PRIMARY KEY, v text, n bigint);
        ALTER TABLE t REPLICA IDENTITY FULL;
        INSERT INTO t SELECT g, 'v' || g, g * 10 FROM generate_series(1, 500) g;
  - start: {}
  - source-exec:
      dbz: &debezium >-
        mkdir -p /tmp/${sources.src.namespace};
        cd /debezium;
        DEBEZIUM_SINK_TYPE=http
        DEBEZIUM_SINK_HTTP_URL=http://${sources.dbz.host_from_container}:${instance.http_port}/v1/datasets/t/cdc
        DEBEZIUM_SOURCE_CONNECTOR_CLASS=io.debezium.connector.postgresql.PostgresConnector
        DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME=/tmp/${sources.src.namespace}/offsets.dat
        DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS=0
        DEBEZIUM_SOURCE_DATABASE_HOSTNAME=${sources.dbz.host_from_container}
        DEBEZIUM_SOURCE_DATABASE_PORT=${sources.src.params.pg_port}
        DEBEZIUM_SOURCE_DATABASE_USER=${sources.src.params.pg_user}
        DEBEZIUM_SOURCE_DATABASE_PASSWORD=${sources.src.params.pg_pass}
        DEBEZIUM_SOURCE_DATABASE_DBNAME=${sources.src.params.pg_db}
        DEBEZIUM_SOURCE_TOPIC_PREFIX=${sources.src.namespace}
        DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST=public.t
        DEBEZIUM_SOURCE_PLUGIN_NAME=pgoutput
        DEBEZIUM_SOURCE_SLOT_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_SOURCE_PUBLICATION_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_FORMAT_VALUE=json
        DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE=false
        DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE=false
        QUARKUS_HTTP_PORT=${instance.port}
        QUARKUS_LOG_FILE_ENABLE=false
        nohup /debezium/run.sh > /proc/1/fd/1 2>&1 < /dev/null &
  # The snapshot, read and posted by Debezium.
  - query: SELECT * FROM t
    eventually: 120s

  - source-exec:
      src: |
        INSERT INTO t SELECT g, 'later ' || g, g FROM generate_series(501, 600) g;
        UPDATE t SET v = 'updated', n = n + 1 WHERE id % 7 = 0;
        DELETE FROM t WHERE id % 13 = 0;
        BEGIN;
        UPDATE t SET n = -n WHERE id BETWEEN 100 AND 110;
        DELETE FROM t WHERE id BETWEEN 200 AND 205;
        INSERT INTO t VALUES (1000, 'in a transaction', 1);
        COMMIT;
  - query: SELECT * FROM t
    eventually: 60s
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM t
    expect: { rows: [['0']] }

  # spiced restarts; Debezium keeps posting, retrying while it is down. Only
  # a durable acceleration survives this: a push source cannot be re-read, so
  # an in-memory one restarts empty and holds only what arrives afterwards.
  - restart: {}
    only: cayenne
  - source-exec:
      src: |
        UPDATE t SET v = 'after restart' WHERE id <= 20;
        DELETE FROM t WHERE id > 590;
    only: cayenne
  - query: SELECT * FROM t
    eventually: 60s
    only: cayenne
