name: debezium-direct
duration: 55s
tags: [long]
description: >
  Debezium Server reading PostgreSQL posts its change events straight to
  Spice (`from: cdc:`, `POST /v1/datasets/{name}/cdc`, no Kafka): the initial
  snapshot, inserts, updates (including the key's row moving between values)
  and deletes are applied once each, and the acceleration answers as
  PostgreSQL does, in Cayenne in file and memory mode, and in file mode
  after spiced restarts.

sources:
  src: { kind: postgres }
  # One Debezium Server per instance, started inside this container once the
  # instance's spiced is listening: each has its own slot, publication and
  # offsets, and posts to its own spiced.
  dbz:
    kind: docker
    # 3.2 and 3.3 resend the HTTP sink's context headers with every event,
    # so after about 30 events a request carries more headers than servers
    # accept (431 Request Header Fields Too Large) and the engine stops.
    image: quay.io/debezium/server:3.1
    host-network: true
    # Debezium Server 3.1's HTTP sink cannot send an API key Spice accepts (a header set
    # with the `InsertHeader` transform arrives JSON-encoded, and its JWT option sends
    # `Bearer: <token>`), so each instance's Debezium posts through a relay beside it
    # that adds the instance's key, as a sidecar proxy adding a credential would. `spiced`
    # checks the key when spicescript serves it beyond loopback (`${instance.api_key}`).
    command:
      - sh
      - -c
      - |
        cat > /tmp/ApiKeyRelay.java <<'EOF'
        // Forwards each POST to the upstream at args[1] with `X-API-Key: args[2]` added, and writes
        // the loopback port it listens on to the file args[0]. A request the upstream does not answer
        // (it is down) is dropped, so the sender sees the connection fail, as it would posting there.
        import com.sun.net.httpserver.HttpServer;
        import java.net.InetSocketAddress;
        import java.net.URI;
        import java.net.http.HttpClient;
        import java.net.http.HttpRequest;
        import java.net.http.HttpResponse;
        import java.nio.file.Files;
        import java.nio.file.Path;
        import java.nio.file.StandardCopyOption;

        public class ApiKeyRelay {
            public static void main(String[] args) throws Exception {
                var client = HttpClient.newHttpClient();
                var server = HttpServer.create(new InetSocketAddress("127.0.0.1", 0), 0);
                server.createContext("/", exchange -> {
                    try (exchange) {
                        var request = HttpRequest.newBuilder(URI.create(args[1] + exchange.getRequestURI()))
                            .header("Content-Type", exchange.getRequestHeaders().getFirst("Content-Type"))
                            .header("X-API-Key", args[2])
                            .POST(HttpRequest.BodyPublishers.ofByteArray(exchange.getRequestBody().readAllBytes()))
                            .build();
                        var answer = client.send(request, HttpResponse.BodyHandlers.ofByteArray());
                        var body = answer.body();
                        exchange.sendResponseHeaders(answer.statusCode(), body.length == 0 ? -1 : body.length);
                        if (body.length > 0) {
                            exchange.getResponseBody().write(body);
                        }
                    } catch (InterruptedException e) {
                        Thread.currentThread().interrupt();
                    }
                });
                server.start();
                var partial = Path.of(args[0] + ".partial");
                Files.writeString(partial, String.valueOf(server.getAddress().getPort()));
                Files.move(partial, Path.of(args[0]), StandardCopyOption.ATOMIC_MOVE);
            }
        }
        EOF
        exec sleep infinity
    ready: test -s /tmp/ApiKeyRelay.java

variants:
  cayenne: { datasets: { '*': { acceleration: { engine: cayenne, mode: file } } } }
  # `cayenne` with the prototype object-native Cayenne metastore.
  cayenne-object-native: { datasets: { '*': { acceleration: { engine: cayenne, mode: file } } }, spicepod: { runtime: { params: { cayenne_vnext: enabled } } } }
  cayenne-memory: { datasets: { '*': { acceleration: { engine: cayenne, mode: memory } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: debezium-direct
  datasets:
    - from: cdc:t
      name: t
      columns:
        - { name: id, type: bigint }
        - { name: v, type: text }
        - { name: n, type: bigint }
      acceleration: { enabled: true, refresh_mode: changes, primary_key: id }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE t (id bigint PRIMARY KEY, v text, n bigint);
        ALTER TABLE t REPLICA IDENTITY FULL;
        INSERT INTO t SELECT g, 'v' || g, g * 10 FROM generate_series(1, 500) g;
  - start: {}
  - source-exec:
      dbz: &debezium >-
        mkdir -p /tmp/${sources.src.namespace};
        cd /debezium;
        kill -0 "$(cat /tmp/${sources.src.namespace}/relay.pid 2>/dev/null)" 2>/dev/null || {
        rm -f /tmp/${sources.src.namespace}/relay.port;
        nohup java /tmp/ApiKeyRelay.java /tmp/${sources.src.namespace}/relay.port
        http://${instance.host_from_container}:${instance.http_port} ${instance.api_key}
        > /tmp/${sources.src.namespace}/relay.log 2>&1 < /dev/null &
        echo $! > /tmp/${sources.src.namespace}/relay.pid;
        for _ in $(seq 600); do [ -s /tmp/${sources.src.namespace}/relay.port ] && break; sleep 0.1; done; };
        DEBEZIUM_SINK_TYPE=http
        DEBEZIUM_SINK_HTTP_URL=http://127.0.0.1:$(cat /tmp/${sources.src.namespace}/relay.port)/v1/datasets/t/cdc
        DEBEZIUM_SOURCE_CONNECTOR_CLASS=io.debezium.connector.postgresql.PostgresConnector
        DEBEZIUM_SOURCE_OFFSET_STORAGE_FILE_FILENAME=/tmp/${sources.src.namespace}/offsets.dat
        DEBEZIUM_SOURCE_OFFSET_FLUSH_INTERVAL_MS=0
        DEBEZIUM_SOURCE_DATABASE_HOSTNAME=${sources.dbz.host_from_container}
        DEBEZIUM_SOURCE_DATABASE_PORT=${sources.src.params.pg_port}
        DEBEZIUM_SOURCE_DATABASE_USER=${sources.src.params.pg_user}
        DEBEZIUM_SOURCE_DATABASE_PASSWORD=${sources.src.params.pg_pass}
        DEBEZIUM_SOURCE_DATABASE_DBNAME=${sources.src.params.pg_db}
        DEBEZIUM_SOURCE_TOPIC_PREFIX=${sources.src.namespace}
        DEBEZIUM_SOURCE_TABLE_INCLUDE_LIST=public.t
        DEBEZIUM_SOURCE_PLUGIN_NAME=pgoutput
        DEBEZIUM_SOURCE_SLOT_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_SOURCE_PUBLICATION_NAME=dbz_${sources.src.namespace}
        DEBEZIUM_FORMAT_VALUE=json
        DEBEZIUM_FORMAT_VALUE_SCHEMAS_ENABLE=false
        DEBEZIUM_FORMAT_KEY_SCHEMAS_ENABLE=false
        QUARKUS_HTTP_PORT=${instance.port}
        QUARKUS_LOG_FILE_ENABLE=false
        nohup /debezium/run.sh > /proc/1/fd/1 2>&1 < /dev/null &
  # The snapshot, read and posted by Debezium.
  - query: SELECT * FROM t
    eventually: 120s

  - source-exec:
      src: |
        INSERT INTO t SELECT g, 'later ' || g, g FROM generate_series(501, 600) g;
        UPDATE t SET v = 'updated', n = n + 1 WHERE id % 7 = 0;
        DELETE FROM t WHERE id % 13 = 0;
        BEGIN;
        UPDATE t SET n = -n WHERE id BETWEEN 100 AND 110;
        DELETE FROM t WHERE id BETWEEN 200 AND 205;
        INSERT INTO t VALUES (1000, 'in a transaction', 1);
        COMMIT;
  - query: SELECT * FROM t
    eventually: 60s
  - query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM t
    expect: { rows: [['0']] }

  # spiced restarts; Debezium keeps posting, retrying while it is down. Only
  # a durable acceleration survives this: a push source cannot be re-read, so
  # an in-memory one restarts empty and holds only what arrives afterwards.
  - restart: {}
    only: [cayenne, cayenne-object-native]
  - source-exec:
      src: |
        UPDATE t SET v = 'after restart' WHERE id <= 20;
        DELETE FROM t WHERE id > 590;
    only: [cayenne, cayenne-object-native]
  - query: SELECT * FROM t
    eventually: 60s
    only: [cayenne, cayenne-object-native]
