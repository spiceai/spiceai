name: unparse-pruned-aggregate
description: >
  Aggregates keep their rows when an outer query reads none of their output
  columns: one row for a global aggregate, including over empty input, and one
  per group for GROUP BY. Federated PostgreSQL and MySQL and DuckDB and Cayenne
  accelerations agree with PostgreSQL, including for nested and empty inputs.

sources:
  pg: { kind: postgres }
  my: { kind: mysql }

variants:
  postgres: {}
  mysql: { datasets: { e: { from: 'mysql:e', params: '${sources.my.params}' } } }
  duckdb: { datasets: { e: { acceleration: { enabled: true, engine: duckdb, mode: file } } } }
  cayenne: { datasets: { e: { acceleration: { enabled: true, engine: cayenne, mode: file } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: unparse-pruned-aggregate
  datasets:
    - from: postgres:public.e
      name: e
      params: ${sources.pg.params}

defaults:
  expect: { oracle: pg }
  compare-variants: false

steps:
  - source-exec:
      pg: CREATE TABLE e (id int PRIMARY KEY, v int); INSERT INTO e SELECT i, i % 3 FROM generate_series(1, 11) i;
  - source-exec:
      my: CREATE TABLE e (id int PRIMARY KEY, v int); INSERT INTO e VALUES (1,1),(2,2),(3,0),(4,1),(5,2),(6,0),(7,1),(8,2),(9,0),(10,1),(11,2);
  - start: {}
  # Control: an aggregate whose output is read.
  - query: SELECT count(*) AS n, max(m) AS top FROM (SELECT max(id) AS m FROM e) x
  - query: SELECT count(*) AS n FROM (SELECT max(id) AS m FROM e) x
  - query: SELECT count(*) AS n FROM (SELECT max(id) AS m FROM e WHERE v = 99) x
  - query: SELECT count(*) AS n FROM (SELECT v, max(id) AS m FROM e GROUP BY v) x
  - query: SELECT 42 AS k FROM (SELECT sum(v) AS s FROM e) x
  - query: SELECT count(*) AS n FROM (SELECT v FROM e GROUP BY v) x
  - query: SELECT 42 AS k FROM (SELECT max(id) AS m FROM e WHERE v = 99) x
  - query: SELECT count(*) AS n FROM (SELECT v FROM e WHERE v = 99 GROUP BY v) x
  - query: SELECT count(*) AS n FROM (SELECT max(id) AS m FROM (SELECT id FROM e LIMIT 0) q) x
  - query: SELECT 42 AS k FROM (SELECT max(id) AS m FROM (SELECT max(id) AS id FROM e) q WHERE id < 0) x
  - query: SELECT count(*) AS n FROM (SELECT max(id) AS m FROM e WHERE v = 99 HAVING count(*) > 0) x
  - query: SELECT count(*) AS n FROM (SELECT max(id) AS m FROM e WHERE v = 99 HAVING count(*) = 0) x
  - query: SELECT 42 AS k FROM (SELECT max(id) AS m FROM e WHERE v = 99 HAVING TRUE) x
  - query: SELECT count(*) AS n FROM (SELECT v, max(id) AS m FROM e GROUP BY v HAVING count(*) > 3) x
  - query: SELECT 42 AS k FROM (SELECT max(id) AS m FROM e WHERE v = 99) x QUALIFY row_number() OVER () = 1
    oracle-sql: SELECT 42 AS k FROM (SELECT row_number() OVER () AS rn FROM (SELECT max(id) AS m FROM e WHERE v = 99) x) q WHERE rn = 1
  - query: SELECT count(*) AS n FROM (SELECT 42 AS k FROM e GROUP BY v QUALIFY row_number() OVER (ORDER BY v) = 1) x
    oracle-sql: SELECT count(*) AS n FROM (SELECT v FROM e GROUP BY v ORDER BY v LIMIT 1) x
