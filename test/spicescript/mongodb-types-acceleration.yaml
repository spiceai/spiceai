name: mongodb-types-acceleration
description: >
  A MongoDB collection with the common BSON types (ObjectId, Date, Decimal128,
  Int32, Int64, Double, Bool, string, an array, an explicit null and a missing
  field) answers through Spice as the same values do in PostgreSQL: federated,
  and accelerated into Cayenne by full refresh and by change streams, before
  and after documents are added and changed.

sources:
  mongo:
    kind: docker
    image: docker.io/library/mongo:8.0
    ports: [27017]
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ready: >-
      mongosh --quiet --eval "try { rs.status(); db.hello().isWritablePrimary ? 1 : 0 } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}); 0 }" | grep -qx 1
  ref: { kind: postgres }

variants:
  federated: {}
  cayenne: { datasets: { t: { acceleration: { enabled: true, engine: cayenne, mode: file } } } }
  cayenne-changes:
    datasets: { t: { acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: changes, primary_key: _id } } }

spicepod:
  version: v1
  kind: Spicepod
  name: mongodb-types-acceleration
  datasets:
    - from: mongodb:t
      name: t
      params:
        mongodb_connection_string: 'mongodb://localhost:${sources.mongo.port.27017}/${sources.mongo.namespace}?directConnection=true&replicaSet=rs0&tls=false'
        change_stream_batch_max_duration: 100ms
        change_stream_max_await_time: 100ms

defaults:
  expect: { oracle: ref }
  compare-variants: false

steps:
  # Every document has every field, so the inferred schema covers them all;
  # document 4 holds a null in each.
  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          db.t.insertMany([
            { _id: NumberLong(1), oid: ObjectId('000000000000000000000001'), at: ISODate('1970-01-01T00:00:00.000Z'), dec: NumberDecimal('-12345.6789'), i32: NumberInt(-2147483648), i64: NumberLong('-9223372036854775808'), dbl: -1.5, flag: false, s: '' },
            { _id: NumberLong(2), oid: ObjectId('ffffffffffffffffffffffff'), at: ISODate('2038-01-19T03:14:08.123Z'), dec: NumberDecimal('99999.9999'), i32: NumberInt(2147483647), i64: NumberLong('9223372036854775807'), dbl: 1e300, flag: true, s: '日本語' },
            { _id: NumberLong(3), oid: ObjectId('65a1b2c3d4e5f60718293a4b'), at: ISODate('2000-02-29T12:00:00.001Z'), dec: NumberDecimal('0.0001'), i32: NumberInt(0), i64: NumberLong(0), dbl: 0.1, flag: true, s: 'a\"b' },
            { _id: NumberLong(4), oid: null, at: null, dec: null, i32: null, i64: null, dbl: null, flag: null, s: null }
          ]);"
  - source-exec:
      ref: >-
        CREATE TABLE t (_id bigint PRIMARY KEY, oid text, at timestamp, dec numeric(9, 4), i32 int, i64 bigint, dbl double precision, flag boolean, s text);
        INSERT INTO t VALUES
          (1, '000000000000000000000001', '1970-01-01 00:00:00', -12345.6789, -2147483648, -9223372036854775808, -1.5, false, ''),
          (2, 'ffffffffffffffffffffffff', '2038-01-19 03:14:08.123', 99999.9999, 2147483647, 9223372036854775807, 1e300, true, '日本語'),
          (3, '65a1b2c3d4e5f60718293a4b', '2000-02-29 12:00:00.001', 0.0001, 0, 0, 0.1, true, 'a"b'),
          (4, NULL, NULL, NULL, NULL, NULL, NULL, NULL, NULL);
  - start: {}
  - query: SELECT _id, i32, i64, dbl, flag, s FROM t ORDER BY _id
    eventually: 60s
  - query: SELECT _id, oid FROM t ORDER BY _id
  - query: SELECT _id, at FROM t ORDER BY _id
  - query: SELECT _id, dec FROM t ORDER BY _id
  - query: SELECT count(*) AS n, count(dec) AS d, sum(i32) AS s FROM t
  - query: SELECT _id FROM t WHERE flag AND dbl > 0 ORDER BY _id
  - query: SELECT _id FROM t WHERE at >= TIMESTAMP '2000-01-01 00:00:00' ORDER BY _id

  - source-exec:
      mongo: >-
        mongosh --quiet ${sources.mongo.namespace} --eval "
          db.t.insertOne({ _id: NumberLong(5), oid: ObjectId('000000000000000000000005'), at: ISODate('2024-06-01T00:00:00.000Z'), dec: NumberDecimal('1.5'), i32: NumberInt(5), i64: NumberLong(5), dbl: 5.5, flag: false, s: 'late' });
          db.t.updateOne({ _id: NumberLong(4) }, { \$set: { i32: NumberInt(4), s: 'was null' } });"
  - source-exec:
      ref: >-
        INSERT INTO t VALUES (5, '000000000000000000000005', '2024-06-01 00:00:00', 1.5, 5, 5, 5.5, false, 'late');
        UPDATE t SET i32 = 4, s = 'was null' WHERE _id = 4;
  - refresh: t
    only: cayenne
  - query: SELECT _id, oid, at, dec, i32, i64, dbl, flag, s FROM t ORDER BY _id
    eventually: 60s
