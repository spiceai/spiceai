name: mysql-cdc-shared-binlog
description: >
  Datasets on one MySQL connection share one binlog reader and each follows its
  own table, including a transaction spanning tables; across a clean restart
  they resume with the changes made while Spice was down, even when the source
  table's statistics changed meanwhile, and after concurrent writes to their
  tables each resumes from a saved GTID set without a gap for each other
  table's transaction. When the binlog they
  would resume from has been purged, they fail with a message naming the fix
  by default, and with `invalid_checkpoint_behavior: restart` rebuild from the
  source and serve its rows, deletions included.

sources:
  src: { kind: mysql }

matrix:
  engine: [cayenne]

variants:
  fail-loud: {}
  restart:
    datasets: { '*': { params: { mysql_replication_invalid_checkpoint_behavior: restart } } }

spicepod:
  version: v1
  kind: Spicepod
  name: mysql-cdc-shared-binlog
  datasets:
    - from: mysql:ta
      name: a
      params: { $merge: '${sources.src.params}' }
      acceleration: { enabled: true, engine: '${matrix.engine}', mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: mysql:tb
      name: b
      params: { $merge: '${sources.src.params}' }
      acceleration: { enabled: true, engine: '${matrix.engine}', mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }
    - from: mysql:tc
      name: c
      params: { $merge: '${sources.src.params}' }
      acceleration: { enabled: true, engine: '${matrix.engine}', mode: file, refresh_mode: changes, primary_key: id, on_conflict: { id: upsert } }

defaults:
  expect: { oracle: src }
  compare-variants: false
  # The variants share the MySQL server, and one variant's purge removes the
  # binlog the other resumes from: run them a step at a time, so both have
  # resumed before either purges.
  run-variants: side-by-side

steps:
  - source-exec:
      src: |
        CREATE TABLE ta (id int PRIMARY KEY, v varchar(64));
        CREATE TABLE tb (id int PRIMARY KEY, v varchar(64), n decimal(10, 2));
        CREATE TABLE tc (id int PRIMARY KEY, v varchar(64));
        INSERT INTO ta WITH RECURSIVE s(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM s WHERE i < 200) SELECT i, CONCAT('a', i) FROM s;
        INSERT INTO tb WITH RECURSIVE s(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM s WHERE i < 200) SELECT i, CONCAT('b', i), i * 1.5 FROM s;
        INSERT INTO tc WITH RECURSIVE s(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM s WHERE i < 200) SELECT i, CONCAT('c', i) FROM s;
  - start: {}
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 60s
  - query: SELECT * FROM c
    oracle-sql: SELECT * FROM tc
    eventually: 60s

  - source-exec:
      src: |
        START TRANSACTION;
        UPDATE ta SET v = 'a-upd' WHERE id % 10 = 0;
        DELETE FROM tb WHERE id > 190;
        INSERT INTO tc VALUES (201, 'c-new');
        COMMIT;
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 30s
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 30s
  - query: SELECT * FROM c
    oracle-sql: SELECT * FROM tc
    eventually: 30s

  # Both tables written concurrently in many small transactions, so each
  # dataset keeps receiving the other's transactions while its own are still
  # being applied. Its saved GTID set must still hold the other's, or it gains
  # a range per transaction that passed while it was busy (checked after the
  # restart below).
  - background: { id: wa, concurrency: 4, source-exec: { src: "INSERT INTO ta VALUES (10000 + ${round}, 'busy')" } }
  - background: { id: wb, concurrency: 4, source-exec: { src: "INSERT INTO tb VALUES (10000 + ${round}, 'busy', 1)" } }
  # The writers go at the source's pace: on a loaded runner a MySQL INSERT
  # has taken over a second, and four writers then need about two minutes
  # for 1000 rows. Wait for the source to hold them first, so the 120s below
  # bounds only how far each dataset lags its table, not how fast the
  # source accepts writes.
  - source-query: { src: "SELECT count(*) >= 1000 FROM ta WHERE id > 10000" }
    expect: { rows: [['1']] }
    eventually: 300s
  - source-query: { src: "SELECT count(*) >= 1000 FROM tb WHERE id > 10000" }
    expect: { rows: [['1']] }
    eventually: 300s
  - query: SELECT count(*) >= 1000 AS written FROM a WHERE id > 10000
    expect: { rows: [['true']] }
    eventually: 120s
  - query: SELECT count(*) >= 1000 AS written FROM b WHERE id > 10000
    expect: { rows: [['true']] }
    eventually: 120s
  - stop-background: { id: wa }
  - stop-background: { id: wb }
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 60s

  # A clean restart resumes from the binlog, also when the source table has
  # grown and its statistics were refreshed meanwhile: the row and size
  # estimates schema inference reads from MySQL change, its columns do not.
  - stop: {}
  - source-exec: { src: "INSERT INTO ta VALUES (300, 'while down'); UPDATE tb SET n = 0 WHERE id = 5; DELETE FROM tc WHERE id = 7" }
  - source-exec:
      src: |
        INSERT INTO ta WITH RECURSIVE s(i) AS (SELECT 1001 UNION ALL SELECT i + 1 FROM s WHERE i < 2000) SELECT i, CONCAT('grown', i) FROM s;
        ANALYZE TABLE ta;
  - start: {}
  # Each saved GTID set is one range up to the dataset's own changes still in
  # flight at the stop (an accelerator may acknowledge applied changes later),
  # which are re-read. The concurrent writes are GTIDs from about 30 to past
  # 2000, so a gap below 1000 is a transaction the dataset was never credited.
  - assert-log:
      contains:
        - 'resuming from persisted GTID position dataset=a gtid_set=[0-9a-f-]{36}:1-[0-9]{4,}'
        - 'resuming from persisted GTID position dataset=b gtid_set=[0-9a-f-]{36}:1-[0-9]{4,}'
      lacks: 'resuming from persisted GTID position .*gtid_set=[0-9a-f-]{36}:1-[0-9]{1,3}:'
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 60s
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 60s
  - query: SELECT * FROM c
    oracle-sql: SELECT * FROM tc
    eventually: 60s

  # The binlog holding the changes made while Spice was down is purged before
  # it returns: it rebuilds, and rows deleted meanwhile are gone.
  - stop: {}
  - source-exec:
      src: |
        DELETE FROM ta WHERE id <= 20;
        UPDATE tb SET v = 'purged-gap' WHERE id <= 10;
        DELETE FROM tc WHERE id > 150;
        INSERT INTO tc VALUES (500, 'after purge');
        FLUSH BINARY LOGS;
        PURGE BINARY LOGS BEFORE NOW() + INTERVAL 1 SECOND;
  - start: { ready: false }
  # Which datasets' statuses carry the cause depends on timing
  # (known-failing/cdc-mysql/mysql-cdc-shared-binlog-purged-status.yaml); the log always does.
  - assert-status: { dataset: a, status: Error }
    eventually: 60s
    only: fail-loud
  - assert-log: { contains: 'mysql_replication_invalid_checkpoint_behavior' }
    eventually: 30s
    only: fail-loud
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 90s
    only: restart
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 90s
    only: restart
  - query: SELECT * FROM c
    oracle-sql: SELECT * FROM tc
    eventually: 90s
    only: restart
  # And changes after the rebuild still arrive.
  - source-exec: { src: "UPDATE ta SET v = 'post-rebuild' WHERE id = 50; DELETE FROM tb WHERE id = 60" }
  - query: SELECT * FROM a
    oracle-sql: SELECT * FROM ta
    eventually: 30s
    only: restart
  - query: SELECT * FROM b
    oracle-sql: SELECT * FROM tb
    eventually: 30s
    only: restart
