name: kafka-chaos
description: >
  A Kafka topic appended into Cayenne keeps every message exactly once
  through faults: messages published while spiced runs, while it is killed,
  across a broker restart and across a clean restart all arrive, none twice,
  and a reader never sees a duplicate on the way.

sources:
  kafka:
    kind: docker
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.6
    ports: [19092]
    command: [redpanda, start, --smp, '1', --overprovisioned, --node-id, '0', --mode, dev-container,
      --kafka-addr, 'internal://0.0.0.0:9092,external://0.0.0.0:19092',
      --advertise-kafka-addr, 'internal://127.0.0.1:9092,external://127.0.0.1:${port.19092}']
    ready: rpk cluster health | grep -E 'Healthy:.+true'

spicepod:
  version: v1
  kind: Spicepod
  name: kafka-chaos
  datasets:
    - from: kafka:t_${sources.kafka.namespace}
      name: t
      params:
        kafka_bootstrap_servers: 127.0.0.1:${sources.kafka.port.19092}
        kafka_security_protocol: PLAINTEXT
      acceleration: { enabled: true, engine: cayenne, refresh_mode: append }

# Each phase publishes a known range of ids, so the answer after it is known:
# every id once.
steps:
  - source-exec:
      kafka: >-
        rpk topic create t_${sources.kafka.namespace} -p 3 &&
        for g in $(seq 1 1000); do echo "{\"id\": $g, \"v\": $((g % 7))}"; done | rpk topic produce t_${sources.kafka.namespace}
  - start: {}
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(id) AS total FROM t
    expect: { rows: [['1000', '1000', '500500']] }
    eventually: 60s
  - background:
      id: no-duplicates
      query: SELECT count(*) - count(DISTINCT id) AS duplicates FROM t
      expect: { duplicates: '0' }

  # Published while spiced is down after a kill.
  - kill-spiced: {}
  - source-exec:
      kafka: >-
        for g in $(seq 1001 2000); do echo "{\"id\": $g, \"v\": $((g % 7))}"; done | rpk topic produce t_${sources.kafka.namespace}
  - start: {}
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(id) AS total FROM t
    expect: { rows: [['2000', '2000', '2001000']] }
    eventually: 60s

  # The broker restarts, then more arrives.
  - stop-source: kafka
  - start-source: kafka
  - source-exec:
      kafka: >-
        for g in $(seq 2001 3000); do echo "{\"id\": $g, \"v\": $((g % 7))}"; done | rpk topic produce t_${sources.kafka.namespace}
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(id) AS total FROM t
    expect: { rows: [['3000', '3000', '4501500']] }
    eventually: 90s

  # A clean restart, then more.
  - restart: {}
  - source-exec:
      kafka: >-
        for g in $(seq 3001 4000); do echo "{\"id\": $g, \"v\": $((g % 7))}"; done | rpk topic produce t_${sources.kafka.namespace}
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids, sum(id) AS total FROM t
    expect: { rows: [['4000', '4000', '8002000']] }
    eventually: 60s
  - stop-background: { id: no-duplicates, allow: ['^[45][0-9][0-9] ', 'error sending request', 'connection', 'not ready'] }
  - query: SELECT v, count(*) AS n FROM t GROUP BY v ORDER BY v
    expect: { rows: [['0', '571'], ['1', '572'], ['2', '572'], ['3', '572'], ['4', '571'], ['5', '571'], ['6', '571']] }
