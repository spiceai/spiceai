name: results-cache
description: >
  The SQL results cache answers a repeated query from the cache (case and
  whitespace aside), empty answers included but not statements about the
  catalog, keys by `Spice-Cache-Key` when one is sent, steps aside
  for `Cache-Control: no-cache`, and ages entries out on `item_ttl`: a
  refresh leaves a cached answer in place until it expires, `no-cache` sees
  the refreshed data at once, and once the entry has expired Spice answers
  as the source does.

sources:
  src: { kind: postgres }

matrix:
  runtime_mode: [server, sidecar]

spicepod:
  version: v1
  kind: Spicepod
  name: results-cache
  runtime:
    mode: '${matrix.runtime_mode}'
    caching:
      sql_results:
        enabled: true
        caching_policy: lru
        max_size: 128MiB
        item_ttl: 8s
  datasets:
    - from: postgres:public.customer
      name: customer
      params: ${sources.src.params}
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full }

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': c_custkey }
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE customer (c_custkey integer PRIMARY KEY, c_name text NOT NULL, c_acctbal numeric(12, 2));
        INSERT INTO customer SELECT i, 'Customer#' || lpad(i::text, 9, '0'), (i % 1000) * 1.5 FROM generate_series(1, 2000) AS i;
  - start: {}

  - http: { path: /v1/sql, body: SELECT c_name FROM (SELECT * FROM customer) }
    expect: { status: 200, headers: { results-cache-status: MISS }, body-contains: 'Customer#000000042' }
  - http: { path: /v1/sql, body: select c_name from (select * from customer) }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: 'Customer#000000042' }
  - http:
      path: /v1/sql
      body: SELECT c_name FROM (SELECT * FROM customer)
      headers: { Cache-Control: no-cache }
    expect: { status: 200, headers: { results-cache-status: BYPASS } }

  # A source change reaches Spice only by refresh. The refresh leaves the
  # cached answer to its TTL; no-cache sees the change at once and stores it,
  # so the next plain read is served the fresh answer; once that entry
  # expires, the source answers again.
  - http: { path: /v1/sql, body: SELECT c_name FROM (SELECT * FROM customer) }
    expect: { status: 200, body-contains: 'Customer#000000042' }
  - source-exec: { src: "UPDATE customer SET c_name = 'Renamed' WHERE c_custkey = 42; DELETE FROM customer WHERE c_custkey > 1990" }
  - refresh: customer
  - http: { path: /v1/sql, body: SELECT c_name FROM (SELECT * FROM customer) }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-lacks: Renamed }
  - http:
      path: /v1/sql
      body: SELECT c_name FROM (SELECT * FROM customer)
      headers: { Cache-Control: no-cache }
    expect: { status: 200, headers: { results-cache-status: BYPASS }, body-contains: Renamed }
  - http: { path: /v1/sql, body: SELECT c_name FROM (SELECT * FROM customer) }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: Renamed }
  - http: { path: /v1/sql, body: SELECT c_name FROM (SELECT * FROM customer) }
    expect: { status: 200, headers: { results-cache-status: MISS }, body-contains: Renamed }
    eventually: 30s
  - query: SELECT * FROM customer
  - query: SELECT c_name FROM (SELECT * FROM customer)

  # A client-chosen cache key: its own entry, and Vary names it.
  - http:
      path: /v1/sql
      body: SELECT c_name FROM (SELECT * FROM customer)
      headers: { Spice-Cache-Key: e2eci }
    expect: { status: 200, headers: { results-cache-status: MISS } }
  - http:
      path: /v1/sql
      body: SELECT c_name FROM (SELECT * FROM customer)
      headers: { Spice-Cache-Key: e2eci }
    expect: { status: 200, headers: { results-cache-status: HIT, vary: Spice-Cache-Key }, body-contains: Renamed }
  # The key partitions entries per query and never makes two queries share
  # one: another query under the same key is its own MISS, and the first
  # query's entry is still there.
  - http:
      path: /v1/sql
      body: SELECT c_name FROM customer WHERE c_custkey = -1
      headers: { Spice-Cache-Key: e2eci }
    expect: { status: 200, headers: { results-cache-status: MISS }, body-contains: '[]' }
  - http:
      path: /v1/sql
      body: SELECT c_name FROM customer WHERE c_custkey = -1
      headers: { Spice-Cache-Key: e2eci }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: '[]' }
  - http:
      path: /v1/sql
      body: SELECT c_name FROM (SELECT * FROM customer)
      headers: { Spice-Cache-Key: e2eci }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: Renamed }

  # Empty answers are cached like any other.
  - http: { path: /v1/sql, body: SELECT * FROM customer WHERE c_custkey = -1 }
    expect: { status: 200, headers: { results-cache-status: MISS }, body-contains: '[]' }
  - http: { path: /v1/sql, body: SELECT * FROM customer WHERE c_custkey = -1 }
    expect: { status: 200, headers: { results-cache-status: HIT }, body-contains: '[]' }
  - http: { path: /v1/sql, body: SELECT * FROM customer WHERE 1 = 0 }
    expect: { status: 200, headers: { results-cache-status: MISS } }
  - http: { path: /v1/sql, body: SELECT * FROM customer WHERE 1 = 0 }
    expect: { status: 200, headers: { results-cache-status: HIT } }
  - http: { path: /v1/sql, body: SELECT * FROM customer LIMIT 0 }
    expect: { status: 200, headers: { results-cache-status: MISS } }
  - http: { path: /v1/sql, body: SELECT * FROM customer LIMIT 0 }
    expect: { status: 200, headers: { results-cache-status: HIT } }
  # Statements about the catalog are not cached.
  - http: { path: /v1/sql, body: SHOW TABLES }
    expect: { status: 200, lacks-headers: [results-cache-status] }
  - http: { path: /v1/sql, body: DESCRIBE customer }
    expect: { status: 200, lacks-headers: [results-cache-status] }
  - assert-log: { clean: true }
