name: pushdown-shapes
description: >
  Filters, projections, limits (alone, under ORDER BY, with OFFSET),
  aggregates, DISTINCT, same-source joins, IN subqueries, CASE, LIKE, date
  ranges, NULL tests and window functions reach a federated PostgreSQL, MySQL
  or DuckDB source inside the one statement Spice sends it, and answer as
  PostgreSQL does over the same rows. DuckDB is also read through ADBC with
  the DuckDB driver.

sources:
  backend: { kind: '${matrix.backend}' }
  ref: { kind: postgres }

matrix:
  backend: [postgres, mysql, duckdb]

variants:
  federated: {}
  adbc:
    when: { backend: duckdb }
    datasets:
      t:
        from: adbc:t
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null
      u:
        from: adbc:u
        params:
          $merge: '${sources.backend.adbc_params}'
          duckdb_open: null

spicepod:
  version: v1
  kind: Spicepod
  name: pushdown-shapes
  datasets:
    - { from: '${matrix.backend}:t', name: t, params: '${sources.backend.params}' }
    - { from: '${matrix.backend}:u', name: u, params: '${sources.backend.params}' }

defaults:
  # A cluster buckets each acceleration on this column (--cluster).
  cluster-partition-by: { '*': id }
  expect: { oracle: ref }

steps:
  - generate:
      backend:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, banana, cherry], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
    mirror: ref
  - generate:
      backend:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - corpus: corpus/pushdown-shapes.sql
