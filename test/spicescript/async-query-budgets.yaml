name: async-query-budgets
description: >
  On a scheduler, each caller runs up to 64 async queries at once. Further
  queries wait as PENDING and start in submission order as running ones
  finish or are cancelled; another caller is unaffected; a `maximum_size`
  above 100 GiB is refused with 400; the scheduler publishes how many it
  holds. When the scheduler holding the queries is killed and started
  again, it starts with an empty budget and the queries it takes over count
  against it: a public caller's waiting queries keep their order and count,
  and an authenticated caller's fail with a request to resubmit, as its
  running ones do. (Two schedulers each admitting up to 64:
  async-query-budgets-schedulers.yaml.)

sources:
  lake: { kind: files }

variants:
  authenticated: {}
  public: { spicepod: { runtime: { auth: { api-key: { enabled: false } } } } }

spicepod:
  version: v1
  kind: Spicepod
  name: async-query-budgets
  runtime:
    auth:
      api-key:
        enabled: true
        keys: [a-key:rw, b-key]
  datasets:
    - from: 'file://${sources.lake.path}/nums/'
      name: nums
      params: { file_format: parquet }
    - from: 'file://${sources.lake.path}/wide/'
      name: wide
      params: { file_format: parquet }

defaults:
  cluster: { executors: 1 }
  api-key: a-key
  compare-variants: false

steps:
  - generate:
      lake:
        table: nums
        rows: 2000
        seed: 31
        primary-key: id
        format: parquet
        columns:
          - { name: id, sequence: 1 }
  # Each long query reads 2000 x 2000 x 16000 rows, so none finishes on its own while the
  # script runs: only the timeout, a cancel or the kill ends one.
  - generate:
      lake:
        table: wide
        rows: 16000
        seed: 32
        primary-key: id
        format: parquet
        columns:
          - { name: id, sequence: 1 }
  - start: {}

  # A `maximum_size` above 100 GiB is refused, never lowered, and creates no job.
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT 1", "maximum_size": 214748364800}' }
    expect:
      status: 400
      json:
        - { pointer: /error, equals: '`maximum_size` is 214748364800 bytes, above 107374182400 (100 GiB), the most an async query can store. Omit it to use 100 GiB, or set a smaller value. See https://spiceai.org/docs/api/http/queries' }

  # 70 queries that run far longer than this script (a filtered three-way cross join of 2,000
  # rows), except the first, which stops at its 20 s timeout: 64 run, 6 wait.
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 1", "timeout_seconds": 30}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 2"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 3"}' }
