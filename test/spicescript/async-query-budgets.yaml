  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 67"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 68"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 69"}' }
    expect: { status: 202 }
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 70"}' }
    expect: { status: 202 }
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 60s
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 6 }
        - { pointer: /queries/*/sql_preview, matches: '> (65|66|67|68|69|70)$' }

  # The scheduler publishes what it holds, and that it has refused nothing yet.
  - wait-metric: { name: async_query_active_count, labels: { status: running }, above: 63, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: running }, below: 65, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, above: 5, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, below: 7, timeout: 30s }
  - wait-metric: { name: async_query_submissions_rejected, labels: { reason: queue_full }, below: 1, timeout: 30s }
  - wait-metric: { name: async_query_submissions_rejected, labels: { reason: result_budget }, below: 1, timeout: 30s }

  # Cancelling a running query starts the oldest waiting one, and the rest keep waiting.
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /queries/0/sql_preview, matches: '> 64$' } ] }
    capture: { newest_running: /queries/0/query_id }
  - http: { method: POST, path: '/v1/queries/${captured.newest_running}/cancel' }
    expect: { status: 200, json: [ { pointer: /status, equals: CANCELLED } ] }
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 5 }
        - { pointer: /queries/*/sql_preview, matches: '> (66|67|68|69|70)$' }
    eventually: 30s
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 64 }
        - { pointer: /queries/*/sql_preview, matches: '> 65$', count: 1 }
    eventually: 30s

  # Another caller is unaffected: its query runs at once.
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 0"}', api-key: b-key }
    expect: { status: 202 }
    only: authenticated
  - http: { method: GET, path: /v1/queries, query: { status: running }, api-key: b-key }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 1 } ] }
    eventually: 30s
    only: authenticated

  # When the first query reaches its timeout, the oldest waiting query starts, and the rest
  # keep waiting.
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 4 }
        - { pointer: /queries/*/sql_preview, matches: '> (67|68|69|70)$' }
    eventually: 90s
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 30s

  # The scheduler holding the queries is killed and started again, with an empty budget. A
  # public caller's queries are taken over and count against it: the 64 running take its 64
  # slots and the 4 waiting keep their order and count. An authenticated caller's queries
  # cannot be run without the request that submitted them, so they fail with a request to
  # resubmit.
  - kill-spiced: {}
  - start: {}
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 4 }
        - { pointer: /queries/*/sql_preview, matches: '> (67|68|69|70)$' }
    consistently: 20s
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 60s
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 0 } ] }
    eventually: 60s
    only: authenticated
  - http: { method: GET, path: /v1/queries, query: { status: failed } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 69 }
    eventually: 60s
