  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 70"}' }
    expect: { status: 202 }
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 60s
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 6 }
        - { pointer: /queries/*/sql_preview, matches: '> (65|66|67|68|69|70)$' }

  # The scheduler publishes what it holds, and that it has refused nothing yet.
  - wait-metric: { name: async_query_active_count, labels: { status: running }, above: 63, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: running }, below: 65, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, above: 5, timeout: 30s }
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, below: 7, timeout: 30s }
  - wait-metric: { name: async_query_submissions_rejected, labels: { reason: queue_full }, below: 1, timeout: 30s }
  - wait-metric: { name: async_query_submissions_rejected, labels: { reason: result_budget }, below: 1, timeout: 30s }

  # Cancelling a running query starts the oldest waiting one, and the rest keep waiting.
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /queries/0/sql_preview, matches: '> 64$' } ] }
    capture: { newest_running: /queries/0/query_id }
  - http: { method: POST, path: '/v1/queries/${captured.newest_running}/cancel' }
    expect: { status: 200, json: [ { pointer: /status, equals: CANCELLED } ] }
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 5 }
        - { pointer: /queries/*/sql_preview, matches: '> (66|67|68|69|70)$' }
    eventually: 30s
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 64 }
        - { pointer: /queries/*/sql_preview, matches: '> 65$', count: 1 }
    eventually: 30s

  # Another caller is unaffected: its query runs at once.
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 0"}', api-key: b-key }
    expect: { status: 202 }
    only: authenticated
  - http: { method: GET, path: /v1/queries, query: { status: running }, api-key: b-key }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 1 } ] }
    eventually: 30s
    only: authenticated

  # When the first query reaches its timeout, the oldest waiting query starts, and the rest
  # keep waiting.
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 4 }
        - { pointer: /queries/*/sql_preview, matches: '> (67|68|69|70)$' }
    eventually: 90s
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 30s

  # The scheduler holding the queries is killed and started again, with an empty budget. A
  # public caller's queries are taken over and count against it: the 64 running take its 64
  # slots and the 4 waiting keep their order and count. An authenticated caller's queries
  # cannot be run without the request that submitted them, so they fail with a request to
  # resubmit.
  - kill-spiced: {}
  - start: {}
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 4 }
        - { pointer: /queries/*/sql_preview, matches: '> (67|68|69|70)$' }
    consistently: 20s
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 64 } ] }
    eventually: 60s
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 0 } ] }
    eventually: 60s
    only: authenticated
  - http: { method: GET, path: /v1/queries, query: { status: failed } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 69 }
    eventually: 60s
    only: authenticated
  # They failed with the request to resubmit, not for any other reason: the newest, which was
  # waiting, says so through the API, and the log names each running query (this caller's 64
  # and the other caller's 1) and each of the 4 waiting.
  - http: { method: GET, path: /v1/queries, query: { status: failed } }
    expect: { status: 200, json: [ { pointer: /queries/0/sql_preview, matches: '> 70$' } ] }
    capture: { newest_failed: /queries/0/query_id }
    only: authenticated
  - http: { method: GET, path: '/v1/queries/${captured.newest_failed}' }
    expect:
      status: 200
      json:
        - { pointer: /status, equals: FAILED }
        - { pointer: /error/error_code, equals: SCHEDULER_UNAVAILABLE }
        - { pointer: /error/message, equals: 'The scheduler running this query stopped before it finished, and the query cannot be resumed under the identity that submitted it. Resubmit the query.' }
    only: authenticated
  - assert-log:
      count:
        'was running on a scheduler that stopped, and it cannot be resumed under the identity that submitted it, so it is marked failed; resubmit the query': 65
        'was waiting on a scheduler that stopped, and it cannot be run under the identity that submitted it, so it is marked failed; resubmit the query': 4
    only: authenticated
  - http: { method: GET, path: /v1/queries, query: { status: cancelled } }
    expect: { status: 200, json: [ { pointer: /total_count, equals: 1 } ] }

  # The job records above read the same whether or not the started scheduler took the queries
  # over, so what it holds shows that it did: the 4 waiting queries wait here, and the 64
  # running hold the caller's 64 running slots here.
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, above: 3, timeout: 120s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, below: 5, timeout: 30s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: running }, above: 63, timeout: 60s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: running }, below: 65, timeout: 30s }
    only: public
  # Its budget holds them: a new query waits behind the 4, and cancelling a running query
  # starts the oldest waiting one. (A submission is answered PENDING whether it runs at once or
  # waits, so the queue shows which.)
  - http: { method: POST, path: /v1/queries, headers: { content-type: application/json }, body: '{"sql": "SELECT count(*) AS n FROM nums a, nums b, wide c WHERE a.id + b.id + c.id > 71"}' }
    expect: { status: 202 }
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 5 }
        - { pointer: /queries/*/sql_preview, matches: '> (67|68|69|70|71)$' }
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect: { status: 200, json: [ { pointer: /queries/0/sql_preview, matches: '> 66$' } ] }
    capture: { newest_running: /queries/0/query_id }
    only: public
  - http: { method: POST, path: '/v1/queries/${captured.newest_running}/cancel' }
    expect: { status: 200, json: [ { pointer: /status, equals: CANCELLED } ] }
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: pending } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 4 }
        - { pointer: /queries/*/sql_preview, matches: '> (68|69|70|71)$' }
    eventually: 30s
    only: public
  - http: { method: GET, path: /v1/queries, query: { status: running } }
    expect:
      status: 200
      json:
        - { pointer: /total_count, equals: 64 }
        - { pointer: /queries/*/sql_preview, matches: '> 67$', count: 1 }
    eventually: 30s
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: running }, above: 63, timeout: 30s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: running }, below: 65, timeout: 30s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, above: 3, timeout: 30s }
    only: public
  - wait-metric: { name: async_query_active_count, labels: { status: pending }, below: 5, timeout: 30s }
    only: public
