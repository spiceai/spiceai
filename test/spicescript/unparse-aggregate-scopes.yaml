name: unparse-aggregate-scopes
description: >
  Aggregate projection scopes preserve correlated subquery references,
  grouping sets and qualified duplicate grouping-column names. A grouping-set
  aggregate federated to MySQL beneath a window that stays local answers as
  PostgreSQL does.

sources:
  src: { kind: postgres }
  my: { kind: mysql }

variants:
  federated: {}
  mysql: { datasets: { m: { from: 'mysql:m', params: '${sources.my.params}' } } }

spicepod:
  version: v1
  kind: Spicepod
  name: unparse-aggregate-scopes
  datasets:
    - { from: 'postgres:public.e', name: e, params: '${sources.src.params}' }
    - { from: 'postgres:public.m', name: m, params: '${sources.src.params}' }

defaults:
  expect: { oracle: src }
  compare-variants: false

steps:
  - source-exec:
      src: CREATE TABLE e (id int, v int); INSERT INTO e VALUES (1,10), (2,20), (3,10), (4,NULL), (5,10), (1,10);
  # Every ratio of sums below is exact, so engines that divide decimals to
  # different scales still agree on the value.
  - source-exec:
      src: CREATE TABLE m (c varchar(8), k varchar(8), p decimal(7,2), s decimal(7,2)); INSERT INTO m VALUES ('a','x',1.00,2.00), ('a','y',2.00,8.00), ('b','x',1.00,5.00), ('b','y',3.00,5.00);
  - source-exec:
      my: CREATE TABLE m (c varchar(8), k varchar(8), p decimal(7,2), s decimal(7,2)); INSERT INTO m VALUES ('a','x',1.00,2.00), ('a','y',2.00,8.00), ('b','x',1.00,5.00), ('b','y',3.00,5.00);
  - start: {}
  - query: SELECT (SELECT e.v) AS v FROM e GROUP BY e.v
  - query: SELECT (SELECT e.v + 1) AS v FROM e GROUP BY e.v
  - query: SELECT (SELECT 42) AS k FROM e GROUP BY v
  - query: SELECT (SELECT 42) AS k FROM (SELECT max(id) AS m FROM e WHERE id < 0) q
  - query: SELECT 42 AS k FROM e GROUP BY ROLLUP(v)
  - query: SELECT 42 AS k FROM e l JOIN e r ON l.v = r.v GROUP BY l.id, r.id
  - query: SELECT count(*) AS n FROM (SELECT 42 AS k FROM e GROUP BY ROLLUP(v)) q
  - query: SELECT count(*) AS n FROM (SELECT 42 AS k FROM e l JOIN e r ON l.v = r.v GROUP BY l.id, r.id) q
  - query: SELECT 42 AS k FROM e GROUP BY CUBE(v)
  - query: SELECT 42 AS k FROM e GROUP BY GROUPING SETS ((v), ())
  - query: SELECT derived_aggregate_1.id AS id, (SELECT derived_aggregate_1.id FROM e HAVING count(*) > 0) AS correlated_id FROM e AS derived_aggregate_1 ORDER BY id
  - query: SELECT outer_e.id AS id, (SELECT outer_e.id FROM e HAVING count(*) > 0) AS correlated_id FROM e AS outer_e ORDER BY id
  - query: SELECT derived_aggregate_1.id AS id, (SELECT derived_aggregate_1.id FROM e WHERE id < 0 HAVING count(*) = 0) AS correlated_id FROM e AS derived_aggregate_1 ORDER BY id
  - query: SELECT derived_aggregate_1.id AS id, (SELECT derived_aggregate_1.id FROM e WHERE id < 0 HAVING count(*) > 0) AS correlated_id FROM e AS derived_aggregate_1 ORDER BY id
  - query: SELECT count(*) AS n FROM (SELECT 42 AS k FROM e l JOIN e r ON l.v = r.v GROUP BY l.id, r.id LIMIT 1) q
  - query: SELECT count(*) AS n FROM (SELECT 42 AS k FROM e GROUP BY ROLLUP(v) LIMIT 1) q
  - query: SELECT outer_t.id AS id, (SELECT (SELECT outer_t.id AS k) FROM (SELECT max(e.id) AS m FROM e WHERE e.id >= 0) a) AS k FROM e AS outer_t ORDER BY id
  - query: SELECT outer_t.id AS id, (SELECT (SELECT outer_t.id AS k) FROM (SELECT max(e.id) AS m FROM e WHERE e.id < 0) a) AS k FROM e AS outer_t ORDER BY id
  - query: SELECT outer_t.id AS id, (SELECT (SELECT outer_t.id) FROM (SELECT max(e.id) AS id FROM e WHERE e.id >= 0) a) AS k FROM e AS outer_t ORDER BY id
  - query: SELECT outer_t.id AS id, (SELECT (SELECT outer_t.id) FROM (SELECT max(e.id) AS id FROM e WHERE e.id < 0) a) AS k FROM e AS outer_t ORDER BY id
  # Regression for #16081: a grouping-set aggregate federated beneath a window that
  # stays local must not ask the source for the internal grouping id. MySQL keeps
  # these windows local. TPC-DS Q36 and Q86.
  - query: SELECT sum(p) / sum(s) AS margin, c, k, grouping(c) + grouping(k) AS lvl, rank() OVER (PARTITION BY grouping(c) + grouping(k), CASE WHEN grouping(k) = 0 THEN c END ORDER BY sum(p) / sum(s)) AS rnk FROM m GROUP BY ROLLUP(c, k)
  - query: SELECT sum(p) AS total, c, k, grouping(c) + grouping(k) AS lvl, rank() OVER (PARTITION BY grouping(c) + grouping(k), CASE WHEN grouping(k) = 0 THEN c END ORDER BY sum(p) DESC) AS rnk FROM m GROUP BY ROLLUP(c, k)
