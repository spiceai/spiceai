name: iceberg-coverage
description: >
  Iceberg tables answer the extended corpus and ternary logic partitioning as PostgreSQL answers them over the same generated rows: read through Spice's Iceberg reader, and accelerated into Cayenne.

sources:
  ice: { kind: iceberg }
  ref: { kind: postgres }

# One value: names the place in the corpus's known-failing notes.
matrix:
  source: [iceberg]

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: iceberg-coverage
  datasets:
    - from: 'iceberg:${sources.ice.catalog}/v1/namespaces/${sources.ice.namespace}/tables/t'
      name: t
      params: ${sources.ice.params}
    - from: 'iceberg:${sources.ice.catalog}/v1/namespaces/${sources.ice.namespace}/tables/u'
      name: u
      params: ${sources.ice.params}

defaults:
  expect: { oracle: ref }
  compare-variants: false

steps:
  - generate:
      ice:
        table: t
        rows: 400
        seed: 31
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: i, int: [-50, 50], nulls: 0.1 }
          - { name: big, bigint: [0, 10000000000] }
          - { name: d, decimal: { range: [-100, 100], scale: 2 } }
          - { name: f, float: [0, 50] }
          - { name: s, choice: [apple, Apple, APPLE, banana, "O'Brien", naïve, '', under_score, b], nulls: 0.1 }
          - { name: dt, date: ['2024-01-01', '2024-12-31'] }
          - { name: ts, timestamp: ['2024-01-01', '2024-12-31'] }
          - { name: b, bool: 0.33 }
    mirror: ref
  - generate:
      ice:
        table: u
        rows: 150
        seed: 32
        primary-key: id
        columns:
          - { name: id, sequence: 1 }
          - { name: t_id, int: [1, 440] }
          - { name: label, choice: [red, blue, green] }
    mirror: ref
  - start: {}
  - corpus: corpus/queries-extended.sql
  - tlp: { table: t, seed: 3, queries: 200, depth: 3, aggregate: d, oracle: ref, avoid: [not] }
