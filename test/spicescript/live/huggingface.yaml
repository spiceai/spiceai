name: huggingface
description: >
  Public Hugging Face Hub datasets read through `hf://` answer as DuckDB's own
  `hf://` reader answers them, federated and accelerated into Cayenne: Parquet
  (a single file, a glob, a folder whose format is inferred, and the Hub's
  `refs/convert/parquet` branch through `@~parquet`), CSV through the Hub's
  `resolve-cache`, newline-delimited JSON, and a TSV glob. Each dataset is
  pinned to a commit, so its recorded answer cannot drift; the converted
  branch, which no pin survives, is compared with DuckDB reading it live, as
  are the full rows of the two tables small enough to compare. Uses `HF_TOKEN`
  when it is set: anonymous Hub requests share a per-IP quota.

sources:
  # The oracle: the DuckDB CLI's `hf://` reader, which shares no code with Spice.
  duck: { kind: duckdb }

variants:
  federated: {}
  cayenne: cayenne-file

spicepod:
  version: v1
  kind: Spicepod
  name: huggingface
  datasets:
    - from: hf://datasets/stanfordnlp/imdb@e6281661ce1c48d982bc483cf8a173c1bbeb5d31/plain_text/test-00000-of-00001.parquet
      name: imdb_test
    - from: hf://datasets/stanfordnlp/imdb@e6281661ce1c48d982bc483cf8a173c1bbeb5d31/plain_text/
      name: imdb_folder
    - from: hf://datasets/stanfordnlp/imdb@e6281661ce1c48d982bc483cf8a173c1bbeb5d31/plain_text/t*-00000-of-00001.parquet
      name: imdb_glob
    - from: hf://datasets/stanfordnlp/imdb@~parquet/plain_text/test/
      name: imdb_converted
    - from: hf://datasets/openai/gsm8k@740312add88f781978c0658806c59bc2815b9866/main/test-00000-of-00001.parquet
      name: gsm8k_test
    - from: hf://datasets/mteb/scifact@cf10ab6856b15b0e670ef8ae5dae4e266c12d035/queries.jsonl
      name: scifact_queries
    - from: hf://datasets/mteb/scifact@cf10ab6856b15b0e670ef8ae5dae4e266c12d035/qrels/*.tsv
      name: scifact_qrels
    - from: hf://datasets/scikit-learn/iris@0bda0ce801be0fa2f464ff845a9d5ceae99aad7d/Iris.csv
      name: iris

defaults:
  # Each answer here comes from the Hub; a variant is checked against it, not
  # against another variant.
  compare-variants: false

steps:
  - start: { ready-timeout: 10m }

  # Answers recorded with DuckDB's `hf://` reader at the pinned commits.
  - query: SELECT count(*) AS n, sum(label) AS s, sum(character_length(text)) AS c FROM imdb_test
    expect: { rows: [['25000', '12500', '32344810']] }
  - query: SELECT count(*) AS n, sum(label) AS s, sum(character_length(text)) AS c FROM imdb_folder
    expect: { rows: [['100000', '-25000', '131966676']] }
  - query: SELECT count(*) AS n, sum(label) AS s, sum(character_length(text)) AS c FROM imdb_glob
    expect: { rows: [['50000', '25000', '65471551']] }
  - query: SELECT count(*) AS n, sum(character_length(question)) AS s, sum(character_length(answer)) AS c FROM gsm8k_test
    expect: { rows: [['1319', '316390', '386310']] }
  - query: SELECT count(*) AS n, sum(character_length("_id")) AS s, sum(character_length(text)) AS c FROM scifact_queries
    expect: { rows: [['1109', '3553', '98772']] }
  - query: SELECT count(*) AS n, sum(score) AS s, sum(character_length(CAST("corpus-id" AS VARCHAR))) AS c FROM scifact_qrels
    expect: { rows: [['1258', '1258', '9514']] }
  - query: SELECT count(*) AS n, sum("Id") AS s, CAST(round(sum("SepalLengthCm") * 10) AS BIGINT) AS c FROM iris
    expect: { rows: [['150', '11325', '8765']] }

  # Compared with DuckDB reading the Hub now: the converted branch, and every row
  # of the small tables.
  - query: SELECT count(*) AS n, sum(label) AS s, sum(character_length(text)) AS c FROM imdb_converted
    oracle-sql: SELECT count(*) AS n, sum(label) AS s, sum(length(text)) AS c FROM 'hf://datasets/stanfordnlp/imdb@~parquet/plain_text/test/*.parquet'
    expect: { oracle: duck }
  - query: SELECT "Id", "SepalLengthCm", "SepalWidthCm", "PetalLengthCm", "PetalWidthCm", "Species" FROM iris
    oracle-sql: SELECT Id, SepalLengthCm, SepalWidthCm, PetalLengthCm, PetalWidthCm, Species FROM read_csv('hf://datasets/scikit-learn/iris@0bda0ce801be0fa2f464ff845a9d5ceae99aad7d/Iris.csv', header=true)
    expect: { oracle: duck }
  - query: SELECT question, answer FROM gsm8k_test
    oracle-sql: SELECT question, answer FROM 'hf://datasets/openai/gsm8k@740312add88f781978c0658806c59bc2815b9866/main/test-00000-of-00001.parquet'
    expect: { oracle: duck }
