name: sql-ddl-agent
description: >
  An agent defines a dataset with a password, through Spice's `sql` tool, and
  the conversation goes on. Over the Messages API, Spice runs the call and
  returns it to the client, which sends the whole conversation back on its
  next turn, as the Messages API requires. Over Chat Completions, an agent
  that runs its own tool loop calls `/v1/tools/sql` and sends the call and
  its result back to a model with no Spice tools. Through an MCP tool, a
  call reaches another Spice's `sql` tool (a stand-in that quotes the
  statement back in its error): called directly, through Spice's `/v1/mcp`
  gateway, and by a model. A call reaches it under other names and shapes
  too: another Spice's `sql` tool its Spicepod renamed (`peer2__query`), an
  MCP client's own name for Spice's tool (`mcp__spice__sql`), and the legacy
  Chat Completions `function_call`. What a read-only key reads in task history
  holds none of the password.

sources:
  model: { kind: mock-http }

spicepod:
  version: v1
  kind: Spicepod
  name: sql-ddl-agent
  runtime:
    # Tool results and model answers are recorded too, so they are checked.
    task_history:
      captured_output: truncated
    auth:
      api-key:
        enabled: true
        keys: [admin-key:admin, reader-key:ro]
  tools:
    # Another Spice's `sql` tool, over MCP: a stand-in that refuses each
    # statement and quotes it back in its error.
    - name: peer
      from: mcp:python3
      params:
        mcp_args: ${script.dir}/mcp/sql_peer.py
    # Another Spice whose Spicepod names its `sql` tool `query`.
    - name: peer2
      from: mcp:python3
      params:
        mcp_args: ${script.dir}/mcp/sql_peer.py query
    # Other Spices whose `sql` tool answers with a JSON document in its text,
    # refusing the statement and answering it.
    - name: peer3
      from: mcp:python3
      params:
        mcp_args: ${script.dir}/mcp/sql_peer.py sql json
    - name: peer4
      from: mcp:python3
      params:
        mcp_args: ${script.dir}/mcp/sql_peer.py sql json-result
    # Another whose error puts the JSON document after a quoted quote, with
    # its escapes in capitals.
    - name: peer5
      from: mcp:python3
      params:
        mcp_args: ${script.dir}/mcp/sql_peer.py sql json-after-quote
  models:
    - from: anthropic:claude-sonnet-4-6
      name: a
      params:
        endpoint: ${sources.model.url}/v1
        anthropic_api_key: stub-key
        tools: sql, peer
    - from: openai:gpt-4o-mini
      name: n
      params:
        endpoint: ${sources.model.url}/v1
        openai_api_key: stub-key

defaults:
  api-key: admin-key

steps:
  # The model's answer once it has a tool's result, or no tool to call.
  - source-exec:
      model:
        - |
          path: /v1/messages
          method: POST
          headers: { content-type: application/json }
          body: '{"id": "msg_2", "type": "message", "role": "assistant", "model": "claude-sonnet-4-6", "content": [{"type": "text", "text": "done"}], "stop_reason": "end_turn", "stop_sequence": null, "usage": {"input_tokens": 1, "output_tokens": 1}}'
        - |
          path: /v1/chat/completions
          method: POST
          headers: { content-type: application/json }
          body: '{"id": "c2", "object": "chat.completion", "created": 1, "model": "gpt-4o-mini", "choices": [{"index": 0, "message": {"role": "assistant", "content": "done"}, "finish_reason": "stop"}], "usage": {"prompt_tokens": 1, "completion_tokens": 1, "total_tokens": 2}}'
  - start: {}
  # The model's first answer: a `sql` call that defines a dataset.
  - source-exec:
      model:
        - |
          path: /v1/messages
          method: POST
          times: 1
          headers: { content-type: application/json }
          body: '{"id": "msg_1", "type": "message", "role": "assistant", "model": "claude-sonnet-4-6", "content": [{"type": "tool_use", "id": "toolu_1", "name": "sql", "input": {"query": "CREATE TABLE t1 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-messages-next-turn'')"}}], "stop_reason": "tool_use", "stop_sequence": null, "usage": {"input_tokens": 1, "output_tokens": 1}}'

  # Messages, turn 1: Spice runs the call and returns it to the client.
  - http:
      method: POST
      path: /v1/messages
      headers: { content-type: application/json, anthropic-version: '2023-06-01' }
      body: '{"model": "a", "max_tokens": 256, "messages": [{"role": "user", "content": "add the orders table"}]}'
    expect: { status: 200, body-contains: mcp_tool_use }
  # Messages, turn 2: the client sends the conversation back.
  - http:
      method: POST
      path: /v1/messages
      headers: { content-type: application/json, anthropic-version: '2023-06-01' }
      body: '{"model": "a", "max_tokens": 256, "messages": [{"role": "user", "content": "add the orders table"}, {"role": "assistant", "content": [{"type": "mcp_tool_use", "id": "toolu_1", "name": "sql", "server_name": "spice", "input": {"query": "CREATE TABLE t1 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-messages-next-turn'')"}}, {"type": "mcp_tool_result", "tool_use_id": "toolu_1", "is_error": true, "content": [{"type": "text", "text": "Cannot connect to the dataset t1"}]}, {"type": "text", "text": "done"}]}, {"role": "user", "content": "messages turn two"}]}'
    expect: { status: 200, body-contains: done }

  # Chat Completions, an agent's own tool loop: it runs the call through
  # Spice's tool, then sends the call and its result back.
  - http:
      method: POST
      path: /v1/tools/sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t2 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-agent-loop'')"}'
    expect: { body-contains: t2 }
  - http:
      method: POST
      path: /v1/chat/completions
      headers: { content-type: application/json }
      body: '{"model": "n", "messages": [{"role": "user", "content": "add the orders table"}, {"role": "assistant", "content": null, "tool_calls": [{"id": "call_1", "type": "function", "function": {"name": "sql", "arguments": "{\"query\": \"CREATE TABLE t2 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-agent-loop'')\"}"}}]}, {"role": "tool", "tool_call_id": "call_1", "content": "Cannot connect to the dataset t2"}, {"role": "user", "content": "chat turn two"}], "tools": [{"type": "function", "function": {"name": "sql", "parameters": {"type": "object", "properties": {"query": {"type": "string"}}}}}]}'
    expect: { status: 200, body-contains: done }

  # Task history, as a read-only key reads it. The tool's own rows, and the
  # model calls Spice made in its tool loop, hold no password.
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, error_message FROM runtime.task_history WHERE task IN ('tool_use::sql', 'sql_query') AND (input LIKE '%t1%' OR input LIKE '%t2%') ORDER BY start_time
    expect: { status: 200, body-matches: 'TABLE t1[\s\S]*TABLE t2', body-lacks: ['leak-'] }
    eventually: 30s
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input FROM runtime.task_history WHERE task = 'ai_completion' AND input LIKE '%messages turn two%'
    expect: { status: 200, body-contains: messages turn two, body-lacks: ['leak-'] }
    eventually: 30s
  # The Messages client's next turn, as task history records the request.
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input FROM runtime.task_history WHERE task = 'ai_chat' AND input LIKE '%messages turn two%'
    expect: { status: 200, body-contains: messages turn two, body-lacks: ['leak-'] }
    eventually: 30s
  # The agent's own tool loop, as task history records the request and the
  # model call.
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input FROM runtime.task_history WHERE task IN ('ai_chat', 'ai_completion') AND input LIKE '%chat turn two%' ORDER BY task
    expect: { status: 200, body-matches: 'ai_chat[\s\S]*ai_completion', body-lacks: ['leak-'] }
    eventually: 30s

  # Another Spice's `sql` tool, reached through the MCP tool `peer`: called
  # directly, through this Spice's `/v1/mcp` gateway, and by a model.
  - http:
      method: POST
      path: /v1/tools/peer__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t3 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-mcp-tool'')"}'
    expect: { body-contains: t3 }
  # Its password holds a double quote, which the recorded result, JSON, escapes.
  - http:
      method: POST
      path: /v1/mcp
      headers:
        content-type: application/json
        accept: application/json, text/event-stream
        mcp-protocol-version: '2026-07-28'
        mcp-method: tools/call
        mcp-name: peer__sql
      body: '{"jsonrpc": "2.0", "id": 1, "method": "tools/call", "params": {"name": "peer__sql", "arguments": {"query": "CREATE TABLE t4 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-mcp-\"gateway'')"}, "_meta": {"io.modelcontextprotocol/protocolVersion": "2026-07-28", "io.modelcontextprotocol/clientInfo": {"name": "spicescript", "version": "1"}, "io.modelcontextprotocol/clientCapabilities": {}}}}'
    expect: { status: 200, body-contains: t4 }
  # A statement that cannot be read into tokens is recorded as a placeholder;
  # the stand-in quotes it back whole.
  - http:
      method: POST
      path: /v1/tools/peer__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t9 WITH (from = ''postgres:public.t'', pg_pass = ''leak-unterminated)"}'
    expect: { body-contains: t9 }
  - source-exec:
      model:
        - |
          path: /v1/messages
          method: POST
          times: 1
          headers: { content-type: application/json }
          body: '{"id": "msg_3", "type": "message", "role": "assistant", "model": "claude-sonnet-4-6", "content": [{"type": "tool_use", "id": "toolu_3", "name": "peer__sql", "input": {"query": "CREATE TABLE t5 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-mcp-model'')"}}], "stop_reason": "tool_use", "stop_sequence": null, "usage": {"input_tokens": 1, "output_tokens": 1}}'
  - http:
      method: POST
      path: /v1/messages
      headers: { content-type: application/json, anthropic-version: '2023-06-01' }
      body: '{"model": "a", "max_tokens": 256, "messages": [{"role": "user", "content": "peer turn"}]}'
    expect: { status: 200, body-contains: mcp_tool_use }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task = 'tool_use::peer__sql' ORDER BY start_time
    expect: { status: 200, body-matches: 'TABLE t3[\s\S]*TABLE t4[\s\S]*TABLE t5', body-lacks: ['leak-'] }
    eventually: 30s
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output FROM runtime.task_history WHERE task IN ('ai_chat', 'ai_completion') AND input LIKE '%peer turn%' ORDER BY task
    expect: { status: 200, body-matches: 'ai_chat[\s\S]*ai_completion[\s\S]*TABLE t5', body-lacks: ['leak-'] }
    eventually: 30s
  # Other names and shapes: another Spice's `sql` tool its Spicepod renamed,
  # an MCP client's own name for Spice's `sql` tool in a conversation it sends
  # to a model with no tools, and the legacy Chat Completions `function_call`.
  - http:
      method: POST
      path: /v1/tools/peer2__query
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t6 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-renamed-peer'')"}'
    expect: { body-contains: t6 }
  - http:
      method: POST
      path: /v1/messages
      headers: { content-type: application/json, anthropic-version: '2023-06-01' }
      body: '{"model": "n", "max_tokens": 256, "messages": [{"role": "user", "content": "add the orders table"}, {"role": "assistant", "content": [{"type": "tool_use", "id": "toolu_7", "name": "mcp__spice__sql", "input": {"query": "CREATE TABLE t7 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-mcp-client-name'')"}}]}, {"role": "user", "content": [{"type": "tool_result", "tool_use_id": "toolu_7", "content": "Cannot connect to the dataset t7"}, {"type": "text", "text": "client name turn two"}]}], "tools": [{"name": "mcp__spice__sql", "input_schema": {"type": "object", "properties": {"query": {"type": "string"}}}}]}'
    expect: { status: 200, body-contains: done }
  - http:
      method: POST
      path: /v1/chat/completions
      headers: { content-type: application/json }
      body: '{"model": "n", "messages": [{"role": "user", "content": "add the orders table"}, {"role": "assistant", "content": null, "function_call": {"name": "sql", "arguments": "{\"query\": \"CREATE TABLE t8 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-function-call'')\"}"}}, {"role": "function", "name": "sql", "content": "Cannot connect to the dataset t8"}, {"role": "user", "content": "function call turn two"}], "functions": [{"name": "sql", "parameters": {"type": "object", "properties": {"query": {"type": "string"}}}}]}'
    expect: { status: 200, body-contains: done }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task = 'tool_use::peer2__query'
    expect: { status: 200, body-contains: TABLE t6, body-lacks: ['leak-'] }
    eventually: 30s
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input FROM runtime.task_history WHERE task IN ('ai_chat', 'ai_completion') AND (input LIKE '%client name turn two%' OR input LIKE '%function call turn two%') ORDER BY task
    expect: { status: 200, body-matches: 'ai_chat[\s\S]*TABLE t[78][\s\S]*ai_completion', body-lacks: ['leak-'] }
    eventually: 30s
  # A peer whose error or answer is a JSON document in its text escapes a
  # quote, a backslash, or a letter outside ASCII in the password, and the
  # recorded result, JSON too, escapes the answer again.
  - http:
      method: POST
      path: /v1/tools/peer3__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t10 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-json-\"text\\\\ü'')"}'
    expect: { body-contains: t10 }
  - http:
      method: POST
      path: /v1/tools/peer4__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t11 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-json-\"result\\\\ü'')"}'
    expect: { body-contains: t11 }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task IN ('tool_use::peer3__sql', 'tool_use::peer4__sql') ORDER BY task
    expect: { status: 200, body-matches: 'TABLE t10[\s\S]*TABLE t11', body-lacks: ['leak-'] }
    eventually: 30s
  # A value that is also part of the password's escape (`u00fc` in
  # `\u00fc`), and a JSON document after plain text that quotes a quote.
  - http:
      method: POST
      path: /v1/tools/peer3__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t12 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''u00fc'', pg_pass = ''leak-overlap-ü'')"}'
    expect: { body-contains: t12 }
  - http:
      method: POST
      path: /v1/tools/peer5__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t13 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-quote-ü'')"}'
    expect: { body-contains: t13 }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task IN ('tool_use::peer3__sql', 'tool_use::peer5__sql') AND (input LIKE '%t12%' OR input LIKE '%t13%') ORDER BY task
    expect: { status: 200, body-matches: 'TABLE t12[\s\S]*TABLE t13', body-lacks: ['leak-'] }
    eventually: 30s
  # A call whose other argument repeats the password its statement sets, and
  # a statement cut short inside a quote whose password is short words.
  - http:
      method: POST
      path: /v1/tools/peer2__query
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t14 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''leak-sibling'')", "confirmation": "password leak-sibling"}'
    expect: { body-contains: t14 }
  - http:
      method: POST
      path: /v1/tools/peer__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t15 WITH (from = ''postgres:public.t'', pg_pass = ''zqx qjv wkp"}'
    expect: { body-contains: t15 }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task IN ('tool_use::peer2__query', 'tool_use::peer__sql') AND (input LIKE '%t14%' OR error_message LIKE '%t15%') ORDER BY task
    expect: { status: 200, body-matches: 'TABLE t14[\s\S]*TABLE t15', body-lacks: ['leak-', 'zqx', 'qjv', 'wkp'] }
    eventually: 30s
  # A call whose number and object key repeat the password its statement
  # sets, and a statement cut short inside an escape string whose escaped
  # quote comes before the rest of its password.
  - http:
      method: POST
      path: /v1/tools/peer2__query
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t16 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''918273645'')", "confirmation": 918273645, "meta": {"pw 918273645": true}}'
    expect: { body-contains: t16 }
  - http:
      method: POST
      path: /v1/tools/peer__sql
      headers: { content-type: application/json }
      body: '{"query": "CREATE TABLE t17 WITH (from = ''postgres:public.t'', pg_pass = E''zqy\\''x qjx wkq"}'
    expect: { body-contains: t17 }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE task IN ('tool_use::peer2__query', 'tool_use::peer__sql') AND (input LIKE '%t16%' OR error_message LIKE '%t17%') ORDER BY task
    expect: { status: 200, body-matches: 'TABLE t16[\s\S]*TABLE t17', body-lacks: ['918273645', 'zqy', 'qjx', 'wkq'] }
    eventually: 30s
  # A conversation a client sends back, in which another call repeats the
  # password an `sql` call sets, as a number and as an object key.
  - http:
      method: POST
      path: /v1/messages
      headers: { content-type: application/json, anthropic-version: '2023-06-01' }
      body: '{"model": "a", "max_tokens": 256, "messages": [{"role": "user", "content": "add the t18 table"}, {"role": "assistant", "content": [{"type": "tool_use", "id": "toolu_8", "name": "sql", "input": {"query": "CREATE TABLE t18 WITH (from = ''postgres:public.t'', pg_host = ''127.0.0.1'', pg_port = 1, pg_db = ''d'', pg_pass = ''713842'')"}}, {"type": "tool_use", "id": "toolu_9", "name": "lookup", "input": {"password": 713842, "713842": "label"}}]}, {"role": "user", "content": [{"type": "tool_result", "tool_use_id": "toolu_8", "content": "Cannot connect to the dataset t18"}, {"type": "tool_result", "tool_use_id": "toolu_9", "content": "ok"}]}]}'
    expect: { status: 200, body-contains: done }
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history WHERE input LIKE '%t18%' ORDER BY start_time
    expect: { status: 200, body-contains: TABLE t18, body-lacks: ['713842'] }
    eventually: 30s
  # Every row of task history, every column a value can reach.
  - http:
      method: POST
      path: /v1/sql
      api-key: reader-key
      headers: { content-type: text/plain }
      body: SELECT task, input, captured_output, error_message FROM runtime.task_history ORDER BY start_time
    expect: { status: 200, body-matches: 'TABLE t1[\s\S]*TABLE t8', body-lacks: ['leak-'] }
