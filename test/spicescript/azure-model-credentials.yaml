name: azure-model-credentials
description: >
  An Azure OpenAI model with a credential mistake fails to load with one
  message naming the param to fix: workload identity federation params beside
  an API key, a federated identity without its tenant, or a tenant that is
  neither a tenant ID nor a domain name, and so could change the path of the
  Microsoft Entra token endpoint, or an audience beside a token file, which
  carries its own. A model with no credential at all names every way to give it
  one. None of them reaches a network: each is a configuration error raised
  before any exchange.

spicepod:
  version: v1
  kind: Spicepod
  name: azure-model-credentials
  models:
    - from: azure:gpt-4o-mini
      name: key_and_federation
      params:
        endpoint: https://example.openai.azure.com
        azure_api_key: not-a-key
        azure_tenant_id: contoso.onmicrosoft.com
        azure_client_id: 00000000-0000-0000-0000-000000000001
    - from: azure:gpt-4o-mini
      name: no_tenant
      params:
        endpoint: https://example.openai.azure.com
        azure_client_id: 00000000-0000-0000-0000-000000000001
        azure_federated_token_file: '${instance.dir}/identity-token'
    - from: azure:gpt-4o-mini
      name: bad_tenant
      params:
        endpoint: https://example.openai.azure.com
        azure_tenant_id: contoso/../common
        azure_client_id: 00000000-0000-0000-0000-000000000001
        azure_federated_token_file: '${instance.dir}/identity-token'
    - from: azure:gpt-4o-mini
      name: audience_and_file
      params:
        endpoint: https://example.openai.azure.com
        azure_tenant_id: contoso.onmicrosoft.com
        azure_client_id: 00000000-0000-0000-0000-000000000001
        azure_federated_token_file: '${instance.dir}/identity-token'
        azure_federated_token_audience: api://custom
    - from: azure:gpt-4o-mini
      name: no_credential
      params:
        endpoint: https://example.openai.azure.com
steps:
  - start: { ready: false }
  - assert-log:
      count:
        "WARN .*Invalid value for parameter azure_api_key\\. A model authenticates with either `azure_api_key` or workload identity federation \\(`azure_tenant_id`\\), and both are set\\. Remove one of them\\. See: https://spiceai\\.org/docs/components/models/azure": 1
        "WARN .*Invalid value for parameter azure_tenant_id\\. Workload identity federation needs `azure_tenant_id`, `azure_client_id`, and `azure_tenant_id` is not set\\. See: https://spiceai\\.org/docs/components/models/azure": 1
        "WARN .*Invalid value for parameter azure_tenant_id\\. The Microsoft Entra tenant must be a directory \\(tenant\\) ID, which is a GUID, or a domain name such as 'contoso\\.onmicrosoft\\.com'\\. See: https://spiceai\\.org/docs/components/models/azure": 1
        "WARN .*Invalid value for parameter azure_federated_token_audience\\. `azure_federated_token_audience` applies only to an identity token Spice requests from GitHub Actions, but the identity token comes from `azure_federated_token_file`, whose audience is set where it is issued\\. Remove one of them\\.": 1
        "WARN .*Azure model 'no_credential' requires `azure_api_key`, `azure_entra_token`, or a Microsoft Entra workload identity: `azure_tenant_id` and `azure_client_id`, or on AKS a pod labeled `azure\\.workload\\.identity/use: \"true\"`\\. See https://spiceai\\.org/docs/components/models/azure for details\\.": 1
      lacks: ["login\\.microsoftonline\\.com", "contoso/\\.\\./common/oauth2"]
    eventually: 60s
