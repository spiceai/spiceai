name: cayenne-upgrade
duration: 18s
description: >
  Cayenne state written by each of the last two releases is served by the
  binary under test: a partitioned file acceleration, an append acceleration that keeps appending after the
  upgrade, and an indexed acceleration answering point lookups; full
  refreshes on the new binary then replace what the old one wrote.
  With the object-native metastore, each acceleration loads from its source
  instead, and the release's copy is left exactly as it was: a rollback to the
  release serves it and catches up from the source. One dataset is named
  `cayenne` and kept at the default path, where its directory shares
  `.spice/data/cayenne/` with the object-native store.
  (Snapshots are not in release builds, so they are not covered here.)

matrix:
  from: [2.3.x, 2.4.x]
from: '${matrix.from}'

sources:
  src: { kind: postgres }

variants:
  sqlite: {}
  # The prototype object-native Cayenne metastore (`runtime.params.cayenne_vnext`),
  # which a release ignores. It does not hold partitioned datasets yet (#15996),
  # so `part` is unpartitioned here.
  object-native:
    spicepod: { runtime: { params: { cayenne_vnext: enabled } } }
    datasets: { part: { acceleration: { partition_by: null } } }

spicepod:
  version: v1
  kind: Spicepod
  name: cayenne-upgrade
  datasets:
    - from: postgres:public.items
      name: part
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        refresh_check_interval: 1h
        partition_by: [{ bucket: 'bucket(4, id)' }]
        params: { cayenne_file_path: '${instance.dir}/part', cayenne_metadata_dir: '${instance.dir}/meta' }
    - from: postgres:public.events
      name: app
      params: ${sources.src.params}
      time_column: ts
      time_format: timestamptz
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: append
        refresh_check_interval: 1h
        params: { cayenne_file_path: '${instance.dir}/app', cayenne_metadata_dir: '${instance.dir}/meta' }
    - from: postgres:public.items
      name: idx
      params: ${sources.src.params}
      acceleration:
        enabled: true
        engine: cayenne
        mode: file
        refresh_mode: full
        refresh_check_interval: 1h
        primary_key: id
        indexes: { kind: enabled, price: enabled }
        params: { cayenne_file_path: '${instance.dir}/idx', cayenne_metadata_dir: '${instance.dir}/meta' }
    - from: postgres:public.items
      name: cayenne
      params: ${sources.src.params}
      # Its data at the default path, `.spice/data/cayenne/`; one `spiced` keeps
      # one Cayenne metastore directory, so it shares the others'.
      acceleration: { enabled: true, engine: cayenne, mode: file, refresh_mode: full, refresh_check_interval: 1h, params: { cayenne_metadata_dir: '${instance.dir}/meta' } }

defaults:
  expect: { oracle: src }

steps:
  - source-exec:
      src: |
        CREATE TABLE items (id int PRIMARY KEY, kind text, price numeric(10, 2));
        INSERT INTO items SELECT g, CASE WHEN g % 3 = 0 THEN 'a' ELSE 'b' END, g * 1.5 FROM generate_series(1, 3000) g;
        CREATE TABLE events (id int PRIMARY KEY, ts timestamptz NOT NULL, v int);
        INSERT INTO events SELECT g, TIMESTAMPTZ '2100-01-01 00:00Z' + g * INTERVAL '1 minute', g FROM generate_series(1, 1000) g;
  - start: {}
  - query: SELECT * FROM part
    oracle-sql: SELECT * FROM items
    id: part-before
  - query: SELECT * FROM app
    oracle-sql: SELECT * FROM events
  - query: SELECT id, kind, price FROM idx WHERE id = 1234
    oracle-sql: SELECT id, kind, price FROM items WHERE id = 1234
  - query: SELECT * FROM cayenne
    oracle-sql: SELECT * FROM items

  # Up on the binary under test, over the same files.
  - stop: {}
  - mark-files:
      id: release-copy
      matching: ['^(part|app|idx)/', '^meta/cayenne\.db', '^\.spice/data/cayenne/']
  - upgrade: {}
  # With the object-native metastore each acceleration loads from its source
  # again (its second load line), and the release's files are untouched; on
  # SQLite each is served from the release's files (one load line).
  - assert-log:
      count:
        'Loaded [0-9,]+ rows.* for dataset part in': 2
        'Loaded [0-9,]+ rows.* for dataset app in': 2
        'Loaded [0-9,]+ rows.* for dataset idx in': 2
        'Loaded [0-9,]+ rows.* for dataset cayenne in': 2
    eventually: 60s
    only: object-native
  - assert-log:
      count:
        'Loaded [0-9,]+ rows.* for dataset part in': 1
        'Loaded [0-9,]+ rows.* for dataset idx in': 1
        'Loaded [0-9,]+ rows.* for dataset cayenne in': 1
    except: object-native
  - assert-files: { unchanged-since: release-copy, contains: ['^\.spice/data/cayenne/v1/datasets/'] }
    only: object-native
  - query: SELECT * FROM cayenne
    oracle-sql: SELECT * FROM items
  - query: SELECT * FROM part
    oracle-sql: SELECT * FROM items
    expect: { same-as: part-before }
  - query: SELECT count(*) AS n FROM part WHERE id % 4 = 1
    oracle-sql: SELECT count(*) AS n FROM items WHERE id % 4 = 1
  - query: SELECT id, kind, price FROM idx WHERE id = 1234
    oracle-sql: SELECT id, kind, price FROM items WHERE id = 1234
  - query: SELECT id, kind, price FROM idx WHERE id IN (1, 2999, 5000)
    oracle-sql: SELECT id, kind, price FROM items WHERE id IN (1, 2999, 5000)
  - query: SELECT count(*) AS n FROM idx WHERE kind = 'a' AND price > 4000
    oracle-sql: SELECT count(*) AS n FROM items WHERE kind = 'a' AND price > 4000

  # Appending continues from what the old binary loaded, once each.
  - source-exec: { src: "INSERT INTO events SELECT g, TIMESTAMPTZ '2100-01-01 00:00Z' + g * INTERVAL '1 minute', g FROM generate_series(1001, 1200) g" }
  - refresh: app
  - query: SELECT * FROM app
    oracle-sql: SELECT * FROM events
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM app
    oracle-sql: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM events

  # The source changes; full refreshes on the new binary replace the old data.
  - source-exec: { src: "UPDATE items SET price = 0 WHERE id <= 100; DELETE FROM items WHERE id > 2900" }
  - refresh: part
  - refresh: idx
  - refresh: cayenne
  - query: SELECT * FROM part
    oracle-sql: SELECT * FROM items
  - query: SELECT id, kind, price FROM idx WHERE id IN (50, 2950)
    oracle-sql: SELECT id, kind, price FROM items WHERE id IN (50, 2950)
  - query: SELECT * FROM cayenne
    oracle-sql: SELECT * FROM items

  # Rolled back: the release serves its own copy, which the object-native start
  # left as it was, and catches up from the source. (A release does not read a
  # SQLite metastore a later build migrated, so only the object-native variant
  # rolls back.)
  - stop: {}
    only: object-native
  - assert-files: { unchanged-since: release-copy }
    only: object-native
  - source-exec: { src: "UPDATE items SET kind = 'rolled back' WHERE id <= 10; INSERT INTO events SELECT g, TIMESTAMPTZ '2100-01-01 00:00Z' + g * INTERVAL '1 minute', g FROM generate_series(1201, 1300) g" }
    only: object-native
  - downgrade: {}
    only: object-native
  - refresh: part
    only: object-native
  - refresh: app
    only: object-native
  - refresh: cayenne
    only: object-native
  - query: SELECT * FROM part
    oracle-sql: SELECT * FROM items
    only: object-native
  - query: SELECT * FROM app
    oracle-sql: SELECT * FROM events
    only: object-native
  - query: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM app
    oracle-sql: SELECT count(*) AS n, count(DISTINCT id) AS ids FROM events
    only: object-native
  - query: SELECT * FROM cayenne
    oracle-sql: SELECT * FROM items
    only: object-native
