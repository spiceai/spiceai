{
  "version": "v1",
  "kind": "Spicepod",
  "name": "deadline",
  "runtime": {
    "query": {
      "target_partitions": 1,
      "max_concurrent_queries": 16,
      "memory_limit": "512MiB",
      "timeout": "250ms"
    },
    "caching": {
      "sql_results": {
        "enabled": false,
        "item_ttl": "1h",
        "max_size": "32MiB"
      }
    },
    "mode": "sidecar"
  },
  "datasets": [
    {
      "from": "spice.ai:remote_orders",
      "name": "orders",
      "params": {
        "spiceai_endpoint": "http://127.0.0.1:57521"
      }
    },
    {
      "from": "spiceai:remote_orders",
      "name": "other_orders",
      "params": {
        "spiceai_endpoint": "http://127.0.0.1:57521"
      }
    }
  ]
}