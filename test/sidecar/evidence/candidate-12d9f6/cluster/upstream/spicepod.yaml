{
  "version": "v1",
  "kind": "Spicepod",
  "name": "upstream",
  "runtime": {
    "query": {
      "target_partitions": 1,
      "max_concurrent_queries": 16,
      "memory_limit": "512MiB"
    },
    "caching": {
      "sql_results": {
        "enabled": false,
        "item_ttl": "1h",
        "max_size": "32MiB"
      }
    },
    "state": {
      "location": "file:///private/tmp/spice-sidecar-artifacts/cluster-12d9f6/cluster-state"
    }
  },
  "datasets": [
    {
      "from": "file:/private/tmp/spice-sidecar-artifacts/cluster-12d9f6/orders.csv",
      "name": "remote_orders",
      "params": {
        "file_format": "csv"
      }
    }
  ]
}