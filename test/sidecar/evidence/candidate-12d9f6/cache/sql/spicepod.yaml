{
  "version": "v1",
  "kind": "Spicepod",
  "name": "substrait-cache",
  "runtime": {
    "query": {
      "target_partitions": 1,
      "max_concurrent_queries": 16,
      "memory_limit": "512MiB"
    },
    "caching": {
      "sql_results": {
        "enabled": true,
        "item_ttl": "1h",
        "max_size": "32MiB",
        "cache_key_type": "sql"
      }
    },
    "auth": {
      "api-key": {
        "enabled": true,
        "keys": [
          "alice-cache-key",
          "bob-cache-key:ro"
        ]
      }
    }
  },
  "datasets": []
}