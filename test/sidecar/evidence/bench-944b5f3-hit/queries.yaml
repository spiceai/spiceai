{
  "name": "sidecar-protocol-comparison",
  "queries": [
    {
      "name": "point",
      "sql": "SELECT id, value, label FROM orders WHERE id = 43",
      "expected_results": {
        "columns": "id,value,label",
        "rows": [
          "43,79,group3"
        ]
      }
    },
    {
      "name": "aggregate",
      "sql": "SELECT label, COUNT(*) AS n, SUM(value) AS total FROM orders GROUP BY label ORDER BY label",
      "expected_results": {
        "columns": "label,n,total",
        "rows": [
          "group0,10000,1285157190",
          "group1,10000,1285097163",
          "group2,10000,1285337092",
          "group3,10000,1285277128",
          "group4,10000,1285217172",
          "group5,10000,1285157145",
          "group6,10000,1285397116",
          "group7,10000,1285337181",
          "group8,10000,1285277154",
          "group9,10000,1285517104"
        ]
      }
    },
    {
      "name": "join",
      "sql": "SELECT l.id, l.value, r.label FROM orders l JOIN other_orders r ON l.id = r.id WHERE l.id BETWEEN 10 AND 20 ORDER BY l.id",
      "expected_results": {
        "columns": "id,value,label",
        "rows": [
          "10,-20,group0",
          "11,-17,group1",
          "12,-14,group2",
          "13,-11,group3",
          "14,,group4",
          "15,-5,group5",
          "16,-2,group6",
          "17,1,group7",
          "18,4,group8",
          "19,7,group9",
          "20,10,group0"
        ]
      }
    },
    {
      "name": "topk",
      "sql": "SELECT id, value FROM orders WHERE value IS NOT NULL ORDER BY value DESC, id LIMIT 10 OFFSET 5",
      "expected_results": {
        "columns": "id,value",
        "rows": [
          "99993,299929",
          "99992,299926",
          "99991,299923",
          "99990,299920",
          "99989,299917",
          "99987,299911",
          "99986,299908",
          "99985,299905",
          "99984,299902",
          "99983,299899"
        ]
      }
    },
    {
      "name": "nulls",
      "sql": "SELECT COUNT(*) AS n, COUNT(value) AS nonnull, SUM(value) AS total FROM orders",
      "expected_results": {
        "columns": "n,nonnull,total",
        "rows": [
          "100000,85714,12852771445"
        ]
      }
    }
  ]
