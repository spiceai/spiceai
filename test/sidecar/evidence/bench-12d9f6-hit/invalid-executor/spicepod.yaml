{
  "version": "v1",
  "kind": "Spicepod",
  "name": "executor",
  "runtime": {
    "query": {
      "target_partitions": 1,
      "max_concurrent_queries": 16,
      "memory_limit": "512MiB"
    },
    "caching": {
      "sql_results": {
        "enabled": false,
        "item_ttl": "1h",
        "max_size": "32MiB"
      }
    },
    "mode": "sidecar"
  },
  "datasets": []
}