[profile.default]
retries = { backoff = "exponential", count = 5, delay = "2s", max-delay = "30s", jitter = true }
fail-fast = false
# Timeout for slow tests to prevent hung tests blocking CI
slow-timeout = { period = "120s", terminate-after = 3 }
# Use all available test threads for faster execution.
# Tests must be written to be thread-safe and robust under maximum parallelism.
# If you encounter flaky tests or resource contention in CI, consider reducing this
# to a fixed number of threads or a lower expression (for example, "num-cpus/2").
test-threads = "num-cpus"

# These property tests create multi-threaded Tokio runtimes and continuously run
# background compaction. Letting nextest start one per logical CPU oversubscribes
# the runner (for example, each mutation concurrency test has four Tokio workers)
# and can make deterministic tests exceed the timeout. Keep enough parallelism to
# exercise cross-task races without running every stress test at once.
[test-groups]
cayenne-property-tests = { max-threads = 2 }

# The result-correctness lanes generate their SF1 TPC-H/TPC-DS fixtures into one
# shared scratch directory — `tpch_full_result_parity_vs_duckdb` and
# `spicebench_sf1_tpch_scenario_parity_vs_duckdb` read the very same `tpch_sf1`
# tree — so two of them running at once would race on `dbgen` output that neither
# wrote atomically. Serializing the group also keeps one bundled DuckDB instance
# per machine, which is how #12098 ran this lane when it hit allocator aborts
# under parallelism.
result-correctness = { max-threads = 1 }

# Every GitHub test authenticates as the same account, and GitHub's secondary
# rate limit is per account rather than per connection. nextest runs each test in
# its own process, so the connector's rate controller — a process-global that
# paces one authentication context to GitHub's 2000 points per minute — is pacing
# only its own test. N of them in parallel therefore aim N x 2000 points per
# minute at a budget of 2000, and the group blows the limit while no single test
# is anywhere near it.
#
# That is what run 32945876125 shows: `github::test_github_reviews` failed with
# HTTP 403 "You have exceeded a secondary rate limit" on its first query, while
# sibling GitHub tests were scanning the same repository in neighbouring
# processes. `github::test_github_user` timed out in the same run for the same
# reason once removed — a 403 is a transient error, so the runtime retries the
# dataset load with no deadline (`crates/runtime/src/lib.rs`), and the test's own
# readiness timeout is what finally fires.
#
# Serializing them makes each test's pacing meaningful again, because it is then
# pacing the only caller. This bounds concurrency within a partition; the three
# `Integration Tests (part N)` jobs still run as separate processes, so the ceiling
# is one GitHub test per partition rather than one overall.
github-api-tests = { max-threads = 1 }

# Correctness/convergence property tests: the accelerated table MUST converge to
# the reference model on every run. These are deterministic correctness checks,
# not best-effort work — so a retry that happens to pass only HIDES a real bug
# (e.g. the post-compaction duplicate-row race that surfaced as a masked "flake"
# under CI load). Give them zero retries so any single failure is a hard failure,
# never a silently-recovered flake.
#
# `slow-timeout` here raises only the WALL-CLOCK ceiling, from the global 360s
# (120s x 3) to 1440s (120s x 12). `retries = 0` is deliberately unchanged: an
# assertion failure still fails hard on its first occurrence and is never retried
# into a pass. The two are independent, and only the former carries no
# correctness signal.
#
# Why 1440s. The global 360s cap sits inside this family's noise band rather than
# above it, so it measures pool load instead of the diff under test. The same
# tests, on a quiet pool (run 30833882620) vs. a pool running six concurrent
# sign-offs (run 30858006237):
#
#   cayenne::…                                      quiet   contended   factor
#   mutation_property prop_concurrent_mixed_position 239.5s  killed 360s  >1.5x
#   mutation_property prop_concurrent_mixed_key      192.0s      356.1s   1.85x
#   mutation_property mixed_dense_position           122.8s      208.6s   1.70x
#   partition_chunking …timestamp_partition…         247.9s      308.1s   1.24x
#
# In that contended run `prop_concurrent_mixed_key` PASSED at 356.1s while its
# matched sibling `prop_concurrent_mixed_position` was killed at 360.015s — a
# 1.1% margin deciding a merge gate. Sign-off run 31239284344 is the far end:
# `prop_concurrent_upsert_only_key` passed at 422.1s against a 92.0s quiet
# baseline — a 4.6x contention factor — while `prop_concurrent_mixed_position`
# was killed at the cap, with no assertion failure or panic anywhere in the log.
#
# So the slowest test here intrinsically needs ~240s and contention has been
# measured multiplying that by up to 4.6x. Sizing the cap to exactly 240s x 4.6
# would be correct only until the pool got busier by any margin, and each such
# miss costs a full sign-off cycle and reports a code failure against a diff that
# cannot reach this crate (#12811) — so the cap carries a further 1.25x, which
# 1440s clears. That is 6x the slowest baseline here. A genuine hang is still
# caught, just at 24 minutes instead of 6, and only a hang ever pays for the
# headroom.
#
# This is a ceiling, not a target: if these tests get slower on a QUIET pool,
# that is a regression to investigate, not a reason to raise this again. It is
# `.github/scripts/check_nextest_config.py` that holds this to the measurements,
# so re-derive it there — the numbers above are its inputs, not its record.
[[profile.default.overrides]]
filter = 'binary(=mutation_property_test) | binary(=cdc_compaction_delete_race_test) | binary(=maintained_aggregate_filter_test)'
test-group = 'cayenne-property-tests'
retries = 0
slow-timeout = { period = "120s", terminate-after = 12 }

# The same wall-clock margin, for the long-running cayenne binaries that are NOT
# in the zero-retry group above. These keep the default retries, so a timeout is
# recoverable rather than a hard gate failure — but recovering costs up to
# 5 x 360s = 30 minutes of runner time for a test that only ever needed wall
# clock. That is not hypothetical: in merge-queue run 30723487049
# `partition_chunking_test …timestamp_partition_with_date_part` hit the cap on
# tries 1-5 and then passed on try 6 at 305.5s.
#
# A cap that clears contention is what makes that retry budget cheap rather than
# expensive: the retries are there to absorb a genuine flake, and every one spent
# on wall clock alone is one the run pays for in full. Sizing this to match the
# group above means these tests are expected to pass on the first try under the
# contention measured so far, so the budget is not consumed re-running work that
# was never going to finish inside a smaller cap.
#
# Quiet-pool baselines (run 30833882620) against the 4.6x contention factor and
# the 1.25x headroom, i.e. 5.75x: partition_chunking 247.9s needs 1425s and
# layout_pruning_ab 170.1s needs 978s, so both land here.
#
# Spelled out as its own block rather than folded into the filter above so that
# `retries = 0` stays visibly scoped to the three convergence binaries that need
# it. These binaries must NOT inherit it.
[[profile.default.overrides]]
filter = 'binary(=partition_chunking_test) | binary(=layout_pruning_ab_test)'
slow-timeout = { period = "120s", terminate-after = 12 }

# `mutation_model_test` is the same family but a third of the runtime: 107.1s
# quiet, so 616s at 5.75x, which the existing 960s already clears with room to
# spare. It stays at 8.
#
# Raising it with the others would buy nothing and cost something. Nothing,
# because the ceiling is already above what the model predicts under the worst
# contention measured plus headroom — the reason the other two moved. Something,
# because this binary keeps the default retries: a genuine hang is killed once
# per attempt, so every second added to the ceiling is spent six times over
# (5 retries + the first try). Going to 12 would add 480s x 6 = 48 minutes to
# the cost of catching one, on the binary least likely to need the room.
#
# The rule this follows is the one stated above: the ceiling is derived from the
# measurement, not copied from a sibling. If a quiet-pool baseline here grows
# past 167s (960 / 5.75), that is the signal to move it — and
# `.github/scripts/check_nextest_config.py` is what will say so.
[[profile.default.overrides]]
filter = 'binary(=mutation_model_test)'
slow-timeout = { period = "120s", terminate-after = 8 }

# Hold every GitHub test to the `github-api-tests` group — see its definition
# above for why the shared secondary rate limit makes parallelism self-defeating
# here.
[[profile.default.overrides]]
filter = 'test(/^github::/)'
test-group = 'github-api-tests'

# Same reasoning for the MySQL CDC convergence tests: a retry that passes hides a lost update.
[[profile.default.overrides]]
filter = 'test(=mysql::replication_e2e::mysql_binlog_replication_survives_a_dump_reconnect_cayenne) | test(=mysql::replication_e2e::mysql_binlog_replication_decodes_every_column_type_cayenne)'
retries = 0

# Result-correctness parity lanes: Cayenne (and the Spice accelerators) against
# standalone DuckDB/SQLite on the same rows.
#
# `retries = 0` for the same reason the convergence binaries have it: these
# compare two engines' answers to the same SQL over the same data, so a mismatch
# is deterministic and a retry cannot turn a real one into a pass — it only pays
# the ~250s runtime up to five more times before reporting the failure it already
# had. The one genuinely environmental step, installing DuckDB's tpch/tpcds
# extensions, is handled in the test: an unavailable fixture is reported as a
# counted exclusion rather than a failure, so there is nothing here for a retry
# to rescue.
#
# `slow-timeout` raises the wall-clock ceiling from the global 360s (120s x 3) to
# 1200s (120s x 10). The slowest test is the SF1 TPC-DS + ClickBench comparison,
# measured at 127.7s locally with fixtures already generated; CI pays `dsdgen` on
# every fresh runner on top of that, and contention on the shared pool has been
# measured multiplying runtimes 4.6x. With `retries = 0` a wall-clock kill is an
# unrecoverable merge-queue failure, so this needs room rather than the global
# ceiling. See `.github/scripts/check_nextest_config.py`, which holds this
# binary's baseline and fails if the ceiling stops clearing it.
[[profile.default.overrides]]
filter = 'binary(=result_correctness_vs_duckdb_test) | binary(=result_correctness_standalone_engines_test)'
test-group = "result-correctness"
retries = 0
slow-timeout = { period = "120s", terminate-after = 10 }
