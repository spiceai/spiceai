[package]
name = "connector-ducklake"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "DuckLake data connector for Spice.ai runtime"

[dependencies]
linkme.workspace = true
async-trait.workspace = true
data_components = { path = "../../data_components", features = ["duckdb"] }
datafusion.workspace = true
datafusion-table-providers = { workspace = true }
duckdb = { workspace = true, features = ["bundled", "r2d2", "extensions-full"] }
runtime = { path = "../../runtime" }
runtime-component = { path = "../../runtime-component" }
runtime-datafusion = { path = "../../runtime-datafusion" }
runtime-parameters = { path = "../../runtime-parameters" }
snafu.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []

[lints]
workspace = true
