[package]
description = "Databricks data and catalog connector for Spice.ai runtime"
edition.workspace = true
license-file.workspace = true
name = "connector-databricks"
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
aws-sdk-credential-bridge = { path = "../../aws-sdk-credential-bridge" }
data_components = { path = "../../data_components", features = ["databricks"] }
datafusion.workspace = true
futures.workspace = true
linkme.workspace = true
opentelemetry.workspace = true
paste.workspace = true
runtime = { path = "../../runtime", features = ["databricks"] }
runtime-rate-control = { path = "../../runtime-rate-control" }
runtime-secrets = { path = "../../runtime-secrets", default-features = false }
secrecy.workspace = true
snafu.workspace = true
token_provider = { path = "../../token_provider" }
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[features]
default = []
spark = []

[dev-dependencies]
app = { path = "../../app" }
spicepod = { path = "../../spicepod" }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
] }
