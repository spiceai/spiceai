# This crate is excluded from the workspace because it requires system libnfs library.
#
# The empty `[workspace]` makes it a workspace root of its own. An excluded
# package belongs to no workspace, so cargo resolves one by walking the
# directory tree upwards — and without this it walks straight past the
# repository into whatever encloses it. A git worktree created *inside* the
# checkout then resolves to the outer checkout's workspace, and every
# `cargo metadata` in that worktree fails with "current package believes it's in
# a workspace when it's not". `cargo fmt --all` is the first thing to hit it, so
# sign-off dies there before running a check.
#
# Setting `package.workspace` to the repository root instead does not work: the
# root excludes this crate, so cargo rejects the pairing.
[workspace]
# Build with: cargo build -p connector-nfs --manifest-path crates/data-connectors/connector-nfs/Cargo.toml
[package]
name = "connector-nfs"
edition = "2024"
version = "1.11.0-unstable"
rust-version = "1.96.1"
license = "Apache-2.0"
description = "NFS data connector for Spice.ai runtime"

[dependencies]
data-connector-api = { path = "../../data-connector-api" }
linkme = "0.3.35"
paste = "1.0.15"
runtime-component = { path = "../../runtime-component" }
runtime-parameters = { path = "../../runtime-parameters" }
snafu = "0.8.6"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "macros", "test-util", "time"] }
url = "2.5"
