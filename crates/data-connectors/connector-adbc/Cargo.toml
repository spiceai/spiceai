[package]
name = "connector-adbc"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "ADBC data connector for Spice.ai runtime"

[dependencies]
adbc_core.workspace = true
adbc_driver_manager.workspace = true
arrow.workspace = true
async-trait.workspace = true
blake3.workspace = true
data_components = { path = "../../data_components", features = ["adbc"] }
datafusion.workspace = true
datafusion-table-providers = { workspace = true, features = ["adbc-federation"] }
futures.workspace = true
parking_lot.workspace = true
runtime = { path = "../../runtime" }
snafu.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []
