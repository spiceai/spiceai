[package]
name = "connector-mysql"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "MySQL data connector for Spice.ai runtime"

[dependencies]
arrow_tools = { path = "../../arrow_tools" }
async-stream.workspace = true
async-trait.workspace = true
chrono.workspace = true
data-connector-api = { path = "../../data-connector-api" }
data_components = { path = "../../data_components", features = ["mysql"] }
datafusion.workspace = true
datafusion-table-providers = { workspace = true, features = ["mysql", "mysql-federation"] }
fundu.workspace = true
futures.workspace = true
linkme.workspace = true
mysql_async.workspace = true
opentelemetry.workspace = true
paste.workspace = true
runtime-component = { path = "../../runtime-component" }
runtime-api-types = { path = "../../runtime-api-types" }
runtime-checkpoint-api = { path = "../../runtime-checkpoint-api" }
runtime-metrics = { path = "../../runtime-metrics" }
runtime-parameters = { path = "../../runtime-parameters" }
runtime-datafusion = { path = "../../runtime-datafusion" }
secrecy.workspace = true
snafu.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
default = []

[dev-dependencies]
runtime = { path = "../../runtime" }

[lints]
workspace = true
