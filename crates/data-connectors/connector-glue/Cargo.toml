[package]
name = "connector-glue"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "AWS Glue data connector for Spice.ai runtime"

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
data_components = { path = "../../data_components", features = ["glue"] }
aws-credential-types.workspace = true
aws-sdk-glue.workspace = true
aws-sdk-s3.workspace = true
iceberg.workspace = true
iceberg-catalog-glue.workspace = true
iceberg-datafusion.workspace = true
iceberg-storage-opendal.workspace = true
runtime = { path = "../../runtime" }
secrecy.workspace = true
snafu.workspace = true

[features]
default = []
iceberg-write = []
