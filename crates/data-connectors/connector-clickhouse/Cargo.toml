[dependencies]
arrow.workspace = true
async-stream.workspace = true
async-trait.workspace = true
bigdecimal.workspace = true
chrono.workspace = true
chrono-tz = "0.8.6"
clickhouse-rs.workspace = true
data-connector-api = { path = "../../data-connector-api" }
data_components = { path = "../../data_components", features = ["federation"] }
datafusion.workspace = true
datafusion-table-providers.workspace = true
futures.workspace = true
linkme.workspace = true
ns_lookup = { path = "../../ns_lookup" }
paste.workspace = true
runtime-component = { path = "../../runtime-component" }
runtime-parameters = { path = "../../runtime-parameters" }
runtime-udfs-api = { path = "../../runtime-udfs-api" }
secrecy.workspace = true
snafu.workspace = true
url.workspace = true
uuid.workspace = true

[features]
default = []

[dev-dependencies]
runtime = { path = "../../runtime" }

[lints]
workspace = true
