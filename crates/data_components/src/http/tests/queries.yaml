# Custom scenario query set for HTTP connector testing with TVMaze API
#
# This file demonstrates the scenario query format for testoperator.
# Scenario queries allow you to define custom query sets with optional validation.
#
# Usage:
#   testoperator run bench \
#     -p ./test/spicepods/http/basic.yaml \
#     -s spiced \
#     --query-set scenario \
#     --scenario-query-file ./crates/data_components/src/http/tests/queries.yaml \
#     --validate

name: http_tvmaze

queries:
  # Test 1: Single JSON object - Breaking Bad show details
  - name: single_object_show
    sql: SELECT request_path, request_query, content FROM show_details WHERE request_path = '/shows/169'
    expected_results:
      row_count: 1

  # Test 2: JSON array expansion - People search results
  - name: multi_object_search
    sql: SELECT request_path, request_query, COUNT(*) as result_count FROM people_search WHERE request_path = '/search/people' AND request_query = 'q=michael' GROUP BY request_path, request_query
    expected_results:
      row_count: 1

  # Test 3: Combined OR filter across endpoints
  - name: combined_endpoints
    sql: SELECT request_path, COUNT(*) as count FROM combined_data GROUP BY request_path ORDER BY request_path
    expected_results:
      row_count: 2

  # Test 4: IN list with multiple show IDs
  - name: multiple_shows_in_list
    sql: SELECT request_path FROM multiple_shows ORDER BY request_path
    expected_results:
      columns: 'request_path'
      rows:
        - '/shows/169'
        - '/shows/170'
        - '/shows/171'

  # Test 5: Verify content structure for single object
  - name: verify_show_structure
    sql: |
      SELECT 
        request_path,
        json_get(content, 'id') as show_id,
        json_get(content, 'name') as show_name
      FROM show_details 
      WHERE request_path = '/shows/169'
    expected_results:
      columns: 'request_path, show_id, show_name'
      rows:
        - '/shows/169, 169, Breaking Bad'

  # Test 6: Count results without filters (should get all data)
  - name: count_all_search_results
    sql: SELECT COUNT(*) as total FROM people_search
    expected_results:
      row_count: 1

  # Test 7: Verify multiple shows have different IDs
  - name: verify_multiple_shows
    sql: |
      SELECT COUNT(DISTINCT json_get(content, 'id')) as distinct_shows
      FROM multiple_shows
    expected_results:
      row_count: 1

  # Test 8: Verify people search returns valid data
  - name: verify_search_structure
    sql: |
      SELECT 
        COUNT(*) as total,
        COUNT(DISTINCT content) as distinct_results
      FROM people_search
      WHERE request_path = '/search/people' AND request_query = 'q=michael'
    expected_results:
      row_count: 1

  # Test 9: Test selecting only content without metadata columns
  - name: select_content_only
    sql: SELECT content FROM show_details WHERE request_path = '/shows/169'
    expected_results:
      row_count: 1
