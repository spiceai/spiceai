[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "data_components"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
adbc_core = { workspace = true, optional = true }
adbc_driver_manager = { workspace = true, optional = true }
ahash.workspace = true
arrow.workspace = true
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-flight.workspace = true
arrow-row.workspace = true
arrow-schema = { workspace = true, features = ["serde"] }
arrow_tools = { path = "../arrow_tools" }
async-stream.workspace = true
async-trait.workspace = true
aws-credential-types.workspace = true
aws-sdk-credential-bridge = { path = "../aws-sdk-credential-bridge" }
base64.workspace = true
bb8 = { workspace = true, optional = true }
bb8-oracle = { version = "0.3", features = ["chrono"], optional = true }
bigdecimal = { workspace = true, optional = true }
bytes.workspace = true
chrono.workspace = true
connector-postgres-common = { path = "../data-connectors/connector-postgres-common", optional = true }
dashmap = "6.1"
dataformat-json = { path = "../dataformat-json" }
datafusion.workspace = true
datafusion-datasource.workspace = true
datafusion-federation = { workspace = true }
datafusion-table-providers = { workspace = true }
db_connection_pool = { path = "../db_connection_pool" }
delta_kernel = { workspace = true, optional = true }
document_parse = { path = "../document_parse" }
duckdb = { workspace = true, features = [
    "bundled",
    "r2d2",
    "vtab",
    "vtab-arrow",
    "appender-arrow",
], optional = true }
flight_client = { path = "../flight_client" }
futures.workspace = true
moka.workspace = true
globset.workspace = true
hash-index = { path = "../hash-index", features = ["metrics"] }
http.workspace = true
httpdate.workspace = true
iceberg.workspace = true
parquet = { workspace = true }
iceberg-catalog-rest.workspace = true
iceberg-datafusion.workspace = true
indexmap.workspace = true
logos.workspace = true
mysql_async = { workspace = true, optional = true }
# Value-only row-image parsing (mysql_replication::binlog::TableMapRowDecoder):
# `ParseBuf` is not re-exported by mysql_async; the version matches the
# mysql_async pin so this adds no extra compilation unit.
mysql_common = { version = "0.35.5", default-features = false, features = ["binlog"], optional = true }
# Included-column bitmaps in mysql_common's rows-event API are bitvec slices.
bitvec = { version = "1", optional = true }
num_cpus = "1.16"
object_store = { workspace = true }
opendal.workspace = true
parking_lot.workspace = true
rustc-hash = "2"
oracle = { version = "0.6", optional = true }
native-tls = { workspace = true, optional = true }
percent-encoding.workspace = true
pgwire-replication = { workspace = true, optional = true }
postgres-native-tls = { workspace = true, optional = true }
postgres-protocol = { workspace = true, optional = true }
rand.workspace = true
rdkafka = { workspace = true, features = ["ssl-vendored"], optional = true }
regex.workspace = true
reqwest.workspace = true
runtime-checkpoint-api = { path = "../runtime-checkpoint-api" }
runtime-rate-control = { path = "../runtime-rate-control" }
runtime-request-context = { path = "../runtime-request-context" }
rusqlite = { workspace = true, optional = true }
elasticsearch = { path = "../elasticsearch", optional = true }
qdrant = { path = "../qdrant", optional = true }
s3_vectors = { path = "../s3_vectors", optional = true }
s3_vectors_metadata_filter = { path = "../s3_vectors_metadata_filter", optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
spice-table = { path = "../spice-table" }
snowflake-api = { workspace = true, optional = true }
spark-connect-rs = { git = "https://github.com/spiceai/spark-connect-rs.git", rev = "5f7c2452d4202d7496abac0a6f2eaa4bef46a5ad", features = [
    "tls",
], optional = true } # branch: spiceai-58
telemetry = { path = "../telemetry" }
tempfile.workspace = true
tiberius = { workspace = true, optional = true }
token_provider = { path = "../token_provider" }
tokio.workspace = true
tokio-postgres = { workspace = true, features = [
    "with-chrono-0_4",
], optional = true }
tokio-util = { workspace = true, optional = true }
tonic = { workspace = true }
tracing.workspace = true
turso = { workspace = true, optional = true }
turso-shared = { workspace = true, optional = true }
twox-hash.workspace = true
url.workspace = true
util = { path = "../util", features = ["datafusion"] }
uuid.workspace = true
zip = "8.3.0"
tokio-stream.workspace = true

# Align on 0.21 (already pulled in via iceberg) so the binary carries one
# apache-avro, not two majors. Default features off avoids `xz` (pulls
# `lzma-sys`, which conflicts with DataFusion's `liblzma`).
apache-avro = { version = "0.21", optional = true, default-features = false, features = [
    "bzip",
    "snappy",
    "zstandard",
] }

[target.'cfg(windows)'.dependencies]
rdkafka = { workspace = true, features = ["cmake-build"], optional = true }

[features]
bench = [] # Feature for benchmarking that exposes internal functions
adbc = ["dep:adbc_core", "dep:adbc_driver_manager", "datafusion-table-providers/adbc-federation"]
# Shared Spice federation deny-list wrapper (crate::federation). Requires the
# upstream `impl SQLExecutor for SqlTable`, which is gated behind
# `datafusion-table-providers/federation`.
federation = ["datafusion-table-providers/federation"]
databricks = [
    "delta_lake",
    "spark_connect",
    "datafusion-table-providers/federation",
]
debezium = ["dep:rdkafka", "dep:apache-avro"]
default = []
delta_lake = ["dep:delta_kernel"]
elasticsearch = ["dep:elasticsearch"]
qdrant = ["dep:qdrant"]
duckdb = [
    "dep:duckdb",
    "db_connection_pool/duckdb",
    "datafusion-table-providers/duckdb",
    "datafusion-table-providers/duckdb-federation",
]
flightsql = []
kafka = ["dep:rdkafka"]
mssql = ["dep:tiberius", "dep:tokio-util", "dep:bb8"]
# Kerberos integrated auth (GSSAPI) for MSSQL on Unix.
# Opt-in: only links libgssapi_krb5 when explicitly enabled. Windows integrated auth uses SSPI and needs no extra feature.
# Weak dep so this is a no-op unless `mssql` is also on.
mssql-kerberos-unix = ["tiberius?/integrated-auth-gssapi"]
mysql = [
    "dep:mysql_async",
    "dep:mysql_common",
    "dep:bitvec",
    "datafusion-table-providers/mysql",
    "datafusion-table-providers/mysql-federation",
]
oracle = ["dep:oracle", "dep:bb8", "dep:bb8-oracle", "dep:bigdecimal"]
postgres = [
    "dep:tokio-postgres",
    "dep:pgwire-replication",
    "dep:native-tls",
    "dep:postgres-native-tls",
    "dep:postgres-protocol",
    "dep:connector-postgres-common",
    "federation",
    "datafusion-table-providers/postgres",
    "datafusion-table-providers/postgres-federation",
]
s3_vectors = ["dep:s3_vectors", "dep:s3_vectors_metadata_filter"]
snowflake = [
    "dep:snowflake-api",
    "federation",
    "datafusion-table-providers/federation",
    "db_connection_pool/snowflake",
]
spark_connect = ["dep:spark-connect-rs"]
sqlite = [
    "dep:rusqlite",
    "datafusion-table-providers/sqlite",
    "datafusion-table-providers/sqlite-federation",
]
turso = ["dep:turso", "dep:turso-shared", "datafusion-table-providers/sqlite-federation"]

[dev-dependencies]
arrow = { workspace = true, features = ["prettyprint"] }
arrow-array = { workspace = true }
aws-smithy-types = { workspace = true }
brotli = "8.0.2"
chrono = { workspace = true }
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }
flate2 = "1.1.5"
iceberg-storage-opendal.workspace = true
iceberg_test_utils = { workspace = true, features = ["tests"] }
insta.workspace = true
object_store = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
tokio-stream = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
wiremock = "0.6"
zstd = "0.13.3"

[[bench]]
harness = false
name = "arrow_write"
required-features = ["bench"]

[[bench]]
harness = false
name = "object_filter"

[[bench]]
harness = false
name = "shared_pump_bench"
required-features = ["postgres"]

[[bench]]
harness = false
name = "ack_table_bench"
required-features = ["postgres"]

[[bench]]
harness = false
name = "kafka_decode"
required-features = ["bench", "kafka"]

[[bench]]
harness = false
name = "pgoutput_decode"
required-features = ["postgres"]

[[bench]]
harness = false
name = "mysql_binlog_replay"
required-features = ["mysql"]

[lints]
workspace = true
