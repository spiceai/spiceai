# Create an S3-compatible store, so we can copy the hadoop warehouse into it for testing.
# MinIO no longer publishes images to Docker Hub or quay.io, so this is RustFS, the store
# spicescript tests against, under the service name `minio` that the setup scripts address.
services:
  minio:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    expose:
      - 9000
    environment:
      - RUSTFS_ACCESS_KEY=admin
      - RUSTFS_SECRET_KEY=password
    command: [ "/data" ]
    networks:
      - default

  setup:
    depends_on:
      - minio
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    healthcheck:
      test: bash -c "[ -f /opt/setup_done ]"
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 20s
    networks:
      - default
networks:
  default:
    driver: bridge