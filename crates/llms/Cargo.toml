[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
publish.workspace = true
name = "llms"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
snafu.workspace = true

async-openai.workspace = true
async-stream.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
cache = { path = "../cache" }
chunking = { path = "../chunking" }
futures = { workspace = true }
google-genai = { path = "../google-genai" }
governor.workspace = true

hf-hub.workspace = true
insta = { workspace = true, features = ["filters"] }
itertools.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-eventsource = "0.6.0"
runtime-rate-control = { path = "../runtime-rate-control" }
schemars.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
spicepod = { path = "../spicepod" }
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
util = { path = "../util", features = ["datafusion"] }

mistralrs = { git = "https://github.com/spiceai/mistral.rs", rev = "6e64b990543ef1571ce512ca77b8ae4bae52c4c5", optional = true } # branch: spiceai
mistralrs-core = { git = "https://github.com/spiceai/mistral.rs", rev = "6e64b990543ef1571ce512ca77b8ae4bae52c4c5", package = "mistralrs-core", optional = true } # branch: spiceai
rand.workspace = true

tei_backend = { package = "text-embeddings-backend", git = "https://github.com/spiceai/text-embeddings-inference.git", optional = true, rev = "ae95f20fe13dfadb84ded1aa6eea76f09c9a33a3", features = [
    "candle",
] }

tei_backend_core = { package = "text-embeddings-backend-core", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ae95f20fe13dfadb84ded1aa6eea76f09c9a33a3", optional = true }
tei_candle = { package = "text-embeddings-backend-candle", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ae95f20fe13dfadb84ded1aa6eea76f09c9a33a3", optional = true }
tei_core = { package = "text-embeddings-core", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ae95f20fe13dfadb84ded1aa6eea76f09c9a33a3", optional = true }

cudarc = { version = "0.19", optional = true, features = [
    "cuda-version-from-build-system",
] }
either = "1.15.0"
indexmap.workspace = true
tempfile.workspace = true
token_provider = { path = "../token_provider" }

model2vec-rs = { git = "https://github.com/spiceai/model2vec-rs.git", rev = "f1190f1f140105f0c5ac8335fbbac402051ab072", optional = true }

[dev-dependencies]
anyhow.workspace = true
aws-credential-types.workspace = true
aws-sdk-credential-bridge = { path = "../aws-sdk-credential-bridge" }
dotenvy.workspace = true
insta = {workspace = true, features = ["json"] }
jsonpath-rust = "0.7.3"
paste.workspace = true
rstest = "0.26.1"
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
cuda = [
    "tei_backend/cuda",
    "tei_candle/cuda",
    "mistralrs-core/cuda",
    "mistralrs-core/flash-attn",
    "mistralrs/cuda",
    "mistralrs/flash-attn",
    "cudarc/cuda-version-from-build-system",
]
local_embed = [
    "dep:tei_backend",
    "dep:tei_backend_core",
    "dep:tei_candle",
    "dep:tei_core",
    "dep:model2vec-rs",
]
local_llm = ["dep:mistralrs", "dep:mistralrs-core"]
metal = [
    "tei_backend/metal",
    "tei_candle/metal",
    "mistralrs-core/metal",
    "mistralrs/metal",
]

default = ["local_llm", "local_embed"]
