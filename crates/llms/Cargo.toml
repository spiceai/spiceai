[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "llms"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
snafu.workspace = true

async-openai.workspace = true
async-stream.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-smithy-types.workspace = true
bytes.workspace = true
cache = { path = "../cache" }
chunking = { path = "../chunking" }
futures = { workspace = true }
google-genai = { path = "../google-genai" }
governor.workspace = true

hf-hub.workspace = true
insta = { workspace = true, features = ["filters"] }
itertools.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-eventsource = { git = "https://github.com/spiceai/reqwest-eventsource", rev = "eb11e695128ce264bf05e4220ce2311c25992c73" } # branch: spiceai
runtime-rate-control = { path = "../runtime-rate-control" }
runtime-request-context = { path = "../runtime-request-context" }
schemars.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
spicepod = { path = "../spicepod" }
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
util = { path = "../util", features = ["datafusion"] }

mistralrs = { git = "https://github.com/spiceai/mistral.rs", rev = "2d15d171236803481d582a9fbf8a80869bf74d8c", optional = true } # branch: lukim/spiceai-v0.9.0 (mistral.rs v0.9.0 upgrade; refresh to merged SHA)
mistralrs-core = { git = "https://github.com/spiceai/mistral.rs", rev = "2d15d171236803481d582a9fbf8a80869bf74d8c", package = "mistralrs-core", optional = true } # branch: lukim/spiceai-v0.9.0 (mistral.rs v0.9.0 upgrade; refresh to merged SHA)
rand.workspace = true

tei_backend = { package = "text-embeddings-backend", git = "https://github.com/spiceai/text-embeddings-inference.git", optional = true, rev = "ac4e457936bc11c9b4fee453f2be33133d3146d8", features = [
    "candle",
] }

tei_backend_core = { package = "text-embeddings-backend-core", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ac4e457936bc11c9b4fee453f2be33133d3146d8", optional = true }
tei_candle = { package = "text-embeddings-backend-candle", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ac4e457936bc11c9b4fee453f2be33133d3146d8", optional = true }
tei_core = { package = "text-embeddings-core", git = "https://github.com/spiceai/text-embeddings-inference.git", rev = "ac4e457936bc11c9b4fee453f2be33133d3146d8", optional = true }

cudarc = { version = "0.19", optional = true, features = [
    "cuda-version-from-build-system",
] }
either = "1.15.0"
indexmap.workspace = true
tempfile.workspace = true
token_provider = { path = "../token_provider" }

model2vec-rs = { git = "https://github.com/spiceai/model2vec-rs.git", rev = "f1190f1f140105f0c5ac8335fbbac402051ab072", optional = true }

[dev-dependencies]
anyhow.workspace = true
aws-credential-types.workspace = true
aws-sdk-credential-bridge = { path = "../aws-sdk-credential-bridge" }
dotenv.workspace = true
insta = {workspace = true, features = ["json"] }
jsonpath-rust = "0.7.3"
paste.workspace = true
rstest = "0.26.1"
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

[features]
cuda = [
    "tei_backend/cuda",
    "tei_candle/cuda",
    "mistralrs-core/cuda",
    "mistralrs/cuda",
    "cudarc/cuda-version-from-build-system",
]
# Flash-Attention is opt-in (compose with `cuda`). It MUST stay off for
# MLA-attention models (GLM-4.5/5.x, DeepSeek-V3/R1) whose kernels abort it;
# enable only for standard-attention models that benefit.
flash-attn = [
    "mistralrs-core/flash-attn",
    "mistralrs/flash-attn",
]
# Multi-node distributed (tensor-parallel) inference via mistral.rs's pure-TCP ring
# all-reduce. No system dependency (unlike `nccl`). Composes with `cuda`. Activated at
# runtime when a model sets `params.distributed_backend: ring` + a `nodes` list; see
# `DistributedBackend::Ring` for what the backend guarantees.
#
# OFF BY DEFAULT: multi-node distributed inference is a Spice enterprise feature
# and is intentionally not enabled in standard (OSS) builds. The `distributed`
# name is backend-agnostic (currently the `ring` backend; `nccl` may follow).
distributed = [
    "local_llm",
    "mistralrs-core/ring",
    "mistralrs/ring",
]
local_embed = [
    "dep:tei_backend",
    "dep:tei_backend_core",
    "dep:tei_candle",
    "dep:tei_core",
    "dep:model2vec-rs",
]
local_llm = ["dep:mistralrs", "dep:mistralrs-core"]
metal = [
    "tei_backend/metal",
    "tei_candle/metal",
    "mistralrs-core/metal",
    "mistralrs/metal",
]

default = ["local_llm", "local_embed"]

[lints]
workspace = true
