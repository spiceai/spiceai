[package]
name = "object_store_occ"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
description = "Type-safe object storage with optimistic concurrency control"
autotests = false

[dependencies]
async-trait.workspace = true
bytes = { workspace = true, features = ["serde"] }
blake3.workspace = true
futures.workspace = true
object_store.workspace = true
parking_lot.workspace = true
prost = { workspace = true, features = ["derive"] }
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4", "v7"] }

[dev-dependencies]
cayenne-metastore-model = { path = "../cayenne-metastore-model" }
object_store_sim = { path = "../object_store_sim" }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "fs"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
