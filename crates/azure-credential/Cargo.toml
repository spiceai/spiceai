[package]
description = "The workload's Microsoft Entra identity, found as the Azure SDKs' default credential finds it, for every Azure component"
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "azure-credential"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
# The 1.x line, as runtime-secrets' Key Vault store pins it, so one azure_core ships.
azure_core = "1.1.0"
azure_identity = "1.0.0"
chrono.workspace = true
secrecy.workspace = true
snafu.workspace = true
token_provider = { path = "../token_provider" }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
util = { path = "../util" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
