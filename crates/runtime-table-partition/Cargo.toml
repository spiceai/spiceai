[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-table-partition"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow = { workspace = true }
arrow-schema.workspace = true
async-trait.workspace = true
chrono.workspace = true
data_components = { path = "../data_components" }
datafusion.workspace = true
datafusion-physical-plan = { workspace = true, optional = true, features = ["proto"] }
datafusion-proto-models = { workspace = true, optional = true }
futures.workspace = true
parking_lot = "0.12"
runtime-datafusion-udfs = { path = "../runtime-datafusion-udfs" }
snafu.workspace = true
spicepod = { path = "../spicepod" }
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "macros"] }
tokio-stream.workspace = true
tracing.workspace = true
util = { path = "../util" }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
insta = { workspace = true, features = ["json"] }
tempfile.workspace = true

[[bench]]
name = "scan_benchmark"
harness = false

[features]
# Enable when ballista-core's `datafusion-proto` dep unifies `datafusion-physical-plan/proto` workspace-wide.
proto = ["dep:datafusion-physical-plan", "dep:datafusion-proto-models"]

[lints]
workspace = true
