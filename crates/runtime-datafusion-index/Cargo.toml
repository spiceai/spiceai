[package]
description = "Indexing middleware and traits for the Spice runtime that extend DataFusion"
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-datafusion-index"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
arrow_tools = { path = "../arrow_tools" }
datafusion.workspace = true
datafusion-physical-plan = { workspace = true, optional = true, features = ["proto"] }
datafusion-proto-models = { workspace = true, optional = true }
futures.workspace = true
itertools.workspace = true
snafu.workspace = true
spice-table = { path = "../spice-table" }
tracing.workspace = true

[dev-dependencies]
tokio.workspace = true

[features]
# Enable when ballista-core's `datafusion-proto` dep unifies `datafusion-physical-plan/proto` workspace-wide.
proto = ["dep:datafusion-physical-plan", "dep:datafusion-proto-models"]

[lints]
workspace = true
