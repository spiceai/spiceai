[package]
description = "Sharded in-memory cache with LRU and TinyLFU eviction for Spice results caches"
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "sharded-cache"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
parking_lot.workspace = true
# Specification and proof vocabulary for `src/layout.rs`; `cargo verus focus`
# re-checks the proofs. The workspace pins it to the Verus release CI runs.
vstd.workspace = true

[[bench]]
harness = false
name = "size_scaling"

[lints]
workspace = true

# Opts this crate into `cargo verus focus`. Without it the verifier compiles the
# crate and checks nothing, reporting "no crates that opted into verification".
[package.metadata.verus]
verify = true
