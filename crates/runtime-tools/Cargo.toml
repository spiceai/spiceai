[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-tools"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow.workspace = true
arrow-json.workspace = true
arrow-schema.workspace = true
arrow_tools = { path = "../arrow_tools" }
app = { path = "../app" }
async-openai.workspace = true
async-trait.workspace = true
cache = { path = "../cache" }
chrono.workspace = true
datafusion.workspace = true
fundu.workspace = true
futures.workspace = true
itertools.workspace = true
globset.workspace = true
http.workspace = true
# `client` gates `rmcp::service`, `serve_client`, `RoleClient` and `ServiceExt`, which
# `mcp::catalog` names; `server` gates `RoleServer`, `ServerHandler` and
# `service::RequestContext`, which `mcp::server` names; the two transports are the ones
# `mcp::catalog` builds a client on. None are default features, so without them the crate's
# own `mcp` feature cannot compile it -- it only ever built as part of a graph including
# `runtime`, whose `rmcp` requests the same set for everything.
rmcp = { workspace = true, optional = true, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
runtime-auth = { path = "../runtime-auth" }
runtime-query-engine = { path = "../runtime-query-engine" }
runtime-search = { path = "../runtime-search" }
runtime-request-context = { path = "../runtime-request-context" }
schemars.workspace = true
serde.workspace = true
secrecy.workspace = true
serde_json.workspace = true
snafu.workspace = true
spicepod = { path = "../spicepod" }
tools = { path = "../tools" }
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }
util = { path = "../util" }

[features]
default = []
# `tools/mcp` gates `tools::McpProxy` and `SpiceModelTool::as_mcp_proxy`, both of which
# `mcp::tool` names, so the crate's MCP code needs it as much as it needs `rmcp` itself.
mcp = ["dep:rmcp", "tools/mcp"]
openapi = ["dep:utoipa"]

[lints]
workspace = true
