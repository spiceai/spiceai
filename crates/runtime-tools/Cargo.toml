[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-tools"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow.workspace = true
arrow-json.workspace = true
arrow-schema.workspace = true
arrow_tools = { path = "../arrow_tools" }
app = { path = "../app" }
async-openai.workspace = true
async-trait.workspace = true
bytes = { workspace = true, optional = true }
cache = { path = "../cache" }
chrono.workspace = true
datafusion.workspace = true
fundu.workspace = true
futures.workspace = true
itertools.workspace = true
globset.workspace = true
http.workspace = true
# `client` gates `rmcp::service`, `serve_client`, `RoleClient` and `ClientServiceExt`,
# which `mcp::catalog` names; `server` gates `RoleServer`, `ServerHandler` and
# `service::RequestContext`, which `mcp::server` names; the child-process and
# HTTP client transports are the ones `mcp::catalog` builds a client on;
# `transport-streamable-http-server` is what the `Mcp-Param-*` header tests
# drive through `StreamableHttpService`. None are default features, so without
# them the crate's own `mcp` feature cannot compile it.
rmcp = { workspace = true, optional = true, features = [
    "client",
    "server",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# `mcp::http_client` implements rmcp's `StreamableHttpClient` over the same
# `reqwest` and `sse-stream` versions rmcp itself links.
reqwest = { workspace = true, optional = true }
runtime-auth = { path = "../runtime-auth" }
runtime-query-engine = { path = "../runtime-query-engine" }
runtime-search = { path = "../runtime-search" }
runtime-request-context = { path = "../runtime-request-context" }
schemars.workspace = true
serde.workspace = true
secrecy.workspace = true
serde_json.workspace = true
shell-words.workspace = true
snafu.workspace = true
spicepod = { path = "../spicepod" }
sse-stream = { version = "0.2.6", optional = true }
tools = { path = "../tools" }
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-futures.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }
util = { path = "../util" }

[features]
default = []
# `tools/mcp` gates `tools::McpProxy` and `SpiceModelTool::as_mcp_proxy`, both of which
# `mcp::tool` names, so the crate's MCP code needs it as much as it needs `rmcp` itself.
mcp = ["dep:bytes", "dep:reqwest", "dep:rmcp", "dep:sse-stream", "tools/mcp"]
openapi = ["dep:utoipa"]

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
http-body-util = "0.1"
tower.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
