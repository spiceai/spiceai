# This crate is a workspace member, but it requires the system libnfs library, so the
# compile-time gates pass `--exclude libnfs`. Build with: cargo build -p libnfs
[package]
name = "libnfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Safe Rust bindings to libnfs C library for NFS client operations"
license = "Apache-2.0"

[dependencies]
nix = { version = "0.30", features = ["fs"] }
snafu = "0.8.6"

[build-dependencies]
bindgen = "0.71.1"

[dev-dependencies]
static_assertions = "1"
