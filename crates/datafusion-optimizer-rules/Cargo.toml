[package]
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
name = "datafusion-optimizer-rules"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
arrow = { optional = true, workspace = true }
async-stream.workspace = true
async-trait.workspace = true
cache = { path = "../cache" }
chrono = { optional = true, workspace = true }
datafusion.workspace = true
datafusion-datasource = { optional = true, workspace = true }
datafusion-expr.workspace = true
datafusion-table-providers.workspace = true
duckdb = { optional = true, workspace = true }
futures.workspace = true
itertools = { optional = true, workspace = true }
object_store = { optional = true, workspace = true }
r2d2 = { optional = true, workspace = true }
snafu.workspace = true
tracing.workspace = true
url = { optional = true, workspace = true }


[features]
cluster = [
    "dep:arrow",
    "dep:chrono",
    "dep:itertools",
    "dep:datafusion-datasource",
    "dep:object_store",
    "dep:url",
]
duckdb = ["datafusion-table-providers/duckdb", "dep:duckdb", "dep:r2d2"]
