[package]
name = "accelerator-duckdb"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "DuckDB data accelerator: implements data-accelerator-api::DataAccelerator over a DuckDB table provider."

[dependencies]
data-accelerator-api = { path = "../../data-accelerator-api" }
app = { path = "../../app" }
data_components = { path = "../../data_components", features = ["duckdb"] }
runtime-acceleration = { path = "../../runtime-acceleration", features = ["duckdb"] }
runtime-checkpoint-api = { path = "../../runtime-checkpoint-api" }
runtime-checkpoint-duckdb = { path = "../../runtime-checkpoint-duckdb" }
runtime-datafusion = { path = "../../runtime-datafusion" }
runtime-parameters = { path = "../../runtime-parameters" }
runtime-table-partition = { path = "../../runtime-table-partition" }
async-trait.workspace = true
datafusion.workspace = true
linkme.workspace = true
paste.workspace = true
datafusion-table-providers = { workspace = true, features = ["duckdb"] }
arrow.workspace = true
arrow-schema.workspace = true
arrow_tools = { path = "../../arrow_tools" }
futures.workspace = true
spicepod = { path = "../../spicepod" }
tracing.workspace = true
byte-unit.workspace = true
cpu-budget = { path = "../../cpu-budget" }
duckdb.workspace = true
itertools.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

[dev-dependencies]
# Test-only, and deliberately dev-only: these sit in the `runtime` tier, so a normal
# dependency would be an upward edge. The cache-refresh tests live here because they
# need this crate's `create_table_provider`.
runtime-table = { path = "../../runtime-table" }
spice-table = { path = "../../spice-table" }
# Test-only: `duckdb_vector_udf_pushdown_matches_local` compares the local vector
# kernels against the SQL the DuckDB dialect renders for them, so it needs both
# implementations in one process. `runtime-datafusion-udfs` is shared-utility, so
# this is a downward edge either way.
runtime-datafusion-udfs = { path = "../../runtime-datafusion-udfs" }
insta.workspace = true
tempfile.workspace = true
runtime-acceleration = { path = "../../runtime-acceleration", features = ["duckdb", "test-support"] }
datafusion-table-providers = { workspace = true, features = ["duckdb"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
