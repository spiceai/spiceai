[package]
name = "accelerator-turso"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Turso data accelerator: implements data-accelerator-api::DataAccelerator over a Turso table provider."

[dependencies]
data-accelerator-api = { path = "../../data-accelerator-api" }
data_components = { path = "../../data_components", features = ["turso"] }
runtime-acceleration = { path = "../../runtime-acceleration", features = ["turso"] }
runtime-checkpoint-api = { path = "../../runtime-checkpoint-api" }
runtime-checkpoint-turso = { path = "../../runtime-checkpoint-turso" }
runtime-udfs-api = { path = "../../runtime-udfs-api" }
runtime-parameters = { path = "../../runtime-parameters" }
runtime-table-partition = { path = "../../runtime-table-partition" }
async-trait.workspace = true
datafusion.workspace = true
linkme.workspace = true
paste.workspace = true
datafusion-table-providers = { workspace = true, features = ["sqlite"] }
arrow.workspace = true
arrow-schema.workspace = true
arrow_tools = { path = "../../arrow_tools" }
futures.workspace = true
spicepod = { path = "../../spicepod" }
tracing.workspace = true
rusqlite.workspace = true
turso.workspace = true
tokio = { workspace = true, features = ["sync"] }
snafu.workspace = true

[dev-dependencies]
runtime-acceleration = { path = "../../runtime-acceleration", features = ["turso", "test-support"] }
datafusion-table-providers = { workspace = true, features = ["sqlite", "duckdb"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
