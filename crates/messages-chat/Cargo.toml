[package]
name = "messages-chat"
description = "Serves the Anthropic Messages API (`POST /v1/messages`) with any chat model: translates the request into a chat completion, and the completion, or its stream of chunks, back into a Message or its stream of events."
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-openai.workspace = true
async-trait.workspace = true
chat-api = { path = "../chat-api" }
futures.workspace = true
messages-api = { path = "../messages-api" }
rand.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "translation"
harness = false

[lints]
workspace = true
