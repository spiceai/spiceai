[package]
name = "huggingface-hub"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
description = "The Hugging Face Hub client every Spice.ai component reads models and datasets through"
# Integration tests are modules of `integration` (`tests/integration.rs`).
autotests = false

[dependencies]
bytes.workspace = true
chrono.workspace = true
cpu-budget = { path = "../cpu-budget" }
futures.workspace = true
hex.workspace = true
# `hf-xet` reconstructs a file the Hub stores in Xet from its chunks (lib name `xet`).
hf-xet = "1.7.0"
moka.workspace = true
object_store.workspace = true
parking_lot.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["stream"] }
runtime-async = { path = "../runtime-async" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tracing.workspace = true
url.workspace = true
util = { path = "../util", default-features = false }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[lints]
workspace = true
