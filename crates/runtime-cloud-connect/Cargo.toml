[package]
name = "runtime-cloud-connect"
description = "Outbound control-plane client for Spice Cloud Connect (adoption flow for standalone spiced)"
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
# ECDSA P-256 signing for the /renew current-key proof-of-possession. Must be
# the same crypto backend rcgen generates the keypair with (see the rcgen
# entry below), so the PKCS#8 we persist always round-trips.
aws-lc-rs = "1"
cloud-connect-crypto = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dirs = "6"
gethostname = { workspace = true }
# PEM → DER decoding for the renewal proof-of-possession signature (the
# private key and CSR are held as PEM; the signer takes raw DER bytes).
pem = { workspace = true }
prost = { workspace = true }
# `google.protobuf.Timestamp`, which every time-valued field on the wire uses.
prost-types = "0.14"
rand = { workspace = true }
# Client-side keypair + PKCS#10 CSR generation for the enrollment flow.
# Pin the aws_lc_rs backend (matching `crates/runtime`, which forces it via
# feature unification in the spiced build) so key generation uses the same
# backend in every build target; cert *parsing* / signing (x509-parser) is
# only pulled in for the integration test server.
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
# Out-of-band HTTPS enroll/renew against the cloud control plane.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-prost = "0.14"
tracing = { workspace = true }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# In-process HTTP mock for the cloud enroll/renew endpoints.
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
# `tokio_stream::wrappers::TcpListenerStream` requires the `net` feature.
# The workspace dependency only enables `sync`, so opt-in explicitly here
# for the integration tests.
tokio-stream = { workspace = true, features = ["net"] }
# The standalone-adoption e2e test stands up a real TLS control server that
# signs client CSRs, so it needs rcgen's CSR/CA parsing (x509-parser) plus a
# rustls crypto provider to install as the process default before the tonic
# server builds its `ServerConfig`.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { workspace = true }

[lints]
workspace = true
