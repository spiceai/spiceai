[package]
name = "runtime-cloud-connect"
description = "Outbound control-plane client for Spice Cloud Connect enrollment and control"
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
# ECDSA P-256 signing for the /renew current-key proof-of-possession. Must be
# the same crypto backend rcgen generates the keypair with (see the rcgen
# entry below), so the PKCS#8 we persist always round-trips.
aws-lc-rs = "1"
cloud-connect-crypto = { workspace = true }
base64 = { workspace = true }
# AEAD for the at-rest delivered-secrets cache (`secret_cache.rs`). The wire
# format's crypto lives in `cloud-connect-crypto`; this is a local file format
# with a local, non-rotating key, so it is deliberately not that path.
chacha20poly1305 = { workspace = true }
chrono = { workspace = true }
# OS randomness for the cache key and its nonces, matching how
# `cloud-connect-crypto` draws key material.
getrandom = { version = "0.3", features = ["std"] }
dirs = "6"
gethostname = { workspace = true }
http = { workspace = true }
# Advisory locks distinguish abandoned secret-bearing atomic-write temp files
# from live concurrent writers before reclamation.
fs4 = { workspace = true }
# PEM → DER decoding for the renewal proof-of-possession signature (the
# private key and CSR are held as PEM; the signer takes raw DER bytes).
pem = { workspace = true }
prost = { workspace = true }
# `google.protobuf.Timestamp`, which every time-valued field on the wire uses.
prost-types = "0.14"
rand = { workspace = true }
# Client-side keypair + PKCS#10 CSR generation for the enrollment flow.
# Pin the aws_lc_rs backend (matching `crates/runtime`, which forces it via
# feature unification in the spiced build) so key generation uses the same
# backend in every build target.
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs", "x509-parser"] }
# Out-of-band HTTPS enroll/renew against the cloud control plane.
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
spice-cloud-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-stream = { workspace = true }
tokio-util.workspace = true
tonic = { workspace = true }
tonic-prost = "0.14"
tracing = { workspace = true }
# Parse the stored client leaf before honoring existing-identity precedence;
# the leaf's public key must match the persisted private key.
x509-parser = { version = "0.18", features = ["verify-aws"] }
# Enrollment operation IDs (`Idempotency-Key`) for retry-safe enrollment.
uuid = { workspace = true, features = ["v4"] }
# Key material and decrypted secret values are held in `Zeroizing` so a freed
# buffer never leaves plaintext in the heap.
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
# Refuse symlink and special-file enrollment locks before privileged callers
# change permissions or wait for the advisory lock.
libc = "0.2"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
# In-process HTTP mock for the cloud enroll/renew endpoints.
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "test-util"] }
# `tokio_stream::wrappers::TcpListenerStream` requires the `net` feature.
# The workspace dependency only enables `sync`, so opt-in explicitly here
# for the integration tests.
tokio-stream = { workspace = true, features = ["net"] }
# The standalone-enrollment e2e test stands up a real TLS control server that
# signs client CSRs, so it needs rcgen's CSR/CA parsing (x509-parser) plus a
# rustls crypto provider to install as the process default before the tonic
# server builds its `ServerConfig`.
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = { workspace = true }
tokio-rustls = "0.26"

[lints]
workspace = true
