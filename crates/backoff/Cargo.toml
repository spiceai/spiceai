[package]
name = "backoff"
# Must stay semver-compatible with 0.4: the root `[patch.crates-io]` entry only
# applies to dependents whose `backoff` requirement this version satisfies.
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
description = "Retry with exponential backoff for Spice.ai"

[dependencies]
rand.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
# Dependents still request these crates.io `backoff` 0.4 features. The async
# retry API is always built, so both are no-ops.
futures = []
tokio = []

[lints]
workspace = true
