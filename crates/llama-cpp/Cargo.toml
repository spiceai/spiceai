[package]
description = "Safe bindings to llama.cpp, built from the spiceai/llama.cpp fork, for Spice's local GGUF engine"
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
links = "llama"
name = "llama-cpp"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
# One integration test binary: see docs/dev/integration_test_layout.md.
autotests = false

[dependencies]
llama-cpp-src = { git = "https://github.com/spiceai/llama.cpp", rev = "2663a92e6aaaac5efda40fdb5ca4e89e79c17673" } # branch: lukim/b11803-abort-throws (spiceai/llama.cpp#2 on #1: upstream release b11803, the Cargo packaging, and failed checks that throw while a model loads)
snafu.workspace = true
tracing.workspace = true

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2.63"
cmake = "0.1.58"

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
# The GPU backend llama.cpp is built with; without either, it runs on the CPU.
cuda = []
metal = []

[lints]
workspace = true
