[package]
name = "evaluate-chat"
description = "Answers System One evaluations (`POST /v1/evaluate`) with any chat model: builds the answer schema from the typed questions, prompts the model, validates its reply, and converts it into typed answers."
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-openai.workspace = true
async-trait.workspace = true
chat-api = { path = "../chat-api" }
evaluate-api = { path = "../evaluate-api" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
insta.workspace = true
tokio.workspace = true

[lints]
workspace = true
