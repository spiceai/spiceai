syntax = "proto3";
package spice.protobuf;

option java_multiple_files = true;
option java_package = "com.spiceai";
option java_outer_classname = "SpiceProto";

// Internal cluster gRPC service for scheduler-executor communication.
// This service is only exposed on the internal cluster port.
service ClusterService {
    // Get the app definition (Spicepod) from the scheduler.
    // Called by executors during initialization.
    rpc GetAppDefinition(GetAppDefinitionRequest) returns (GetAppDefinitionResponse);

    // Expand a secret value from the scheduler's secret store.
    // Called by executors when they need to resolve secrets.
    rpc ExpandSecret(ExpandSecretRequest) returns (ExpandSecretResponse);
}

// Executor service for scheduler-driven discovery.
// Exposed by executors so schedulers can query their registration information.
service ExecutorService {
    // Get the executor's registration information including task slots.
    // Called by schedulers during executor discovery.
    rpc DescribeExecutor(DescribeExecutorRequest) returns (DescribeExecutorResponse);
    // Poll the executor for task status updates and basic health.
    rpc PollExecutor(PollExecutorRequest) returns (PollExecutorResponse);
}

// Executor lease service for task slot reservation.
// Exposed by executors so schedulers can reserve capacity before dispatching tasks.
service ExecutorLeaseService {
    // Reserve task slots on this executor. Idempotent via request_id.
    rpc ReserveSlots(ReserveSlotsRequest) returns (ReserveSlotsResponse);
    // Renew an existing lease to extend its TTL.
    rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
    // Release a lease, returning slots to the available pool.
    rpc ReleaseLease(ReleaseLeaseRequest) returns (ReleaseLeaseResponse);
    // Get the executor's current capacity (total and available slots).
    rpc GetCapacity(GetCapacityRequest) returns (GetCapacityResponse);
}

// Request message for DescribeExecutor RPC.
message DescribeExecutorRequest {}

// Response message for DescribeExecutor RPC.
message DescribeExecutorResponse {
    // Unique identifier for this executor.
    string executor_id = 1;
    // Hostname or IP address where the executor is reachable.
    string host = 2;
    // Port for the Arrow Flight service.
    uint32 port = 3;
    // Port for the gRPC service (used for push-based scheduling).
    uint32 grpc_port = 4;
    // Number of task slots available for concurrent task execution.
    uint32 task_slots = 5;
}

// Request message for PollExecutor RPC.
message PollExecutorRequest {
    // Scheduler ID requesting status updates.
    string scheduler_id = 1;
    // Maximum number of task statuses to return. Zero means no limit.
    uint32 max_statuses = 2;
}

// Response message for PollExecutor RPC.
message PollExecutorResponse {
    // Executor ID that produced the response.
    string executor_id = 1;
    // True if the executor is terminating.
    bool terminating = 2;
    // Milliseconds since UNIX epoch for this snapshot.
    uint64 timestamp_millis = 3;
    // Serialized TaskStatus protobufs (ballista_core::serde::protobuf::TaskStatus).
    repeated bytes task_statuses = 4;
}

// Request message for GetAppDefinition RPC.
message GetAppDefinitionRequest {
    string executor_id = 1;
}

// Response message for GetAppDefinition RPC.
message GetAppDefinitionResponse {
    // JSON-serialized app definition.
    string app_json = 1;
}

// Request message for ExpandSecret RPC.
message ExpandSecretRequest {
    string executor_id = 1;
    string key = 2;
}

// Response message for ExpandSecret RPC.
message ExpandSecretResponse {
    string key = 1;
    string value = 2;
}

// Request message for ReserveSlots RPC.
message ReserveSlotsRequest {
    // Unique identifier for this request (for idempotency).
    string request_id = 1;
    // Scheduler ID requesting the slots.
    string scheduler_id = 2;
    // Number of slots to reserve.
    uint32 slots = 3;
    // Requested TTL in milliseconds. Server may grant a different TTL.
    uint64 ttl_ms = 4;
}

// Response message for ReserveSlots RPC.
message ReserveSlotsResponse {
    // Whether the reservation was successful.
    bool granted = 1;
    // Lease ID if granted (empty if not granted).
    string lease_id = 2;
    // Actual TTL granted in milliseconds.
    uint64 ttl_ms = 3;
    // Number of slots granted (may be less than requested).
    uint32 slots_granted = 4;
    // Reason for rejection if not granted.
    string rejection_reason = 5;
}

// Request message for RenewLease RPC.
message RenewLeaseRequest {
    // Lease ID to renew.
    string lease_id = 1;
    // Scheduler ID (must match original lease holder).
    string scheduler_id = 2;
    // Requested TTL extension in milliseconds.
    uint64 ttl_ms = 3;
}

// Response message for RenewLease RPC.
message RenewLeaseResponse {
    // Whether the renewal was successful.
    bool renewed = 1;
    // New TTL in milliseconds (from now).
    uint64 ttl_ms = 2;
    // Reason for rejection if not renewed.
    string rejection_reason = 3;
}

// Request message for ReleaseLease RPC.
message ReleaseLeaseRequest {
    // Lease ID to release.
    string lease_id = 1;
    // Scheduler ID (must match original lease holder).
    string scheduler_id = 2;
}

// Response message for ReleaseLease RPC.
message ReleaseLeaseResponse {
    // Whether the release was successful.
    bool released = 1;
    // Number of slots returned to the pool.
    uint32 slots_released = 2;
}

// Request message for GetCapacity RPC.
message GetCapacityRequest {}

// Response message for GetCapacity RPC.
message GetCapacityResponse {
    // Total task slots on this executor.
    uint32 total_slots = 1;
    // Currently available (unreserved) slots.
    uint32 available_slots = 2;
    // Number of slots currently reserved via leases.
    uint32 reserved_slots = 3;
    // Number of slots currently in use (executing tasks).
    uint32 in_use_slots = 4;
}

// Physical plan
message SchemaCastScanExecNode {
    bytes schema = 1;
}

message BytesProcessedExecNode {}
