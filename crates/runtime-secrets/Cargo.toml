[package]
description = "Secrets management utilities for the Spice.ai runtime"
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-secrets"
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
dotenvy.workspace = true
futures.workspace = true
indexmap.workspace = true
logos.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
runtime-parameter-spec = { path = "../runtime-parameter-spec" }
secrecy.workspace = true
serde_json.workspace = true
snafu.workspace = true
spicepod = { path = "../spicepod" }
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

# Optional dependencies for feature-gated secret stores
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-credential-bridge = { path = "../aws-sdk-credential-bridge", optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }
# Azure KeyVault. Pinned to the 0.31.x / 0.10.x line so azure_core stays in
# lockstep with the version already used by the cosmosdb connector
# (data_components) — mixing azure_core majors blows up the dependency tree
# and, more importantly, produces two incompatible `TokenCredential` traits.
azure_core = { version = "0.31.0", optional = true }
azure_identity = { version = "0.31.0", optional = true }
azure_security_keyvault_secrets = { version = "0.10.0", optional = true }
# `url` is used by `resolve_vault_url` (Azure KeyVault) and `build_base_url`
# (HashiCorp Vault) to enforce a well-formed URL with a host. Pulled in only
# under either of those features via the feature block below.
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "time",
    "test-util",
] }

[features]
aws-secrets-manager = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-credential-bridge",
    "dep:aws-sdk-secretsmanager",
    "dep:aws-sdk-sts",
]
azure-keyvault = [
    "dep:azure_core",
    "dep:azure_identity",
    "dep:azure_security_keyvault_secrets",
    "dep:url",
]
# HashiCorp Vault: pure-reqwest implementation, no SDK. `url` is shared
# with the `azure-keyvault` feature for address validation.
hashicorp_vault = ["dep:url"]
# `azure-keyvault` is deliberately *not* in `default`: it pulls the Azure SDK
# (azure_core / azure_identity / azure_security_keyvault_secrets) into every
# crate that depends on `runtime-secrets` without `default-features = false`,
# which we don't want for crates like `runtime-acceleration` that only touch
# the core `Secrets` type. Opted in via the matching `runtime/azure-keyvault`
# and `spiced/azure-keyvault` features.
default = ["keyring-secret-store", "aws-secrets-manager", "hashicorp_vault"]
keyring-secret-store = ["dep:keyring"]
