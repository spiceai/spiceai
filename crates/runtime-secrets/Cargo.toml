[package]
name = "runtime-secrets"
description = "Secrets management utilities for the Spice.ai runtime"
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
# The startup preflight walks the loaded `App`'s component params.
app = { path = "../app" }
async-trait.workspace = true
base64.workspace = true
dotenv.workspace = true
indexmap.workspace = true
logos.workspace = true
# Guards the delivered-secrets map. Held only across a map read/clone, never an
# `.await`, so a sync lock is correct in the async store.
parking_lot.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde_json.workspace = true
snafu.workspace = true
spicepod = { path = "../spicepod" }
runtime-parameters-typed = { path = "../runtime-parameters-typed" }
runtime-parameters-derive = { path = "../runtime-parameters-derive" }
tracing.workspace = true
tokio = { workspace = true, features = ["sync"] }
percent-encoding.workspace = true
futures.workspace = true
# Delivered secret values are held in `Zeroizing` so a freed buffer never leaves
# plaintext credentials in the heap.
zeroize = "1.8"

# Optional dependencies for feature-gated secret stores
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-credential-bridge = { path = "../aws-sdk-credential-bridge", optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-sts = { workspace = true, optional = true }
# Azure KeyVault. On the azure_core 1.x / keyvault 1.0.1+ line (RUSTSEC-2026-0438),
# in lockstep with azure-key-vault-signer. The cosmosdb connector stays on
# azure_core 0.31 until it moves to azure_data_cosmos 1.x; no azure_core type
# (e.g. `TokenCredential`) crosses between the two.
azure_core = { version = "1.1.0", optional = true }
azure_identity = { version = "1.0.0", optional = true }
azure_security_keyvault_secrets = { version = "1.0.1", optional = true }
# `url` is used by `resolve_vault_url` (Azure KeyVault) and `build_base_url`
# (HashiCorp Vault) to enforce a well-formed URL with a host, and by the
# `aws_secrets_manager` `endpoint_url` param. Pulled in only under those
# features via the feature block below.
url = { workspace = true, optional = true }
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
], optional = true }

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[features]
aws-secrets-manager = [
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-credential-bridge",
    "dep:aws-sdk-secretsmanager",
    "dep:aws-sdk-sts",
    "dep:url",
]
azure-keyvault = [
    "dep:azure_core",
    "dep:azure_identity",
    "dep:azure_security_keyvault_secrets",
    "dep:url",
]
# HashiCorp Vault: pure-reqwest implementation, no SDK. `url` is shared
# with the `azure-keyvault` feature for address validation.
hashicorp_vault = ["dep:url"]
# `azure-keyvault` is deliberately *not* in `default`: it pulls the Azure SDK
# (azure_core / azure_identity / azure_security_keyvault_secrets) into every
# crate that depends on `runtime-secrets` without `default-features = false`,
# which we don't want for crates like `runtime-acceleration` that only touch
# the core `Secrets` type. Opted in via the matching `runtime/azure-keyvault`
# and `spiced/azure-keyvault` features.
default = ["keyring-secret-store", "aws-secrets-manager", "hashicorp_vault"]
keyring-secret-store = ["dep:keyring"]

[lints]
workspace = true
