[package]
name = "http-body-limit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded reads of remote data: HTTP bodies and compressed files held to a memory budget and refused past a compression ratio"

[dependencies]
# The decoders `reqwest` itself uses (through tower-http), so a body decoded here
# decodes exactly as one `reqwest` decompresses transparently.
async-compression = { version = "0.4.42", features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
bytes.workspace = true
# `MemoryReservation`, so a body that carries data is charged to the query memory pool.
datafusion-common.workspace = true
datafusion-execution.workspace = true
# The charset decoding `reqwest`'s `Response::text` does, so `text` decodes exactly as it.
encoding_rs.workspace = true
futures.workspace = true
http.workspace = true
mime = "0.3.17"
reqwest.workspace = true
snafu.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true, features = ["io"] }

[dev-dependencies]
brotli = "8.0.2"
flate2 = "1.1"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
zstd = "0.13.5"

[lints]
workspace = true
