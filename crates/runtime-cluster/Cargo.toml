[package]
description = "Cluster partition management, executor registry, and write-through for the Spice runtime"
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license-file.workspace = true
name = "runtime-cluster"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
app = { path = "../app" }
arrow = { workspace = true }
arrow-flight = { workspace = true, features = ["flight-sql-experimental"] }
arrow-ipc.workspace = true
arrow-schema = { workspace = true, features = ["serde"] }
arrow_tools = { path = "../arrow_tools" }
async-stream.workspace = true
async-trait.workspace = true
bytes.workspace = true
data_components = { path = "../data_components" }
datafusion.workspace = true
datafusion-ddl = { path = "../datafusion-ddl" }
datafusion-expr = { workspace = true }
datafusion-proto = { workspace = true }
flight_client = { path = "../flight_client" }
fundu.workspace = true
futures.workspace = true
object_store.workspace = true
object_store_occ = { path = "../object_store_occ" }
parking_lot.workspace = true
serde_json.workspace = true
runtime-datafusion = { path = "../runtime-datafusion" }
runtime-proto = { path = "../runtime-proto" }
runtime-request-context = { path = "../runtime-request-context" }
runtime-table-partition = { path = "../runtime-table-partition" }
serde = { workspace = true, features = ["derive"] }
snafu.workspace = true
spicepod = { path = "../spicepod" }
tokio = { workspace = true, features = ["full"] }
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
util = { path = "../util", default-features = false }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
