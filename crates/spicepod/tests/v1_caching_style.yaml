version: v1
kind: Spicepod
name: v1_caching_style
runtime:
  results_cache:
    enabled: true
    item_ttl: 30s
    cache_max_size: 64MiB
    caching_policy: tiny_lfu
    hashing_algorithm: blake3
    cache_key_type: sql
    # Accepted for compatibility; ignored at runtime (Spice sharded cache).
    # `engine: pingora` no longer selects Pingora — remove or leave unchanged.
    engine: pingora
    max_stale_while_revalidate: 60s
