    "db_connection_pool/snowflake",
    "data_components/snowflake",
]
spark = ["data_components/spark_connect", "connector-databricks/spark"]
# Registers the Cayenne catalog connector. Intended for benchmarking only;
# deliberately excluded from the default feature set.
spicebench = []
sqlite = [
    "dep:tokio-rusqlite",
    "dep:runtime-checkpoint-sqlite",
    "db_connection_pool/sqlite",
    "data_components/sqlite",
    "dep:rusqlite",
    "runtime-acceleration/sqlite",
]
turso = [
    "dep:tokio-rusqlite",
    "db_connection_pool/sqlite",
    "data_components/sqlite",
    "data_components/turso",
    "dep:rusqlite",
    "runtime-acceleration/turso",
]
vortex = []
[target.'cfg(not(windows))'.dev-dependencies]
# The engine itself is not built on Windows, so neither is the test code that
# exercises it or force-links its registration.
accelerator-cayenne = { path = "../accelerators/accelerator-cayenne" }

[target.'cfg(not(windows))'.dependencies]
cayenne = { path = "../cayenne", features = ["turso", "partition-table-provider"] }
vortex.workspace = true
vortex-datafusion.workspace = true

[[bench]]
harness = false
name = "prepared_statement"

[[bench]]
harness = false
name = "flatten_json_properties"

[[bench]]
harness = false
name = "cdc_cayenne_inline"

[[bench]]
harness = false
name = "cdc_delete_burst"

[lints]
workspace = true

# Spice accelerators vs out-of-Spice standalone DuckDB/SQLite — exact SQL results.
# Separate binary so we do not rebuild the full integration suite.
[[test]]
name = "result_correctness"
path = "tests/result_correctness.rs"
required-features = ["duckdb", "sqlite"]
