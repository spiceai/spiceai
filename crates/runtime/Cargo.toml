    "data_components/elasticsearch",
    "dep:elasticsearch",
    "dep:duration-parse",
    "search/elasticsearch",
    "runtime-search/elasticsearch",
]
duckdb = [
    "dep:duckdb",
    "dep:runtime-checkpoint-duckdb",
    "db_connection_pool/duckdb",
    "data_components/duckdb",
    "datafusion-optimizer-rules/duckdb",
    "runtime-acceleration/duckdb",
    "search/duckdb",
    "runtime-search/duckdb",
]
# Test-only marker: the DynamoDB connector now lives in `connector-dynamodb` (a
# dev-dependency, registered unconditionally by `do_register_test_connectors`).
# This gates the `tests/dynamodb` integration suite; the AWS SDK it uses directly is
# a dev-dependency, so the shipped runtime lib carries no DynamoDB code or driver
# (the driver-free `spice_sys/dynamodb` checkpoint sidecar is always compiled).
dynamodb = []
extended_tests = []
flightsql = ["data_components/flightsql"]
ftp = ["runtime-object-store/ftp"]
http-functions = ["runtime-datafusion-udfs/http-functions"]
rate-control = []
wasm-functions = ["runtime-datafusion-udfs/wasm-functions"]
wasm-functions-compile = ["runtime-datafusion-udfs/wasm-functions-compile"]
iceberg-write = []
imap = []
kafka = ["data_components/kafka", "runtime-table/kafka"]
keyring-secret-store = ["runtime-secrets/keyring-secret-store"]
mcp = ["dep:rmcp", "runtime-tools/mcp", "tools/mcp"]
metal = ["llms/metal"]
distributed = ["llms/distributed", "models"]
models = [
    "bedrock",
    "mcp",
    "runtime-datafusion-udfs/models",
    "search/llms",
    "llms/local_llm",
    "llms/local_embed",
]
mongodb = [] # marker: gates the driver-free spice_sys/mongodb resume-token checkpoint; connector lives in connector-mongodb
mssql = ["dep:tiberius", "data_components/mssql"]
mssql-kerberos-unix = ["data_components/mssql-kerberos-unix"]
mysql = ["dep:mysql_async", "db_connection_pool/mysql", "data_components/mysql"]
nfs = ["runtime-object-store/nfs"]
odbc = []
openapi = [
    "dep:utoipa-swagger-ui",
    "dep:utoipa",
    "mcp",
    "runtime-acceleration/openapi",
    "runtime-table/openapi",
    "runtime-api-types/openapi",
    "runtime-search/openapi",
    "runtime-tools/openapi",
]
oracle = ["data_components/oracle"]
pingora = ["cache/pingora"]
postgres = [
    "db_connection_pool/postgres",
    "data_components/postgres",
    "datafusion-table-providers/postgres",
]
# Selects the PostgreSQL-accelerator integration tests. The engine itself is a crate
# (`accelerator-postgres`), linked by `spiced` in a shipped build and by the dev-dependency
# below for these tests, so this feature no longer pulls anything into the library.
postgres-accel = ["postgres"]

s3_vectors = [
    "data_components/s3_vectors",
    "dep:s3_vectors",
    "search/s3_vectors",
    "runtime-search/s3_vectors",
]
