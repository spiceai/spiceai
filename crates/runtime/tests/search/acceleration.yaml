# acceleration configurations for search tests. Each key represents a configured acceleration
# to use in `.views[].acceleration` or `.datasets[].acceleration`.

no_acceleration:
  enabled: false

arrow:
  enabled: true
  engine: arrow

cayenne:
  enabled: true
  engine: cayenne
  mode: file

duckdb_file:
  enabled: true
  engine: duckdb
  mode: file
## Cayenne Does not support FixedSizeArrays yet
