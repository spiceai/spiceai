version: v1
kind: Spicepod
name: aws_sdk_verify

datasets:
  # Public S3
  - from: s3://spice-datasets-gjezag77s0hu/nyc_taxi_2023/
    name: public_taxi
    params:
      file_format: parquet
      s3_region: us-east-1

  # Private S3
  - from: s3://spiceai-ci-seoul-glue/parquet_taxi_trips_2023/
    name: private_taxi
    params:
      s3_auth: iam_role
      file_format: parquet
      s3_region: ap-northeast-2

  # Delta Lake
  - from: delta_lake:s3://databricks-storage-7474659262026926/unity-catalog/7474659262026926/__unitystorage/catalogs/52011987-760e-434c-bf4b-ccaa244f3b4d/tables/1de3894c-edb1-4e45-b2ff-07bbfae7c55e
    name: region_delta
    params:
      delta_lake_aws_region: us-west-2

  # Databricks Delta Lake
  - from: databricks:spiceai_sandbox.tpch.region
    name: region_databricks_delta
    params:
      mode: delta_lake
      databricks_endpoint: dbc-ae204137-04e0.cloud.databricks.com
      databricks_client_id: ${secrets:DATABRICKS_OIDC_CLIENT_ID}
      databricks_token_audience: ${secrets:DATABRICKS_OIDC_AUDIENCE}
      databricks_aws_region: us-west-2

  # Iceberg
  - from: iceberg:https://glue.ap-northeast-2.amazonaws.com/iceberg/v1/catalogs/165984978348/namespaces/testdb/tables/iceberg_table_001
    name: iceberg_table
    params:
      iceberg_s3_region: ap-northeast-2

  # Glue
  - from: glue:testdb.iceberg_table_001
    name: iceberg_table_glue
    params:
      glue_region: ap-northeast-2
  