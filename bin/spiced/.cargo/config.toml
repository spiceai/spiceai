# x86_64 optimization with AVX2, FMA, BMI, etc. Portable across all AWS x86_64 C6/C7/C8 instances.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+avx2,+fma,+bmi1,+bmi2,+lzcnt,+popcnt"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=native"]

# arm64/aarch64 optimization. Requires NEON + FP16 (FEAT_FP16 / FEAT_FHM).
# FP16 is needed for gemm-f16 compilation (https://github.com/sarah-quinones/gemm/issues/31).
# lld is needed to avoid R_AARCH64_CALL26 relocation overflow on large debug binaries.
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "target-feature=+neon,+fp16,+fhm", "-Clink-arg=-fuse-ld=lld"]

# Pinned to the oldest Apple Silicon generation rather than `native`. macOS CI builds
# share one sccache bucket, and sccache keys a compile on the literal
# `-C target-cpu=native`, not on the CPU it resolves to. An object that a newer chip
# compiled with `bf16` or `i8mm` instructions then reaches an M1-class host as a cache
# hit, and a build script or `spiced` linked from it dies with SIGILL. A binary built
# natively on a newer host also dies on the M1-class runners the E2E jobs run it on.
# `apple-m1` is rustc's default for this target, so this matches the release build,
# and it keeps NEON, FP16 and FHM for gemm-f16.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]
